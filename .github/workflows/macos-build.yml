# Build and publish all macOS recipes to cvcpkg.org.
#
# Since macOS has no persistent builder service (GitHub-hosted runners
# are ephemeral), this workflow builds the full recipe DAG locally in
# parallel shards and publishes each package directly to the server.
#
# Triggered manually via workflow_dispatch, or by the populate-server
# workflow when 'macos' is in the platforms list.
#
# Required repo secrets:
#   CVCPKG_PUBLISHER_TOKEN  — a publisher-role token for cvcpkg.org

name: macOS Package Build

# NOTE (cy-pca): workflow_dispatch-only. These fleet-ops workflows were added
# while Actions was disabled during the relocation, so GitHub never indexed
# them and they were undispatchable (absent from `gh workflow list` / the
# Actions UI). A no-op edit on the default branch re-registers a workflow;
# this comment is that nudge. If one goes missing again, touch it here.
on:
  workflow_dispatch:
    inputs:
      config:
        description: "Build config"
        required: true
        default: "release"
        type: choice
        options:
          - release
          - debug
      link:
        description: "Link mode"
        required: true
        default: "shared"
        type: choice
        options:
          - shared
          - static
      server:
        description: "cvcpkg server URL"
        required: true
        default: "https://cvcpkg.org"
        type: string
      shards:
        description: "Number of parallel shards"
        required: true
        default: "4"
        type: choice
        options:
          - "2"
          - "3"
          - "4"
          - "5"
          - "6"
      recipes:
        description: "Recipe names to build (space/comma separated; default: every recipe). Set to publish just a few — a one-off fix, or filling a single gap without a multi-hour full-DAG run."
        required: false
        default: ""
        type: string
      ref:
        description: "Git ref to build recipes from (default: prod)"
        required: false
        default: "prod"
        type: string
      runner:
        description: >-
          Runner image. macos-latest is Apple Silicon (arm64); macos-15-intel
          is the LAST x86_64 macOS image GitHub offers and disappears in
          August 2027.
        required: false
        default: "macos-latest"
        type: choice
        options:
          - "macos-latest"
          - "macos-15-intel"
  workflow_call:
    inputs:
      config:
        required: true
        type: string
      link:
        required: true
        type: string
      server:
        required: true
        type: string
      shards:
        required: false
        type: string
        default: "4"
      recipes:
        required: false
        type: string
        default: ""
      ref:
        required: false
        type: string
        default: "prod"
      runner:
        required: false
        type: string
        default: "macos-latest"

permissions:
  contents: read

jobs:
  # Generate the shard matrix dynamically based on inputs.shards
  setup:
    name: Setup matrix
    runs-on: ubuntu-latest
    outputs:
      shards: ${{ steps.gen.outputs.shards }}
    steps:
      - id: gen
        run: |
          # A targeted `recipes` build is small — one shard, no sharding math.
          # Sharding a two-recipe build across four runners means three of them
          # queue for a macOS runner only to find nothing in their slice.
          if [ -n "${{ inputs.recipes }}" ]; then
            echo 'shards=[0]' >> "$GITHUB_OUTPUT"
          else
            TOTAL="${{ inputs.shards || '4' }}"
            # Generate JSON array [0, 1, ..., TOTAL-1]
            SHARDS=$(python3 -c "import json; print(json.dumps(list(range(int('$TOTAL')))))")
            echo "shards=$SHARDS" >> "$GITHUB_OUTPUT"
          fi

  build-shard:
    name: macOS ${{ inputs.runner || 'macos-latest' }} shard ${{ matrix.shard }}/${{ inputs.shards || '4' }} (${{ inputs.config }}/${{ inputs.link }})
    needs: setup
    # Parameterised so the same, already-proven pipeline serves both macOS
    # architectures — they differ only in the runner label, since pack-all
    # detects the host arch. macos-latest is arm64; macos-15-intel is x86_64
    # and is the last Intel image GitHub offers (retired August 2027).
    runs-on: ${{ inputs.runner || 'macos-latest' }}
    timeout-minutes: 300
    strategy:
      fail-fast: false
      matrix:
        shard: ${{ fromJSON(needs.setup.outputs.shards) }}

    steps:
      - uses: actions/checkout@v5
        with:
          # Defaults to prod (production recipe set); override to validate a
          # branch/master on macOS before promoting it to prod.
          ref: ${{ inputs.ref || 'prod' }}

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # The runner image ships Homebrew (/opt/homebrew on Apple Silicon,
      # /usr/local on Intel) with cmake, pkgconf, autoconf, automake, libtool,
      # perl, gettext, llvm, gcc and more installed and on PATH. Strip it for
      # every later step so no recipe build can find and use any of it; "Check
      # build tools come from cvcpkg" fails if Homebrew is still reachable.
      # The one survivor is the image's bash, which the build scripts run under
      # (numpy, h5py and pillow use bash 4's readarray; /bin/bash is 3.2). It is
      # kept through a symlink in a directory of its own, never through
      # Homebrew's bin directory.
      - name: Remove Homebrew from the environment
        run: |
          set -euo pipefail
          brew_dir() {
            case "$1" in
              /opt/homebrew|/opt/homebrew/*) return 0 ;;
              /usr/local/Homebrew|/usr/local/Homebrew/*|/usr/local/Cellar|/usr/local/Cellar/*) return 0 ;;
              /usr/local/opt|/usr/local/opt/*|/usr/local/Caskroom|/usr/local/Caskroom/*) return 0 ;;
              # Intel: Homebrew's links fill /usr/local/bin and /usr/local/sbin.
              /usr/local/bin|/usr/local/sbin) [ -d /usr/local/Homebrew ] ;;
              *) return 1 ;;
            esac
          }
          clean=""
          bash_now=$(command -v bash)
          if brew_dir "$(dirname "$bash_now")"; then
            mkdir -p "$RUNNER_TEMP/runner-bash"
            ln -sf "$bash_now" "$RUNNER_TEMP/runner-bash/bash"
            clean="$RUNNER_TEMP/runner-bash"
            echo "keeping the image's bash $("$bash_now" -c 'echo $BASH_VERSION'): $RUNNER_TEMP/runner-bash/bash -> $bash_now"
          fi
          set -f; IFS=:
          for d in $PATH; do
            [ -n "$d" ] || continue
            if brew_dir "$d"; then echo "dropping from PATH: $d"; continue; fi
            clean="${clean:+$clean:}$d"
          done
          unset IFS; set +f
          echo "PATH=$clean" >> "$GITHUB_ENV"

      - name: Install cvcpkg
        run: |
          pip3 install --break-system-packages '.[publish]'
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          echo "$(python3 -m site --user-base)/bin" >> "$GITHUB_PATH"

      # Build tools from cvcpkg: cmake (3.31.7, the version Boost 1.86's
      # configs expect), ninja, pkg-config (pkgconf), meson, m4, flex and bison.
      # They serve what recipes use without a depends.build entry: cmake/ninja
      # almost everywhere, and the host_tools of assimp, imagemagick, bison,
      # libtool and postgresql-*, which install-deps does not install. A tool a
      # recipe declares in depends.build comes from its bundle in the prefix,
      # which is ahead of this tree on PATH. autoconf, automake and libtool are
      # only ever used that way on macOS (nfft3, swig), so they are not here.
      #
      # The tools are copied into a tree holding only them: CMake searches its
      # own install prefix (the parent of share/cmake-X.Y) for packages, and the
      # prefix cvcpkg installs it into also holds the curl and openssl headers,
      # libraries and pkg-config files a recipe build would otherwise find
      # instead of its declared deps. bin/cmake loads libcurl (and through it
      # libssl/libcrypto) from @executable_path/../lib, so those dylibs come
      # along, under their versioned install names only, which find_library
      # never matches. bison has the absolute paths of its build-time pkgdatadir
      # and m4 compiled in; BISON_PKGDATADIR and M4 point it at the tree.
      - name: Install build tools (cvcpkg)
        run: |
          set -euo pipefail
          prefix="$RUNNER_TEMP/cvcpkg-tools-prefix"
          tree="$RUNNER_TEMP/cvcpkg-tools"
          cvcpkg install cmake ninja pkg-config meson m4 flex bison \
            --prefix "$prefix" --platform macos --config release --link shared
          mkdir -p "$tree/bin" "$tree/lib" "$tree/share"
          exes="cmake ctest cpack ninja pkgconf m4 flex bison"
          for exe in $exes meson; do
            cp "$prefix/bin/$exe" "$tree/bin/"
          done
          ln -s pkgconf "$tree/bin/pkg-config"
          ln -s flex "$tree/bin/flex++"
          cp -R "$prefix"/share/cmake-* "$prefix/share/bison" "$tree/share/"
          cp -R "$prefix/lib/meson" "$tree/lib/"
          # The @rpath dylibs the executables load, and the ones those load.
          todo=$(for exe in $exes; do echo "$tree/bin/$exe"; done)
          while [ -n "$todo" ]; do
            next=""
            for f in $todo; do
              for lib in $(otool -L "$f" | sed -n 's|^[[:space:]]*@rpath/\([^ ]*\) .*|\1|p'); do
                if [ ! -e "$tree/lib/$lib" ]; then
                  cp "$prefix/lib/$lib" "$tree/lib/$lib"
                  next="$next $tree/lib/$lib"
                fi
              done
            done
            todo="$next"
          done
          ls "$tree/lib"
          echo "$tree/bin" >> "$GITHUB_PATH"
          echo "M4=$tree/bin/m4" >> "$GITHUB_ENV"
          echo "BISON_PKGDATADIR=$tree/share/bison" >> "$GITHUB_ENV"

      - name: Check build tools come from cvcpkg
        run: |
          set -euo pipefail
          want="$RUNNER_TEMP/cvcpkg-tools/bin"
          rc=0
          for t in cmake ctest cpack ninja pkg-config meson m4 flex bison; do
            got=$(command -v "$t" || true)
            case "$got" in
              "$want"/*) echo "$t -> $got" ;;
              *) echo "::error::$t resolves to '${got:-nothing}', not cvcpkg's ($want)"; rc=1 ;;
            esac
          done
          set -f; IFS=:
          for d in $PATH; do
            case "$d" in
              /opt/homebrew*|/usr/local/Homebrew*|/usr/local/Cellar*|/usr/local/opt*|/usr/local/Caskroom*)
                echo "::error::Homebrew directory on PATH: $d"; rc=1 ;;
              /usr/local/bin|/usr/local/sbin)
                if [ -d /usr/local/Homebrew ]; then echo "::error::Homebrew directory on PATH: $d"; rc=1; fi ;;
            esac
          done
          unset IFS; set +f
          if command -v brew >/dev/null 2>&1; then
            echo "::error::brew is on PATH ($(command -v brew)); nothing may build with Homebrew"
            rc=1
          fi
          [ "$rc" = 0 ] || exit 1
          cmake --version | sed -n 1p
          echo "ninja $(ninja --version)"
          echo "pkg-config $(pkg-config --version)"
          echo "meson $(meson --version)"
          m4 --version | sed -n 1p
          flex --version
          bison --version | sed -n 1p
          # Still not from cvcpkg: what these resolve to.
          for t in bash perl make python3; do echo "$t -> $(command -v "$t" || echo none)"; done

      - name: Build shard ${{ matrix.shard }} (pack-all)
        env:
          CVCPKG_SERVER_URL: ${{ inputs.server }}
          CVCPKG_TOKEN: ${{ secrets.CVCPKG_PUBLISHER_TOKEN }}
        run: |
          set -euo pipefail
          SHARDS="${{ inputs.shards || '4' }}"
          mkdir -p "${{ github.workspace }}/prefix"
          mkdir -p "${{ github.workspace }}/dist"

          RECIPES="$(echo '${{ inputs.recipes }}' | tr ',' ' ' | xargs || true)"

          if [ -n "$RECIPES" ]; then
            # Targeted build, mirroring windows-build.yml. NOTE this loops over
            # `cvcpkg pack` rather than passing names to `pack-all`:
            # `pack-all` takes OPTIONS ONLY and rejects positional recipe names
            # ("Error: Got unexpected extra argument"). Only `pack` accepts them.
            for r in $RECIPES; do
              echo "::group::install-deps $r (macos)"
              # pack does NOT resolve deps -- it builds against whatever is
              # already in --prefix. Install the closure first, or the recipe's
              # build.sh cannot find what it needs. Host tools not in the closure
              # come from the cvcpkg tools tree installed above.
              cvcpkg install-deps "recipes/$r" \
                --platform macos \
                --config "${{ inputs.config }}" \
                --link "${{ inputs.link }}" \
                --prefix "${{ github.workspace }}/prefix" \
                --recipes-dir recipes
              echo "::endgroup::"
              echo "::group::pack $r (macos)"
              cvcpkg pack "recipes/$r" \
                --platform macos \
                --config "${{ inputs.config }}" \
                --link "${{ inputs.link }}" \
                --prefix "${{ github.workspace }}/prefix" \
                --output-dir "${{ github.workspace }}/dist" \
                --recipes-dir recipes \
                --server "$CVCPKG_SERVER_URL" \
                --token "$CVCPKG_TOKEN"
              echo "::endgroup::"
            done
          else
            cvcpkg pack-all \
              --keep-going \
              --platform macos \
              --config "${{ inputs.config }}" \
              --link "${{ inputs.link }}" \
              --prefix "${{ github.workspace }}/prefix" \
              --output-dir "${{ github.workspace }}/dist" \
              --recipes-dir recipes \
              --shard "${{ matrix.shard }}/${SHARDS}" \
              --server-cache "$CVCPKG_SERVER_URL" \
              --server-cache-token "$CVCPKG_TOKEN" \
              --server-cache-push
          fi

      - name: List built packages
        if: always()
        run: |
          echo "Built packages (shard ${{ matrix.shard }}):"
          ls -lh "${{ github.workspace }}/dist/" 2>/dev/null || echo "(no packages)"
          echo ""
          COUNT=$(ls "${{ github.workspace }}/dist/"*.tar.gz 2>/dev/null | wc -l || echo 0)
          echo "Count: $COUNT archives"

      - name: Publish to cvcpkg.org
        if: always()
        env:
          CVCPKG_SERVER_URL: ${{ inputs.server }}
          CVCPKG_TOKEN: ${{ secrets.CVCPKG_PUBLISHER_TOKEN }}
        run: |
          set -euo pipefail
          DIST="${{ github.workspace }}/dist"

          # cvcpkg pack writes a .tar.gz on macOS (create_archive: unix -> .tar.gz,
          # windows -> .zip; .tar.zst only exists in the remote-builder rewrap +
          # server storage, never the local pack output). Globbing *.tar.zst here
          # matched nothing, so this guard silently skipped publishing after a
          # successful pack (exit 0). Same class of bug as the windows .zip fix (#509).
          ARCHIVES=($(ls "$DIST"/*.tar.gz 2>/dev/null || true))
          if [ ${#ARCHIVES[@]} -eq 0 ]; then
            echo "::warning::No archives found in dist/ — nothing to publish"
            exit 0
          fi

          echo "Publishing ${#ARCHIVES[@]} packages to $CVCPKG_SERVER_URL"
          cvcpkg publish --all \
            --server "$CVCPKG_SERVER_URL" \
            --token "$CVCPKG_TOKEN" \
            --output-dir "$DIST" \
            --platform macos \
            --config "${{ inputs.config }}" \
            --link "${{ inputs.link }}"

      # DO NOT upload dist/ — that is the whole macOS package set, per shard,
      # and the step above has already published every one of those archives to
      # cvcpkg.org. The artifact was a duplicate of packages that live on the
      # server, and it was the single largest consumer of this repo's Actions
      # storage: ~1.9 GB per run out of 4.1 GB live, against 189 GB written
      # historically. That is a real, billed cost for bytes nobody fetches.
      #
      # The server is the artifact store. If a run fails, re-run it: the inputs
      # are deterministic and the build is reproducible. What is kept here is a
      # manifest — names and sizes only, kilobytes — which is what you actually
      # want when asking "did this shard build what I expected?".
      - name: Record a manifest (names and sizes only, never the archives)
        if: always()
        run: |
          set -uo pipefail
          mkdir -p manifest
          ls -l dist/ > "manifest/dist-listing.txt" 2>&1 || echo "no dist/" > "manifest/dist-listing.txt"
          du -sh dist/ >> "manifest/dist-listing.txt" 2>&1 || true
          wc -c < "manifest/dist-listing.txt"

      - name: Upload manifest
        if: always()
        uses: actions/upload-artifact@v4
        with:
          # Runner is part of the name: populate-server can invoke this workflow
          # twice in one run (arm64 + intel), and upload-artifact fails on a
          # duplicate name.
          name: macos-manifest-${{ inputs.runner || 'macos-latest' }}-shard${{ matrix.shard }}-${{ inputs.config }}-${{ inputs.link }}
          path: manifest/
          if-no-files-found: warn
          retention-days: 3
