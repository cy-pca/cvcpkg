name: deploy-prod

# Deploys cvcpkg-server to the primary (cvcpkg.org) and a local read-only
# mirror (pkg.tx.wtf).  A self-hosted runner (label: cvcpkg-prod) picks up the
# job: it deploys the mirror locally and SSHes to the primary over the internal
# network.
#
# Host/target coordinates come from repository variables
# (vars.PROD_SERVER_SSH, vars.BSD_BUILDER_SSH_HOSTS, vars.WINDOWS_BUILDER_SSH)
# so they are not hard-coded in this public workflow.  The mirror pulls the
# upstream catalog hourly inside the backend container; downloads are proxied
# on demand and cached to the local archives volume.

# Relocated repo (cy-pca/cvcpkg): the prod deploy plane still lives on
# transfix/libcvc-deps.  Auto-deploy on push to prod is disabled here so this
# repo does not double-deploy to cvcpkg.org/pkg.tx.wtf; manual dispatch only.
on:
  workflow_dispatch:
    inputs:
      sha:
        description: "Commit SHA to deploy (defaults to prod HEAD)"
        required: false
        type: string

concurrency:
  group: deploy-prod
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy to cvcpkg.org + pkg.tx.wtf
    runs-on: [self-hosted, Linux, cvcpkg-prod]
    timeout-minutes: 30
    outputs:
      sha: ${{ steps.target.outputs.sha }}

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Resolve target SHA
        id: target
        run: |
          if [[ -n "${{ inputs.sha }}" ]]; then
            sha="${{ inputs.sha }}"
          else
            sha="${{ github.sha }}"
          fi
          if ! [[ "$sha" =~ ^[0-9a-f]{7,40}$ ]]; then
            echo "::error::invalid sha: $sha"
            exit 1
          fi
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          echo "Deploying sha: $sha"

      # ── Deploy to cvcpkg.org (primary) via SSH ──────────────
      - name: Deploy to cvcpkg.org
        run: |
          set -euo pipefail
          SHA="${{ steps.target.outputs.sha }}"
          SHORT_SHA="${SHA:0:7}"
          RELEASE_TAG="prod-${SHORT_SHA}"
          REMOTE="${{ vars.PROD_SERVER_SSH }}"
          DEPLOY_DIR="/home/tfx/libcvc-deps"
          CVCPKG_DIR="${DEPLOY_DIR}"
          SSH="ssh -o StrictHostKeyChecking=accept-new"

          echo "=== Deploying to cvcpkg.org (primary) ==="

          # ── Pre-deploy disk cleanup ──
          echo "Checking disk space on primary..."

          # Reclaim leaked cvcpkg build trees.  This used to be a one-liner
          #     find /tmp -maxdepth 1 -name 'cvcpkg-*' -type d -mmin +60 ...
          # pasted into five places, and it deleted IN-FLIGHT builds: '-maxdepth
          # 1 -type d -mmin' tests the top directory's OWN mtime, which stops
          # advancing as soon as a build tree has created build/ and install/,
          # so a working tree looked stale after an hour no matter how busy it
          # was.  On 2026-08-04 it deleted /tmp/cvcpkg-haiku-image-b6wd0qrn 90
          # minutes into a build.  scripts/reap-stale-build-dirs.sh asks for
          # signs of life instead (heartbeat, owning pid, newest mtime anywhere
          # in the tree) and is now the single implementation behind every one of
          # those call sites.
          #
          # `sh -s --` streams it from stdin, so the remote host needs nothing
          # installed and picks up changes on the first deploy that carries
          # them -- these cleanup steps run BEFORE the hosts are updated, so a
          # reaper shipped as part of cvcpkg would always be one deploy stale.
          $SSH "$REMOTE" sudo -n sh -s -- -a 60 -d 1 /tmp \
            < "${{ github.workspace }}/scripts/reap-stale-build-dirs.sh" || true

          $SSH "$REMOTE" bash -s <<'CLEANUP'
          set -euo pipefail
          echo "Before cleanup: $(df -h / | tail -1)"

          # Reclaim space WITHOUT touching anything a concurrent build is
          # using.  Two hazards, both hit in production:
          #
          #   --volumes: prune removes stopped containers first, so a stack
          #   left down by a failed deploy makes cvcpkg-prod-data "unused" and
          #   the next deploy deletes it.  That volume holds
          #   /app/data/hmac_key, which keys every cvctok_ and every browser
          #   session and CSRF token.  Losing it invalidates every credential
          #   in the fleet silently, because the server restarts healthy with a
          #   fresh key.
          #
          #   Unfiltered `system prune -af`: this host also runs cvcpkg CI, and
          #   a global prune deletes build cache out from under whatever else
          #   is building.  On 2026-09-11 a CI run started 80s before the
          #   deploy; the prune landed at 04:17:52 and the mirror build died at
          #   04:23:43 with `failed to solve: lease ...: not found`.  The
          #   primary had already deployed, so a green-looking deploy left the
          #   mirror a version behind.
          #
          # An age filter keeps the reclaim while making in-flight work
          # untouchable: nothing a build started in the last day can reference
          # is eligible.
          sudo docker image prune -af --filter "until=24h" 2>/dev/null || true
          sudo docker builder prune -f --filter "until=24h" 2>/dev/null || true
          sudo docker container prune -f --filter "until=24h" 2>/dev/null || true

          # Clean old database backups (keep last 5)
          BKDIR="/home/tfx/libcvc-deps/backups"
          if [ -d "$BKDIR" ]; then
            ls -1t "$BKDIR"/pre-deploy-*.sql.gz 2>/dev/null | tail -n +6 | xargs rm -f 2>/dev/null || true
          fi

          # Clean old git objects
          if [ -d /home/tfx/libcvc-deps/.git ]; then
            cd /home/tfx/libcvc-deps && git gc --auto 2>/dev/null || true
          fi

          # Clean apt caches
          sudo apt-get clean 2>/dev/null || true

          # Clean old logs
          sudo journalctl --vacuum-size=50M 2>/dev/null || true

          echo "After cleanup:  $(df -h / | tail -1)"
          CLEANUP

          # Migrate .env.production from old tools/cvcpkg/ location before rsync
          $SSH "$REMOTE" "
            cd ${DEPLOY_DIR}
            if [[ ! -f .env.production && -f tools/cvcpkg/.env.production ]]; then
              echo 'Migrating .env.production from tools/cvcpkg/ to repo root...'
              mv tools/cvcpkg/.env.production .env.production
            fi
            rm -rf tools/cvcpkg tools 2>/dev/null || true
          "

          # Sync checkout to remote host
          echo "Syncing checkout to ${REMOTE}:${DEPLOY_DIR}..."
          rsync -a --delete \
            --exclude '.env.production' \
            --exclude 'backups/' \
            -e "$SSH" \
            "${GITHUB_WORKSPACE}/" "${REMOTE}:${DEPLOY_DIR}/"

          # Write deploy script to remote host (avoids bash -s stdin
          # issues where docker compose commands steal heredoc lines)
          $SSH "$REMOTE" "cat > /tmp/cvcpkg-deploy.sh" << 'DEPLOY_SCRIPT'
          #!/bin/bash
          set -euo pipefail
          RELEASE_TAG="$1"; SHORT_SHA="$2"; DEPLOY_DIR="$3"; CVCPKG_DIR="$4"
          cd "$CVCPKG_DIR"

          # Bundle recipes
          rm -rf src/cvcpkg/recipes
          cp -r "${DEPLOY_DIR}/recipes" src/cvcpkg/recipes

          # Migration: move .env.production from old tools/cvcpkg/ location
          if [[ ! -f .env.production && -f tools/cvcpkg/.env.production ]]; then
            echo "Migrating .env.production from tools/cvcpkg/ to repo root..."
            mv tools/cvcpkg/.env.production .env.production
            rm -rf tools/cvcpkg tools
          fi

          if [[ ! -f .env.production ]]; then
            echo "::error::.env.production not found at ${CVCPKG_DIR}/"
            exit 1
          fi

          if docker compose version &>/dev/null; then
            DC="docker compose"
          elif command -v docker-compose &>/dev/null; then
            DC="docker-compose"
          else
            echo "::error::docker compose not available"
            exit 1
          fi

          COMPOSE="$DC -f docker-compose.production.yml --env-file .env.production"
          export CVCPKG_RELEASE="$RELEASE_TAG"

          # Backup database
          if $COMPOSE exec -T postgres pg_isready -U cvcpkg >/dev/null 2>&1; then
            mkdir -p backups
            $COMPOSE exec -T postgres pg_dump -U cvcpkg cvcpkg \
              | gzip > "backups/pre-deploy-${SHORT_SHA}.sql.gz"
            echo "Database backup created"
          else
            echo "Postgres not running; skipping backup"
          fi

          # Build and deploy
          echo "Building cvcpkg-server:${RELEASE_TAG}..."
          # Build on a dedicated docker-container builder, never the daemon's
          # embedded one.  On 2026-09-11 the default builder on catx-03 got a
          # cache record pointing at a lease that no longer existed, and every
          # build died with `failed to solve: lease ...: not found` -- including
          # `--no-cache`, so the builder could not start ANY build.  Nothing
          # short of resetting the daemon's buildkit state fixes that, which
          # means bouncing every container on the host.
          #
          # A docker-container builder keeps its buildkit state in its own
          # container, so the same corruption is cleared with `docker buildx rm`
          # and costs nothing else.  Created on demand, so a host that has never
          # deployed gets one automatically.
          docker buildx inspect cvcpkg-deploy >/dev/null 2>&1 \
            || docker buildx create --name cvcpkg-deploy --driver docker-container
          export BUILDX_BUILDER=cvcpkg-deploy

          $COMPOSE build --build-arg "CVCPKG_RELEASE=${RELEASE_TAG}" backend
          echo "Ensuring postgres is up..."
          $COMPOSE up -d postgres
          for i in $(seq 1 30); do
            if $COMPOSE exec -T postgres pg_isready -U cvcpkg >/dev/null 2>&1; then
              break
            fi
            sleep 1
          done

          # Migrations
          echo "Running database migrations..."
          if ! $COMPOSE exec -T postgres psql -U cvcpkg -tAc \
               "SELECT 1 FROM information_schema.tables WHERE table_name='alembic_version'" \
               2>/dev/null | grep -q 1; then
            echo "Stamping database at revision 002 (pre-Alembic baseline)..."
            $COMPOSE run --rm -T backend cvcpkg-server migrate stamp 002
          fi
          $COMPOSE run --rm -T backend cvcpkg-server migrate upgrade head
          echo "Migrations complete."

          echo "Restarting backend..."
          $COMPOSE up -d --force-recreate backend

          # Health check (use docker exec so it works regardless of bind address)
          echo "Waiting for health (timeout 120s)..."
          deadline=$(( $(date +%s) + 120 ))
          while (( $(date +%s) < deadline )); do
            if $COMPOSE exec -T backend curl -fsS --max-time 3 http://localhost:8420/healthz 2>/dev/null | grep -q '"ok"'; then
              echo "cvcpkg.org backend healthy!"
              $COMPOSE exec -T backend curl -s http://localhost:8420/healthz | python3 -c "
          import json, sys
          d = json.load(sys.stdin)
          print(f'cvcpkg.org deployed: v{d[\"version\"]}, {d[\"packages_count\"]} packages')
          "
              exit 0
            fi
            sleep 3
          done

          echo "::error::cvcpkg.org backend failed health check within 120s"
          $COMPOSE logs --tail=80 backend || true
          exit 1
          DEPLOY_SCRIPT

          # Execute the deploy script on the remote host
          $SSH "$REMOTE" "bash /tmp/cvcpkg-deploy.sh \
            '${RELEASE_TAG}' '${SHORT_SHA}' '${DEPLOY_DIR}' '${CVCPKG_DIR}'"

      # ── Deploy to pkg.tx.wtf (local mirror) ────────────────
      - name: Deploy to pkg.tx.wtf
        run: |
          set -euo pipefail
          SHA="${{ steps.target.outputs.sha }}"
          SHORT_SHA="${SHA:0:7}"
          RELEASE_TAG="prod-${SHORT_SHA}"
          DEPLOY_DIR="/home/tfx/libcvc-deps"
          CVCPKG_DIR="${DEPLOY_DIR}"

          # The mirror runs on THIS runner host (catx-03).  The cy-pca runner is
          # the isolated 'github-runner' user, which cannot write the tfx-owned
          # deploy dir and cannot drive tfx's docker stack.  So deploy the mirror
          # the same way as the primary -- over ssh AS tfx -- but to localhost.
          # rsync reads the workspace as github-runner and writes the dir as tfx
          # over ssh, sidestepping the cross-user permission split entirely.
          # (github-runner's deploy key is authorised for tfx@localhost; it also
          # already has NOPASSWD sudo, so this grants it no new effective power.)
          REMOTE="tfx@localhost"
          SSH="ssh -o StrictHostKeyChecking=accept-new"

          echo "=== Deploying to pkg.tx.wtf (local mirror, via ${REMOTE}) ==="

          # Migrate .env.production from old tools/cvcpkg/ location before rsync
          $SSH "$REMOTE" "
            cd ${DEPLOY_DIR}
            if [[ ! -f .env.production && -f tools/cvcpkg/.env.production ]]; then
              echo 'Migrating .env.production from tools/cvcpkg/ to repo root...'
              mv tools/cvcpkg/.env.production .env.production
            fi
            rm -rf tools/cvcpkg tools 2>/dev/null || true
          "

          echo "Syncing checkout to ${REMOTE}:${DEPLOY_DIR}..."
          rsync -a --delete \
            --exclude '.env.production' \
            --exclude 'backups/' \
            -e "$SSH" \
            "${GITHUB_WORKSPACE}/" "${REMOTE}:${DEPLOY_DIR}/"

          # Write the deploy script on the mirror host and run it (avoids
          # docker-compose-over-stdin heredoc issues; same pattern as the primary).
          $SSH "$REMOTE" "cat > /tmp/cvcpkg-mirror-deploy.sh" << 'DEPLOY_SCRIPT'
          #!/bin/bash
          set -euo pipefail
          RELEASE_TAG="$1"; SHORT_SHA="$2"; DEPLOY_DIR="$3"; CVCPKG_DIR="$4"
          cd "$CVCPKG_DIR"

          rm -rf src/cvcpkg/recipes
          cp -r "${DEPLOY_DIR}/recipes" src/cvcpkg/recipes

          if [[ ! -f .env.production ]]; then
            echo "::error::.env.production not found at ${CVCPKG_DIR}/"
            exit 1
          fi

          if docker compose version &>/dev/null; then
            DC="docker compose"
          elif command -v docker-compose &>/dev/null; then
            DC="docker-compose"
          else
            echo "::error::docker compose not available"
            exit 1
          fi

          COMPOSE="$DC -f docker-compose.production.yml --env-file .env.production"
          export CVCPKG_RELEASE="$RELEASE_TAG"

          if $COMPOSE exec -T postgres pg_isready -U cvcpkg >/dev/null 2>&1; then
            mkdir -p backups
            $COMPOSE exec -T postgres pg_dump -U cvcpkg cvcpkg \
              | gzip > "backups/pre-deploy-${SHORT_SHA}.sql.gz"
            echo "Database backup created"
          else
            echo "Postgres not running; skipping backup"
          fi

          echo "Building cvcpkg-server:${RELEASE_TAG}..."
          # Dedicated docker-container builder, never the daemon's embedded one
          # (a corrupted embedded buildkit lease once killed every build on this
          # host); its state is isolated and cheap to reset with `docker buildx rm`.
          docker buildx inspect cvcpkg-deploy >/dev/null 2>&1 \
            || docker buildx create --name cvcpkg-deploy --driver docker-container
          export BUILDX_BUILDER=cvcpkg-deploy

          $COMPOSE build --build-arg "CVCPKG_RELEASE=${RELEASE_TAG}" backend
          echo "Ensuring postgres is up..."
          $COMPOSE up -d postgres
          for i in $(seq 1 30); do
            if $COMPOSE exec -T postgres pg_isready -U cvcpkg >/dev/null 2>&1; then
              break
            fi
            sleep 1
          done

          echo "Running database migrations..."
          if ! $COMPOSE exec -T postgres psql -U cvcpkg -tAc \
               "SELECT 1 FROM information_schema.tables WHERE table_name='alembic_version'" \
               2>/dev/null | grep -q 1; then
            echo "Stamping database at revision 002 (pre-Alembic baseline)..."
            $COMPOSE run --rm -T backend cvcpkg-server migrate stamp 002
          fi
          $COMPOSE run --rm -T backend cvcpkg-server migrate upgrade head
          echo "Migrations complete."

          echo "Restarting backend..."
          $COMPOSE up -d --force-recreate backend

          echo "Waiting for health (timeout 120s)..."
          deadline=$(( $(date +%s) + 120 ))
          while (( $(date +%s) < deadline )); do
            if $COMPOSE exec -T backend curl -fsS --max-time 3 http://localhost:8420/healthz 2>/dev/null | grep -q '"ok"'; then
              echo "pkg.tx.wtf backend healthy!"
              $COMPOSE exec -T backend curl -s http://localhost:8420/healthz | python3 -c "
          import json, sys
          d = json.load(sys.stdin)
          print(f'pkg.tx.wtf deployed: v{d[\"version\"]}, {d[\"packages_count\"]} packages')
          "
              exit 0
            fi
            sleep 3
          done

          echo "::error::pkg.tx.wtf backend failed health check within 120s"
          $COMPOSE logs --tail=80 backend || true
          exit 1
          DEPLOY_SCRIPT

          $SSH "$REMOTE" "bash /tmp/cvcpkg-mirror-deploy.sh \
            '${RELEASE_TAG}' '${SHORT_SHA}' '${DEPLOY_DIR}' '${CVCPKG_DIR}'"

      # ── Push recipes to the primary server DB ─────────────────
      # The deploy above bundles recipes into the backend image, but
      # the DB-backed /v1/recipes/* store (used by builders to fetch
      # recipes at build time) is not refreshed automatically.  Push
      # every recipe from the checkout so builders always see the
      # deployed revision.
      - name: Push recipes to cvcpkg.org
        env:
          CVCPKG_TOKEN: ${{ secrets.CVCPKG_PUBLISHER_TOKEN }}
        run: |
          set -euo pipefail
          export CVCPKG_SERVER_URL=https://cvcpkg.org
          if [[ -z "${CVCPKG_TOKEN:-}" ]]; then
            echo "::warning::CVCPKG_PUBLISHER_TOKEN not set — skipping recipe push"
            exit 0
          fi
          python3 -m pip install --quiet --user . || true
          # Prefer the freshly-checked-out package script over any installed copy.
          CVCPKG="python3 -m cvcpkg"
          ok=0
          fail=0
          for d in recipes/*/; do
            name=$(basename "$d")
            [[ "$name" == "_common" ]] && continue
            [[ -f "$d/recipe.yaml" ]] || continue
            if $CVCPKG recipe push "$name" >/dev/null 2>&1; then
              ok=$((ok+1))
            else
              echo "::warning::recipe push failed: $name"
              fail=$((fail+1))
            fi
          done
          echo "Recipes: $ok ok, $fail failed"


  # ── Notify builders to self-update ──────────────────────────────
  # Relocated repo (cy-pca/cvcpkg): the legacy per-host SSH update jobs
  # (BSD / linux-matrix / windows / cuda, run on star-00 and the builder
  # hosts) are replaced by the server's designed self-update path -- the same
  # one deploy-dev uses.  POST /v1/admin/update-builders sends every CONNECTED
  # builder a `builder.update` websocket message; each one `git pull`s its
  # local checkout, pip-installs the new cvcpkg and restarts.  No inbound SSH
  # to the fleet is needed, so this runs on the cvcpkg-prod runner (catx-03),
  # which cannot reach the LAN builders directly anyway.
  #
  # Reaches the builders currently connected to the server -- the set that
  # matters for a deploy; report-fleet below names any platform gone dark.
  # One-time prerequisite: each builder's checkout must track cy-pca/cvcpkg for
  # its `git pull` to fetch this repo's code (see the relocation runbook).
  notify-builders:
    name: Notify builders to self-update
    needs: deploy
    continue-on-error: true
    runs-on: [self-hosted, Linux, cvcpkg-prod]
    timeout-minutes: 5
    steps:
      - name: POST /v1/admin/update-builders
        env:
          CVCPKG_ADMIN_TOKEN: ${{ secrets.CVCPKG_ADMIN_TOKEN }}
        run: |
          set -uo pipefail
          SERVER="${{ vars.CVCPKG_SERVER_URL }}"
          [ -n "$SERVER" ] || SERVER="https://cvcpkg.org"
          if [ -z "${CVCPKG_ADMIN_TOKEN:-}" ]; then
            echo "::warning::CVCPKG_ADMIN_TOKEN unset -- no builder was notified"
            exit 0
          fi
          echo "Notifying connected builders to self-update via ${SERVER} ..."
          curl -fsS -X POST "${SERVER}/v1/admin/update-builders" \
            -H "Authorization: Bearer ${CVCPKG_ADMIN_TOKEN}"
          echo

  report-fleet:
    name: Fleet report
    needs:
      - deploy
      - notify-builders
    if: always()
    continue-on-error: true
    runs-on: [self-hosted, Linux, cvcpkg-prod]
    timeout-minutes: 5

    steps:
      - name: Report the builder fleet
        run: |
          set -uo pipefail
          SERVER_URL="https://cvcpkg.org"

          if ! curl -fsS --max-time 20 "$SERVER_URL/v1/builders" -o builders.json; then
            echo "::warning::could not reach $SERVER_URL to report the fleet"
            exit 0
          fi

          python3 - builders.json <<'PY' || echo "::warning::could not summarise the fleet"
          import json, sys

          with open(sys.argv[1]) as fh:
              builders = json.load(fh)["builders"]

          offline = []
          print(f"{'status':8} {'name':32} {'serves':26} last heartbeat")
          for b in sorted(builders, key=lambda x: (x["status"] != "offline", x["name"])):
              caps = b.get("capabilities") or {}
              cross = ",".join(p["platform"] for p in caps.get("cross_platforms", []))
              serves = b["platform"] + (" (+" + cross + ")" if cross else "")
              print(f"{b['status']:8} {b['name']:32} {serves:26} {b['last_heartbeat']}")
              if b["status"] == "offline":
                  offline.append(f"{b['name']} [{serves}]")

          # A platform with no online builder is the actionable case: jobs for
          # it will be staged and then never claimed, which surfaces much later
          # as an unexplained timeout in whatever PR happens to need it.
          serving = {}
          for b in builders:
              caps = b.get("capabilities") or {}
              targets = {b["platform"]} | {p["platform"] for p in caps.get("cross_platforms", [])}
              for t in targets:
                  serving.setdefault(t, []).append(b["status"] == "online")

          dark = sorted(t for t, states in serving.items() if not any(states))
          if dark:
              print("::warning::platforms with NO online builder: " + ", ".join(dark))
          if offline:
              print("::warning::offline builders: " + ", ".join(offline))
          if not dark and not offline:
              print("all registered builders are online")
          PY
