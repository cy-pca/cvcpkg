# Build self-contained cvcpkg executables for Linux, macOS, Windows,
# the BSDs (FreeBSD, OpenBSD, NetBSD), and Haiku.
#
# Produces single-file binaries via PyInstaller that embed the Python
# runtime and all dependencies — no system Python required.
#
# Triggered alongside the regular PyPI publish on cvcpkg-v* tags,
# or manually via workflow_dispatch.
#
# Artifacts are uploaded to the GitHub Release as:
#   cvcpkg-linux-x86_64
#   cvcpkg-macos-arm64
#   cvcpkg-windows-x86_64.exe
#   cvcpkg-freebsd-x86_64
#   cvcpkg-openbsd-x86_64
#   cvcpkg-netbsd-x86_64
#   cvcpkg-haiku-x86_64

name: Build cvcpkg standalone

on:
  push:
    tags:
      - 'cvcpkg-v[0-9]+.*'
  workflow_dispatch:
    inputs:
      upload_release:
        description: 'Attach binaries to the matching GitHub Release (if one exists).'
        required: false
        type: boolean
        default: false

permissions:
  contents: write   # needed for gh-release uploads

env:
  # One PyInstaller for every column, so all six binaries are built by the same
  # version. NetBSD cannot use the PyPI release (no 'netbsd' in the bootloader
  # platform tables), so it builds this exact tag from source with
  # recipes/pyinstaller-cp313/netbsd-platform-tables.patch applied.
  PYINSTALLER_VERSION: '6.21.0'

concurrency:
  group: cvcpkg-standalone-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build (${{ matrix.os }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: linux-x86_64
            # Build on the OLDEST supported glibc (22.04 = glibc 2.35), not
            # ubuntu-latest (2.39): this binary is distributed via install.sh and
            # must run on the self-hosted build fleet + user machines, most of
            # which are glibc 2.35. A 2.39-linked binary fails to load there with
            # "GLIBC_2.38 not found".
            runner: ubuntu-22.04
            artifact: cvcpkg-linux-x86_64
          - os: macos-arm64
            runner: macos-latest
            artifact: cvcpkg-macos-arm64
          - os: windows-x86_64
            runner: windows-latest
            artifact: cvcpkg-windows-x86_64.exe

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install cvcpkg + PyInstaller
        working-directory: .
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller==${{ env.PYINSTALLER_VERSION }}
          # [remote,signing,validate]: a standalone binary is a fixed closure,
          # so httpx, cryptography and jsonschema must be in the build env to
          # be bundled at all. jsonschema comes via the [validate] extra — it
          # is pinned there below the Rust rewrite (see pyproject.toml). Do not
          # install it explicitly: an unbounded `pip install jsonschema`
          # resolves to >=4.18 and drags rpds-py/cargo in, which does not
          # build on the BSD VMs.
          pip install '.[remote,signing,validate]'

      - name: Build standalone binary
        shell: bash
        working-directory: .
        run: |
          # Build from packaging/cvcpkg.spec — the single source of truth for
          # what goes into the binary. It reads ./recipes directly, bundles the
          # schemas, and copies cvcpkg's .dist-info metadata. Do NOT reintroduce
          # an inline flag list here: the previous one had silently drifted from
          # the spec and produced a binary that could not be built at all.
          pyinstaller --clean --noconfirm packaging/cvcpkg.spec

      - name: Verify binary runs
        shell: bash
        working-directory: .
        run: |
          if [[ "${{ matrix.os }}" == windows-* ]]; then
            BIN="$PWD/dist/cvcpkg.exe"
          else
            chmod +x ./dist/cvcpkg
            BIN="$PWD/dist/cvcpkg"
          fi
          "$BIN" --version
          # --version alone proves nothing about the BUNDLED DATA. Validate a
          # bundled recipe from a directory with no ./recipes, so the recipes,
          # the schemas and the metadata all have to come out of sys._MEIPASS —
          # a dropped data file is a red build here, not a traceback on a
          # customer's airgapped box.
          cd "$RUNNER_TEMP"
          "$BIN" validate recipes/zlib

      - name: Rename artifact
        shell: bash
        working-directory: .
        run: |
          if [[ "${{ matrix.os }}" == windows-* ]]; then
            mv dist/cvcpkg.exe "dist/${{ matrix.artifact }}"
          else
            mv dist/cvcpkg "dist/${{ matrix.artifact }}"
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: dist/${{ matrix.artifact }}
          retention-days: 1

  # ─────────────────── BSD builds via SSH ──────────────────────
  # Relocated repo (cy-pca/cvcpkg): the BSD cross-build SSHes from the transfix
  # 'cvcpkg-builder' host to internal BSD machines — infra that does not exist
  # in cy-pca.  Gated off by default; set repo variable ENABLE_BSD_BUILDS=true
  # once a cy-pca builder with BSD SSH access is provisioned.
  build-bsd:
    if: vars.ENABLE_BSD_BUILDS == 'true'
    name: Build (${{ matrix.os }})
    runs-on: ["self-hosted", "Linux", "X64", "cvcpkg-builder"]
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: freebsd-x86_64
            python: python3.11
            artifact: cvcpkg-freebsd-x86_64
          - os: openbsd-x86_64
            python: python3.12
            artifact: cvcpkg-openbsd-x86_64
          - os: netbsd-x86_64
            python: python3.13
            artifact: cvcpkg-netbsd-x86_64

    env:
      SSH_OPTS: '-o StrictHostKeyChecking=accept-new -o ConnectTimeout=30 -o BatchMode=yes'

    steps:
      - uses: actions/checkout@v5

      - name: Resolve BSD VM IP
        id: vm
        shell: bash
        run: |
          PYTHON="${{ matrix.python }}"

          resolve_vm_ip() {
            local vm_name="$1" fallback="$2"
            if command -v incus >/dev/null 2>&1; then
              local ip
              ip=$(incus list "$vm_name" --format csv -c 4 2>/dev/null \
                   | grep -oE '10\.66\.77\.[0-9]+' | head -1)
              if [ -n "$ip" ]; then echo "$ip"; return; fi
            fi
            echo "$fallback"
          }

          # cvcpkg builds run as root on these VMs, and libtool's OpenBSD
          # finish_cmds re-run ldconfig with the job's own -L directories.
          # That rewrites /var/run/ld.so.hints, and when it drops
          # /usr/local/lib every package installed there stops resolving --
          # including python's own libpython, which dies before main():
          #
          #   ld.so: python3.12: can't load library 'libpython3.12.so.0.0'
          #
          # The hints are rebuilt from these same directories at boot (see
          # /etc/rc), so re-merging them is a restore, not a policy change.
          # `-m` merges rather than replaces, so this discards nothing and is
          # safe to run unconditionally on every build.
          repair_openbsd_hints() {
            case "${{ matrix.os }}" in
              openbsd*)
                ssh ${SSH_OPTS} -o ConnectTimeout=5 "root@$1" \
                  "ldconfig -m /usr/local/lib /usr/X11R6/lib" >/dev/null 2>&1 || true
                ;;
            esac
          }

          # A builder that answers ssh but cannot run its own interpreter is
          # useless to us, and answering the port was all the old check tested
          # -- so a VM in that state never failed over and silently cost the
          # release its binary.  Probe the interpreter, not just the port.
          vm_is_usable() {
            [ -n "$1" ] || return 1
            ssh ${SSH_OPTS} -o ConnectTimeout=5 "root@$1" true >/dev/null 2>&1 || return 1
            repair_openbsd_hints "$1"
            ssh ${SSH_OPTS} -o ConnectTimeout=10 "root@$1" \
              "${PYTHON} -c 'import sys'" >/dev/null 2>&1
          }
          # VM names + fallback IPs come from repo variables so they are not
          # hard-coded in this public workflow.  Each var holds "primary
          # secondary"; resolve_vm_ip prefers the live incus IP by VM name and
          # falls back to the listed IP.
          case "${{ matrix.os }}" in
            freebsd*) VMS="${{ vars.FREEBSD_BUILDER_VMS }}"; IPS="${{ vars.FREEBSD_BUILDER_IPS }}" ;;
            openbsd*) VMS="${{ vars.OPENBSD_BUILDER_VMS }}"; IPS="${{ vars.OPENBSD_BUILDER_IPS }}" ;;
            netbsd*)  VMS="${{ vars.NETBSD_BUILDER_VMS }}";  IPS="${{ vars.NETBSD_BUILDER_IPS }}" ;;
            *)        VMS=""; IPS="" ;;
          esac
          read -r VM1 VM2 <<< "$VMS"
          read -r IP1 IP2 <<< "$IPS"
          HOST=$(resolve_vm_ip "$VM1" "$IP1")
          FALLBACK=$(resolve_vm_ip "$VM2" "$IP2")
          if ! vm_is_usable "$HOST"; then
            if vm_is_usable "$FALLBACK"; then
              echo "::warning::Primary VM $HOST failed a ${PYTHON} health check, falling back to $FALLBACK"
              HOST="$FALLBACK"
            else
              # Fail loudly.  Releases attach with fail_on_unmatched_files,
              # so a builder that quietly produces nothing yields a release
              # that is simply missing this platform.
              echo "::error::No usable ${{ matrix.os }} builder: neither $HOST nor $FALLBACK can run ${PYTHON}"
              exit 1
            fi
          fi
          echo "host=$HOST" >> "$GITHUB_OUTPUT"
          echo "Selected ${{ matrix.os }} VM: $HOST"

      - name: Sync repo to BSD VM
        shell: bash
        run: |
          set -euo pipefail
          VM="root@${{ steps.vm.outputs.host }}"
          case "${{ matrix.os }}" in
            openbsd*) BASE_DIR="/usr/local/tmp" ;;
            *)        BASE_DIR="/tmp" ;;
          esac
          REMOTE_DIR="${BASE_DIR}/cvcpkg-standalone-$$"

          ssh ${SSH_OPTS} "${VM}" "mkdir -p ${REMOTE_DIR}"
          tar cf - --exclude='.git' --exclude='build' --exclude='prefix' \
            --exclude='dist' --exclude='__pycache__' --exclude='*.egg-info' . \
            | ssh ${SSH_OPTS} "${VM}" "tar xf - -C ${REMOTE_DIR}"

          echo "remote_dir=${REMOTE_DIR}" >> "$GITHUB_ENV"

      - name: Install deps + build standalone
        shell: bash
        run: |
          set -euo pipefail
          VM="root@${{ steps.vm.outputs.host }}"
          PYTHON="${{ matrix.python }}"

          # Build from packaging/cvcpkg.spec, exactly as the hosted runners do.
          # The spec reads ./recipes directly, bundles the schemas and copies
          # cvcpkg's .dist-info — keep this in step with the `build` job rather
          # than maintaining a second, drifting flag list here.
          #
          # [remote,signing,validate]: a standalone binary is a fixed closure,
          # so httpx, cryptography and jsonschema must be in the build env to
          # be bundled. jsonschema comes via the [validate] extra (pinned
          # below the Rust rewrite there). Installing it explicitly would
          # resolve to >=4.18, whose rpds-py needs cargo — which these VMs do
          # not have.

          # NetBSD needs a patched PyInstaller. Upstream ships no NetBSD
          # bootloader, so pip compiles one, and bootloader/wscript has no
          # 'netbsd' in its platform tables:
          #
          #   File ".../bootloader/wscript", line 456, in configure
          #   KeyError: 'netbsd'
          #
          # The patch lives with the recipe it belongs to, so it travels in the
          # recipe archive (the build backend collects *.patch from recipe
          # dirs). It is applied to the same PyInstaller the other five
          # platforms get from PyPI, so every column ships the same version.
          # Submitted upstream; drop this branch once a release carries it.
          PYI_PATCH=recipes/pyinstaller-cp313/netbsd-platform-tables.patch
          if [ "${{ matrix.os }}" = "netbsd-x86_64" ]; then
            ssh ${SSH_OPTS} "${VM}" "set -e; rm -rf /tmp/pyi-src; \
              git clone --quiet --branch v${{ env.PYINSTALLER_VERSION }} --depth 1 \
                https://github.com/pyinstaller/pyinstaller /tmp/pyi-src; \
              cd /tmp/pyi-src && patch -p1 < ${remote_dir}/${PYI_PATCH}; \
              TMPDIR=/usr/local/tmp ${PYTHON} -m pip install --break-system-packages . 2>/dev/null \
                || ${PYTHON} -m pip install ."
          else
            ssh ${SSH_OPTS} "${VM}" "set -e; \
              TMPDIR=/usr/local/tmp ${PYTHON} -m pip install --break-system-packages 'pyinstaller==${{ env.PYINSTALLER_VERSION }}' 2>/dev/null \
                || ${PYTHON} -m pip install 'pyinstaller==${{ env.PYINSTALLER_VERSION }}'"
          fi

          ssh ${SSH_OPTS} "${VM}" "set -e; cd ${remote_dir} && \
            TMPDIR=/usr/local/tmp ${PYTHON} -m pip install --break-system-packages '.[remote,signing,validate]' 2>/dev/null \
              || ${PYTHON} -m pip install '.[remote,signing,validate]'; \
            ${PYTHON} -m PyInstaller --clean --noconfirm packaging/cvcpkg.spec"

      - name: Verify + retrieve binary
        shell: bash
        run: |
          set -euo pipefail
          VM="root@${{ steps.vm.outputs.host }}"

          # Validate a bundled recipe from a directory with no ./recipes, so the
          # recipes, schemas and metadata all have to resolve out of _MEIPASS.
          ssh ${SSH_OPTS} "${VM}" "set -e; cd ${remote_dir} && \
            chmod +x dist/cvcpkg && ./dist/cvcpkg --version && \
            BIN=\$(pwd)/dist/cvcpkg && cd /tmp && \$BIN validate recipes/zlib"

          mkdir -p dist
          scp ${SSH_OPTS} "${VM}:${remote_dir}/dist/cvcpkg" \
            "dist/${{ matrix.artifact }}"

      - name: Clean up BSD VM
        if: always()
        shell: bash
        run: |
          VM="root@${{ steps.vm.outputs.host }}"
          ssh ${SSH_OPTS} "${VM}" "rm -rf ${remote_dir}" || true

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: dist/${{ matrix.artifact }}
          retention-days: 1

  # ─────────────────── Haiku build via SSH ──────────────────────
  # Haiku is neither Linux nor BSD; PyInstaller ships no Haiku bootloader, so
  # (exactly like the netbsd column) it is compiled from source on the box with
  # recipes/pyinstaller-cp313/haiku-platform-tables.patch applied. cvcpkg's
  # own deps resolve to a pure-Python client on Haiku: pyproject.toml gates
  # cryptography (Rust)/greenlet/sqlalchemy behind `platform_system != 'Haiku'`,
  # so `pip install .` needs no cargo. Gated off by default; set repo variable
  # ENABLE_HAIKU_BUILD=true once a builder with SSH to a Haiku VM is provisioned.
  build-haiku:
    if: vars.ENABLE_HAIKU_BUILD == 'true'
    name: Build (haiku-x86_64)
    runs-on: ["self-hosted", "Linux", "X64", "cvcpkg-builder"]
    env:
      SSH_OPTS: '-o StrictHostKeyChecking=accept-new -o ConnectTimeout=30 -o BatchMode=yes -o ServerAliveInterval=30 -o ServerAliveCountMax=1000'
      PYTHON: python3
    steps:
      - uses: actions/checkout@v5

      - name: Resolve Haiku VM IP
        id: vm
        shell: bash
        run: |
          # VM name + fallback IP come from repo variables so they are not
          # hard-coded in this public workflow. HAIKU_BUILDER_VMS/IPS each hold
          # "primary secondary".
          resolve_vm_ip() {
            local vm_name="$1" fallback="$2"
            if command -v incus >/dev/null 2>&1; then
              local ip
              ip=$(incus list "$vm_name" --format csv -c 4 2>/dev/null \
                   | grep -oE '10\.[0-9]+\.[0-9]+\.[0-9]+' | head -1)
              [ -n "$ip" ] && { echo "$ip"; return; }
            fi
            echo "$fallback"
          }
          vm_is_usable() {
            [ -n "$1" ] || return 1
            ssh ${SSH_OPTS} -o ConnectTimeout=5 "user@$1" true >/dev/null 2>&1 || return 1
            ssh ${SSH_OPTS} -o ConnectTimeout=10 "user@$1" "${PYTHON} -c 'import sys'" >/dev/null 2>&1
          }
          read -r VM1 VM2 <<< "${{ vars.HAIKU_BUILDER_VMS }}"
          read -r IP1 IP2 <<< "${{ vars.HAIKU_BUILDER_IPS }}"
          HOST=$(resolve_vm_ip "$VM1" "$IP1")
          FALLBACK=$(resolve_vm_ip "$VM2" "$IP2")
          if ! vm_is_usable "$HOST"; then
            if vm_is_usable "$FALLBACK"; then
              echo "::warning::Primary Haiku VM $HOST failed a health check, falling back to $FALLBACK"
              HOST="$FALLBACK"
            else
              echo "::error::No usable haiku builder: neither $HOST nor $FALLBACK can run ${PYTHON}"
              exit 1
            fi
          fi
          echo "host=$HOST" >> "$GITHUB_OUTPUT"
          echo "Selected haiku VM: $HOST"

      - name: Sync repo to Haiku VM
        shell: bash
        run: |
          set -euo pipefail
          VM="user@${{ steps.vm.outputs.host }}"
          REMOTE_DIR="/boot/home/cvcpkg-standalone-$$"
          ssh ${SSH_OPTS} "${VM}" "mkdir -p ${REMOTE_DIR}"
          # A clean checkout has no src/cvcpkg/recipes (gitignored build
          # artifact), so the in-tree backend copytree's recipes/ in fresh --
          # never the shutil.rmtree path that fails on BFS with ENOTEMPTY.
          tar cf - --exclude='.git' --exclude='build' --exclude='prefix' \
            --exclude='dist' --exclude='__pycache__' --exclude='*.egg-info' \
            --exclude='src/cvcpkg/recipes' . \
            | ssh ${SSH_OPTS} "${VM}" "tar xf - -C ${REMOTE_DIR}"
          echo "remote_dir=${REMOTE_DIR}" >> "$GITHUB_ENV"

      - name: Install deps + build standalone
        shell: bash
        run: |
          set -euo pipefail
          VM="user@${{ steps.vm.outputs.host }}"
          PYI_PATCH=recipes/pyinstaller-cp313/haiku-platform-support.patch
          # Haiku ships python3 + gcc + git; bootstrap pip into the user tree.
          # PyInstaller has no Haiku bootloader on PyPI, so build it from the
          # tagged source with the platform-tables patch (waf compiles it
          # against Haiku's POSIX layer -- no __HAIKU__ C branches needed).
          ssh ${SSH_OPTS} "${VM}" "set -e; \
            export PATH=\$HOME/config/non-packaged/bin:\$HOME/config/bin:\$PATH; \
            python3 -m pip --version >/dev/null 2>&1 || python3 -m ensurepip --user; \
            rm -rf /boot/home/pyi-src; \
            git clone --quiet --branch v${{ env.PYINSTALLER_VERSION }} --depth 1 \
              https://github.com/pyinstaller/pyinstaller /boot/home/pyi-src; \
            cd /boot/home/pyi-src && patch -p1 < ${remote_dir}/${PYI_PATCH} && \
            python3 -m pip install --user ."
          # cvcpkg itself: markers drop the Rust/server deps on Haiku.
          # LIBRARY_PATH must be set for the freeze: Haiku's CPython
          # ctypes.util.find_library() reads os.environ['LIBRARY_PATH'] with
          # bracket access, and PyInstaller's ctypes scan (e.g. click._winconsole)
          # KeyErrors without it.
          ssh ${SSH_OPTS} "${VM}" "set -e; \
            export PATH=\$HOME/config/non-packaged/bin:\$HOME/config/bin:\$PATH; \
            export LIBRARY_PATH=/boot/system/lib:/boot/system/develop/lib:\$HOME/config/non-packaged/lib:/boot/system/non-packaged/lib; \
            cd ${remote_dir} && python3 -m pip install --user . && \
            python3 -m PyInstaller --clean --noconfirm packaging/cvcpkg.spec"

      - name: Verify + retrieve binary
        shell: bash
        run: |
          set -euo pipefail
          VM="user@${{ steps.vm.outputs.host }}"
          # Validate a bundled recipe from a dir with no ./recipes, so recipes,
          # schemas and metadata all resolve out of _MEIPASS.
          ssh ${SSH_OPTS} "${VM}" "set -e; cd ${remote_dir} && \
            chmod +x dist/cvcpkg && ./dist/cvcpkg --version && \
            BIN=\$(pwd)/dist/cvcpkg && cd /tmp && \$BIN validate recipes/zlib"
          mkdir -p dist
          scp ${SSH_OPTS} "${VM}:${remote_dir}/dist/cvcpkg" "dist/cvcpkg-haiku-x86_64"

      - name: Clean up Haiku VM
        if: always()
        shell: bash
        run: |
          VM="user@${{ steps.vm.outputs.host }}"
          ssh ${SSH_OPTS} "${VM}" "rm -rf ${remote_dir} /boot/home/pyi-src" || true

      - uses: actions/upload-artifact@v4
        with:
          name: cvcpkg-haiku-x86_64
          path: dist/cvcpkg-haiku-x86_64
          retention-days: 1

  release:
    name: Attach to GitHub Release
    needs: [build, build-bsd, build-haiku]
    runs-on: ubuntu-latest
    if: |
      always()
      && !cancelled()
      && startsWith(github.ref, 'refs/tags/')
      && needs.build.result == 'success'
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: List artifacts
        run: find artifacts -type f | sort

      - name: Warn on missing platforms
        # Uploads are best-effort (fail_on_unmatched_files is false) so that one
        # dead builder cannot hold up the other five.  The cost is that a
        # missing binary is invisible in the release -- and install.sh hard
        # fails for that platform, because it fetches a .sha256 that no job
        # produced.  Name the gap here instead of leaving it to be discovered
        # by whoever runs the install script.
        run: |
          cd artifacts
          missing=()
          for f in cvcpkg-linux-x86_64 cvcpkg-macos-arm64 cvcpkg-windows-x86_64.exe \
                   cvcpkg-freebsd-x86_64 cvcpkg-openbsd-x86_64 cvcpkg-netbsd-x86_64 \
                   cvcpkg-haiku-x86_64; do
            [ -f "$f" ] || missing+=("$f")
          done
          if [ ${#missing[@]} -gt 0 ]; then
            echo "::warning::Release is missing ${#missing[@]} platform binaries: ${missing[*]}"
          fi

      - name: Generate checksums
        # install.sh / install.ps1 verify against these before running
        # anything they downloaded.
        run: |
          cd artifacts
          for f in *; do
            sha256sum "$f" > "$f.sha256"
          done
          find . -name '*.sha256' | sort

      - name: Upload to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          files: artifacts/*
          fail_on_unmatched_files: false
