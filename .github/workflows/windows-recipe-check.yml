# Build ONE recipe on Windows and throw the result away.
#
# windows-build.yml is the only other Windows recipe path, and it builds every
# Windows recipe and then runs `cvcpkg publish --all` against cvcpkg.org.  That
# is the wrong tool for "does this one recipe's build.ps1 actually work on
# Windows?" -- too slow to iterate on, and it publishes.
#
# This workflow builds a single named recipe on the GitHub-hosted
# windows-latest runner and never publishes: no CVCPKG_PUBLISHER_TOKEN, no
# --server-cache-push, no `cvcpkg publish`.  It exists because the self-hosted
# Windows builders (sandipaws, phm-win11) are offline, so a recipe's .ps1 build
# script can otherwise reach master having never executed on Windows at all --
# which is exactly how ca-bundle shipped a build.ps1 that had never run.
#
# Usage:
#   gh workflow run windows-recipe-check -f recipe=ca-bundle
#   gh workflow run windows-recipe-check -f recipe=vtk -f platform=wasm
# (wasm/wasm-mt sets up the emsdk and builds the dep closure from source, so it
#  proves a recipe's build-wasm.ps1 actually cross-compiles on a Windows host.)
#
# The pull_request trigger is deliberately narrow: it fires only when this
# workflow file itself changes, so the PR that edits it proves it still works
# instead of adding a Windows job to every recipe PR.

name: Windows recipe check

on:
  workflow_dispatch:
    inputs:
      recipe:
        description: "Recipe to build (single name)"
        required: true
        default: "ca-bundle"
        type: string
      platform:
        description: "Target platform (wasm/wasm-mt cross-compile with Emscripten)"
        required: true
        default: "windows"
        type: choice
        options:
          - windows
          - wasm
          - wasm-mt
      config:
        description: "Build config"
        required: true
        default: "release"
        type: choice
        options:
          - release
          - debug
      link:
        description: "Link mode"
        required: true
        default: "shared"
        type: choice
        options:
          - shared
          - static
  pull_request:
    paths:
      - ".github/workflows/windows-recipe-check.yml"

concurrency:
  group: windows-recipe-check-${{ github.ref }}-${{ inputs.recipe || 'ca-bundle' }}-${{ inputs.platform || 'windows' }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Build ${{ inputs.recipe || 'ca-bundle' }} on Windows
    runs-on: windows-latest
    timeout-minutes: 150

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # Recipe build scripts invoke cl.exe / link.exe directly, and
      # _common/env-windows.ps1 throws if it cannot find a Visual Studio
      # install, so MSVC must be active before the build step.
      - name: Set up MSVC developer environment
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Install system build tools
        shell: powershell
        run: |
          choco install ninja --no-progress -y 2>&1 | Out-Null
          choco install cmake --version=3.31.7 --installargs 'ADD_CMAKE_TO_PATH=System' --no-progress -y 2>&1 | Out-Null
          choco install nasm --no-progress -y 2>&1 | Out-Null
          foreach ($dir in ([System.Environment]::GetEnvironmentVariable('PATH', 'Machine') -split ';')) {
            if ($dir) { echo $dir | Out-File -Append -Encoding utf8 $env:GITHUB_PATH }
          }

      - name: Ensure pwsh is on PATH
        shell: bash
        run: |
          # Recipes with .ps1 build scripts need PowerShell Core (pwsh).
          if ! command -v pwsh >/dev/null 2>&1; then
            for d in "/c/Program Files/PowerShell/7" "/c/Program Files/PowerShell/7-preview"; do
              if [ -x "$d/pwsh.exe" ]; then
                echo "$d" >> "$GITHUB_PATH"
                break
              fi
            done
          fi

      - name: Install cvcpkg
        shell: bash
        run: |
          python -m pip install --quiet --upgrade pip
          python -m pip install --quiet '.[publish,validate]'
          PY_SCRIPTS=$(python -c "import sysconfig; print(sysconfig.get_path('scripts'))")
          echo "$PY_SCRIPTS" >> "$GITHUB_PATH"

      - name: Validate recipe
        shell: bash
        run: cvcpkg validate "recipes/${{ inputs.recipe || 'ca-bundle' }}"

      # wasm / wasm-mt cross-compile with Emscripten. Pin the emsdk version cvcpkg
      # targets; env-wasm.ps1 reads CVC_EMSDK_DIR (set to $EMSDK in the build step).
      - name: Set up Emscripten (wasm only)
        if: ${{ startsWith(inputs.platform, 'wasm') }}
        uses: mymindstorm/setup-emsdk@v14
        with:
          version: "5.0.7"
          actions-cache-folder: emsdk-cache

      - name: Build ${{ inputs.recipe || 'ca-bundle' }} (${{ inputs.platform || 'windows' }})
        shell: bash
        run: |
          set -euo pipefail
          platform="${{ inputs.platform || 'windows' }}"
          recipe="${{ inputs.recipe || 'ca-bundle' }}"
          config="${{ inputs.config || 'release' }}"
          prefix="${{ github.workspace }}/prefix"
          if [[ "$platform" == wasm* ]]; then
            export CVC_EMSDK_DIR="$EMSDK"
            # Populate the prefix with the target's PREBUILT runtime dep closure
            # from the catalog, then build ONLY the target from source via its
            # build-wasm.ps1 (--host-platform windows selects the windows-host
            # matrix entry -- the script this check exists to exercise).
            #
            # `cvcpkg install <recipe>` (not install-deps, not --with-deps) is the
            # right populate step here: it fetches the recipe's RUNTIME closure
            # only -- never the cmake/ninja build tools (recipes declare those
            # under depends.build; they come from the choco step above) -- and it
            # runs no tests. --with-deps rebuilds the whole closure and runs each
            # dep's wasm node-smoke test, which fails on a hosted Windows runner;
            # install-deps additionally tries to resolve cmake/ninja for wasm and
            # dies. Installing the recipe's own (stale) bundle is harmless: the
            # build below overwrites it. Recipe-agnostic (no hardcoded dep list).
            cvcpkg install "$recipe" --platform "$platform" --arch wasm32 \
              --config "$config" --link static --prefix "$prefix" --no-fallback-to-source
            echo "cvcpkg build $recipe --platform $platform --link static --no-deps --host-platform windows"
            cvcpkg build "$recipe" --local --recipes-dir recipes --config "$config" \
              --prefix "$prefix" --platform "$platform" --link static \
              --no-deps --host-platform windows
          else
            echo "cvcpkg build $recipe --platform windows --link ${{ inputs.link || 'shared' }}"
            cvcpkg build "$recipe" --local --recipes-dir recipes --config "$config" \
              --prefix "$prefix" --platform windows --link "${{ inputs.link || 'shared' }}"
          fi

      - name: Show installed payload
        if: always()
        shell: bash
        run: |
          if [ -d "${{ github.workspace }}/prefix" ]; then
            find "${{ github.workspace }}/prefix" -mindepth 1 | sort
          else
            echo "no prefix produced"
          fi

      # Guards against the class of bug that motivated this workflow: a .ps1
      # that generates a POSIX shell script inherits its own CRLF line endings
      # on a Windows checkout, which silently corrupts every value the hook
      # exports.  Cheap to assert, invisible otherwise.
      - name: Check generated shell scripts are LF and BOM-free
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          prefix="${{ github.workspace }}/prefix"
          [ -d "$prefix" ] || { echo "no prefix; skipping"; exit 0; }
          rc=0
          while IFS= read -r -d '' f; do
            if grep -qU $'\r' "$f"; then
              echo "::error file=$f::generated shell script has CRLF line endings"
              rc=1
            fi
            if [ "$(head -c3 "$f")" = $'\xef\xbb\xbf' ]; then
              echo "::error file=$f::generated shell script has a UTF-8 BOM"
              rc=1
            fi
            echo "ok (LF, no BOM): ${f#"$prefix"/}"
          done < <(find "$prefix" -type f -name '*.sh' -print0)
          exit $rc
