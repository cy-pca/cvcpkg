# Build ONE recipe on Windows and throw the result away.
#
# windows-build.yml is the only other Windows recipe path, and it builds every
# Windows recipe and then runs `cvcpkg publish --all` against cvcpkg.org.  That
# is the wrong tool for "does this one recipe's build.ps1 actually work on
# Windows?" -- too slow to iterate on, and it publishes.
#
# This workflow builds a single named recipe on the GitHub-hosted
# windows-latest runner and never publishes: no CVCPKG_PUBLISHER_TOKEN, no
# --server-cache-push, no `cvcpkg publish`.  It exists because the self-hosted
# Windows builders (sandipaws, phm-win11) are offline, so a recipe's .ps1 build
# script can otherwise reach master having never executed on Windows at all --
# which is exactly how ca-bundle shipped a build.ps1 that had never run.
#
# Usage:
#   gh workflow run windows-recipe-check -f recipe=gsl
#   gh workflow run windows-recipe-check -f recipe=vtk -f platform=wasm
# (wasm/wasm-mt sets up the emsdk, installs the recipe's declared wasm deps from
#  the catalog and builds the recipe itself from source, so it proves a recipe's
#  build-wasm.ps1 actually cross-compiles on a Windows host -- including a
#  recipe that has never been published.)
#   gh workflow run windows-recipe-check -f recipe=openmp -f runner=windows-2022 -f deps=catalog
#   gh workflow run windows-recipe-check --ref <branch> -f recipe=msvc -f accept_license=true
#   gh workflow run windows-recipe-check --ref <branch> -f recipe=zlib -f msvc=cvcpkg -f accept_license=true
# (msvc=cvcpkg skips the runner's Visual Studio: `cvcpkg install msvc` lays out
#  Microsoft's compiler and SDK from Microsoft's packages and the recipe builds
#  with that, through CVC_MSVC_ROOT. accept_license=true is the dispatcher's own
#  acceptance of the vendor license of every recipe the run downloads under
#  `license_acceptance:` -- for msvc, Microsoft's Build Tools and Windows SDK
#  licenses. Leave it false unless you accept them; such recipes then refuse.)
# (runner=windows-2022 + deps=catalog mirrors windows-build.yml, the job that
#  publishes Windows bundles: VS 2022, and the dependency closure installed from
#  the catalog. The default builds the closure from source, which cannot work
#  on windows-latest for a recipe whose closure holds python311: CPython 3.11's
#  PCbuild does not know VS 2026's toolset -- see windows-build.yml.)
#
# The pull_request trigger is deliberately narrow: it fires only when this
# workflow file itself changes, so the PR that edits it proves it still works
# instead of adding a Windows job to every recipe PR.

name: Windows recipe check

on:
  workflow_dispatch:
    inputs:
      recipe:
        description: "Recipe to build (single name)"
        required: true
        default: "gsl"
        type: string
      platform:
        description: "Target platform (wasm/wasm-mt cross-compile with Emscripten)"
        required: true
        default: "windows"
        type: choice
        options:
          - windows
          - wasm
          - wasm-mt
      config:
        description: "Build config"
        required: true
        default: "release"
        type: choice
        options:
          - release
          - debug
      link:
        description: "Link mode"
        required: true
        default: "shared"
        type: choice
        options:
          - shared
          - static
      runner:
        description: "Runner image (windows-2022 = VS 2022, what windows-build.yml publishes from)"
        required: true
        default: "windows-latest"
        type: choice
        options:
          - windows-latest
          - windows-2022
      deps:
        description: "Dependency closure (windows only): build it from source, or install the published bundles"
        required: true
        default: "source"
        type: choice
        options:
          - source
          - catalog
      msvc:
        description: "Compiler: the runner image's Visual Studio, or cvcpkg's msvc recipe (needs accept_license)"
        required: true
        default: "runner"
        type: choice
        options:
          - runner
          - cvcpkg
      accept_license:
        description: "I accept the vendor license of every recipe this run downloads under license_acceptance (msvc: Microsoft's Build Tools and Windows SDK licenses)"
        required: true
        default: false
        type: boolean
  pull_request:
    paths:
      - ".github/workflows/windows-recipe-check.yml"
      # The shared Windows build harness — a break here (e.g. the silent
      # autotools preflight guard) reaches every Windows recipe.
      - "recipes/_common/env-windows.ps1"
      # The autotools recipes whose Windows bundles this check exists to prove.
      - "recipes/gmp/**"
      - "recipes/mpfr/**"
      - "recipes/gsl/**"
      # ...and the toolchain the default gsl build closure builds from source on
      # the clean runner: the MSYS2 bootstrap and the MSYS host tools.
      - "recipes/msys2/**"
      - "recipes/make/**"
      - "recipes/m4/**"
      - "recipes/autoconf/**"
      - "recipes/automake/**"
      - "recipes/libtool/**"

concurrency:
  # Every input is in the key, so variants of one recipe (runner, deps, link,
  # config) can run side by side instead of cancelling each other.
  group: windows-recipe-check-${{ github.ref }}-${{ inputs.recipe || 'gsl' }}-${{ inputs.platform || 'windows' }}-${{ inputs.runner || 'windows-latest' }}-${{ inputs.deps || 'source' }}-${{ inputs.link || 'shared' }}-${{ inputs.config || 'release' }}-${{ inputs.msvc || 'runner' }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Build ${{ inputs.recipe || 'gsl' }} on Windows
    runs-on: ${{ inputs.runner || 'windows-latest' }}
    timeout-minutes: 150
    # The runner image ships vcpkg at C:\vcpkg and exports its location.
    # Clear it so no recipe's build system discovers and uses it.
    env:
      VCPKG_INSTALLATION_ROOT: ""
      VCPKG_ROOT: ""

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # Recipe build scripts invoke cl.exe / link.exe directly, and
      # _common/env-windows.ps1 throws if it cannot find a Visual Studio
      # install, so MSVC must be active before the build step.
      - name: Set up MSVC developer environment
        if: ${{ (inputs.msvc || 'runner') == 'runner' }}
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      # The runner image puts C:\vcpkg on PATH, and the Visual Studio developer
      # environment can add Visual Studio's own vcpkg and VCPKG_ROOT. Strip them
      # for every later step; "Check build tools come from cvcpkg" fails if vcpkg
      # is still reachable.
      - name: Remove vcpkg from the environment
        shell: pwsh
        run: |
          $clean = ($env:PATH -split ';' | Where-Object { $_ -and $_ -notmatch '\\vcpkg(\\|$)' }) -join ';'
          "PATH=$clean" | Out-File -Append -Encoding utf8 $env:GITHUB_ENV
          "VCPKG_ROOT=" | Out-File -Append -Encoding utf8 $env:GITHUB_ENV
          "VCPKG_INSTALLATION_ROOT=" | Out-File -Append -Encoding utf8 $env:GITHUB_ENV

      - name: Ensure pwsh is on PATH
        shell: bash
        run: |
          # Recipes with .ps1 build scripts need PowerShell Core (pwsh).
          if ! command -v pwsh >/dev/null 2>&1; then
            for d in "/c/Program Files/PowerShell/7" "/c/Program Files/PowerShell/7-preview"; do
              if [ -x "$d/pwsh.exe" ]; then
                echo "$d" >> "$GITHUB_PATH"
                break
              fi
            done
          fi

      - name: Install cvcpkg
        shell: bash
        run: |
          python -m pip install --quiet --upgrade pip
          python -m pip install --quiet '.[publish,validate]'
          PY_SCRIPTS=$(python -c "import sysconfig; print(sysconfig.get_path('scripts'))")
          echo "$PY_SCRIPTS" >> "$GITHUB_PATH"

      # A recipe with `license_acceptance:` is built only after its vendor's
      # terms are accepted.  Here the dispatcher accepts them by setting
      # accept_license; this step records it for the recipes the run downloads
      # (the target, and msvc when msvc=cvcpkg), never on its own.
      - name: Accept vendor licenses (accept_license)
        if: ${{ inputs.accept_license }}
        shell: bash
        run: |
          set -euo pipefail
          names="${{ inputs.recipe || 'gsl' }}"
          [ "${{ inputs.msvc || 'runner' }}" = cvcpkg ] && names="$names msvc"
          for name in $names; do
            python - "$name" >> "$GITHUB_ENV" <<'PY'
          import sys, yaml
          name = sys.argv[1]
          gate = (yaml.safe_load(open(f"recipes/{name}/recipe.yaml")) or {}).get("license_acceptance")
          if gate:
              urls = " ".join(gate["urls"])
              print(f"{name}: license accepted by the dispatcher (accept_license): {urls}", file=sys.stderr)
              print(f"{gate['env']}=1")
          PY
          done

      # msvc=cvcpkg: the compiler is cvcpkg's msvc recipe, installed the way a
      # user would (`cvcpkg install` builds it from the recipe -- it is never
      # published), and the build below takes it from CVC_MSVC_ROOT through
      # _common/env-windows.ps1 instead of the runner's Visual Studio.
      - name: Install cvcpkg's MSVC (msvc=cvcpkg)
        if: ${{ inputs.msvc == 'cvcpkg' }}
        shell: bash
        run: |
          set -euo pipefail
          if [ "${{ inputs.accept_license }}" != true ]; then
            echo "::error::msvc=cvcpkg downloads Microsoft's compiler and SDK under Microsoft's licenses; re-run with accept_license=true if you accept them"
            exit 1
          fi
          prefix="$(cygpath -m "$RUNNER_TEMP")/cvcpkg-msvc"
          cvcpkg install msvc --platform windows --recipes-dir recipes --prefix "$prefix"
          echo "CVC_MSVC_ROOT=$(cygpath -w "$prefix")\\msvc" >> "$GITHUB_ENV"
          cat "$prefix/msvc/msvc.json"

      # Build tools from cvcpkg: cmake (3.31.7, the version Boost 1.86's
      # configs expect), ninja and nasm. Nothing comes from Chocolatey, vcpkg or
      # the runner image's own copies, which these shadow on PATH. cmake is
      # copied into a tree holding only the tools: CMake searches its own install
      # prefix (the parent of share/cmake-X.Y) for packages, and the prefix
      # cvcpkg installs it into also holds curl and openssl headers and libraries
      # that a recipe build would otherwise find instead of its declared deps.
      - name: Install build tools (cvcpkg)
        shell: bash
        run: |
          set -euo pipefail
          temp=$(cygpath -u "$RUNNER_TEMP")
          prefix="$temp/cvcpkg-tools-prefix"
          tree="$temp/cvcpkg-tools"
          cvcpkg install cmake ninja nasm --prefix "$(cygpath -m "$prefix")" --config release --link shared
          mkdir -p "$tree/bin" "$tree/share"
          # All of these import only Windows system DLLs, so no DLLs travel with them.
          for exe in cmake ctest cpack cmcldeps ninja nasm ndisasm; do
            cp "$prefix/bin/$exe.exe" "$tree/bin/"
          done
          cp -R "$prefix"/share/cmake-* "$tree/share/"
          cygpath -w "$tree/bin" >> "$GITHUB_PATH"

      - name: Check build tools come from cvcpkg
        shell: bash
        run: |
          set -euo pipefail
          want="$(cygpath -u "$RUNNER_TEMP")/cvcpkg-tools/bin"
          for t in cmake ninja nasm; do
            got=$(command -v "$t" || true)
            case "$got" in
              "$want"/*) echo "$t -> $got" ;;
              *) echo "::error::$t resolves to '${got:-nothing}', not cvcpkg's ($want)"; exit 1 ;;
            esac
          done
          cmake --version | sed -n 1p
          ninja --version
          nasm -v
          if command -v vcpkg >/dev/null 2>&1; then
            echo "::error::vcpkg is on PATH ($(command -v vcpkg)); nothing may build with it"
            exit 1
          fi

      - name: Validate recipe
        shell: bash
        run: cvcpkg validate "recipes/${{ inputs.recipe || 'gsl' }}"

      # wasm / wasm-mt cross-compile with Emscripten. Pin the emsdk version cvcpkg
      # targets; env-wasm.ps1 reads CVC_EMSDK_DIR (set to $EMSDK in the build step).
      - name: Set up Emscripten (wasm only)
        if: ${{ startsWith(inputs.platform, 'wasm') }}
        uses: mymindstorm/setup-emsdk@v14
        with:
          version: "5.0.7"
          actions-cache-folder: emsdk-cache

      - name: Build ${{ inputs.recipe || 'gsl' }} (${{ inputs.platform || 'windows' }})
        shell: bash
        run: |
          set -euo pipefail
          platform="${{ inputs.platform || 'windows' }}"
          recipe="${{ inputs.recipe || 'gsl' }}"
          config="${{ inputs.config || 'release' }}"
          prefix="${{ github.workspace }}/prefix"
          if [[ "$platform" == wasm* ]]; then
            export CVC_EMSDK_DIR="$EMSDK"
            # Populate the prefix with the target's PREBUILT dep closure from the
            # catalog, then build ONLY the target from source via its
            # build-wasm.ps1 (--host-platform windows selects the windows-host
            # matrix entry -- the script this check exists to exercise).
            #
            # `cvcpkg install-deps recipes/<recipe>` (not --with-deps) is the
            # populate step: it installs the deps THIS checkout's recipe declares
            # for the target, and runs no tests. Cross-compiling, it treats
            # depends.build entries with no wasm build (cmake/ninja) as host tools
            # and leaves them out -- they come from the cvcpkg build-tools step
            # above -- and a recipe with no wasm deps installs nothing. --with-deps
            # rebuilds the whole closure and runs each dep's wasm node-smoke test,
            # which fails on a hosted Windows runner. `cvcpkg install <recipe>`
            # (the old step) installs the recipe's own published bundle, so it
            # failed outright for a recipe not yet in the catalog ("no bundles
            # found in catalog") -- the one a recipe PR most needs to check.
            # Recipe-agnostic (no hardcoded dep list).
            cvcpkg install-deps "recipes/$recipe" --platform "$platform" --arch wasm32 \
              --config "$config" --link static --prefix "$prefix" --recipes-dir recipes \
              --host-platform windows
            echo "cvcpkg build $recipe --platform $platform --link static --no-deps --host-platform windows"
            cvcpkg build "$recipe" --local --recipes-dir recipes --config "$config" \
              --prefix "$prefix" --platform "$platform" --link static \
              --no-deps --host-platform windows
          elif [[ "${{ inputs.deps || 'source' }}" == catalog ]]; then
            # The windows-build.yml path, minus the publish: install the recipe's
            # PUBLISHED build + runtime closure into the prefix (cmake/ninja and
            # any interpreter included -- install-deps keeps depends.build
            # entries on a native build), then build only the recipe against it.
            link="${{ inputs.link || 'shared' }}"
            echo "cvcpkg install-deps recipes/$recipe --platform windows --link $link"
            cvcpkg install-deps "recipes/$recipe" --platform windows --config "$config" \
              --link "$link" --prefix "$prefix" --recipes-dir recipes
            echo "cvcpkg build $recipe --no-deps --platform windows --link $link"
            cvcpkg build "$recipe" --local --recipes-dir recipes --config "$config" \
              --prefix "$prefix" --platform windows --link "$link" --no-deps
          else
            # --with-deps: build the recipe's whole closure from source first, in
            # topological order. The default gsl (and the other MSYS autotools
            # recipes) need m4/autoconf/automake/libtool/make + mingw-w64-gcc built
            # and staged into the build prefix, on top of the msys2 bootstrap (the
            # runner's own C:\msys64 is bare: no gcc, no make) -- host_tools stage only when
            # CROSS-compiling, so a native Windows build gets them via depends.build
            # (scoped to windows) and only --with-deps builds those. None of that
            # chain declares a test:, so --with-deps runs no dep smoke tests here
            # (unlike the wasm path above, which is why that one does not use it).
            echo "cvcpkg build $recipe --with-deps --platform windows --link ${{ inputs.link || 'shared' }}"
            cvcpkg build "$recipe" --local --recipes-dir recipes --config "$config" \
              --prefix "$prefix" --platform windows --link "${{ inputs.link || 'shared' }}" \
              --with-deps
          fi

      - name: Show installed payload
        if: always()
        shell: bash
        run: |
          if [ -d "${{ github.workspace }}/prefix" ]; then
            find "${{ github.workspace }}/prefix" -mindepth 1 | sort
          else
            echo "no prefix produced"
          fi

      # Guards against the class of bug that motivated this workflow: a .ps1
      # that generates a POSIX shell script inherits its own CRLF line endings
      # on a Windows checkout, which silently corrupts every value the hook
      # exports.  Cheap to assert, invisible otherwise.
      - name: Check generated shell scripts are LF and BOM-free
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          prefix="${{ github.workspace }}/prefix"
          [ -d "$prefix" ] || { echo "no prefix; skipping"; exit 0; }
          rc=0
          while IFS= read -r -d '' f; do
            if grep -qU $'\r' "$f"; then
              echo "::error file=$f::generated shell script has CRLF line endings"
              rc=1
            fi
            if [ "$(head -c3 "$f")" = $'\xef\xbb\xbf' ]; then
              echo "::error file=$f::generated shell script has a UTF-8 BOM"
              rc=1
            fi
            echo "ok (LF, no BOM): ${f#"$prefix"/}"
          done < <(find "$prefix" -type f -name '*.sh' -print0)
          exit $rc
