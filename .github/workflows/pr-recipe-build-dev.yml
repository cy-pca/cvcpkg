# Build recipes changed in a PR on the internal dev cluster — via catx-03.
#
# The dev cvcpkg-server + builders are NAT'd incus VMs (10.66.77/10.99), not
# routable from the internet.  Unlike the legacy star-01 runner (which sat ON
# the incus LAN), the cy-pca org runner is catx-03, which reaches the cluster
# only through the local gateway over passwordless SSH as the `tfx` user:
#     catx-03  --ssh-->  tfx@transfix.mdns.org  --routes-->  10.66.77.207:8420
# So this job opens an SSH local-forward through the gateway and talks to the
# dev server over the tunnel.  No incus control plane is needed on the runner.
#
# SECURITY — this job runs as `tfx` on catx-03, which has SSH into the whole dev
# LAN.  On a PUBLIC repo a fork PR that reached this runner would be LAN-wide
# RCE.  It is therefore gated three ways: self-hosted only, same-repo PRs only,
# and an actor allowlist; the repo must also require approval for all outside
# contributors.  Never convert this to pull_request_target.
#
# Dormant until enabled: the job self-skips unless vars.DEV_CLUSTER_ENABLED is
# 'true', so it can be merged before the dev runner/token exist without firing.
#
# Required repo config to enable:
#   vars.DEV_CLUSTER_ENABLED = true
#   secrets.CVCPKG_ADMIN_TOKEN  — token valid on the DEV server (publisher/admin)
#   vars.DEV_GATEWAY_SSH        — e.g. tfx@transfix.mdns.org
#   vars.DEV_CVCPKG_SERVER      — e.g. 10.66.77.207:8420  (host:port on the LAN)
#   vars.CI_ALLOWED_ACTORS      — comma list, e.g. ,transfix,
# Runner: catx-03-cy-pca must run as `tfx` and carry the label `cvcpkg-dev-gw`.

name: PR recipe build (dev cluster)

on:
  pull_request:
    paths:
      - "recipes/**"
  workflow_dispatch:

concurrency:
  group: pr-recipe-dev-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write

jobs:
  build-on-dev:
    # Dormant unless explicitly enabled; then same-repo PRs + actor allowlist
    # only (or manual dispatch).  Fork PRs must never reach this self-hosted
    # host or the dev-cluster token.
    if: >-
      vars.DEV_CLUSTER_ENABLED == 'true' &&
      (github.event_name == 'workflow_dispatch' ||
       (github.event.pull_request.head.repo.full_name == github.repository &&
        contains(format(',{0},', vars.CI_ALLOWED_ACTORS), format(',{0},', github.actor))))
    runs-on: [self-hosted, Linux, X64, cvcpkg-dev-gw]
    timeout-minutes: 45
    env:
      GW: ${{ vars.DEV_GATEWAY_SSH }}
      DEV_SERVER: ${{ vars.DEV_CVCPKG_SERVER }}
      LOCAL_PORT: "18420"
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install cvcpkg
        run: |
          pip install --user .
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Detect changed recipes
        id: changed
        run: |
          set -euo pipefail
          git fetch -q origin "${{ github.base_ref }}" || true
          base="origin/${{ github.base_ref }}"
          git rev-parse --verify -q "$base" >/dev/null || base="HEAD~1"
          mapfile -t touched < <(
            git diff --name-only "${base}...HEAD" -- recipes/ \
              | grep -E '^recipes/[^/]+/' | cut -d/ -f2 | grep -v '^_' | sort -u
          )
          names=()
          for r in "${touched[@]}"; do [ -d "recipes/$r" ] && names+=("$r"); done
          echo "Changed recipes: ${names[*]:-<none>}"
          printf 'names=%s\n' "${names[*]:-}" >> "$GITHUB_OUTPUT"

      - name: Open SSH tunnel to the dev server
        id: tunnel
        if: steps.changed.outputs.names != ''
        run: |
          set -euo pipefail
          # Local-forward LOCAL_PORT -> DEV_SERVER, routed by the gateway.
          # ExitOnForwardFailure makes a bad forward fail loudly instead of
          # leaving a dead tunnel; -f backgrounds after the forward is up.
          ssh -f -N \
            -o BatchMode=yes -o ConnectTimeout=10 \
            -o ExitOnForwardFailure=yes \
            -o ServerAliveInterval=15 -o ServerAliveCountMax=4 \
            -o StrictHostKeyChecking=accept-new \
            -L "127.0.0.1:${LOCAL_PORT}:${DEV_SERVER}" "${GW}"
          echo "DEV_URL=http://127.0.0.1:${LOCAL_PORT}" >> "$GITHUB_ENV"
          # Prove the tunnel before submitting anything.
          curl -fsS --max-time 8 "http://127.0.0.1:${LOCAL_PORT}/healthz" | grep -q '"ok"'
          dag="pr-${{ github.event.pull_request.number || github.run_id }}-${{ github.run_id }}"
          echo "DAG_BASE=${dag:0:50}" >> "$GITHUB_ENV"

      - name: Push + build changed recipes on dev
        id: build
        if: steps.changed.outputs.names != ''
        env:
          CVCPKG_SERVER_URL: ${{ env.DEV_URL }}
          CVCPKG_TOKEN: ${{ secrets.CVCPKG_ADMIN_TOKEN }}
          NAMES: ${{ steps.changed.outputs.names }}
        run: |
          set -uo pipefail
          echo "Dev server (tunnelled): $CVCPKG_SERVER_URL   DAG: $DAG_BASE"
          for r in $NAMES; do
            echo "::group::push $r"
            cvcpkg recipe push "$r" --recipes-dir recipes \
              --server "$CVCPKG_SERVER_URL" --token "$CVCPKG_TOKEN"
            echo "::endgroup::"
          done
          set +e
          cvcpkg builds submit-dag \
            --server "$CVCPKG_SERVER_URL" --token "$CVCPKG_TOKEN" \
            --platform linux,freebsd,openbsd,netbsd,windows,wasm,wasi \
            --arch x86_64,wasm32 --config release --link shared \
            --recipes-dir recipes --dag-id "$DAG_BASE" \
            --skip-existing --wait --wait-timeout 1500 \
            $NAMES | tee build.log
          rc=$?
          set -e
          echo "exit_code=$rc" >> "$GITHUB_OUTPUT"
          if [ "$rc" != "0" ] && [ "$rc" != "75" ]; then
            for id in $(grep -oE '#[0-9]+ [^ ]+ [(][^)]+[)]: failed' build.log | grep -oE '^#[0-9]+' | tr -d '#' | sort -u); do
              { echo ""; echo "===== job #$id: last 80 log lines ====="; \
                cvcpkg builds log "$id" --server "$CVCPKG_SERVER_URL" --token "$CVCPKG_TOKEN" 2>&1 | tail -n 80; } >> build.log || true
            done
          fi
          if [ "$rc" = "75" ]; then echo "status=building" >> "$GITHUB_OUTPUT"; exit 0
          elif [ "$rc" = "0" ]; then echo "status=passed" >> "$GITHUB_OUTPUT"
          else echo "status=failed" >> "$GITHUB_OUTPUT"; exit "$rc"; fi

      - name: Cancel superseded DAG jobs
        if: cancelled() && steps.changed.outputs.names != ''
        env:
          CVCPKG_SERVER_URL: ${{ env.DEV_URL }}
          CVCPKG_TOKEN: ${{ secrets.CVCPKG_ADMIN_TOKEN }}
        run: |
          set -uo pipefail
          [ -n "${DAG_BASE:-}" ] && [ -n "${CVCPKG_SERVER_URL:-}" ] || exit 0
          cvcpkg builds cancel-dag "${DAG_BASE}-*" --server "$CVCPKG_SERVER_URL" --token "$CVCPKG_TOKEN" || true

      - name: Close SSH tunnel
        if: always()
        run: pkill -f "127.0.0.1:${LOCAL_PORT}:${DEV_SERVER}" || true

      - name: Comment result on PR
        if: always() && steps.changed.outputs.names != '' && github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -uo pipefail
          case "${{ steps.build.outputs.status || 'failed' }}" in
            passed)   status="✅ passed" ;;
            building) status="⏳ submitted — still building on the cluster; not blocking" ;;
            *)        status="❌ failed" ;;
          esac
          { echo "### Dev-cluster recipe build — $status"; echo ""; \
            echo "Recipes: \`${{ steps.changed.outputs.names }}\`"; echo ""; \
            echo "<details><summary>build log</summary>"; echo ""; echo '```'; \
            tail -c 60000 build.log 2>/dev/null || echo "(no log)"; echo '```'; echo "</details>"; } > comment.md
          gh pr comment "${{ github.event.pull_request.number }}" --body-file comment.md || cat comment.md
