# Build ONE recipe on macOS and throw the result away.
#
# macos-build.yml is the only other macOS recipe path, and it publishes every
# bundle it packs to cvcpkg.org.  That is the wrong tool for "does this recipe
# build on macOS?" and for proving a change to the macOS tool setup.
#
# This workflow builds a single named recipe on a GitHub-hosted macOS runner and
# never publishes: no CVCPKG_PUBLISHER_TOKEN, no `cvcpkg publish`, no
# --server-cache-push.  Its tool setup is macos-build.yml's: Homebrew stripped
# from PATH, and cmake, ninja, pkg-config, meson, m4, flex and bison from cvcpkg.
#
# Usage:
#   gh workflow run macos-recipe-check -f recipe=fontconfig
#   gh workflow run macos-recipe-check -f recipe=bison -f runner=macos-15-intel
#   gh workflow run macos-recipe-check -f recipe=automake -f deps=source
# deps=catalog (the default) is macos-build.yml's targeted path minus the
# publish: install the recipe's PUBLISHED build + runtime closure, then
# `cvcpkg pack` the recipe into dist/.  pack runs the relocatability gate, which
# refuses a bundle that loads anything from Homebrew.  deps=source builds the
# whole closure from source with `cvcpkg build --with-deps` instead.
# runner=macos-latest is Apple Silicon (arm64); macos-15-intel is x86_64, the
# two images macos-build.yml publishes from.
#
# The pull_request trigger fires only when this file or one of the macOS
# workflows that share its tool setup changes.  It smoke-tests the tools tree
# and builds a small fixed set of recipes on both architectures, instead of
# adding macOS jobs to every recipe PR.

name: macOS recipe check

on:
  workflow_dispatch:
    inputs:
      recipe:
        description: "Recipe to build (single name)"
        required: true
        default: "fontconfig"
        type: string
      config:
        description: "Build config"
        required: true
        default: "release"
        type: choice
        options:
          - release
          - debug
      link:
        description: "Link mode"
        required: true
        default: "shared"
        type: choice
        options:
          - shared
          - static
      runner:
        description: "Runner image (macos-latest = arm64, macos-15-intel = x86_64)"
        required: true
        default: "macos-latest"
        type: choice
        options:
          - macos-latest
          - macos-15-intel
      deps:
        description: "Dependency closure: install the published bundles, or build it from source"
        required: true
        default: "catalog"
        type: choice
        options:
          - catalog
          - source
  pull_request:
    paths:
      - ".github/workflows/macos-recipe-check.yml"
      - ".github/workflows/macos-build.yml"
      - ".github/workflows/macos-drain.yml"

concurrency:
  # Every input is in the key, so variants of one recipe can run side by side
  # instead of cancelling each other.
  group: macos-recipe-check-${{ github.ref }}-${{ inputs.recipe || 'pr' }}-${{ inputs.runner || 'all' }}-${{ inputs.deps || 'catalog' }}-${{ inputs.link || 'shared' }}-${{ inputs.config || 'release' }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  plan:
    name: Plan
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
    steps:
      - id: plan
        env:
          EVENT: ${{ github.event_name }}
          RECIPE: ${{ inputs.recipe }}
          RUNNER: ${{ inputs.runner }}
          DEPS: ${{ inputs.deps }}
        run: |
          set -euo pipefail
          # One "recipe runner deps" line per job.
          if [ "$EVENT" = workflow_dispatch ]; then
            set -- "$RECIPE $RUNNER $DEPS"
          else
            # Each recipe puts different tools to work. The tools tree serves
            # what a recipe uses without declaring it; a depends.build tool
            # comes from its catalog bundle in the prefix. Every job also
            # smoke-tests the whole tree first.
            #   fontconfig  meson, ninja, pkg-config, gperf bundles (depends.build)
            #   bison       autotools configure + make, with m4 from the tree (host_tools)
            #   autoconf    autotools configure + make, with the m4 and perl bundles
            # Intel builds only bison until the macOS x86_64 bison bundle is
            # republished: it loads Homebrew's libtextstyle, so the check refuses
            # it in any Intel job that does not build bison itself.
            set -- \
              "fontconfig macos-latest catalog" \
              "bison macos-latest catalog" "bison macos-15-intel catalog" \
              "autoconf macos-latest catalog"
          fi
          for job in "$@"; do
            echo "$job"
          done | jq -R -s -c 'split("\n") | map(select(length > 0) | split(" ") | {recipe: .[0], runner: .[1], deps: .[2]})' > matrix.json
          cat matrix.json
          echo "matrix=$(cat matrix.json)" >> "$GITHUB_OUTPUT"

  build:
    name: Build ${{ matrix.recipe }} on ${{ matrix.runner }} (${{ matrix.deps }} deps)
    needs: plan
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 150
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.matrix) }}

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # The three tool-setup steps are macos-build.yml's, which explains each.
      - name: Remove Homebrew from the environment
        run: |
          set -euo pipefail
          brew_dir() {
            case "$1" in
              /opt/homebrew|/opt/homebrew/*) return 0 ;;
              /usr/local/Homebrew|/usr/local/Homebrew/*|/usr/local/Cellar|/usr/local/Cellar/*) return 0 ;;
              /usr/local/opt|/usr/local/opt/*|/usr/local/Caskroom|/usr/local/Caskroom/*) return 0 ;;
              # Intel: Homebrew owns all of /usr/local (bin, sbin, lib/ruby/gems/*/bin, ...).
              /usr/local|/usr/local/*) [ -d /usr/local/Homebrew ] ;;
              *) return 1 ;;
            esac
          }
          clean=""
          set -f; IFS=:
          for d in $PATH; do
            [ -n "$d" ] || continue
            if brew_dir "$d"; then echo "dropping from PATH: $d"; continue; fi
            clean="${clean:+$clean:}$d"
          done
          unset IFS; set +f
          echo "PATH=$clean" >> "$GITHUB_ENV"
          # Off PATH is not enough on Intel: Homebrew links its formulae into
          # /usr/local/include and /usr/local/lib, where Apple clang and ld look
          # by default (bison's configure linked Homebrew's libtextstyle from
          # there). Move the formulae aside, so every Homebrew file and every
          # link to one is unreachable, whatever looks for it.
          # Moving Homebrew aside is only safe on an ephemeral GitHub-hosted
          # runner; on a persistent self-hosted Mac it would break the host.
          if [ "${RUNNER_ENVIRONMENT:-}" != "github-hosted" ]; then
            echo "::error::refusing to move Homebrew aside on a ${RUNNER_ENVIRONMENT:-unknown} runner"
            exit 1
          fi
          for d in /opt/homebrew /usr/local/Cellar; do
            if [ -e "$d" ]; then
              sudo mv "$d" "$d.hidden-from-builds"
              echo "moved aside: $d"
            fi
          done

      - name: Install cvcpkg
        run: |
          python -m pip install --quiet --upgrade pip
          python -m pip install --quiet '.[remote,validate]'
          echo "$(python -c "import sysconfig; print(sysconfig.get_path('scripts'))")" >> "$GITHUB_PATH"

      - name: Install build tools (cvcpkg)
        env:
          BUILDING: ${{ matrix.recipe }}
        run: |
          set -euo pipefail
          prefix="$RUNNER_TEMP/cvcpkg-tools-prefix"
          tree="$RUNNER_TEMP/cvcpkg-tools"
          # A tool whose recipe this job builds is left out: building it never
          # needs its own bundle, and leaving it out is how a bundle that cannot
          # run here gets replaced.
          building=" $(echo "${BUILDING:-}" | tr ',' ' ') "
          recipes=""
          for r in cmake ninja pkg-config meson m4 flex bison; do
            case "$building" in
              *" $r "*) echo "leaving out $r: this job builds it" ;;
              *) recipes="$recipes $r" ;;
            esac
          done
          cvcpkg install $recipes --prefix "$prefix" --platform macos --config release --link shared
          mkdir -p "$tree/bin" "$tree/lib" "$tree/share"
          cmds=""
          for r in $recipes; do
            case "$r" in
              cmake) exes="cmake ctest cpack"; cp -R "$prefix"/share/cmake-* "$tree/share/" ;;
              pkg-config) exes="pkgconf"; ln -s pkgconf "$tree/bin/pkg-config" ;;
              meson) exes="meson"; cp -R "$prefix/lib/meson" "$tree/lib/" ;;
              m4) exes="m4"; echo "M4=$tree/bin/m4" >> "$GITHUB_ENV" ;;
              flex) exes="flex"; ln -s flex "$tree/bin/flex++" ;;
              bison)
                exes="bison"
                cp -R "$prefix/share/bison" "$tree/share/"
                echo "BISON_PKGDATADIR=$tree/share/bison" >> "$GITHUB_ENV" ;;
              *) exes="$r" ;;
            esac
            for exe in $exes; do cp "$prefix/bin/$exe" "$tree/bin/"; done
            if [ "$r" = pkg-config ]; then cmds="$cmds pkg-config"; else cmds="$cmds $exes"; fi
          done
          echo $cmds > "$tree/commands"
          # The @rpath dylibs the executables load, and the ones those load.
          todo=""
          for f in "$tree"/bin/*; do
            [ -L "$f" ] && continue
            case "$(file -b "$f")" in *Mach-O*) todo="$todo $f" ;; esac
          done
          while [ -n "$todo" ]; do
            next=""
            for f in $todo; do
              for lib in $(otool -L "$f" | sed -n 's|^[[:space:]]*@rpath/\([^ ]*\) .*|\1|p'); do
                if [ ! -e "$tree/lib/$lib" ]; then
                  cp "$prefix/lib/$lib" "$tree/lib/$lib"
                  next="$next $tree/lib/$lib"
                fi
              done
            done
            todo="$next"
          done
          echo "$tree/bin" >> "$GITHUB_PATH"
          echo "tools: $cmds"
          echo "dylibs: $(ls "$tree/lib" | tr '\n' ' ')"

      - name: Check build tools come from cvcpkg
        run: |
          set -euo pipefail
          tree="$RUNNER_TEMP/cvcpkg-tools"
          rc=0
          for t in $(cat "$tree/commands"); do
            got=$(command -v "$t" || true)
            case "$got" in
              "$tree/bin/"*) echo "$t -> $got" ;;
              *) echo "::error::$t resolves to '${got:-nothing}', not cvcpkg's ($tree/bin)"; rc=1 ;;
            esac
          done
          # A tool from the tree may load only what macOS itself provides or the
          # tree carries; anything else means its bundle cannot run on a clean Mac.
          for f in "$tree"/bin/* "$tree"/lib/*; do
            [ -f "$f" ] && [ ! -L "$f" ] || continue
            case "$(file -b "$f")" in *Mach-O*) ;; *) continue ;; esac
            for dep in $(otool -L "$f" | tail -n +2 | awk '!/:$/ {print $1}'); do
              case "$dep" in
                /usr/lib/*|/System/*|@rpath/*|@loader_path/*|@executable_path/*) ;;
                *)
                  name=$(basename "$f")
                  case "$name" in
                    ctest|cpack) recipe=cmake ;;
                    pkgconf) recipe=pkg-config ;;
                    libcurl*) recipe=curl ;;
                    libssl*|libcrypto*) recipe=openssl ;;
                    *) recipe=$name ;;
                  esac
                  echo "::error::$name loads $dep, which macOS does not provide: the cvcpkg $recipe bundle for macos-$(uname -m) needs republishing"
                  rc=1 ;;
              esac
            done
          done
          set -f; IFS=:
          for d in $PATH; do
            case "$d" in
              /opt/homebrew*|/usr/local/Homebrew*|/usr/local/Cellar*|/usr/local/opt*|/usr/local/Caskroom*)
                echo "::error::Homebrew directory on PATH: $d"; rc=1 ;;
              /usr/local|/usr/local/*)
                if [ -d /usr/local/Homebrew ]; then echo "::error::Homebrew directory on PATH: $d"; rc=1; fi ;;
            esac
          done
          unset IFS; set +f
          if command -v brew >/dev/null 2>&1; then
            echo "::error::brew is on PATH ($(command -v brew)); nothing may build with Homebrew"
            rc=1
          fi
          for d in /opt/homebrew /usr/local/Cellar; do
            if [ -e "$d" ]; then echo "::error::$d is still in place; nothing may build with Homebrew"; rc=1; fi
          done
          [ "$rc" = 0 ] || exit 1
          has() { case " $(cat "$tree/commands") " in *" $1 "*) return 0 ;; esac; return 1; }
          if has cmake; then cmake --version | sed -n 1p; fi
          if has ninja; then echo "ninja $(ninja --version)"; fi
          if has pkg-config; then echo "pkg-config $(pkg-config --version)"; fi
          if has meson; then echo "meson $(meson --version)"; fi
          if has m4; then m4 --version | sed -n 1p; fi
          if has flex; then flex --version; fi
          if has bison; then bison --version | sed -n 1p; fi
          # Still not from cvcpkg: what these resolve to.
          for t in bash perl make python3; do echo "$t -> $(command -v "$t" || echo none)"; done

      # Versions prove the tools start; this proves they work from the tree,
      # far from the prefix they were built in: cmake (and the libcurl it
      # loads) and meson drive ninja, bison and flex find their m4 and skeletons.
      - name: Smoke-test the build tools
        run: |
          set -euo pipefail
          tree="$RUNNER_TEMP/cvcpkg-tools"
          # A tool this job builds itself is not in the tree; skip what needs it.
          has() { case " $(cat "$tree/commands") " in *" $1 "*) return 0 ;; esac; return 1; }
          work=$(mktemp -d)
          cd "$work"
          printf 'int main(void) { return 0; }\n' > t.c
          printf 'cmake_minimum_required(VERSION 3.20)\nproject(t C)\nadd_executable(t t.c)\n' > CMakeLists.txt
          printf "project('t', 'c')\nexecutable('t', 't.c')\n" > meson.build
          mkdir pc
          printf 'Name: t\nDescription: t\nVersion: 1.2.3\nCflags: -I/t\n' > pc/t.pc
          cat > calc.y <<'EOF'
          %{
          #include <stdio.h>
          int yylex(void);
          static void yyerror(const char *s) { fprintf(stderr, "%s\n", s); }
          %}
          %token NUM
          %left '+'
          %%
          line: expr '\n' { printf("%d\n", $1); } ;
          expr: NUM | expr '+' expr { $$ = $1 + $3; } ;
          %%
          int main(void) { return yyparse(); }
          EOF
          cat > calc.l <<'EOF'
          %{
          #include "calc.tab.h"
          %}
          %option noyywrap nounput noinput
          %%
          [0-9]+  { yylval = atoi(yytext); return NUM; }
          [+\n]   { return yytext[0]; }
          [ \t]   ;
          %%
          EOF
          if has cmake && has ninja; then
            cmake -G Ninja -S . -B cmake-build
            cmake --build cmake-build
          fi
          if has meson && has ninja; then
            meson setup meson-build
            ninja -C meson-build
          fi
          if has pkg-config; then
            test "$(PKG_CONFIG_PATH="$work/pc" pkg-config --modversion t)" = 1.2.3
          fi
          if has m4; then
            test "$(printf 'define(`x'"'"', `ok'"'"')x\n' | m4)" = ok
          fi
          if has bison && has flex && has m4; then
            bison -d calc.y
            flex calc.l
            cc -o calc calc.tab.c lex.yy.c
            test "$(echo '1 + 2' | ./calc)" = 3
          fi
          echo "smoke-tested: $(cat "$tree/commands")"

      - name: Validate recipe
        env:
          RECIPE: ${{ matrix.recipe }}
        run: cvcpkg validate "recipes/$RECIPE"

      - name: Build ${{ matrix.recipe }}
        env:
          RECIPE: ${{ matrix.recipe }}
          CONFIG: ${{ inputs.config || 'release' }}
          LINK: ${{ inputs.link || 'shared' }}
          DEPS: ${{ matrix.deps }}
        run: |
          set -euo pipefail
          prefix="$GITHUB_WORKSPACE/prefix"
          dist="$GITHUB_WORKSPACE/dist"
          mkdir -p "$prefix" "$dist"
          if [ "$DEPS" = catalog ]; then
            # Install the recipe's PUBLISHED build + runtime closure (its
            # depends.build tools included, on a native build), then pack only
            # the recipe against it, into dist/ and nowhere else.
            echo "::group::cvcpkg install-deps recipes/$RECIPE --platform macos --link $LINK"
            cvcpkg install-deps "recipes/$RECIPE" --platform macos --config "$CONFIG" \
              --link "$LINK" --prefix "$prefix" --recipes-dir recipes
            echo "::endgroup::"
            echo "cvcpkg pack recipes/$RECIPE --platform macos --link $LINK"
            cvcpkg pack "recipes/$RECIPE" --platform macos --config "$CONFIG" \
              --link "$LINK" --prefix "$prefix" --output-dir "$dist" --recipes-dir recipes
          else
            # Build the whole closure from source first, in topological order.
            echo "cvcpkg build $RECIPE --with-deps --platform macos --link $LINK"
            cvcpkg build "$RECIPE" --local --recipes-dir recipes --config "$CONFIG" \
              --prefix "$prefix" --platform macos --link "$LINK" --with-deps
          fi

      - name: Show the packed bundle
        if: always()
        run: |
          shopt -s nullglob
          archives=("$GITHUB_WORKSPACE"/dist/*.tar.gz)
          if [ ${#archives[@]} -eq 0 ]; then
            echo "no bundle in dist/"
            exit 0
          fi
          for a in "${archives[@]}"; do
            ls -l "$a"
            tar -tzf "$a" | sort
          done
