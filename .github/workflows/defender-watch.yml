# Rescan the latest released cvcpkg Windows binary with Microsoft Defender's
# current definitions, every day.
#
# A release can ship clean and be flagged later: Defender's machine-learned
# signatures quarantined 2.5.13 as Trojan:Win32/Bearfoos.A!ml two days after it
# was released (2.5.0 and 2.5.12 went the same way). A failed run here is the
# signal to act before users and the Windows builders lose the binary: submit it
# to Microsoft as a false positive and cut a new build.
#
# It also runs on pull requests that touch the scan script or this file, so a
# change to either is tested before it lands.

name: Defender watch

on:
  schedule:
    - cron: '17 9 * * *'
  workflow_dispatch:
  pull_request:
    paths:
      - scripts/defender-scan.ps1
      - .github/workflows/defender-watch.yml

permissions:
  contents: read

concurrency:
  group: defender-watch-${{ github.ref }}
  cancel-in-progress: true

jobs:
  scan:
    name: Scan the latest Windows release
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - name: Download the latest release's Windows binary
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag=$(gh release view --repo "$GITHUB_REPOSITORY" --json tagName -q .tagName)
          echo "latest release: $tag"
          mkdir rel
          gh release download "$tag" --repo "$GITHUB_REPOSITORY" --dir rel \
            --pattern 'cvcpkg-windows-x86_64.exe' --pattern 'cvcpkg-windows-x86_64.exe.sha256'
          (cd rel && sha256sum -c cvcpkg-windows-x86_64.exe.sha256)
          echo "### Defender scan of \`$tag\` Windows binary" >> "$GITHUB_STEP_SUMMARY"

      - name: Scan
        shell: pwsh
        run: ./scripts/defender-scan.ps1 -CI -Path rel/cvcpkg-windows-x86_64.exe
