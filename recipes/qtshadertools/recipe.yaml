schema_version: 1
recipe:
  name: qtshadertools
  upstream_version: "6.8.2"
  cvc_revision: 3
  maintainer: "cvcpkg group"
  maintainer_email: "info@cvcpkg.org"
  maintainer_url: "https://cvcpkg.org"
  description: "Qt 6 ShaderTools — GLSL and SPIR-V shader processing utilities."
  homepage: https://www.qt.io/
  license: LGPL-3.0-only
  tags: [graphics]

source:
  # Built from the source package qtshadertools-src, which pins the upstream tarball
  # (https://download.qt.io/archive/qt/6.8/6.8.2/submodules/qtshadertools-everywhere-src-6.8.2.tar.xz).
  type: package
  package: qtshadertools-src

patches: []

depends:
  build:
    - name: qtshadertools-src
      version: "==6.8.2"
    - cmake
    - ninja
    - name: python3
      platforms: [linux, macos, freebsd, openbsd, netbsd]
    - name: python312
      platforms: [windows]
    - perl
  runtime:
    - {name: qt6, version: ">=6.8"}
  host_tools: []

build:
  matrix:
    - platform: linux
      script: build.sh
      env:
        CXXFLAGS: "-O2 -fPIC -std=c++17"
    - platform: macos
      script: build.sh
      env:
        MACOSX_DEPLOYMENT_TARGET: "13.0"
    - platform: freebsd
      script: build.sh
      env:
        CXXFLAGS: "-O2 -fPIC -std=c++17"
    - platform: openbsd
      script: build.sh
      env:
        CXXFLAGS: "-O2 -fPIC -std=c++17"
    - platform: netbsd
      script: build.sh
      env:
        CXXFLAGS: "-O2 -fPIC -std=c++17"
    - platform: windows
      script: build.ps1
    - platform: wasm
      host_platform: linux
      script: build-wasm.sh
      env:
        CXXFLAGS: "-O2 -std=c++17"
    - platform: wasm
      host_platform: macos
      script: build-wasm.sh
      env:
        MACOSX_DEPLOYMENT_TARGET: "13.0"
    - platform: wasm
      host_platform: windows
      script: build-wasm.ps1

package:
  files:
    # macOS builds Qt as frameworks: a module's library and headers live in
    # lib/Qt<Module>.framework/, and Qt writes no pkg-config files for a
    # framework build (nor on Windows by default).  Scoping these never drops
    # files -- packing takes the whole staged tree; package.files declares
    # what must exist (macos-15-intel populate 39171736755: "lib/pkgconfig/Qt6*
    # matches nothing").
    - { glob: "lib/libQt6ShaderTools*", platforms: [linux, windows, freebsd, openbsd, netbsd, wasm] }
    - { glob: "lib/Qt6ShaderTools*", platforms: [linux, windows, freebsd, openbsd, netbsd, wasm] }
    - { glob: "lib/QtShaderTools.framework/", platforms: [macos] }
    - lib/cmake/Qt6ShaderTools*/
    - { glob: "lib/pkgconfig/Qt6ShaderTools*", platforms: [linux, freebsd, openbsd, netbsd] }
    - { glob: "include/QtShaderTools/", platforms: [linux, windows, freebsd, openbsd, netbsd, wasm] }
  cmake_packages:
    - { name: Qt6ShaderTools, targets: ["Qt6::ShaderTools"] }

abi:
  cxx_std: 17
