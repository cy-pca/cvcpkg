schema_version: 1
recipe:
  name: flask-cp312
  upstream_version: "3.1.3"
  # cvc.3: republish.  The published noarch cvc.2 bundle's console scripts
  # (flask) carry the build machine's interpreter as their shebang (the old
  # libcvc-deps macOS CI prefix), so they cannot run anywhere; packing today
  # rewrites it to /usr/bin/env.
  cvc_revision: 3

  maintainer: "cvcpkg group"
  maintainer_email: "info@cvcpkg.org"
  maintainer_url: "https://cvcpkg.org"
  homepage: https://pypi.org/project/flask/
  license: "BSD-3-Clause"
  tags: [python, source]
  description: >-
    flask 3.1.3 for CPython 3.12 — the cp312 column of
    cvcpkg's per-interpreter matrix (pure-Python, built from the PyPI sdist);
    generated by tools/gen_python_recipes.py.
    Built FROM SOURCE: cvcpkg fetches and sha256-verifies the PyPI sdist,
    and build.sh compiles the wheel with the prefix's own CPython 3.12 —
    no third-party prebuilt binary enters the bundle.

# From-source sdist, sha256 as published by PyPI for this exact version.
source:
  # Built from the source package flask-src, which pins the upstream tarball
  # (https://files.pythonhosted.org/packages/26/00/35d85dcce6c57fdc871f3867d465d780f302a175ea360f62533f12b27e2b/flask-3.1.3.tar.gz).
  type: package
  package: flask-src

python:
  interpreter: python312
  abi: cp312

patches: []

depends:
  build:
    - name: flask-src
      version: "==3.1.3"
    - name: python312
    - name: blinker-cp312
    - name: click-cp312
    - name: itsdangerous-cp312
    - name: jinja2-cp312
    - name: markupsafe-cp312
    - name: werkzeug-cp312
    # PEP-517 build backend, from this sdist's [build-system] requires.
    # --no-build-isolation means pip will NOT fetch it, so it has to be
    # in the build prefix already (build.sh bridges it onto sys.path).
    - name: flit-core-cp312
  runtime:
    - name: python312
    - name: blinker-cp312
    - name: click-cp312
    - name: itsdangerous-cp312
    - name: jinja2-cp312
    - name: markupsafe-cp312
    - name: werkzeug-cp312
  host_tools:
    - python312

build:
  build_type_independent: true
  matrix:
    - platform: any
      script: build.sh
    - platform: windows
      script: build.ps1

package:
  files:
    - { glob: "lib/python3.12/site-packages/flask/", platforms: [any] }
    - { glob: "lib/python3.12/site-packages/flask-*.dist-info/", platforms: [any] }
    - { glob: "Lib/site-packages/flask/", platforms: [windows] }
    - { glob: "Lib/site-packages/*.dist-info/", platforms: [windows] }
