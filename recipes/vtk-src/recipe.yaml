schema_version: 1
recipe:
  name: vtk-src
  upstream_version: "9.5.0"
  cvc_revision: 1
  maintainer: cvcpkg group
  maintainer_email: info@cvcpkg.org
  maintainer_url: https://cvcpkg.org
  homepage: https://vtk.org/
  license: BSD-3-Clause
  tags: [source]
  description: >-
    The unmodified upstream source of vtk 9.5.0: its release tarball, verified
    against the sha256 below and staged at src/vtk-src/.  The vtk,
    vtk-python-cp311, vtk-python-cp312 and vtk-python-cp313 recipes build from
    it (source.type package), so the tarball is fetched once, from www.vtk.org,
    and every other build of them -- another platform, a builder that cannot
    reach www.vtk.org, a user building from source -- installs this package from
    the catalog instead.  Generated by tools/make_source_package.py.

source:
  type: tarball
  url: https://www.vtk.org/files/release/9.5/VTK-9.5.0.tar.gz
  sha256: "04ae86246b9557c6b61afbc534a6df099244fbc8f3937f82e6bc0570953af87d"
  strip_components: 1

patches: []

depends:
  build: []
  runtime: []
  host_tools: []

build:
  build_type_independent: true
  matrix:
    - platform: any
      script: build.sh

package:
  files:
    - src/vtk-src/
