schema_version: 1
recipe:
  name: libice
  upstream_version: "1.1.2"
  cvc_revision: 2
  maintainer: "cvcpkg group"
  maintainer_email: "info@cvcpkg.org"
  maintainer_url: "https://cvcpkg.org"
  homepage: https://www.x.org/
  license: MIT
  tags: [libraries, x11, graphics]
  description: >-
    Inter-Client Exchange library (ICE) — session/protocol substrate for libSM.

source:
  # Built from the source package libice-src, which pins the upstream tarball
  # (https://xorg.freedesktop.org/releases/individual/lib/libICE-1.1.2.tar.xz).
  type: package
  package: libice-src

patches: []

depends:
  build:
    - name: libice-src
      version: "==1.1.2"
    - pkg-config
    - name: xorgproto
    - name: xtrans
  runtime: []
  host_tools: []

package:
  files:
    - lib/
    - include/
    - share/

build:
  matrix:
    - platform: linux
      script: build.sh
    - platform: freebsd
      script: build.sh
    - platform: openbsd
      script: build.sh
    - platform: netbsd
      script: build.sh
