schema_version: 1
recipe:
  name: wadler-lindig-cp313
  upstream_version: "0.1.7"
  cvc_revision: 2

  maintainer: "cvcpkg group"
  maintainer_email: "info@cvcpkg.org"
  maintainer_url: "https://cvcpkg.org"
  homepage: https://pypi.org/project/wadler-lindig/
  license: "Apache-2.0"
  tags: [python, source]
  description: >-
    wadler-lindig 0.1.7 for CPython 3.13 — the cp313 column of
    cvcpkg's per-interpreter matrix (pure-Python, built from the PyPI sdist);
    generated by tools/gen_python_recipes.py.
    Built FROM SOURCE: cvcpkg fetches and sha256-verifies the PyPI sdist,
    and build.sh compiles the wheel with the prefix's own CPython 3.13 —
    no third-party prebuilt binary enters the bundle.

# From-source sdist, sha256 as published by PyPI for this exact version.
source:
  # Built from the source package wadler-lindig-src, which pins the upstream tarball
  # (https://files.pythonhosted.org/packages/1e/67/cbae4bf7683a64755c2c1778c418fea96d00e34395bb91743f08bd951571/wadler_lindig-0.1.7.tar.gz).
  type: package
  package: wadler-lindig-src

python:
  interpreter: python313
  abi: cp313

patches: []

depends:
  build:
    - name: wadler-lindig-src
      version: "==0.1.7"
    - name: python313
    # PEP-517 build backend, from this sdist's [build-system] requires.
    # --no-build-isolation means pip will NOT fetch it, so it has to be
    # in the build prefix already (build.sh bridges it onto sys.path).
    - name: hatchling-cp313
    - name: packaging-cp313
    - name: pathspec-cp313
    - name: pluggy-cp313
    - name: trove-classifiers-cp313
    - name: calver-cp313
  runtime:
    - name: python313
  host_tools:
    - python313

build:
  build_type_independent: true
  matrix:
    - platform: any
      script: build.sh
    - platform: windows
      script: build.ps1

package:
  files:
    - { glob: "lib/python3.13/site-packages/wadler_lindig/", platforms: [any] }
    - { glob: "lib/python3.13/site-packages/wadler_lindig-*.dist-info/", platforms: [any] }
    - { glob: "Lib/site-packages/wadler_lindig/", platforms: [windows] }
    - { glob: "Lib/site-packages/wadler_lindig-*.dist-info/", platforms: [windows] }
