schema_version: 1
recipe:
  name: freetype-src
  upstream_version: "2.13.3"
  cvc_revision: 1
  maintainer: cvcpkg group
  maintainer_email: info@cvcpkg.org
  maintainer_url: https://cvcpkg.org
  homepage: https://freetype.org/
  license: FTL
  tags: [source]
  description: >-
    The unmodified upstream source of freetype 2.13.3: its release tarball,
    verified against the sha256 below and staged at src/freetype-src/.  The freetype
    recipe builds from it (source.type package), so the tarball is fetched
    once, from download.savannah.gnu.org, and every other build of freetype -- another
    platform, a builder that cannot reach download.savannah.gnu.org, a user building from
    source -- installs this package from the catalog instead.  Generated by
    tools/make_source_package.py.

source:
  type: tarball
  url: https://download.savannah.gnu.org/releases/freetype/freetype-2.13.3.tar.xz
  sha256: "0550350666d427c74daeb85d5ac7bb353acba5f76956395995311a9c6f063289"
  strip_components: 1

patches: []

depends:
  build: []
  runtime: []
  host_tools: []

build:
  build_type_independent: true
  matrix:
    - platform: any
      script: build.sh

package:
  files:
    - src/freetype-src/
