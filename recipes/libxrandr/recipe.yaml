schema_version: 1
recipe:
  name: libxrandr
  upstream_version: "1.5.5"
  cvc_revision: 1
  maintainer: "cvcpkg group"
  maintainer_email: "info@cvcpkg.org"
  maintainer_url: "https://cvcpkg.org"
  homepage: https://www.x.org/
  license: MIT
  tags: [libraries, x11, graphics]
  description: >-
    X Resize, Rotate and Reflect Extension client library (Xrandr).

source:
  # Built from the source package libxrandr-src, which pins the upstream tarball
  # (https://xorg.freedesktop.org/releases/individual/lib/libXrandr-1.5.5.tar.xz).
  type: package
  package: libxrandr-src

patches: []

depends:
  build:
    - name: libxrandr-src
      version: "==1.5.5"
    - pkg-config
    - name: xorgproto
  runtime:
    - name: libx11
    - name: libxext
    - name: libxrender
  host_tools: []

package:
  files:
    - lib/
    - include/
    - share/

build:
  matrix:
    - platform: linux
      script: build.sh
    - platform: freebsd
      script: build.sh
    - platform: openbsd
      script: build.sh
    - platform: netbsd
      script: build.sh
