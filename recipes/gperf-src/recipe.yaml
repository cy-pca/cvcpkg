  upstream_version: "3.1"
  cvc_revision: 1
  maintainer: cvcpkg group
  maintainer_email: info@cvcpkg.org
  maintainer_url: https://cvcpkg.org
  homepage: https://www.gnu.org/software/gperf/
  license: GPL-3.0-or-later
  tags: [source]
  description: >-
    The unmodified upstream source of gperf 3.1: its release tarball,
    verified against the sha256 below and staged at src/gperf-src/.  The gperf
    recipe builds from it (source.type package), so the tarball is fetched
    once, from ftp.gnu.org, and every other build of gperf -- another
