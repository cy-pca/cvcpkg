schema_version: 1
recipe:
  name: libgeos
  upstream_version: "3.13.0"
  # cvc.3: relocatable .pc/.cmake/bin/*-config.  The published cvc.2
  # kept build-machine paths (/tmp/cvcpkg-builder/...) in them, so pkg-config,
  # find_package or the -config script handed consumers dead -I/-L paths
  # (2026-10-13 scan of every published linux bundle).
  cvc_revision: 3
  maintainer: "cvcpkg group"
  maintainer_email: "info@cvcpkg.org"
  maintainer_url: "https://cvcpkg.org"
  description: "GEOS — Geometry Engine, Open Source. A C/C++ computational-geometry library with a stable C API (libgeos_c); the geometry backend behind Shapely, PostGIS, and QGIS."
  homepage: https://libgeos.org
  license: LGPL-2.1-only
  tags: [geometry, gis, math]

source:
  # Built from the source package libgeos-src, which pins the upstream tarball
  # (https://download.osgeo.org/geos/geos-3.13.0.tar.bz2).
  type: package
  package: libgeos-src

patches: []

depends:
  build:
    - name: libgeos-src
      version: "==3.13.0"
    - cmake
    - ninja
  runtime: []
  host_tools: []

build:
  matrix:
    - platform: linux
      script: build.sh
      env:
        CFLAGS: "-O2 -fPIC"
        CXXFLAGS: "-O2 -fPIC"
    - platform: macos
      script: build.sh
      env:
        MACOSX_DEPLOYMENT_TARGET: "13.0"
    - platform: freebsd
      script: build.sh
      env:
        CFLAGS: "-O2 -fPIC"
        CXXFLAGS: "-O2 -fPIC"
    - platform: openbsd
      script: build.sh
      env:
        CFLAGS: "-O2 -fPIC"
        CXXFLAGS: "-O2 -fPIC"
    - platform: netbsd
      script: build.sh
      env:
        CFLAGS: "-O2 -fPIC"
        CXXFLAGS: "-O2 -fPIC"
    - platform: windows
      script: build.ps1
    - platform: wasm
      host_platform: linux
      script: build-wasm.sh
    - platform: wasm
      host_platform: windows
      script: build-wasm.ps1
    - platform: wasi
      host_platform: linux
      script: build-wasi.sh
    - platform: wasi
      host_platform: windows
      script: build-wasi.ps1
    - platform: cosmo
      host_platform: linux
      script: build-cosmo.sh

package:
  files:
    - lib/libgeos*
    - lib/geos*
    - lib/cmake/GEOS/
    # GEOS's CMake writes geos.pc everywhere but Windows.
    - { glob: "lib/pkgconfig/geos.pc", platforms: [linux, macos, freebsd, openbsd, netbsd, wasm, wasi, cosmo] }
    - include/geos.h
    - include/geos_c.h
    - include/geos/
  cmake_packages:
    - { name: GEOS, targets: ["GEOS::geos", "GEOS::geos_c"] }
  pkg_config:
    - geos

abi:
  cxx_std: 17
