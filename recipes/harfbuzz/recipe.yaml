schema_version: 1
recipe:
  name: harfbuzz
  upstream_version: "10.2.0"
  # cvc.2: relocatable .pc/.cmake/bin/*-config.  The published cvc.1
  # kept build-machine paths (/tmp/cvcpkg-builder/...) in them, so pkg-config,
  # find_package or the -config script handed consumers dead -I/-L paths
  # (2026-10-13 scan of every published linux bundle).
  # cvc.3: macOS builds the CoreText integration (hb-coretext.h,
  # hb_coretext_*), which pango's CoreText backend needs.
  cvc_revision: 3
  maintainer: "cvcpkg group"
  maintainer_email: "info@cvcpkg.org"
  maintainer_url: "https://cvcpkg.org"
  homepage: https://harfbuzz.github.io/
  license: MIT
  tags: [libraries]
  description: >-
    HarfBuzz — an OpenType text shaping engine.  Required by Pango
    and Cairo for complex text layout and font shaping.

source:
  type: tarball
  url: https://github.com/harfbuzz/harfbuzz/releases/download/10.2.0/harfbuzz-10.2.0.tar.xz
  sha256: "620e3468faec2ea8685d32c46a58469b850ef63040b3565cde05959825b48227"
  strip_components: 1

patches: []

depends:
  build:
    # meson.cmd runs the prefix's python.exe.  Declared, as pkg-config and glib
    # do: the builder installs only the runtime deps beneath a recipe's own, so
    # one no longer arrives through another dep's build edge.
    - name: python312
      platforms: [windows]
    - ninja
    - meson
    - pkg-config
  runtime:
    - name: glib
      version: "^2.80"
    - name: freetype
      version: "^2.13"
  host_tools: []

build:
  matrix:
    - platform: linux
      script: build.sh
      env:
        CFLAGS: "-O2 -fPIC"
    - platform: macos
      script: build.sh
      env:
        MACOSX_DEPLOYMENT_TARGET: "13.0"
    - platform: freebsd
      script: build.sh
      env:
        CFLAGS: "-O2 -fPIC"
    - platform: openbsd
      script: build.sh
      env:
        CFLAGS: "-O2 -fPIC"
    - platform: netbsd
      script: build.sh
      env:
        CFLAGS: "-O2 -fPIC"
    - platform: windows
      script: build.ps1

package:
  files:
    - { glob: "lib/libharfbuzz*", platforms: [linux, macos, freebsd, openbsd, netbsd] }
    # MSVC (build.ps1, meson): harfbuzz.lib, harfbuzz-subset.lib and
    # harfbuzz-gobject.lib, with the DLLs in bin/ (windows populate 2026-10-19:
    # "lib/libharfbuzz* matches nothing").
    - { glob: "lib/harfbuzz*.lib", platforms: [windows] }
    - { glob: "bin/harfbuzz*.dll", platforms: [windows] }
    - lib/pkgconfig/harfbuzz*.pc
    - lib/cmake/harfbuzz/
    - include/harfbuzz/
  cmake_packages:
    - { name: harfbuzz, targets: ["harfbuzz::harfbuzz"] }
  pkg_config:
    - harfbuzz
    - harfbuzz-gobject

abi:
  cxx_std: 17
