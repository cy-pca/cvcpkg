schema_version: 1
recipe:
  name: equinox-cp313
  upstream_version: "0.13.8"
  cvc_revision: 1

  maintainer: "cvcpkg group"
  maintainer_email: "info@cvcpkg.org"
  maintainer_url: "https://cvcpkg.org"
  homepage: https://pypi.org/project/equinox/
  license: "Apache-2.0"
  tags: [python, source]
  description: >-
    equinox 0.13.8 for CPython 3.13 — the cp313 column of
    cvcpkg's per-interpreter matrix (pure-Python, built from the PyPI sdist);
    generated by tools/gen_python_recipes.py.
    Built FROM SOURCE: cvcpkg fetches and sha256-verifies the PyPI sdist,
    and build.sh compiles the wheel with the prefix's own CPython 3.13 —
    no third-party prebuilt binary enters the bundle.

# From-source sdist, sha256 as published by PyPI for this exact version.
source:
  # Built from the source package equinox-src, which pins the upstream tarball
  # (https://files.pythonhosted.org/packages/19/ff/522336d2f8264f2ad97119710b76e2cddf66145d03a1e89899175d26b192/equinox-0.13.8.tar.gz).
  type: package
  package: equinox-src

python:
  interpreter: python313
  abi: cp313

patches: []

depends:
  build:
    - name: equinox-src
      version: "==0.13.8"
    - name: python313
    - name: jax-cp313
    - name: jaxtyping-cp313
    - name: typing-extensions-cp313
    - name: wadler-lindig-cp313
    # PEP-517 build backend, from this sdist's [build-system] requires.
    # --no-build-isolation means pip will NOT fetch it, so it has to be
    # in the build prefix already (build.sh bridges it onto sys.path).
    - name: hatchling-cp313
    - name: packaging-cp313
    - name: pathspec-cp313
    - name: pluggy-cp313
    - name: trove-classifiers-cp313
    - name: calver-cp313
  runtime:
    - name: python313
    - name: jax-cp313
    - name: jaxtyping-cp313
    - name: typing-extensions-cp313
    - name: wadler-lindig-cp313
  host_tools:
    - python313

build:
  build_type_independent: true
  matrix:
    - platform: any
      script: build.sh

package:
  files:
    - lib/python3.13/site-packages/equinox/
    - lib/python3.13/site-packages/equinox-*.dist-info/
