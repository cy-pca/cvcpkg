schema_version: 1
recipe:
  name: nginx-src
  upstream_version: "1.30.5"
  cvc_revision: 1
  maintainer: cvcpkg group
  maintainer_email: info@cvcpkg.org
  maintainer_url: https://cvcpkg.org
  homepage: https://nginx.org/
  license: BSD-2-Clause
  tags: [source]
  description: >-
    The unmodified upstream source of nginx 1.30.5: its release tarball,
    verified against the sha256 below and staged at src/nginx-src/.  The nginx
    recipe builds from it (source.type package), so the tarball is fetched once,
    from nginx.org, and every other build of nginx -- another platform, a
    builder that cannot reach nginx.org, a user building from source -- installs
    this package from the catalog instead.  Generated by
    tools/make_source_package.py.

source:
  type: tarball
  # PGP-signed by Sergey Kandaurov (nginx.org/keys/pluknet.key,
  # D6786CE303D9A9022998DC6CC8464D549AF75C0A); signature checked when this
  # version was pinned.
  url: https://nginx.org/download/nginx-1.30.5.tar.gz
  sha256: "6c20565aa2325cb82216ae804f4a4ff1875179014759a381c42ddc8e11c4906d"
  strip_components: 1

patches: []

depends:
  build: []
  runtime: []
  host_tools: []

build:
  build_type_independent: true
  matrix:
    - platform: any
      script: build.sh

package:
  files:
    - src/nginx-src/
