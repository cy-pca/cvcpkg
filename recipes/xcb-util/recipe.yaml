schema_version: 1
recipe:
  name: xcb-util
  upstream_version: "0.4.1"
  cvc_revision: 2
  maintainer: "cvcpkg group"
  maintainer_email: "info@cvcpkg.org"
  maintainer_url: "https://cvcpkg.org"
  homepage: https://xcb.freedesktop.org/
  license: MIT
  tags: [libraries, x11, graphics]
  description: >-
    XCB utility functions (aux, atom, event) atop libxcb.

source:
  # Built from the source package xcb-util-src, which pins the upstream tarball
  # (https://xorg.freedesktop.org/releases/individual/xcb/xcb-util-0.4.1.tar.xz).
  type: package
  package: xcb-util-src

patches: []

depends:
  build:
    - name: xcb-util-src
      version: "==0.4.1"
    - pkg-config
  runtime:
    - name: libxcb
  host_tools: []

package:
  files:
    - lib/
    - include/

build:
  matrix:
    - platform: linux
      script: build.sh
    - platform: freebsd
      script: build.sh
    - platform: openbsd
      script: build.sh
    - platform: netbsd
      script: build.sh
