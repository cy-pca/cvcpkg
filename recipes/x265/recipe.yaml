schema_version: 1
recipe:
  name: x265
  upstream_version: "4.1"
  cvc_revision: 1
  maintainer: "cvcpkg group"
  maintainer_email: "info@cvcpkg.org"
  maintainer_url: "https://cvcpkg.org"
  homepage: https://x265.readthedocs.io/
  license: GPL-2.0-or-later
  tags: [libraries, multimedia, video]
  description: >-
    x265 — H.265/HEVC video encoder.  Provides high-efficiency video
    encoding for FFmpeg (--enable-gpl --enable-libx265).  CMake-based
    build; the standalone encoder CLI is excluded.
    Assembly optimisations require nasm on x86 platforms.

source:
  # Built from the source package x265-src, which pins the upstream tarball
  # (https://bitbucket.org/multicoreware/x265_git/downloads/x265_4.1.tar.gz).
  type: package
  package: x265-src

patches: []

depends:
  build:
    - name: x265-src
      version: "==4.1"
    - name: nasm
      platforms: [linux, macos, freebsd, openbsd, netbsd, windows]
    - cmake
    - ninja
    - pkg-config
  runtime: []
  host_tools: []

build:
  matrix:
    - platform: linux
      script: build.sh
      env:
        CFLAGS: "-O2 -fPIC"
        CXXFLAGS: "-O2 -fPIC"
    - platform: macos
      script: build.sh
      env:
        MACOSX_DEPLOYMENT_TARGET: "13.0"
    - platform: freebsd
      script: build.sh
      env:
        CFLAGS: "-O2 -fPIC"
        CXXFLAGS: "-O2 -fPIC"
    - platform: openbsd
      script: build.sh
      env:
        CFLAGS: "-O2 -fPIC"
        CXXFLAGS: "-O2 -fPIC"
    - platform: netbsd
      script: build.sh
      env:
        CFLAGS: "-O2 -fPIC"
        CXXFLAGS: "-O2 -fPIC"
    - platform: windows
      script: build.ps1

package:
  files:
    - lib/libx265*
    - lib/pkgconfig/x265.pc
    - include/x265*.h
    - bin/libx265-*.dll
  pkg_config:
    - x265
