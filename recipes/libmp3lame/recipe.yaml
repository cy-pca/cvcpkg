schema_version: 1
recipe:
  name: libmp3lame
  upstream_version: "3.100"
  # cvc.2: Windows builds with MSYS path conversion on.  MSYS_NO_PATHCONV=1 made
  # libtool's `cmd //c echo` start an interactive cmd.exe that hung every libtool
  # link on the dev Windows builder (see build.ps1).  Other platforms unchanged.
  # cvc.3: Windows declares its MinGW toolchain (msys2/make/mingw-w64-gcc)
  # instead of using the builder's; see depends.build.
  cvc_revision: 3
  maintainer: "cvcpkg group"
  maintainer_email: "info@cvcpkg.org"
  maintainer_url: "https://cvcpkg.org"
  homepage: https://lame.sourceforge.net/
  license: LGPL-2.0-or-later
  tags: [libraries, multimedia, audio]
  description: >-
    LAME — the LAME MP3 encoder library.  Provides MP3 encoding
    support for FFmpeg (--enable-libmp3lame) and other audio tools.
    Only the library is built; the lame frontend binary is omitted.

source:
  # Built from lame-src, the source package of the lame recipe: both build from
  # the same upstream tarball
  # (https://sourceforge.net/projects/lame/files/lame/3.100/lame-3.100.tar.gz/download).
  type: package
  package: lame-src

patches: []

depends:
  build:
    - name: lame-src
      version: "==3.100"
    # Windows: the MinGW toolchain is a declared build dep, staged into the BUILD
    # prefix (build.ps1 puts its bin first on PATH), not whatever MSYS2 the
    # builder has.  The prod builder cmps-a91453 has an incomplete one: lame
    # and libmp3lame died there with "configure: error: no acceptable ld found
    # in $PATH" while they built on sandipaws.  As recipes/gmp.
    - name: msys2
      platforms: [windows]
    - name: make
      platforms: [windows]
    - name: mingw-w64-gcc
      platforms: [windows]
    - pkg-config
  runtime: []
  host_tools: []

build:
  matrix:
    - platform: linux
      script: build.sh
      env:
        CFLAGS: "-O2 -fPIC"
    - platform: macos
      script: build.sh
      env:
        MACOSX_DEPLOYMENT_TARGET: "13.0"
    - platform: freebsd
      script: build.sh
      env:
        CFLAGS: "-O2 -fPIC"
    - platform: openbsd
      script: build.sh
      env:
        CFLAGS: "-O2 -fPIC"
    - platform: netbsd
      script: build.sh
      env:
        CFLAGS: "-O2 -fPIC"
    - platform: windows
      script: build.ps1

package:
  files:
    - lib/libmp3lame*
    - include/lame/
    - bin/libmp3lame-*.dll
  pkg_config: []
