schema_version: 1
recipe:
  name: pcre2
  upstream_version: "10.44"
  # cvc.6: relocatable .pc/.cmake/bin/*-config.  The published cvc.5
  # kept build-machine paths (/tmp/cvcpkg-builder/...) in them, so pkg-config,
  # find_package or the -config script handed consumers dead -I/-L paths
  # (2026-10-13 scan of every published linux bundle).
  cvc_revision: 6
  maintainer: "cvcpkg group"
  maintainer_email: "info@cvcpkg.org"
  maintainer_url: "https://cvcpkg.org"
  homepage: https://www.pcre.org/
  license: BSD-3-Clause
  tags: [utils, wasm, wasi]
  description: >-
    PCRE2 — Perl Compatible Regular Expressions library.
    Used as a dependency of SWIG.

source:
  type: tarball
  url: https://github.com/PCRE2Project/pcre2/releases/download/pcre2-10.44/pcre2-10.44.tar.gz
  sha256: "86b9cb0aa3bcb7994faa88018292bc704cdbb708e785f7c74352ff6ea7d3175b"
  strip_components: 1

patches: []

depends:
  build:
    - cmake
    - ninja
    # test.sh checks libpcre2-8.pc with cvcpkg's own pkg-config.  On Windows it
    # used to find Strawberry Perl's pkg-config script, which Git Bash's perl
    # cannot run ("Can't locate Pod/Usage.pm"), so every Windows build failed its
    # test.  Scoped to where pkg-config is published; haiku and cosmo keep the
    # host's.
    - name: pkg-config
      platforms: [linux, macos, freebsd, openbsd, netbsd, windows]
  runtime: []
  host_tools: []

build:
  matrix:
    - platform: linux
      script: build.sh
      env:
        CFLAGS: "-O2 -fPIC"
    - platform: macos
      script: build.sh
      env:
        MACOSX_DEPLOYMENT_TARGET: "13.0"
    - platform: freebsd
      script: build.sh
      env:
        CFLAGS: "-O2 -fPIC"
    - platform: openbsd
      script: build.sh
      env:
        CFLAGS: "-O2 -fPIC"
    - platform: netbsd
      script: build.sh
      env:
        CFLAGS: "-O2 -fPIC"
    - platform: haiku
      script: build.sh
      env:
        CFLAGS: "-O2 -fPIC"
    - platform: windows
      script: build.ps1
    - platform: wasm
      host_platform: linux
      script: build-wasm.sh
    - platform: wasm
      host_platform: windows
      script: build-wasm.ps1
    - platform: wasi
      host_platform: linux
      script: build-wasi.sh
    - platform: wasi
      host_platform: windows
      script: build-wasi.ps1
    - platform: cosmo
      host_platform: linux
      script: build-cosmo.sh

package:
  files:
    - { glob: "lib/libpcre2-8*", platforms: [linux, macos, freebsd, openbsd, netbsd, haiku, wasm, wasi, cosmo] }
    - { glob: "lib/libpcre2-16*", platforms: [linux, macos, freebsd, openbsd, netbsd, haiku, wasm, wasi, cosmo] }
    # libpcre2-32 is not built (PCRE2_BUILD_PCRE2_32=OFF); the POSIX wrapper is
    # libpcre2-posix (with a hyphen).
    - { glob: "lib/libpcre2-posix*", platforms: [linux, macos, freebsd, openbsd, netbsd, haiku, wasm, wasi, cosmo] }
    - { glob: "lib/cmake/pcre2/", platforms: [linux, macos, freebsd, openbsd, netbsd, haiku, wasm, wasi, cosmo] }
    # MSVC (build.ps1): pcre2-8.lib and pcre2-8-static.lib etc., and the CMake
    # package in cmake/ at the prefix root, where CMake looks for it on Windows.
    - { glob: "lib/pcre2-8*.lib", platforms: [windows] }
    - { glob: "lib/pcre2-16*.lib", platforms: [windows] }
    - { glob: "lib/pcre2-posix*.lib", platforms: [windows] }
    - { glob: "cmake/pcre2-config*.cmake", platforms: [windows] }
    - lib/pkgconfig/libpcre2*
    - include/pcre2.h
    - include/pcre2posix.h
    - bin/pcre2*
  cmake_packages:
    - { name: pcre2, targets: ["pcre2::pcre2-8", "pcre2::pcre2-16", "pcre2::pcre2-posix"] }

test:
  script: test.sh

toolchain:
  cc:
    min_version: "any"
    description: "C99-capable compiler"

abi:
  cxx_std: 17

notes: []
