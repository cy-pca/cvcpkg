schema_version: 1
recipe:
  name: pyside-setup-src
  upstream_version: "6.8.2"
  cvc_revision: 1
  maintainer: cvcpkg group
  maintainer_email: info@cvcpkg.org
  maintainer_url: https://cvcpkg.org
  homepage: https://doc.qt.io/qtforpython/
  license: LGPL-3.0-only
  tags: [source]
  description: >-
    The unmodified upstream source of pyside-setup 6.8.2: its release tarball,
    verified against the sha256 below and staged at src/pyside-setup-src/.  The
    pyside6-cp311, pyside6-cp312, pyside6-cp313, shiboken6-cp311,
    shiboken6-cp312 and shiboken6-cp313 recipes build from it (source.type
    package), so the tarball is fetched once, from download.qt.io, and every
    other build of them -- another platform, a builder that cannot reach
    download.qt.io, a user building from source -- installs this package from
    the catalog instead.  Generated by tools/make_source_package.py.

source:
  # SAME pinned pyside-setup tarball + sha256 as the `shiboken6` recipe — one
  # source tree carries both sub-projects. This recipe configures
  # sources/pyside6 and consumes the already-installed shiboken6.
  type: tarball
  url: https://download.qt.io/official_releases/QtForPython/pyside6/PySide6-6.8.2-src/pyside-setup-everywhere-src-6.8.2.tar.xz
  sha256: "8422e9aa403f4119e3192853e9b0cfa09e57e3e0a1a3393e7fdf394179c112f8"
  strip_components: 1

patches: []

depends:
  build: []
  runtime: []
  host_tools: []

build:
  build_type_independent: true
  matrix:
    - platform: any
      script: build.sh

package:
  files:
    - src/pyside-setup-src/
