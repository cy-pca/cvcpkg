schema_version: 1
recipe:
  name: gsl-src
  upstream_version: "2.8"
  cvc_revision: 1
  maintainer: cvcpkg group
  maintainer_email: info@cvcpkg.org
  maintainer_url: https://cvcpkg.org
  homepage: https://www.gnu.org/software/gsl/
  license: GPL-3.0-or-later
  tags: [source]
  description: >-
    The unmodified upstream source of gsl 2.8: its release tarball,
    verified against the sha256 below and staged at src/gsl-src/.  The gsl
    recipe builds from it (source.type package), so the tarball is fetched
    once, from ftp.gnu.org, and every other build of gsl -- another
    platform, a builder that cannot reach ftp.gnu.org, a user building from
    source -- installs this package from the catalog instead.  Generated by
    tools/make_source_package.py.

source:
  type: tarball
  url: https://ftp.gnu.org/gnu/gsl/gsl-2.8.tar.gz
  sha256: "6a99eeed15632c6354895b1dd542ed5a855c0f15d9ad1326c6fe2b2c9e423190"
  strip_components: 1

patches: []

depends:
  build: []
  runtime: []
  host_tools: []

build:
  build_type_independent: true
  matrix:
    - platform: any
      script: build.sh

package:
  files:
    - src/gsl-src/
