schema_version: 1
recipe:
  name: tiff
  upstream_version: "4.7.0"
  cvc_revision: 3
  # cvc.3: the OpenBSD bundle also ships libtiff.so.6.1 / libtiffxx.so.6.1 (the
  # OpenBSD library-name convention; env-openbsd.sh's cvc_openbsd_lib_names), so
  # -ltiff resolves there.  Other platforms' bundles are unchanged.
  maintainer: "cvcpkg group"
  maintainer_email: "info@cvcpkg.org"
  maintainer_url: "https://cvcpkg.org"
  description: "libtiff — a library for reading and writing TIFF (Tagged Image File Format) files."
  homepage: https://libtiff.gitlab.io/libtiff/
  license: libtiff
  tags: [graphics, io, wasm, wasi]

source:
  # Built from the source package tiff-src, which pins the upstream tarball
  # (https://download.osgeo.org/libtiff/tiff-4.7.0.tar.gz).
  type: package
  package: tiff-src

patches: []

depends:
  build:
    - name: tiff-src
      version: "==4.7.0"
    - cmake
    - ninja
  runtime:
    - name: zlib
      version: "^1.3"
    - name: libjpeg-turbo
      version: "^3.1"
    - name: xz
      version: "^5.6"
    - name: zstd
      version: "^1.5"
    - name: libwebp
      version: "^1.5"
    - name: lerc
      version: "^4.0"
  host_tools: []

build:
  matrix:
    - platform: linux
      script: build.sh
      env:
        CFLAGS: "-O2 -fPIC"
    - platform: macos
      script: build.sh
      env:
        MACOSX_DEPLOYMENT_TARGET: "13.0"
    - platform: freebsd
      script: build.sh
      env:
        CFLAGS: "-O2 -fPIC"
    - platform: openbsd
      script: build.sh
      env:
        CFLAGS: "-O2 -fPIC"
    - platform: netbsd
      script: build.sh
      env:
        CFLAGS: "-O2 -fPIC"
    - platform: windows
      script: build.ps1
    - platform: wasm
      host_platform: linux
      script: build-wasm.sh
    # Threaded wasm: same build script, -pthread injected by env-wasm.sh's
    # CVC_WASM_THREADS hook.  A separate platform because emscripten cannot
    # link single-threaded objects into a shared-memory build.
    - platform: wasm-mt
      host_platform: linux
      script: build-wasm.sh
      env:
        CVC_WASM_THREADS: "1"
    - platform: wasm
      host_platform: windows
      script: build-wasm.ps1
    - platform: wasi
      host_platform: linux
      script: build-wasi.sh
    - platform: wasi
      host_platform: windows
      script: build-wasi.ps1
    - platform: cosmo
      host_platform: linux
      script: build-cosmo.sh

package:
  files:
    - lib/libtiff*
    - lib/tiff*
    - lib/cmake/tiff/
    - lib/pkgconfig/libtiff*
    - include/tiff.h
    - include/tiffio.h
    - include/tiffio.hxx
    - include/tiffvers.h
    - include/tiffconf.h
  cmake_packages:
    - { name: TIFF, targets: ["TIFF::TIFF"] }

abi:
  cxx_std: 17
