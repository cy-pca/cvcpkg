schema_version: 1
recipe:
  name: openmp
  upstream_version: "21.1.8"
  # Bumped 1 -> 2: added the windows (MSVC) build -- build.ps1, a python311
  # build edge scoped to windows, and the Windows package.files entries. The
  # linux/macos build is unchanged; their bundles embed this recipe.yaml, so the
  # revision moves with it.
  cvc_revision: 2
  maintainer: "cvcpkg group"
  maintainer_email: "info@cvcpkg.org"
  maintainer_url: "https://cvcpkg.org"
  description: >-
    LLVM's OpenMP runtime library (libomp), built standalone. AppleClang ships
    no OpenMP runtime of its own, so find_package(OpenMP) fails on macOS unless
    a libomp is on the prefix -- and consumers that gate on OpenMP_CXX_FOUND
    then silently build serial code. On Windows it is the redistributable
    alternative to MSVC's libomp140.x86_64.dll, which Microsoft does not allow
    shipping (see notes).
  homepage: https://openmp.llvm.org/
  license: Apache-2.0 WITH LLVM-exception
  tags: [runtime, parallel, compiler]

source:
  type: tarball
  # LLVM stopped publishing per-project source tarballs after 21.x -- from 22.x
  # the only source asset is the ~159 MB monorepo. Staying on 21.1.8 keeps this
  # a 1 MB download; moving forward is a deliberate decision, not a routine bump.
  url: https://github.com/llvm/llvm-project/releases/download/llvmorg-21.1.8/openmp-21.1.8.src.tar.xz
  sha256: "856b023748b41ac7b2c83fd8e9f765ff48a4df2fe6777d2811ef7c7ed8f2f977"
  strip_components: 1

patches: []

depends:
  build:
    - cmake
    - ninja
    # Upstream's generators (message-converter.py, generate-def.py) are Python,
    # and runtime/cmake/config-ix.cmake has find_package(Python3 REQUIRED), so
    # there is no build without an interpreter. Declared for windows only:
    # python311 is the CPython cvcpkg publishes for windows (python312 has no
    # windows bundle). The linux/macos builds still take the build host's
    # python3, as they did at cvc.1 -- unchanged here.
    - name: python311
      platforms: [windows]
  runtime: []
  host_tools: []

build:
  matrix:
    # macOS is the reason this recipe exists: AppleClang has no bundled OpenMP
    # runtime, so without a libomp on the prefix find_package(OpenMP) fails and
    # a consumer gating on OpenMP_CXX_FOUND silently goes serial.
    - platform: macos
      script: build.sh
      env:
        MACOSX_DEPLOYMENT_TARGET: "13.0"
    # Linux is published for clang-based consumers. GCC needs nothing from here
    # -- it finds its own libgomp through the compiler -- and cannot be confused
    # by this bundle either, because LIBOMP_INSTALL_ALIASES=OFF means we ship no
    # libgomp for FindOpenMP's `NAMES omp gomp iomp5` search to pick up.
    - platform: linux
      script: build.sh
      env:
        CFLAGS: "-O2 -fPIC"
        CXXFLAGS: "-O2 -fPIC"
    # Windows (MSVC) exists so a consumer can ship an OpenMP 3.0+ runtime:
    # MSVC's /openmp runtime (vcomp) is OpenMP 2.0 only, and the -openmp:llvm
    # one (libomp140.x86_64.dll) is not redistributable. libcvc's Windows SDK is
    # the first consumer (transfix/libcvc#587).
    - platform: windows
      script: build.ps1

package:
  files:
    # libomp.dylib on macOS, libomp.so on Linux, libomp.a for a static build;
    # on Windows the import library lib/libomp.lib.
    - lib/libomp.*
    # Windows: the runtime itself, and the collision-free copy of the import
    # library that consumers should link (see the "Windows import library" note).
    - { glob: "bin/libomp.dll", platforms: [windows] }
    - { glob: "lib/libomp-llvm.lib", platforms: [windows] }
    # Upstream's Windows install always adds a libiomp5md compatibility copy of
    # the DLL and the import library (LIBOMP_INSTALL_ALIASES only governs the
    # unix aliases). See the "libiomp5md" note.
    - { glob: "bin/libiomp5md.dll", platforms: [windows] }
    - { glob: "lib/libiomp5md.lib", platforms: [windows] }
    # omp.h is the one consumers include; ompt.h / omp-tools.h / ompx.h come
    # along with it (Windows: omp.h + ompx.h only -- OMPT is off there
    # upstream). One pattern rather than four names, so a header upstream
    # renames does not turn into a packaging failure.
    - include/omp*.h
  cmake_packages: []

abi:
  cxx_std: 17

toolchain:
  cc:
    min_version: "any"
    description: "C/C++ compiler (the runtime itself is C/C++; no OpenMP support required to build it)"

notes:
  - title: "Consumers need nothing beyond the prefix"
    platforms: [macos, linux]
    description: >-
      CMake's FindOpenMP locates the runtime with
      find_library(OpenMP_libomp_LIBRARY NAMES omp gomp iomp5), which honours
      CMAKE_PREFIX_PATH and OpenMP_ROOT. Installing this bundle into a prefix
      that is already on CMAKE_PREFIX_PATH is therefore enough; no per-consumer
      OpenMP_CXX_FLAGS / OpenMP_CXX_LIB_NAMES wiring is required. On AppleClang
      FindOpenMP supplies the '-Xclang -fopenmp' spelling itself.
  - title: "No libgomp/libiomp5 aliases, deliberately"
    platforms: [macos, linux]
    description: >-
      Upstream defaults LIBOMP_INSTALL_ALIASES=ON, which installs
      lib/libgomp.so{,.1} and lib/libiomp5.so beside libomp. This recipe turns
      that OFF: those names would sit in a shared prefix that GCC-built
      consumers also search, and binding two OpenMP runtimes into one process
      aborts with "OMP: Error #15: Initializing libomp, but found libgomp
      already initialized". build.sh asserts the aliases are absent.
  - title: "Windows: why this runtime and not MSVC's"
    platforms: [windows]
    description: >-
      MSVC's /openmp runtime (vcomp140.dll) implements OpenMP 2.0 only, so code
      needing OpenMP 3.0+ (unsigned loop indices, min/max reductions, tasks) is
      compiled with -openmp:llvm, which links libomp140.x86_64.dll. Microsoft
      documents that DLL as not redistributable and does not put it in
      VC\Redist, so a binary importing it loads only where Visual Studio is
      installed. This bundle is LLVM's own libomp (Apache-2.0 WITH
      LLVM-exception, freely redistributable) built with cl: a consumer links
      it instead and ships bin/libomp.dll beside its binaries.
  - title: "Windows import library: link lib/libomp-llvm.lib"
    platforms: [windows]
    description: >-
      Upstream installs the import library as lib/libomp.lib, which is also the
      file name of MSVC's own import library for libomp140.x86_64.dll. Every
      object cl -openmp:llvm compiles asks for it: /DEFAULTLIB:libomp.lib under
      /MD, /DEFAULTLIB:libompd.lib under /MDd (read off the objects with
      dumpbin /directives, MSVC 14.44 and 14.51). That name is on every MSVC
      toolchain's LIB path, so any lookup by bare name (find_library(NAMES
      libomp), a #pragma comment(lib), a link line without a directory) can
      silently resolve to Microsoft's file and bring libomp140 back. The bundle
      therefore also ships lib/libomp-llvm.lib, the same bytes under a name
      nothing in MSVC uses. Consumers link that by full path and cancel MSVC's
      default library:
        <prefix>/lib/libomp-llvm.lib  /NODEFAULTLIB:libomp.lib
      (add /NODEFAULTLIB:libompd.lib for a /MDd build). The result imports
      libomp.dll: build.ps1 compiles, links and runs exactly that as a smoke
      test, and checks that every import library in lib/ imports from
      libomp.dll only, by name. Linking lib/libomp.lib by full path with the
      same /NODEFAULTLIB works too with today's link.exe (it applies
      /NODEFAULTLIB to default libraries only; the smoke test tries it and
      reports), but that rests on undocumented name matching, and the distinct
      name removes the question. lib/libomp.lib stays, for clang-cl and
      upstream-convention consumers that search for "libomp".
  - title: "Windows: what to ship with it"
    platforms: [windows]
    description: >-
      Ship bin/libomp.dll beside the consumer's binaries; nothing else from
      this bundle is needed at run time. The shared build's libomp.dll imports
      only KERNEL32, PSAPI, the UCRT (api-ms-win-crt-*) and the VC++ runtime
      (VCRUNTIME140.dll and VCRUNTIME140_1.dll), all redistributable or part of
      Windows. This bundle's include/omp.h compiles under cl -openmp:llvm
      (which reports _OPENMP as 200203 although it accepts OpenMP 3.x
      constructs), so a consumer with the prefix's include/ on its include path
      gets the LLVM runtime's full API rather than MSVC's OpenMP 2.0 omp.h.
  - title: "Windows: the DLL ships in the static variant too"
    platforms: [windows]
    description: >-
      Upstream cannot build a static libomp on Windows ("Static libraries
      requested but not available on Windows"), so build.ps1 always builds
      the DLL. A --link static bundle carries bin/libomp.dll compiled against
      the static CRT (/MT); the shared bundle uses /MD. Either works under a
      consumer of either CRT: the OpenMP API passes no CRT objects across the
      DLL boundary.
  - title: "Windows: libiomp5md copies"
    platforms: [windows]
    description: >-
      Upstream's Windows install always adds bin/libiomp5md.dll and
      lib/libiomp5md.lib, copies kept for code built against Intel's runtime
      name (LIBOMP_INSTALL_ALIASES only governs the unix libgomp/libiomp5
      aliases, which this recipe turns off). They are harmless here -- the
      import library still names libomp.dll -- and a consumer bundling the
      runtime needs only bin/libomp.dll.
