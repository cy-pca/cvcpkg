schema_version: 1
recipe:
  name: aiobotocore-cp313
  upstream_version: "3.9.0"
  cvc_revision: 1

  maintainer: "cvcpkg group"
  maintainer_email: "info@cvcpkg.org"
  maintainer_url: "https://cvcpkg.org"
  homepage: https://pypi.org/project/aiobotocore/
  license: "Apache-2.0"
  tags: [python, source]
  description: >-
    aiobotocore 3.9.0 for CPython 3.13 — the cp313 column of
    cvcpkg's per-interpreter matrix (pure-Python, built from the PyPI sdist);
    generated by tools/gen_python_recipes.py.
    Built FROM SOURCE: cvcpkg fetches and sha256-verifies the PyPI sdist,
    and build.sh compiles the wheel with the prefix's own CPython 3.13 —
    no third-party prebuilt binary enters the bundle.

# From-source sdist, sha256 as published by PyPI for this exact version.
source:
  # Built from the source package aiobotocore-src, which pins the upstream tarball
  # (https://files.pythonhosted.org/packages/73/c0/18abcb7e4e504a68714c280853fd180afe376a4a55e5511fb04ba76702e4/aiobotocore-3.9.0.tar.gz).
  type: package
  package: aiobotocore-src

python:
  interpreter: python313
  abi: cp313

patches: []

depends:
  build:
    - name: aiobotocore-src
      version: "==3.9.0"
    - name: python313
    - name: aiohttp-cp313
    - name: aioitertools-cp313
    - name: botocore-cp313
    - name: jmespath-cp313
    - name: multidict-cp313
    - name: python-dateutil-cp313
    - name: wrapt-cp313
    # PEP-517 build backend, from this sdist's [build-system] requires.
    # --no-build-isolation means pip will NOT fetch it, so it has to be
    # in the build prefix already (build.sh bridges it onto sys.path).
    - name: hatchling-cp313
    - name: hatch-fancy-pypi-readme-cp313
    - name: packaging-cp313
    - name: pathspec-cp313
    - name: pluggy-cp313
    - name: trove-classifiers-cp313
    - name: calver-cp313
  runtime:
    - name: python313
    - name: aiohttp-cp313
    - name: aioitertools-cp313
    - name: botocore-cp313
    - name: jmespath-cp313
    - name: multidict-cp313
    - name: python-dateutil-cp313
    - name: wrapt-cp313
  host_tools:
    - python313

build:
  build_type_independent: true
  matrix:
    - platform: any
      script: build.sh
    - platform: windows
      script: build.ps1

package:
  files:
    - { glob: "lib/python3.13/site-packages/aiobotocore/", platforms: [any] }
    - { glob: "lib/python3.13/site-packages/*.dist-info/", platforms: [any] }
    - { glob: "Lib/site-packages/aiobotocore/", platforms: [windows] }
    - { glob: "Lib/site-packages/*.dist-info/", platforms: [windows] }
