schema_version: 1
recipe:
  name: pixman
  upstream_version: "0.44.2"
  cvc_revision: 1
  maintainer: "cvcpkg group"
  maintainer_email: "info@cvcpkg.org"
  maintainer_url: "https://cvcpkg.org"
  homepage: https://pixman.org/
  license: MIT
  tags: [libraries]
  description: >-
    Pixman — a low-level software library for pixel manipulation,
    providing optimised image compositing and rasterisation primitives.
    Required by Cairo.

source:
  # Built from the source package pixman-src, which pins the upstream tarball
  # (https://cairographics.org/releases/pixman-0.44.2.tar.gz).
  type: package
  package: pixman-src

patches: []

depends:
  build:
    # meson.cmd runs the prefix's python.exe.  Declared, as pkg-config and glib
    # do: the builder installs only the runtime deps beneath a recipe's own, so
    # one no longer arrives through another dep's build edge.
    - name: python312
      platforms: [windows]
    - name: pixman-src
      version: "==0.44.2"
    - ninja
    - meson
    - pkg-config
  runtime: []
  host_tools: []

build:
  matrix:
    - platform: linux
      script: build.sh
      env:
        CFLAGS: "-O2 -fPIC"
    - platform: macos
      script: build.sh
      env:
        MACOSX_DEPLOYMENT_TARGET: "13.0"
    - platform: freebsd
      script: build.sh
      env:
        CFLAGS: "-O2 -fPIC"
    - platform: openbsd
      script: build.sh
      env:
        CFLAGS: "-O2 -fPIC"
    - platform: netbsd
      script: build.sh
      env:
        CFLAGS: "-O2 -fPIC"
    - platform: windows
      script: build.ps1

package:
  files:
    - lib/libpixman-1*
    - lib/pkgconfig/pixman-1*
    - include/pixman-1/
  pkg_config:
    - pixman-1

abi:
  cxx_std: 17
