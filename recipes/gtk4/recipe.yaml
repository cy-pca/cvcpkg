schema_version: 1
recipe:
  name: gtk4
  upstream_version: "4.16.7"
  # Bumped 2 -> 4 (two changes):
  #  1. Scoped the wayland-protocols build edge to the platforms with a Wayland
  #     backend. GTK 4 uses its Quartz backend on macOS and its Win32 backend on
  #     Windows, neither of which runs wayland-scanner, so the unscoped edge made
  #     this recipe advertise macos/windows while depending on a package with no
  #     build there.
  #  2. Replaced the gvsbuild-driven Windows build with a direct Meson + MSVC
  #     one. gvsbuild fetched and compiled its own copy of the whole GTK stack,
  #     so the Windows bundle was non-hermetic AND shipped gvsbuild's cairo/
  #     pango/gdk-pixbuf rather than the ones declared here. The Windows payload
  #     changes wholesale, hence the bump.
  cvc_revision: 4
  maintainer: "cvcpkg group"
  maintainer_email: "info@cvcpkg.org"
  maintainer_url: "https://cvcpkg.org"
  description: >-
    GTK 4 — the GIMP Toolkit widget library, used to build graphical
    user interfaces for the GNOME desktop and cross-platform
    applications.  This recipe builds GTK 4 from source with Meson on
    every platform, linking against cvcpkg-provided glib/cairo/pango/
    harfbuzz/gdk-pixbuf/epoxy.
  homepage: https://www.gtk.org/
  license: LGPL-2.1-or-later
  tags: [graphics, gui]

source:
  # Built from the source package gtk4-src, which pins the upstream tarball
  # (https://download.gnome.org/sources/gtk/4.16/gtk-4.16.7.tar.xz).
  type: package
  package: gtk4-src

patches: []

depends:
  build:
    - name: gtk4-src
      version: "==4.16.7"
    - ninja
    - meson
    - pkg-config
    # Protocol XML consumed by wayland-scanner at build time; gtk4 links
    # libwayland (kept under runtime) but never the protocol definitions.
    - name: wayland-protocols
      version: "^1.38"
      platforms: [linux, freebsd, openbsd, netbsd]
    # GTK requires libdrm on Linux for drm_fourcc.h (dmabuf formats) only: a
    # header-only partial dependency, never linked, so it is not a runtime dep.
    - name: libdrm
      platforms: [linux]
    # glib's gdbus-codegen (a Python script) generates the AT-SPI accessibility
    # code on Linux and the BSDs, and imports `packaging`.  Run with the
    # builder's python3 it failed: "No module named 'packaging'".  build.sh
    # puts the build prefix first on PATH, so its `#!/usr/bin/env python3`
    # finds cvcpkg's python313, with packaging-cp313 in its site-packages.
    - name: python3
      platforms: [linux, freebsd, openbsd, netbsd]
    - name: packaging-cp313
      platforms: [linux, freebsd, openbsd, netbsd]
  runtime:
    - name: glib
      version: "^2.80"
    - name: cairo
      version: "^1.18"
    - name: pango
      version: "^1.54"
    - name: harfbuzz
      version: "^10.0"
    - name: gdk-pixbuf
      version: "^2.42"
    - name: libepoxy
      version: "^1.5"
    - name: fribidi
      version: "^1.0"
    - name: graphene
      version: "^1.10"
    - name: wayland
      version: "^1.23"
      platforms: [linux, freebsd]
    - name: xkbcommon
      version: "^1.7"
      platforms: [linux, freebsd]
    # The X11 backend (build.sh: -Dx11-backend=true on Linux and the BSDs)
    # requires all of these (GTK 4.16 meson.build), and cairo's Xlib surface.
    - name: libx11
      platforms: [linux, freebsd, openbsd, netbsd]
    - name: libxext
      platforms: [linux, freebsd, openbsd, netbsd]
    - name: libxrender
      platforms: [linux, freebsd, openbsd, netbsd]
    - name: libxi
      platforms: [linux, freebsd, openbsd, netbsd]
    - name: libxrandr
      platforms: [linux, freebsd, openbsd, netbsd]
    - name: libxcursor
      platforms: [linux, freebsd, openbsd, netbsd]
    - name: libxdamage
      platforms: [linux, freebsd, openbsd, netbsd]
    - name: libxfixes
      platforms: [linux, freebsd, openbsd, netbsd]
    - name: libxinerama
      platforms: [linux, freebsd, openbsd, netbsd]
  host_tools: []

build:
  matrix:
    - platform: linux
      script: build.sh
      env:
        CXXFLAGS: "-O2 -fPIC"
    - platform: macos
      script: build.sh
      env:
        MACOSX_DEPLOYMENT_TARGET: "13.0"
    - platform: freebsd
      script: build.sh
      env:
        CXXFLAGS: "-O2 -fPIC"
    - platform: openbsd
      script: build.sh
      env:
        CXXFLAGS: "-O2 -fPIC"
    - platform: netbsd
      script: build.sh
      env:
        CXXFLAGS: "-O2 -fPIC"
    - platform: windows
      script: build.ps1
      note: >-
        Windows builds delegate to gvsbuild (Python), which fetches
        and builds the full GTK 4 stack under MSYS2/MSVC.  Requires
        Visual Studio 2019+ Build Tools and Python 3.10+.

package:
  files:
    # GTK 4 has no separate libgdk-4 or gdk-4.pc (GDK is part of libgtk-4), and
    # build.sh disables introspection, so there are no .typelib or .gir files.
    - lib/libgtk-4*
    - lib/pkgconfig/gtk4*.pc
    - lib/pkgconfig/gtk4-unix-print*.pc
    - include/gtk-4.0/
    - share/gtk-4.0/
    - share/glib-2.0/schemas/org.gtk.*.xml
    - bin/gtk4-*
  cmake_packages: []
  pkg_config:
    - gtk4
    - gtk4-unix-print
    - gtk4-wayland
    - gtk4-x11

abi:
  cxx_std: 17
  link: shared

notes:
  - title: "All dependencies provided by cvcpkg"
    platforms: [linux, macos]
    description: >-
      GTK 4's runtime dependencies (glib, cairo, pango, harfbuzz,
      gdk-pixbuf, libepoxy, fribidi, graphene, wayland,
      wayland-protocols, xkbcommon) are all provided as cvcpkg
      recipes and resolved automatically during the build.
  - title: "Windows uses the Win32 backend"
    platforms: [windows]
    description: >-
      The Windows build is Meson + MSVC with GTK's native Win32
      (GDI/Direct2D) backend; Wayland and X11 are explicitly disabled.
      Dependencies resolve from the cvcpkg prefix exactly as on every
      other platform.  This replaced a gvsbuild-driven build, which
      fetched and compiled its own copy of the entire GTK stack — that
      was non-hermetic, and it meant the cairo/pango/gdk-pixbuf
      packages declared here were not the libraries actually linked.
  - title: "Experimental / initial recipe"
    platforms: [linux, macos, windows]
    description: >-
      This recipe is an initial scaffold and has not yet passed the
      full BSD/wasm build matrix.  Downstream projects should treat
      the GTK 4 API as available on linux/macos/windows only.
