schema_version: 1
recipe:
  name: psutil-cp313t
  upstream_version: "7.2.2"
  cvc_revision: 1

  maintainer: "cvcpkg group"
  maintainer_email: "info@cvcpkg.org"
  maintainer_url: "https://cvcpkg.org"
  homepage: https://pypi.org/project/psutil/
  license: "BSD-3-Clause"
  tags: [python, source]
  description: >-
    psutil 7.2.2 for CPython 3.13t — the cp313t column of
    cvcpkg's per-interpreter matrix (C extensions compiled for cp313t from the PyPI sdist);
    generated by tools/gen_python_recipes.py.
    Built FROM SOURCE: cvcpkg fetches and sha256-verifies the PyPI sdist,
    and build.sh compiles the wheel with the prefix's own CPython 3.13t —
    no third-party prebuilt binary enters the bundle.
    The cp313t column installs under the free-threaded (no-GIL)
    interpreter and its import check runs with the GIL disabled.

# From-source sdist, sha256 as published by PyPI for this exact version.
source:
  # Built from the source package psutil-src, which pins the upstream tarball
  # (https://files.pythonhosted.org/packages/aa/c6/d1ddf4abb55e93cebc4f2ed8b5d6dbad109ecb8d63748dd2b20ab5e57ebe/psutil-7.2.2.tar.gz).
  type: package
  package: psutil-src

python:
  interpreter: python313t
  abi: cp313t

patches: []

depends:
  build:
    - name: psutil-src
      version: "==7.2.2"
    - name: python313t
    # PEP-517 build backend, from this sdist's [build-system] requires.
    # --no-build-isolation means pip will NOT fetch it, so it has to be
    # in the build prefix already (build.sh bridges it onto sys.path).
    - name: setuptools-cp313t
  runtime:
    - name: python313t
  host_tools:
    - python313t

build:
  build_type_independent: true
  matrix:
    - platform: linux
      script: build.sh
    - platform: macos
      script: build.sh
    - platform: windows
      script: build.ps1

package:
  files:
    - { glob: "lib/python3.13t/site-packages/psutil/", platforms: [linux, macos] }
    - { glob: "lib/python3.13t/site-packages/*.dist-info/", platforms: [linux, macos] }
    - { glob: "Lib/site-packages/psutil/", platforms: [windows] }
    - { glob: "Lib/site-packages/*.dist-info/", platforms: [windows] }
