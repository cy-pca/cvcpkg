schema_version: 1
recipe:
  name: importlib-resources-cp313t
  upstream_version: "7.1.0"
  cvc_revision: 2

  maintainer: "cvcpkg group"
  maintainer_email: "info@cvcpkg.org"
  maintainer_url: "https://cvcpkg.org"
  homepage: https://pypi.org/project/importlib-resources/
  license: "Apache-2.0"
  tags: [python, source]
  description: >-
    importlib-resources 7.1.0 for CPython 3.13t — the cp313t column of
    cvcpkg's per-interpreter matrix (pure-Python, built from the PyPI sdist);
    generated by tools/gen_python_recipes.py.
    Built FROM SOURCE: cvcpkg fetches and sha256-verifies the PyPI sdist,
    and build.sh compiles the wheel with the prefix's own CPython 3.13t —
    no third-party prebuilt binary enters the bundle.
    The cp313t column installs under the free-threaded (no-GIL)
    interpreter and its import check runs with the GIL disabled.

# From-source sdist, sha256 as published by PyPI for this exact version.
source:
  # Built from the source package importlib-resources-src, which pins the upstream tarball
  # (https://files.pythonhosted.org/packages/e4/06/b56dfa750b44e86157093bc8fca0ab81dccbf5260510de4eaf1cb69b5b99/importlib_resources-7.1.0.tar.gz).
  type: package
  package: importlib-resources-src

python:
  interpreter: python313t
  abi: cp313t

patches: []

depends:
  build:
    - name: importlib-resources-src
      version: "==7.1.0"
    - name: python313t
    # PEP-517 build backend, from this sdist's [build-system] requires.
    # --no-build-isolation means pip will NOT fetch it, so it has to be
    # in the build prefix already (build.sh bridges it onto sys.path).
    - name: setuptools-cp313t
    - name: setuptools-scm-cp313t
    - name: coherent-licensed-cp313t
  runtime:
    - name: python313t
  host_tools:
    - python313t

build:
  build_type_independent: true
  matrix:
    - platform: any
      script: build.sh
    - platform: windows
      script: build.ps1

package:
  files:
    - { glob: "lib/python3.13t/site-packages/importlib_resources/", platforms: [any] }
    - { glob: "lib/python3.13t/site-packages/*.dist-info/", platforms: [any] }
    - { glob: "Lib/site-packages/importlib_resources/", platforms: [windows] }
    - { glob: "Lib/site-packages/*.dist-info/", platforms: [windows] }
