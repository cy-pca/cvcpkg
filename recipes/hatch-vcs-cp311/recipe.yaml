schema_version: 1
recipe:
  name: hatch-vcs-cp311
  upstream_version: "0.4.0"
  # cvc.4: declare the setuptools-scm runtime dependency.
  cvc_revision: 4

  maintainer: "cvcpkg group"
  maintainer_email: "info@cvcpkg.org"
  maintainer_url: "https://cvcpkg.org"
  homepage: https://pypi.org/project/hatch-vcs/
  license: "MIT"
  tags: [python, source]
  description: >-
    hatch-vcs 0.4.0 for CPython 3.11 — the cp311 column of
    cvcpkg's per-interpreter matrix (pure-Python, built from the PyPI sdist);
    generated by tools/gen_python_recipes.py.
    Built FROM SOURCE: cvcpkg fetches and sha256-verifies the PyPI sdist,
    and build.sh compiles the wheel with the prefix's own CPython 3.11 —
    no third-party prebuilt binary enters the bundle.

# From-source sdist, sha256 as published by PyPI for this exact version.
source:
  # Built from the source package hatch-vcs-src, which pins the upstream tarball
  # (https://files.pythonhosted.org/packages/f5/c9/54bb4fa27b4e4a014ef3bb17710cdf692b3aa2cbc7953da885f1bf7e06ea/hatch_vcs-0.4.0.tar.gz).
  type: package
  package: hatch-vcs-src

python:
  interpreter: python311
  abi: cp311

patches: []

depends:
  build:
    - name: hatch-vcs-src
      version: "==0.4.0"
    - name: python311
    - name: hatchling-cp311
    # PEP-517 build backend, from this sdist's [build-system] requires.
    # --no-build-isolation means pip will NOT fetch it, so it has to be
    # in the build prefix already (build.sh bridges it onto sys.path).
    - name: packaging-cp311
    - name: pathspec-cp311
    - name: pluggy-cp311
    - name: trove-classifiers-cp311
    - name: calver-cp311
  runtime:
    - name: python311
    - name: hatchling-cp311
    # hatch_vcs imports setuptools_scm (the seed in tools/gen_python_recipes.py
    # lists it); without it a consumer's build died "No module named
    # 'setuptools_scm'" (filelock/fsspec/platformdirs-cp313t, 2026-10-15).
    - name: setuptools-scm-cp311
  host_tools:
    - python311

build:
  build_type_independent: true
  matrix:
    - platform: any
      script: build.sh
    - platform: windows
      script: build.ps1

package:
  files:
    - { glob: "lib/python3.11/site-packages/hatch_vcs/", platforms: [any] }
    - { glob: "lib/python3.11/site-packages/hatch_vcs-*.dist-info/", platforms: [any] }
    - { glob: "Lib/site-packages/hatch_vcs/", platforms: [windows] }
    - { glob: "Lib/site-packages/*.dist-info/", platforms: [windows] }
