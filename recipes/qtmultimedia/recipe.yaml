schema_version: 1
recipe:
  name: qtmultimedia
  upstream_version: "6.8.2"
  # cvc.7: gstreamer and libpulse are declared linux runtime dependencies.
  # build.sh builds the GStreamer media backend and PulseAudio audio on linux,
  # but nothing pulled them in: on linux/arm64 neither was in the prefix, so
  # configure said "No media backend found" and no plugins/multimedia/ shipped.
  cvc_revision: 7
  maintainer: "cvcpkg group"
  maintainer_email: "info@cvcpkg.org"
  maintainer_url: "https://cvcpkg.org"
  description: "Qt 6 Multimedia — multimedia playback and capture support."
  homepage: https://www.qt.io/
  license: LGPL-3.0-only
  tags: [multimedia]

source:
  type: tarball
  url: https://download.qt.io/archive/qt/6.8/6.8.2/submodules/qtmultimedia-everywhere-src-6.8.2.tar.xz
  sha256: "34f561fdc07b158bcc4ad040b596fc6086c48908060e854b473b557e4feb1569"
  strip_components: 1

patches: []

depends:
  build:
    - cmake
    - ninja
    - name: python3
      platforms: [linux, macos, freebsd, openbsd, netbsd]
    - name: python312
      platforms: [windows]
    - perl
  runtime:
    - {name: qt6, version: ">=6.8"}
    - {name: qtshadertools, version: ">=6.8"}
    - name: gstreamer
      platforms: [linux]
    - name: libpulse
      platforms: [linux]
  host_tools: []

build:
  matrix:
    - platform: linux
      script: build.sh
      env:
        CXXFLAGS: "-O2 -fPIC -std=c++17"
    - platform: macos
      script: build.sh
      env:
        MACOSX_DEPLOYMENT_TARGET: "13.0"
    - platform: freebsd
      script: build.sh
      env:
        CXXFLAGS: "-O2 -fPIC -std=c++17"
    - platform: openbsd
      script: build.sh
      env:
        CXXFLAGS: "-O2 -fPIC -std=c++17"
    - platform: netbsd
      script: build.sh
      env:
        CXXFLAGS: "-O2 -fPIC -std=c++17"
    - platform: windows
      script: build.ps1
    - platform: wasm
      host_platform: linux
      script: build-wasm.sh
      env:
        CXXFLAGS: "-O2 -std=c++17"
    - platform: wasm
      host_platform: macos
      script: build-wasm.sh
      env:
        MACOSX_DEPLOYMENT_TARGET: "13.0"
    - platform: wasm
      host_platform: windows
      script: build-wasm.ps1

package:
  files:
    - lib/libQt6Multimedia*
    - lib/Qt6Multimedia*
    - lib/cmake/Qt6Multimedia*/
    - lib/pkgconfig/Qt6Multimedia*
    - include/QtMultimedia/
    - include/QtMultimediaWidgets/
    # Qt 6's media backends (Qt 5's mediaservice/ and audio/ are gone).
    - plugins/multimedia/
  cmake_packages:
    - {
        name: Qt6Multimedia,
        targets: ["Qt6::Multimedia", "Qt6::MultimediaWidgets"],
      }

abi:
  cxx_std: 17
