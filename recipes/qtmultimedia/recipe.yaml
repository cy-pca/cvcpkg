schema_version: 1
recipe:
  name: qtmultimedia
  upstream_version: "6.8.2"
  # cvc.7: gstreamer and libpulse are declared linux runtime dependencies.
  # build.sh builds the GStreamer media backend and PulseAudio audio on linux,
  # but nothing pulled them in: on linux/arm64 neither was in the prefix, so
  # configure said "No media backend found" and no plugins/multimedia/ shipped.
  cvc_revision: 7
  maintainer: "cvcpkg group"
  maintainer_email: "info@cvcpkg.org"
  maintainer_url: "https://cvcpkg.org"
  description: "Qt 6 Multimedia — multimedia playback and capture support."
  homepage: https://www.qt.io/
  license: LGPL-3.0-only
  tags: [multimedia]

source:
  # Built from the source package qtmultimedia-src, which pins the upstream tarball
  # (https://download.qt.io/archive/qt/6.8/6.8.2/submodules/qtmultimedia-everywhere-src-6.8.2.tar.xz).
  type: package
  package: qtmultimedia-src

patches: []

depends:
  build:
    - name: qtmultimedia-src
      version: "==6.8.2"
    - cmake
    - ninja
    - name: python3
      platforms: [linux, macos, freebsd, openbsd, netbsd]
    - name: python312
      platforms: [windows]
    - perl
  runtime:
    - {name: qt6, version: ">=6.8"}
    - {name: qtshadertools, version: ">=6.8"}
    - name: gstreamer
      platforms: [linux]
    - name: libpulse
      platforms: [linux]
  host_tools: []

build:
  matrix:
    - platform: linux
      script: build.sh
      env:
        CXXFLAGS: "-O2 -fPIC -std=c++17"
    - platform: macos
      script: build.sh
      env:
        MACOSX_DEPLOYMENT_TARGET: "13.0"
    - platform: freebsd
      script: build.sh
      env:
        CXXFLAGS: "-O2 -fPIC -std=c++17"
    - platform: openbsd
      script: build.sh
      env:
        CXXFLAGS: "-O2 -fPIC -std=c++17"
    - platform: netbsd
      script: build.sh
      env:
        CXXFLAGS: "-O2 -fPIC -std=c++17"
    - platform: windows
      script: build.ps1
    - platform: wasm
      host_platform: linux
      script: build-wasm.sh
      env:
        CXXFLAGS: "-O2 -std=c++17"
    - platform: wasm
      host_platform: macos
      script: build-wasm.sh
      env:
        MACOSX_DEPLOYMENT_TARGET: "13.0"
    - platform: wasm
      host_platform: windows
      script: build-wasm.ps1

package:
  files:
    # macOS builds Qt as frameworks: a module's library and headers live in
    # lib/Qt<Module>.framework/, and Qt writes no pkg-config files for a
    # framework build (nor on Windows by default).  Scoping these never drops
    # files -- packing takes the whole staged tree; package.files declares
    # what must exist (macos-15-intel populate 39171736755: "lib/pkgconfig/Qt6*
    # matches nothing").
    - { glob: "lib/libQt6Multimedia*", platforms: [linux, windows, freebsd, openbsd, netbsd, wasm] }
    - { glob: "lib/Qt6Multimedia*", platforms: [linux, windows, freebsd, openbsd, netbsd, wasm] }
    - { glob: "lib/QtMultimedia.framework/", platforms: [macos] }
    - { glob: "lib/QtMultimediaWidgets.framework/", platforms: [macos] }
    - lib/cmake/Qt6Multimedia*/
    - { glob: "lib/pkgconfig/Qt6Multimedia*", platforms: [linux, freebsd, openbsd, netbsd] }
    - { glob: "include/QtMultimedia/", platforms: [linux, windows, freebsd, openbsd, netbsd, wasm] }
    - { glob: "include/QtMultimediaWidgets/", platforms: [linux, windows, freebsd, openbsd, netbsd, wasm] }
    # Qt 6's media backends (Qt 5's mediaservice/ and audio/ are gone).  The BSD
    # builds find no backend (no FFmpeg dep there, no GStreamer), so they build
    # the library without one: OpenBSD packed no plugins/multimedia/ (job 22801).
    - { glob: "plugins/multimedia/", platforms: [linux, macos, windows, wasm] }
  cmake_packages:
    - {
        name: Qt6Multimedia,
        targets: ["Qt6::Multimedia", "Qt6::MultimediaWidgets"],
      }

abi:
  cxx_std: 17
