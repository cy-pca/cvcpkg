schema_version: 1
recipe:
  name: gfortran
  upstream_version: "11.4.0"
  cvc_revision: 2
  maintainer: "cvcpkg group"
  maintainer_email: "info@cvcpkg.org"
  maintainer_url: "https://cvcpkg.org"
  homepage: https://gcc.gnu.org/fortran/
  license: "GPL-3.0-or-later WITH GCC-exception-3.1"
  tags: [tools, toolchain, fortran]
  description: >-
    GNU Fortran 11.4.0 for linux, built from the GCC 11.4.0 release.  The
    linux counterpart of mingw-w64-gcc: packages that compile Fortran (openblas's
    LAPACK) declare it in depends.build, which puts its bin/ on the build PATH,
    instead of taking whatever gfortran the builder happens to have.

    Only gfortran is on PATH (bin/gcc, cpp, gcov, ... are removed), so it never
    replaces the C compiler a build already uses.  11.4.0 is the GCC the linux
    fleet compiles everything else with, so objects from both mix and the
    runtime libraries are ABI-identical; consumers get those libraries at run
    time from the gcc-runtime package, which is copied out of this build.
    GMP, MPFR and MPC are built in-tree (static) from the gmp-src, mpfr-src
    and mpc-src source packages, so the compiler needs nothing at run time but
    glibc and binutils, and the build downloads nothing itself.

source:
  # Built from the source package gcc-src, which pins the upstream tarball
  # (https://ftp.gnu.org/gnu/gcc/gcc-11.4.0/gcc-11.4.0.tar.xz).
  type: package
  package: gcc-src

patches: []

depends:
  # $ORIGIN run paths on the runtime libraries in lib64/ (build.sh).
  build:
    - name: gcc-src
      version: "==11.4.0"
    # Built in-tree into the compiler (build.sh).  cvc.1 downloaded the
    # versions GCC 11.4 pins (gmp 6.1.0, mpfr 3.1.6, mpc 1.0.3) from
    # gcc.gnu.org during the build; GCC 11 needs gmp >= 4.3.2, mpfr >= 3.1.0
    # and mpc >= 1.0.0, so the current releases serve.
    - name: gmp-src
      version: "==6.3.0"
    - name: mpfr-src
      version: "==4.2.1"
    - name: mpc-src
      version: "==1.3.1"
    - name: patchelf
      platforms: [linux]
  runtime: []
  host_tools: []

build:
  build_type_independent: true
  matrix:
    - platform: linux
      script: build.sh

package:
  files:
    - bin/gfortran
    - lib/gcc/
    - libexec/gcc/
    - lib64/libgfortran*
    # lib64/libquadmath* is x86 only (GCC builds no libquadmath for aarch64),
    # and package.files cannot scope an entry by arch.
    - lib64/libgomp*
    - share/licenses/gfortran/
