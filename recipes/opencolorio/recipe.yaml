schema_version: 1
recipe:
  name: opencolorio
  upstream_version: "2.5.0"
  cvc_revision: 1
  maintainer: "cvcpkg group"
  maintainer_email: "info@cvcpkg.org"
  maintainer_url: "https://cvcpkg.org"
  homepage: https://opencolorio.org
  license: BSD-3-Clause
  tags: [libraries, color, vfx]
  description: >-
    OpenColorIO — the ASWF colour management library for visual effects and
    animation (colour space conversions, looks, displays/views, GPU shader
    generation).  Blender, OpenImageIO and USD require it.  2.5.0 is Blender
    5.2's pin.  Library only: no ocio* apps, Python bindings, docs, Java,
    Nuke or OpenFX plugins.  Every dependency comes from the prefix
    (OCIO_INSTALL_EXT_PACKAGES=NONE), never a configure-time download.

source:
  type: tarball
  url: https://github.com/AcademySoftwareFoundation/OpenColorIO/archive/refs/tags/v2.5.0.tar.gz
  sha256: "124e2bfa8a9071959d6ddbb64ffbf78d3f6fe3c923ae23e96a6bbadde1af55b6"
  strip_components: 1

patches: []

depends:
  build:
    # Static and linked privately into libOpenColorIO.
    - name: pystring
      version: "^1.1"
  runtime:
    - name: expat
      version: "^2.5"
    - name: yaml-cpp
      version: ">=0.7"
    - name: imath
      version: "^3.2"
    - name: minizip-ng
      version: "^4.0"
    - name: zlib
      version: "^1.3"
  host_tools:
    - cmake
    - ninja
    - pkg-config

build:
  matrix:
    - platform: linux
      script: build.sh
    - platform: macos
      script: build.sh
      env:
        MACOSX_DEPLOYMENT_TARGET: "13.0"
    - platform: windows
      script: build.ps1

package:
  files:
    - include/OpenColorIO/
    - lib/libOpenColorIO*
    # MSVC: OpenColorIO_2_5.lib + bin/OpenColorIO_2_5.dll.
    - lib/OpenColorIO*
    - { glob: "bin/OpenColorIO*", platforms: [windows] }
    - lib/cmake/OpenColorIO/
    - lib/pkgconfig/OpenColorIO.pc
  pkg_config:
    - OpenColorIO
  cmake_packages:
    - { name: OpenColorIO, targets: ["OpenColorIO::OpenColorIO"] }

abi:
  cxx_std: 17
