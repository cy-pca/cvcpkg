schema_version: 1
recipe:
  name: make
  upstream_version: "4.4.1"
  cvc_revision: 2
  maintainer: "cvcpkg group"
  maintainer_email: "info@cvcpkg.org"
  maintainer_url: "https://cvcpkg.org"
  homepage: https://www.gnu.org/software/make/
  license: GPL-3.0-or-later
  tags: [tools, build-system]
  description: >-
    GNU Make — the standard build-automation tool that drives
    configure/make/make install pipelines. Provided so recipes and
    downstream projects can rely on a known GNU Make rather than the
    host's (which on BSD/macOS may be BSD make or an older version).

source:
  type: tarball
  url: https://ftp.gnu.org/gnu/make/make-4.4.1.tar.gz
  sha256: "dd16fb1d67bfab79a72f5e8390735c49e3e8e70b4945a15ab1f81ddb78658fb3"
  strip_components: 1

patches: []

depends:
  # Windows only: make is built for the MSYS subsystem, by the MSYS gcc of the
  # MSYS2 bootstrap, and its make.exe links msys-2.0.dll -- so msys2 is both
  # what builds it and what it needs to run. Never `make` itself (self-cycle,
  # see notes); with no make in the bootstrap, build.sh uses GNU Make's own
  # make-less build.sh instead.
  build:
    - name: msys2
      platforms: [windows]
  runtime:
    - name: msys2
      platforms: [windows]
  host_tools: []

build:
  build_type_independent: true
  matrix:
    - platform: linux
      script: build.sh
    - platform: macos
      script: build.sh
    - platform: freebsd
      script: build.sh
    - platform: openbsd
      script: build.sh
    - platform: netbsd
      script: build.sh
    - platform: haiku
      script: build.sh
    - platform: windows
      script: build.ps1

package:
  files:
    # bin/make on unix, bin/make.exe on windows.
    - bin/make*
    - share/man/man1/make*

notes:
  - title: "Base bootstrap tool — do not add a make dependency (self-cycle)"
    description: >-
      GNU Make is compiled with an existing make (build.sh runs
      `./configure && make && make install`), i.e. it bootstraps from the host
      toolchain -- or, where there is none (the Windows MSYS2 bootstrap ships no
      make), with GNU Make's own make-less build.sh. It must NOT be given a
      `make` build dependency — that would be a self-cycle. The consumer
      relocation (host_tools -> depends.build) deliberately skips the base tool
      recipes for this reason.
