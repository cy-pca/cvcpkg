schema_version: 1
recipe:
  name: gymnasium-cp313
  upstream_version: "1.3.0"
  cvc_revision: 1

  maintainer: "cvcpkg group"
  maintainer_email: "info@cvcpkg.org"
  maintainer_url: "https://cvcpkg.org"
  homepage: https://pypi.org/project/gymnasium/
  license: "MIT"
  tags: [python, source]
  description: >-
    gymnasium 1.3.0 for CPython 3.13 — the cp313 column of
    cvcpkg's per-interpreter matrix (pure-Python, built from the PyPI sdist);
    generated by tools/gen_python_recipes.py.
    Built FROM SOURCE: cvcpkg fetches and sha256-verifies the PyPI sdist,
    and build.sh compiles the wheel with the prefix's own CPython 3.13 —
    no third-party prebuilt binary enters the bundle.

# From-source sdist, sha256 as published by PyPI for this exact version.
source:
  # Built from the source package gymnasium-src, which pins the upstream tarball
  # (https://files.pythonhosted.org/packages/4d/ff/14b6880d703dfaca204490979d3254ccd280c99550798993319902873658/gymnasium-1.3.0.tar.gz).
  type: package
  package: gymnasium-src

python:
  interpreter: python313
  abi: cp313

patches: []

depends:
  build:
    - name: gymnasium-src
      version: "==1.3.0"
    - name: python313
    - name: cloudpickle-cp313
    - name: farama-notifications-cp313
    - name: numpy-cp313
    - name: typing-extensions-cp313
    # PEP-517 build backend, from this sdist's [build-system] requires.
    # --no-build-isolation means pip will NOT fetch it, so it has to be
    # in the build prefix already (build.sh bridges it onto sys.path).
    - name: setuptools-cp313
  runtime:
    - name: python313
    - name: cloudpickle-cp313
    - name: farama-notifications-cp313
    - name: numpy-cp313
    - name: typing-extensions-cp313
  host_tools:
    - python313

build:
  build_type_independent: true
  matrix:
    - platform: any
      script: build.sh
    - platform: windows
      script: build.ps1

package:
  files:
    - { glob: "lib/python3.13/site-packages/gymnasium/", platforms: [any] }
    - { glob: "lib/python3.13/site-packages/gymnasium-*.dist-info/", platforms: [any] }
    - { glob: "Lib/site-packages/gymnasium/", platforms: [windows] }
    - { glob: "Lib/site-packages/*.dist-info/", platforms: [windows] }
