schema_version: 1
recipe:
  name: xkbcommon
  upstream_version: "1.7.0"
  # Bumped 1 -> 2: added openbsd/netbsd builds. Both ship this library in
  # ports/pkgsrc, and their absence left xkbcommon-x11 advertising those two
  # platforms while depending on a package that had no build for them, so the
  # claim could never resolve.
  # Bumped 2 -> 3: relocatable-default-paths.patch.  The XKB config root, the
  # XKB extra path and the X locale dir were absolute paths into the builder's
  # job directory (/tmp/cvcpkg-builder/.../install/share/X11/xkb, ...), so in an
  # installed prefix xkb_keymap_new_from_names() and
  # xkb_compose_table_new_from_locale() failed unless XKB_CONFIG_ROOT and
  # XLOCALEDIR were set (WezTerm: "no keymap" on Wayland, "Failed to acquire
  # compose table" on X11).  libxkbcommon now resolves them against its own
  # directory via dladdr() -- <libdir>/../share/X11/xkb, ../etc/xkb and
  # ../share/X11/locale -- as libglvnd does for its EGL vendor dir, and only
  # falls back to the OS's own X data paths (build.sh) when those are absent.
  # Baking the paths of the data packages instead (xkeyboard-config ships
  # share/X11/xkb, libx11 ships share/X11/locale) cannot work: an absolute path
  # compiled in on the builder names the builder's prefix, never the
  # consumer's, and cvcpkg does not rewrite paths inside binaries at install.
  # Resolving relative to the library finds those same packages wherever the
  # prefix is, and needs no hard dependency on them (xkeyboard-config is
  # linux-only, and libx11 would pull X11 into Wayland-only consumers).
  cvc_revision: 3
  maintainer: "cvcpkg group"
  maintainer_email: "info@cvcpkg.org"
  maintainer_url: "https://cvcpkg.org"
  homepage: https://xkbcommon.org/
  license: MIT
  tags: [libraries]
  description: >-
    libxkbcommon — a keymap handling library for toolkits and window
    systems.  Provides keyboard input handling for Wayland
    compositors and clients.  Required by GTK 4 on Linux.

source:
  # Built from the source package xkbcommon-src, which pins the upstream tarball
  # (https://xkbcommon.org/download/libxkbcommon-1.7.0.tar.xz).
  type: package
  package: xkbcommon-src

patches:
  - relocatable-default-paths.patch

depends:
  build:
    - name: xkbcommon-src
      version: "==1.7.0"
    - ninja
    - meson
    - pkg-config
    # src/xkbcomp/parser.y needs bison: FreeBSD's byacc rejects it ("syntax
    # error" at line 88) and OpenBSD has byacc only as `yacc`, which meson's
    # find_program does not look for.
    - bison
    # build.sh sets -Denable-tools=false, and libxkbcommon itself does not link
    # wayland -- the wayland bits only feed the (disabled) interactive-wayland
    # tool and wayland-scanner codegen.  Build-time only; must not ship.
    - name: wayland
      version: "^1.23"
      platforms: [linux, freebsd]
    - name: wayland-protocols
      version: "^1.38"
      platforms: [linux, freebsd]
  host_tools: []

build:
  matrix:
    - platform: linux
      script: build.sh
      env:
        CFLAGS: "-O2 -fPIC"
    - platform: freebsd
      script: build.sh
      env:
        CFLAGS: "-O2 -fPIC"
    # The wayland/wayland-protocols build deps above stay scoped to
    # linux+freebsd: build.sh passes -Denable-tools=false, so they only feed
    # the disabled interactive-wayland tool and are not needed here.
    - platform: openbsd
      script: build.sh
      env:
        CFLAGS: "-O2 -fPIC"
    - platform: netbsd
      script: build.sh
      env:
        CFLAGS: "-O2 -fPIC"

package:
  files:
    - lib/libxkbcommon*
    - lib/pkgconfig/xkbcommon*.pc
    - include/xkbcommon/
    # No libexec/xkbcommon/: build.sh passes -Denable-tools=false, so the xkbcli
    # helpers that live there are never built (strict package.files refused it).
  # xkbcommon-x11.pc ships in the xkbcommon-x11 package (-Denable-x11=false here).
  pkg_config:
    - xkbcommon

abi:
  cxx_std: 17

notes:
  - title: "Unix desktop platforms only"
    platforms: [linux, freebsd, openbsd, netbsd]
    description: >-
      xkbcommon is used on Linux and the BSDs with Wayland or X11.
      macOS and Windows use their native keyboard input mechanisms.
