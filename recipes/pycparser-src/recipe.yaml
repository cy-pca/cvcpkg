  tags: [source]
  description: >-
    The unmodified upstream source of pycparser 3.0: its release tarball,
    verified against the sha256 below and staged at src/pycparser-src/.  The
    pycparser-cp311, pycparser-cp312 and pycparser-cp313 recipes build from it
