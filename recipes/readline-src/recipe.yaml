  license: GPL-3.0-or-later
  tags: [source]
  description: >-
    The unmodified upstream source of readline 8.3: its release tarball,
    verified against the sha256 below and staged at src/readline-src/.  The readline
    recipe builds from it (source.type package), so the tarball is fetched
    once, from ftp.gnu.org, and every other build of readline -- another
