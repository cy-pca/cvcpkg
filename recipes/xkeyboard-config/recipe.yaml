  url: https://xorg.freedesktop.org/archive/individual/data/xkeyboard-config/xkeyboard-config-2.48.tar.xz
  sha256: "b77041324f0109f77161ee43743fe04baa485866af8460d31e476ad3f7648fd5"
  strip_components: 1

patches: []

depends:
  build:
    - meson
    - ninja
    - pkg-config
    - perl
    - python311
  runtime: []
  host_tools: []

package:
  files:
    - share/

build:
  matrix:
    - platform: linux
      script: build.sh
