schema_version: 1
recipe:
  name: xkeyboard-config
  upstream_version: "2.48"
  cvc_revision: 1
  maintainer: "cvcpkg group"
  maintainer_email: "info@cvcpkg.org"
  maintainer_url: "https://cvcpkg.org"
  homepage: https://www.freedesktop.org/wiki/Software/XKeyboardConfig/
  license: MIT
  tags: [x11, data]
