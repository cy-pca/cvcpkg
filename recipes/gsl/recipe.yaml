schema_version: 1
recipe:
  name: gsl
  upstream_version: "2.8"
  cvc_revision: 5
  maintainer: "cvcpkg group"
  maintainer_email: "info@cvcpkg.org"
  maintainer_url: "https://cvcpkg.org"
  description: "GNU Scientific Library — a numerical library for C and C++ programmers."
  homepage: https://www.gnu.org/software/gsl/
  license: GPL-3.0-or-later
  tags: [math, wasm, wasi]

source:
  type: tarball
  url: https://ftp.gnu.org/gnu/gsl/gsl-2.8.tar.gz
  sha256: "6a99eeed15632c6354895b1dd542ed5a855c0f15d9ad1326c6fe2b2c9e423190"
  strip_components: 1

patches: []

depends:
  build:
    - cmake
    - ninja
    # gsl builds via autotools (build.sh / build.ps1 both run ./configure && make),
    # so make is a real build dep — needed on Windows where there is no system make.
    - make
    # Windows autotools build (Invoke-CvcMsysAutotoolsBuild in build.ps1) needs the
    # GNU toolchain in the BUILD closure. cvcpkg stages host_tools only when
    # CROSS-compiling (target != host), so a native Windows build gets nothing
    # from host_tools — these must be real build deps that build from source and
    # stage into the build prefix, where env-windows's $depsFlag puts them on
    # PATH. Scoped to windows: other platforms build from the shipped ./configure
    # with the system toolchain and must not pull the mingw cross-compiler.
    - name: m4
      platforms: [windows]
    - name: autoconf
      platforms: [windows]
    - name: automake
      platforms: [windows]
    - name: libtool
      platforms: [windows]
    - name: mingw-w64-gcc
      platforms: [windows]
  runtime: []
  host_tools: []

build:
  matrix:
    - platform: linux
      script: build.sh
      env:
        CFLAGS: "-O2 -fPIC"
    - platform: macos
      script: build.sh
      env:
        MACOSX_DEPLOYMENT_TARGET: "13.0"
    - platform: freebsd
      script: build.sh
      env:
        CFLAGS: "-O2 -fPIC"
    - platform: openbsd
      script: build.sh
      env:
        CFLAGS: "-O2 -fPIC"
    - platform: netbsd
      script: build.sh
      env:
        CFLAGS: "-O2 -fPIC"
    - platform: haiku
      script: build.sh
      env:
        CFLAGS: "-O2 -fPIC"
    - platform: windows
      script: build.ps1
    - platform: wasm
      host_platform: linux
      script: build-wasm.sh
    - platform: wasm
      host_platform: windows
      script: build-wasm.ps1
    - platform: wasi
      host_platform: linux
      script: build-wasi.sh
    - platform: wasi
      host_platform: windows
      script: build-wasi.ps1
    - platform: cosmo
      host_platform: linux
      script: build-cosmo.sh

package:
  files:
    - lib/libgsl*
    - lib/gsl*
    - lib/cmake/GSL/
    - lib/pkgconfig/gsl*
    - include/gsl/
  cmake_packages:
    - { name: GSL, targets: ["GSL::gsl", "GSL::gslcblas"] }

abi:
  cxx_std: 17
