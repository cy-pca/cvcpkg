schema_version: 1
recipe:
  name: ipywidgets-cp313
  upstream_version: "8.1.9"
  cvc_revision: 1

  maintainer: "cvcpkg group"
  maintainer_email: "info@cvcpkg.org"
  maintainer_url: "https://cvcpkg.org"
  homepage: https://pypi.org/project/ipywidgets/
  license: "BSD-3-Clause"
  tags: [python, source]
  description: >-
    ipywidgets 8.1.9 for CPython 3.13 — the cp313 column of
    cvcpkg's per-interpreter matrix (pure-Python, built from the PyPI sdist);
    generated by tools/gen_python_recipes.py.
    Built FROM SOURCE: cvcpkg fetches and sha256-verifies the PyPI sdist,
    and build.sh compiles the wheel with the prefix's own CPython 3.13 —
    no third-party prebuilt binary enters the bundle.

# From-source sdist, sha256 as published by PyPI for this exact version.
source:
  # Built from the source package ipywidgets-src, which pins the upstream tarball
  # (https://files.pythonhosted.org/packages/c9/7c/6db60eddf38547353b06d57941f5eee22a990640ce30479fd71a810507f2/ipywidgets-8.1.9.tar.gz).
  type: package
  package: ipywidgets-src

python:
  interpreter: python313
  abi: cp313

patches: []

depends:
  build:
    - name: ipywidgets-src
      version: "==8.1.9"
    - name: python313
    - name: comm-cp313
    - name: ipython-cp313
    - name: jupyterlab-widgets-cp313
    - name: traitlets-cp313
    - name: widgetsnbextension-cp313
    # PEP-517 build backend, from this sdist's [build-system] requires.
    # --no-build-isolation means pip will NOT fetch it, so it has to be
    # in the build prefix already (build.sh bridges it onto sys.path).
    - name: setuptools-cp313
    - name: wheel-cp313
  runtime:
    - name: python313
    - name: comm-cp313
    - name: ipython-cp313
    - name: jupyterlab-widgets-cp313
    - name: traitlets-cp313
    - name: widgetsnbextension-cp313
  host_tools:
    - python313

build:
  build_type_independent: true
  matrix:
    - platform: any
      script: build.sh
    - platform: windows
      script: build.ps1

package:
  files:
    - { glob: "lib/python3.13/site-packages/ipywidgets/", platforms: [any] }
    - { glob: "lib/python3.13/site-packages/*.dist-info/", platforms: [any] }
    - { glob: "Lib/site-packages/ipywidgets/", platforms: [windows] }
    - { glob: "Lib/site-packages/*.dist-info/", platforms: [windows] }
