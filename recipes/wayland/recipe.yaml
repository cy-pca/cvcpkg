schema_version: 1
recipe:
  name: wayland
  upstream_version: "1.23.1"
  # Bumped 1 -> 2: added openbsd/netbsd builds. OpenBSD carries a dedicated
  # wayland/ ports category (wlroots, sway, labwc) and NetBSD ships
  # devel/wayland in pkgsrc, so the previous linux+freebsd scoping understated
  # where this actually builds.
  # Bumped 2 -> 3: (1) disable dtd_validation (build.sh) — cvc.2 never published
  # because a from-source build fails "Dependency libxml-2.0 not found" (wayland's
  # optional DTD validator needs libxml2, which is not in the closure). Validation
  # is authoring-only; libwayland + wayland-scanner build fine without it. (2) add
  # the new `epoll-shim` dep on the BSDs so libwayland-server's epoll event loop
  # resolves there — the other half of getting wayland to build on FreeBSD/OpenBSD/
  # NetBSD (previously only linux ever published).
  # Bumped 3 -> 4: (1) rebuild against libffi 3.7.1+cvc.5, whose OpenBSD
  # libffi.so.12.1 finally has a SONAME. +cvc.3 openbsd recorded DT_NEEDED
  # ".../cvcpkg-job-wayland-.../lib/libffi.so.12.1" (meson links pkg-config
  # deps by full path, and a SONAME-less library is recorded by that path), so
  # libwayland-client/-server could not load anywhere but inside that deleted
  # build job. (2) FreeBSD: meson's pkgconfig module installs .pc files to
  # <prefix>/libdata/pkgconfig there; build.sh moves them to lib/pkgconfig, the
  # path package.files lists and consumers search. (3) RUNPATH is now
  # "$ORIGIN:$ORIGIN/../lib", so bin/wayland-scanner finds libexpat in the
  # bundle's lib/ (with only $ORIGIN it searched bin/). Also picks up
  # epoll-shim +cvc.2's lib/pkgconfig/epoll-shim.pc on the BSDs, so meson finds
  # epoll-shim through pkg-config instead of its CMake-package fallback.
  # Bumped 4 -> 5: NetBSD support (netbsd-support.patch; no NetBSD wayland was
  # ever published). Upstream's meson.build pulls in epoll-shim only on FreeBSD
  # and OpenBSD and assumes native epoll/signalfd everywhere else, so the
  # NetBSD configure stopped at "SFD_CLOEXEC is needed to compile Wayland
  # libraries". The patch (1) adds netbsd to that epoll-shim list (its
  # include/libepoll-shim provides sys/epoll.h and sys/signalfd.h there; NetBSD
  # 10 has timerfd natively); (2) defines _NETBSD_SOURCE on NetBSD, where
  # upstream's -D_POSIX_C_SOURCE=200809L otherwise hides SOCK_CLOEXEC,
  # MSG_CMSG_CLOEXEC, accept4 and LOCAL_PEEREID; (3) gives wayland-os.c a
  # NetBSD peer-credential path (LOCAL_PEEREID) -- NetBSD has no SO_PEERCRED,
  # so upstream hits #error "Don't know how to read ucred on this platform";
  # (4) casts scanner.c's ctype arguments to unsigned char, which pkgsrc
  # carries because wayland-scanner crashes on NetBSD on non-ASCII protocol
  # text. (3) and (4) are guarded or behaviour-neutral elsewhere, so linux and
  # the other BSDs rebuild to the same code. pkgsrc devel/wayland carries
  # equivalents of (1), (2) and (4).
  cvc_revision: 5
  maintainer: "cvcpkg group"
  maintainer_email: "info@cvcpkg.org"
  maintainer_url: "https://cvcpkg.org"
  homepage: https://wayland.freedesktop.org/
  license: MIT
  tags: [libraries]
  description: >-
    Wayland — the reference implementation of the Wayland display
    server protocol.  Provides libwayland-client, libwayland-server,
    and libwayland-cursor.  Required by GTK 4 on Linux.

source:
  type: tarball
  url: https://gitlab.freedesktop.org/wayland/wayland/-/releases/1.23.1/downloads/wayland-1.23.1.tar.xz
  sha256: "864fb2a8399e2d0ec39d56e9d9b753c093775beadc6022ce81f441929a81e5ed"
  strip_components: 1

patches:
  # NetBSD: epoll-shim + _NETBSD_SOURCE (meson.build), LOCAL_PEEREID peer
  # credentials (src/wayland-os.c), unsigned-char ctype args (src/scanner.c).
  # See the cvc_revision 5 note above.
  - netbsd-support.patch

depends:
  build:
    - ninja
    - meson
    - pkg-config
  runtime:
    - name: libffi
      version: "^3.4"
    - name: expat
      version: "^2.6"
    # BSD event loop: libwayland-server's event loop uses epoll (and signalfd),
    # which the BSDs have no native equivalent for. wayland's meson requires
    # the `epoll-shim` pkg-config package there (meson.build:
    # dependency('epoll-shim'); upstream lists freebsd/openbsd, and
    # netbsd-support.patch adds netbsd).
    - name: epoll-shim
      platforms: [freebsd, openbsd, netbsd]
  host_tools: []

build:
  matrix:
    - platform: linux
      script: build.sh
      env:
        CFLAGS: "-O2 -fPIC"
    - platform: freebsd
      script: build.sh
      env:
        CFLAGS: "-O2 -fPIC"
    - platform: openbsd
      script: build.sh
      env:
        CFLAGS: "-O2 -fPIC"
    - platform: netbsd
      script: build.sh
      env:
        CFLAGS: "-O2 -fPIC"

package:
  files:
    - lib/libwayland-client*
    - lib/libwayland-server*
    - lib/libwayland-cursor*
    - lib/libwayland-egl*
    - lib/pkgconfig/wayland-*.pc
    - include/wayland-*.h
    - bin/wayland-scanner
    - share/wayland/
  pkg_config:
    - wayland-client
    - wayland-server
    - wayland-cursor
    - wayland-egl
    - wayland-scanner

abi:
  cxx_std: 17

notes:
  - title: "Linux and the BSDs only"
    platforms: [linux, freebsd, openbsd, netbsd]
    description: >-
      Wayland is built for Linux, FreeBSD, OpenBSD and NetBSD (the BSDs
      through epoll-shim). macOS and Windows use their native display
      servers.
