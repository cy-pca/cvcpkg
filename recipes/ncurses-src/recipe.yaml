  upstream_version: "6.5"
  cvc_revision: 1
  maintainer: cvcpkg group
  maintainer_email: info@cvcpkg.org
  maintainer_url: https://cvcpkg.org
  homepage: https://invisible-island.net/ncurses/
  license: MIT
  tags: [source]
  description: >-
    The unmodified upstream source of ncurses 6.5: its release tarball,
    verified against the sha256 below and staged at src/ncurses-src/.  The ncurses
    recipe builds from it (source.type package), so the tarball is fetched
    once, from ftp.gnu.org, and every other build of ncurses -- another
    platform, a builder that cannot reach ftp.gnu.org, a user building from
