schema_version: 1
recipe:
  name: glu
  upstream_version: "9.0.3"
  cvc_revision: 1
  maintainer: "cvcpkg group"
  maintainer_email: "info@cvcpkg.org"
  maintainer_url: "https://cvcpkg.org"
  homepage: https://mesa3d.org/
  license: SGI-B-2.0
  tags: [libraries, x11, graphics]
  description: >-
    The OpenGL Utility library (GLU), linking the libglvnd loader.

source:
  # Built from the source package glu-src, which pins the upstream tarball
  # (https://archive.mesa3d.org/glu/glu-9.0.3.tar.xz).
  type: package
  package: glu-src

patches: []

depends:
  build:
    - name: glu-src
      version: "==9.0.3"
    - meson
    - ninja
    - pkg-config
  runtime:
    - name: libglvnd
  host_tools: []

package:
  files:
    - lib/
    - include/

build:
  matrix:
    - platform: linux
      script: build.sh
    - platform: freebsd
      script: build.sh
    - platform: openbsd
      script: build.sh
    - platform: netbsd
      script: build.sh
