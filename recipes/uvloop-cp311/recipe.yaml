schema_version: 1
recipe:
  name: uvloop-cp311
  upstream_version: "0.22.1"
  cvc_revision: 1

  maintainer: "cvcpkg group"
  maintainer_email: "info@cvcpkg.org"
  maintainer_url: "https://cvcpkg.org"
  homepage: https://pypi.org/project/uvloop/
  license: "MIT OR Apache-2.0"
  tags: [python, source]
  description: >-
    uvloop 0.22.1 for CPython 3.11 — the cp311 column of cvcpkg's per-interpreter
    matrix, BUILT FROM SOURCE against cvcpkg's own libuv (recipes/libuv, libuv.so.1)
    instead of the copy the PyPI sdist/wheel bundles. The extension resolves the
    library by soname out of the merged prefix through an $ORIGIN-relative RUNPATH.
    Installed as a real wheel (dist-info/RECORD/METADATA) via pip.

# From-source sdist (NOT source.type python_wheel): cvcpkg fetches and
# sha256-verifies the PyPI sdist (digest as published in the PyPI JSON API) and
# extracts it to CVC_SOURCE_DIR.
source:
  # Built from the source package uvloop-src, which pins the upstream tarball
  # (https://files.pythonhosted.org/packages/06/f0/18d39dbd1971d6d62c4629cc7fa67f74821b0dc1f5a77af43719de7936a7/uvloop-0.22.1.tar.gz).
  type: package
  package: uvloop-src

python:
  interpreter: python311
  abi: cp311

patches: []

depends:
  build:
    - name: uvloop-src
      version: "==0.22.1"
    - name: python311
    - name: setuptools-cp311
    - name: wheel-cp311
    - name: cython-cp311
    - name: libuv
  runtime:
    - name: python311
    - name: libuv
  host_tools:
    - python311
    - patchelf

build:
  # The extension ABI does not vary with cvcpkg's Release/Debug build type.
  build_type_independent: true
  matrix:
    - platform: linux
      script: build.sh
    - platform: macos
      script: build.sh
      env:
        MACOSX_DEPLOYMENT_TARGET: "13.0"

package:
  # DOCUMENTATION ONLY: stage_bundle ships the whole CVC_INSTALL_DIR, which
  # build.sh keeps to exactly this package (pip install --prefix into an empty dir).
  files:
    - { glob: "lib/python3.11/site-packages/uvloop/", platforms: [linux, macos] }
    - { glob: "lib/python3.11/site-packages/uvloop-*.dist-info/", platforms: [linux, macos] }

notes:
  - title: "Not built on Windows"
    platforms: [linux, macos]
    description: >-
      uvloop does not support Windows (upstream publishes no Windows wheel; winloop
      is the separate Windows port and is not packaged).
