schema_version: 1
recipe:
  name: faker-cp313t
  upstream_version: "40.31.0"
  cvc_revision: 1

  maintainer: "cvcpkg group"
  maintainer_email: "info@cvcpkg.org"
  maintainer_url: "https://cvcpkg.org"
  homepage: https://pypi.org/project/faker/
  license: "MIT"
  tags: [python, source]
  description: >-
    faker 40.31.0 for CPython 3.13t — the cp313t column of
    cvcpkg's per-interpreter matrix (pure-Python, built from the PyPI sdist);
    generated by tools/gen_python_recipes.py.
    Built FROM SOURCE: cvcpkg fetches and sha256-verifies the PyPI sdist,
    and build.sh compiles the wheel with the prefix's own CPython 3.13t —
    no third-party prebuilt binary enters the bundle.
    The cp313t column installs under the free-threaded (no-GIL)
    interpreter and its import check runs with the GIL disabled.

# From-source sdist, sha256 as published by PyPI for this exact version.
source:
  type: tarball
  url: https://files.pythonhosted.org/packages/74/e1/adf05724d5838fa9fe2ada64bf390bbf37b77e3714189ae9f17a2c6d0470/faker-40.31.0.tar.gz
  sha256: "af163a937aec99dca5abaeb94dd5008c51c26c6e9af1a26c8db4b3c4e7ca4403"
  strip_components: 1

python:
  interpreter: python313t
  abi: cp313t

patches: []

depends:
  build:
    - name: python313t
    - name: tzdata-cp313t
    # PEP-517 build backend, from this sdist's [build-system] requires.
    # --no-build-isolation means pip will NOT fetch it, so it has to be
    # in the build prefix already (build.sh bridges it onto sys.path).
    - name: setuptools-cp313t
    - name: wheel-cp313t
  runtime:
    - name: python313t
    - name: tzdata-cp313t
  host_tools:
    - python313t

provides:
  - faker

build:
  build_type_independent: true
  matrix:
    - platform: any
      script: build.sh
    - platform: windows
      script: build.ps1

package:
  files:
    - { glob: "lib/python3.13t/site-packages/faker/", platforms: [any] }
    - { glob: "lib/python3.13t/site-packages/*.dist-info/", platforms: [any] }
    - { glob: "bin/faker", platforms: [any] }
    - { glob: "Lib/site-packages/faker/", platforms: [windows] }
    - { glob: "Lib/site-packages/*.dist-info/", platforms: [windows] }
