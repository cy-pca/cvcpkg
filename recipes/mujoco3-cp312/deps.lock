# recipes/mujoco3-cp312/deps.lock — the sources the mujoco 3.17.0 sdist's
# CMake would otherwise `git fetch` while pip builds the wheel, pinned
# to the commits upstream pins in mujoco/CMakeLists.txt (abseil, Eigen,
# pybind11), mujoco/simulate/cmake/SimulateDependencies.cmake (glfw) and
# mujoco/cmake/third_party_deps/lodepng.cmake.  Same format and mechanism as
# recipes/mujoco3/deps.lock (see that file); deps.sh / deps.ps1 here are copies
# of recipes/mujoco's.  Only Eigen differs from recipes/mujoco-core-cp312's.
#
# Eigen's archive comes from GitLab, which does not promise byte-stable
# archives the way GitHub does for commit tarballs: if GitLab ever regenerates
# it, the sha256 check fails loudly and the line needs a new checksum.
#
# Format: <library-name> <git-commit> <sha256-of-archive> <archive-url>
