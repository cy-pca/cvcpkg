schema_version: 1
recipe:
  name: ncurses
  upstream_version: "6.5"
  # cvc.2: relocatable .pc/.cmake/bin/*-config.  The published cvc.1
  # kept build-machine paths (/tmp/cvcpkg-builder/...) in them, so pkg-config,
  # find_package or the -config script handed consumers dead -I/-L paths
  # (2026-10-13 scan of every published linux bundle).
  # cvc.3: the terminfo database is found where the bundle is installed
  # (terminfo-relative-to-library.patch).  cvc.2's search path was the build
  # job's own /tmp/cvcpkg-builder/... dir and then the host's, so the
  # bundle's share/terminfo was never read.  Rebuilt with today's relocation
  # pass, bin/ tools get RUNPATH $ORIGIN/../lib (cvc.2's had $ORIGIN, so
  # infocmp, tput, tic... loaded the host's libncursesw and could fail with
  # "undefined symbol: _nc_disable_period"); test.sh checks both.
  cvc_revision: 3
  maintainer: "cvcpkg group"
  maintainer_email: "info@cvcpkg.org"
  maintainer_url: "https://cvcpkg.org"
  homepage: https://invisible-island.net/ncurses/
  license: MIT
  tags: [libraries, tui]
  description: >-
    ncurses — terminal-independent text UI library.  Provides libncurses,
    libncursesw (wide-character), libtinfo, and the terminfo database.
    Required by CPython's curses and readline modules and by many CLI tools.

source:
  # Built from the source package ncurses-src, which pins the upstream tarball
  # (https://ftp.gnu.org/gnu/ncurses/ncurses-6.5.tar.gz).
  type: package
  package: ncurses-src

patches:
  # Linux and macOS: search <prefix>/share/terminfo, <prefix> being the parent
  # of the directory the library was loaded from (dladdr), ahead of the
  # configured /usr/share/terminfo:/etc/terminfo.  The BSDs keep the
  # configured list only.
  - terminfo-relative-to-library.patch

depends:
  build:
    - name: ncurses-src
      version: "==6.5"
    - pkg-config
  runtime: []
  host_tools: []

build:
  matrix:
    - platform: linux
      script: build.sh
      env:
        CFLAGS: "-O2 -fPIC"
    - platform: macos
      script: build.sh
      env:
        MACOSX_DEPLOYMENT_TARGET: "13.0"
    - platform: freebsd
      script: build.sh
      env:
        CFLAGS: "-O2 -fPIC"
    - platform: openbsd
      script: build.sh
      env:
        CFLAGS: "-O2 -fPIC"
    - platform: netbsd
      script: build.sh
      env:
        CFLAGS: "-O2 -fPIC"
    - platform: haiku
      script: build.sh
      env:
        CFLAGS: "-O2 -fPIC"

package:
  files:
    - lib/libncurses*
    - lib/libncursesw*
    # No separate libtinfo: ncurses is configured without --with-termlib.
    - lib/libform*
    - lib/libmenu*
    - lib/libpanel*
    - lib/pkgconfig/ncurses*.pc
    - lib/pkgconfig/form*.pc
    - lib/pkgconfig/menu*.pc
    - lib/pkgconfig/panel*.pc
    - include/ncurses/
    - include/ncursesw/
    - include/curses.h
    - include/ncurses.h
    - include/term.h
    - include/termcap.h
    - share/terminfo/
    - bin/infocmp*
    - bin/tic*
    - bin/tput*
    - bin/tset*
  cmake_packages: []

test:
  script: test.sh

abi:
  cxx_std: 17
