schema_version: 1
recipe:
  name: robin-map
  upstream_version: "1.3.0"
  cvc_revision: 1
  maintainer: "cvcpkg group"
  maintainer_email: "info@cvcpkg.org"
  maintainer_url: "https://cvcpkg.org"
  homepage: https://github.com/Tessil/robin-map
  license: MIT
  tags: [libraries, cpp, header-only]
  description: >-
    tsl::robin_map — a header-only C++ hash map and hash set using open
    addressing and Robin Hood hashing.  OpenImageIO requires it at build time
    (find_package(Robinmap)); nanobind vendors it.  1.3.0 is Blender 5.2's pin.

source:
  type: tarball
  url: https://github.com/Tessil/robin-map/archive/refs/tags/v1.3.0.tar.gz
  sha256: "a8424ad3b0affd4c57ed26f0f3d8a29604f0e1f2ef2089f497f614b1c94c7236"
  strip_components: 1

patches: []

depends:
  build: []
  runtime: []
  host_tools:
    - cmake
    - ninja

build:
  # Header-only: one install tree for every platform.
  build_type_independent: true
  matrix:
    - platform: linux
      script: build.sh
    - platform: macos
      script: build.sh
    - platform: windows
      script: build.ps1

package:
  files:
    - include/tsl/
    - share/cmake/tsl-robin-map/
  cmake_packages:
    - { name: tsl-robin-map, targets: ["tsl::robin_map"] }

abi:
  cxx_std: 17
