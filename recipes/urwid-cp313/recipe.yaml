schema_version: 1
recipe:
  name: urwid-cp313
  upstream_version: "3.0.5"
  cvc_revision: 1

  maintainer: "cvcpkg group"
  maintainer_email: "info@cvcpkg.org"
  maintainer_url: "https://cvcpkg.org"
  homepage: https://pypi.org/project/urwid/
  license: "LGPL-2.1-only"
  tags: [python, source]
  description: >-
    urwid 3.0.5 for CPython 3.13 — the cp313 column of
    cvcpkg's per-interpreter matrix (pure-Python, built from the PyPI sdist);
    generated by tools/gen_python_recipes.py.
    Built FROM SOURCE: cvcpkg fetches and sha256-verifies the PyPI sdist,
    and build.sh compiles the wheel with the prefix's own CPython 3.13 —
    no third-party prebuilt binary enters the bundle.

# From-source sdist, sha256 as published by PyPI for this exact version.
source:
  # Built from the source package urwid-src, which pins the upstream tarball
  # (https://files.pythonhosted.org/packages/b1/59/67cd42db7c549c0c106d2b56d2d2ec1915c459e0a92722029efc5359e871/urwid-3.0.5.tar.gz).
  type: package
  package: urwid-src

python:
  interpreter: python313
  abi: cp313

patches: []

depends:
  build:
    - name: urwid-src
      version: "==3.0.5"
    - name: python313
    - name: wcwidth-cp313
    # PEP-517 build backend, from this sdist's [build-system] requires.
    # --no-build-isolation means pip will NOT fetch it, so it has to be
    # in the build prefix already (build.sh bridges it onto sys.path).
    - name: setuptools-cp313
    - name: wheel-cp313
    - name: setuptools-scm-cp313
  runtime:
    - name: python313
    - name: wcwidth-cp313
  host_tools:
    - python313

build:
  build_type_independent: true
  matrix:
    - platform: any
      script: build.sh
    - platform: windows
      script: build.ps1

package:
  files:
    - { glob: "lib/python3.13/site-packages/urwid/", platforms: [any] }
    - { glob: "lib/python3.13/site-packages/*.dist-info/", platforms: [any] }
    - { glob: "Lib/site-packages/urwid/", platforms: [windows] }
    - { glob: "Lib/site-packages/*.dist-info/", platforms: [windows] }
