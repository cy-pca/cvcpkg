schema_version: 1
recipe:
  name: libxau
  upstream_version: "1.0.12"
  # Bumped 1 -> 2: xorgproto is a runtime dep, as for libx11 (#380). xau.pc
  # says `Requires: xproto`, so pkg-config cannot resolve it (nor xcb.pc above it)
  # without xorgproto.  Builder jobs stopped installing deps' build deps on
  # 2026-10-19, and a fresh xcb-util build then failed "Package 'xproto', required
  # by 'xau', not found" (dev cluster, FreeBSD and NetBSD, cy-pca/cvcpkg#527).
  cvc_revision: 2
  maintainer: "cvcpkg group"
  maintainer_email: "info@cvcpkg.org"
  maintainer_url: "https://cvcpkg.org"
  homepage: https://www.x.org/
  license: MIT
  tags: [libraries, x11, graphics]
  description: >-
    X11 Authorization Protocol library (Xau).

source:
  # Built from the source package libxau-src, which pins the upstream tarball
  # (https://xorg.freedesktop.org/releases/individual/lib/libXau-1.0.12.tar.xz).
  type: package
  package: libxau-src

patches: []

depends:
  build:
    - name: libxau-src
      version: "==1.0.12"
    - meson
    - ninja
    - pkg-config
    - name: xorgproto
  runtime:
    # xau.pc requires xproto.pc, which xorgproto ships.
    - name: xorgproto
  host_tools: []

package:
  files:
    - lib/
    - include/
    - share/

build:
  matrix:
    - platform: linux
      script: build.sh
    - platform: freebsd
      script: build.sh
    - platform: openbsd
      script: build.sh
    - platform: netbsd
      script: build.sh
