schema_version: 1
recipe:
  name: autoconf
  upstream_version: "2.72"
  cvc_revision: 3
  maintainer: "cvcpkg group"
  maintainer_email: "info@cvcpkg.org"
  maintainer_url: "https://cvcpkg.org"
  homepage: https://www.gnu.org/software/autoconf/
  license: GPL-3.0-or-later
  tags: [tools, build-system]
  description: >-
    GNU Autoconf — generates configure scripts for portable builds.

source:
  type: tarball
  url: https://ftp.gnu.org/gnu/autoconf/autoconf-2.72.tar.xz
  sha256: "ba885c1319578d6c94d46e9b0dceb4014caafe2490e437a0dbca3f270a223f5a"
  strip_components: 1

patches: []

depends:
  # On Windows autoconf is built (and runs) inside the MSYS subsystem of the
  # MSYS2 bootstrap, whose MSYS perl it uses -- the cvcpkg perl there is a native
  # Strawberry Perl that MSYS-path scripts cannot drive, so perl is scoped to
  # the unix platforms. make drives the Windows build (unix uses the host's).
  build:
    - m4
    - name: perl
      platforms: [linux, macos, freebsd, openbsd, netbsd]
    - name: msys2
      platforms: [windows]
    - name: make
      platforms: [windows]
  # Explicit, so the build-only make never reaches consumers' required_deps;
  # unix bundles keep exactly the [m4, perl] they always carried.
  runtime:
    - m4
    - name: perl
      platforms: [linux, macos, freebsd, openbsd, netbsd]
    - name: msys2
      platforms: [windows]
  host_tools: []

build:
  build_type_independent: true
  matrix:
    - platform: linux
      script: build.sh
    - platform: macos
      script: build.sh
    - platform: freebsd
      script: build.sh
    - platform: openbsd
      script: build.sh
    - platform: netbsd
      script: build.sh
    - platform: windows
      script: build.ps1

package:
  files:
    - bin/autoconf*
    - bin/autoheader*
    - bin/autom4te*
    - bin/autoreconf*
    - bin/autoscan*
    - bin/autoupdate*
    - bin/ifnames*
    - share/autoconf/
