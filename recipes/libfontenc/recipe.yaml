schema_version: 1
recipe:
  name: libfontenc
  upstream_version: "1.1.9"
  cvc_revision: 1
  maintainer: "cvcpkg group"
  maintainer_email: "info@cvcpkg.org"
  maintainer_url: "https://cvcpkg.org"
  homepage: https://www.x.org/
  license: MIT
  tags: [libraries, x11, fonts]
  description: >-
    libfontenc — font encoding library used by the X font stack
    (libXfont2).  Dependency of the hermetic Xvfb virtual X server.

source:
  # Built from the source package libfontenc-src, which pins the upstream tarball
  # (https://xorg.freedesktop.org/archive/individual/lib/libfontenc-1.1.9.tar.xz).
  type: package
  package: libfontenc-src

patches: []

depends:
  build:
    - name: libfontenc-src
      version: "==1.1.9"
    - pkg-config
    - name: xorgproto
  runtime:
    - name: zlib
  host_tools: []

package:
  files:
    - lib/
    - include/

build:
  matrix:
    - platform: linux
      script: build.sh
      env:
        CFLAGS: "-O2 -fPIC"
