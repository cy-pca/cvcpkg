schema_version: 1
recipe:
  name: botocore-cp312
  upstream_version: "1.43.49"
  cvc_revision: 2

  maintainer: "cvcpkg group"
  maintainer_email: "info@cvcpkg.org"
  maintainer_url: "https://cvcpkg.org"
  homepage: https://pypi.org/project/botocore/
  license: "Apache-2.0"
  tags: [python, source]
  description: >-
    botocore 1.43.49 for CPython 3.12 — the cp312 column of
    cvcpkg's per-interpreter matrix (pure-Python, built from the PyPI sdist);
    generated by tools/gen_python_recipes.py.
    Built FROM SOURCE: cvcpkg fetches and sha256-verifies the PyPI sdist,
    and build.sh compiles the wheel with the prefix's own CPython 3.12 —
    no third-party prebuilt binary enters the bundle.

# From-source sdist, sha256 as published by PyPI for this exact version.
source:
  # Built from the source package botocore-src, which pins the upstream tarball
  # (https://files.pythonhosted.org/packages/bc/2c/da2832f435371cd6c95b64325f981b3babe71e4aa4a71798b00ce2073100/botocore-1.43.49.tar.gz).
  type: package
  package: botocore-src

python:
  interpreter: python312
  abi: cp312

patches: []

depends:
  build:
    - name: botocore-src
      version: "==1.43.49"
    - name: python312
    - name: jmespath-cp312
    - name: python-dateutil-cp312
    - name: urllib3-cp312
    # PEP-517 build backend, from this sdist's [build-system] requires.
    # --no-build-isolation means pip will NOT fetch it, so it has to be
    # in the build prefix already (build.sh bridges it onto sys.path).
    - name: setuptools-cp312
    - name: wheel-cp312
  runtime:
    - name: python312
    - name: jmespath-cp312
    - name: python-dateutil-cp312
    - name: urllib3-cp312
  host_tools:
    - python312

build:
  build_type_independent: true
  matrix:
    - platform: any
      script: build.sh
    - platform: windows
      script: build.ps1

package:
  files:
    - { glob: "lib/python3.12/site-packages/botocore/", platforms: [any] }
    - { glob: "lib/python3.12/site-packages/*.dist-info/", platforms: [any] }
    - { glob: "Lib/site-packages/botocore/", platforms: [windows] }
    - { glob: "Lib/site-packages/*.dist-info/", platforms: [windows] }
