schema_version: 1
recipe:
  name: sortedcontainers-cp311
  upstream_version: "2.4.0"
  cvc_revision: 1

  maintainer: "cvcpkg group"
  maintainer_email: "info@cvcpkg.org"
  maintainer_url: "https://cvcpkg.org"
  homepage: https://pypi.org/project/sortedcontainers/
  license: "Apache-2.0"
  tags: [python, source]
  description: >-
    sortedcontainers 2.4.0 for CPython 3.11 — the cp311 column of
    cvcpkg's per-interpreter matrix (pure-Python, built from the PyPI sdist);
    generated by tools/gen_python_recipes.py.
    Built FROM SOURCE: cvcpkg fetches and sha256-verifies the PyPI sdist,
    and build.sh compiles the wheel with the prefix's own CPython 3.11 —
    no third-party prebuilt binary enters the bundle.

# From-source sdist, sha256 as published by PyPI for this exact version.
source:
  # Built from the source package sortedcontainers-src, which pins the upstream tarball
  # (https://files.pythonhosted.org/packages/e8/c4/ba2f8066cceb6f23394729afe52f3bf7adec04bf9ed2c820b39e19299111/sortedcontainers-2.4.0.tar.gz).
  type: package
  package: sortedcontainers-src

python:
  interpreter: python311
  abi: cp311

patches: []

depends:
  build:
    - name: sortedcontainers-src
      version: "==2.4.0"
    - name: python311
    # PEP-517 build backend, from this sdist's [build-system] requires.
    # --no-build-isolation means pip will NOT fetch it, so it has to be
    # in the build prefix already (build.sh bridges it onto sys.path).
    - name: setuptools-cp311
    - name: wheel-cp311
  runtime:
    - name: python311
  host_tools:
    - python311

build:
  build_type_independent: true
  matrix:
    - platform: any
      script: build.sh
    - platform: windows
      script: build.ps1

package:
  files:
    - { glob: "lib/python3.11/site-packages/sortedcontainers/", platforms: [any] }
    - { glob: "lib/python3.11/site-packages/sortedcontainers-*.dist-info/", platforms: [any] }
    - { glob: "Lib/site-packages/sortedcontainers/", platforms: [windows] }
    - { glob: "Lib/site-packages/sortedcontainers-*.dist-info/", platforms: [windows] }
