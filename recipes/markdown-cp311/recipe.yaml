schema_version: 1
recipe:
  name: markdown-cp311
  upstream_version: "3.10.3"
  # cvc.3: republish.  The published noarch cvc.2 bundle's console scripts
  # (markdown_py) carry the build machine's interpreter as their shebang (the old
  # libcvc-deps macOS CI prefix), so they cannot run anywhere; packing today
  # rewrites it to /usr/bin/env.
  cvc_revision: 3

  maintainer: "cvcpkg group"
  maintainer_email: "info@cvcpkg.org"
  maintainer_url: "https://cvcpkg.org"
  homepage: https://pypi.org/project/markdown/
  license: "BSD-3-Clause"
  tags: [python, source]
  description: >-
    markdown 3.10.3 for CPython 3.11 — the cp311 column of
    cvcpkg's per-interpreter matrix (pure-Python, built from the PyPI sdist);
    generated by tools/gen_python_recipes.py.
    Built FROM SOURCE: cvcpkg fetches and sha256-verifies the PyPI sdist,
    and build.sh compiles the wheel with the prefix's own CPython 3.11 —
    no third-party prebuilt binary enters the bundle.

# From-source sdist, sha256 as published by PyPI for this exact version.
source:
  # Built from the source package markdown-src, which pins the upstream tarball
  # (https://files.pythonhosted.org/packages/29/6f/da4c6aea59b3001f2e8c0ec7497475aadaf3b021c10cab5b2858f0f32b26/markdown-3.10.3.tar.gz).
  type: package
  package: markdown-src

python:
  interpreter: python311
  abi: cp311

patches: []

depends:
  build:
    - name: markdown-src
      version: "==3.10.3"
    - name: python311
    # PEP-517 build backend, from this sdist's [build-system] requires.
    # --no-build-isolation means pip will NOT fetch it, so it has to be
    # in the build prefix already (build.sh bridges it onto sys.path).
    - name: setuptools-cp311
  runtime:
    - name: python311
  host_tools:
    - python311

build:
  build_type_independent: true
  matrix:
    - platform: any
      script: build.sh
    - platform: windows
      script: build.ps1

package:
  files:
    - { glob: "lib/python3.11/site-packages/markdown/", platforms: [any] }
    - { glob: "lib/python3.11/site-packages/markdown-*.dist-info/", platforms: [any] }
    - { glob: "Lib/site-packages/markdown/", platforms: [windows] }
    - { glob: "Lib/site-packages/*.dist-info/", platforms: [windows] }
