schema_version: 1
recipe:
  name: libffi
  upstream_version: "3.7.1"
  # Bumped upstream 3.4.6 -> 3.7.1 (new version, so cvc_revision resets to 1):
  # 3.4.6's hand-written aarch64 src/sysv.S emits non-local labels between
  # .cfi_startproc/.cfi_endproc, which the clang-17+ integrated assembler rejects
  # on Mach-O ("invalid CFI advance_loc expression") — breaking every macOS build
  # on the Xcode 26.5 / clang 21 runners (and cascading to python ->
  # numpy/pydantic/qt6/vtk...). Upstream fixed this (per-format local-label
  # prefix); see libffi#852. 3.7.1 keeps libtool version-info 12:1:4 -> soname
  # libffi.so.8, identical to 3.4.x, so the ABI is unchanged.
  #
  # rev 2: added wasm and cosmo entries.  3.7.1's configure.host maps
  # wasm32-*-* to the pure-C src/wasm backend upstreamed in 3.4.5, and
  # cosmocc emits plain x86-64 SysV so the existing x86 backend applies.
  # There is deliberately NO wasi entry — see the note at the bottom.
  #
  # rev 3 -> 4: fix the OpenBSD build (verified on openbsd-build, OpenBSD 7.7).
  # It failed with "config.status: error: Something went wrong bootstrapping
  # makefile fragments ... consider re-running configure with MAKE=gmake":
  # configure's automatic-dependency-tracking bootstrap runs $MAKE, and
  # OpenBSD's BSD /usr/bin/make cannot drive automake's generated fragments.
  # build.sh now uses gmake there. It also dropped CXX=eg++ — the gcc package
  # ships egcc but not eg++, and libffi is pure C, so that only made the
  # optional C++ probe print "eg++: not found". No payload change (pure C lib).
  #
  # rev 4 -> 5: (1) OpenBSD: give libffi.so.12.1 a DT_SONAME (its own file name).
  # libffi's libtool emits none on OpenBSD, and meson links a pkg-config
  # dependency by the library's full path, so a meson consumer recorded the
  # build job's absolute path as DT_NEEDED: wayland 1.23.1+cvc.3 openbsd has
  # NEEDED ".../cvcpkg-job-wayland-.../lib/libffi.so.12.1", a deleted directory,
  # and cannot load. With a SONAME the linker records "libffi.so.12.1" however
  # the library was named on its command line. Set post-install with patchelf
  # (an OpenBSD-only build dep), the same route curl takes there. (2) Every
  # build.sh platform: drop the `-Wl,-rpath,$ORIGIN` LDFLAGS. make ate its `$O`,
  # so the BSD bundles carry the CWD-relative RPATH "RIGIN" instead (freebsd
  # "RIGIN", openbsd "RIGIN:RIGIN", netbsd "/usr/pkg/lib:RIGIN"), and libffi
  # links only libc, so it needs no RPATH of its own.
  cvc_revision: 5
  maintainer: "cvcpkg group"
  maintainer_email: "info@cvcpkg.org"
  maintainer_url: "https://cvcpkg.org"
  homepage: https://sourceware.org/libffi/
  license: MIT
  tags: [libraries]
  description: >-
    libffi — a portable foreign function interface library.  Lets code
    call functions whose signatures are only known at runtime.  Required
    by GLib (and therefore GStreamer).

source:
  type: tarball
  url: https://github.com/libffi/libffi/releases/download/v3.7.1/libffi-3.7.1.tar.gz
  sha256: "d5e9a6638ddbd2513ddb54518eb67e4bbe6fa707bcc01c10f6212f0a088d819d"
  strip_components: 1

patches: []

depends:
  build:
    # OpenBSD only: post-install SONAME (see build.sh and the rev 5 note).
    - name: patchelf
      platforms: [openbsd]
  runtime: []
  host_tools: []

build:
  matrix:
    - platform: linux
      script: build.sh
      env:
        CFLAGS: "-O2 -fPIC"
    - platform: macos
      script: build.sh
      env:
        MACOSX_DEPLOYMENT_TARGET: "13.0"
    - platform: freebsd
      script: build.sh
      env:
        CFLAGS: "-O2 -fPIC"
    - platform: openbsd
      script: build.sh
      env:
        CFLAGS: "-O2 -fPIC"
    - platform: netbsd
      script: build.sh
      env:
        CFLAGS: "-O2 -fPIC"
    - platform: windows
      script: build.ps1
    - platform: wasm
      host_platform: linux
      script: build-wasm.sh
    # Threaded flavor for the wasm-mt closure (CPython _ctypes etc.). Same
    # script; env-wasm.sh prepends -pthread on the CVC_WASM_THREADS hook.
    - platform: wasm-mt
      host_platform: linux
      script: build-wasm.sh
      env:
        CVC_WASM_THREADS: "1"
    - platform: cosmo
      host_platform: linux
      script: build-cosmo.sh

package:
  files:
    - lib/libffi*
    - lib/pkgconfig/libffi*
    - include/ffi*.h
  pkg_config:
    - libffi

abi:
  cxx_std: 17

notes:
  - title: "No wasi build (and there cannot be one)"
    platforms: [wasi]
    description: >-
      libffi's wasm backend is Emscripten-only, not "wasm" generically.
      A generic FFI has to synthesise a call frame for a signature only
      known at run time; WebAssembly has no such primitive — calls go
      through statically typed table entries.  src/wasm/ffi.c therefore
      implements ffi_call and ffi_closure_alloc with EM_JS, generating
      JavaScript trampolines and patching the wasm table at run time.
      wasm32-wasip1 has no JS engine, so the backend cannot be built or
      used there, and upstream's supported-platform table lists only
      "WASM32 | Emscripten | EMCC".  This matches CPython, whose WASI
      build ships without the _ctypes extension for the same reason.
      Any consumer declaring platform: wasi must mark its libffi
      dependency `platforms:` accordingly rather than expecting a build
      here.
