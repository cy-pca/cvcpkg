schema_version: 1
recipe:
  name: scikit-build-core-cp313t
  upstream_version: "1.1.1"
  cvc_revision: 1

  maintainer: "cvcpkg group"
  maintainer_email: "info@cvcpkg.org"
  maintainer_url: "https://cvcpkg.org"
  homepage: https://pypi.org/project/scikit-build-core/
  license: "Apache-2.0"
  tags: [python, source]
  description: >-
    scikit-build-core 1.1.1 for CPython 3.13t — the cp313t column of
    cvcpkg's per-interpreter matrix (pure-Python, built from the PyPI sdist);
    generated by tools/gen_python_recipes.py.
    Built FROM SOURCE: cvcpkg fetches and sha256-verifies the PyPI sdist,
    and build.sh compiles the wheel with the prefix's own CPython 3.13t —
    no third-party prebuilt binary enters the bundle.
    The cp313t column installs under the free-threaded (no-GIL)
    interpreter and its import check runs with the GIL disabled.

# From-source sdist, sha256 as published by PyPI for this exact version.
source:
  # Built from the source package scikit-build-core-src, which pins the upstream tarball
  # (https://files.pythonhosted.org/packages/b2/1a/8c00b19c0a1e7acf890676af2efa430339d38e59fa9437f2aab8517af3f4/scikit_build_core-1.1.1.tar.gz).
  type: package
  package: scikit-build-core-src

python:
  interpreter: python313t
  abi: cp313t

patches: []

depends:
  build:
    - name: scikit-build-core-src
      version: "==1.1.1"
    - name: python313t
    - name: packaging-cp313t
    - name: pathspec-cp313t
    # PEP-517 build backend, from this sdist's [build-system] requires.
    # --no-build-isolation means pip will NOT fetch it, so it has to be
    # in the build prefix already (build.sh bridges it onto sys.path).
    - name: hatchling-cp313t
    - name: hatch-vcs-cp313t
    - name: setuptools-scm-cp313t
    - name: setuptools-cp313t
    - name: pluggy-cp313t
    - name: trove-classifiers-cp313t
    - name: calver-cp313t
  runtime:
    - name: python313t
    - name: packaging-cp313t
    - name: pathspec-cp313t
  host_tools:
    - python313t

provides:
  - scikit-build-core

build:
  build_type_independent: true
  matrix:
    - platform: any
      script: build.sh
    - platform: windows
      script: build.ps1

package:
  files:
    - { glob: "lib/python3.13t/site-packages/scikit_build_core/", platforms: [any] }
    - { glob: "lib/python3.13t/site-packages/scikit_build_core-*.dist-info/", platforms: [any] }
    - { glob: "bin/scikit-build", platforms: [any] }
    - { glob: "bin/scikit-build-core", platforms: [any] }
    - { glob: "Lib/site-packages/scikit_build_core/", platforms: [windows] }
    - { glob: "Lib/site-packages/*.dist-info/", platforms: [windows] }
