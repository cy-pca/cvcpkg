schema_version: 1
recipe:
  name: libxshmfence
  upstream_version: "1.3.3"
  # Bumped 1 -> 2: the libraries' RPATH was "RIGIN" -- make read the $ORIGIN that build.sh
  # put in LDFLAGS as $O + "RIGIN". build.sh now spells it for make
  # (cvc_make_origin_rpath), so the RPATH is $ORIGIN.
  cvc_revision: 2
  maintainer: "cvcpkg group"
  maintainer_email: "info@cvcpkg.org"
  maintainer_url: "https://cvcpkg.org"
  homepage: https://www.x.org/
  license: MIT
  tags: [libraries, x11, graphics]
  description: >-
    X shared-memory fences (xshmfence) — the futex-backed sync primitive used by DRI3/Present.

source:
  # Built from the source package libxshmfence-src, which pins the upstream tarball
  # (https://xorg.freedesktop.org/releases/individual/lib/libxshmfence-1.3.3.tar.xz).
  type: package
  package: libxshmfence-src

patches: []

depends:
  build:
    - name: libxshmfence-src
      version: "==1.3.3"
    - pkg-config
    - name: xorgproto
  runtime: []
  host_tools: []

package:
  files:
    - lib/
    - include/

build:
  matrix:
    # A dependency of the hermetic `mesa` recipe (software GL), on Linux, FreeBSD
    # and NetBSD (OpenBSD's base X11 has its own Mesa).
    - platform: linux
      script: build.sh
    - platform: freebsd
      script: build.sh
    - platform: netbsd
      script: build.sh
