schema_version: 1
recipe:
  name: libxshmfence
  upstream_version: "1.3.3"
  cvc_revision: 1
  maintainer: "cvcpkg group"
  maintainer_email: "info@cvcpkg.org"
  maintainer_url: "https://cvcpkg.org"
  homepage: https://www.x.org/
  license: MIT
  tags: [libraries, x11, graphics]
  description: >-
    X shared-memory fences (xshmfence) — the futex-backed sync primitive used by DRI3/Present.

source:
  type: tarball
  url: https://xorg.freedesktop.org/releases/individual/lib/libxshmfence-1.3.3.tar.xz
  sha256: "d4a4df096aba96fea02c029ee3a44e11a47eb7f7213c1a729be83e85ec3fde10"
  strip_components: 1

patches: []

depends:
  build:
    - pkg-config
    - name: xorgproto
  runtime: []
  host_tools: []

package:
  files:
    - lib/
    - include/
    - share/

build:
  matrix:
    # Linux only: added as a build dependency of the hermetic `mesa` recipe
    # (software-GL stack); not exercised on the BSDs.
    - platform: linux
      script: build.sh
