schema_version: 1
recipe:
  name: iconv
  upstream_version: "1.17"
  # cvc.4: rebuild with no Homebrew.  The published macOS x86_64 cvc.3 bundle was built
  # before macOS CI moved Homebrew aside (#182): bin/iconv loads
  # /usr/local/opt/gettext/lib/libintl.8.dylib, so it aborts on any Mac without
  # Homebrew.  build.sh now configures --disable-nls on macOS.  Every platform rebuilds.
  # cvc.5: Unix bundles ship no libtool .la (see build.sh).
  # cvc.6: Windows compiles as gnu17 (gcc 15's C23 default broke loop_wchar.h)
  # and, like Unix, ships no libtool .la files.
  # cvc.7: Windows declares its MinGW toolchain (msys2/make/mingw-w64-gcc, autotools)
  # instead of using the builder's; see depends.build.
  cvc_revision: 7
  maintainer: "cvcpkg group"
  maintainer_email: "info@cvcpkg.org"
  maintainer_url: "https://cvcpkg.org"
  description: "GNU libiconv — character-set conversion library for platforms without a system iconv."
  homepage: https://www.gnu.org/software/libiconv/
  license: LGPL-2.1-or-later
  tags: [libraries, i18n]

source:
  # Built from the source package iconv-src, which pins the upstream tarball
  # (https://ftp.gnu.org/gnu/libiconv/libiconv-1.17.tar.gz).
  type: package
  package: iconv-src

patches: []

depends:
  build:
    - name: iconv-src
      version: "==1.17"
    # Windows: the MinGW toolchain is a declared build dep, staged into the BUILD
    # prefix (build.ps1 puts its bin first on PATH), not whatever MSYS2 the
    # builder has.  The prod builder cmps-a91453 has an incomplete one: lame
    # and libmp3lame died there with "configure: error: no acceptable ld found
    # in $PATH" while they built on sandipaws.  As recipes/gmp.
    - name: msys2
      platforms: [windows]
    - name: make
      platforms: [windows]
    - name: m4
      platforms: [windows]
    - name: autoconf
      platforms: [windows]
    - name: automake
      platforms: [windows]
    - name: libtool
      platforms: [windows]
    - name: mingw-w64-gcc
      platforms: [windows]
  runtime: []
  host_tools: []

build:
  matrix:
    - platform: linux
      script: build.sh
      env:
        CFLAGS: "-O2 -fPIC"
    - platform: macos
      script: build.sh
      env:
        MACOSX_DEPLOYMENT_TARGET: "13.0"
    - platform: freebsd
      script: build.sh
      env:
        CFLAGS: "-O2 -fPIC"
    - platform: openbsd
      script: build.sh
      env:
        CFLAGS: "-O2 -fPIC"
    - platform: netbsd
      script: build.sh
      env:
        CFLAGS: "-O2 -fPIC"
    - platform: haiku
      script: build.sh
      env:
        CFLAGS: "-O2 -fPIC"
    - platform: windows
      script: build.ps1
    - platform: wasm
      host_platform: linux
      script: build-wasm.sh
    - platform: wasi
      host_platform: linux
      script: build-wasi.sh
    - platform: cosmo
      host_platform: linux
      script: build-cosmo.sh

package:
  files:
    - lib/libiconv*
    - lib/libcharset*
    - include/iconv.h
    - include/libcharset.h
    - include/localcharset.h
    - bin/iconv*
  cmake_packages: []

abi:
  cxx_std: 17
