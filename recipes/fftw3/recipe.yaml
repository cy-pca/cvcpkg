schema_version: 1
recipe:
  name: fftw3
  upstream_version: "3.3.10"
  cvc_revision: 6
  # cvc.6: Windows also ships lib/libfftw3.dll.a (the import library under its
  # GNU name) so MinGW/libtool consumers such as nfft3 link the DLL.
  maintainer: "cvcpkg group"
  maintainer_email: "info@cvcpkg.org"
  maintainer_url: "https://cvcpkg.org"
  description: "FFTW — a library for computing discrete Fourier transforms with high performance."
  homepage: https://fftw.org/
  license: GPL-2.0-or-later
  tags: [math, wasm, wasi]

source:
  # Built from the source package fftw3-src, which pins the upstream tarball
  # (https://fftw.org/fftw-3.3.10.tar.gz).
  type: package
  package: fftw3-src

patches: []

depends:
  build:
    - name: fftw3-src
      version: "==3.3.10"
    - cmake
    - ninja
  runtime: []
  host_tools: []

build:
  matrix:
    - platform: linux
      script: build.sh
      env:
        CFLAGS: "-O2 -fPIC"
    - platform: macos
      script: build.sh
      env:
        MACOSX_DEPLOYMENT_TARGET: "13.0"
    - platform: freebsd
      script: build.sh
      env:
        CFLAGS: "-O2 -fPIC"
    - platform: openbsd
      script: build.sh
      env:
        CFLAGS: "-O2 -fPIC"
    - platform: netbsd
      script: build.sh
      env:
        CFLAGS: "-O2 -fPIC"
    - platform: haiku
      script: build.sh
      env:
        CFLAGS: "-O2 -fPIC"
    - platform: windows
      script: build.ps1
    - platform: wasm
      host_platform: linux
      script: build-wasm.sh
    - platform: wasm
      host_platform: windows
      script: build-wasm.ps1
    - platform: wasi
      host_platform: linux
      script: build-wasi.sh
    - platform: wasi
      host_platform: windows
      script: build-wasi.ps1
    - platform: cosmo
      host_platform: linux
      script: build-cosmo.sh

package:
  files:
    - lib/libfftw3*
    - lib/fftw3*
    - lib/cmake/fftw3*/
    - lib/pkgconfig/fftw3*
    - include/fftw3.h
    - include/fftw3.f
    # fftw3.h declares every precision; fftw3l/fftw3q exist only as Fortran
    # .f03 interfaces, not C headers.
  cmake_packages:
    - { name: FFTW3, targets: ["FFTW3::fftw3"] }

abi:
  cxx_std: 17
