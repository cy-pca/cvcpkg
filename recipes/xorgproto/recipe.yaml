schema_version: 1
recipe:
  name: xorgproto
  upstream_version: "2025.1"
  cvc_revision: 1
  maintainer: "cvcpkg group"
  maintainer_email: "info@cvcpkg.org"
  maintainer_url: "https://cvcpkg.org"
  homepage: https://www.x.org/
  license: MIT
  tags: [libraries, x11, graphics]
  description: >-
    X.Org protocol headers (Xproto, GLproto, XExtproto, …) — build-time headers for the whole X11/GLX stack.

source:
  # Built from the source package xorgproto-src, which pins the upstream tarball
  # (https://xorg.freedesktop.org/releases/individual/proto/xorgproto-2025.1.tar.xz).
  type: package
  package: xorgproto-src

patches: []

depends:
  build:
    - name: xorgproto-src
      version: "==2025.1"
    - meson
    - ninja
    - pkg-config
  runtime: []
  host_tools: []

package:
  files:
    - lib/
    - include/
    - share/

build:
  matrix:
    - platform: linux
      script: build.sh
    - platform: freebsd
      script: build.sh
    - platform: openbsd
      script: build.sh
    - platform: netbsd
      script: build.sh
