schema_version: 1
recipe:
  name: openssl
  upstream_version: "3.4.1"
  # Bumped 3 -> 4: added the cosmo build. cosmocc is an ordinary x86_64 C
  # toolchain with a POSIX libc, so unlike the wasm/wasi targets this needs
  # neither no-sock nor -DNO_FORK; only the APE-inherent limits (static single
  # file, so no shared/dso/engine) are compiled out. python31x already declared
  # cosmo and runtime-depends on openssl, so this was also an unresolvable claim.
  #
  # Bumped 6 -> 7: linux run paths. OpenSSL's Configure links nothing with an
  # RPATH, so +cvc.6's bin/openssl (NEEDED libssl.so.3, libcrypto.so.3) had
  # none and loaded whatever libssl the host's loader found first -- the
  # distro's, on any machine that has one -- instead of the bundle's. Its
  # engines-3/ and ossl-modules/ plugins (NEEDED libcrypto.so.3) only got the
  # packager's bare $ORIGIN, their own directory. build.sh now gives bin/openssl
  # $ORIGIN/../lib and the plugins $ORIGIN/.. (patchelf, a linux build dep) and
  # fails the build unless the installed openssl resolves both libraries from
  # the install tree.
  #
  # Bumped 7 -> 8: the same for FreeBSD and NetBSD (linux output is unchanged
  # from +cvc.7). FreeBSD's +cvc.6 had no run path on any object, NetBSD's had
  # only /usr/pkg/lib (from env-netbsd.sh), so both loaded a host or pkgsrc
  # libssl.so.3 if there was one. FreeBSD takes the linux patchelf route;
  # NetBSD, whose loader rejects objects patchelf has grown, gets
  # $ORIGIN:$ORIGIN/../lib:$ORIGIN/.. at link time through LD_RUN_PATH. The
  # ldd check in build.sh runs on all three.
  #
  # Bumped 8 -> 9: Windows configures with no-uplink, as CPython builds its
  # own OpenSSL.  With uplink, libcrypto routes every FILE* call through an
  # OPENSSL_Applink the executable must export and exits the process when it
  # does not: CPython's ssl.SSLContext.load_dh_params (test_ssl) died with
  # "OPENSSL_Uplink(...): no OPENSSL_Applink" against cvcpkg's libcrypto.
  # Every Windows consumer links the UCRT, the case uplink is not needed for.
  # Other platforms rebuild unchanged.
  #
  # Bumped 9 -> 10: Windows installs LICENSE.txt in share/licenses/openssl/.
  # CPython's Windows bundle ships libcrypto/libssl in DLLs\ and builds its
  # LICENSE.txt from this file, as python.org's does; without it the OpenSSL
  # text was missing there.  Other platforms rebuild unchanged.
  #
  # Bumped 10 -> 11: Windows libcrypto no longer compiles in the builder's job
  # dir.  OPENSSLDIR (openssl.cnf), ENGINESDIR and MODULESDIR were the install
  # dir of the job that built it, a path any local user can create under a job
  # dir like C:\cvb\...; they are now OpenSSL's admin-only Windows defaults
  # (C:\Program Files\Common Files\SSL, C:\Program Files\OpenSSL\lib\...), as in
  # python.org's libcrypto, installed through DESTDIR.  bin/c_rehash.pl finds
  # openssl.exe beside itself instead of in the job dir, looks for it under
  # that name, and copies rather than symlinks; before, it never found
  # openssl.exe and its symlinks failed silently without the privilege.
  # build.ps1 fails if any packaged file but a PDB names the build tree.  Other
  # platforms rebuild unchanged.
  cvc_revision: 11
  maintainer: "cvcpkg group"
  maintainer_email: "info@cvcpkg.org"
  maintainer_url: "https://cvcpkg.org"
  description: "OpenSSL — a robust, full-featured toolkit for TLS/SSL and general-purpose cryptography."
  homepage: https://www.openssl.org/
  license: Apache-2.0
  tags: [networking, crypto, wasm]

source:
  type: tarball
  url: https://github.com/openssl/openssl/releases/download/openssl-3.4.1/openssl-3.4.1.tar.gz
  sha256: "002a2d6b30b58bf4bea46c43bdd96365aaf8daa6c428782aa4feee06da197df3"
  strip_components: 1

patches: []

depends:
  build:
    - nasm
    # OpenBSD's cvcpkg perl build is broken (missing core modules like strict.pm),
    # so ./Configure aborts.  Use the base-system perl on OpenBSD instead — it has
    # everything openssl's Configure + build scripts need.
    - name: perl
      platforms: [linux, macos, freebsd, netbsd, windows]
    # Post-install run paths for bin/openssl and the plugin modules (build.sh).
    # Not netbsd: there the run path is set at link time.
    - name: patchelf
      platforms: [linux, freebsd]
  runtime: []
  host_tools: []

build:
  matrix:
    - platform: linux
      script: build.sh
      env:
        CFLAGS: "-O2 -fPIC"
    - platform: macos
      script: build.sh
      env:
        MACOSX_DEPLOYMENT_TARGET: "13.0"
    - platform: freebsd
      script: build.sh
      env:
        CFLAGS: "-O2 -fPIC"
    - platform: openbsd
      script: build.sh
      env:
        CFLAGS: "-O2 -fPIC"
    - platform: netbsd
      script: build.sh
      env:
        CFLAGS: "-O2 -fPIC"
    - platform: haiku
      script: build.sh
      env:
        CFLAGS: "-O2 -fPIC"
    - platform: windows
      script: build.ps1
    - platform: wasm
      host_platform: linux
      script: build-wasm.sh
    - platform: wasm
      host_platform: windows
      script: build-wasm.ps1
    # Thread-safe OpenSSL for the wasm-mt closure: build-wasm.sh drops no-threads
    # and adds -pthread on the CVC_WASM_THREADS hook, so OPENSSL_THREADS is defined
    # and CPython's _ssl/_hashlib can link against it (impossible on plain wasm).
    - platform: wasm-mt
      host_platform: linux
      script: build-wasm.sh
      env:
        CVC_WASM_THREADS: "1"
    - platform: wasi
      host_platform: linux
      script: build-wasi.sh
    - platform: wasi
      host_platform: windows
      script: build-wasi.ps1
    - platform: cosmo
      host_platform: linux
      script: build-cosmo.sh

package:
  files:
    - lib/libssl*
    - lib/libcrypto*
    # build.sh builds OpenBSD with no-dynamic-engine no-legacy (its linker
    # rejects the modules), so neither directory exists there; declaring them
    # for openbsd failed every pack under strict globs.
    # A static macOS or Windows openssl produces no engines-3/ either
    # (ossl-modules still exists on both), so macos and windows are dropped from
    # the engine assertion too. package.files only DECLARES what ships -- the
    # whole install tree is staged regardless -- so a shared build that does emit
    # them still ships them; this just stops asserting them where a static build
    # omits them. (Linux static openssl does still build the engine modules.)
    - { glob: "lib/engines-3/", platforms: [linux, freebsd, netbsd, haiku, wasm, wasm-mt, wasi, cosmo] }
    - { glob: "lib/ossl-modules/", platforms: [linux, macos, freebsd, netbsd, haiku, windows, wasm, wasm-mt, wasi, cosmo] }
    - lib/cmake/OpenSSL/
    # Windows openssl does not install pkg-config .pc files (static least of
    # all); the schema has no link scope, so assert them on every target
    # except windows.
    - { glob: "lib/pkgconfig/openssl*",   platforms: [linux, macos, freebsd, openbsd, netbsd, haiku, wasm, wasm-mt, wasi, cosmo] }
    - { glob: "lib/pkgconfig/libssl*",    platforms: [linux, macos, freebsd, openbsd, netbsd, haiku, wasm, wasm-mt, wasi, cosmo] }
    - { glob: "lib/pkgconfig/libcrypto*", platforms: [linux, macos, freebsd, openbsd, netbsd, haiku, wasm, wasm-mt, wasi, cosmo] }
    - include/openssl/
    - bin/openssl*
    # Only build.ps1 installs the license so far (see cvc_revision 10).
    - { glob: "share/licenses/openssl/", platforms: [windows] }
  cmake_packages:
    - { name: OpenSSL, targets: ["OpenSSL::SSL", "OpenSSL::Crypto"] }

abi:
  cxx_std: 17
