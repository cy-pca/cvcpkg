  upstream_version: "0.60.8"
  cvc_revision: 1
  maintainer: cvcpkg group
  maintainer_email: info@cvcpkg.org
  maintainer_url: https://cvcpkg.org
  homepage: http://aspell.net/
  license: LGPL-2.1-or-later
  tags: [source]
  description: >-
    The unmodified upstream source of aspell 0.60.8: its release tarball,
    verified against the sha256 below and staged at src/aspell-src/.  The aspell
    recipe builds from it (source.type package), so the tarball is fetched
