schema_version: 1
recipe:
  name: libsodium-src
  upstream_version: "1.0.22"
  cvc_revision: 1
  maintainer: cvcpkg group
  maintainer_email: info@cvcpkg.org
  maintainer_url: https://cvcpkg.org
  homepage: https://libsodium.org/
  license: ISC
  tags: [source]
  description: >-
    The unmodified upstream source of libsodium 1.0.22: its release tarball,
    verified against the sha256 below and staged at src/libsodium-src/.  The
    libsodium recipe builds from it (source.type package), so the tarball is
    fetched once, from download.libsodium.org, and every other build of
    libsodium -- another platform, a builder that cannot reach
    download.libsodium.org, a user building from source -- installs this package
    from the catalog instead.  Generated by tools/make_source_package.py.

source:
  type: tarball
  url: https://download.libsodium.org/libsodium/releases/libsodium-1.0.22.tar.gz
  mirror: https://github.com/jedisct1/libsodium/releases/download/1.0.22-RELEASE/libsodium-1.0.22.tar.gz
  sha256: "adbdd8f16149e81ac6078a03aca6fc03b592b89ef7b5ed83841c086191be3349"
  strip_components: 1

patches: []

depends:
  build: []
  runtime: []
  host_tools: []

build:
  build_type_independent: true
  matrix:
    - platform: any
      script: build.sh

package:
  files:
    - src/libsodium-src/
