schema_version: 1
recipe:
  name: sqlite
  upstream_version: "3.49.1"
  # Added wasm/wasi/cosmo entries.  python311/312/313/313t all declare these
  # three platforms and runtime-depend on sqlite, so every cross column of the
  # CPython matrix was a phantom claim.  The cross scripts compile the
  # amalgamation directly rather than running SQLite 3.49's autosetup
  # configure, which bootstraps and then *executes* a jimsh built with $CC.
  # cvc.4: relocatable .pc/.cmake/bin/*-config.  The published cvc.3
  # kept build-machine paths (/tmp/cvcpkg-builder/...) in them, so pkg-config,
  # find_package or the -config script handed consumers dead -I/-L paths
  # (2026-10-13 scan of every published linux bundle).
  # cvc.5: package.files fixed for the strict pack check.  Windows names the
  # import library lib/sqlite3.lib, which lib/libsqlite3* never matched, so
  # every Windows build failed to pack; the cross targets have no CLI, so
  # bin/sqlite3* is now scoped to the platforms that build one.
  # Windows sqlite3.pc also had the build dir as its prefix and said
  # "Version: 3"; it now uses ${pcfiledir} and the real version.
  # cvc.6: the Windows sqlite3.dll exports the API.  Makefile.msc only marks
  # SQLITE_API dllexport for its DYNAMIC_SHELL/FOR_WIN10 builds, so the DLL had
  # an empty export table and sqlite3.lib linked nothing (CPython's _sqlite3 is
  # the first consumer to try).  It is also built against the DLL C runtime
  # (/MD) instead of Makefile.msc's default /MT.  Other platforms rebuild
  # unchanged.
  cvc_revision: 6
  maintainer: "cvcpkg group"
  maintainer_email: "info@cvcpkg.org"
  maintainer_url: "https://cvcpkg.org"
  homepage: https://www.sqlite.org/
  license: blessing
  tags: [database, libraries]
  description: >-
    SQLite — a self-contained, serverless, zero-configuration SQL database
    engine.  Ships libsqlite3 and the sqlite3 CLI tool.  Required by
    CPython's sqlite3 standard-library module.

source:
  # Built from the source package sqlite-src, which pins the upstream tarball
  # (https://www.sqlite.org/2025/sqlite-autoconf-3490100.tar.gz).
  type: package
  package: sqlite-src

patches: []

depends:
  build:
    - name: sqlite-src
      version: "==3.49.1"
  runtime: []
  host_tools: []

build:
  matrix:
    - platform: linux
      script: build.sh
      env:
        CFLAGS: "-O2 -fPIC"
    - platform: macos
      script: build.sh
      env:
        MACOSX_DEPLOYMENT_TARGET: "13.0"
    - platform: freebsd
      script: build.sh
      env:
        CFLAGS: "-O2 -fPIC"
    - platform: openbsd
      script: build.sh
      env:
        CFLAGS: "-O2 -fPIC"
    - platform: netbsd
      script: build.sh
      env:
        CFLAGS: "-O2 -fPIC"
    - platform: haiku
      script: build.sh
      env:
        CFLAGS: "-O2 -fPIC"
    - platform: windows
      script: build.ps1
    - platform: wasm
      host_platform: linux
      script: build-wasm.sh
    # Threaded flavor for the wasm-mt closure (CPython _sqlite3). Same script;
    # env-wasm.sh prepends -pthread on the CVC_WASM_THREADS hook.
    - platform: wasm-mt
      host_platform: linux
      script: build-wasm.sh
      env:
        CVC_WASM_THREADS: "1"
    - platform: wasi
      host_platform: linux
      script: build-wasi.sh
    - platform: cosmo
      host_platform: linux
      script: build-cosmo.sh

package:
  files:
    # lib/libsqlite3* (Unix) and lib/sqlite3* (MSVC: sqlite3.lib) are one
    # alternate pair; the pack check needs only one of them to match.
    - lib/libsqlite3*
    - lib/sqlite3*
    - lib/pkgconfig/sqlite3.pc
    - include/sqlite3.h
    - include/sqlite3ext.h
    # The cross targets build the library only, since the CLI is not runnable
    # on the build host.
    - { glob: "bin/sqlite3*", platforms: [linux, macos, freebsd, openbsd, netbsd, haiku, windows] }
  cmake_packages: []

abi:
  cxx_std: 17
