schema_version: 1
recipe:
  name: aiohappyeyeballs-cp312
  upstream_version: "2.7.1"
  cvc_revision: 1

  maintainer: "cvcpkg group"
  maintainer_email: "info@cvcpkg.org"
  maintainer_url: "https://cvcpkg.org"
  homepage: https://pypi.org/project/aiohappyeyeballs/
  license: "PSF-2.0"
  tags: [python, source]
  description: >-
    aiohappyeyeballs 2.7.1 for CPython 3.12 — the cp312 column of
    cvcpkg's per-interpreter matrix (pure-Python, built from the PyPI sdist);
    generated by tools/gen_python_recipes.py.
    Built FROM SOURCE: cvcpkg fetches and sha256-verifies the PyPI sdist,
    and build.sh compiles the wheel with the prefix's own CPython 3.12 —
    no third-party prebuilt binary enters the bundle.

# From-source sdist, sha256 as published by PyPI for this exact version.
source:
  type: tarball
  url: https://files.pythonhosted.org/packages/ce/f4/eec0465c2f67b2664688d0240b3212d5196fd89e741df67ddb81f8d35658/aiohappyeyeballs-2.7.1.tar.gz
  sha256: "065665c041c42a5938ed220bdcd7230f22527fbec085e1853d2402c8a3615d9d"
  strip_components: 1

python:
  interpreter: python312
  abi: cp312

patches: []

depends:
  build:
    - name: python312
    # PEP-517 build backend, from this sdist's [build-system] requires.
    # --no-build-isolation means pip will NOT fetch it, so it has to be
    # in the build prefix already (build.sh bridges it onto sys.path).
    - name: poetry-core-cp312
  runtime:
    - name: python312
  host_tools:
    - python312

build:
  build_type_independent: true
  matrix:
    - platform: any
      script: build.sh
    - platform: windows
      script: build.ps1

package:
  files:
    - { glob: "lib/python3.12/site-packages/aiohappyeyeballs/", platforms: [any] }
    - { glob: "lib/python3.12/site-packages/*.dist-info/", platforms: [any] }
    - { glob: "Lib/site-packages/aiohappyeyeballs/", platforms: [windows] }
    - { glob: "Lib/site-packages/*.dist-info/", platforms: [windows] }
