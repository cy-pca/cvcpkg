schema_version: 1
recipe:
  name: pytest-cov-cp313
  upstream_version: "7.1.0"
  cvc_revision: 1

  maintainer: "cvcpkg group"
  maintainer_email: "info@cvcpkg.org"
  maintainer_url: "https://cvcpkg.org"
  homepage: https://pypi.org/project/pytest-cov/
  license: "MIT"
  tags: [python, source]
  description: >-
    pytest-cov 7.1.0 for CPython 3.13 — the cp313 column of
    cvcpkg's per-interpreter matrix (pure-Python, built from the PyPI sdist);
    generated by tools/gen_python_recipes.py.
    Built FROM SOURCE: cvcpkg fetches and sha256-verifies the PyPI sdist,
    and build.sh compiles the wheel with the prefix's own CPython 3.13 —
    no third-party prebuilt binary enters the bundle.

# From-source sdist, sha256 as published by PyPI for this exact version.
source:
  # Built from the source package pytest-cov-src, which pins the upstream tarball
  # (https://files.pythonhosted.org/packages/b1/51/a849f96e117386044471c8ec2bd6cfebacda285da9525c9106aeb28da671/pytest_cov-7.1.0.tar.gz).
  type: package
  package: pytest-cov-src

python:
  interpreter: python313
  abi: cp313

patches: []

depends:
  build:
    - name: pytest-cov-src
      version: "==7.1.0"
    - name: python313
    - name: coverage-cp313
    - name: pluggy-cp313
    - name: pytest-cp313
    # PEP-517 build backend, from this sdist's [build-system] requires.
    # --no-build-isolation means pip will NOT fetch it, so it has to be
    # in the build prefix already (build.sh bridges it onto sys.path).
    - name: hatchling-cp313
    - name: hatch-fancy-pypi-readme-cp313
    - name: packaging-cp313
    - name: pathspec-cp313
    - name: trove-classifiers-cp313
    - name: calver-cp313
  runtime:
    - name: python313
    - name: coverage-cp313
    - name: pluggy-cp313
    - name: pytest-cp313
  host_tools:
    - python313

build:
  build_type_independent: true
  matrix:
    - platform: any
      script: build.sh
    - platform: windows
      script: build.ps1

package:
  files:
    - { glob: "lib/python3.13/site-packages/pytest_cov/", platforms: [any] }
    - { glob: "lib/python3.13/site-packages/pytest_cov-*.dist-info/", platforms: [any] }
    - { glob: "Lib/site-packages/pytest_cov/", platforms: [windows] }
    - { glob: "Lib/site-packages/pytest_cov-*.dist-info/", platforms: [windows] }
