schema_version: 1
recipe:
  name: pymupdf-cp313
  upstream_version: "1.28.2"
  # New recipe.  PyMuPDF (import name `pymupdf`, legacy alias `fitz`) is the
  # Python binding for the MuPDF C library; the consuming use case is rasterising
  # PDF pages (page.get_pixmap()) to confirm rendered output — the reason this was
  # being pip-installed off-catalog before.
  #
  # APPROACH — bundled MuPDF (evaluated (a) a prefix `mupdf` C-library recipe vs
  # (b) PyMuPDF's own pinned MuPDF; chose (b)):
  #   Modern PyMuPDF (1.24+, and 1.28.2 here) ships ONLY the "rebased"
  #   implementation, whose extension links MuPDF's C++ bindings AND the
  #   SWIG-generated `_mupdf` Python bindings.  Those are produced by MuPDF's own
  #   `scripts/mupdfwrap.py`, not by libmupdf alone — so a plain prefix `mupdf`
  #   recipe exposing libmupdf + headers (approach (a)) does NOT satisfy PyMuPDF:
  #   the build still has to run MuPDF's wrap step.  (a) therefore means FIVE new
  #   C recipes (mupdf + the missing jbig2dec/openjpeg/mujs/gumbo) AND remains
  #   coupled to MuPDF's build machinery — more surface, no real decoupling.
  #   (b) builds PyMuPDF's sdist against the MuPDF source fork it pins, which is
  #   the officially supported, wheel-producing path.  The tradeoff, stated
  #   plainly: MuPDF here compiles its OWN vendored thirdparty codecs
  #   (freetype/harfbuzz/jbig2dec/openjpeg/jpeg/zlib/mujs/gumbo/...), not the
  #   prefix's freetype/harfbuzz/zlib/libjpeg-turbo — so this recipe declares no
  #   prefix native-library edges (the extension resolves the MuPDF libs it
  #   bundles via an $ORIGIN RUNPATH), unlike pillow.  That is the price of (b)
  #   and the reason it is "mostly self-contained".
  #
  # HERMETICITY: the pymupdf sdist is sha256-pinned in `source:`; the MuPDF
  # source tarball is ALSO sha256-pinned and fetched by build.sh (the pinned-curl
  # idiom recipes/openmp and recipes/grpc use for a second source), so nothing
  # that ends up IN the artifact is unpinned.  pipcl (PyMuPDF's PEP-517 backend)
  # and libclang (MuPDF's binding generator needs Clang-Python) are BUILD-ONLY
  # tools, version-pinned but pip-fetched — the same "pip layer offline, tooling
  # layer networked and version-pinned" split recipes/bcrypt-cp313 documents for
  # cargo.  See build.sh and the notes below.
  cvc_revision: 1
  maintainer: "cvcpkg group"
  maintainer_email: "info@cvcpkg.org"
  maintainer_url: "https://cvcpkg.org"
  homepage: https://pypi.org/project/PyMuPDF/
  # PyMuPDF and MuPDF are dual-licensed: GNU AGPL-3.0 or an Artifex commercial
  # licence.  The catalog records the open-source term.
  license: "AGPL-3.0-only"
  tags: [python, source, pdf, imaging]
  description: >-
    PyMuPDF 1.28.2 for CPython 3.13 (cp313) — the cp313 column of cvcpkg's
    per-interpreter matrix, BUILT FROM SOURCE (import as `pymupdf`, legacy alias
    `fitz`).  The consuming path is PDF rasterisation: `pymupdf.open(pdf)` then
    `page.get_pixmap(dpi=...)`, verified in build.sh.  Built with PyMuPDF's OWN
    pinned MuPDF fork rather than a prefix `mupdf` C-library recipe: 1.28.2 ships
    only the rebased implementation, which needs MuPDF's C++/SWIG bindings
    generated by MuPDF's own build, so a system-libmupdf recipe would not satisfy
    it (see the cvc_revision note for the full (a)-vs-(b) rationale).  cvcpkg
    fetches and sha256-verifies the sdist; build.sh fetches and sha256-verifies
    the pinned MuPDF source, applies a one-line Py2->Py3 fix to MuPDF's SWIG
    template (an `if(0)` dead-code `PyString_FromString`, undeclared in Python 3
    and thus a hard compile error under every SWIG), and compiles the wheel with
    the prefix's own CPython 3.13.  MuPDF's vendored codecs are compiled in and
    linked by soname out of the package dir via an $ORIGIN RUNPATH — no vendored
    system copies leak in and nothing is pip-installed into the artifact.

# From-source sdist (NOT source.type python_wheel): cvcpkg fetches + sha256-
# verifies this tarball and extracts it (strip_components) to CVC_SOURCE_DIR;
# build.sh compiles the wheel with the prefix's own interpreter.  The MuPDF C
# source is a SECOND source that build.sh fetches (a recipe `source:` block is a
# single tarball); it is sha256-pinned there.
source:
  type: tarball
  url: https://files.pythonhosted.org/packages/a3/fb/b6761fa2d5266f2cdb24c3b91f4023070ab7848381417678e7a289a1d52a/pymupdf-1.28.2.tar.gz
  sha256: "5e0be7908a715aa20333caddd73f1d6f01e4cd0c26e869fa2dd0b7f344da2249"
  strip_components: 1

python:
  interpreter: python313
  abi: cp313

patches: []

depends:
  build:
    - name: python313
    # PyMuPDF's PEP-517 backend is `pipcl` (pyproject build-backend = "setup",
    # backend-path = ["."]); pipcl itself declares pip + packaging.  pip ships
    # with the interpreter; packaging is a catalog recipe.  pipcl is not in the
    # catalog and is BUILD-ONLY, so build.sh pip-installs it version-pinned (see
    # notes) rather than adding a pipcl-cp313 recipe just to drive the build.
    - name: packaging-cp313
    # setuptools/wheel round out the build frontend the sdist expects.
    - name: setuptools-cp313
    - name: wheel-cp313
  runtime:
    # Only the interpreter: the compiled extensions link the MuPDF libraries
    # PyMuPDF bundles into the package dir (resolved via $ORIGIN), not the prefix.
    - name: python313
  host_tools:
    - python313
    # MuPDF's Python binding is SWIG-generated; the swig catalog recipe (4.4.1)
    # runs on the build host.  The PyString_FromString fix build.sh applies makes
    # the generated code compile independent of the SWIG version.
    - swig
    # Stamps the $ORIGIN RUNPATH into the pymupdf extensions so they resolve the
    # bundled libmupdf/libmupdfcpp out of the package dir on ELF platforms.
    - patchelf

build:
  # The CPython extension ABI does not vary with cvcpkg's Release/Debug build
  # type (MuPDF builds its own release profile regardless), so build once.
  build_type_independent: true
  # linux is verified end-to-end (build + get_pixmap rasterise) on the cvcpkg
  # Linux toolchain.  windows is claimed for the fleet's VS-equipped builders:
  # PyMuPDF's Windows MuPDF build drives Visual Studio's devenv (build.ps1), which
  # the fleet has and a plain Build-Tools host does not.  macos and the BSDs are
  # NOT claimed — an unverified column is a phantom claim (see pillow-cp313).
  matrix:
    - platform: linux
      script: build.sh
    - platform: windows
      script: build.ps1

package:
  # DOCUMENTATION ONLY — cvcpkg's stage_bundle ships the ENTIRE CVC_INSTALL_DIR;
  # build.sh keeps it pure by pip-installing --prefix into an empty per-recipe
  # dir.  `pymupdf/` holds the extensions + bundled MuPDF libs; `fitz/` is the
  # legacy-alias shim PyMuPDF still installs.
  files:
    - lib/python3.13/site-packages/pymupdf/
    - lib/python3.13/site-packages/fitz/
    - lib/python3.13/site-packages/pymupdf-*.dist-info/
    - Lib/site-packages/pymupdf/
    - Lib/site-packages/fitz/
    - Lib/site-packages/pymupdf-*.dist-info/

notes:
  - title: "The MuPDF source is sha256-pinned but fetched during the build"
    platforms: [linux, windows]
    description: >-
      A recipe `source:` block is a single tarball, so build.sh fetches the
      pinned mupdf-1.28.2-source.tar.gz (sha256 in build.sh) with the same
      pinned-curl idiom recipes/openmp and recipes/grpc use.  The download is
      verified before use, so what enters the artifact is fully pinned; the
      network access itself is the non-air-gapped step.
  - title: "pipcl and libclang are pip-fetched build-only tools"
    platforms: [linux, windows]
    description: >-
      PyMuPDF's PEP-517 backend (pipcl==13) and MuPDF's binding generator
      (libclang==18.1.1, which provides Clang-Python) have no catalog recipe and
      never ship in the artifact.  build.sh installs them version-pinned from
      PyPI into the build prefix.  This is the same "pip/artifact layer offline,
      tooling layer version-pinned over the network" split recipes/bcrypt-cp313
      documents for its cargo crates.
