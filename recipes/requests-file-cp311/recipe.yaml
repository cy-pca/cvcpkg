schema_version: 1
recipe:
  name: requests-file-cp311
  upstream_version: "3.0.1"
  cvc_revision: 1

  maintainer: "cvcpkg group"
  maintainer_email: "info@cvcpkg.org"
  maintainer_url: "https://cvcpkg.org"
  homepage: https://pypi.org/project/requests-file/
  license: "Apache-2.0"
  tags: [python, source]
  description: >-
    requests-file 3.0.1 for CPython 3.11 — the cp311 column of
    cvcpkg's per-interpreter matrix (pure-Python, built from the PyPI sdist);
    generated by tools/gen_python_recipes.py.
    Built FROM SOURCE: cvcpkg fetches and sha256-verifies the PyPI sdist,
    and build.sh compiles the wheel with the prefix's own CPython 3.11 —
    no third-party prebuilt binary enters the bundle.

# From-source sdist, sha256 as published by PyPI for this exact version.
source:
  # Built from the source package requests-file-src, which pins the upstream tarball
  # (https://files.pythonhosted.org/packages/3c/f8/5dc70102e4d337063452c82e1f0d95e39abfe67aa222ed8a5ddeb9df8de8/requests_file-3.0.1.tar.gz).
  type: package
  package: requests-file-src

python:
  interpreter: python311
  abi: cp311

patches: []

depends:
  build:
    - name: requests-file-src
      version: "==3.0.1"
    - name: python311
    - name: requests-cp311
    # PEP-517 build backend, from this sdist's [build-system] requires.
    # --no-build-isolation means pip will NOT fetch it, so it has to be
    # in the build prefix already (build.sh bridges it onto sys.path).
    - name: setuptools-cp311
    - name: setuptools-scm-cp311
  runtime:
    - name: python311
    - name: requests-cp311
  host_tools:
    - python311

build:
  build_type_independent: true
  matrix:
    - platform: any
      script: build.sh
    - platform: windows
      script: build.ps1

package:
  files:
    - { glob: "lib/python3.11/site-packages/requests_file/", platforms: [any] }
    - { glob: "lib/python3.11/site-packages/*.dist-info/", platforms: [any] }
    - { glob: "Lib/site-packages/requests_file/", platforms: [windows] }
    - { glob: "Lib/site-packages/*.dist-info/", platforms: [windows] }
