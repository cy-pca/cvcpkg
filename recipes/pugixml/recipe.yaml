schema_version: 1
recipe:
  name: pugixml
  upstream_version: "1.15"
  cvc_revision: 1
  maintainer: "cvcpkg group"
  maintainer_email: "info@cvcpkg.org"
  maintainer_url: "https://cvcpkg.org"
  homepage: https://pugixml.org
  license: MIT
  tags: [libraries, cpp, xml]
  description: >-
    pugixml — a light-weight C++ XML processing library with a DOM-like
    interface and XPath 1.0 support.  OpenImageIO, OpenShadingLanguage and
    Blender (Grease Pencil SVG import) use it.  1.15, the current release
    (Blender 5.2 still pins 1.10; the API OIIO and Blender use is unchanged).

source:
  type: tarball
  url: https://github.com/zeux/pugixml/archive/refs/tags/v1.15.tar.gz
  sha256: "b39647064d9e28297a34278bfb897092bf33b7c487906ddfc094c9e8868bddcb"
  strip_components: 1

patches: []

depends:
  build: []
  runtime: []
  host_tools:
    - cmake
    - ninja

build:
  matrix:
    - platform: linux
      script: build.sh
    - platform: haiku
      script: build.sh
    - platform: macos
      script: build.sh
      env:
        MACOSX_DEPLOYMENT_TARGET: "13.0"
    - platform: windows
      script: build.ps1

package:
  files:
    - include/pugixml.hpp
    - include/pugiconfig.hpp
    - lib/libpugixml*
    # MSVC: pugixml.lib + bin/pugixml.dll.
    - lib/pugixml*
    - { glob: "bin/pugixml*", platforms: [windows] }
    - lib/cmake/pugixml/
    - lib/pkgconfig/pugixml.pc
  pkg_config:
    - pugixml
  cmake_packages:
    - { name: pugixml, targets: ["pugixml::pugixml"] }

abi:
  cxx_std: 17
