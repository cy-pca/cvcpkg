schema_version: 1
recipe:
  name: imgui-w32
  upstream_version: "1.92.9"
  cvc_revision: 1
  maintainer: "cvcpkg group"
  maintainer_email: "info@cvcpkg.org"
  maintainer_url: "https://cvcpkg.org"
  homepage: https://github.com/ocornut/imgui
  license: MIT
  tags: [libraries, gui, graphics]
  description: >-
    Dear ImGui with a 32-bit ImWchar (IMGUI_USE_WCHAR32), so its text holds emoji and every other
    character past U+FFFF; the imgui package's 16-bit build draws those as '?', whatever the font.
    ImWchar's size changes ImGui's ABI, so this is a package of its own rather than a revision of
    imgui (whose 1.92.9+cvc.4 was this build, and broke the packages built against cvc.3): its
    headers install to include/imgui-w32, its library is libimgui-w32 (imgui-w32.lib on Windows)
    and its cmake package is imgui-w32 (find_package(imgui-w32), the imgui-w32::imgui target), so
    nothing built against imgui picks it up, and the two can share a prefix. Like imgui it ships
    the backends/ directory as source, and the FreeType font loader (misc/freetype) too: a
    consumer that links FreeType compiles it and draws colour glyphs (emoji fonts).

source:
  type: tarball
  url: https://github.com/ocornut/imgui/archive/refs/tags/v1.92.9.tar.gz
  sha256: "af97ed649182c39314320514a672b82008ab462b9293fe23d37b30bfa5d05519"
  strip_components: 1

patches:
  - imconfig-wchar32.patch

depends:
  build: []
  runtime: []
  host_tools: []

build:
  matrix:
    - platform: linux
      script: build.sh
    - platform: macos
      script: build.sh
      env:
        MACOSX_DEPLOYMENT_TARGET: "13.0"
    - platform: freebsd
      script: build.sh
    - platform: openbsd
      script: build.sh
    - platform: netbsd
      script: build.sh
    - platform: haiku
      script: build.sh
    # windows: MSVC (cl.exe) via build.ps1, a STATIC imgui-w32.lib whatever the link mode (ImGui
    # exports no __declspec(dllexport) symbols, so a DLL would export nothing).
    - platform: windows
      script: build.ps1
    # wasm: em++ (build-wasm.sh; build.sh would compile native objects, env-wasm.sh keeping
    # CXX=g++). Static only; wasm has no shared libraries.
    - platform: wasm
      host_platform: linux
      script: build-wasm.sh
    # Threaded wasm: the same script; env-wasm.sh injects -pthread (CVC_WASM_THREADS).
    - platform: wasm-mt
      host_platform: linux
      script: build-wasm.sh
      env:
        CVC_WASM_THREADS: "1"

package:
  files:
    - { glob: "lib/libimgui-w32*", platforms: [linux, macos, freebsd, openbsd, netbsd, haiku, wasm, wasm-mt] }
    - { glob: "lib/imgui-w32.lib", platforms: [windows] }
    - lib/cmake/imgui-w32/
    - include/imgui-w32/

abi:
  cxx_std: 17
