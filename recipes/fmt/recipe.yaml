schema_version: 1
recipe:
  name: fmt
  upstream_version: "12.1.0"
  cvc_revision: 1
  maintainer: "cvcpkg group"
  maintainer_email: "info@cvcpkg.org"
  maintainer_url: "https://cvcpkg.org"
  homepage: https://fmt.dev
  license: MIT
  tags: [libraries, cpp, text]
  description: >-
    {fmt} — a fast, safe formatting library for C++ (the basis of C++20
    std::format).  Built as a shared library.  12.1.0 is the version Blender
    5.2 pins in build_files/build_environment/cmake/versions.cmake; Blender,
    OpenImageIO and OpenVDB find it with find_package(fmt).

source:
  type: tarball
  url: https://github.com/fmtlib/fmt/archive/refs/tags/12.1.0.tar.gz
  sha256: "ea7de4299689e12b6dddd392f9896f08fb0777ac7168897a244a6d6085043fea"
  strip_components: 1

patches: []

depends:
  build: []
  runtime: []
  host_tools:
    - cmake
    - ninja

build:
  matrix:
    - platform: linux
      script: build.sh
    - platform: haiku
      script: build.sh
    - platform: macos
      script: build.sh
      env:
        MACOSX_DEPLOYMENT_TARGET: "13.0"
    - platform: windows
      script: build.ps1

package:
  files:
    - include/fmt/
    - lib/libfmt*
    # MSVC: fmt.lib (import lib) + bin/fmt.dll.
    - lib/fmt*
    - { glob: "bin/fmt*", platforms: [windows] }
    - lib/cmake/fmt/
    - lib/pkgconfig/fmt.pc
  pkg_config:
    - fmt
  cmake_packages:
    - { name: fmt, targets: ["fmt::fmt", "fmt::fmt-header-only"] }

abi:
  cxx_std: 17
