schema_version: 1
recipe:
  name: libvorbis-src
  upstream_version: "1.3.7"
  cvc_revision: 1
  maintainer: cvcpkg group
  maintainer_email: info@cvcpkg.org
  maintainer_url: https://cvcpkg.org
  homepage: https://www.xiph.org/vorbis/
  license: BSD-3-Clause
  tags: [source]
  description: >-
    The unmodified upstream source of libvorbis 1.3.7: its release tarball,
    verified against the sha256 below and staged at src/libvorbis-src/.  The libvorbis
    recipe builds from it (source.type package), so the tarball is fetched
    once, from ftp.osuosl.org, and every other build of libvorbis -- another
    platform, a builder that cannot reach ftp.osuosl.org, a user building from
    source -- installs this package from the catalog instead.  Generated by
    tools/make_source_package.py.

source:
  type: tarball
  url: https://ftp.osuosl.org/pub/xiph/releases/vorbis/libvorbis-1.3.7.tar.gz
  sha256: "0e982409a9c3fc82ee06e08205b1355e5c6aa4c36bca58146ef399621b0ce5ab"
  strip_components: 1

patches: []

depends:
  build: []
  runtime: []
  host_tools: []

build:
  build_type_independent: true
  matrix:
    - platform: any
      script: build.sh

package:
  files:
    - src/libvorbis-src/
