  url: https://xorg.freedesktop.org/releases/individual/lib/xtrans-1.6.0.tar.xz
  sha256: "faafea166bf2451a173d9d593352940ec6404145c5d1da5c213423ce4d359e92"
  strip_components: 1

patches: []

depends:
  build: []
  runtime: []
  host_tools: []

build:
  build_type_independent: true
  matrix:
    - platform: any
      script: build.sh

package:
  files:
    - src/xtrans-src/
