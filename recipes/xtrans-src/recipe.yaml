schema_version: 1
recipe:
  name: xtrans-src
  upstream_version: "1.6.0"
  cvc_revision: 1
  maintainer: cvcpkg group
  maintainer_email: info@cvcpkg.org
  maintainer_url: https://cvcpkg.org
  homepage: https://www.x.org/
  license: MIT
  tags: [source]
  description: >-
    The unmodified upstream source of xtrans 1.6.0: its release tarball,
    verified against the sha256 below and staged at src/xtrans-src/.  The xtrans
    recipe builds from it (source.type package), so the tarball is fetched
    once, from xorg.freedesktop.org, and every other build of xtrans -- another
    platform, a builder that cannot reach xorg.freedesktop.org, a user building from
    source -- installs this package from the catalog instead.  Generated by
    tools/make_source_package.py.

source:
