schema_version: 1
recipe:
  name: libiimod
  upstream_version: "4.0.6"
  cvc_revision: 3  # licence texts in share/licenses/libiimod/ (cvcpkg#576)
  maintainer: "cvcpkg group"
  maintainer_email: "info@cvcpkg.org"
  maintainer_url: "https://cvcpkg.org"
  description: "IMOD image I/O library — low-level routines for reading and writing MRC, TIFF, and other microscopy image formats."
  homepage: https://github.com/LabShare-Archive/IMOD
  license: GPL-2.0-or-later
  tags: [bio, io, wasm, wasi]

source:
  # Vendored in third-party/libiimod/ — curated subset of IMOD's
  # image-file I/O library, built with our own CMakeLists.txt.
  type: vendored
  path: third-party/libiimod

patches: []

depends:
  build:
    - cmake
    - ninja
  runtime:
    - name: libjpeg-turbo
    - name: xz
    - name: zstd
    - name: libwebp
    - name: lerc
    - name: tiff
      version: "^4.6"
  host_tools: []

build:
  matrix:
    - platform: linux
      script: build.sh
      env:
        CFLAGS: "-O2 -fPIC"
    - platform: macos
      script: build.sh
      env:
        MACOSX_DEPLOYMENT_TARGET: "13.0"
    - platform: freebsd
      script: build.sh
      env:
        CFLAGS: "-O2 -fPIC"
    - platform: openbsd
      script: build.sh
      env:
        CFLAGS: "-O2 -fPIC"
    - platform: netbsd
      script: build.sh
      env:
        CFLAGS: "-O2 -fPIC"
    - platform: windows
      script: build.ps1
    - platform: wasm
      host_platform: linux
      script: build-wasm.sh
    - platform: wasm
      host_platform: windows
      script: build-wasm.ps1
    - platform: wasi
      host_platform: linux
      script: build-wasi.sh
    - platform: wasi
      host_platform: windows
      script: build-wasi.ps1
    - platform: cosmo
      host_platform: linux
      script: build-cosmo.sh

package:
  files:
    # The Unix / MSVC pair: the target is `iimod`, so Unix installs
    # lib/libiimod.a and MSVC lib/iimod.lib. The pack gate judges the two
    # together; lib/libiimod* alone matched nothing on Windows.
    - lib/libiimod*
    - lib/iimod*
    - lib/cmake/libiimod/
    - include/libiimod/
    - share/licenses/libiimod/
  cmake_packages:
    - { name: libiimod, targets: ["libiimod::libiimod"] }

abi:
  cxx_std: 17
