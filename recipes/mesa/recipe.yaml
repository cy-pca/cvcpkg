schema_version: 1
recipe:
  name: mesa
  upstream_version: "25.3.6"
  # Bumped 1 -> 2: netbsd-alloca-builtin.patch.  On NetBSD every alloca() in
  # Mesa called libc's alloca() instead of the compiler builtin, and llvmpipe
  # segfaulted compiling VTK's multisample-resolve shader (NIR out-of-SSA).
  # glibc and FreeBSD already map alloca to the builtin, so the linux and
  # freebsd builds compile the same code.
  # Not bumped for the windows build: it is a new variant (no windows bundle
  # was ever published), and scoping the X11/GLVND/libdrm, expat and zstd
  # edges to the Unix platforms leaves what linux, freebsd and netbsd build
  # and ship unchanged.
  cvc_revision: 2
  maintainer: "cvcpkg group"
  maintainer_email: "info@cvcpkg.org"
  maintainer_url: "https://cvcpkg.org"
  homepage: https://www.mesa3d.org/
  license: MIT
  tags: [libraries, graphics, opengl, software-rendering]
  description: >-
    Mesa 3D software OpenGL — the llvmpipe (LLVM JIT) and softpipe Gallium
    rasterizers behind GLX (libGLX_mesa.so.0, X11 platform, GLVND vendor
    "mesa") and EGL (libEGL_mesa.so.0 + glvnd egl_vendor.d/50_mesa.json),
    plus GLES2. Lets a headless Linux server run the cvcpkg VTK / pycvc_gl
    OpenGL stack with no system Mesa (no libgl1-mesa-dri / libglx-mesa0).
    Relocatable: every library carries an $ORIGIN RUNPATH and the GLVND
    dispatch layer (cvcpkg libglvnd >= +cvc.2) finds the GLX/EGL vendor
    libraries and the EGL vendor JSON relative to its own location, so no
    environment variables are needed beyond the usual cvcpkg activate.
    No hardware drivers, no Vulkan, no gbm, no video codecs, no OpenCL.
    On Windows: llvmpipe and softpipe behind WGL (bin/opengl32.dll +
    bin/libgallium_wgl.dll, LLVM linked in), for a process that must render
    with no GPU, such as a CI runner, where Windows offers only GDI's
    OpenGL 1.1.

source:
  # Built from the source package mesa-src, which pins the upstream tarball
  # (https://archive.mesa3d.org/mesa-25.3.6.tar.xz).
  type: package
  package: mesa-src

patches:
  # NetBSD's <stdlib.h> only declares alloca() for GCC/clang, and Mesa's strict
  # -std=c11/c++17 turns the implicit builtin off, so the calls went to libc's
  # alloca(), which moves the stack pointer under the compiler.  Map it to
  # __builtin_alloca in include/c99_alloca.h, as glibc and FreeBSD do.
  - netbsd-alloca-builtin.patch

depends:
  build:
    - name: mesa-src
      version: "==25.3.6"
    - meson
    - ninja
    - pkg-config
    - name: patchelf
      platforms: [linux, freebsd, netbsd]
    # On Windows these are winflexbison's win_flex and win_bison.
    - bison
    - flex
    - m4
    # On Windows, meson.cmd runs the build prefix's python.exe, so this is also
    # the interpreter meson itself runs on.
    - name: python311
    # Mesa's code generators import mako, yaml and packaging.
    - name: markupsafe-cp311
    - name: mako-cp311
    - name: pyyaml-cp311
    - name: packaging-cp311
    - name: xorgproto
      platforms: [linux, freebsd, netbsd]
    # MSVC cannot build the libLLVM DLL, so on Windows libgallium_wgl.dll links
    # llvm20's component .lib files and LLVM does not ship.
    - name: llvm20
      platforms: [windows]
  runtime:
    - name: llvm20
      platforms: [linux, freebsd, netbsd]
    # >= libglvnd 1.7.0+cvc.2 (relocatable EGL vendor dir) is required for the
    # EGL path; the resolver serves the newest revision.
    - name: libglvnd
      platforms: [linux, freebsd, netbsd]
    - name: libdrm
      platforms: [linux, freebsd, netbsd]
    - name: libx11
      platforms: [linux, freebsd, netbsd]
    - name: libxext
      platforms: [linux, freebsd, netbsd]
    - name: libxcb
      platforms: [linux, freebsd, netbsd]
    - name: libxxf86vm
      platforms: [linux, freebsd, netbsd]
    - name: libxshmfence
      platforms: [linux, freebsd, netbsd]
    - name: expat
      platforms: [linux, freebsd, netbsd]
    - name: zlib
    - name: zstd
      platforms: [linux, freebsd, netbsd]
  host_tools: []

package:
  files:
    - lib/
    # The Windows build installs no headers and no data (no GLVND vendor
    # files, no drirc).
    - { glob: "include/", platforms: [linux, freebsd, netbsd] }
    - { glob: "share/", platforms: [linux, freebsd, netbsd] }
    # Windows: the WGL stub and the drivers, plus their import libs in lib/.
    - { glob: "bin/opengl32.dll", platforms: [windows] }
    - { glob: "bin/libgallium_wgl.dll", platforms: [windows] }

build:
  matrix:
    # Verified on x86_64; llvm20 targets X86/AArch64/WebAssembly so llvmpipe's
    # JIT also has an AArch64 backend (arm64 not exercised).  On FreeBSD and
    # NetBSD this is the GL that cvcpkg's qt6 and vtk build against: FreeBSD's
    # system Mesa is a port and NetBSD's is in the optional X11 sets, and builds
    # use neither.  OpenBSD's base X11 always has Mesa, so it has no entry.
    - platform: linux
      script: build.sh
    - platform: freebsd
      script: build.sh
    - platform: netbsd
      script: build.sh
    # MSVC + Meson.  libcvc's Windows CI stages the DLLs beside its cvcGL
    # render tests; before this it fetched mesa-dist-win from GitHub Releases,
    # which answered 504 for minutes at a time.
    - platform: windows
      script: build.ps1

notes:
  - title: "Relocation / environment"
    platforms: [linux]
    description: >-
      After `cvcpkg install mesa --prefix P` (which also installs libglvnd),
      software GL works from any P with no environment variables beyond the
      standard cvcpkg activate (LD_LIBRARY_PATH=P/lib, so the application
      finds libGL/libEGL).  GLX: libGLX.so.0 dlopens libGLX_mesa.so.0 through
      its own $ORIGIN RUNPATH; libGLX_mesa links libgallium-<ver>.so
      (llvmpipe/softpipe) and libLLVM.so.20.1 from the same prefix.  EGL:
      libEGL.so.1 (cvcpkg libglvnd >= +cvc.2) scans
      <libEGL dir>/../share/glvnd/egl_vendor.d, which holds 50_mesa.json
      (library_path is the bare soname libEGL_mesa.so.0, resolved through the
      $ORIGIN RUNPATH).  With an older libglvnd (+cvc.1) the EGL vendor dir is
      a baked build path, so set __EGL_VENDOR_LIBRARY_FILENAMES=
      P/share/glvnd/egl_vendor.d/50_mesa.json.  lib/dri/swrast_dri.so is a
      symlink to libdril_dri.so (RUNPATH $ORIGIN:$ORIGIN/..) for X servers that
      load it (Xvfb); the X server must look in P/lib/dri.
  - title: "Known limitations"
    platforms: [linux]
    description: >-
      Mesa 25.3.6 crashes (NULL swrast loader in drisw_init_screen) when
      LIBGL_ALWAYS_SOFTWARE=1 is combined with EGL *device* enumeration
      (vtkEGLRenderWindow) on a host that also exposes a DRM render node;
      leave LIBGL_ALWAYS_SOFTWARE unset (llvmpipe is still selected) or use
      EGL_PLATFORM=surfaceless.  gbm is enabled only because Mesa builds
      swrast_dri.so under it.  drirc (share/drirc.d) and the gbm backend dir
      are baked absolute paths that do not follow a relocated prefix; they only
      affect hardware-driver app workarounds, never llvmpipe.  The classic
      OSMesa library was removed from Mesa in 25.1 and is not built.
  - title: "Windows"
    platforms: [windows]
    description: >-
      Copy bin/opengl32.dll and bin/libgallium_wgl.dll into the directory of
      the executable that should render with llvmpipe.  Windows searches an
      executable's own directory before System32, so this replaces the GDI
      OpenGL 1.1 path for that process only; nothing is installed system-wide.
      Both are needed: opengl32.dll is only the WGL loader and
      libgallium_wgl.dll holds the drivers (LLVM is linked into it).
      libgallium_wgl.dll also loads zlib1.dll, which the install puts in the
      same bin/: copy it along, or keep that bin/ on PATH.
      GALLIUM_DRIVER=llvmpipe (the default) or softpipe picks the rasterizer.
      Desktop OpenGL only (4.5 core and compatibility with llvmpipe); no EGL,
      GLES or Vulkan.
  - title: "FreeBSD and NetBSD"
    platforms: [freebsd, netbsd]
    description: >-
      The same software stack as on Linux (llvmpipe/softpipe behind GLX via
      libglvnd, EGL, GLES2), for hosts with no system OpenGL in a cvcpkg
      prefix.  Headless use needs no X server: EGL with
      EGL_PLATFORM_SURFACELESS_MESA gives an llvmpipe GLES 3.2 context
      (checked under `env -i` on FreeBSD 14.4 and on NetBSD 10.1 with PaX
      MPROTECT on).  The libraries carry a link-time $ORIGIN:$ORIGIN/..
      RUNPATH instead of a patchelf pass, so on NetBSD every object keeps the
      two PT_LOAD segments ld.elf_so requires.  NetBSD needs cvcpkg libglvnd
      >= 1.7.0+cvc.3 and this build's -mtls-dialect=gnu: its x86_64 ld.elf_so
      does not resolve TLS descriptors, and +cvc.2's libGLdispatch crashes in
      eglGetProcAddress.
      Mesa prints "The provided filesystem timestamp for the cache is bogus!"
      and runs without its on-disk shader cache: the cvcpkg libLLVM has no
      build-id and packaged files carry a 1970 mtime, so shaders are compiled
      again in every process.  On NetBSD, libxshmfence (DRI3 fences) uses
      the POSIX-semaphore backend from NetBSD's own X11, since NetBSD has no
      futex and no process-shared pthread mutexes.
