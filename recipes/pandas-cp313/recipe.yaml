schema_version: 1
recipe:
  name: pandas-cp313
  upstream_version: "3.0.3"
  cvc_revision: 2

  maintainer: "cvcpkg group"
  maintainer_email: "info@cvcpkg.org"
  maintainer_url: "https://cvcpkg.org"
  homepage: https://pypi.org/project/pandas/
  license: "BSD-3-Clause"
  tags: [python, source]
  description: >-
    pandas 3.0.3 for CPython 3.13 — the cp313 column of
    cvcpkg's per-interpreter matrix (C extensions compiled for cp313 from the PyPI sdist);
    generated by tools/gen_python_recipes.py.
    Built FROM SOURCE: cvcpkg fetches and sha256-verifies the PyPI sdist,
    and build.sh compiles the wheel with the prefix's own CPython 3.13 —
    no third-party prebuilt binary enters the bundle.

# From-source sdist, sha256 as published by PyPI for this exact version.
source:
  # Built from the source package pandas-src, which pins the upstream tarball
  # (https://files.pythonhosted.org/packages/f8/87/4341c6252d1c47b08768c3d25ac487362bf403f0313ddae4a2a26c9b1b4c/pandas-3.0.3.tar.gz).
  type: package
  package: pandas-src

python:
  interpreter: python313
  abi: cp313

patches: []

depends:
  build:
    - name: pandas-src
      version: "==3.0.3"
    - name: python313
    - name: numpy-cp313
    - name: python-dateutil-cp313
    - name: tzdata-cp313
    # PEP-517 build backend, from this sdist's [build-system] requires.
    # --no-build-isolation means pip will NOT fetch it, so it has to be
    # in the build prefix already (build.sh bridges it onto sys.path).
    - name: meson-python-cp313
    - name: meson
    - name: wheel-cp313
    - name: cython-cp313
    - name: versioneer-cp313
  runtime:
    - name: python313
    - name: numpy-cp313
    - name: python-dateutil-cp313
    - name: tzdata-cp313
  host_tools:
    - python313

build:
  build_type_independent: true
  matrix:
    - platform: linux
      script: build.sh
    - platform: macos
      script: build.sh
    - platform: windows
      script: build.ps1

package:
  files:
    - { glob: "lib/python3.13/site-packages/pandas/", platforms: [linux, macos] }
    - { glob: "lib/python3.13/site-packages/pandas-*.dist-info/", platforms: [linux, macos] }
    - { glob: "Lib/site-packages/pandas/", platforms: [windows] }
    - { glob: "Lib/site-packages/pandas-*.dist-info/", platforms: [windows] }
