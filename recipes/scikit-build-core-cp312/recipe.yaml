schema_version: 1
recipe:
  name: scikit-build-core-cp312
  upstream_version: "1.1.1"
  cvc_revision: 1

  maintainer: "cvcpkg group"
  maintainer_email: "info@cvcpkg.org"
  maintainer_url: "https://cvcpkg.org"
  homepage: https://pypi.org/project/scikit-build-core/
  license: "Apache-2.0"
  tags: [python, source]
  description: >-
    scikit-build-core 1.1.1 for CPython 3.12 — the cp312 column of
    cvcpkg's per-interpreter matrix (pure-Python, built from the PyPI sdist);
    generated by tools/gen_python_recipes.py.
    Built FROM SOURCE: cvcpkg fetches and sha256-verifies the PyPI sdist,
    and build.sh compiles the wheel with the prefix's own CPython 3.12 —
    no third-party prebuilt binary enters the bundle.

# From-source sdist, sha256 as published by PyPI for this exact version.
source:
  type: tarball
  url: https://files.pythonhosted.org/packages/b2/1a/8c00b19c0a1e7acf890676af2efa430339d38e59fa9437f2aab8517af3f4/scikit_build_core-1.1.1.tar.gz
  sha256: "e347a59193c878ac56a363e57506938652a6dd8c965790cb1cbc6bc7e8d5abad"
  strip_components: 1

python:
  interpreter: python312
  abi: cp312

patches: []

depends:
  build:
    - name: python312
    - name: packaging-cp312
    - name: pathspec-cp312
    # PEP-517 build backend, from this sdist's [build-system] requires.
    # --no-build-isolation means pip will NOT fetch it, so it has to be
    # in the build prefix already (build.sh bridges it onto sys.path).
    - name: hatchling-cp312
    - name: hatch-vcs-cp312
    - name: setuptools-scm-cp312
    - name: setuptools-cp312
    - name: pluggy-cp312
    - name: trove-classifiers-cp312
    - name: calver-cp312
  runtime:
    - name: python312
    - name: packaging-cp312
    - name: pathspec-cp312
  host_tools:
    - python312

provides:
  - scikit-build-core

build:
  build_type_independent: true
  matrix:
    - platform: any
      script: build.sh
    - platform: windows
      script: build.ps1

package:
  files:
    - { glob: "lib/python3.12/site-packages/scikit_build_core/", platforms: [any] }
    - { glob: "lib/python3.12/site-packages/scikit_build_core-*.dist-info/", platforms: [any] }
    - { glob: "bin/scikit-build", platforms: [any] }
    - { glob: "bin/scikit-build-core", platforms: [any] }
    - { glob: "Lib/site-packages/scikit_build_core/", platforms: [windows] }
    - { glob: "Lib/site-packages/*.dist-info/", platforms: [windows] }
