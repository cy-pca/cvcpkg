schema_version: 1
recipe:
  name: qt6
  upstream_version: "6.8.2"
  # Bumped 4 -> 5: build the xcb platform plugin against the hermetic X11/xcb +
  # OpenGL(GLVND) recipes on Linux instead of system libs (build.sh forces
  # -DINPUT_xcb=yes). Part of dropping the apt-get X11/GL line downstream.
  # Bumped 5 -> 6: the qyieldcpu-arm-acle-include.patch now gates the arm_acle
  # include on __ARM_ACLE. The +cvc.5 patch added a BARE `#if
  # __has_include(<arm_acle.h>)` (for macOS aarch64), which broke x86 libclang
  # parsers — clang ships arm_acle.h on x86 too and it #errors off-ARM (killed the
  # shiboken generator building PySide6). Header-only, so ABI-identical.
  # Bumped 6 -> 7: add xkbcommon-x11 (X keyboard handling for the xcb QPA plugin)
  # now that the recipe exists, and pick up libxcb +cvc.3 (pthread-stubs).
  # Bumped 7 -> 8: the Linux bundle linked the builder's own libzstd, glib,
  # libSM/libICE, fontconfig, freetype, harfbuzz, libpng and libdrm (star-00,
  # 6.8.2+cvc.7), none of them declared. Linux now links the cvcpkg recipes
  # declared below, Qt's bundled harfbuzz, and turns glib and the other
  # host-only features off (build.sh).
  cvc_revision: 8
  maintainer: "cvcpkg group"
  maintainer_email: "info@cvcpkg.org"
  maintainer_url: "https://cvcpkg.org"
  description: "Qt 6 — a cross-platform application framework for GUI development and beyond."
  homepage: https://www.qt.io/
  license: LGPL-3.0-only
  tags: [graphics, wasm]

source:
  # Built from the source package qt6-src, which pins the upstream tarball
  # (https://download.qt.io/archive/qt/6.8/6.8.2/submodules/qtbase-everywhere-src-6.8.2.tar.xz).
  type: package
  package: qt6-src

patches:
  - qyieldcpu-arm-acle-include.patch
  # OpenBSD: skip Qt's no-undefined link flag; libc is linked into executables
  # there, not shared libraries (libQt6Core.so: "undefined symbol: strlen").
  - openbsd-no-undefined.patch
  # OpenBSD: QtNetwork's BSD interface code needs <netinet6/in6_var.h>, and OpenBSD
  # has no IFT_STF.
  - openbsd-network-in6-var.patch
  # NetBSD: <net/if.h> defines ifr_ifindex as ifr_index, so QtNetwork's two
  # ifreq_index() overloads collide; skip the Linux one there.
  - netbsd-network-ifreq-index.patch
  # macOS 26 SDK: AGL.framework is gone, and qtbase 6.8.2 links it anyway.
  # Apple-only code path, and no macOS cvc.7 was ever published, so no bump.
  - macos-no-agl-framework.patch

depends:
  build:
    - name: qt6-src
      version: "==6.8.2"
    - name: pcre2
      version: "^10.0"
    - cmake
    - ninja
    - name: python3
      platforms: [linux, macos, freebsd, openbsd, netbsd]
    - name: python312
      platforms: [windows]
    - perl
  runtime:
    - name: openssl
      version: "^3.0"
    - name: zlib
      version: "^1.3"
    - name: pcre2
      version: "^10.0"
    # Hermetic X11/xcb + OpenGL for the xcb QPA platform plugin on Linux,
    # FreeBSD and NetBSD (macOS uses cocoa, Windows its native QPA, and OpenBSD
    # its base X11 and Mesa). xkbcommon is the base keymap lib; xkbcommon-x11
    # gives the xcb plugin full X keyboard handling (keymaps from the X server
    # over xcb-xkb).
    - name: libxcb
      platforms: [linux, freebsd, netbsd]
    - name: xcb-util
      platforms: [linux, freebsd, netbsd]
    - name: xcb-util-image
      platforms: [linux, freebsd, netbsd]
    - name: xcb-util-keysyms
      platforms: [linux, freebsd, netbsd]
    - name: xcb-util-renderutil
      platforms: [linux, freebsd, netbsd]
    - name: xcb-util-wm
      platforms: [linux, freebsd, netbsd]
    - name: xcb-util-cursor
      platforms: [linux, freebsd, netbsd]
    - name: libx11
      platforms: [linux, freebsd, netbsd]
    - name: libxi
      platforms: [linux, freebsd, netbsd]
    - name: libxext
      platforms: [linux, freebsd, netbsd]
    - name: libxfixes
      platforms: [linux, freebsd, netbsd]
    - name: libxrender
      platforms: [linux, freebsd, netbsd]
    - name: libglvnd
      platforms: [linux, freebsd, netbsd]
    - name: xkbcommon
      platforms: [linux, freebsd, netbsd]
    - name: xkbcommon-x11
      platforms: [linux, freebsd, netbsd]
    # FreeBSD and NetBSD: the GL driver behind libglvnd (llvmpipe), so a Qt
    # application there gets a working OpenGL with no system Mesa.  On Linux
    # the GLVND vendor library comes from the host, or from a cvcpkg mesa
    # installed separately.
    - name: mesa
      platforms: [freebsd, netbsd]
    # QtCore and QtNetwork link zstd when they find it (zstd-compressed
    # resources and HTTP bodies).  Declared so it is cvcpkg's, not the ports
    # libzstd in /usr/local the FreeBSD builder has (freebsd-build-2,
    # 2026-10-30) or the distro one Linux builders have (build.sh requires it
    # on Linux).
    - name: zstd
      platforms: [linux, freebsd, netbsd]
    # Linux: what QtGui and the xcb plugin link beyond X11/xcb and GL.
    # fontconfig finds the system fonts (without it Qt only looks in
    # lib/fonts) and needs the system FreeType, which links libpng; QtGui
    # links all three.  libdrm is for the KMS/EGLFS and linuxfb plugins, and
    # libsm/libice for X session management in the xcb plugin.  build.sh
    # requires each of them on Linux.
    - name: fontconfig
      platforms: [linux]
    - name: freetype
      platforms: [linux]
    - name: libpng
      platforms: [linux]
    - name: libdrm
      platforms: [linux]
    - name: libsm
      platforms: [linux]
    - name: libice
      platforms: [linux]
  host_tools: []

build:
  matrix:
    - platform: linux
      script: build.sh
      env:
        CXXFLAGS: "-O2 -fPIC -std=c++17"
    - platform: macos
      script: build.sh
      env:
        MACOSX_DEPLOYMENT_TARGET: "13.0"
    - platform: freebsd
      script: build.sh
      env:
        CXXFLAGS: "-O2 -fPIC -std=c++17"
    - platform: openbsd
      script: build.sh
      env:
        CXXFLAGS: "-O2 -fPIC -std=c++17"
    - platform: netbsd
      script: build.sh
      env:
        CXXFLAGS: "-O2 -fPIC -std=c++17"
    - platform: windows
      script: build.ps1
    - platform: wasm
      host_platform: linux
      script: build-wasm.sh
      env:
        CXXFLAGS: "-O2 -std=c++17"
    - platform: wasm
      host_platform: macos
      script: build-wasm.sh
      env:
        MACOSX_DEPLOYMENT_TARGET: "13.0"
    - platform: wasm
      host_platform: windows
      script: build-wasm.ps1

package:
  files:
    # macOS builds Qt as frameworks: a module's library and headers live in
    # lib/Qt<Module>.framework/, and Qt writes no pkg-config files for a
    # framework build (nor on Windows by default).  Scoping these never drops
    # files -- packing takes the whole staged tree; package.files declares
    # what must exist (macos-15-intel populate 39171736755: "lib/pkgconfig/Qt6*
    # matches nothing").
    - lib/libQt6*
    - lib/Qt6*
    - { glob: "lib/Qt*.framework/", platforms: [macos] }
    - lib/cmake/Qt6*/
    - { glob: "lib/pkgconfig/Qt6*", platforms: [linux, freebsd, openbsd, netbsd] }
    - include/Qt*/
    # Qt 6.8 installs moc/rcc/uic into libexec/ on Unix; Windows keeps its
    # tools and Qt6*.dll in bin/, and the wasm build copies the host tools
    # into bin/ (build-wasm.sh).  Unscoped, these failed the strict check on
    # linux/arm64, as did lib/qt6/ and share/qt6/, which no build produces.
    - { glob: "libexec/", platforms: [linux, macos, freebsd, openbsd, netbsd] }
    - { glob: "bin/moc*", platforms: [windows, wasm] }
    - { glob: "bin/rcc*", platforms: [windows, wasm] }
    - { glob: "bin/uic*", platforms: [windows, wasm] }
    - bin/qmake*
    - { glob: "bin/Qt6*", platforms: [windows] }
    - plugins/
    - mkspecs/wasm-emscripten/
    # Full host-native Qt install shipped only in wasm bundles so
    # downstream submodule wasm builds have a QT_HOST_PATH.
    - { glob: "host-qt/", platforms: [wasm] }
  cmake_packages:
    - {
        name: Qt6,
        targets:
          [
            "Qt6::Core",
            "Qt6::Gui",
            "Qt6::Widgets",
            "Qt6::OpenGL",
            "Qt6::OpenGLWidgets",
          ],
      }

abi:
  cxx_std: 17

toolchain:
  emscripten:
    min_version: "3.1.50"
    recommended: "5.0"
    description: "Emscripten SDK for C++ → WASM cross-compilation (provided by emsdk recipe)"
  cc:
    min_version: "any"
    description: "Native C/C++17 compiler needed for host tools (moc, rcc, uic)"

notes:
  - title: "WASM cross-compilation"
    platforms: [wasm]
    description: >-
      The wasm platform entries cross-compile Qt 6 for
      wasm_singlethread using Emscripten.  A native host Qt is built
      first (for moc/rcc/uic), then the wasm target is built with
      threads disabled.  Output is static .a libraries only.
  - title: "emsdk dependency for wasm only"
    platforms: [wasm]
    description: >-
      The emsdk build dependency is only needed for wasm builds.
      Native platform builds (linux, macos, windows) ignore it.
  - title: "Static-only build"
    platforms: [wasm]
    description: >-
      WASM builds are always static.  The resulting .a libraries are linked
      into the final .wasm binary by emcc at application link time.
  - title: "Very long build time"
    platforms: [wasm]
    description: >-
      A full Qt6 cross-compilation for WASM can take 30-60 minutes on a
      fast machine.  The recipe builds only qtbase (Core, Gui, Widgets,
      Network).
