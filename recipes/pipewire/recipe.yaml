schema_version: 1
recipe:
  name: pipewire
  upstream_version: "1.2.7"
  # Bumped 2 -> 3: added the freebsd build. FreeBSD carries pipewire as a
  # mainline port, and this recipe already builds only the portable core —
  # build.sh disables systemd, logind, selinux, udev, dbus, alsa and v4l2, which
  # is exactly the Linux-specific surface. OpenBSD has no port and NetBSD has
  # only a pkgsrc-wip one, so neither is claimed.
  # cvc.4: libpipewire baked the build sandbox into its SPA plugin, module and
  # config dirs (/tmp/cvcpkg-builder/.../install/{lib/spa-0.2,lib/pipewire-0.3,
  # share/pipewire,etc/pipewire}), so once relocated every client failed in
  # pw_init(): "can't make support.system handle: No such file or directory",
  # and without client.conf the context could not be created (SDL3's PipeWire
  # backend: "Failed to create hotplug detection loop"). relocatable-dirs.patch
  # resolves the plugin, module and config data dirs next to the loaded
  # libpipewire (lib/spa-0.2, lib/pipewire-0.3, share/pipewire); build.sh sets
  # sysconfdir to the system's, so /etc/pipewire overrides still apply.
  cvc_revision: 4
  maintainer: "cvcpkg group"
  maintainer_email: "info@cvcpkg.org"
  maintainer_url: "https://cvcpkg.org"
  homepage: https://pipewire.org/
  license: MIT
  tags: [multimedia]
  description: >-
    PipeWire — a server and user-space API to handle multimedia pipelines
    on Linux (audio/video capture and playback).  Built as a lean core
    (libpipewire-0.3 + SPA) with the heavy optional backends
    (ALSA/JACK/BlueZ/systemd/GStreamer) disabled, providing the
    libpipewire client library Qt Multimedia can target on Linux.

source:
  # Built from the source package pipewire-src, which pins the upstream tarball
  # (https://gitlab.freedesktop.org/pipewire/pipewire/-/archive/1.2.7/pipewire-1.2.7.tar.gz).
  type: package
  package: pipewire-src

patches:
  - relocatable-dirs.patch

depends:
  build:
    - name: pipewire-src
      version: "==1.2.7"
    - ninja
    - meson
    - pkg-config
    - name: python3
      platforms: [linux, macos, freebsd, openbsd, netbsd]
    - name: python312
      platforms: [windows]
  runtime: []
  host_tools: []

build:
  matrix:
    - platform: linux
      script: build.sh
      env:
        CFLAGS: "-O2 -fPIC"
    - platform: freebsd
      script: build.sh
      env:
        CFLAGS: "-O2 -fPIC"

package:
  files:
    - lib/libpipewire-0.3*
    # No lib/libspa-0.2*: SPA is a plugin directory (lib/spa-0.2/), not a library.
    - lib/pipewire-0.3/
    - lib/spa-0.2/
    - lib/pkgconfig/libpipewire*
    - lib/pkgconfig/libspa*
    # client.conf and the other default configs; libpipewire can't create a
    # context without client.conf.
    - share/pipewire/
    - include/pipewire-0.3/
    - include/spa-0.2/
  pkg_config:
    - libpipewire-0.3
    - libspa-0.2

abi:
  cxx_std: 17

notes:
  - title: "Relocatable plugin, module and config directories"
    description: >-
      libpipewire finds its SPA plugins in <prefix>/lib/spa-0.2, its modules
      in <prefix>/lib/pipewire-0.3 and its default configs (client.conf) in
      <prefix>/share/pipewire, relative to the installed library, so the
      package works wherever cvcpkg unpacks it. SPA_PLUGIN_DIR,
      PIPEWIRE_MODULE_DIR and PIPEWIRE_CONFIG_DIR still override. The
      administrator's overrides are read from the system's /etc/pipewire
      (/usr/local/etc/pipewire on FreeBSD) and ~/.config/pipewire, as for a
      distribution build. Clients talk to the system's PipeWire daemon.
