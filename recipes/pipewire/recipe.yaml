schema_version: 1
recipe:
  name: pipewire
  upstream_version: "1.2.7"
  # Bumped 2 -> 3: added the freebsd build. FreeBSD carries pipewire as a
  # mainline port, and this recipe already builds only the portable core —
  # build.sh disables systemd, logind, selinux, udev, dbus, alsa and v4l2, which
  # is exactly the Linux-specific surface. OpenBSD has no port and NetBSD has
  # only a pkgsrc-wip one, so neither is claimed.
  #
  # Bumped 3 -> 4: no pw-top.  cvc.3's linux bin/pw-top NEEDed
  # libncursesw.so.6 from cvcpkg's ncurses, found in the shared populate
  # prefix and never declared; FreeBSD could do the same.  pipewire has no
  # option for it, so build.sh hands meson a not-found ncursesw dependency.
  # pw-top is a diagnostics TUI; declaring ncurses would add it to every
  # libpipewire consumer's runtime closure (SDL2, SDL3, OpenAL Soft).
  # Also no FreeBSD column: it never built.  meson.build requires epoll-shim
  # (cvcpkg has it) and libinotify (libinotify-kqueue, which cvcpkg does not
  # package) there; cvc.3's FreeBSD jobs stopped at one, then the other (dev
  # jobs 24590, 24623).  Restore the column with both declared once libinotify
  # has a recipe.
  #
  # Bumped 4 -> 5: the FreeBSD column again, now that cvcpkg packages
  # libinotify (recipes/libinotify).  epoll-shim and libinotify are runtime
  # dependencies there: meson.build requires both, and what links them
  # needs them installed beside it.
  cvc_revision: 5
  maintainer: "cvcpkg group"
  maintainer_email: "info@cvcpkg.org"
  maintainer_url: "https://cvcpkg.org"
  homepage: https://pipewire.org/
  license: MIT
  tags: [multimedia]
  description: >-
    PipeWire — a server and user-space API to handle multimedia pipelines
    on Linux (audio/video capture and playback).  Built as a lean core
    (libpipewire-0.3 + SPA) with the heavy optional backends
    (ALSA/JACK/BlueZ/systemd/GStreamer) disabled, providing the
    libpipewire client library Qt Multimedia can target on Linux.

source:
  # Built from the source package pipewire-src, which pins the upstream tarball
  # (https://gitlab.freedesktop.org/pipewire/pipewire/-/archive/1.2.7/pipewire-1.2.7.tar.gz).
  type: package
  package: pipewire-src

patches: []

depends:
  build:
    - name: pipewire-src
      version: "==1.2.7"
    - ninja
    - meson
    - pkg-config
    - name: python3
      platforms: [linux, macos, freebsd, openbsd, netbsd]
    - name: python312
      platforms: [windows]
  runtime:
    # FreeBSD has neither epoll nor inotify, and meson.build requires the shims
    # for both there (dependency('epoll-shim'), dependency('libinotify')).
    - name: epoll-shim
      platforms: [freebsd]
    - name: libinotify
      platforms: [freebsd]
  host_tools: []

build:
  matrix:
    - platform: linux
      script: build.sh
      env:
        CFLAGS: "-O2 -fPIC"
    - platform: freebsd
      script: build.sh
      env:
        CFLAGS: "-O2 -fPIC"

package:
  files:
    - lib/libpipewire-0.3*
    # No lib/libspa-0.2*: SPA is a plugin directory (lib/spa-0.2/), not a library.
    - lib/pipewire-0.3/
    - lib/spa-0.2/
    - lib/pkgconfig/libpipewire*
    - lib/pkgconfig/libspa*
    - include/pipewire-0.3/
    - include/spa-0.2/
  pkg_config:
    - libpipewire-0.3
    - libspa-0.2

abi:
  cxx_std: 17
