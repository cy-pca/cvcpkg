schema_version: 1
recipe:
  name: cython-cp313t
  upstream_version: "3.2.9"
  # Bumped 5 -> 6: matrix linux,macos -> the full native set (adds windows and
  # the three BSDs) so this column covers every platform numpy-cp313t declares.
  # numpy-cp313t is built FROM SOURCE on all of them and imports Cython under
  # python3.13t at build time, so a cython-cp313t that stopped at linux/macos
  # was a phantom closure edge on freebsd/netbsd/openbsd/windows
  # (scripts/validate_all_recipes.py).
  cvc_revision: 6

  maintainer: "cvcpkg group"
  maintainer_email: "info@cvcpkg.org"
  maintainer_url: "https://cvcpkg.org"
  homepage: https://pypi.org/project/cython/
  license: "Apache-2.0"
  tags: [python, source]
  # HAND-MAINTAINED — deliberately NOT carrying the tools/gen_python_recipes.py
  # marker, so a regeneration neither overwrites nor prunes it (the same
  # treatment numpy/h5py/pyyaml/cffi get). The generator gates a column's
  # viability on an UPSTREAM wheel, and cython publishes no free-threaded
  # (cp313-cp313t) wheel at all, so it prunes this column and can never emit it.
  # The column exists only because numpy-cp313t — itself hand-written and built
  # from source — bridges cython-cp313t's lib/python3.13t/site-packages onto its
  # build interpreter's path and imports Cython there; without a cython column
  # for the free-threaded interpreter its from-source build cannot cythonize.
  # The other three cython columns (cp311/cp312/cp313) DO have upstream wheels
  # and stay generated; keep this one's matrix in lockstep with them by hand.
  description: >-
    cython 3.2.9 for CPython 3.13t — the cp313t column of cvcpkg's
    per-interpreter matrix (C extensions compiled for cp313t from the PyPI
    sdist), BUILT FROM SOURCE: cvcpkg fetches and sha256-verifies the PyPI
    sdist, and build.sh compiles the wheel with the prefix's own CPython 3.13t —
    no third-party prebuilt binary enters the bundle.
    The cp313t column installs under the free-threaded (no-GIL)
    interpreter and its import check runs with the GIL disabled.

# From-source sdist (NOT source.type python_wheel): cvcpkg fetches and
# sha256-verifies this tarball and extracts it (strip_components: 1) to
# CVC_SOURCE_DIR; build.sh compiles the wheel there. sha256 as published by
# PyPI for this exact version.
source:
  type: tarball
  url: https://files.pythonhosted.org/packages/f6/de/db48b8870e766cfea809986cc50c1e986c663a9ab7bafd0ac1a2512c4a26/cython-3.2.9.tar.gz
  sha256: "d249c9022ab13286b17bd66f30609e800c5f95efeecb06168990c7a66cecde6c"
  strip_components: 1

python:
  interpreter: python313t
  abi: cp313t

patches: []

depends:
  build:
    - name: python313t
    # PEP-517 build backend, from this sdist's [build-system] requires.
    # --no-build-isolation means pip will NOT fetch it, so it has to be
    # in the build prefix already (build.sh bridges it onto sys.path).
    - name: setuptools-cp313t
    - name: wheel-cp313t
  runtime:
    - name: python313t
  host_tools:
    - python313t

provides:
  - cython

build:
  build_type_independent: true
  # Mirrors numpy-cp313t's matrix — the one consumer of this column — and the
  # generated cython-cp311/cp312/cp313 columns: one build.sh per native
  # platform, build.ps1 on windows. python313t builds on all six (windows via a
  # real --disable-gil PCbuild), and cython's sdist needs only that interpreter
  # plus setuptools/wheel, so every entry is a genuine build.
  matrix:
    - platform: linux
      script: build.sh
    - platform: macos
      script: build.sh
    - platform: windows
      script: build.ps1
    - platform: freebsd
      script: build.sh
    - platform: netbsd
      script: build.sh
    - platform: openbsd
      script: build.sh

package:
  files:
    - lib/python3.13t/site-packages/Cython/
    - lib/python3.13t/site-packages/cython.py
    - lib/python3.13t/site-packages/pyximport/
    - lib/python3.13t/site-packages/cython-*.dist-info/
    - bin/cython
    - bin/cythonize
    - bin/cygdb
    - Lib/site-packages/cython/
    - Lib/site-packages/*.dist-info/
