schema_version: 1
recipe:
  name: python313t
  upstream_version: "3.13.3"
  # Bumped 1 -> 2: package pip under its own t-suffixed name. ensurepip left an
  # UNSUFFIXED bin/pip3.13 in the staged tree (a latent collision with
  # python313's pip3.13, and undeclared in files); _common/build-python.sh now
  # renames it to pip3.13t and it is declared here.
  #
  # Bumped 2 -> 3: +cvc.2 was built on the one glibc 2.39 builder and references
  # GLIBC_2.38, so libpython3.13t.so refuses to load on the 2.35 fleet floor —
  # this is the breakage that motivated #432. Recipe content is unchanged; it
  # needs a rebuild routed to a glibc2.35 builder, which #432 now enforces.
  # (+cvc.1 was deliberately left published as a working fallback and is
  # verified clean at exactly 2.35.)
  # Bumped 3 -> 4: scoped the readline/ncurses dependency edges to the Unix
  # platforms that actually consume them. build-python.sh passes
  # --with-readline=tkinter on every cross target (its own comment: "readline/
  # ncurses not available on wasm/wasi/cosmo") and the Windows build runs
  # PCbuild/build.bat, which links neither. Both were previously unscoped, so
  # this recipe advertised windows/wasm/wasi/cosmo while depending on packages
  # with no build there — claims that could never resolve.
  # Bumped 4 -> 5: scoped the libffi edge away from wasi. libffi's wasm
  # backend builds its call trampolines with EM_JS — it synthesises JavaScript
  # and patches the wasm table at runtime — so it needs an Emscripten JS engine
  # and cannot work on wasip1. CPython upstream ships its own WASI build without
  # _ctypes for the same reason. wasm keeps the dependency.
  # cvc.7 (freethreaded bin-leak fix): a free-threaded make install also ships the
  # NON-suffixed bin/python3.X (the free-threaded interp under the standard name), which
  # SHADOWS the non-t python column in a shared build prefix and made non-t cpX packages
  # mis-install to lib/python3.Xt/site-packages. _common/build-python.sh now strips the
  # standard names from a free-threaded column; rebuild republishes without the leak.
  # cvc.8: rebuild with no Homebrew.  The published macOS x86_64 cvc.6 bundle was built
  # before macOS CI moved Homebrew aside (#182): bin/python3.13t, libpython3.13t.dylib,
  # _dbm, _gdbm and _decimal load gettext's libintl, gdbm and mpdecimal from
  # /usr/local/opt, so it aborts on any Mac without Homebrew.  _common/build-python.sh
  # now also turns those off on macOS explicitly.  Every platform rebuilds.
  # cvc.9: stop shipping python-3.13.pc, python-3.13-embed.pc, python3.pc,
  # python3-embed.pc, libpython3.so, pydoc3/pydoc3.13 and idle3/idle3.13.  In a
  # shared prefix they replaced python313's, and numpy-cp313 compiled against
  # the free-threaded headers (undefined _Py_DecRefShared).
  # cvc.10: republish NetBSD -- its NetBSD cvc.9 bundle (dev registry) was built before
  # _common/build-python.sh stopped baking pkgsrc's -I/usr/pkg/include -L/usr/pkg/lib
  # into sysconfig, which made every C extension built against it prefer pkgsrc's
  # libraries (python312 cvc.16/cvc.17).
  # cvc.11: a Windows build that works (none was ever published).  build.ps1 ran
  # `python ./PCbuild\build.bat ... --experimental-instdir=inst`: a batch file
  # handed to python, with a flag PCbuild does not have.  It is now python313's
  # build, _common/build-python.ps1, with -FreeThreaded (DisableGil, then
  # PC\layout --include-freethreaded), against the cvcpkg
  # openssl/zlib/bzip2/xz/sqlite/libffi deps with nothing downloaded, and no
  # Python to run PCbuild's code generators with (3.13 needs none).
  # package.files declares the Windows tree, and the Unix entries are scoped
  # off windows (the strict pack check would have failed on every one).  Other
  # platforms rebuild unchanged.
  cvc_revision: 11
  maintainer: "cvcpkg group"
  maintainer_email: "info@cvcpkg.org"
  maintainer_url: "https://cvcpkg.org"
  homepage: https://www.python.org/
  license: PSF-2.0
  tags: [language, runtime, scripting]
  description: >-
    CPython 3.13 free-threaded build — the GIL-disabled ("t") variant of
    python313.  Built with --disable-gil; the interpreter is named
    python3.13t (python3.13t.exe on Windows) and the shared library is
    libpython3.13t (python313t.dll on Windows).  Suitable for experiments
    with true multi-core parallelism in Python.
    Supported on Linux, macOS, BSD, and Windows; experimental static builds
    for wasm (Emscripten) and cosmo (APE); wasi is blocked pending WASI
    threads stabilisation.

source:
  # Built from the source package python313-src, which pins the upstream tarball
  # (https://www.python.org/ftp/python/3.13.3/Python-3.13.3.tar.xz).
  type: package
  package: python313-src

patches: []

depends:
  build:
    - name: python313-src
      version: "==3.13.3"
    - name: patchelf
      platforms: [linux, freebsd, openbsd, netbsd]
    - name: openssl
      version: "^3.0"
    - name: zlib
      version: "^1.3"
    - name: libffi
      version: "^3.0"
      platforms: [linux, macos, windows, freebsd, openbsd, netbsd, wasm, cosmo]
    - name: bzip2
      version: "^1.0"
    - name: xz
      version: "^5.0"
    - name: readline
      version: "^8.0"
      platforms: [linux, macos, freebsd, openbsd, netbsd]
    - name: sqlite
      version: "^3.0"
    - name: ncurses
      version: "^6.0"
      platforms: [linux, macos, freebsd, openbsd, netbsd]
  runtime:
    - name: openssl
      version: "^3.0"
    - name: zlib
      version: "^1.3"
    - name: libffi
      version: "^3.0"
      platforms: [linux, macos, windows, freebsd, openbsd, netbsd, wasm, cosmo]
    - name: bzip2
      version: "^1.0"
    - name: xz
      version: "^5.0"
    - name: readline
      version: "^8.0"
      platforms: [linux, macos, freebsd, openbsd, netbsd]
    - name: sqlite
      version: "^3.0"
    - name: ncurses
      version: "^6.0"
      platforms: [linux, macos, freebsd, openbsd, netbsd]
  host_tools: []

build:
  matrix:
    - platform: linux
      script: build.sh
      env:
        CFLAGS: "-O2 -fPIC"
    - platform: macos
      script: build.sh
      env:
        MACOSX_DEPLOYMENT_TARGET: "13.0"
    - platform: freebsd
      script: build.sh
      env:
        CFLAGS: "-O2 -fPIC"
    - platform: openbsd
      script: build.sh
      env:
        CFLAGS: "-O2 -fPIC"
    - platform: netbsd
      script: build.sh
      env:
        CFLAGS: "-O2 -fPIC"
    - platform: wasm
      host_platform: linux
      script: build-wasm.sh
    - platform: wasm
      host_platform: macos
      script: build-wasm.sh
    - platform: wasi
      host_platform: linux
      script: build-wasi.sh
    - platform: windows
      script: build.ps1
    - platform: cosmo
      host_platform: linux
      script: build-cosmo.sh

package:
  files:
    # POSIX layout (autotools `make install`).
    - { glob: "bin/python3.13t*", platforms: [cosmo, freebsd, linux, macos, netbsd, openbsd, wasi, wasm] }
    - { glob: "bin/pip3.13t*", platforms: [cosmo, freebsd, linux, macos, netbsd, openbsd, wasi, wasm] }
    - { glob: "bin/python3t", platforms: [cosmo, freebsd, linux, macos, netbsd, openbsd, wasi, wasm] }
    - { glob: "lib/libpython3.13t*", platforms: [cosmo, freebsd, linux, macos, netbsd, openbsd, wasi, wasm] }
    - { glob: "lib/python3.13t/", platforms: [cosmo, freebsd, linux, macos, netbsd, openbsd, wasi, wasm] }
    - { glob: "lib/pkgconfig/python-3.13t*.pc", platforms: [cosmo, freebsd, linux, macos, netbsd, openbsd, wasi, wasm] }
    - { glob: "include/python3.13t/", platforms: [cosmo, freebsd, linux, macos, netbsd, openbsd, wasi, wasm] }
    # Windows layout (PC\layout --include-freethreaded at the prefix root): the
    # t-suffixed interpreters and DLLs, the stable-ABI forwarder python3t.dll,
    # the stdlib (Lib/), the *.cp313t-win_amd64.pyd modules (DLLs/), and the
    # headers + libs/python313t.lib for embedding.
    - { glob: "python3.13t.exe", platforms: [windows] }
    - { glob: "pythonw3.13t.exe", platforms: [windows] }
    - { glob: "python313t.dll", platforms: [windows] }
    - { glob: "python3t.dll", platforms: [windows] }
    - { glob: "vcruntime140*.dll", platforms: [windows] }
    - { glob: "DLLs/", platforms: [windows] }
    - { glob: "Lib/", platforms: [windows] }
    - { glob: "libs/", platforms: [windows] }
    - { glob: "include/", platforms: [windows] }
  cmake_packages:
    - { name: Python3t, targets: ["Python3t::Python", "Python3t::Interpreter"] }

abi:
  cxx_std: 17

notes:
  - title: "Free-threaded (no-GIL) build"
    platforms: [linux, macos, freebsd, openbsd, netbsd, windows]
    description: >-
      Built with --disable-gil.  The interpreter binary is python3.13t
      (python3.13t.exe on Windows) and the shared library is
      libpython3.13t.so (python313t.dll on Windows).  A python3t
      convenience symlink is also created on Unix.  PGO is enabled on
      Linux and macOS.
  - title: "Separate stdlib from python313"
    platforms: [linux, macos, freebsd, openbsd, netbsd]
    description: >-
      A free-threaded build installs its standard library, lib-dynload and
      site-packages under lib/python3.13t/ (CPython's ABIFLAGS-suffixed
      LIBDIR), not the regular python313's lib/python3.13/, and its extension
      modules carry the t ABI tag (e.g. _ssl.cpython-313t-*.so).  So python313
      and python313t install side by side in one prefix without sharing or
      overwriting each other's files.
  - title: "Windows (PCbuild) build"
    platforms: [windows]
    description: >-
      Built with MSVC through PCbuild with DisableGil (build.bat's
      --disable-gil) against the cvcpkg openssl, zlib, bzip2, xz, sqlite and
      libffi, then staged by PC\layout --include-freethreaded.  The
      interpreter is python3.13t.exe (there is no bare python.exe) and the
      DLL is python313t.dll; extension modules carry the cp313t tag.  No PGO,
      as for python313.
  - title: "WASM (Emscripten) — experimental"
    platforms: [wasm]
    description: >-
      Builds with -matomics -mbulk-memory -pthread to enable Emscripten's
      SharedArrayBuffer-backed pthreads.  The resulting .wasm must be served
      with COOP + COEP HTTP headers for SharedArrayBuffer to be available.
      Multi-threaded behaviour under the Web Worker thread model is
      experimental and may be non-deterministic under heavy concurrency.
  - title: "WASI — expected to fail (no pthreads)"
    platforms: [wasi]
    description: >-
      Standard wasm32-wasip1 (wasi-sdk ≤ 22) has no pthread support.
      CPython configure will abort with "--disable-gil requires threading
      support".  This matrix entry is kept to track upstream progress; it
      will be enabled once the WASI threads proposal stabilises in wasi-sdk
      and CPython's build system gains wasip2 support.
  - title: "Cosmo (APE) — experimental"
    platforms: [cosmo]
    description: >-
      Cosmopolitan libc ships pthreads, so --disable-gil configures and
      builds.  The APE binary runs on Linux, macOS, Windows, and the BSDs.
      The free-threaded runtime has been validated only on Linux/macOS;
      behaviour on the broader Cosmo compatibility matrix (Windows TLS,
      OpenBSD pledge, etc.) is unknown.  C extension modules are unavailable
      (statically linked stdlib only).

conflicts:
  - python313
