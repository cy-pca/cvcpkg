schema_version: 1
recipe:
  name: fonttools-cp313
  upstream_version: "4.63.0"
  # cvc.4 (freethreaded-leak republish): the published cvc.3 any/noarch bundle
  # installs to lib/python3.13t/site-packages -- a python313t (before its cvc.7) shadowed
  # python3.13 when it was built -- so python3.13 cannot import it and cp313 builds that
  # depend on it fail (aiokafka-cp313 on async-timeout-cp313, 2026-10-13).  Rebuilding
  # lays it under lib/python3.13/.  Found by auditing every published cp313 bundle.
  # cvc.5: FONTTOOLS_WITH_CYTHON=0, so the noarch bundle never carries the
  # claiming builder's compiled speedups (fonttools-cp312 4.63.0+cvc.3's had darwin .so files).
  cvc_revision: 5

  maintainer: "cvcpkg group"
  maintainer_email: "info@cvcpkg.org"
  maintainer_url: "https://cvcpkg.org"
  homepage: https://pypi.org/project/fonttools/
  license: "MIT"
  tags: [python, source]
  description: >-
    fonttools 4.63.0 for CPython 3.13 — the cp313 column of
    cvcpkg's per-interpreter matrix (pure-Python, built from the PyPI sdist);
    generated by tools/gen_python_recipes.py.
    Built FROM SOURCE: cvcpkg fetches and sha256-verifies the PyPI sdist,
    and build.sh compiles the wheel with the prefix's own CPython 3.13 —
    no third-party prebuilt binary enters the bundle.

# From-source sdist, sha256 as published by PyPI for this exact version.
source:
  type: tarball
  url: https://files.pythonhosted.org/packages/84/69/c97f2c18e0db87d2c7b15da1974dace76ae938f1cfa22e2727a648b7ed43/fonttools-4.63.0.tar.gz
  sha256: "caeb583deeb5168e694b65cda8b4ee62abedfa66cf88488734466f2366b9c4e0"
  strip_components: 1

python:
  interpreter: python313
  abi: cp313

patches: []

depends:
  build:
    - name: python313
    # PEP-517 build backend, from this sdist's [build-system] requires.
    # --no-build-isolation means pip will NOT fetch it, so it has to be
    # in the build prefix already (build.sh bridges it onto sys.path).
    - name: setuptools-cp313
    - name: wheel-cp313
  runtime:
    - name: python313
  host_tools:
    - python313

build:
  build_type_independent: true
  matrix:
    - platform: any
      script: build.sh
      env:
        FONTTOOLS_WITH_CYTHON: "0"
    - platform: windows
      script: build.ps1
      env:
        FONTTOOLS_WITH_CYTHON: "0"

package:
  files:
    - { glob: "lib/python3.13/site-packages/fontTools/", platforms: [any] }
    - { glob: "lib/python3.13/site-packages/fonttools-*.dist-info/", platforms: [any] }
    - { glob: "Lib/site-packages/fontTools/", platforms: [windows] }
    - { glob: "Lib/site-packages/fonttools-*.dist-info/", platforms: [windows] }
