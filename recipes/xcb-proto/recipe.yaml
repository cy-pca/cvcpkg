schema_version: 1
recipe:
  name: xcb-proto
  upstream_version: "1.17.0"
  # cvc.3: xcbgen installs under lib/python3.11/site-packages, from the declared
  # python311 (build.sh sets PYTHON).  configure's AM_PATH_PYTHON took whatever
  # `python` came first on PATH, so cvc.2's linux bundle carried it under
  # local/lib/python3.10/dist-packages (an Ubuntu builder's system Python), and
  # package.files' lib/ and include/ matched nothing.
  cvc_revision: 3
  maintainer: "cvcpkg group"
  maintainer_email: "info@cvcpkg.org"
  maintainer_url: "https://cvcpkg.org"
  homepage: https://xcb.freedesktop.org/
  license: MIT
  tags: [libraries, x11, graphics]
  description: >-
    XML-XCB protocol descriptions + the xcbgen Python codegen module that libxcb consumes at build time.

source:
  # Built from the source package xcb-proto-src, which pins the upstream tarball
  # (https://xorg.freedesktop.org/releases/individual/xcb/xcb-proto-1.17.0.tar.xz).
  type: package
  package: xcb-proto-src

patches: []

depends:
  build:
    - name: xcb-proto-src
      version: "==1.17.0"
    - pkg-config
    - name: python311
  runtime: []
  host_tools: []

package:
  files:
    # libxcb's code generator, found through xcb-proto.pc's pythondir.
    - lib/python3.11/site-packages/xcbgen/
    - share/xcb/
    - share/pkgconfig/xcb-proto.pc

build:
  matrix:
    - platform: linux
      script: build.sh
    - platform: freebsd
      script: build.sh
    - platform: openbsd
      script: build.sh
    - platform: netbsd
      script: build.sh
