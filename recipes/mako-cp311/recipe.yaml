schema_version: 1
recipe:
  name: mako-cp311
  upstream_version: "1.3.12"
  # cvc.4: republish.  The published noarch cvc.3 bundle's console scripts
  # (mako-render) carry the build machine's interpreter as their shebang (the old
  # libcvc-deps macOS CI prefix), so they cannot run anywhere; packing today
  # rewrites it to /usr/bin/env.
  cvc_revision: 4

  maintainer: "cvcpkg group"
  maintainer_email: "info@cvcpkg.org"
  maintainer_url: "https://cvcpkg.org"
  homepage: https://pypi.org/project/mako/
  license: "MIT"
  tags: [python, source]
  description: >-
    mako 1.3.12 for CPython 3.11 — the cp311 column of
    cvcpkg's per-interpreter matrix (pure-Python, built from the PyPI sdist);
    generated by tools/gen_python_recipes.py.
    Built FROM SOURCE: cvcpkg fetches and sha256-verifies the PyPI sdist,
    and build.sh compiles the wheel with the prefix's own CPython 3.11 —
    no third-party prebuilt binary enters the bundle.

# From-source sdist, sha256 as published by PyPI for this exact version.
source:
  # Built from the source package mako-src, which pins the upstream tarball
  # (https://files.pythonhosted.org/packages/00/62/791b31e69ae182791ec67f04850f2f062716bbd205483d63a215f3e062d3/mako-1.3.12.tar.gz).
  type: package
  package: mako-src

python:
  interpreter: python311
  abi: cp311

patches: []

depends:
  build:
    - name: mako-src
      version: "==1.3.12"
    - name: python311
    - name: markupsafe-cp311
    # PEP-517 build backend, from this sdist's [build-system] requires.
    # --no-build-isolation means pip will NOT fetch it, so it has to be
    # in the build prefix already (build.sh bridges it onto sys.path).
    - name: setuptools-cp311
    - name: wheel-cp311
  runtime:
    - name: python311
    - name: markupsafe-cp311
  host_tools:
    - python311

provides:
  - mako

build:
  build_type_independent: true
  matrix:
    - platform: any
      script: build.sh
    - platform: windows
      script: build.ps1

package:
  files:
    - { glob: "lib/python3.11/site-packages/mako/", platforms: [any] }
    - { glob: "lib/python3.11/site-packages/*.dist-info/", platforms: [any] }
    - { glob: "bin/mako-render", platforms: [any] }
    - { glob: "Lib/site-packages/mako/", platforms: [windows] }
    - { glob: "Lib/site-packages/*.dist-info/", platforms: [windows] }
