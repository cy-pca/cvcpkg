schema_version: 1
recipe:
  name: nginx
  upstream_version: "1.30.5"
  cvc_revision: 1
  maintainer: "cvcpkg group"
  maintainer_email: "info@cvcpkg.org"
  maintainer_url: "https://cvcpkg.org"
  homepage: https://nginx.org/
  license: BSD-2-Clause
  tags: [networking, web, server]
  description: >-
    nginx (stable line) — HTTP/HTTPS server, reverse proxy and load
    balancer, plus TCP/UDP stream and mail proxying.  Built against the
    cvcpkg OpenSSL 3, PCRE2 and zlib with the module set of the official
    nginx.org packages (SSL, HTTP/2, HTTP/3, realip, gzip_static, sub,
    auth_request, stub_status, slice, stream + ssl_preread, mail, ...).
    Ships bin/nginx, etc/nginx/{mime.types, fastcgi/scgi/uwsgi params,
    nginx.conf.sample}, the man page and the default html pages.

source:
  # Built from the source package nginx-src, which pins the upstream tarball
  # (https://nginx.org/download/nginx-1.30.5.tar.gz).
  type: package
  package: nginx-src

patches: []

depends:
  build:
    - name: nginx-src
      version: "==1.30.5"
  runtime:
    - name: openssl
      version: "^3.0"
    - name: pcre2
      version: "^10.40"
    - name: zlib
      version: "^1.3"
  host_tools: []

build:
  matrix:
    - platform: linux
      script: build.sh
      env:
        CFLAGS: "-O2 -fPIC"
    - platform: macos
      script: build.sh
      env:
        MACOSX_DEPLOYMENT_TARGET: "13.0"
    - platform: freebsd
      script: build.sh
      env:
        CFLAGS: "-O2 -fPIC"
    - platform: openbsd
      script: build.sh
      env:
        CFLAGS: "-O2 -fPIC"
    - platform: netbsd
      script: build.sh
      env:
        CFLAGS: "-O2 -fPIC"

package:
  files:
    - bin/nginx
    - etc/nginx/nginx.conf.sample
    - etc/nginx/mime.types
    - etc/nginx/fastcgi_params
    - etc/nginx/fastcgi.conf
    - etc/nginx/scgi_params
    - etc/nginx/uwsgi_params
    - etc/nginx/koi-utf
    - etc/nginx/koi-win
    - etc/nginx/win-utf
    - share/man/man8/nginx.8
    - share/nginx/html/
    - share/licenses/nginx/

test:
  script: test.sh

toolchain:
  cc:
    min_version: "any"
    description: "C99 compiler and make; no autotools or cmake"

notes:
  - title: "Run with -p <dir> -c <conf>"
    platforms: [linux, macos, freebsd, openbsd, netbsd]
    description: >-
      nginx compiles its --prefix in as the default prefix, and for a cvcpkg
      bundle that is a build-machine path.  Every runtime path is configured
      relative (conf etc/nginx/nginx.conf, logs/error.log, logs/access.log,
      logs/nginx.pid, *_temp dirs), so always start, test and signal it with
      an explicit prefix and config:
      `nginx -p /srv/www -c nginx.conf [-t | -s reload|quit]`, where
      /srv/www holds nginx.conf, mime.types (or an `include` with an
      absolute path to <prefix>/etc/nginx/mime.types) and a logs/
      directory.  etc/nginx/nginx.conf.sample documents this.  Running
      bare `nginx` without -p looks for the build path and fails.  cvcpkg
      has no service mechanism; run nginx under your own supervisor with
      -g 'daemon off;'.
  - title: "PCRE JIT depends on the pcre2 package"
    platforms: [linux, macos, freebsd, openbsd, netbsd]
    description: >-
      nginx is configured --with-pcre-jit, but the cvcpkg pcre2 recipe is
      currently built without PCRE2_SUPPORT_JIT, so `pcre_jit on;` logs
      "[warn] PCRE2 library does not support JIT" and regexes run
      interpreted.  It
      becomes active with no nginx rebuild once pcre2 enables JIT.
  - title: "HTTP/3 uses the OpenSSL compatibility layer"
    platforms: [linux, macos, freebsd, openbsd, netbsd]
    description: >-
      The cvcpkg OpenSSL is 3.4, which has no QUIC TLS API, so
      ngx_http_v3_module uses nginx's OpenSSL compatibility layer (no 0-RTT
      early data).  HTTP/1.1 and HTTP/2 over TLS are unaffected.
  - title: "No dynamic modules"
    platforms: [linux, macos, freebsd, openbsd, netbsd]
    description: >-
      Everything is compiled in; no third-party modules (no Lua/OpenResty).
      The binary is built --with-compat and modules-path is lib/nginx/modules,
      so a matching dynamic module can be built against the same version and
      loaded with load_module.
  - title: "Why not native Windows"
    platforms: [linux]
    description: >-
      nginx/Windows is built with MSVC from nginx's own makefiles, which
      compile OpenSSL, PCRE2 and zlib from their SOURCE trees
      (--with-openssl=<src> ...) instead of linking installed libraries, and
      needs MSYS + Strawberry Perl; upstream also documents known
      limitations (only one worker does the work, select/poll only).  That
      does not fit a cvcpkg build.ps1 yet.  nginx.org publishes a signed nginx/Windows zip for each
      release that can be used directly in the meantime.
