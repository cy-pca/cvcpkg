schema_version: 1
recipe:
  name: annotated-types-cp313
  upstream_version: "0.7.0"
  cvc_revision: 3

  maintainer: "cvcpkg group"
  maintainer_email: "info@cvcpkg.org"
  maintainer_url: "https://cvcpkg.org"
  homepage: https://pypi.org/project/annotated-types/
  license: "MIT"
  tags: [python, source]
  description: >-
    annotated-types 0.7.0 for CPython 3.13 — the cp313 column of
    cvcpkg's per-interpreter matrix (pure-Python, built from the PyPI sdist);
    generated by tools/gen_python_recipes.py.
    Built FROM SOURCE: cvcpkg fetches and sha256-verifies the PyPI sdist,
    and build.sh compiles the wheel with the prefix's own CPython 3.13 —
    no third-party prebuilt binary enters the bundle.

# From-source sdist, sha256 as published by PyPI for this exact version.
source:
  # Built from the source package annotated-types-src, which pins the upstream tarball
  # (https://files.pythonhosted.org/packages/ee/67/531ea369ba64dcff5ec9c3402f9f51bf748cec26dde048a2f973a4eea7f5/annotated_types-0.7.0.tar.gz).
  type: package
  package: annotated-types-src

python:
  interpreter: python313
  abi: cp313

patches: []

depends:
  build:
    - name: annotated-types-src
      version: "==0.7.0"
    - name: python313
    # PEP-517 build backend, from this sdist's [build-system] requires.
    # --no-build-isolation means pip will NOT fetch it, so it has to be
    # in the build prefix already (build.sh bridges it onto sys.path).
    - name: hatchling-cp313
    - name: packaging-cp313
    - name: pathspec-cp313
    - name: pluggy-cp313
    - name: trove-classifiers-cp313
    - name: calver-cp313
  runtime:
    - name: python313
  host_tools:
    - python313

build:
  build_type_independent: true
  matrix:
    - platform: any
      script: build.sh
    - platform: windows
      script: build.ps1

package:
  files:
    - { glob: "lib/python3.13/site-packages/annotated_types/", platforms: [any] }
    - { glob: "lib/python3.13/site-packages/*.dist-info/", platforms: [any] }
    - { glob: "Lib/site-packages/annotated_types/", platforms: [windows] }
    - { glob: "Lib/site-packages/*.dist-info/", platforms: [windows] }
