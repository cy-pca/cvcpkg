schema_version: 1
recipe:
  name: gstreamer
  upstream_version: "1.24.13"
  # cvc.3: the libraries gstreamer links on linux are declared runtime deps
  # (see depends.runtime); cvc.2 named only glib.
  cvc_revision: 3
  maintainer: "cvcpkg group"
  maintainer_email: "info@cvcpkg.org"
  maintainer_url: "https://cvcpkg.org"
  homepage: https://gstreamer.freedesktop.org/
  license: LGPL-2.1-or-later
  tags: [multimedia]
  description: >-
    GStreamer — a pipeline-based multimedia framework.  Built from the
    upstream mono-repository as core + gst-plugins-base + gst-plugins-good
    + gst-plugins-bad (LGPL; ugly/libav and all GPL-encumbered plugins
    disabled), providing the gstreamer-1.0 / gstreamer-app / gstreamer-audio /
    gstreamer-video / gstreamer-pbutils / gstreamer-play libraries Qt
    Multimedia's GStreamer backend links against on Linux and macOS.

source:
  # Built from the source package gstreamer-src, which pins the upstream tarball
  # (https://gitlab.freedesktop.org/gstreamer/gstreamer/-/archive/1.24.13/gstreamer-1.24.13.tar.gz).
  type: package
  package: gstreamer-src

patches: []

depends:
  build:
    - name: gstreamer-src
      version: "==1.24.13"
    - name: nasm
      platforms: [linux, freebsd, openbsd, netbsd]
    - ninja
    - meson
    - pkg-config
    - bison
    - flex
    - name: python3
      platforms: [linux, macos, freebsd, openbsd, netbsd]
    - name: python312
      platforms: [windows]
  runtime:
    - name: glib
      version: "^2.80"
    # What the linux build links (NEEDED in the published linux-x86_64 bundle)
    # but cvc.2 never declared, so it worked only where a shared prefix happened
    # to hold them.  Consumers broke without them: gstreamer-allocators-1.0.pc
    # Requires libdrm, so qtmultimedia's configure did not find GStreamer at all
    # ("No media backend found"), and linux/arm64's pack gate reported 901
    # unreachable loader paths.  libxcb comes with libx11.
    - name: libglvnd
      platforms: [linux]
    - name: libx11
      platforms: [linux]
    - name: libxext
      platforms: [linux]
    - name: libxfixes
      platforms: [linux]
    - name: libxi
      platforms: [linux]
    - name: libdrm
      platforms: [linux]
    - name: libpng
      platforms: [linux]
    - name: libxml2
      platforms: [linux]
  host_tools: []

build:
  matrix:
    - platform: linux
      script: build.sh
      env:
        CFLAGS: "-O2 -fPIC"
    - platform: macos
      script: build.sh
      env:
        MACOSX_DEPLOYMENT_TARGET: "13.0"
    - platform: freebsd
      script: build.sh
      env:
        CFLAGS: "-O2 -fPIC"
    - platform: openbsd
      script: build.sh
      env:
        CFLAGS: "-O2 -fPIC"
    - platform: netbsd
      script: build.sh
      env:
        CFLAGS: "-O2 -fPIC"
    - platform: windows
      script: build.ps1

package:
  files:
    # MSVC names the import libraries gstreamer-1.0.lib, gstbase-1.0.lib, ...,
    # so lib/libgst* is the Unix spelling only.
    - { glob: "lib/libgst*", platforms: [linux, macos, freebsd, openbsd, netbsd] }
    - lib/gst*.lib
    - lib/gstreamer-1.0/
    - lib/pkgconfig/gstreamer*
    - include/gstreamer-1.0/
    - bin/gst-inspect*
    - bin/gst-launch*
    - bin/gst-discoverer*
  pkg_config:
    - gstreamer-1.0
    - gstreamer-base-1.0
    - gstreamer-app-1.0
    - gstreamer-audio-1.0
    - gstreamer-video-1.0
    - gstreamer-pbutils-1.0
    - gstreamer-allocators-1.0
    - gstreamer-play-1.0

abi:
  cxx_std: 17
