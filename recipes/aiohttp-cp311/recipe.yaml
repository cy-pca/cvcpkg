schema_version: 1
recipe:
  name: aiohttp-cp311
  upstream_version: "3.14.1"
  cvc_revision: 1

  maintainer: "cvcpkg group"
  maintainer_email: "info@cvcpkg.org"
  maintainer_url: "https://cvcpkg.org"
  homepage: https://pypi.org/project/aiohttp/
  license: "Apache-2.0 AND MIT"
  tags: [python, source]
  description: >-
    aiohttp 3.14.1 for CPython 3.11 — the cp311 column of
    cvcpkg's per-interpreter matrix (C extensions compiled for cp311 from the PyPI sdist);
    generated by tools/gen_python_recipes.py.
    Built FROM SOURCE: cvcpkg fetches and sha256-verifies the PyPI sdist,
    and build.sh compiles the wheel with the prefix's own CPython 3.11 —
    no third-party prebuilt binary enters the bundle.

# From-source sdist, sha256 as published by PyPI for this exact version.
source:
  type: tarball
  url: https://files.pythonhosted.org/packages/82/78/8ea7308cac6934de8c74a14f3d5f65d1c89287426688be79538d0e5c013d/aiohttp-3.14.1.tar.gz
  sha256: "307f2cff90a764d329e77040603fa032db89c5c24fdad50c4c15334cba744035"
  strip_components: 1

python:
  interpreter: python311
  abi: cp311

patches: []

depends:
  build:
    - name: python311
    - name: aiohappyeyeballs-cp311
    - name: aiosignal-cp311
    - name: attrs-cp311
    - name: frozenlist-cp311
    - name: multidict-cp311
    - name: propcache-cp311
    - name: typing-extensions-cp311
    - name: yarl-cp311
    # PEP-517 build backend, from this sdist's [build-system] requires.
    # --no-build-isolation means pip will NOT fetch it, so it has to be
    # in the build prefix already (build.sh bridges it onto sys.path).
    - name: pkgconfig-cp311
    - name: setuptools-cp311
  runtime:
    - name: python311
    - name: aiohappyeyeballs-cp311
    - name: aiosignal-cp311
    - name: attrs-cp311
    - name: frozenlist-cp311
    - name: multidict-cp311
    - name: propcache-cp311
    - name: typing-extensions-cp311
    - name: yarl-cp311
  host_tools:
    - python311

build:
  build_type_independent: true
  matrix:
    - platform: linux
      script: build.sh
    - platform: macos
      script: build.sh
    - platform: windows
      script: build.ps1

package:
  files:
    - { glob: "lib/python3.11/site-packages/aiohttp/", platforms: [linux, macos] }
    - { glob: "lib/python3.11/site-packages/*.dist-info/", platforms: [linux, macos] }
    - { glob: "Lib/site-packages/aiohttp/", platforms: [windows] }
    - { glob: "Lib/site-packages/*.dist-info/", platforms: [windows] }
