schema_version: 1
recipe:
  name: python312
  upstream_version: "3.12.10"
  # Bumped 1 -> 2: extension-module RPATH fix (shared _common/build-python.sh) so
  # lib-dynload/*.so (incl. _ssl/_hashlib) find the prefix lib/ instead of the
  # system libs — a standalone interpreter's `import ssl` was failing. ABI-identical.
  # Bumped 2 -> 3: rebuild on the glibc-2.35 fleet.  The +cvc.2 artifact was
  # published from a manual off-fleet build (glibc 2.38) and would not run on the
  # fleet builders or on users with glibc < 2.38 (every python build failed at
  # `import` with "GLIBC_2.38 not found").  Content-identical to +cvc.2; only the
  # build host's glibc baseline differs.
  # Bumped 3 -> 4: scoped the readline/ncurses dependency edges to the Unix
  # platforms that actually consume them. build-python.sh passes
  # --with-readline=tkinter on every cross target (its own comment: "readline/
  # ncurses not available on wasm/wasi/cosmo") and the Windows build runs
  # PCbuild/build.bat, which links neither. Both were previously unscoped, so
  # this recipe advertised windows/wasm/wasi/cosmo while depending on packages
  # with no build there — claims that could never resolve.
  # Bumped 4 -> 5: scoped the libffi edge away from wasi. libffi's wasm
  # backend builds its call trampolines with EM_JS — it synthesises JavaScript
  # and patches the wasm table at runtime — so it needs an Emscripten JS engine
  # and cannot work on wasip1. CPython upstream ships its own WASI build without
  # _ctypes for the same reason. wasm keeps the dependency.
  # Bumped 5 -> 6: package the Windows layout. The recipe advertised a windows
  # build (PCbuild/build.bat via build.ps1) but package.files listed only POSIX
  # paths, so the windows build packaged ZERO files — `cvcpkg install python312
  # --platform windows` succeeded while installing nothing, and every cpXX
  # consumer then died with "could not find python (3.12) in the dependency
  # closure". Same class as the yaml-cpp windows gap: the build worked, the
  # packaging never did, and no test covers a windows package manifest.
  #
  # Bumped 6 -> 7: ship cvcpkg-dll-directories.pth. Windows has no RPATH and
  # Python 3.8+ stopped searching PATH for an extension module's DLL
  # dependencies, so every extension linking a prefix library (pillow ->
  # zlib1/jpeg62/tiff, numpy -> openblas, h5py -> hdf5) failed to import with
  # "DLL load failed". The .pth calls os.add_dll_directory(<prefix>\bin) at
  # startup — the Windows counterpart of the $ORIGIN RUNPATH the POSIX builds
  # patch in, derived from sys.prefix so the tree stays relocatable.
  #
  # Bumped 8 -> 9 (wasm only): disable the _decimal module on wasm. The cvc.8
  # wasm libpython3.12.a carried undefined mpd_* symbols (bundled libmpdec was
  # never archived), which broke any final wasm app embedding it. cvc.9 wasm is
  # self-contained; other platforms rebuild byte-identically. Yank cvc.8 wasm.
  # cvc.10: wasm-mt gains _ssl/_hashlib (TLS) against a thread-safe wasm-mt OpenSSL.
  # cvc.11: emscripten (wasm + wasm-mt) folds CPython's bundled HACL crypto objects
  # into the static libpython so the built-in hash modules are self-contained — an
  # app statically embedding libpython (the pycvc_gl wasm host) links with no
  # undefined python_hashlib_Hacl_* symbols. Per-platform revisioning: only the
  # rebuilt wasm/wasm-mt variants advance; other platforms keep their revision.
  # cvc.12/13 (linux): the published +cvc.11 (and the first +cvc.12 rebuild) linux
  # artifacts shipped WITHOUT pip — bin/python3.12 present, but no bin/pip3.12 and no
  # lib/python3.12/site-packages/pip, so `python3.12 -m pip` failed with "No module
  # named pip" and broke every grl-snam-cp312 CI closure (the dev-tool install step).
  # Root cause (found in the build log): the install-time ensurepip
  # (--with-ensurepip=upgrade) runs `./python -E -m ensurepip`; -E ignores PYTHON* env
  # but NOT the user site, so on a builder whose account has a ~/.local pip, ensurepip
  # reports "Requirement already satisfied" and installs NOTHING into the package.
  # cvc.12 added a post-rpath re-bootstrap but probed with a bare `import pip`, which
  # ALSO resolved the builder's ~/.local pip and skipped. cvc.13: _common/build-python.sh
  # now runs (and probes) ensurepip ISOLATED from the user site (-s + PYTHONNOUSERSITE),
  # so pip installs into the package's own site-packages. Rebuild restores pip.
  # cvc.14: rebuild with no Homebrew.  The published macOS x86_64 cvc.8 bundle was built
  # before macOS CI moved Homebrew aside (#182): bin/python3.12, libpython3.12.dylib,
  # _dbm and _gdbm load gettext's libintl and gdbm from /usr/local/opt, so it aborts on
  # any Mac without Homebrew.  _common/build-python.sh now also turns those off on macOS
  # explicitly.  Every platform rebuilds.
  # windows (2026-10-14, same revision: no windows bundle existed at any): the
  # libffi edge is scoped off windows as python311's is (CPython fetches its own
  # via get_externals), and build.ps1 takes python311's lean-PATH + vcvars64 steps
  # and --no-tkinter; PC/layout gets --preset-default (venv, ensurepip) as in
  # python311. Other platforms are unchanged.
  # cvc.15: republish NetBSD.  Its cvc.13 and cvc.14 bundles (dev registry) were
  # packed by a cvcpkg whose library pass prepended $ORIGIN to lib-dynload's
  # extension RPATHs with patchelf, which grows them a third PT_LOAD -- NetBSD's
  # ld.elf_so then refuses them ("math.cpython-312.so: wrong number of segments
  # (3 != 2)").  cvcpkg 2.5.1 never patchelfs a NetBSD RPATH (#303), and a rebuild
  # there loads.  Both rows are yanked, and a yanked variant cannot be published
  # again under the same version, hence the bump.  Other platforms rebuild
  # unchanged.
  # cvc.16: NetBSD's sysconfig no longer carries pkgsrc's -I/usr/pkg/include
  # -L/usr/pkg/lib -Wl,-R/usr/pkg/lib (_common/build-python.sh).  setuptools puts
  # those first on every C extension's line, so cvc.15's NetBSD interpreter made
  # cffi-cp312 link pkgsrc's libffi.so.8 and pyyaml-cp312 lose libyaml; cvc.15's
  # NetBSD bundle is on the dev registry and cannot be replaced in place.
  # cvc.17: NetBSD again.  Dropping -R/usr/pkg/lib also dropped the room the
  # RPATH post-fixup rewrote into: cvc.16's lib-dynload modules came out of
  # patchelf one byte longer, with a third PT_LOAD ld.elf_so refuses ("math.
  # cpython-312.so: wrong number of segments (3 != 2)").  build-python.sh now
  # reserves that room in LDFLAGS_NODIST, which stays out of sysconfig.
  # cvc.18: Windows builds from cvcpkg's libraries and downloads nothing.
  # PCbuild\build.bat -e ran CPython's get_externals.bat, which fetched bzip2,
  # sqlite, xz and zlib sources and a PREBUILT libffi and OpenSSL from GitHub
  # mid-build, while the openssl/zlib/bzip2/xz/sqlite deps declared here went
  # unused.  _common/build-python.ps1 (shared by python311/312/313/313t) runs
  # pcbuild.proj directly against the deps, libffi included (its edge now
  # covers windows), and ships the DLLs the modules import in DLLs\.  The
  # Python PCbuild runs deepfreeze.py and its other code generators with is
  # cvcpkg's python313 (a Windows build edge), not the host's.  Other
  # platforms rebuild unchanged.
  # cvc.19: Windows LICENSE.txt carries the bzip2, libffi and OpenSSL license
  # texts again, as python.org's does: DLLs\ ships those libraries, and PCbuild
  # reads the texts from its externals\ tree, so cvc.18 warned "License file
  # ... is missing" and left them out.  _common/python-externals.targets takes
  # them from the deps' share/licenses/ (bzip2 cvc.7, libffi cvc.7, openssl
  # cvc.10).  Other platforms rebuild unchanged.
  # cvc.20: relocatable pkg-config files.  python-3.12.pc,
  # python-3.12-embed.pc, python3.pc and python3-embed.pc carried prefix= the
  # builder's deleted temp install dir, so in a `cvcpkg install` prefix
  # `pkg-config --cflags python-3.12` gave a dead -I.  _common/build-python.sh
  # now runs cvc_rewrite_install_paths, which sets prefix=${pcfiledir}/../..
  # as in every other recipe's .pc.  Windows ships no .pc and rebuilds
  # unchanged.
  cvc_revision: 20
  maintainer: "cvcpkg group"
  maintainer_email: "info@cvcpkg.org"
  maintainer_url: "https://cvcpkg.org"
  homepage: https://www.python.org/
  license: PSF-2.0
  tags: [language, runtime, scripting]
  description: >-
    CPython 3.12 — the reference Python implementation.  Ships libpython3.12,
    the python3.12 interpreter, and the full standard library including ssl,
    sqlite3, ctypes, bz2, lzma, readline, and curses modules.
    Active-support branch; the recommended default for new projects in 2024-25.

source:
  # Built from the source package python312-src, which pins the upstream tarball
  # (https://www.python.org/ftp/python/3.12.10/Python-3.12.10.tar.xz).
  type: package
  package: python312-src

patches: []

depends:
  build:
    - name: python312-src
      version: "==3.12.10"
    # The Python PCbuild runs deepfreeze.py and its other code generators with
    # (_common/build-python.ps1).  python313 builds with none.
    - name: python313
      version: "^3.13"
      platforms: [windows]
    - name: patchelf
      platforms: [linux, freebsd, openbsd, netbsd]
    - name: openssl
      version: "^3.0"
      # openssl is unused on emscripten (build-python.sh skips --with-openssl and
      # the config.site disables _ssl/_hashlib), and there is no wasm-mt openssl
      # bundle. Scope it to every python platform EXCEPT wasm-mt so the wasm-mt DAG
      # resolves without an unused openssl build. (Plain wasm keeps it: it exists.)
      platforms: [linux, macos, windows, freebsd, openbsd, netbsd, wasm, wasm-mt, wasi, cosmo]
    - name: zlib
      version: "^1.3"
    - name: libffi
      version: "^3.0"
      platforms: [linux, macos, windows, freebsd, openbsd, netbsd, wasm, wasm-mt, cosmo]
    - name: bzip2
      version: "^1.0"
    - name: xz
      version: "^5.0"
    - name: readline
      version: "^8.0"
      platforms: [linux, macos, freebsd, openbsd, netbsd]
    - name: sqlite
      version: "^3.0"
    - name: ncurses
      version: "^6.0"
      platforms: [linux, macos, freebsd, openbsd, netbsd]
  runtime:
    - name: openssl
      version: "^3.0"
      # openssl is unused on emscripten (build-python.sh skips --with-openssl and
      # the config.site disables _ssl/_hashlib), and there is no wasm-mt openssl
      # bundle. Scope it to every python platform EXCEPT wasm-mt so the wasm-mt DAG
      # resolves without an unused openssl build. (Plain wasm keeps it: it exists.)
      platforms: [linux, macos, windows, freebsd, openbsd, netbsd, wasm, wasm-mt, wasi, cosmo]
    - name: zlib
      version: "^1.3"
    - name: libffi
      version: "^3.0"
      platforms: [linux, macos, windows, freebsd, openbsd, netbsd, wasm, wasm-mt, cosmo]
    - name: bzip2
      version: "^1.0"
    - name: xz
      version: "^5.0"
    - name: readline
      version: "^8.0"
      platforms: [linux, macos, freebsd, openbsd, netbsd]
    - name: sqlite
      version: "^3.0"
    - name: ncurses
      version: "^6.0"
      platforms: [linux, macos, freebsd, openbsd, netbsd]
  host_tools: []

build:
  matrix:
    - platform: linux
      script: build.sh
      env:
        CFLAGS: "-O2 -fPIC"
    - platform: macos
      script: build.sh
      env:
        MACOSX_DEPLOYMENT_TARGET: "13.0"
    - platform: freebsd
      script: build.sh
      env:
        CFLAGS: "-O2 -fPIC"
    - platform: openbsd
      script: build.sh
      env:
        CFLAGS: "-O2 -fPIC"
    - platform: netbsd
      script: build.sh
      env:
        CFLAGS: "-O2 -fPIC"
    - platform: windows
      script: build.ps1
    - platform: wasm
      host_platform: linux
      script: build-wasm.sh
      env:
        CFLAGS: "-O2"
    - platform: wasm
      host_platform: macos
      script: build-wasm.sh
      env:
        MACOSX_DEPLOYMENT_TARGET: "13.0"
    # Threaded (-pthread / SharedArrayBuffer) CPython for the wasm-mt closure
    # (libcvc/cvcGL + a wasm-mt vtk/vtk-python/numpy chain). Same build-wasm.sh:
    # env-wasm.sh prepends -pthread to C/CXX/LDFLAGS on the CVC_WASM_THREADS hook,
    # and build-python.sh routes wasm-mt down the identical emscripten path (cross
    # host wasm32-emscripten, emconfigure/emmake, native build-python + config.site)
    # via its IS_EMSCRIPTEN gate. Emscripten forbids mixing -pthread and non-pthread
    # objects, so this static libpython3.12.a is what a -pthread consumer must link.
    - platform: wasm-mt
      host_platform: linux
      script: build-wasm.sh
      env:
        CFLAGS: "-O2"
        CVC_WASM_THREADS: "1"
    - platform: wasi
      host_platform: linux
      script: build-wasi.sh
      env:
        CFLAGS: "-O2"
    - platform: cosmo
      host_platform: linux
      script: build-cosmo.sh
      env:
        CFLAGS: "-O2"

package:
  files:
    # POSIX layout (autotools `make install`).
    - { glob: "bin/python3.12*", platforms: [cosmo, freebsd, linux, macos, netbsd, openbsd, wasi, wasm, wasm-mt] }
    - { glob: "bin/pip3.12*", platforms: [cosmo, freebsd, linux, macos, netbsd, openbsd, wasi, wasm, wasm-mt] }
    - { glob: "bin/idle3.12*", platforms: [cosmo, freebsd, linux, macos, netbsd, openbsd, wasi, wasm, wasm-mt] }
    - { glob: "bin/pydoc3.12*", platforms: [cosmo, freebsd, linux, macos, netbsd, openbsd, wasi, wasm, wasm-mt] }
    - { glob: "lib/libpython3.12*", platforms: [cosmo, freebsd, linux, macos, netbsd, openbsd, wasi, wasm, wasm-mt] }
    - { glob: "lib/python3.12/", platforms: [cosmo, freebsd, linux, macos, netbsd, openbsd, wasi, wasm, wasm-mt] }
    - { glob: "lib/pkgconfig/python-3.12*.pc", platforms: [cosmo, freebsd, linux, macos, netbsd, openbsd, wasi, wasm, wasm-mt] }
    - { glob: "include/python3.12/", platforms: [cosmo, freebsd, linux, macos, netbsd, openbsd, wasi, wasm, wasm-mt] }
    # Windows layout (PCbuild). CPython on Windows installs a flat tree — the
    # interpreter, the DLL and the MSVC runtime at the ROOT, headers directly
    # under include/ (no python3.12/ level), the stdlib in Lib/, extension
    # modules in DLLs/ and import libs in libs/. None of the POSIX globs above
    # match any of it, so without these the windows build packaged ZERO files
    # and `cvcpkg install python312` reported success with 0 components.
    - { glob: "python.exe", platforms: [windows] }
    - { glob: "pythonw.exe", platforms: [windows] }
    - { glob: "python312.dll", platforms: [windows] }
    # The limited-API forwarder, staged by PC\layout --include-stable. Every
    # abi3 extension module names python3.dll in its import table, so without
    # this the prefix cannot load a single stable-ABI wheel.
    - { glob: "python3.dll", platforms: [windows] }
    - { glob: "vcruntime140*.dll", platforms: [windows] }
    - { glob: "DLLs/", platforms: [windows] }
    - { glob: "Lib/", platforms: [windows] }
    - { glob: "libs/", platforms: [windows] }
    - { glob: "include/", platforms: [windows] }
    - { glob: "LICENSE.txt", platforms: [windows] }
  cmake_packages:
    - { name: Python3, targets: ["Python3::Python", "Python3::Interpreter"] }

abi:
  cxx_std: 17

notes:
  - title: "Multiple Python versions coexist"
    platforms:
      [linux, macos, freebsd, openbsd, netbsd, windows, wasm, wasi, cosmo]
    description: >-
      python311, python312, and python313 install to versioned paths
      (bin/python3.12, lib/python3.12/, libpython3.12.so) and can be
      installed into the same prefix simultaneously without conflict.
  - title: "Static builds on wasm/wasi/cosmo"
    platforms: [wasm, wasi, cosmo]
    description: >-
      Cross-compilation targets build libpython as a static archive
      (--disable-shared) since extension modules (.so) are uncommon.
      Readline is disabled (--with-readline=tkinter) because the
      ncurses/readline ecosystem is not available on these platforms.
