  upstream_version: "1.23.1"
  cvc_revision: 1
  maintainer: cvcpkg group
  maintainer_email: info@cvcpkg.org
  maintainer_url: https://cvcpkg.org
  homepage: https://wayland.freedesktop.org/
  license: MIT
  tags: [source]
  description: >-
    The unmodified upstream source of wayland 1.23.1: its release tarball,
    verified against the sha256 below and staged at src/wayland-src/.  The wayland
    recipe builds from it (source.type package), so the tarball is fetched
    once, from gitlab.freedesktop.org, and every other build of wayland -- another
