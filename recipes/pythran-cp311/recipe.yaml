schema_version: 1
recipe:
  name: pythran-cp311
  upstream_version: "0.18.1"
  cvc_revision: 3

  maintainer: "cvcpkg group"
  maintainer_email: "info@cvcpkg.org"
  maintainer_url: "https://cvcpkg.org"
  homepage: https://pypi.org/project/pythran/
  license: "BSD-3-Clause"
  tags: [python, source]
  description: >-
    pythran 0.18.1 for CPython 3.11 — the cp311 column of
    cvcpkg's per-interpreter matrix (pure-Python, built from the PyPI sdist);
    generated by tools/gen_python_recipes.py.
    Built FROM SOURCE: cvcpkg fetches and sha256-verifies the PyPI sdist,
    and build.sh compiles the wheel with the prefix's own CPython 3.11 —
    no third-party prebuilt binary enters the bundle.

# From-source sdist, sha256 as published by PyPI for this exact version.
source:
  # Built from the source package pythran-src, which pins the upstream tarball
  # (https://files.pythonhosted.org/packages/d4/84/17c4c44a24f5ec709991e603e601bf316d09c4fe915fbe348c689dede998/pythran-0.18.1.tar.gz).
  type: package
  package: pythran-src

python:
  interpreter: python311
  abi: cp311

patches: []

depends:
  build:
    - name: pythran-src
      version: "==0.18.1"
    - name: python311
    - name: beniget-cp311
    - name: gast-cp311
    - name: numpy-cp311
    - name: ply-cp311
    - name: setuptools-cp311
    # PEP-517 build backend, from this sdist's [build-system] requires.
    # --no-build-isolation means pip will NOT fetch it, so it has to be
    # in the build prefix already (build.sh bridges it onto sys.path).
  runtime:
    - name: python311
    - name: beniget-cp311
    - name: gast-cp311
    - name: numpy-cp311
    - name: ply-cp311
    - name: setuptools-cp311
  host_tools:
    - python311

build:
  build_type_independent: true
  matrix:
    - platform: any
      script: build.sh
    - platform: windows
      script: build.ps1

package:
  files:
    - { glob: "lib/python3.11/site-packages/pythran/", platforms: [any] }
    - { glob: "lib/python3.11/site-packages/omp/", platforms: [any] }
    - { glob: "lib/python3.11/site-packages/pythran-*.dist-info/", platforms: [any] }
    - { glob: "Lib/site-packages/pythran/", platforms: [windows] }
    - { glob: "Lib/site-packages/*.dist-info/", platforms: [windows] }
