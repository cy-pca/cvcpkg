schema_version: 1
recipe:
  name: charset-normalizer-cp313
  upstream_version: "3.4.9"
  # cvc.4 (debug-twin republish): the cvc.3 release bundle is fine, but its
  # same-version debug bundle installs to lib/python3.13t, and builders before #217
  # could install that debug row for a release job (hatchling-cp313 failed on
  # trove-classifiers-cp313 this way, 2026-10-13).  A newer release revision wins
  # outright.
  cvc_revision: 4

  maintainer: "cvcpkg group"
  maintainer_email: "info@cvcpkg.org"
  maintainer_url: "https://cvcpkg.org"
  homepage: https://pypi.org/project/charset-normalizer/
  license: "MIT"
  tags: [python, source]
  description: >-
    charset-normalizer 3.4.9 for CPython 3.13 — the cp313 column of
    cvcpkg's per-interpreter matrix (pure-Python, built from the PyPI sdist);
    generated by tools/gen_python_recipes.py.
    Built FROM SOURCE: cvcpkg fetches and sha256-verifies the PyPI sdist,
    and build.sh compiles the wheel with the prefix's own CPython 3.13 —
    no third-party prebuilt binary enters the bundle.

# From-source sdist, sha256 as published by PyPI for this exact version.
source:
  type: tarball
  url: https://files.pythonhosted.org/packages/bd/2a/23f34ec9d04624958e137efdc394888716353190e75f25dd22c7a2c7a8aa/charset_normalizer-3.4.9.tar.gz
  sha256: "673611bbd43f0810bec0b0f028ddeaaa501190339cac411f347ac76917c3ae7b"
  strip_components: 1

python:
  interpreter: python313
  abi: cp313

patches: []

depends:
  build:
    - name: python313
    # PEP-517 build backend, from this sdist's [build-system] requires.
    # --no-build-isolation means pip will NOT fetch it, so it has to be
    # in the build prefix already (build.sh bridges it onto sys.path).
    - name: setuptools-cp313
  runtime:
    - name: python313
  host_tools:
    - python313

provides:
  - charset-normalizer

build:
  build_type_independent: true
  matrix:
    - platform: any
      script: build.sh
    - platform: windows
      script: build.ps1

package:
  files:
    - { glob: "lib/python3.13/site-packages/charset_normalizer/", platforms: [any] }
    - { glob: "lib/python3.13/site-packages/*.dist-info/", platforms: [any] }
    - { glob: "bin/normalizer", platforms: [any] }
    - { glob: "Lib/site-packages/charset_normalizer/", platforms: [windows] }
    - { glob: "Lib/site-packages/*.dist-info/", platforms: [windows] }
