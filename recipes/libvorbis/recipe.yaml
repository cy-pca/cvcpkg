schema_version: 1
recipe:
  name: libvorbis
  upstream_version: "1.3.7"
  # Added wasm/wasi/cosmo entries.  The codec is portable floating-point DSP —
  # MDCT, codebooks, psychoacoustics — with no threads, sockets or assembly and
  # no runtime CPU dispatch to disable; the only platform call is
  # libvorbisfile's ov_open(FILE *), and all three targets have stdio (consumers
  # that want to avoid it entirely already have ov_open_callbacks).  This became
  # legal only once libogg gained the same three targets in its cvc.2 — the
  # closure check rejects a target the runtime dependency cannot build for.
  # cvc.3: Windows builds with MSYS path conversion on.  MSYS_NO_PATHCONV=1 made
  # libtool's `cmd //c echo` start an interactive cmd.exe that hung every libtool
  # link on the dev Windows builder (see build.ps1).  Other platforms unchanged.
  # cvc.4: Unix bundles ship no libtool .la, and libvorbisfile/libvorbisenc link
  # libm themselves (see build.sh).
  # cvc.5: Windows bundles ship no libtool .la either (see build.ps1).
  # cvc.6: Windows declares its MinGW toolchain (msys2/make/mingw-w64-gcc)
  # instead of using the builder's; see depends.build.
  cvc_revision: 6
  maintainer: "cvcpkg group"
  maintainer_email: "info@cvcpkg.org"
  maintainer_url: "https://cvcpkg.org"
  homepage: https://www.xiph.org/vorbis/
  license: BSD-3-Clause
  tags: [libraries, multimedia, audio, wasm, wasi]
  description: >-
    libvorbis — the Ogg Vorbis audio compression library.  Provides
    Vorbis encoding and decoding for FFmpeg (--enable-libvorbis).
    Depends on libogg.

source:
  type: tarball
  url: https://ftp.osuosl.org/pub/xiph/releases/vorbis/libvorbis-1.3.7.tar.gz
  sha256: "0e982409a9c3fc82ee06e08205b1355e5c6aa4c36bca58146ef399621b0ce5ab"
  strip_components: 1

patches: []

depends:
  build:
    # Windows: the MinGW toolchain is a declared build dep, staged into the BUILD
    # prefix (build.ps1 puts its bin first on PATH), not whatever MSYS2 the
    # builder has.  The prod builder cmps-a91453 has an incomplete one: lame
    # and libmp3lame died there with "configure: error: no acceptable ld found
    # in $PATH" while they built on sandipaws.  As recipes/gmp.
    - name: msys2
      platforms: [windows]
    - name: make
      platforms: [windows]
    - name: mingw-w64-gcc
      platforms: [windows]
    - name: libogg
    - pkg-config
  runtime:
    - name: libogg
  host_tools: []

build:
  matrix:
    - platform: linux
      script: build.sh
      env:
        CFLAGS: "-O2 -fPIC"
    - platform: macos
      script: build.sh
      env:
        MACOSX_DEPLOYMENT_TARGET: "13.0"
    - platform: freebsd
      script: build.sh
      env:
        CFLAGS: "-O2 -fPIC"
    - platform: openbsd
      script: build.sh
      env:
        CFLAGS: "-O2 -fPIC"
    - platform: netbsd
      script: build.sh
      env:
        CFLAGS: "-O2 -fPIC"
    - platform: windows
      script: build.ps1
    - platform: wasm
      host_platform: linux
      script: build-wasm.sh
    - platform: wasi
      host_platform: linux
      script: build-wasi.sh
    - platform: cosmo
      host_platform: linux
      script: build-cosmo.sh

package:
  files:
    - lib/libvorbis*
    - lib/pkgconfig/vorbis*.pc
    - include/vorbis/
    - bin/libvorbis-*.dll
    - bin/libvorbisenc-*.dll
    - bin/libvorbisfile-*.dll
  pkg_config:
    - vorbis
    - vorbisenc
    - vorbisfile
