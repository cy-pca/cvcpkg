schema_version: 1
recipe:
  name: ffmpeg-src
  upstream_version: "7.1.2"
  cvc_revision: 1
  maintainer: cvcpkg group
  maintainer_email: info@cvcpkg.org
  maintainer_url: https://cvcpkg.org
  homepage: https://ffmpeg.org/
  license: GPL-2.0-or-later AND LGPL-2.1-or-later
  tags: [source]
  description: >-
    The unmodified upstream source of ffmpeg 7.1.2: its release tarball,
    verified against the sha256 below and staged at src/ffmpeg-src/.  The
    ffmpeg, ffmpeg-cli and ffmpeg-lgpl recipes build from it (source.type
    package), so the tarball is fetched once, from ffmpeg.org, and every other
    build of them -- another platform, a builder that cannot reach ffmpeg.org, a
    user building from source -- installs this package from the catalog instead.
    Generated by tools/make_source_package.py.

source:
  type: tarball
  url: https://ffmpeg.org/releases/ffmpeg-7.1.2.tar.xz
  sha256: "089bc60fb59d6aecc5d994ff530fd0dcb3ee39aa55867849a2bbc4e555f9c304"
  strip_components: 1

patches: []

depends:
  build: []
  runtime: []
  host_tools: []

build:
  build_type_independent: true
  matrix:
    - platform: any
      script: build.sh

package:
  files:
    - src/ffmpeg-src/
