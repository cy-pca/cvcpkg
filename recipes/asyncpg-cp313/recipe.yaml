schema_version: 1
recipe:
  name: asyncpg-cp313
  upstream_version: "0.31.0"
  # cvc.4 (macOS republish): the published cvc.3 macOS bundle(s) install to
  # lib/python3.13t/site-packages -- a python313t (before its cvc.7) shadowed
  # python3.13 on the macOS runner -- so python3.13 cannot import them.  The
  # linux/x86_64 bundle of cvc.3 is fine; this revision is for macOS.
  cvc_revision: 4

  maintainer: "cvcpkg group"
  maintainer_email: "info@cvcpkg.org"
  maintainer_url: "https://cvcpkg.org"
  homepage: https://pypi.org/project/asyncpg/
  license: "Apache-2.0"
  tags: [python, source]
  description: >-
    asyncpg 0.31.0 for CPython 3.13 — the cp313 column of
    cvcpkg's per-interpreter matrix (C extensions compiled for cp313 from the PyPI sdist);
    generated by tools/gen_python_recipes.py.
    Built FROM SOURCE: cvcpkg fetches and sha256-verifies the PyPI sdist,
    and build.sh compiles the wheel with the prefix's own CPython 3.13 —
    no third-party prebuilt binary enters the bundle.

# From-source sdist, sha256 as published by PyPI for this exact version.
source:
  # Built from the source package asyncpg-src, which pins the upstream tarball
  # (https://files.pythonhosted.org/packages/fe/cc/d18065ce2380d80b1bcce927c24a2642efd38918e33fd724bc4bca904877/asyncpg-0.31.0.tar.gz).
  type: package
  package: asyncpg-src

python:
  interpreter: python313
  abi: cp313

patches: []

depends:
  build:
    - name: asyncpg-src
      version: "==0.31.0"
    - name: python313
    # PEP-517 build backend, from this sdist's [build-system] requires.
    # --no-build-isolation means pip will NOT fetch it, so it has to be
    # in the build prefix already (build.sh bridges it onto sys.path).
    - name: setuptools-cp313
    - name: cython-cp313
  runtime:
    - name: python313
  host_tools:
    - python313

build:
  build_type_independent: true
  matrix:
    - platform: linux
      script: build.sh
    - platform: macos
      script: build.sh
    - platform: windows
      script: build.ps1

package:
  files:
    - { glob: "lib/python3.13/site-packages/asyncpg/", platforms: [linux, macos] }
    - { glob: "lib/python3.13/site-packages/*.dist-info/", platforms: [linux, macos] }
    - { glob: "Lib/site-packages/asyncpg/", platforms: [windows] }
    - { glob: "Lib/site-packages/*.dist-info/", platforms: [windows] }
