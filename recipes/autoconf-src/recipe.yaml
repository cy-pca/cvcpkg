schema_version: 1
recipe:
  name: autoconf-src
  upstream_version: "2.72"
  cvc_revision: 1
  maintainer: cvcpkg group
  maintainer_email: info@cvcpkg.org
  maintainer_url: https://cvcpkg.org
  homepage: https://www.gnu.org/software/autoconf/
  license: GPL-3.0-or-later
  tags: [source]
  description: >-
    The unmodified upstream source of autoconf 2.72: its release tarball,
    verified against the sha256 below and staged at src/autoconf-src/.  The autoconf
    recipe builds from it (source.type package), so the tarball is fetched
    once, from ftp.gnu.org, and every other build of autoconf -- another
    platform, a builder that cannot reach ftp.gnu.org, a user building from
    source -- installs this package from the catalog instead.  Generated by
    tools/make_source_package.py.

