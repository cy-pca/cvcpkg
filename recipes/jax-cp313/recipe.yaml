schema_version: 1
recipe:
  name: jax-cp313
  upstream_version: "0.8.2"
  cvc_revision: 1

  maintainer: "cvcpkg group"
  maintainer_email: "info@cvcpkg.org"
  maintainer_url: "https://cvcpkg.org"
  homepage: https://pypi.org/project/jax/
  license: "Apache-2.0"
  tags: [python, source]
  description: >-
    jax 0.8.2 for CPython 3.13 — the cp313 column of
    cvcpkg's per-interpreter matrix (pure-Python, built from the PyPI sdist);
    generated by tools/gen_python_recipes.py.
    Built FROM SOURCE: cvcpkg fetches and sha256-verifies the PyPI sdist,
    and build.sh compiles the wheel with the prefix's own CPython 3.13 —
    no third-party prebuilt binary enters the bundle.

# From-source sdist, sha256 as published by PyPI for this exact version.
source:
  # Built from the source package jax-src, which pins the upstream tarball
  # (https://files.pythonhosted.org/packages/e6/25/5efb46e5492076622d9150ed394da97ef9aad393aa52f7dd7e980f836e1f/jax-0.8.2.tar.gz).
  type: package
  package: jax-src

python:
  interpreter: python313
  abi: cp313

patches: []

depends:
  build:
    - name: jax-src
      version: "==0.8.2"
    - name: python313
    - name: jaxlib-cp313
    - name: ml-dtypes-cp313
    - name: numpy-cp313
    - name: opt-einsum-cp313
    - name: scipy-cp313
    # PEP-517 build backend, from this sdist's [build-system] requires.
    # --no-build-isolation means pip will NOT fetch it, so it has to be
    # in the build prefix already (build.sh bridges it onto sys.path).
    - name: setuptools-cp313
    - name: wheel-cp313
  runtime:
    - name: python313
    - name: jaxlib-cp313
    - name: ml-dtypes-cp313
    - name: numpy-cp313
    - name: opt-einsum-cp313
    - name: scipy-cp313
  host_tools:
    - python313

build:
  build_type_independent: true
  matrix:
    - platform: any
      script: build.sh

package:
  files:
    - lib/python3.13/site-packages/jax/
    - lib/python3.13/site-packages/jax-*.dist-info/
