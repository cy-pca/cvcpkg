schema_version: 1
recipe:
  name: libxext
  upstream_version: "1.3.7"
  cvc_revision: 2
  maintainer: "cvcpkg group"
  maintainer_email: "info@cvcpkg.org"
  maintainer_url: "https://cvcpkg.org"
  homepage: https://www.x.org/
  license: MIT
  tags: [libraries, x11, graphics]
  description: >-
    X11 miscellaneous extensions library (Xext: SHM, Sync, DPMS, …).

source:
  # Built from the source package libxext-src, which pins the upstream tarball
  # (https://xorg.freedesktop.org/releases/individual/lib/libXext-1.3.7.tar.xz).
  type: package
  package: libxext-src

patches: []

depends:
  build:
    - name: libxext-src
      version: "==1.3.7"
    - pkg-config
    - name: xorgproto
  runtime:
    - name: libx11
  host_tools: []

package:
  files:
    - lib/
    - include/
    - share/

build:
  matrix:
    - platform: linux
      script: build.sh
    - platform: freebsd
      script: build.sh
    - platform: openbsd
      script: build.sh
    - platform: netbsd
      script: build.sh
