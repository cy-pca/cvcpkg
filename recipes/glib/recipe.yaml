schema_version: 1
recipe:
  name: glib
  upstream_version: "2.80.5"
  # cvc.3: macOS links cvcpkg's gettext libintl (and its libiconv) instead of
  # building proxy-libintl, whose libintl.8.dylib the bundle never shipped, so
  # libglib loaded gettext's and dyld could not find g_libintl_* (qt6 rcc).
  # cvc.4: ...which cvc.3 did not actually achieve.  Meson probes
  # dependency('intl') with the C++ compiler, and build.sh's -I was in CFLAGS
  # only, so clang++ never saw gettext's libintl.h and meson still built
  # proxy-libintl: the cvc.3 macOS bundles ship lib/libintl{,.8}.dylib and
  # include/libintl.h, which replace gettext's in a shared prefix.  The -I is now
  # in CPPFLAGS (all C-family languages), and build.sh fails if a libintl is
  # staged.  Since #316's --wrap-mode=nofallback a macOS build failed outright.
  # cvc.5: the Windows bin/gdbus-codegen no longer falls back to the builder's
  # install dir (cvc.4 shipped 'C:/Users/jmr/cvcpkg-builder/.../install/share');
  # its fallback resolves bin/../share/glib-2.0 from the script itself, and
  # build.ps1 fails if any installed text file still names a build prefix.  It
  # also drops bin/glib-gettextize and the bash completions, which meson
  # installs only when sh/bash is on PATH (cvc.4's Windows bundle has neither).
  # The other platforms' payloads are unchanged.
  cvc_revision: 5
  maintainer: "cvcpkg group"
  maintainer_email: "info@cvcpkg.org"
  maintainer_url: "https://cvcpkg.org"
  homepage: https://gitlab.gnome.org/GNOME/glib
  license: LGPL-2.1-or-later
  tags: [libraries]
  description: >-
    GLib — the low-level core library that forms the basis of the GTK and
    GNOME stacks.  Provides data structures, an object/type system
    (GObject), an I/O abstraction (GIO), and a main loop.  Required by
    GStreamer.

source:
  # Built from the source package glib-src, which pins the upstream tarball
  # (https://download.gnome.org/sources/glib/2.80/glib-2.80.5.tar.xz).
  type: package
  package: glib-src

patches:
  # NetBSD: g_get_num_processors() used glibc's cpu_set_t/CPU_* macros because
  # NetBSD's <pthread.h> declares pthread_getaffinity_np (with cpuset_t).  The
  # affinity path now also needs CPU_ZERO.  Every platform that built before
  # either defines CPU_ZERO there or never took that path, so only NetBSD's code
  # changes, and glib was never published for NetBSD: no revision bump.
  - netbsd-cpu-set.patch

depends:
  build:
    - name: glib-src
      version: "==2.80.5"
    - ninja
    - meson
    - pkg-config
    # GLib's meson.build calls find_installation(modules: ['packaging']), which
    # checks the interpreter meson runs on: cvcpkg's python3 (build.sh puts the
    # build prefix first on PATH) or, on Windows, python312 (meson.cmd runs the
    # prefix's python.exe).  packaging comes from its cvcpkg recipe, never from
    # PyPI at build time.
    - name: python3
      platforms: [linux, macos, freebsd, openbsd, netbsd]
    - name: packaging-cp313
      platforms: [linux, macos, freebsd, openbsd, netbsd]
    - name: python312
      platforms: [windows]
    - name: packaging-cp312
      platforms: [windows]
  runtime:
    # OpenBSD has no iconv in libc; GLib *links* cvcpkg's GNU libiconv there, so
    # this is a runtime dep: the shipped libglib-2.0.so carries a DT_NEEDED on
    # libiconv.so and glib-2.0.pc references -liconv.  Filing it under `build:`
    # would strip it from the deliverable and break consumers on OpenBSD (and
    # would hide it from build.sh's ${CVC_DEPS_PREFIX}/include/iconv.h probe).
    # macOS links it too: gettext's libintl.h and libintl are built against it.
    - name: iconv
      version: ">=1.17"
      platforms: [openbsd, macos]
    # macOS libc has no gettext; without this GLib builds and links its
    # proxy-libintl subproject, whose libintl.8.dylib it never ships.
    # FreeBSD's and OpenBSD's libc have none either (NetBSD's does): there
    # meson tried to `git clone` proxy-libintl from github.com at build time,
    # and failed on the FreeBSD builder.
    - name: gettext
      version: "^1.0"
      platforms: [macos, freebsd, openbsd]
    # Windows has no libintl MSVC can link (gettext's Windows build is MinGW),
    # so meson git-cloned GLib's proxy-libintl subproject during the build.
    # cvcpkg's proxy-libintl is that library, pinned; glib-2.0.dll links it.
    - name: proxy-libintl
      version: ">=0.5"
      platforms: [windows]
    - name: libffi
      version: "^3.4"
    - name: pcre2
      version: "^10.0"
    - name: zlib
      version: "^1.3"
  host_tools: []

build:
  matrix:
    - platform: linux
      script: build.sh
      env:
        CFLAGS: "-O2 -fPIC"
    - platform: macos
      script: build.sh
      env:
        MACOSX_DEPLOYMENT_TARGET: "13.0"
    - platform: freebsd
      script: build.sh
      env:
        CFLAGS: "-O2 -fPIC"
    - platform: openbsd
      script: build.sh
      env:
        CFLAGS: "-O2 -fPIC"
    - platform: netbsd
      script: build.sh
      env:
        CFLAGS: "-O2 -fPIC"
    - platform: windows
      script: build.ps1

package:
  files:
    - { glob: "lib/libglib-2.0*", platforms: [linux, macos, freebsd, openbsd, netbsd] }
    - { glob: "lib/libgobject-2.0*", platforms: [linux, macos, freebsd, openbsd, netbsd] }
    - { glob: "lib/libgmodule-2.0*", platforms: [linux, macos, freebsd, openbsd, netbsd] }
    - { glob: "lib/libgio-2.0*", platforms: [linux, macos, freebsd, openbsd, netbsd] }
    - { glob: "lib/libgthread-2.0*", platforms: [linux, macos, freebsd, openbsd, netbsd] }
    # MSVC (build.ps1): import libraries in lib/, DLLs in bin/.
    - { glob: "lib/glib-2.0.lib", platforms: [windows] }
    - { glob: "lib/gobject-2.0.lib", platforms: [windows] }
    - { glob: "lib/gmodule-2.0.lib", platforms: [windows] }
    - { glob: "lib/gio-2.0.lib", platforms: [windows] }
    - { glob: "lib/gthread-2.0.lib", platforms: [windows] }
    - { glob: "bin/gmodule-2.0-*.dll", platforms: [windows] }
    - { glob: "bin/gthread-2.0-*.dll", platforms: [windows] }
    - lib/glib-2.0/
    - lib/gio/
    - lib/pkgconfig/glib-2.0*
    - lib/pkgconfig/gobject-2.0*
    - lib/pkgconfig/gmodule*
    - lib/pkgconfig/gio-2.0*
    - lib/pkgconfig/gthread-2.0*
    - include/glib-2.0/
    - { glob: "include/gio-unix-2.0/", platforms: [linux, macos, freebsd, openbsd, netbsd] }
    - { glob: "include/gio-win32-2.0/", platforms: [windows] }
    - bin/glib-*
    - bin/gio*
    - bin/gobject-*
    - bin/gdbus*
    - bin/gresource*
    - bin/gsettings*
  pkg_config:
    - glib-2.0
    - gobject-2.0
    - gmodule-2.0
    - gio-2.0
    - gthread-2.0

abi:
  cxx_std: 17
