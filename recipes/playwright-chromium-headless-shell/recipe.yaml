schema_version: 1
recipe:
  name: playwright-chromium-headless-shell
  # Versioned by the Playwright release it belongs to: playwright-core
  # 1.64.0's browsers.json pins chromium-headless-shell at revision 1248 =
  # Chromium 156.0.8078.4. Bump together with the playwright recipe; the two
  # must always carry the same version.
  upstream_version: "1.64.0"
  cvc_revision: 1
  maintainer: "cvcpkg group"
  maintainer_email: "info@cvcpkg.org"
  maintainer_url: "https://cvcpkg.org"
  homepage: https://playwright.dev/docs/browsers#chromium-headless-shell
  # Chromium's headless_shell target: BSD-3-Clause for Chromium itself plus
  # the third-party components compiled in, under permissive licenses and a
  # few weak-copyleft ones (LGPL: ffmpeg, gtk, WebKit-derived code; MPL-2.0:
  # symphonia). The zip ships the complete license compilation
  # (LICENSE.headless_shell, 312 components), copied to
  # share/doc/<name>/LICENSE. It has no AGPL, SSPL, BUSL or RSAL text; the
  # other GPL mentions are inside the LGPL/MPL texts and ICU's pkg.m4 build
  # macro notice.
  license: BSD-3-Clause
  tags: [testing, browser, tools]
  description: >-
    The headless Chromium Playwright 1.64.0 launches by default --
    chromium-headless-shell revision 1248 (Chromium 156.0.8078.4) -- from
    Playwright's CDN, unpacked into share/ms-playwright, the layout
    PLAYWRIGHT_BROWSERS_PATH expects, so headless `playwright test` runs
    without `playwright install` downloading anything. Not hermetic: it loads
    the host's NSS, ATK, GBM, X11 client libraries etc. (see notes).

# The payload is a vendor binary; nothing is compiled here.
prebuilt_payload: true

# Fetched and verified by build.sh (sha256 enforced there). The URL is the
# one playwright-core 1.64.0 computes for chromium-headless-shell on linux
# x86_64 (cftUrl("linux64/chrome-headless-shell-linux64.zip") in
# lib/coreBundle.js, mirror cdn.playwright.dev). Playwright's CDN publishes no
# checksum file, so the sha256 was computed from the download when pinning.
source:
  type: prebuilt
  base_url: https://cdn.playwright.dev/builds/cft/156.0.8078.4
  artifacts:
    linux-x86_64:
      file: linux64/chrome-headless-shell-linux64.zip
      sha256: "c3e50596aef52c58f8fda3c6b3411c33d34c88b177b3ed1c2243359fd3b8ba20"

patches: []

depends:
  build:
    # Only for test.sh, which runs a Playwright spec against the staged
    # browser. The browser itself needs neither at run time.
    - name: nodejs22
    - name: playwright
      version: "==1.64.0"
  runtime: []
  host_tools: []

build:
  build_type_independent: true
  matrix:
    - platform: linux
      script: build.sh

package:
  files:
    - share/ms-playwright/chromium_headless_shell-1248/
    - share/doc/playwright-chromium-headless-shell/

test:
  script: test.sh

notes:
  - title: "Headless shell only -- why not Playwright's full `chromium`"
    description: >-
      For `chromium`, Playwright 1.64 downloads Google Chrome for Testing
      (chrome-linux64.zip): a Chrome-branded build under Google's terms of
      service ("Copyright Google LLC. All rights reserved"), which bundles the
      proprietary Widevine CDM (WidevineCdm/libwidevinecdm.so). Widevine's
      license says it may not be distributed without a separate agreement
      with Google. That is incompatible with publishing it from cvcpkg, so
      only the headless shell -- Chromium's open-source headless_shell
      target, with its full open-source license file -- is packaged. It is
      exactly what Playwright launches for headless runs (the default since
      1.49). Headed runs, `channel: 'chromium'` and `--headed` need a full
      browser, which this package does not provide.
  - title: "Use with Playwright"
    description: >-
      Point Playwright at <prefix>/share/ms-playwright: the cvcpkg
      bin/playwright launcher does this by itself; a project running its own
      @playwright/test (which must be exactly 1.64.0) needs
      PLAYWRIGHT_BROWSERS_PATH=<prefix>/share/ms-playwright and, in CI,
      PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD=1. The directory carries Playwright's
      INSTALLATION_COMPLETE marker, so `playwright install --only-shell`
      against this path is a no-op. ffmpeg (needed only for `video:`
      recording) is not packaged.
  - title: "Host requirements (not hermetic)"
    platforms: [linux]
    description: >-
      Chromium links against system libraries cvcpkg does not provide. On
      Ubuntu 24.04 Playwright's `install-deps chromium` installs:
      libasound2t64 libatk-bridge2.0-0t64 libatk1.0-0t64 libatspi2.0-0t64
      libcairo2 libcups2t64 libdbus-1-3 libdrm2 libgbm1 libglib2.0-0t64
      libnspr4 libnss3 libpango-1.0-0 libx11-6 libxcb1 libxcomposite1
      libxdamage1 libxext6 libxfixes3 libxkbcommon0 libxrandr2 (Ubuntu 22.04:
      the same without the t64 suffixes, plus libwayland-client0), and for
      text rendering fonts such as fonts-liberation / fonts-noto-color-emoji.
      Playwright checks for them at launch and names what is missing.
      test.sh runs ldd first and SKIPS the browser launch when libraries are
      missing (CVC_PLAYWRIGHT_REQUIRE_BROWSER=1 turns that into a failure);
      the launch itself was verified in an Ubuntu 24.04 container with those
      packages installed.
  - title: "Platforms"
    description: >-
      linux-x86_64 only for now (the only artifact pinned; the recipe is
      skipped on other builders). Playwright serves the headless shell for
      linux-arm64, macOS and Windows from the same CDN path, so each is a new
      artifacts entry plus sha256 once it can be built and tested.
