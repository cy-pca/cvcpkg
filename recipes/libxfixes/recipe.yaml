schema_version: 1
recipe:
  name: libxfixes
  upstream_version: "6.0.2"
  cvc_revision: 1
  maintainer: "cvcpkg group"
  maintainer_email: "info@cvcpkg.org"
  maintainer_url: "https://cvcpkg.org"
  homepage: https://www.x.org/
  license: MIT
  tags: [libraries, x11, graphics]
  description: >-
    X Fixes extension client library (Xfixes).

source:
  # Built from the source package libxfixes-src, which pins the upstream tarball
  # (https://xorg.freedesktop.org/releases/individual/lib/libXfixes-6.0.2.tar.xz).
  type: package
  package: libxfixes-src

patches: []

depends:
  build:
    - name: libxfixes-src
      version: "==6.0.2"
    - meson
    - ninja
    - pkg-config
    - name: xorgproto
  runtime:
    - name: libx11
  host_tools: []

package:
  files:
    - lib/
    - include/
    - share/

build:
  matrix:
    - platform: linux
      script: build.sh
    - platform: freebsd
      script: build.sh
    - platform: openbsd
      script: build.sh
    - platform: netbsd
      script: build.sh
