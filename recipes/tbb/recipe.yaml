schema_version: 1
recipe:
  name: tbb
  upstream_version: "2022.3.0"
  cvc_revision: 1
  maintainer: "cvcpkg group"
  maintainer_email: "info@cvcpkg.org"
  maintainer_url: "https://cvcpkg.org"
  homepage: https://github.com/uxlfoundation/oneTBB
  license: Apache-2.0
  tags: [libraries, cpp, threading]
  description: >-
    oneTBB (Threading Building Blocks) — the UXL Foundation's C++ task
    scheduler and concurrent containers, plus the tbbmalloc scalable
    allocator and its malloc-replacement proxy.  Named `tbb` after its
    CMake package (find_package(TBB)).  v2022.3.0 is Blender 5.2's pin;
    Blender (Cycles, OpenVDB, USD and fluid all require it), OpenImageIO,
    Embree, OpenImageDenoise, OpenPGL, OpenSubdiv, OpenVDB and USD build on
    it.  Built without hwloc, so the optional tbbbind NUMA library is absent.

source:
  type: tarball
  url: https://github.com/uxlfoundation/oneTBB/archive/refs/tags/v2022.3.0.tar.gz
  sha256: "01598a46c1162c27253a0de0236f520fd8ee8166e9ebb84a4243574f88e6e50a"
  strip_components: 1

patches: []

depends:
  build: []
  runtime: []
  host_tools:
    - cmake
    - ninja

build:
  matrix:
    - platform: linux
      script: build.sh
    - platform: macos
      script: build.sh
      env:
        MACOSX_DEPLOYMENT_TARGET: "13.0"
    - platform: windows
      script: build.ps1

package:
  files:
    - include/tbb/
    - include/oneapi/
    - lib/libtbb*
    # MSVC: tbb12.lib, tbbmalloc.lib, tbbmalloc_proxy.lib + the bin/ DLLs.
    - lib/tbb*
    - { glob: "bin/tbb*", platforms: [windows] }
    - lib/cmake/TBB/
    - lib/pkgconfig/tbb.pc
  pkg_config:
    - tbb
  cmake_packages:
    - { name: TBB, targets: ["TBB::tbb", "TBB::tbbmalloc", "TBB::tbbmalloc_proxy"] }

abi:
  cxx_std: 17
