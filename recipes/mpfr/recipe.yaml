schema_version: 1
recipe:
  name: mpfr
  upstream_version: "4.2.1"
  cvc_revision: 5
  maintainer: "cvcpkg group"
  maintainer_email: "info@cvcpkg.org"
  maintainer_url: "https://cvcpkg.org"
  description: "MPFR — the GNU Multiple Precision Floating-Point Reliable library for correct rounding of arbitrary-precision floating-point computations."
  homepage: https://www.mpfr.org/
  license: LGPL-3.0-or-later
  tags: [math, wasm, wasi]

source:
  type: tarball
  url: https://www.mpfr.org/mpfr-4.2.1/mpfr-4.2.1.tar.xz
  mirror: https://ftp.gnu.org/gnu/mpfr/mpfr-4.2.1.tar.xz
  sha256: "277807353a6726978996945af13e52829e3abd7a9a5b7fb2793894e18f1fcbb2"
  strip_components: 1

patches: []

depends:
  build:
    - make
  runtime:
    - name: gmp
      version: ">=6.1.0"
  host_tools:
    # Windows autotools build (Invoke-CvcMsysAutotoolsBuild in build.ps1) needs a
    # pinned toolchain on PATH; without it the build silently fell through to
    # ambient C:\msys64. host_tools resolve per-platform, so mingw-w64-gcc
    # (windows-only) is a no-op elsewhere and the autotools stay inert on
    # non-Windows, which build from the shipped ./configure. make rides in via
    # depends.build (kept there to avoid recipes/make's own build self-cycle).
    - m4
    - autoconf
    - automake
    - libtool
    - mingw-w64-gcc

build:
  matrix:
    - platform: linux
      script: build.sh
      env:
        CFLAGS: "-O2 -fPIC"
    - platform: macos
      script: build.sh
      env:
        MACOSX_DEPLOYMENT_TARGET: "13.0"
    - platform: freebsd
      script: build.sh
      env:
        CFLAGS: "-O2 -fPIC"
    - platform: openbsd
      script: build.sh
      env:
        CFLAGS: "-O2 -fPIC"
    - platform: netbsd
      script: build.sh
      env:
        CFLAGS: "-O2 -fPIC"
    - platform: windows
      script: build.ps1
    - platform: wasm
      host_platform: linux
      script: build-wasm.sh
    - platform: wasm
      host_platform: windows
      script: build-wasm.ps1
    - platform: wasi
      host_platform: linux
      script: build-wasi.sh
    - platform: wasi
      host_platform: windows
      script: build-wasi.ps1
    - platform: cosmo
      host_platform: linux
      script: build-cosmo.sh

package:
  files:
    - lib/libmpfr*
    - lib/mpfr*
    - lib/pkgconfig/mpfr*
    - include/mpfr.h
    - include/mpf2mpfr.h
  cmake_packages: []

abi:
  cxx_std: 17
