schema_version: 1
recipe:
  name: mpfr
  upstream_version: "4.2.1"
  cvc_revision: 5
  maintainer: "cvcpkg group"
  maintainer_email: "info@cvcpkg.org"
  maintainer_url: "https://cvcpkg.org"
  description: "MPFR — the GNU Multiple Precision Floating-Point Reliable library for correct rounding of arbitrary-precision floating-point computations."
  homepage: https://www.mpfr.org/
  license: LGPL-3.0-or-later
  tags: [math, wasm, wasi]

source:
  type: tarball
  url: https://www.mpfr.org/mpfr-4.2.1/mpfr-4.2.1.tar.xz
  mirror: https://ftp.gnu.org/gnu/mpfr/mpfr-4.2.1.tar.xz
  sha256: "277807353a6726978996945af13e52829e3abd7a9a5b7fb2793894e18f1fcbb2"
  strip_components: 1

patches: []

depends:
  build:
    - make
    # Windows autotools build (Invoke-CvcMsysAutotoolsBuild in build.ps1) needs the
    # GNU toolchain in the BUILD closure. cvcpkg stages host_tools only when
    # CROSS-compiling (target != host), so a native Windows build gets nothing
    # from host_tools — these must be real build deps that build from source and
    # stage into the build prefix, where env-windows's $depsFlag puts them on
    # PATH. Scoped to windows: other platforms build from the shipped ./configure
    # with the system toolchain and must not pull the mingw cross-compiler.
    - name: m4
      platforms: [windows]
    - name: autoconf
      platforms: [windows]
    - name: automake
      platforms: [windows]
    - name: libtool
      platforms: [windows]
    - name: mingw-w64-gcc
      platforms: [windows]
  runtime:
    - name: gmp
      version: ">=6.1.0"
  host_tools: []

build:
  matrix:
    - platform: linux
      script: build.sh
      env:
        CFLAGS: "-O2 -fPIC"
    - platform: macos
      script: build.sh
      env:
        MACOSX_DEPLOYMENT_TARGET: "13.0"
    - platform: freebsd
      script: build.sh
      env:
        CFLAGS: "-O2 -fPIC"
    - platform: openbsd
      script: build.sh
      env:
        CFLAGS: "-O2 -fPIC"
    - platform: netbsd
      script: build.sh
      env:
        CFLAGS: "-O2 -fPIC"
    - platform: haiku
      script: build.sh
      env:
        CFLAGS: "-O2 -fPIC"
    - platform: windows
      script: build.ps1
    - platform: wasm
      host_platform: linux
      script: build-wasm.sh
    - platform: wasm
      host_platform: windows
      script: build-wasm.ps1
    - platform: wasi
      host_platform: linux
      script: build-wasi.sh
    - platform: wasi
      host_platform: windows
      script: build-wasi.ps1
    - platform: cosmo
      host_platform: linux
      script: build-cosmo.sh

package:
  files:
    - lib/libmpfr*
    - lib/mpfr*
    - lib/pkgconfig/mpfr*
    - include/mpfr.h
    - include/mpf2mpfr.h
  cmake_packages: []

abi:
  cxx_std: 17
