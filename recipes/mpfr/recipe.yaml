schema_version: 1
recipe:
  name: mpfr
  upstream_version: "4.2.1"
  # 6: the first windows bundle built from this recipe (MinGW-w64 gcc + MSYS2
  # autotools, all from cvcpkg) against gmp 6.3.0+cvc.10's libgmp-10.dll. It
  # replaces 4.2.1+cvc.1 for windows, a repackaged vcpkg build that imported
  # vcpkg's gmp-10.dll and shipped a copy of it. linux/macos/BSD builds are
  # unchanged from +cvc.5.
  # 7: rebuild against the portable gmp 6.3.0+cvc.11 (--enable-fat on x86).
  # macOS now sets CFLAGS explicitly: with it unset, MPFR's configure adopts
  # gmp.h's __GMP_CFLAGS, which through gmp +cvc.10 carried the macOS
  # builder's -march=<cpu>. linux and the BSDs already set CFLAGS and only
  # rebuild against the new gmp.
  cvc_revision: 7
  maintainer: "cvcpkg group"
  maintainer_email: "info@cvcpkg.org"
  maintainer_url: "https://cvcpkg.org"
  description: "MPFR — the GNU Multiple Precision Floating-Point Reliable library for correct rounding of arbitrary-precision floating-point computations."
  homepage: https://www.mpfr.org/
  license: LGPL-3.0-or-later
  tags: [math, wasm, wasi]

source:
  type: tarball
  url: https://www.mpfr.org/mpfr-4.2.1/mpfr-4.2.1.tar.xz
  mirror: https://ftp.gnu.org/gnu/mpfr/mpfr-4.2.1.tar.xz
  sha256: "277807353a6726978996945af13e52829e3abd7a9a5b7fb2793894e18f1fcbb2"
  strip_components: 1

patches: []

depends:
  build:
    - make
    # Windows autotools build (Invoke-CvcMsysAutotoolsBuild in build.ps1) needs the
    # GNU toolchain in the BUILD closure. cvcpkg stages host_tools only when
    # CROSS-compiling (target != host), so a native Windows build gets nothing
    # from host_tools — these must be real build deps that build from source and
    # stage into the build prefix, where env-windows's $depsFlag puts them on
    # PATH. Scoped to windows: other platforms build from the shipped ./configure
    # with the system toolchain and must not pull the mingw cross-compiler.
    - name: m4
      platforms: [windows]
    - name: autoconf
      platforms: [windows]
    - name: automake
      platforms: [windows]
    - name: libtool
      platforms: [windows]
    - name: mingw-w64-gcc
      platforms: [windows]
    # The shell: the MSYS2 bootstrap (MSYS bash + coreutils). Declared rather
    # than inherited from an ambient C:\msys64, which on a GitHub-hosted image is
    # bare (no gcc, no make). It also rides in through m4/make/autoconf/..., but
    # build.ps1 drives it directly, so say so.
    - name: msys2
      platforms: [windows]
  runtime:
    # On windows mpfr's DLL imports gmp's by name: libgmp-10.dll, which gmp has
    # shipped since 6.3.0+cvc.10 (the vcpkg-built +cvc.1 named it gmp-10.dll).
    # Publish gmp's windows bundle first so this one builds against it.
    - name: gmp
      version: ">=6.1.0"
    # libmpfr-6.dll imports libmcfgthread-2.dll: MPFR's thread-local state uses
    # GCC's emulated TLS, which with the MCF thread model of cvcpkg's MinGW-w64
    # gcc lives in mcfgthread (see build.ps1). That DLL ships here.
    - name: mingw-w64-runtime
      platforms: [windows]
  host_tools: []

build:
  matrix:
    - platform: linux
      script: build.sh
      env:
        CFLAGS: "-O2 -fPIC"
    - platform: macos
      script: build.sh
      env:
        MACOSX_DEPLOYMENT_TARGET: "13.0"
        # Set, so MPFR's configure does not copy gmp.h's __GMP_CFLAGS. Through
        # gmp +cvc.10 those named the macOS builder's CPU (-march=<cpu>), so this
        # bundle could carry instructions older Intel Macs lack (see +cvc.7).
        CFLAGS: "-O2"
    - platform: freebsd
      script: build.sh
      env:
        CFLAGS: "-O2 -fPIC"
    - platform: openbsd
      script: build.sh
      env:
        CFLAGS: "-O2 -fPIC"
    - platform: netbsd
      script: build.sh
      env:
        CFLAGS: "-O2 -fPIC"
    - platform: haiku
      script: build.sh
      env:
        CFLAGS: "-O2 -fPIC"
    - platform: windows
      script: build.ps1
    - platform: wasm
      host_platform: linux
      script: build-wasm.sh
    - platform: wasm
      host_platform: windows
      script: build-wasm.ps1
    - platform: wasi
      host_platform: linux
      script: build-wasi.sh
    - platform: wasi
      host_platform: windows
      script: build-wasi.ps1
    - platform: cosmo
      host_platform: linux
      script: build-cosmo.sh

package:
  files:
    - lib/libmpfr*
    - lib/mpfr*
    - lib/pkgconfig/mpfr*
    - include/mpfr.h
    - include/mpf2mpfr.h
  cmake_packages: []

abi:
  cxx_std: 17
