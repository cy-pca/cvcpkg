schema_version: 1
recipe:
  name: fonttools-cp311
  upstream_version: "4.63.0"
  cvc_revision: 5

  maintainer: "cvcpkg group"
  maintainer_email: "info@cvcpkg.org"
  maintainer_url: "https://cvcpkg.org"
  homepage: https://pypi.org/project/fonttools/
  license: "MIT"
  tags: [python, source]
  description: >-
    fonttools 4.63.0 for CPython 3.11 — the cp311 column of
    cvcpkg's per-interpreter matrix (pure-Python, built from the PyPI sdist);
    generated by tools/gen_python_recipes.py.
    Built FROM SOURCE: cvcpkg fetches and sha256-verifies the PyPI sdist,
    and build.sh compiles the wheel with the prefix's own CPython 3.11 —
    no third-party prebuilt binary enters the bundle.

# From-source sdist, sha256 as published by PyPI for this exact version.
source:
  # Built from the source package fonttools-src, which pins the upstream tarball
  # (https://files.pythonhosted.org/packages/84/69/c97f2c18e0db87d2c7b15da1974dace76ae938f1cfa22e2727a648b7ed43/fonttools-4.63.0.tar.gz).
  type: package
  package: fonttools-src

python:
  interpreter: python311
  abi: cp311

patches: []

depends:
  build:
    - name: fonttools-src
      version: "==4.63.0"
    - name: python311
    # PEP-517 build backend, from this sdist's [build-system] requires.
    # --no-build-isolation means pip will NOT fetch it, so it has to be
    # in the build prefix already (build.sh bridges it onto sys.path).
    - name: setuptools-cp311
    - name: wheel-cp311
  runtime:
    - name: python311
  host_tools:
    - python311

build:
  build_type_independent: true
  matrix:
    - platform: any
      script: build.sh
      env:
        FONTTOOLS_WITH_CYTHON: "0"
    - platform: windows
      script: build.ps1
      env:
        FONTTOOLS_WITH_CYTHON: "0"

package:
  files:
    - { glob: "lib/python3.11/site-packages/fontTools/", platforms: [any] }
    - { glob: "lib/python3.11/site-packages/fonttools-*.dist-info/", platforms: [any] }
    - { glob: "Lib/site-packages/fontTools/", platforms: [windows] }
    - { glob: "Lib/site-packages/fonttools-*.dist-info/", platforms: [windows] }
