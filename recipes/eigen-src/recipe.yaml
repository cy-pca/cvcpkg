schema_version: 1
recipe:
  name: eigen-src
  upstream_version: "5.0.1"
  cvc_revision: 1
  maintainer: cvcpkg group
  maintainer_email: info@cvcpkg.org
  maintainer_url: https://cvcpkg.org
  homepage: https://eigen.tuxfamily.org/
  license: MPL-2.0 AND Apache-2.0 AND BSD-3-Clause AND Minpack AND LicenseRef-COLAMD AND LicenseRef-SuperLU
  tags: [source]
  description: >-
    The unmodified upstream source of eigen 5.0.1: its release tarball, verified
    against the sha256 below and staged at src/eigen-src/.  The eigen recipe
    builds from it (source.type package), so the tarball is fetched once, from
    gitlab.com, and every other build of eigen -- another platform, a builder
    that cannot reach gitlab.com, a user building from source -- installs this
    package from the catalog instead.  Generated by
    tools/make_source_package.py.

source:
  type: tarball
  url: https://gitlab.com/libeigen/eigen/-/archive/5.0.1/eigen-5.0.1.tar.gz
  # The GitLab release asset (immutable upload) with the identical digest -- used by
  # the Bazel Central Registry (modules/eigen/5.0.1/source.json).
  mirror: https://gitlab.com/libeigen/eigen/-/package_files/246179253/download
  sha256: "e9c326dc8c05cd1e044c71f30f1b2e34a6161a3b6ecf445d56b53ff1669e3dec"
  strip_components: 1

patches: []

depends:
  build: []
  runtime: []
  host_tools: []

build:
  build_type_independent: true
  matrix:
    - platform: any
      script: build.sh

package:
  files:
    - src/eigen-src/
