schema_version: 1
recipe:
  name: msys2
  upstream_version: "20260927"
  # cvc.3: the bundle survives its zip round trip. cvc.2 lost every empty
  # directory (/tmp, /dev) and shipped /etc/mtab, a SYSTEM-attributed Cygwin
  # symlink that blocks re-extraction; see build.ps1 step 6.
  cvc_revision: 3
  maintainer: "cvcpkg group"
  maintainer_email: "info@cvcpkg.org"
  maintainer_url: "https://cvcpkg.org"
  description: >-
    MSYS2 bootstrap for Windows autotools builds — the POSIX shell and the
    MSYS-subsystem C compiler that the MSYS host tools (make, m4, autoconf,
    automake, libtool) are built with, plus the MSYS perl the autotools run on.
    Deliberately minimal: the sha256-pinned MSYS2 base archive plus the MSYS
    gcc, perl and diffutils packages. make, m4, autoconf, automake, libtool and
    the MinGW-w64 gcc that builds the actual Windows libraries each come from
    their own cvcpkg recipe — never from pacman here. Declare it under
    depends.build, scoped to windows, in any recipe whose build.ps1 drives
    Invoke-CvcMsysHostToolBuild or Invoke-CvcMsysAutotoolsBuild.
  homepage: https://www.msys2.org/
  license: BSD-3-Clause

# The build script downloads the sha256-pinned msys2-base sfx itself (a 7-Zip
# self-extractor, not an archive cvcpkg's tarball source can unpack).
source:
  type: prebuilt

patches: []

depends:
  build: []
  runtime: []
  host_tools: []

build:
  build_type_independent: true
  matrix:
    - platform: windows
      script: build.ps1

package:
  # The whole MSYS2 root, staged at <prefix>\msys2 — where env-windows.ps1's
  # Get-CvcGitBash looks (build prefix first, then deps prefix) before any
  # ambient C:\msys64.
  files:
    - msys2/

notes:
  - title: "What is in the bootstrap"
    platforms: [windows]
    description: >-
      msys2-base-x86_64-20260927 (sha256-pinned), brought current with
      `pacman -Syuu`, plus the MSYS packages gcc, perl and diffutils. No make
      and no autotools: those come from the cvcpkg make/m4/autoconf/automake/
      libtool recipes, so the recipes' tool probes check the cvcpkg copies
      rather than being satisfied by ambient ones.
  - title: "Large download (~300 MB on disk)"
    platforms: [windows]
    description: >-
      The base archive is ~43 MB; the MSYS gcc toolchain and perl bring the
      staged tree to a few hundred MB. It is build-time only.
  - title: "bash.exe discovery"
    platforms: [windows]
    description: >-
      env-windows.ps1's Get-CvcGitBash locates bash.exe by checking
      (1) CVC_MSYS2_DIR, (2) CVC_BUILD_PREFIX\msys2, (3) CVC_DEPS_PREFIX\msys2,
      (4) C:\msys64, (5) Git Bash. A GitHub-hosted image's C:\msys64 is bare
      (pacman + base only: no gcc, no make), so recipes must declare this one.
