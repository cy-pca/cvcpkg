schema_version: 1
recipe:
  name: stack-data-cp313t
  upstream_version: "0.6.3"
  cvc_revision: 1

  maintainer: "cvcpkg group"
  maintainer_email: "info@cvcpkg.org"
  maintainer_url: "https://cvcpkg.org"
  homepage: https://pypi.org/project/stack-data/
  license: "MIT"
  tags: [python, source]
  description: >-
    stack-data 0.6.3 for CPython 3.13t — the cp313t column of
    cvcpkg's per-interpreter matrix (pure-Python, built from the PyPI sdist);
    generated by tools/gen_python_recipes.py.
    Built FROM SOURCE: cvcpkg fetches and sha256-verifies the PyPI sdist,
    and build.sh compiles the wheel with the prefix's own CPython 3.13t —
    no third-party prebuilt binary enters the bundle.
    The cp313t column installs under the free-threaded (no-GIL)
    interpreter and its import check runs with the GIL disabled.

# From-source sdist, sha256 as published by PyPI for this exact version.
source:
  # Built from the source package stack-data-src, which pins the upstream tarball
  # (https://files.pythonhosted.org/packages/28/e3/55dcc2cfbc3ca9c29519eb6884dd1415ecb53b0e934862d3559ddcb7e20b/stack_data-0.6.3.tar.gz).
  type: package
  package: stack-data-src

python:
  interpreter: python313t
  abi: cp313t

patches: []

depends:
  build:
    - name: stack-data-src
      version: "==0.6.3"
    - name: python313t
    - name: asttokens-cp313t
    - name: executing-cp313t
    - name: pure-eval-cp313t
    # PEP-517 build backend, from this sdist's [build-system] requires.
    # --no-build-isolation means pip will NOT fetch it, so it has to be
    # in the build prefix already (build.sh bridges it onto sys.path).
    - name: setuptools-cp313t
    - name: wheel-cp313t
    - name: setuptools-scm-cp313t
  runtime:
    - name: python313t
    - name: asttokens-cp313t
    - name: executing-cp313t
    - name: pure-eval-cp313t
  host_tools:
    - python313t

build:
  build_type_independent: true
  matrix:
    - platform: any
      script: build.sh
    - platform: windows
      script: build.ps1

package:
  files:
    - { glob: "lib/python3.13t/site-packages/stack_data/", platforms: [any] }
    - { glob: "lib/python3.13t/site-packages/*.dist-info/", platforms: [any] }
    - { glob: "Lib/site-packages/stack_data/", platforms: [windows] }
    - { glob: "Lib/site-packages/*.dist-info/", platforms: [windows] }
