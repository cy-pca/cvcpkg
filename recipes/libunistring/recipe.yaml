schema_version: 1
recipe:
  name: libunistring
  upstream_version: "1.3"
  cvc_revision: 4
  # cvc.4: ships no libtool .la (see build.sh).
  maintainer: "cvcpkg group"
  maintainer_email: "info@cvcpkg.org"
  maintainer_url: "https://cvcpkg.org"
  description: "GNU libunistring — Unicode string library for C (required by libidn2 and others)."
  homepage: https://www.gnu.org/software/libunistring/
  license: LGPL-3.0-or-later OR GPL-2.0-or-later
  tags: [libraries, i18n]

source:
  # Built from the source package libunistring-src, which pins the upstream tarball
  # (https://ftp.gnu.org/gnu/libunistring/libunistring-1.3.tar.gz).
  type: package
  package: libunistring-src

patches: []

depends:
  build:
    # Windows builds with MinGW-w64 under MSYS2 (Invoke-CvcMsysAutotoolsBuild).
    # Declared, as aspell does, now that a dep's build edge no longer brings it.
    - name: msys2
      platforms: [windows]
    - name: make
      platforms: [windows]
    - name: mingw-w64-gcc
      platforms: [windows]
    - name: libunistring-src
      version: "==1.3"
  runtime:
    - name: iconv
      version: ">=1.17"
      platforms: [freebsd, netbsd, openbsd, macos]
  host_tools: []

build:
  matrix:
    - platform: linux
      script: build.sh
      env:
        CFLAGS: "-O2 -fPIC"
    - platform: macos
      script: build.sh
      env:
        MACOSX_DEPLOYMENT_TARGET: "13.0"
    - platform: freebsd
      script: build.sh
      env:
        CFLAGS: "-O2 -fPIC"
    - platform: openbsd
      script: build.sh
      env:
        CFLAGS: "-O2 -fPIC"
    - platform: netbsd
      script: build.sh
      env:
        CFLAGS: "-O2 -fPIC"
    - platform: haiku
      script: build.sh
      env:
        CFLAGS: "-O2 -fPIC"
    - platform: windows
      script: build.ps1
    - platform: wasm
      host_platform: linux
      script: build-wasm.sh
    - platform: wasi
      host_platform: linux
      script: build-wasi.sh
    - platform: cosmo
      host_platform: linux
      script: build-cosmo.sh

package:
  files:
    - lib/libunistring*
    - include/unistr.h
    - include/uniconv.h
    - include/unictype.h
    - include/uniname.h
    - include/uninorm.h
    - include/unistdio.h
    - include/unistring/
    - include/uniwbrk.h
    - include/uniwidth.h
    - include/unilbrk.h
    - include/unicase.h
    # libunistring 1.x installs one header per module (unicase.h, ...) plus
    # include/unistring/; the per-module directories never existed.
    - include/unimetadata.h
  cmake_packages: []

abi:
  cxx_std: 17
