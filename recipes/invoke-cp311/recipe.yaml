schema_version: 1
recipe:
  name: invoke-cp311
  upstream_version: "3.0.3"
  # cvc.4: republish.  The published noarch cvc.3 bundle's console scripts
  # (inv, invoke) carry the build machine's interpreter as their shebang (the old
  # libcvc-deps macOS CI prefix), so they cannot run anywhere; packing today
  # rewrites it to /usr/bin/env.
  cvc_revision: 4

  maintainer: "cvcpkg group"
  maintainer_email: "info@cvcpkg.org"
  maintainer_url: "https://cvcpkg.org"
  homepage: https://pypi.org/project/invoke/
  license: "BSD-2-Clause"
  tags: [python, source]
  description: >-
    invoke 3.0.3 for CPython 3.11 — the cp311 column of
    cvcpkg's per-interpreter matrix (pure-Python, built from the PyPI sdist);
    generated by tools/gen_python_recipes.py.
    Built FROM SOURCE: cvcpkg fetches and sha256-verifies the PyPI sdist,
    and build.sh compiles the wheel with the prefix's own CPython 3.11 —
    no third-party prebuilt binary enters the bundle.

# From-source sdist, sha256 as published by PyPI for this exact version.
source:
  type: tarball
  url: https://files.pythonhosted.org/packages/33/f6/227c48c5fe47fa178ccf1fda8f047d16c97ba926567b661e9ce2045c600c/invoke-3.0.3.tar.gz
  sha256: "437b6a622223824380bfb4e64f612711a6b648c795f565efc8625af66fb57f0c"
  strip_components: 1

python:
  interpreter: python311
  abi: cp311

patches: []

depends:
  build:
    - name: python311
    # PEP-517 build backend, from this sdist's [build-system] requires.
    # --no-build-isolation means pip will NOT fetch it, so it has to be
    # in the build prefix already (build.sh bridges it onto sys.path).
    - name: setuptools-cp311
  runtime:
    - name: python311
  host_tools:
    - python311

provides:
  - invoke

build:
  build_type_independent: true
  matrix:
    - platform: any
      script: build.sh
    - platform: windows
      script: build.ps1

package:
  files:
    - { glob: "lib/python3.11/site-packages/invoke/", platforms: [any] }
    - { glob: "lib/python3.11/site-packages/*.dist-info/", platforms: [any] }
    - { glob: "bin/invoke", platforms: [any] }
    - { glob: "bin/inv", platforms: [any] }
    - { glob: "Lib/site-packages/invoke/", platforms: [windows] }
    - { glob: "Lib/site-packages/*.dist-info/", platforms: [windows] }
