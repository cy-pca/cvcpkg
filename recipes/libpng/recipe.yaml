schema_version: 1
recipe:
  name: libpng
  upstream_version: "1.6.44"
  # Added wasm/wasi/cosmo entries.  libpng is plain C over zlib, which already
  # covers all three; the cross scripts force the static-only target set and
  # take the portable C path instead of the x86/ARM/POWER/MIPS intrinsics.
  # cvc.5: relocatable .pc/.cmake/bin/*-config.  The published cvc.4
  # kept build-machine paths (/tmp/cvcpkg-builder/...) in them, so pkg-config,
  # find_package or the -config script handed consumers dead -I/-L paths
  # (2026-10-13 scan of every published linux bundle).
  # The Windows build now writes libpng.pc/libpng16.pc (CMake installs none for
  # MSVC; freetype2.pc requires libpng).  No bump: Windows has no cvc.4 or
  # cvc.5 bundle, and no other platform's files change.
  cvc_revision: 5
  maintainer: "cvcpkg group"
  maintainer_email: "info@cvcpkg.org"
  maintainer_url: "https://cvcpkg.org"
  homepage: http://www.libpng.org/pub/png/libpng.html
  license: Libpng
  tags: [libraries, wasm, wasi]
  description: >-
    libpng — the official reference library for reading, creating, and
    manipulating PNG image files.  Required by FreeType, Cairo, and
    GDK-Pixbuf.

source:
  # Built from the source package libpng-src, which pins the upstream tarball
  # (https://download.sourceforge.net/libpng/libpng-1.6.44.tar.xz).
  type: package
  package: libpng-src

patches: []

depends:
  build:
    - name: libpng-src
      version: "==1.6.44"
    - cmake
    - ninja
  runtime:
    - name: zlib
      version: "^1.3"
  host_tools: []

build:
  matrix:
    - platform: linux
      script: build.sh
      env:
        CFLAGS: "-O2 -fPIC"
    - platform: macos
      script: build.sh
      env:
        MACOSX_DEPLOYMENT_TARGET: "13.0"
    - platform: freebsd
      script: build.sh
      env:
        CFLAGS: "-O2 -fPIC"
    - platform: openbsd
      script: build.sh
      env:
        CFLAGS: "-O2 -fPIC"
    - platform: netbsd
      script: build.sh
      env:
        CFLAGS: "-O2 -fPIC"
    - platform: haiku
      script: build.sh
      env:
        CFLAGS: "-O2 -fPIC"
    - platform: windows
      script: build.ps1
    - platform: wasm
      host_platform: linux
      script: build-wasm.sh
    # Threaded wasm: same build script, -pthread injected by env-wasm.sh's
    # CVC_WASM_THREADS hook.  A separate platform because emscripten cannot
    # link single-threaded objects into a shared-memory build.
    - platform: wasm-mt
      host_platform: linux
      script: build-wasm.sh
      env:
        CVC_WASM_THREADS: "1"
    - platform: wasi
      host_platform: linux
      script: build-wasi.sh
    - platform: cosmo
      host_platform: linux
      script: build-cosmo.sh

package:
  files:
    - lib/libpng16*
    - lib/libpng*
    - lib/pkgconfig/libpng*.pc
    - lib/cmake/PNG/
    - include/png*.h
    - include/libpng16/
    # libpng-config is a shell script; MSVC builds do not install it.
    - glob: bin/libpng*-config
      platforms: [linux, macos, freebsd, openbsd, netbsd, haiku, wasm, wasm-mt, wasi, cosmo]
    # bin/pngfix and bin/png-fix-itxt are not built (PNG_TOOLS is off).
  cmake_packages:
    - { name: PNG, targets: ["PNG::PNG"] }
  pkg_config:
    - libpng
    - libpng16

abi:
  cxx_std: 17
