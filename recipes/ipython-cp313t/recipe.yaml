schema_version: 1
recipe:
  name: ipython-cp313t
  upstream_version: "9.17.1"
  cvc_revision: 1

  maintainer: "cvcpkg group"
  maintainer_email: "info@cvcpkg.org"
  maintainer_url: "https://cvcpkg.org"
  homepage: https://pypi.org/project/ipython/
  license: "BSD-3-Clause"
  tags: [python, source]
  description: >-
    ipython 9.17.1 for CPython 3.13t — the cp313t column of
    cvcpkg's per-interpreter matrix (pure-Python, built from the PyPI sdist);
    generated by tools/gen_python_recipes.py.
    Built FROM SOURCE: cvcpkg fetches and sha256-verifies the PyPI sdist,
    and build.sh compiles the wheel with the prefix's own CPython 3.13t —
    no third-party prebuilt binary enters the bundle.
    The cp313t column installs under the free-threaded (no-GIL)
    interpreter and its import check runs with the GIL disabled.

# From-source sdist, sha256 as published by PyPI for this exact version.
source:
  # Built from the source package ipython-src, which pins the upstream tarball
  # (https://files.pythonhosted.org/packages/b9/32/99451b1283ec5d92ad77073f12e1c667dc10775384d8f15c2914207149dd/ipython-9.17.1.tar.gz).
  type: package
  package: ipython-src

python:
  interpreter: python313t
  abi: cp313t

patches: []

depends:
  build:
    - name: ipython-src
      version: "==9.17.1"
    - name: python313t
    - name: colorama-cp313t
    - name: ipython-pygments-lexers-cp313t
    - name: jedi-cp313t
    - name: matplotlib-inline-cp313t
    - name: pexpect-cp313t
    - name: prompt-toolkit-cp313t
    - name: psutil-cp313t
    - name: pygments-cp313t
    - name: stack-data-cp313t
    - name: traitlets-cp313t
    - name: typing-extensions-cp313t
    # PEP-517 build backend, from this sdist's [build-system] requires.
    # --no-build-isolation means pip will NOT fetch it, so it has to be
    # in the build prefix already (build.sh bridges it onto sys.path).
    - name: setuptools-cp313t
  runtime:
    - name: python313t
    - name: colorama-cp313t
    - name: ipython-pygments-lexers-cp313t
    - name: jedi-cp313t
    - name: matplotlib-inline-cp313t
    - name: pexpect-cp313t
    - name: prompt-toolkit-cp313t
    - name: psutil-cp313t
    - name: pygments-cp313t
    - name: stack-data-cp313t
    - name: traitlets-cp313t
    - name: typing-extensions-cp313t
  host_tools:
    - python313t

provides:
  - ipython

build:
  build_type_independent: true
  matrix:
    - platform: any
      script: build.sh
    - platform: windows
      script: build.ps1

package:
  files:
    - { glob: "lib/python3.13t/site-packages/IPython/", platforms: [any] }
    - { glob: "lib/python3.13t/site-packages/*.dist-info/", platforms: [any] }
    - { glob: "bin/ipython", platforms: [any] }
    - { glob: "bin/ipython3", platforms: [any] }
    - { glob: "Lib/site-packages/IPython/", platforms: [windows] }
    - { glob: "Lib/site-packages/*.dist-info/", platforms: [windows] }
