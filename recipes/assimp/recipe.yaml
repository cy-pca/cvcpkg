schema_version: 1
recipe:
  name: assimp
  upstream_version: "6.0.5"
  # Bumped 1 -> 2: republish so the catalog bundle carries a RELOCATABLE CMake
  # export. +cvc.1 baked an absolute build-sandbox zlib path into
  # assimpTargets.cmake's INTERFACE_LINK_LIBRARIES (from -DASSIMP_BUILD_ZLIB=OFF +
  # FindZLIB's ${ZLIB_LIBRARIES}), so `find_package(assimp)` + link assimp::assimp
  # failed on every consumer. Fixed by the shared cvc_rewrite_install_paths helper
  # now relocating $CVC_DEPS_PREFIX paths too; this bump ships the corrected bundle.
  # cvc.7: the same fix on Windows. The first Windows build of cvc.6 (2026-10-19)
  # shipped assimpTargets*.cmake naming the builder's
  # .../cvcpkg-prefix-assimp-*/lib/z.lib: _common/env-windows.ps1's
  # Invoke-CvcRewriteInstallPaths relocated only $env:CVC_INSTALL_DIR paths.
  # It now relocates $env:CVC_DEPS_PREFIX ones too, as the Unix helper does.
  cvc_revision: 7
  maintainer: "cvcpkg group"
  maintainer_email: "info@cvcpkg.org"
  maintainer_url: "https://cvcpkg.org"
  homepage: https://github.com/assimp/assimp
  license: BSD-3-Clause
  tags: [libraries]
  description: >-
    Open Asset Import Library (assimp) — a portable library to import and
    export a wide variety of 3D model/scene/mesh file formats through a
    single uniform data structure.  Provides geometry and mesh I/O.  Uses
    the cvcpkg zlib; other contrib dependencies (rapidjson, utf8cpp,
    minizip, poly2tri, etc.) remain vendored/bundled.

source:
  type: tarball
  url: https://github.com/assimp/assimp/archive/refs/tags/v6.0.5.tar.gz
  sha256: "edf3749559c2b7d1f758ffb66fc5bec62186221e623b7f2e8969f17ee46ecb6f"
  strip_components: 1

patches: []

depends:
  build: []
  runtime:
    - name: zlib
      version: "^1.3"
  host_tools:
    - cmake
    - ninja
    - pkg-config

build:
  matrix:
    - platform: linux
      script: build.sh
      env:
        CFLAGS: "-O2 -fPIC"
    - platform: macos
      script: build.sh
      env:
        MACOSX_DEPLOYMENT_TARGET: "13.0"
    - platform: freebsd
      script: build.sh
      env:
        CFLAGS: "-O2 -fPIC"
    - platform: openbsd
      script: build.sh
      env:
        CFLAGS: "-O2 -fPIC"
    - platform: netbsd
      script: build.sh
      env:
        CFLAGS: "-O2 -fPIC"
    - platform: haiku
      script: build.sh
      env:
        CFLAGS: "-O2 -fPIC"
    - platform: windows
      script: build.ps1
    - platform: wasm
      host_platform: linux
      script: build.sh
      env:
        CFLAGS: "-O2"
    # Threaded wasm: build.sh sources env-${CVC_PLATFORM}.sh, and
    # env-wasm-mt.sh injects -pthread (see recipes/_common/env-wasm-mt.sh).
    - platform: wasm-mt
      host_platform: linux
      script: build.sh
      env:
        CFLAGS: "-O2"

package:
  files:
    - lib/libassimp*
    - lib/assimp*
    # Only Windows puts anything under bin/ (the assimp DLL): ASSIMP_BUILD_ASSIMP_TOOLS
    # is OFF, so there is no assimp CLI on the other platforms.
    - { glob: "bin/assimp*", platforms: [windows] }
    - lib/pkgconfig/assimp.pc
    - lib/cmake/assimp*/
    - include/assimp/
  pkg_config:
    - assimp
  cmake_packages:
    - { name: assimp, targets: ["assimp::assimp"] }

abi:
  cxx_std: 17
