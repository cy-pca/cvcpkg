schema_version: 1
recipe:
  name: execnet-cp313
  upstream_version: "2.1.2"
  cvc_revision: 1

  maintainer: "cvcpkg group"
  maintainer_email: "info@cvcpkg.org"
  maintainer_url: "https://cvcpkg.org"
  homepage: https://pypi.org/project/execnet/
  license: "MIT"
  tags: [python, source]
  description: >-
    execnet 2.1.2 for CPython 3.13 — the cp313 column of
    cvcpkg's per-interpreter matrix (pure-Python, built from the PyPI sdist);
    generated by tools/gen_python_recipes.py.
    Built FROM SOURCE: cvcpkg fetches and sha256-verifies the PyPI sdist,
    and build.sh compiles the wheel with the prefix's own CPython 3.13 —
    no third-party prebuilt binary enters the bundle.

# From-source sdist, sha256 as published by PyPI for this exact version.
source:
  # Built from the source package execnet-src, which pins the upstream tarball
  # (https://files.pythonhosted.org/packages/bf/89/780e11f9588d9e7128a3f87788354c7946a9cbb1401ad38a48c4db9a4f07/execnet-2.1.2.tar.gz).
  type: package
  package: execnet-src

python:
  interpreter: python313
  abi: cp313

patches: []

depends:
  build:
    - name: execnet-src
      version: "==2.1.2"
    - name: python313
    # PEP-517 build backend, from this sdist's [build-system] requires.
    # --no-build-isolation means pip will NOT fetch it, so it has to be
    # in the build prefix already (build.sh bridges it onto sys.path).
    - name: hatchling-cp313
    - name: hatch-vcs-cp313
    - name: packaging-cp313
    - name: pathspec-cp313
    - name: pluggy-cp313
    - name: trove-classifiers-cp313
    - name: calver-cp313
  runtime:
    - name: python313
  host_tools:
    - python313

build:
  build_type_independent: true
  matrix:
    - platform: any
      script: build.sh
    - platform: windows
      script: build.ps1

package:
  files:
    - { glob: "lib/python3.13/site-packages/execnet/", platforms: [any] }
    - { glob: "lib/python3.13/site-packages/execnet-*.dist-info/", platforms: [any] }
    - { glob: "Lib/site-packages/execnet/", platforms: [windows] }
    - { glob: "Lib/site-packages/execnet-*.dist-info/", platforms: [windows] }
