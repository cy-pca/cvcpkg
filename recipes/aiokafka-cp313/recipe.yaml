schema_version: 1
recipe:
  name: aiokafka-cp313
  upstream_version: "0.14.0"
  cvc_revision: 1

  maintainer: "cvcpkg group"
  maintainer_email: "info@cvcpkg.org"
  maintainer_url: "https://cvcpkg.org"
  homepage: https://pypi.org/project/aiokafka/
  license: "Apache-2.0"
  tags: [python, source]
  description: >-
    aiokafka 0.14.0 for CPython 3.13 — the cp313 column of
    cvcpkg's per-interpreter matrix (C extensions compiled for cp313 from the PyPI sdist);
    generated by tools/gen_python_recipes.py.
    Built FROM SOURCE: cvcpkg fetches and sha256-verifies the PyPI sdist,
    and build.sh compiles the wheel with the prefix's own CPython 3.13 —
    no third-party prebuilt binary enters the bundle.

# From-source sdist, sha256 as published by PyPI for this exact version.
source:
  # Built from the source package aiokafka-src, which pins the upstream tarball
  # (https://files.pythonhosted.org/packages/89/5f/dfc1180fd22d1acdc91949ec36e97199c43742dacb057cb8efed3679ed04/aiokafka-0.14.0.tar.gz).
  type: package
  package: aiokafka-src

python:
  interpreter: python313
  abi: cp313

patches: []

depends:
  build:
    - name: aiokafka-src
      version: "==0.14.0"
    - name: python313
    - name: async-timeout-cp313
    - name: packaging-cp313
    - name: typing-extensions-cp313
    # PEP-517 build backend, from this sdist's [build-system] requires.
    # --no-build-isolation means pip will NOT fetch it, so it has to be
    # in the build prefix already (build.sh bridges it onto sys.path).
    - name: setuptools-cp313
    - name: cython-cp313
  runtime:
    - name: python313
    - name: async-timeout-cp313
    - name: packaging-cp313
    - name: typing-extensions-cp313
  host_tools:
    - python313

build:
  build_type_independent: true
  matrix:
    - platform: linux
      script: build.sh
    - platform: macos
      script: build.sh
    - platform: windows
      script: build.ps1

package:
  files:
    - { glob: "lib/python3.13/site-packages/aiokafka/", platforms: [linux, macos] }
    - { glob: "lib/python3.13/site-packages/*.dist-info/", platforms: [linux, macos] }
    - { glob: "Lib/site-packages/aiokafka/", platforms: [windows] }
    - { glob: "Lib/site-packages/*.dist-info/", platforms: [windows] }
