schema_version: 1
recipe:
  name: perl
  upstream_version: "5.40.2"
  # Bumped 1 -> 2: +cvc.1 is non-relocatable. It was configured without
  # -Duserelocatableinc, so @INC was baked to the build's throwaway scratch dir
  # and the bundle cannot even `use strict` once unpacked anywhere else — which
  # broke openssl fleet-wide (its Configure is a perl script). Published
  # variants are immutable, so the build.sh fix only ships behind a bump.
  # cvc.5: package.files matches the Windows tree.  Windows stages Strawberry
  # Perl under lib/strawberry/ with a bin/perl.cmd launcher, so the unix paths
  # (bin/perl, lib/5.40.2/, ...) matched nothing and the strict pack check
  # failed every Windows build (prod #19987, dev #18020).
  cvc_revision: 5
  maintainer: "cvcpkg group"
  maintainer_email: "info@cvcpkg.org"
  maintainer_url: "https://cvcpkg.org"
  homepage: https://www.perl.org/
  license: "Artistic-1.0-Perl OR GPL-1.0-or-later"
  tags: [tools, scripting]
  description: >-
    Perl 5 interpreter — a build-time host tool required by projects
    whose configure or code-generation steps invoke perl (e.g. OpenSSL
    and Qt). Provided so builds do not depend on the host's perl.

source:
  type: tarball
  url: https://www.cpan.org/src/5.0/perl-5.40.2.tar.gz
  sha256: "10d4647cfbb543a7f9ae3e5f6851ec49305232ea7621aed24c7cfbb0bef4b70d"
  strip_components: 1

patches: []

depends:
  build: []
  host_tools: []

build:
  build_type_independent: true
  matrix:
    - platform: linux
      script: build.sh
    - platform: macos
      script: build.sh
    - platform: freebsd
      script: build.sh
    - platform: openbsd
      script: build.sh
    - platform: netbsd
      script: build.sh
    - platform: windows
      script: build.ps1

package:
  files:
    - { glob: "bin/perl",       platforms: [linux, macos, freebsd, openbsd, netbsd] }
    - { glob: "bin/perl5.40.2", platforms: [linux, macos, freebsd, openbsd, netbsd] }
    # The real interpreter behind the OpenBSD relocation shim (build.sh).
    - { glob: "bin/perl.bin", platforms: [openbsd] }
    - { glob: "lib/5.40.2/",    platforms: [linux, macos, freebsd, openbsd, netbsd] }
    - { glob: "lib/site_perl/", platforms: [linux, macos, freebsd, openbsd, netbsd] }
    # Windows (build.ps1): Strawberry Perl portable plus a launcher.
    - { glob: "bin/perl.cmd",                     platforms: [windows] }
    - { glob: "lib/strawberry/perl/bin/perl.exe", platforms: [windows] }
    - { glob: "lib/strawberry/perl/lib/",         platforms: [windows] }

notes:
  - title: "Windows uses Strawberry Perl"
    platforms: [windows]
    description: >-
      Building Perl from the CPAN source on Windows is impractical, so the
      Windows target stages the official Strawberry Perl portable distribution
      (5.40.2.1, same 5.40.2 core) under lib/strawberry/ with a bin/perl.cmd
      launcher. The unix `source` tarball is fetched but unused on Windows.
