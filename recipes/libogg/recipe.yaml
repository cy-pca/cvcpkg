schema_version: 1
recipe:
  name: libogg
  upstream_version: "1.3.6"
  # Added wasm/wasi/cosmo entries.  libogg is the Ogg framing layer and touches
  # nothing outside caller-owned buffers — no files, threads, sockets or
  # assembly — so the only platform question is integer width, which configure
  # answers from the compiler instead of by running a probe.  The cross scripts
  # stay on autotools (libogg also ships a CMakeLists.txt) so the installed
  # layout keeps matching the package.files globs, which do not declare the
  # lib/cmake/Ogg/ directory the CMake path would add.  Unblocks libvorbis,
  # which runtime-depends on libogg and could not claim these targets until now.
  # cvc.3: Windows builds with MSYS path conversion on.  MSYS_NO_PATHCONV=1 made
  # libtool's `cmd //c echo` start an interactive cmd.exe that hung every libtool
  # link on the dev Windows builder (see build.ps1).  Other platforms unchanged.
  # cvc.4: Unix bundles ship no libtool .la (see build.sh).
  # cvc.5: Windows bundles ship no libtool .la either (see build.ps1).
  # cvc.6: Windows declares its MinGW toolchain (msys2/make/mingw-w64-gcc)
  # instead of using the builder's; see depends.build.
  cvc_revision: 6
  maintainer: "cvcpkg group"
  maintainer_email: "info@cvcpkg.org"
  maintainer_url: "https://cvcpkg.org"
  homepage: https://www.xiph.org/ogg/
  license: BSD-3-Clause
  tags: [libraries, multimedia, wasm, wasi]
  description: >-
    libogg — the Ogg bitstream and framing library.  Required at
    runtime by libvorbis.

source:
  # Built from the source package libogg-src, which pins the upstream tarball
  # (https://ftp.osuosl.org/pub/xiph/releases/ogg/libogg-1.3.6.tar.gz).
  type: package
  package: libogg-src

patches: []

depends:
  build:
    - name: libogg-src
      version: "==1.3.6"
    # Windows: the MinGW toolchain is a declared build dep, staged into the BUILD
    # prefix (build.ps1 puts its bin first on PATH), not whatever MSYS2 the
    # builder has.  The prod builder cmps-a91453 has an incomplete one: lame
    # and libmp3lame died there with "configure: error: no acceptable ld found
    # in $PATH" while they built on sandipaws.  As recipes/gmp.
    - name: msys2
      platforms: [windows]
    - name: make
      platforms: [windows]
    - name: mingw-w64-gcc
      platforms: [windows]
    - pkg-config
  runtime: []
  host_tools: []

build:
  matrix:
    - platform: linux
      script: build.sh
      env:
        CFLAGS: "-O2 -fPIC"
    - platform: macos
      script: build.sh
      env:
        MACOSX_DEPLOYMENT_TARGET: "13.0"
    - platform: freebsd
      script: build.sh
      env:
        CFLAGS: "-O2 -fPIC"
    - platform: openbsd
      script: build.sh
      env:
        CFLAGS: "-O2 -fPIC"
    - platform: netbsd
      script: build.sh
      env:
        CFLAGS: "-O2 -fPIC"
    - platform: haiku
      script: build.sh
      env:
        CFLAGS: "-O2 -fPIC"
    - platform: windows
      script: build.ps1
    - platform: wasm
      host_platform: linux
      script: build-wasm.sh
    - platform: wasi
      host_platform: linux
      script: build-wasi.sh
    - platform: cosmo
      host_platform: linux
      script: build-cosmo.sh

package:
  files:
    - lib/libogg*
    - lib/pkgconfig/ogg.pc
    - include/ogg/
    - bin/libogg-*.dll
  pkg_config:
    - ogg
