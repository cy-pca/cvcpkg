schema_version: 1
recipe:
  name: coverage-cp312
  upstream_version: "7.16.0"
  cvc_revision: 1

  maintainer: "cvcpkg group"
  maintainer_email: "info@cvcpkg.org"
  maintainer_url: "https://cvcpkg.org"
  homepage: https://pypi.org/project/coverage/
  license: "Apache-2.0"
  tags: [python, source]
  description: >-
    coverage 7.16.0 for CPython 3.12 — the cp312 column of
    cvcpkg's per-interpreter matrix (C extensions compiled for cp312 from the PyPI sdist);
    generated by tools/gen_python_recipes.py.
    Built FROM SOURCE: cvcpkg fetches and sha256-verifies the PyPI sdist,
    and build.sh compiles the wheel with the prefix's own CPython 3.12 —
    no third-party prebuilt binary enters the bundle.

# From-source sdist, sha256 as published by PyPI for this exact version.
source:
  # Built from the source package coverage-src, which pins the upstream tarball
  # (https://files.pythonhosted.org/packages/d1/f5/deb1a27aa20746c0278ac998c4179e272004699b2d33959ce020c5ac1615/coverage-7.16.0.tar.gz).
  type: package
  package: coverage-src

python:
  interpreter: python312
  abi: cp312

patches: []

depends:
  build:
    - name: coverage-src
      version: "==7.16.0"
    - name: python312
    # PEP-517 build backend, from this sdist's [build-system] requires.
    # --no-build-isolation means pip will NOT fetch it, so it has to be
    # in the build prefix already (build.sh bridges it onto sys.path).
    - name: setuptools-cp312
  runtime:
    - name: python312
  host_tools:
    - python312

provides:
  - coverage

build:
  build_type_independent: true
  matrix:
    - platform: linux
      script: build.sh
    - platform: macos
      script: build.sh
    - platform: windows
      script: build.ps1

package:
  files:
    - { glob: "lib/python3.12/site-packages/coverage/", platforms: [linux, macos] }
    - { glob: "lib/python3.12/site-packages/a1_coverage.pth", platforms: [linux, macos] }
    - { glob: "lib/python3.12/site-packages/coverage-*.dist-info/", platforms: [linux, macos] }
    - { glob: "bin/coverage", platforms: [linux, macos] }
    - { glob: "bin/coverage3", platforms: [linux, macos] }
    - { glob: "Lib/site-packages/coverage/", platforms: [windows] }
    - { glob: "Lib/site-packages/a1_coverage.pth", platforms: [windows] }
    - { glob: "Lib/site-packages/coverage-*.dist-info/", platforms: [windows] }
