schema_version: 1
recipe:
  name: optax-cp312
  upstream_version: "0.2.8"
  cvc_revision: 1

  maintainer: "cvcpkg group"
  maintainer_email: "info@cvcpkg.org"
  maintainer_url: "https://cvcpkg.org"
  homepage: https://pypi.org/project/optax/
  license: "Apache-2.0"
  tags: [python, source]
  description: >-
    optax 0.2.8 for CPython 3.12 — the cp312 column of
    cvcpkg's per-interpreter matrix (pure-Python, built from the PyPI sdist);
    generated by tools/gen_python_recipes.py.
    Built FROM SOURCE: cvcpkg fetches and sha256-verifies the PyPI sdist,
    and build.sh compiles the wheel with the prefix's own CPython 3.12 —
    no third-party prebuilt binary enters the bundle.

# From-source sdist, sha256 as published by PyPI for this exact version.
source:
  # Built from the source package optax-src, which pins the upstream tarball
  # (https://files.pythonhosted.org/packages/8c/f9/e3d11ae6f298ee941a0690e353a323d158ba5dedc436e75621c310845c5c/optax-0.2.8.tar.gz).
  type: package
  package: optax-src

python:
  interpreter: python312
  abi: cp312

patches: []

depends:
  build:
    - name: optax-src
      version: "==0.2.8"
    - name: python312
    - name: absl-py-cp312
    - name: jax-cp312
    - name: jaxlib-cp312
    - name: numpy-cp312
    # PEP-517 build backend, from this sdist's [build-system] requires.
    # --no-build-isolation means pip will NOT fetch it, so it has to be
    # in the build prefix already (build.sh bridges it onto sys.path).
    - name: flit-core-cp312
  runtime:
    - name: python312
    - name: absl-py-cp312
    - name: jax-cp312
    - name: jaxlib-cp312
    - name: numpy-cp312
  host_tools:
    - python312

build:
  build_type_independent: true
  matrix:
    - platform: any
      script: build.sh

package:
  files:
    - lib/python3.12/site-packages/optax/
    - lib/python3.12/site-packages/optax-*.dist-info/
