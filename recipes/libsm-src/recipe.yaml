  upstream_version: "1.2.6"
  cvc_revision: 1
  maintainer: cvcpkg group
  maintainer_email: info@cvcpkg.org
  maintainer_url: https://cvcpkg.org
  homepage: https://www.x.org/
  license: MIT
  tags: [source]
  description: >-
    The unmodified upstream source of libsm 1.2.6: its release tarball,
    verified against the sha256 below and staged at src/libsm-src/.  The libsm
    recipe builds from it (source.type package), so the tarball is fetched
    once, from xorg.freedesktop.org, and every other build of libsm -- another
