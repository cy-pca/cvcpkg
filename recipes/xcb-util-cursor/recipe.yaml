schema_version: 1
recipe:
  name: xcb-util-cursor
  upstream_version: "0.1.6"
  cvc_revision: 2
  maintainer: "cvcpkg group"
  maintainer_email: "info@cvcpkg.org"
  maintainer_url: "https://cvcpkg.org"
  homepage: https://xcb.freedesktop.org/
  license: MIT
  tags: [libraries, x11, graphics]
  description: >-
    XCB cursor library (xcb-cursor) — Xcursor-compatible, used by Qt's xcb plugin.

source:
  # Built from the source package xcb-util-cursor-src, which pins the upstream tarball
  # (https://xorg.freedesktop.org/releases/individual/xcb/xcb-util-cursor-0.1.6.tar.xz).
  type: package
  package: xcb-util-cursor-src

patches: []

depends:
  build:
    - name: xcb-util-cursor-src
      version: "==0.1.6"
    - pkg-config
  runtime:
    - name: libxcb
    - name: xcb-util-image
    - name: xcb-util-renderutil
  host_tools: []

package:
  files:
    - lib/
    - include/
    - share/

build:
  matrix:
    - platform: linux
      script: build.sh
    - platform: freebsd
      script: build.sh
    - platform: openbsd
      script: build.sh
    - platform: netbsd
      script: build.sh
