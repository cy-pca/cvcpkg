schema_version: 1
recipe:
  name: lame
  upstream_version: "3.100"
  # cvc.2: Windows builds with MSYS path conversion on.  MSYS_NO_PATHCONV=1 made
  # libtool's `cmd //c echo` start an interactive cmd.exe that hung every libtool
  # link on the dev Windows builder (see build.ps1).  Other platforms unchanged.
  # cvc.3: Windows: configure without iconv and termcap (frontend parse.c
  # needs langinfo.h under HAVE_ICONV; termcap from the ambient MinGW did not link).
  # cvc.4: Windows declares its MinGW toolchain (msys2/make/mingw-w64-gcc)
  # instead of using the builder's; see depends.build.
  cvc_revision: 4
  maintainer: "cvcpkg group"
  maintainer_email: "info@cvcpkg.org"
  maintainer_url: "https://cvcpkg.org"
  homepage: https://lame.sourceforge.net/
  license: LGPL-2.0-or-later
  tags: [tools, multimedia, audio]
  description: >-
    lame — the LAME MP3 encoder command-line tool.  Built from the
    same source tarball as the libmp3lame recipe; only the lame
    frontend binary is installed.  Requires libmp3lame at both build
    and runtime.

source:
  # Built from the source package lame-src, which pins the upstream tarball
  # (https://sourceforge.net/projects/lame/files/lame/3.100/lame-3.100.tar.gz/download).
  type: package
  package: lame-src

patches: []

depends:
  # bin/lame links the static libmp3lame built from this same tarball, so the
  # packaged libmp3lame is neither a build nor a runtime dependency.
  build:
    - name: lame-src
      version: "==3.100"
    # Windows: the MinGW toolchain is a declared build dep, staged into the BUILD
    # prefix (build.ps1 puts its bin first on PATH), not whatever MSYS2 the
    # builder has.  The prod builder cmps-a91453 has an incomplete one: lame
    # and libmp3lame died there with "configure: error: no acceptable ld found
    # in $PATH" while they built on sandipaws.  As recipes/gmp.
    - name: msys2
      platforms: [windows]
    - name: make
      platforms: [windows]
    - name: mingw-w64-gcc
      platforms: [windows]
  runtime: []
  host_tools: []

build:
  matrix:
    - platform: linux
      script: build.sh
    - platform: macos
      script: build.sh
      env:
        MACOSX_DEPLOYMENT_TARGET: "13.0"
    - platform: freebsd
      script: build.sh
    - platform: openbsd
      script: build.sh
    - platform: netbsd
      script: build.sh
    - platform: windows
      script: build.ps1

package:
  files:
    - bin/lame*
