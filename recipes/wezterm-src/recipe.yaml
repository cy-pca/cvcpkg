schema_version: 1
recipe:
  name: wezterm-src
  upstream_version: "20240203-110809-5046fc22"
  cvc_revision: 1
  maintainer: cvcpkg group
  maintainer_email: info@cvcpkg.org
  maintainer_url: https://cvcpkg.org
  homepage: https://wezterm.org/
  license: MIT
  tags: [source]
  description: >-
    The unmodified upstream source of WezTerm 20240203-110809-5046fc22: the
    release's wezterm-<tag>-src.tar.gz, verified against the sha256 below and
    staged at src/wezterm-src/. It is the tarball WezTerm asks distributions to
    build from: it carries the C submodules (freetype, harfbuzz, cairo,
    fontconfig) and a .tag file with the version, which the GitHub archive of
    the tag lacks. The wezterm recipe builds from it (source.type package), so
    the tarball is fetched once, from github.com, and every other build of
    wezterm installs this package from the catalog instead. Crates are not in
    it: each crate Cargo.lock names is a cvcpkg package of its own
    (crate-<name>--<version>, gathered by the wezterm-crates set), shared with
    every other Rust recipe that pins the same version.
source:
  type: tarball
  # sha256 as published beside it, wezterm-20240203-110809-5046fc22-src.tar.gz.sha256.
  url: https://github.com/wez/wezterm/releases/download/20240203-110809-5046fc22/wezterm-20240203-110809-5046fc22-src.tar.gz
  sha256: "df60b1081d402b5a9239cc4cef16fc699eab68bbbeac9c669cb5d991a6010b2c"
  strip_components: 1
patches: []
depends:
  build: []
  runtime: []
  host_tools: []
build:
  build_type_independent: true
  matrix:
    - platform: any
      script: build.sh
package:
  files:
    - src/wezterm-src/
