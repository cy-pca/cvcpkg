schema_version: 1
recipe:
  name: openblas
  upstream_version: "0.3.28"
  # Bumped 3 -> 5: drop the Fortran LAPACK on Linux (NOFORTRAN/C_LAPACK, as the
  # BSDs already did). The shared
  # libopenblas.so carried a DT_NEEDED on libgfortran.so.5, which cvcpkg does
  # not ship, so linking against this package failed on any host without
  # gfortran installed — and failed as "No BLAS library detected", because a
  # consumer's pkg-config probe resolves openblas.pc and only then fails its
  # link check. Blocked the from-source numpy build fleet-wide. The optimized
  # assembly BLAS kernels are unaffected; only LAPACK falls back to the
  # bundled C reference. See build.sh for the rejected -static-libgfortran
  # attempt and the Phase-10 follow-up.
  # Bumped 5 -> 6: added the macOS build. Deferring to Accelerate there left
  # numpy-cp3XX advertising macOS while build-depending on a package that had no
  # macOS build, so the claim could never resolve — and Intel/Apple-Silicon Macs
  # got no OpenBLAS at all. macOS uses the same NOFORTRAN/C_LAPACK path as the
  # BSDs, plus USE_OPENMP=OFF: Apple clang ships no libomp, so -fopenmp fails.
  # Bumped 7 -> 8: Fortran LAPACK back on linux. cvcpkg now builds gfortran
  # (build dependency) and ships its runtime as gcc-runtime (runtime
  # dependency), so libopenblas.so's libgfortran/libquadmath/libgomp are
  # installed beside it instead of expected from the host. package.files drops
  # the top-level include/*.h entries: OpenBLAS never installs headers there, so
  # the strict-globs check failed every pack on every platform.
  # Bumped 8 -> 9: NUM_THREADS=64 on every platform (build.sh, build.ps1).
  # Unset, OpenBLAS sized its thread limit from the builder's cores: +cvc.8's
  # linux bundle reported MAX_THREADS=4, so no machine got more than 4 threads.
  cvc_revision: 9
  maintainer: "cvcpkg group"
  maintainer_email: "info@cvcpkg.org"
  maintainer_url: "https://cvcpkg.org"
  description: "OpenBLAS — an optimized BLAS (Basic Linear Algebra Subprograms) library."
  homepage: https://www.openblas.net/
  license: BSD-3-Clause
  tags: [math]

source:
  type: tarball
  url: https://github.com/OpenMathLib/OpenBLAS/releases/download/v0.3.28/OpenBLAS-0.3.28.tar.gz
  sha256: "f1003466ad074e9b0c8d421a204121100b0751c96fc6fcf3d1456bd12f8a00a1"
  strip_components: 1

patches: []

depends:
  build:
    - cmake
    - ninja
    # The Fortran compiler for LAPACK (build.sh's linux branch).
    - name: gfortran
      version: "^11.4"
      platforms: [linux]
    # $ORIGIN run paths, so libopenblas.so loads gcc-runtime's libgfortran.
    - name: patchelf
      platforms: [linux]
  runtime:
    # libgfortran, libquadmath and libgomp, which libopenblas.so NEEDs on linux.
    - name: gcc-runtime
      version: "^11.4"
      platforms: [linux]
  host_tools: []

build:
  matrix:
    - platform: linux
      script: build.sh
      env:
        CFLAGS: "-O2 -fPIC"
    # macOS could defer to the Accelerate framework, but a system framework is
    # not a cvcpkg package: dependents can only express "I need openblas", so
    # every macOS consumer (numpy) was left with an unresolvable build dep.
    # Shipping our own keeps the dependency graph honest and identical across
    # platforms.
    - platform: macos
      script: build.sh
      env:
        CFLAGS: "-O2 -fPIC"
        MACOSX_DEPLOYMENT_TARGET: "13.0"
    - platform: freebsd
      script: build.sh
      env:
        CFLAGS: "-O2 -fPIC"
    - platform: openbsd
      script: build.sh
      env:
        CFLAGS: "-O2 -fPIC"
    - platform: netbsd
      script: build.sh
      env:
        CFLAGS: "-O2 -fPIC"
    - platform: windows
      script: build.ps1

package:
  files:
    - lib/libopenblas*
    - lib/openblas*
    - lib/cmake/OpenBLAS/
    - lib/pkgconfig/openblas*
    # Every header: OpenBLAS installs them under include/openblas/ only (its
    # src/CMakeLists.txt appends /openblas to CMAKE_INSTALL_INCLUDEDIR), which
    # is the includedir openblas.pc and OpenBLASConfig.cmake hand consumers.
    - include/openblas/
  cmake_packages:
    - { name: OpenBLAS, targets: ["OpenBLAS::OpenBLAS"] }

abi:
  cxx_std: 17
