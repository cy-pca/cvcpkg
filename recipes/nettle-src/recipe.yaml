schema_version: 1
recipe:
  name: nettle-src
  upstream_version: "3.10.1"
  cvc_revision: 1
  maintainer: cvcpkg group
  maintainer_email: info@cvcpkg.org
  maintainer_url: https://cvcpkg.org
  homepage: https://www.lysator.liu.se/~nisse/nettle/
  license: LGPL-3.0-or-later OR GPL-2.0-or-later
  tags: [source]
  description: >-
    The unmodified upstream source of nettle 3.10.1: its release tarball,
    verified against the sha256 below and staged at src/nettle-src/.  The nettle
    recipe builds from it (source.type package), so the tarball is fetched
    once, from ftp.gnu.org, and every other build of nettle -- another
    platform, a builder that cannot reach ftp.gnu.org, a user building from
    source -- installs this package from the catalog instead.  Generated by
    tools/make_source_package.py.

source:
