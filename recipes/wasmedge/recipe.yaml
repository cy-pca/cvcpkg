schema_version: 1
recipe:
  name: wasmedge
  upstream_version: "0.17.0"
  # Bumped 6 -> 7: Windows builds against the cvcpkg llvm18 (a windows build
  # dependency) instead of a Chocolatey LLVM, and so get LLVM AOT for the first
  # time -- the Chocolatey install has no LLVM CMake configs, so build.ps1 had
  # always fallen back to WASMEDGE_USE_LLVM=OFF.  The shared Windows build now
  # links one monolithic wasmedge.dll (BUILD_SHARED_LIBS=OFF) instead of the
  # per-component DLLs that failed with LNK2019.
  cvc_revision: 7
  maintainer: "cvcpkg group"
  maintainer_email: "info@cvcpkg.org"
  maintainer_url: "https://cvcpkg.org"
  homepage: https://wasmedge.org/
  license: Apache-2.0
  tags: [wasm, runtime]
  description: >
    WasmEdge — high-performance WASM runtime with WASI-NN support
    for ML inference inside Wasm modules.  CMake-based C++ project.

source:
  type: tarball
  url: https://github.com/WasmEdge/WasmEdge/archive/refs/tags/0.17.0.tar.gz
  sha256: "7db6052113447efb6901746a7ca24e1a22cb9fe1edcca623b0307e7a5c5216ae"
  strip_components: 1

depends:
  build:
    - cmake
    - ninja
    # LLVM + LLD for WasmEdge's AOT compiler (-DWASMEDGE_USE_LLVM=ON).  The
    # llvm18 bundle is LLVM's static .lib component libraries, linked into
    # wasmedge.dll, so it is not needed at run time.  linux/macos still use a
    # host LLVM (see toolchain.llvm below).
    - name: llvm18
      version: "^18.1"
      platforms: [windows]
  runtime:
    # LLVMSupport links zlib (llvm18 is built with LLVM_ENABLE_ZLIB=FORCE_ON),
    # so the wasmedge.dll that links LLVM in imports zlib1.dll.
    - name: zlib
      version: "^1.3"
      platforms: [windows]
  host_tools: []

toolchain:
  llvm:
    min_version: "14"
    max_version: "21"
    recommended: "18"
    notes: >
      LLVM (with LLD) is required for ahead-of-time (AOT) compilation
      support (-DWASMEDGE_USE_LLVM=ON).  Without it WasmEdge still
      builds but can only interpret or JIT-compile Wasm modules.
      Where the build scripts find LLVM on each platform:
        Linux  — /usr/lib/llvm-{ver} (apt versioned installs)
        macOS  — $(brew --prefix llvm@{ver}) (Homebrew keg)
        Windows — the cvcpkg llvm18 recipe, a windows build dependency,
                  found in the dependency prefix (lib/cmake/llvm and
                  lib/cmake/lld); nothing on the host is used.  Shared
                  builds only; static Windows builds are built without
                  LLVM (see notes).
      On Linux/macOS versions 14-21 are scanned in priority order (18
      preferred).  If no versioned install is found, llvm-config on PATH
      is used as a final fallback.
    install:
      apt: "llvm-18-dev lld-18 liblld-18-dev"
      brew: "llvm@18"
  gcc:
    min_version: "11"
  clang:
    min_version: "14"

build:
  matrix:
    - platform: linux
      script: build.sh
      env:
        CXXFLAGS: "-O2 -fPIC -std=c++17"
    - platform: macos
      script: build.sh
      env:
        MACOSX_DEPLOYMENT_TARGET: "13.0"
    - platform: windows
      script: build.ps1

package:
  files:
    - lib/libwasmedge*
    - lib/wasmedge*
    # WasmEdge installs no CMake package config (lib/cmake/wasmedge/ was
    # declared but never produced).  The Windows shared build's bin/wasmedge.dll
    # is not declared here because a static Windows build has none (package.files
    # cannot scope by link); build.ps1 asserts it instead.
    - include/wasmedge/
  cmake_packages:
    - { name: wasmedge, targets: ["wasmedge::wasmedge"] }

abi:
  cxx_std: 17

notes:
  - title: "-Werror breaks GCC 13+ builds"
    platforms: [linux]
    description: >
      WasmEdge 0.17.0 hardcodes -Werror in cmake/Helper.cmake.
      GCC 13 emits -Warray-bounds and -Wmaybe-uninitialized warnings
      on valid code in coredump.cpp and other files, causing build
      failures.  The patch 0001-disable-Werror-for-gcc13-compat.patch
      replaces -Werror with -Wno-error.
  - title: "CLI tools fail to link (shared lib build)"
    platforms: [linux]
    description: >
      The wasmedge and wasmedgec CLI tool targets fail to link when
      building with -DWASMEDGE_BUILD_SHARED_LIB=ON due to unresolved
      symbols across the internal shared library split.  This is an
      upstream issue in 0.17.0.  We build with -DWASMEDGE_BUILD_TOOLS=OFF
      since the C API shared library (libwasmedge.so) is what downstream
      projects consume.
  - title: "Static library bundling broken"
    platforms: [linux]
    description: >
      Building with -DWASMEDGE_BUILD_STATIC_LIB=ON fails because the
      CMake bundling step tries to 'ar -x' shared .so files into a
      combined static archive.  Disabled via -DWASMEDGE_BUILD_STATIC_LIB=OFF.
  - title: "Windows: shared-lib split DLLs do not link"
    platforms: [windows]
    description: >
      In 0.17.0 the per-target component DLLs (wasmedgeLoaderFileMgr,
      etc.) that BUILD_SHARED_LIBS=ON produces reference internal helpers
      (WasmEdge::MMap, WasmEdge::Allocator) that are only defined in
      system-specific translation units and never marked dllexport,
      producing LNK2019 at link time.  The shared Windows build therefore
      passes -DBUILD_SHARED_LIBS=OFF: the components are static
      libraries, linked into one wasmedge.dll (upstream's own Windows
      configuration).
  - title: "Windows: LLVM AOT from the cvcpkg llvm18"
    platforms: [windows]
    description: >
      The shared Windows build enables AOT against the cvcpkg llvm18
      (18.1.8) and smoke-tests it: wasmedgec compiles a small module to a
      native .dll, which wasmedge then runs in AOT mode.  Static Windows
      builds are built without LLVM (interpreter only): WasmEdge's
      static-archive bundling of LLVM (cmake/Helper.cmake) hardcodes Unix
      archive names, and a static cvcpkg build uses the static CRT (/MT)
      while llvm18 is built against the DLL CRT (/MD).  llvm18's exported
      LLVMDebugInfoPDB target names the DIA SDK's diaguids.lib by the
      absolute Visual Studio 2022 Enterprise path of the runner that built
      it, so the build needs that same path -- windows-2022 runners have it.
