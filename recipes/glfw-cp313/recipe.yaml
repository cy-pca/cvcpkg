schema_version: 1
recipe:
  name: glfw-cp313
  upstream_version: "2.11.0"
  cvc_revision: 1

  maintainer: "cvcpkg group"
  maintainer_email: "info@cvcpkg.org"
  maintainer_url: "https://cvcpkg.org"
  homepage: https://pypi.org/project/glfw/
  license: "MIT"
  tags: [python, source]
  description: >-
    pyGLFW 2.11.0 (PyPI `glfw`, `import glfw`) for CPython 3.13: ctypes
    bindings for GLFW 3, which mujoco.viewer and MuJoCo's default Renderer
    context import.  Built from the PyPI sdist.  Unlike upstream's wheels it
    bundles no GLFW binary: it loads the prefix's own, from cvcpkg's glfw
    recipe (a runtime dependency).

# Hand-written, not generated by tools/gen_python_recipes.py: the generator
# emits no patches, and this column needs prefer-cvcpkg-glfw.patch (below).
# Keep glfw-cp312 in step.
source:
  # Built from the source package pyglfw-src, which pins the upstream tarball
  # (https://files.pythonhosted.org/packages/b2/89/fa9cb2611314b84ffa68d76f154e1e508971d6e402b14bd2152684e35e5d/glfw-2.11.0.tar.gz).
  type: package
  package: pyglfw-src

python:
  interpreter: python313
  abi: cp313

# pyGLFW finds GLFW by globbing host library directories for the NEWEST copy
# (Linux/macOS) or by ctypes.CDLL('glfw3.dll'), which finds <prefix>\bin only
# through the prefix's cvcpkg-dll-directories.pth (Windows).  The patch loads
# the prefix's libglfw first, found from the package's own location and then
# sys.base_prefix; upstream's search stays the fallback.  See its header.
patches:
  - prefer-cvcpkg-glfw.patch

depends:
  build:
    - name: pyglfw-src
      version: "==2.11.0"
    - name: python313
    # The import check loads the library, so it is a build edge too.
    - name: glfw
    # PEP-517 backend: a setup.py-only sdist builds with setuptools' legacy
    # backend.  --no-build-isolation means pip will NOT fetch it, so it has to
    # be in the build prefix already (build.sh bridges it onto sys.path).
    - name: setuptools-cp313
    - name: wheel-cp313
  runtime:
    - name: python313
    # GLFW 3.4, shared: lib/libglfw.so.3, lib/libglfw.3.dylib, bin/glfw3.dll.
    - name: glfw
  host_tools:
    - python313

build:
  build_type_independent: true
  matrix:
    - platform: any
      script: build.sh
    - platform: windows
      script: build.ps1

package:
  files:
    - { glob: "lib/python3.13/site-packages/glfw/", platforms: [any] }
    - { glob: "lib/python3.13/site-packages/*.dist-info/", platforms: [any] }
    - { glob: "Lib/site-packages/glfw/", platforms: [windows] }
    - { glob: "Lib/site-packages/*.dist-info/", platforms: [windows] }
