schema_version: 1
recipe:
  name: cssselect2-cp313
  upstream_version: "0.9.0"
  # cvc.3 (freethreaded-leak republish): the published cvc.2 any/noarch bundle
  # installs to lib/python3.13t/site-packages -- a python313t (before its cvc.7) shadowed
  # python3.13 when it was built -- so python3.13 cannot import it and cp313 builds that
  # depend on it fail (aiokafka-cp313 on async-timeout-cp313, 2026-10-13).  Rebuilding
  # lays it under lib/python3.13/.  Found by auditing every published cp313 bundle.
  cvc_revision: 3

  maintainer: "cvcpkg group"
  maintainer_email: "info@cvcpkg.org"
  maintainer_url: "https://cvcpkg.org"
  homepage: https://pypi.org/project/cssselect2/
  license: "BSD-3-Clause"
  tags: [python, source]
  description: >-
    cssselect2 0.9.0 for CPython 3.13 — the cp313 column of
    cvcpkg's per-interpreter matrix (pure-Python, built from the PyPI sdist);
    generated by tools/gen_python_recipes.py.
    Built FROM SOURCE: cvcpkg fetches and sha256-verifies the PyPI sdist,
    and build.sh compiles the wheel with the prefix's own CPython 3.13 —
    no third-party prebuilt binary enters the bundle.

# From-source sdist, sha256 as published by PyPI for this exact version.
source:
  # Built from the source package cssselect2-src, which pins the upstream tarball
  # (https://files.pythonhosted.org/packages/e0/20/92eaa6b0aec7189fa4b75c890640e076e9e793095721db69c5c81142c2e1/cssselect2-0.9.0.tar.gz).
  type: package
  package: cssselect2-src

python:
  interpreter: python313
  abi: cp313

patches: []

depends:
  build:
    - name: cssselect2-src
      version: "==0.9.0"
    - name: python313
    - name: tinycss2-cp313
    - name: webencodings-cp313
    # PEP-517 build backend, from this sdist's [build-system] requires.
    # --no-build-isolation means pip will NOT fetch it, so it has to be
    # in the build prefix already (build.sh bridges it onto sys.path).
    - name: flit-core-cp313
  runtime:
    - name: python313
    - name: tinycss2-cp313
    - name: webencodings-cp313
  host_tools:
    - python313

build:
  build_type_independent: true
  matrix:
    - platform: any
      script: build.sh
    - platform: windows
      script: build.ps1

package:
  files:
    - { glob: "lib/python3.13/site-packages/cssselect2/", platforms: [any] }
    - { glob: "lib/python3.13/site-packages/cssselect2-*.dist-info/", platforms: [any] }
    - { glob: "Lib/site-packages/cssselect2/", platforms: [windows] }
    - { glob: "Lib/site-packages/*.dist-info/", platforms: [windows] }
