schema_version: 1
recipe:
  name: libopus
  upstream_version: "1.6.1"
  # cvc.3: added wasm/wasi/cosmo entries.  Opus is buffers-in/buffers-out with
  # no files, threads or sockets; the only thing that blocked a cross target was
  # its architecture-specific code, and configure exposes exactly the switches
  # to drop it — --disable-asm, --disable-rtcd, --disable-intrinsics.  rtcd is
  # the important one: runtime CPU dispatch reaches for `cpuid` on x86 and
  # getauxval(AT_HWCAP) on ARM, neither of which exists in a wasm module.  Those
  # switches are also off on cosmo, where they *would* work — an APE is supposed
  # to be the run-anywhere artefact, and opus's x86 path compiles per-ISA
  # translation units with -msse4.1/-mavx2 (same call recipes/libpng makes).
  # cvc.4: depend on GNU make so the OpenBSD build stops falling back to bmake,
  # which cannot parse libopus's automake-generated Makefile.
  # cvc.5: Windows builds with MSYS path conversion on.  MSYS_NO_PATHCONV=1 made
  # libtool's `cmd //c echo` start an interactive cmd.exe that hung every libtool
  # link on the dev Windows builder (see build.ps1).  Other platforms unchanged.
  # cvc.6: Windows package.files names the DLL libtool builds (bin/libopus-0.dll);
  # strict packing refused the old bin/opus-*.dll glob on the prod builder.
  # cvc.7: Windows declares its MinGW toolchain (msys2/make/mingw-w64-gcc)
  # instead of using the builder's; see depends.build.
  cvc_revision: 7
  maintainer: "cvcpkg group"
  maintainer_email: "info@cvcpkg.org"
  maintainer_url: "https://cvcpkg.org"
  homepage: https://opus-codec.org/
  license: BSD-3-Clause
  tags: [libraries, multimedia, audio, wasm, wasi]
  description: >-
    Opus — a totally open, royalty-free, highly versatile audio codec.
    Standardised as RFC 6716.  Used by FFmpeg (--enable-libopus),
    WebRTC, and many streaming applications.

source:
  # Built from the source package libopus-src, which pins the upstream tarball
  # (https://ftp.osuosl.org/pub/xiph/releases/opus/opus-1.6.1.tar.gz).
  type: package
  package: libopus-src

patches: []

depends:
  build:
    - name: libopus-src
      version: "==1.6.1"
    # Windows: the MinGW toolchain is a declared build dep, staged into the BUILD
    # prefix (build.ps1 puts its bin first on PATH), not whatever MSYS2 the
    # builder has.  The prod builder cmps-a91453 has an incomplete one: lame
    # and libmp3lame died there with "configure: error: no acceptable ld found
    # in $PATH" while they built on sandipaws.  As recipes/gmp.
    - name: msys2
      platforms: [windows]
    - name: mingw-w64-gcc
      platforms: [windows]
    - pkg-config
    # GNU make: libopus's automake Makefile uses GNU-make syntax that OpenBSD's
    # bmake cannot parse ("Need an operator in 'yes'").  Staging GNU make puts it
    # on PATH (build.sh prepends the deps prefix) ahead of the system bmake so
    # the build works across the BSDs, matching gmp/mpfr.
    - make
  runtime: []
  host_tools: []

build:
  matrix:
    - platform: linux
      script: build.sh
      env:
        CFLAGS: "-O2 -fPIC"
    - platform: macos
      script: build.sh
      env:
        MACOSX_DEPLOYMENT_TARGET: "13.0"
    - platform: freebsd
      script: build.sh
      env:
        CFLAGS: "-O2 -fPIC"
    - platform: openbsd
      script: build.sh
      env:
        CFLAGS: "-O2 -fPIC"
    - platform: netbsd
      script: build.sh
      env:
        CFLAGS: "-O2 -fPIC"
    - platform: windows
      script: build.ps1
    - platform: wasm
      host_platform: linux
      script: build-wasm.sh
    - platform: wasi
      host_platform: linux
      script: build-wasi.sh
    - platform: cosmo
      host_platform: linux
      script: build-cosmo.sh

package:
  files:
    - lib/libopus*
    - lib/pkgconfig/opus.pc
    - include/opus/
    - bin/libopus-*.dll    # upstream's MinGW DLL is libopus-0.dll
  pkg_config:
    - opus
