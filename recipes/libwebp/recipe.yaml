schema_version: 1
recipe:
  name: libwebp
  upstream_version: "1.5.0"
  cvc_revision: 3
  maintainer: "cvcpkg group"
  maintainer_email: "info@cvcpkg.org"
  maintainer_url: "https://cvcpkg.org"
  description: "libwebp — a library to encode and decode images in the WebP format."
  homepage: https://developers.google.com/speed/webp/
  license: BSD-3-Clause
  tags: [graphics, io, wasm, wasi]

source:
  # Built from the source package libwebp-src, which pins the upstream tarball
  # (https://storage.googleapis.com/downloads.webmproject.org/releases/webp/libwebp-1.5.0.tar.gz).
  type: package
  package: libwebp-src

patches: []

depends:
  build:
    - name: libwebp-src
      version: "==1.5.0"
    - cmake
    - ninja
  runtime: []
  host_tools: []

build:
  matrix:
    - platform: linux
      script: build.sh
      env:
        CFLAGS: "-O2 -fPIC"
    - platform: macos
      script: build.sh
      env:
        MACOSX_DEPLOYMENT_TARGET: "13.0"
    - platform: freebsd
      script: build.sh
      env:
        CFLAGS: "-O2 -fPIC"
    - platform: openbsd
      script: build.sh
      env:
        CFLAGS: "-O2 -fPIC"
    - platform: netbsd
      script: build.sh
      env:
        CFLAGS: "-O2 -fPIC"
    - platform: windows
      script: build.ps1
    - platform: wasm
      host_platform: linux
      script: build-wasm.sh
    # Threaded wasm: same build script, -pthread injected by env-wasm.sh's
    # CVC_WASM_THREADS hook.  A separate platform because emscripten cannot
    # link single-threaded objects into a shared-memory build.
    - platform: wasm-mt
      host_platform: linux
      script: build-wasm.sh
      env:
        CVC_WASM_THREADS: "1"
    - platform: wasm
      host_platform: windows
      script: build-wasm.ps1
    - platform: wasi
      host_platform: linux
      script: build-wasi.sh
    - platform: wasi
      host_platform: windows
      script: build-wasi.ps1
    - platform: cosmo
      host_platform: linux
      script: build-cosmo.sh

package:
  files:
    - lib/libwebp*
    - lib/libsharpyuv*
    - lib/webp*
    - lib/sharpyuv*
    # libwebp's CMake installs its package config under share/, on every
    # platform (lib/cmake/WebP/ matched nothing and failed packing).
    - share/WebP/cmake/
    - lib/pkgconfig/libwebp*.pc
    - lib/pkgconfig/libsharpyuv.pc
    - include/webp/
  cmake_packages:
    - { name: WebP, targets: ["WebP::webp", "WebP::webpdecoder", "WebP::webpdemux", "WebP::libwebpmux", "WebP::sharpyuv"] }

abi:
  cxx_std: 17
