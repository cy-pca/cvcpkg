schema_version: 1
recipe:
  name: restrictedpython-cp312
  upstream_version: "8.4"
  cvc_revision: 1

  maintainer: "cvcpkg group"
  maintainer_email: "info@cvcpkg.org"
  maintainer_url: "https://cvcpkg.org"
  homepage: https://pypi.org/project/restrictedpython/
  license: "ZPL-2.1"
  tags: [python, source]
  description: >-
    restrictedpython 8.4 for CPython 3.12 — the cp312 column of
    cvcpkg's per-interpreter matrix (pure-Python, built from the PyPI sdist);
    generated by tools/gen_python_recipes.py.
    Built FROM SOURCE: cvcpkg fetches and sha256-verifies the PyPI sdist,
    and build.sh compiles the wheel with the prefix's own CPython 3.12 —
    no third-party prebuilt binary enters the bundle.

# From-source sdist, sha256 as published by PyPI for this exact version.
source:
  # Built from the source package restrictedpython-src, which pins the upstream tarball
  # (https://files.pythonhosted.org/packages/48/50/9302f9a3419ba1956d85b5680c26fd90b32b8064b06c17af31a62e87d936/restrictedpython-8.4.tar.gz).
  type: package
  package: restrictedpython-src

python:
  interpreter: python312
  abi: cp312

patches: []

depends:
  build:
    - name: restrictedpython-src
      version: "==8.4"
    - name: python312
    # PEP-517 build backend, from this sdist's [build-system] requires.
    # --no-build-isolation means pip will NOT fetch it, so it has to be
    # in the build prefix already (build.sh bridges it onto sys.path).
    - name: setuptools-cp312
    - name: wheel-cp312
  runtime:
    - name: python312
  host_tools:
    - python312

build:
  build_type_independent: true
  matrix:
    - platform: any
      script: build.sh
    - platform: windows
      script: build.ps1

package:
  files:
    - { glob: "lib/python3.12/site-packages/RestrictedPython/", platforms: [any] }
    - { glob: "lib/python3.12/site-packages/*.dist-info/", platforms: [any] }
    - { glob: "Lib/site-packages/RestrictedPython/", platforms: [windows] }
    - { glob: "Lib/site-packages/*.dist-info/", platforms: [windows] }
