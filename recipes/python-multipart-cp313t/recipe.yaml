schema_version: 1
recipe:
  name: python-multipart-cp313t
  upstream_version: "0.0.32"
  cvc_revision: 1

  maintainer: "cvcpkg group"
  maintainer_email: "info@cvcpkg.org"
  maintainer_url: "https://cvcpkg.org"
  homepage: https://pypi.org/project/python-multipart/
  license: "Apache-2.0"
  tags: [python, source]
  description: >-
    python-multipart 0.0.32 for CPython 3.13t — the cp313t column of
    cvcpkg's per-interpreter matrix (pure-Python, built from the PyPI sdist);
    generated by tools/gen_python_recipes.py.
    Built FROM SOURCE: cvcpkg fetches and sha256-verifies the PyPI sdist,
    and build.sh compiles the wheel with the prefix's own CPython 3.13t —
    no third-party prebuilt binary enters the bundle.
    The cp313t column installs under the free-threaded (no-GIL)
    interpreter and its import check runs with the GIL disabled.

# From-source sdist, sha256 as published by PyPI for this exact version.
source:
  type: tarball
  url: https://files.pythonhosted.org/packages/5b/42/55c32bb9b12693c092ad250a0e82edb5b31ddeda6eb772de5f308b3804ad/python_multipart-0.0.32.tar.gz
  sha256: "be54b7f3fa167bb83e4fcd936b887b708f4e57fe75911c02aebf53efaf8d938e"
  strip_components: 1

python:
  interpreter: python313t
  abi: cp313t

patches: []

depends:
  build:
    - name: python313t
    # PEP-517 build backend, from this sdist's [build-system] requires.
    # --no-build-isolation means pip will NOT fetch it, so it has to be
    # in the build prefix already (build.sh bridges it onto sys.path).
    - name: hatchling-cp313t
    - name: packaging-cp313t
    - name: pathspec-cp313t
    - name: pluggy-cp313t
    - name: trove-classifiers-cp313t
    - name: calver-cp313t
  runtime:
    - name: python313t
  host_tools:
    - python313t

build:
  build_type_independent: true
  matrix:
    - platform: any
      script: build.sh
    - platform: windows
      script: build.ps1

package:
  files:
    - { glob: "lib/python3.13t/site-packages/multipart/", platforms: [any] }
    - { glob: "lib/python3.13t/site-packages/*.dist-info/", platforms: [any] }
    - { glob: "Lib/site-packages/multipart/", platforms: [windows] }
    - { glob: "Lib/site-packages/*.dist-info/", platforms: [windows] }
