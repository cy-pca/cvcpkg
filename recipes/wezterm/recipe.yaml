schema_version: 1
recipe:
  name: wezterm
  # The last stable release. WezTerm has shipped only nightlies since
  # (February 2024). Its release -src tarball is what WezTerm asks
  # distributions to build from (it carries the C submodules and a .tag file
  # with this version), and the tag is immutable; a newer main commit would
  # mean assembling the source tree from git plus submodules. It has what
  # cvcpkg wants WezTerm for: the kitty graphics protocol (on by default,
  # enable_kitty_graphics = true) and DEC Sixel. The one thing later WezTerm
  # fixed that matters here -- on Windows, a ConPTY that lets those escapes
  # through -- is a separate component, the `conpty` package (see the notes).
  upstream_version: "20240203-110809-5046fc22"
  # 1 -> 2: built from source, every crate a cvcpkg package (cvc.1 repackaged
  # upstream's release binaries); the linux build also covers arm64.
  cvc_revision: 2
  maintainer: "cvcpkg group"
  maintainer_email: "info@cvcpkg.org"
  maintainer_url: "https://cvcpkg.org"
  homepage: https://wezterm.org/
  # WezTerm is MIT. The Windows build bundles ANGLE (BSD-3-Clause) and Mesa's
  # llvmpipe opengl32.dll (MIT); every build embeds fonts under the SIL OFL
  # 1.1, and links crates under their own (mostly MIT and/or Apache-2.0)
  # licences. share/doc/wezterm/ carries WezTerm's, the fonts' and ANGLE's
  # licence texts, from the source tree.
  license: MIT
  tags: [tools, terminal]
  description: >-
    WezTerm -- a GPU-accelerated terminal emulator and multiplexer that speaks
    the kitty graphics protocol, DEC Sixel and iTerm2 inline images. The
    20240203 stable release, built from its source with the cvcpkg Rust
    toolchain, every crate a cvcpkg package (wezterm-crates): wezterm, wezterm-gui
    and wezterm-mux-server in bin/. A terminal for testing programs that draw
    images into the terminal (libcvc's `arigl --terminal`), without a system
    install.

# Everything comes from cvcpkg: the source tree from wezterm-src (the
# release's -src tarball), every crate from its own crate-<name>--<version>
# package (the wezterm-crates set), the toolchain from rust, libraries from
# the runtime dependencies, Microsoft's ConPTY from conpty. The build itself
# downloads nothing (cargo --offline).
source:
  type: package
  package: wezterm-src

# Two changes a February 2024 tree needs to build and work with Rust 1.90.
# Both change Cargo.lock; wezterm-crates was generated from the patched one.
#
#  0001  Cargo.lock pins time 0.3.31, which no longer compiles on Rust >= 1.80
#        (type inference, E0282). This moves time to 0.3.36 and time-macros to
#        0.2.18 (adding their num-conv dependency), as
#        `cargo update -p time --precise 0.3.36` does, with crates.io
#        checksums. Nothing else in the lockfile changes.
#  0002  Upstream commit 36ff6d5 ("deps: update glium", 2024-02-06, three days
#        after the tag), verbatim: glium 0.31 -> 0.34. Built with Rust 1.90
#        against glium 0.31, the OpenGL and Software front ends draw every
#        glyph as a solid block (Windows) or nothing at all (linux, under
#        Xvfb), and no image appears -- wezterm/wezterm#5990 and #6005,
#        the same breakage nixpkgs hit after its own Rust 1.80 lockfile fix.
#        The WebGpu front end does not use glium and was unaffected.
patches:
  - patches/0001-cargo-lock-time-0.3.36.patch
  - patches/0002-deps-update-glium-36ff6d5.patch

depends:
  build:
    - name: wezterm-src
      version: "==20240203-110809-5046fc22"
    # The 645 crates of the patched Cargo.lock (644 from crates.io, one git
    # dependency), each its own package, and the cargo source replacement
    # that points cargo at them (share/cargo/sets/wezterm-crates/).
    - name: wezterm-crates
      version: "==20240203-110809-5046fc22"
    # cargo and rustc; the build scripts refuse any outside the cvcpkg prefixes.
    - name: rust
    - name: pkg-config
      platforms: [linux]
    # The relocation pass gives lib/wezterm/* an $ORIGIN/.. RUNPATH with it.
    - name: patchelf
      platforms: [linux]
  # On linux, the DT_NEEDED set of the binaries, minus glibc and libgcc_s:
  # wezterm and wezterm-mux-server need zlib and OpenSSL 3; wezterm-gui adds
  # X11 (xcb, xcb-util, xcb-image, X11-xcb, xkbcommon-x11), Wayland (client,
  # egl) and fontconfig. Plus data: xkeyboard-config's share/X11/xkb, which
  # with libx11's share/X11/locale is what bin/* point xkbcommon at (see the
  # notes). EGL / OpenGL / Vulkan are dlopened from the host's graphics driver.
  # On Windows, OpenSSL's DLLs and the conpty package's conpty.dll +
  # OpenConsole.exe, which wezterm-gui loads from its own directory; the rest
  # is linked in or ships in bin\. On macOS, OpenSSL; the rest is the OS.
  runtime:
    - name: zlib
      platforms: [linux]
    - name: openssl
    - name: conpty
      platforms: [windows]
    - name: libxcb
      platforms: [linux]
    - name: xcb-util
      platforms: [linux]
    - name: xcb-util-image
      platforms: [linux]
    - name: libx11
      platforms: [linux]
    - name: xkbcommon
      platforms: [linux]
    - name: xkbcommon-x11
      platforms: [linux]
    - name: wayland
      platforms: [linux]
    - name: fontconfig
      platforms: [linux]
    - name: xkeyboard-config
      platforms: [linux]
  host_tools: []

build:
  build_type_independent: true
  matrix:
    - platform: windows
      script: build.ps1
    - platform: linux
      script: build.sh
    - platform: macos
      script: build.sh

package:
  files:
    # Windows: flat in bin\, the layout of upstream's portable zip (see the notes).
    - { glob: "bin/wezterm.exe", platforms: [windows] }
    - { glob: "bin/wezterm-gui.exe", platforms: [windows] }
    - { glob: "bin/wezterm-mux-server.exe", platforms: [windows] }
    - { glob: "bin/strip-ansi-escapes.exe", platforms: [windows] }
    - { glob: "bin/libEGL.dll", platforms: [windows] }
    - { glob: "bin/libGLESv2.dll", platforms: [windows] }
    - { glob: "bin/mesa/", platforms: [windows] }
    # Linux and macOS: the binaries in lib/wezterm/, launchers for them in bin/.
    - { glob: "bin/wezterm", platforms: [linux, macos] }
    - { glob: "bin/wezterm-gui", platforms: [linux, macos] }
    - { glob: "bin/wezterm-mux-server", platforms: [linux, macos] }
    - { glob: "bin/strip-ansi-escapes", platforms: [linux, macos] }
    - { glob: "lib/wezterm/", platforms: [linux, macos] }
    - { glob: "share/applications/", platforms: [linux] }
    - { glob: "share/icons/", platforms: [linux] }
    - { glob: "share/metainfo/", platforms: [linux] }
    - { glob: "share/bash-completion/", platforms: [linux, macos] }
    - { glob: "share/zsh/", platforms: [linux, macos] }
    - { glob: "share/fish/", platforms: [linux, macos] }
    - share/doc/wezterm/

test:
  script: test.sh

toolchain:
  note: >-
    cargo + rustc 1.90.0 from the cvcpkg `rust` recipe (the build scripts
    refuse any other), `cargo build --release --locked --offline` of the
    wezterm, wezterm-gui, wezterm-mux-server and strip-ansi-escapes packages
    with wezterm-gui's distro-defaults feature, crates from the build
    prefix's share/cargo/crates/ (the wezterm-crates set). The bundled C (freetype, harfbuzz, cairo, libssh, libssh2, Lua)
    is compiled by the cc crate with gcc (linux), clang (macOS) or MSVC
    (Windows, CRT linked statically). WezTerm's minimum Rust is 1.71
    (ci/check-rust-version.sh).

notes:
  - title: "Hermetic: every crate is a cvcpkg package"
    description: >-
      The release tarball carries Cargo.lock but no crate sources. Each crate
      it pins is a package of its own, crate-<name>--<version> (generated by
      tools/make_crate_packages.py, docs/rust-crates.md): the .crate file
      from static.crates.io checked against the Cargo.lock checksum, staged
      at share/cargo/crates/<name>-<version>/. The one git dependency,
      xcb-imdkit-rs, is crate-git-xcb-imdkit--215ce4b0. The wezterm-crates set
      depends on all 645, so they land in the build prefix, and ships the
      cargo source replacement; the build scripts write it into a cargo home
      of their own and run cargo with --offline, so the build never reaches
      crates.io or github.com, and a missing crate is an error. Another Rust
      recipe that pins the same crate version reuses the same package.
  - title: "A February 2024 tree on Rust 1.90: three fixes"
    description: >-
      WezTerm's own CI built this release with the Rust of its day, and three
      things no longer work with 1.90. time 0.3.31 fails type inference
      (E0282) on Rust >= 1.80, so patches/0001 moves it to 0.3.36 (with
      time-macros 0.2.18 and num-conv), the smallest change that compiles.
      glium 0.31 compiles but renders nothing usable through the OpenGL and
      Software front ends (glyphs as solid blocks, no images;
      wezterm/wezterm#5990), so patches/0002 is upstream's own glium 0.34
      commit from three days after the tag. On Windows, libgit2-sys 0.14.2
      (behind git2 0.16, used by wezterm-version's build script) never asks
      for advapi32.lib and relied on std to link it, which Rust 1.90's std
      does not; build.ps1 adds it to every link through RUSTFLAGS (see
      there). Both patches change Cargo.lock, and wezterm-crates was generated
      from the patched one. The rendering defect showed in the
      probe screenshots (README.md); test.sh now checks pixels on Windows so
      that a build like it fails.
  - title: "Windows: Microsoft's ConPTY 1.25 instead of the bundled 2024 one"
    platforms: [windows]
    description: >-
      WezTerm runs Windows programs through ConPTY (conpty.dll +
      OpenConsole.exe beside wezterm-gui.exe), which parses what the program
      writes and re-emits it. The ConPTY in WezTerm 20240203's source tree and
      zip (assets/windows/conhost, February 2024) drops APC and DCS sequences,
      so kitty graphics and Sixel from a native Windows program -- arigl
      --terminal, say -- never reach WezTerm: the pictures, and window titles
      set with OSC 2, are simply missing. So that ConPTY is not shipped:
      the `conpty` runtime dependency installs conpty.dll and OpenConsole.exe
      from Microsoft.Windows.Console.ConPTY 1.25.260930003 into the same bin\,
      which passes them through. Checked on Windows 11:
      with the bundled ConPTY a kitty query (a=q) from the pane times out;
      with 1.25 it is answered, and kitty pictures and Sixel draw
      (recipes/wezterm/README.md). WezTerm's main branch bundles ConPTY
      1.22.250204002 for the same reason; Microsoft publishes no release of
      that build, and both behave the same here. Programs on the other side of `wezterm ssh`
      or a mux connection never touch ConPTY.
  - title: "Windows layout: flat in bin\\, as upstream's portable zip"
    platforms: [windows]
    description: >-
      wezterm.exe starts wezterm-gui.exe from its own directory, and
      wezterm-gui.exe loads conpty.dll + OpenConsole.exe, ANGLE's
      libEGL.dll / libGLESv2.dll and the software renderer mesa\opengl32.dll
      from there as well, so everything goes in bin\ beside OpenSSL's DLLs
      and ConPTY's (the openssl and conpty runtime dependencies). ANGLE and Mesa are not built here:
      they are prebuilt DLLs WezTerm keeps in its source tree
      (assets/windows), which upstream's own build ships too. Everything else
      links the CRT statically. Mind the DLL names: an executable in the same
      bin\ that imports libEGL.dll or libGLESv2.dll gets WezTerm's ANGLE build.
      No cvcpkg package ships either today.
  - title: "OpenSSL is the prefix's, on every platform"
    description: >-
      openssl-sys is pointed at the prefix (OPENSSL_DIR) with
      OPENSSL_NO_VENDOR set. On Windows and macOS that overrides the
      `vendored` feature WezTerm's async_ossl turns on there, which would
      otherwise compile the OpenSSL 3.2.0 that openssl-src 300.2.1 carries;
      the build links the openssl recipe's OpenSSL 3 instead, as linux always
      did.
  - title: "Isolate a test run from a running WezTerm"
    description: >-
      `wezterm start` hands the new window to a wezterm-gui that is already
      running (for the same --class) instead of starting one, so on a desktop
      where WezTerm is open a test silently runs in THAT process -- possibly
      another version. Use `wezterm start --always-new-process` (and
      `wezterm -n` / `--config-file` to keep ~/.wezterm.lua out of it).
  - title: "kitty Unicode placeholders are not supported"
    description: >-
      WezTerm draws kitty images placed directly (a=T / a=p) but ignores
      U=1: an a=T,U=1 transmission is shown as an ordinary placement at the
      cursor, and the U+10EEEE placeholder cells print as missing-glyph
      boxes. Neither this release nor WezTerm's main branch parses the U key.
      A program that places kitty images through placeholders (arigl) should
      use Sixel or direct kitty placement on WezTerm. Details and a probe
      script: recipes/wezterm/README.md.
  - title: "wezterm-gui --version"
    description: >-
      Prints "wezterm-gui someone forgot to call assign_version_info" in this
      release (an upstream bug, fixed after it); `wezterm --version` and
      `wezterm-mux-server --version` print the version, and so does
      `wezterm.version` in the GUI's Lua.
  - title: "Linux: X11/Wayland libraries from cvcpkg, GPU driver from the host"
    platforms: [linux]
    description: >-
      The binaries are staged in lib/wezterm/. Their X11, Wayland,
      xkbcommon, fontconfig, OpenSSL 3 and zlib libraries are this package's
      runtime dependencies (the build sees only the prefix's pkg-config
      files) and resolve from the prefix through an $ORIGIN-relative
      RUNPATH. libEGL.so.1 / libGL.so.1 / libvulkan.so.1 are dlopened at run
      time and come from the host's graphics driver. With no GPU, use
      `--config 'front_end="Software"'` (CPU rasterisation); a --config value
      is a Lua expression, so the quotes are part of it.
  - title: "Linux: bin/* set XKB_CONFIG_ROOT and XLOCALEDIR"
    platforms: [linux]
    description: >-
      wezterm-gui builds keymaps and a Compose table with libxkbcommon, which
      looks for keymap data and Compose files at directories fixed when it
      was compiled. In cvcpkg's xkbcommon those are paths on the machine that
      built it, so without help wezterm-gui dies at start ("no keymap" or a
      segfault on Wayland, "Failed to acquire compose table" on X11). The bin/
      launchers therefore export XKB_CONFIG_ROOT=<prefix>/share/X11/xkb (from
      xkeyboard-config) and XLOCALEDIR=<prefix>/share/X11/locale (from
      libx11) unless they are already set, then exec lib/wezterm/<name>.
      Programs started inside the terminal inherit both variables. Run
      lib/wezterm/* directly only with both set.
  - title: "macOS: binaries, not an app bundle; not built yet"
    platforms: [macos]
    description: >-
      build.sh builds macOS the way it builds linux: the binaries in
      lib/wezterm/ with bin/ launchers, OpenSSL from the prefix, everything
      else from the OS. There is no WezTerm.app (upstream assembles and signs
      one for its zip); wezterm-gui runs as a plain executable, without a Dock
      icon of its own. cvcpkg's relocation pass re-signs what it rewrites.
      There is no macOS host here, so it has not been built or run yet.
  - title: "Built and tested"
    description: >-
      windows-x86_64 (Windows 11, MSVC 14.44) and linux-x86_64 (Ubuntu 22.04
      under WSL, WSLg) are built from source -- offline, from wezterm-src's
      vendored crates -- installed, packed and tested by this recipe, each
      including the window test (Windows also the pixel check), and the
      kitty/Sixel probe renders on both (on linux under cvcpkg's Xvfb). The
      cargo build takes about 13 minutes on Windows (10 jobs) and 10 to 20 on
      linux (8 jobs) on a 20-thread laptop. linux-arm64 and macOS run the
      same build.sh but have not been built: there is no arm64 or macOS host
      here.
