schema_version: 1
recipe:
  name: gmp-src
  upstream_version: "6.3.0"
  cvc_revision: 1
  maintainer: cvcpkg group
  maintainer_email: info@cvcpkg.org
  maintainer_url: https://cvcpkg.org
  homepage: https://gmplib.org/
  license: LGPL-3.0-or-later
  tags: [source]
  description: >-
    The unmodified upstream source of gmp 6.3.0: its release tarball,
    verified against the sha256 below and staged at src/gmp-src/.  The gmp
    recipe builds from it (source.type package), so the tarball is fetched
    once, from gmplib.org, and every other build of gmp -- another
    platform, a builder that cannot reach gmplib.org, a user building from
    source -- installs this package from the catalog instead.  Generated by
    tools/make_source_package.py.

source:
  type: tarball
  url: https://gmplib.org/download/gmp/gmp-6.3.0.tar.xz
  mirror: https://ftp.gnu.org/gnu/gmp/gmp-6.3.0.tar.xz
  sha256: "a3c2b80201b89e68616f4ad30bc66aee4927c3ce50e33929ca819d5c43538898"
  strip_components: 1

patches: []

depends:
  build: []
  runtime: []
  host_tools: []

build:
  build_type_independent: true
  matrix:
    - platform: any
      script: build.sh

package:
  files:
    - src/gmp-src/
