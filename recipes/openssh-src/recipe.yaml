schema_version: 1
recipe:
  name: openssh-src
  upstream_version: "10.4.1"
  cvc_revision: 1
  maintainer: cvcpkg group
  maintainer_email: info@cvcpkg.org
  maintainer_url: https://cvcpkg.org
  homepage: https://www.openssh.com/
  license: SSH-OpenSSH
  tags: [source]
  description: >-
    The unmodified upstream source of openssh 10.4.1: its release tarball,
    verified against the sha256 below and staged at src/openssh-src/.  The
    openssh recipe builds from it (source.type package), so the tarball is
    fetched once, from cdn.openbsd.org, and every other build of openssh --
    another platform, a builder that cannot reach cdn.openbsd.org, a user
    building from source -- installs this package from the catalog instead.
    Generated by tools/make_source_package.py.

source:
