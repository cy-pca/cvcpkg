schema_version: 1
recipe:
  name: jaxtyping-cp312
  upstream_version: "0.3.11"
  cvc_revision: 2

  maintainer: "cvcpkg group"
  maintainer_email: "info@cvcpkg.org"
  maintainer_url: "https://cvcpkg.org"
  homepage: https://pypi.org/project/jaxtyping/
  license: "MIT"
  tags: [python, source]
  description: >-
    jaxtyping 0.3.11 for CPython 3.12 — the cp312 column of
    cvcpkg's per-interpreter matrix (pure-Python, built from the PyPI sdist);
    generated by tools/gen_python_recipes.py.
    Built FROM SOURCE: cvcpkg fetches and sha256-verifies the PyPI sdist,
    and build.sh compiles the wheel with the prefix's own CPython 3.12 —
    no third-party prebuilt binary enters the bundle.

# From-source sdist, sha256 as published by PyPI for this exact version.
source:
  # Built from the source package jaxtyping-src, which pins the upstream tarball
  # (https://files.pythonhosted.org/packages/91/c1/091b8852bd7cbf50bd655543c8506033cf4029300c67f8c176c1286879a9/jaxtyping-0.3.11.tar.gz).
  type: package
  package: jaxtyping-src

python:
  interpreter: python312
  abi: cp312

patches: []

depends:
  build:
    - name: jaxtyping-src
      version: "==0.3.11"
    - name: python312
    - name: wadler-lindig-cp312
    # PEP-517 build backend, from this sdist's [build-system] requires.
    # --no-build-isolation means pip will NOT fetch it, so it has to be
    # in the build prefix already (build.sh bridges it onto sys.path).
    - name: hatchling-cp312
    - name: packaging-cp312
    - name: pathspec-cp312
    - name: pluggy-cp312
    - name: trove-classifiers-cp312
    - name: calver-cp312
  runtime:
    - name: python312
    - name: wadler-lindig-cp312
  host_tools:
    - python312

build:
  build_type_independent: true
  matrix:
    - platform: any
      script: build.sh
    - platform: windows
      script: build.ps1

package:
  files:
    - { glob: "lib/python3.12/site-packages/jaxtyping/", platforms: [any] }
    - { glob: "lib/python3.12/site-packages/jaxtyping-*.dist-info/", platforms: [any] }
    - { glob: "Lib/site-packages/jaxtyping/", platforms: [windows] }
    - { glob: "Lib/site-packages/jaxtyping-*.dist-info/", platforms: [windows] }
