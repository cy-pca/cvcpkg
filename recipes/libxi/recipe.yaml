schema_version: 1
recipe:
  name: libxi
  upstream_version: "1.8.3"
  cvc_revision: 2
  maintainer: "cvcpkg group"
  maintainer_email: "info@cvcpkg.org"
  maintainer_url: "https://cvcpkg.org"
  homepage: https://www.x.org/
  license: MIT
  tags: [libraries, x11, graphics]
  description: >-
    X Input Extension client library (Xi).

source:
  # Built from the source package libxi-src, which pins the upstream tarball
  # (https://xorg.freedesktop.org/releases/individual/lib/libXi-1.8.3.tar.xz).
  type: package
  package: libxi-src

patches: []

depends:
  build:
    - name: libxi-src
      version: "==1.8.3"
    - pkg-config
    - name: xorgproto
  runtime:
    - name: libx11
    - name: libxext
    - name: libxfixes
  host_tools: []

package:
  files:
    - lib/
    - include/
    - share/

build:
  matrix:
    - platform: linux
      script: build.sh
    - platform: freebsd
      script: build.sh
    - platform: openbsd
      script: build.sh
    - platform: netbsd
      script: build.sh
