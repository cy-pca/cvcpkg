schema_version: 1
recipe:
  name: xcb-util-image
  upstream_version: "0.4.1"
  # Bumped 2 -> 3: the libraries' RPATH was "RIGIN" -- make read the $ORIGIN that build.sh
  # put in LDFLAGS as $O + "RIGIN". build.sh now spells it for make
  # (cvc_make_origin_rpath), so the RPATH is $ORIGIN.
  cvc_revision: 3
  maintainer: "cvcpkg group"
  maintainer_email: "info@cvcpkg.org"
  maintainer_url: "https://cvcpkg.org"
  homepage: https://xcb.freedesktop.org/
  license: MIT
  tags: [libraries, x11, graphics]
  description: >-
    XCB image convenience library (xcb-image).

source:
  # Built from the source package xcb-util-image-src, which pins the upstream tarball
  # (https://xorg.freedesktop.org/releases/individual/xcb/xcb-util-image-0.4.1.tar.xz).
  type: package
  package: xcb-util-image-src

patches: []

depends:
  build:
    - name: xcb-util-image-src
      version: "==0.4.1"
    - pkg-config
  runtime:
    - name: libxcb
    - name: xcb-util
  host_tools: []

package:
  files:
    - lib/
    - include/

build:
  matrix:
    - platform: linux
      script: build.sh
    - platform: freebsd
      script: build.sh
    - platform: openbsd
      script: build.sh
    - platform: netbsd
      script: build.sh
