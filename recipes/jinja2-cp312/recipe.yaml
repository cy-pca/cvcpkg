schema_version: 1
recipe:
  name: jinja2-cp312
  upstream_version: "3.1.6"
  cvc_revision: 1

  maintainer: "cvcpkg group"
  maintainer_email: "info@cvcpkg.org"
  maintainer_url: "https://cvcpkg.org"
  homepage: https://pypi.org/project/jinja2/
  license: "BSD-3-Clause"
  tags: [python, source]
  description: >-
    jinja2 3.1.6 for CPython 3.12 — the cp312 column of
    cvcpkg's per-interpreter matrix (pure-Python, built from the PyPI sdist);
    generated by tools/gen_python_recipes.py.
    Built FROM SOURCE: cvcpkg fetches and sha256-verifies the PyPI sdist,
    and build.sh compiles the wheel with the prefix's own CPython 3.12 —
    no third-party prebuilt binary enters the bundle.

# From-source sdist, sha256 as published by PyPI for this exact version.
source:
  # Built from the source package jinja2-src, which pins the upstream tarball
  # (https://files.pythonhosted.org/packages/df/bf/f7da0350254c0ed7c72f3e33cef02e048281fec7ecec5f032d4aac52226b/jinja2-3.1.6.tar.gz).
  type: package
  package: jinja2-src

python:
  interpreter: python312
  abi: cp312

patches: []

depends:
  build:
    - name: jinja2-src
      version: "==3.1.6"
    - name: python312
    - name: markupsafe-cp312
    # PEP-517 build backend, from this sdist's [build-system] requires.
    # --no-build-isolation means pip will NOT fetch it, so it has to be
    # in the build prefix already (build.sh bridges it onto sys.path).
    - name: flit-core-cp312
  runtime:
    - name: python312
    - name: markupsafe-cp312
  host_tools:
    - python312

build:
  build_type_independent: true
  matrix:
    - platform: any
      script: build.sh
    - platform: windows
      script: build.ps1

package:
  files:
    - { glob: "lib/python3.12/site-packages/jinja2/", platforms: [any] }
    - { glob: "lib/python3.12/site-packages/jinja2-*.dist-info/", platforms: [any] }
    - { glob: "Lib/site-packages/jinja2/", platforms: [windows] }
    - { glob: "Lib/site-packages/*.dist-info/", platforms: [windows] }
