schema_version: 1
recipe:
  name: pillow-cp312
  upstream_version: "12.3.0"
  # HAND-CONVERTED from the generated shape (since 11.1.0+cvc.2).  The
  # generated recipe declared NO native-library edges, so the sdist build found
  # zlib / libjpeg only when a sibling build happened to leave them in the
  # shared prefix (or fell through to the builder's system copies) — and its
  # `Image.new()` check passes with ZERO codecs compiled in, so a silently
  # PNG-less Pillow would have shipped green.  The grl-snam scene tooling
  # reads navmask.png rasters through PIL; codec support is the entire point.
  # 12.3.0 is a new upstream version, so the revision restarts at 1.
  cvc_revision: 1
  maintainer: "cvcpkg group"
  maintainer_email: "info@cvcpkg.org"
  maintainer_url: "https://cvcpkg.org"
  homepage: https://pypi.org/project/pillow/
  license: "MIT-CMU"
  tags: [python, source, imaging]
  description: >-
    Pillow 12.3.0 for CPython 3.12 (cp312), BUILT FROM SOURCE against cvcpkg's
    own zlib, libjpeg-turbo, libtiff, freetype and libwebp — every codec the
    grl-snam imaging path needs, compiled with `-C <feature>=enable` so
    a missing library FAILS the build instead of silently dropping the codec.
    The extensions link the prefix libraries by soname and resolve them at
    runtime out of the SAME activated prefix via an $ORIGIN-relative RUNPATH —
    no auditwheel-vendored pillow.libs/ copy.  Hand-converted from the
    generated recipe (native-library edges, feature pinning and the rpath pass
    are things the generator cannot infer from [build-system] requires).

# From-source sdist (NOT source.type python_wheel): cvcpkg fetches + sha256-
# verifies this tarball and extracts it (strip_components) to CVC_SOURCE_DIR;
# build.sh compiles the wheel with the prefix's own interpreter.
source:
  type: tarball
  url: https://files.pythonhosted.org/packages/1c/3d/bb7fca845737cf9d7dbde16ed1843984665ff2e0a518f5db43e77ec540b9/pillow-12.3.0.tar.gz
  sha256: "3b8182a766685eaa002637e28b4ec8d6b18819a0c71f579bf0dbaa5830297cce"
  strip_components: 1

python:
  interpreter: python312
  abi: cp312

patches: []

depends:
  build:
    - name: python312
    # PEP-517 build backend + its [build-system] requires (--no-build-isolation:
    # bridged onto sys.path by build.sh from CVC_BUILD_PREFIX).  pybind11 is
    # new in Pillow 12: setup.py imports pybind11.setup_helpers.ParallelCompile
    # to compile the extensions in parallel.
    - name: setuptools-cp312
    - name: pybind11-cp312
    # Feature libraries, discovered hermetically (PKG_CONFIG_LIBDIR pinned to
    # the prefixes + per-feature *_ROOT env; platform guessing disabled).
    - name: zlib
    - name: libjpeg-turbo
    - name: tiff
    - name: freetype
    - name: libwebp
    # Flat closures of tiff (lerc/zstd/xz + zlib/libjpeg-turbo/libwebp above)
    # and freetype (libpng/bzip2 + zlib above): cvcpkg staging is flat, so a
    # recipe declares what its libraries' NEEDED entries resolve against.
    - name: lerc
    - name: zstd
    - name: xz
    - name: libpng
    - name: bzip2
  runtime:
    - name: python312
    # The compiled extensions link these by soname and resolve them from the
    # merged prefix at import (see the $ORIGIN RUNPATH pass in build.sh).
    - name: zlib
    - name: libjpeg-turbo
    - name: tiff
    - name: freetype
    - name: libwebp
    - name: lerc
    - name: zstd
    - name: xz
    - name: libpng
    - name: bzip2
  host_tools:
    - python312
    - pkg-config
    # Stamps the relocatable $ORIGIN RUNPATH into the extension .so on ELF
    # platforms (Linux); macOS relocation is cvc_rewrite_install_paths'.
    - patchelf

build:
  # The Python ABI is stable across cvcpkg build types; build once, optimized.
  build_type_independent: true
  # linux/macos/windows only — matching the columns actually built and
  # verified.  The BSDs are NOT claimed: nothing has built Pillow there yet,
  # and an unverified platform column is a phantom claim.
  matrix:
    - platform: linux
      script: build.sh
    - platform: macos
      script: build.sh
    - platform: windows
      script: build.ps1

package:
  # From-source build linking prefix libraries: the payload is PIL/ + its
  # dist-info only — build.sh asserts no vendored *.libs/ directory exists.
  # Each install layout is scoped to the platforms that produce it (as the
  # generated columns do): the pack-time declared-files check fails on an
  # entry that matches nothing, so the unscoped Windows Lib/ globs broke
  # `cvcpkg pack` on linux.
  files:
    - { glob: "lib/python3.12/site-packages/PIL/", platforms: [linux, macos] }
    - { glob: "lib/python3.12/site-packages/pillow-*.dist-info/", platforms: [linux, macos] }
    - { glob: "Lib/site-packages/PIL/", platforms: [windows] }
    - { glob: "Lib/site-packages/*.dist-info/", platforms: [windows] }
