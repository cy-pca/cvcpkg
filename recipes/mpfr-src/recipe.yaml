schema_version: 1
recipe:
  name: mpfr-src
  upstream_version: "4.2.1"
  cvc_revision: 1
  maintainer: cvcpkg group
  maintainer_email: info@cvcpkg.org
  maintainer_url: https://cvcpkg.org
  homepage: https://www.mpfr.org/
  license: LGPL-3.0-or-later
  tags: [source]
  description: >-
    The unmodified upstream source of mpfr 4.2.1: its release tarball, verified
    against the sha256 below and staged at src/mpfr-src/.  The mpfr recipe
    builds from it (source.type package), so the tarball is fetched once, from
    www.mpfr.org, and every other build of mpfr -- another platform, a builder
    that cannot reach www.mpfr.org, a user building from source -- installs this
    package from the catalog instead.  Generated by
    tools/make_source_package.py.

source:
  type: tarball
  url: https://www.mpfr.org/mpfr-4.2.1/mpfr-4.2.1.tar.xz
  mirror: https://ftp.gnu.org/gnu/mpfr/mpfr-4.2.1.tar.xz
  sha256: "277807353a6726978996945af13e52829e3abd7a9a5b7fb2793894e18f1fcbb2"
  strip_components: 1

patches: []

depends:
  build: []
  runtime: []
  host_tools: []

build:
  build_type_independent: true
  matrix:
    - platform: any
      script: build.sh

package:
  files:
    - src/mpfr-src/
