schema_version: 1
recipe:
  name: opusfile
  upstream_version: "0.12"
  cvc_revision: 1
  maintainer: "cvcpkg group"
  maintainer_email: "info@cvcpkg.org"
  maintainer_url: "https://cvcpkg.org"
  homepage: https://opus-codec.org/
  license: BSD-3-Clause
  tags: [libraries, audio, multimedia]
  description: >-
    opusfile — a high-level API for decoding and seeking within .opus
    files (Ogg-encapsulated Opus streams).  Used by the allegro5 audio
    addon (acodec).  Built with --disable-http to avoid an OpenSSL
    dependency.

source:
  # Built from the source package opusfile-src, which pins the upstream tarball
  # (https://downloads.xiph.org/releases/opus/opusfile-0.12.tar.gz).
  type: package
  package: opusfile-src

patches: []

depends:
  build:
    - name: opusfile-src
      version: "==0.12"
    - pkg-config
  runtime:
    - name: libopus
    - name: libogg
  host_tools: []

build:
  matrix:
    - platform: linux
      script: build.sh
      env:
        CFLAGS: "-O2 -fPIC"
    - platform: macos
      script: build.sh
      env:
        MACOSX_DEPLOYMENT_TARGET: "13.0"
    - platform: freebsd
      script: build.sh
      env:
        CFLAGS: "-O2 -fPIC"
    - platform: openbsd
      script: build.sh
      env:
        CFLAGS: "-O2 -fPIC"
    - platform: netbsd
      script: build.sh
      env:
        CFLAGS: "-O2 -fPIC"

package:
  files:
    - lib/libopusfile*
    - lib/pkgconfig/opusfile.pc
    - include/opus/
  pkg_config:
    - opusfile
