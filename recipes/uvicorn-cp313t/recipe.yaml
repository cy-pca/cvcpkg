schema_version: 1
recipe:
  name: uvicorn-cp313t
  upstream_version: "0.47.0"
  cvc_revision: 3

  maintainer: "cvcpkg group"
  maintainer_email: "info@cvcpkg.org"
  maintainer_url: "https://cvcpkg.org"
  homepage: https://pypi.org/project/uvicorn/
  license: "BSD-3-Clause"
  tags: [python, source]
  description: >-
    uvicorn 0.47.0 for CPython 3.13t — the cp313t column of
    cvcpkg's per-interpreter matrix (pure-Python, built from the PyPI sdist);
    generated by tools/gen_python_recipes.py.
    Built FROM SOURCE: cvcpkg fetches and sha256-verifies the PyPI sdist,
    and build.sh compiles the wheel with the prefix's own CPython 3.13t —
    no third-party prebuilt binary enters the bundle.
    The cp313t column installs under the free-threaded (no-GIL)
    interpreter and its import check runs with the GIL disabled.

# From-source sdist, sha256 as published by PyPI for this exact version.
source:
  type: tarball
  url: https://files.pythonhosted.org/packages/f6/b1/8e7077a8641086aea449e1b5752a570f1b5906c64e0a33cd6d93b63a066b/uvicorn-0.47.0.tar.gz
  sha256: "7c9a0ea1a9414106bbab7324609c162d8fa0cdcdcb703060987269d77c7bb533"
  strip_components: 1

python:
  interpreter: python313t
  abi: cp313t

patches: []

depends:
  build:
    - name: python313t
    - name: click-cp313t
    - name: h11-cp313t
    # PEP-517 build backend, from this sdist's [build-system] requires.
    # --no-build-isolation means pip will NOT fetch it, so it has to be
    # in the build prefix already (build.sh bridges it onto sys.path).
    - name: hatchling-cp313t
    - name: packaging-cp313t
    - name: pathspec-cp313t
    - name: pluggy-cp313t
    - name: trove-classifiers-cp313t
    - name: calver-cp313t
  runtime:
    - name: python313t
    - name: click-cp313t
    - name: h11-cp313t
  host_tools:
    - python313t

provides:
  - uvicorn

build:
  build_type_independent: true
  matrix:
    - platform: any
      script: build.sh
    - platform: windows
      script: build.ps1

package:
  files:
    - lib/python3.13t/site-packages/uvicorn/
    - lib/python3.13t/site-packages/*.dist-info/
    - bin/uvicorn
    - Lib/site-packages/uvicorn/
    - Lib/site-packages/*.dist-info/
