schema_version: 1
recipe:
  name: grpc
  upstream_version: "1.68.2"
  # Bumped 4 -> 5: no recipe change; rebuild under the executable- and
  # dependency-aware relocation pass. The macOS +cvc.4 dylibs load libssl and
  # libcrypto from openssl's own build-temp dir
  # (/private/var/folders/.../cvcpkg-openssl-.../install/lib), recorded from an
  # openssl bundle whose install names were still absolute; packaging now
  # rewrites such references to @rpath and refuses to pack any that remain.
  # Bumped 5 -> 6: no recipe change; rebuild against c-ares 1.34.8+cvc.2. The
  # macOS +cvc.5 dylibs load @rpath/libcares.2.19.3.dylib, the full-version file
  # of the c-ares they were linked with, and abort since c-ares 1.34.8 replaced it
  # (libcares.2.19.7). c-ares +cvc.2 names itself @rpath/libcares.2.dylib.
  cvc_revision: 6
  maintainer: "cvcpkg group"
  maintainer_email: "info@cvcpkg.org"
  maintainer_url: "https://cvcpkg.org"
  description: "gRPC — a high-performance, open-source universal RPC framework."
  homepage: https://grpc.io/
  license: Apache-2.0
  tags: [networking]

source:
  type: tarball
  url: https://github.com/grpc/grpc/archive/refs/tags/v1.68.2.tar.gz
  sha256: "afbc5d78d6ba6d509cc6e264de0d49dcd7304db435cbf2d630385bacf49e066c"
  strip_components: 1

patches:
  - grpc-link-abseil-sublibs.patch
  - openbsd-ares-nameser.patch

depends:
  build:
    - cmake
    - ninja
  runtime:
    - name: protobuf
      version: ">=27.0"
    - name: abseil
      version: ">=20240722,<20260000"
    - name: openssl
      version: "^3.0"
    - name: c-ares
      version: ">=1.34.0"
    - name: re2
      version: ">=2024.07.02"
    - name: zlib
      version: "^1.3"
  host_tools: []

build:
  matrix:
    - platform: linux
      script: build.sh
      env:
        CXXFLAGS: "-O2 -fPIC -std=c++17"
    - platform: macos
      script: build.sh
      env:
        MACOSX_DEPLOYMENT_TARGET: "13.0"
    - platform: freebsd
      script: build.sh
      env:
        CFLAGS: "-O2 -fPIC"
    - platform: openbsd
      script: build.sh
      env:
        CFLAGS: "-O2 -fPIC"
    - platform: netbsd
      script: build.sh
      env:
        CFLAGS: "-O2 -fPIC"
    - platform: windows
      script: build.ps1

package:
  files:
    - bin/grpc_cpp_plugin*
    - bin/grpc_*_plugin*
    - lib/libgrpc*
    - lib/grpc*
    - lib/cmake/grpc/
    - lib/pkgconfig/grpc*
    - include/grpc/
    - include/grpcpp/
  cmake_packages:
    - { name: gRPC, targets: ["gRPC::grpc", "gRPC::grpc++"] }

test:
  script: test.sh

abi:
  cxx_std: 17
