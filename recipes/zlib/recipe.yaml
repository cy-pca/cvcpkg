schema_version: 1
recipe:
  name: zlib
  upstream_version: "1.3.1"
  cvc_revision: 5
  maintainer: "cvcpkg group"
  maintainer_email: "info@cvcpkg.org"
  maintainer_url: "https://cvcpkg.org"
  description: "zlib — a general-purpose lossless data compression library."
  homepage: https://zlib.net/
  license: Zlib
  tags: [wasi, utils, io, wasm]

source:
  type: tarball
  url: https://github.com/madler/zlib/releases/download/v1.3.1/zlib-1.3.1.tar.gz
  sha256: "9a93b2b7dfdac77ceba5a558a580e74667dd6fede4585b91eefb60f03b72df23"
  strip_components: 1

patches: []

depends:
  build:
    # On haiku, cmake/ninja come from the box's own toolchain (there are no
    # cvcpkg haiku cmake/ninja packages yet); restrict the cvcpkg build-dep to
    # the platforms where cvcpkg actually provides them. Drop the restriction
    # once cmake/ninja are published for haiku.
    - name: cmake
      platforms: [linux, macos, freebsd, openbsd, netbsd, windows, wasm, wasm-mt, wasi, cosmo]
    - name: ninja
      platforms: [linux, macos, freebsd, openbsd, netbsd, windows, wasm, wasm-mt, wasi, cosmo]
  runtime: []
  host_tools: []

build:
  matrix:
    - platform: linux
      script: build.sh
      env:
        CFLAGS: "-O2 -fPIC"
    - platform: macos
      script: build.sh
      env:
        MACOSX_DEPLOYMENT_TARGET: "13.0"
    - platform: freebsd
      script: build.sh
      env:
        CFLAGS: "-O2 -fPIC"
    - platform: openbsd
      script: build.sh
      env:
        CFLAGS: "-O2 -fPIC"
    - platform: netbsd
      script: build.sh
      env:
        CFLAGS: "-O2 -fPIC"
    - platform: haiku
      script: build.sh
      env:
        CFLAGS: "-O2 -fPIC"
    - platform: windows
      script: build.ps1
    - platform: wasm
      host_platform: linux
      script: build-wasm.sh
    # Threaded wasm: same build script, -pthread injected by env-wasm.sh's
    # CVC_WASM_THREADS hook.  A separate platform because emscripten cannot
    # link single-threaded objects into a shared-memory build.
    - platform: wasm-mt
      host_platform: linux
      script: build-wasm.sh
      env:
        CVC_WASM_THREADS: "1"
    - platform: wasm
      host_platform: windows
      script: build-wasm.ps1
    - platform: wasi
      host_platform: linux
      script: build-wasi.sh
    - platform: wasi
      host_platform: windows
      script: build-wasi.ps1
    - platform: cosmo
      host_platform: linux
      script: build-cosmo.sh

package:
  files:
    - lib/libz*
    - lib/zlib*
    - lib/z.lib
    - lib/zlibd.lib
    - lib/cmake/ZLIB/
    - lib/pkgconfig/zlib.pc
    - include/zconf.h
    - include/zlib.h
    - share/man/man3/zlib*
  cmake_packages:
    - { name: ZLIB, targets: ["ZLIB::ZLIB"] }

test:
  script: test.sh

abi:
  cxx_std: 17
