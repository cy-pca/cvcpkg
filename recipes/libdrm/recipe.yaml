schema_version: 1
recipe:
  name: libdrm
  upstream_version: "2.4.134"
  cvc_revision: 1
  maintainer: "cvcpkg group"
  maintainer_email: "info@cvcpkg.org"
  maintainer_url: "https://cvcpkg.org"
  homepage: https://dri.freedesktop.org/libdrm/
  license: MIT
  tags: [libraries, graphics, drm]
  description: >-
    Userspace interface to the kernel Direct Rendering Manager (libdrm.so
    only). Every GPU-specific helper library (intel, radeon, amdgpu, nouveau,
    vmwgfx, freedreno, ...) is disabled, so no libpciaccess/udev/cairo/valgrind
    is needed; this is just the generic DRM ioctl wrapper that Mesa's DRI3/GLX
    loader and the software rasterizers link against.

source:
  type: tarball
  url: https://dri.freedesktop.org/libdrm/libdrm-2.4.134.tar.xz
  sha256: "ac5e74d157830eb8bee44c6a6bf3ad49774ef0dd2a72bdad74a8f20308b52a95"
  strip_components: 1

patches: []

depends:
  build:
    - meson
    - ninja
    - pkg-config
    - name: python311
  runtime: []
  host_tools: []

package:
  files:
    - lib/
    - include/
    - share/

build:
  matrix:
    # Linux only: added as a build dependency of the hermetic `mesa` recipe.
    - platform: linux
      script: build.sh
