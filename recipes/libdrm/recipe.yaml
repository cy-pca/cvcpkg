schema_version: 1
recipe:
  name: libdrm
  upstream_version: "2.4.134"
  cvc_revision: 1
  maintainer: "cvcpkg group"
  maintainer_email: "info@cvcpkg.org"
  maintainer_url: "https://cvcpkg.org"
  homepage: https://dri.freedesktop.org/libdrm/
  license: MIT
  tags: [libraries, graphics, drm]
  description: >-
    Userspace interface to the kernel Direct Rendering Manager (libdrm.so
    only). Every GPU-specific helper library (intel, radeon, amdgpu, nouveau,
    vmwgfx, freedreno, ...) is disabled, so no libpciaccess/udev/cairo/valgrind
    is needed; this is just the generic DRM ioctl wrapper that Mesa's DRI3/GLX
    loader and the software rasterizers link against.

source:
  # Built from the source package libdrm-src, which pins the upstream tarball
  # (https://dri.freedesktop.org/libdrm/libdrm-2.4.134.tar.xz).
  type: package
  package: libdrm-src

patches: []

depends:
  build:
    - name: libdrm-src
      version: "==2.4.134"
    - meson
    - ninja
    - pkg-config
    - name: python311
  runtime: []
  host_tools: []

package:
  files:
    - lib/
    - include/
    # No share/: only the amdgpu backend installs share/libdrm/amdgpu.ids, and
    # it is not built on every arch (linux/arm64 has none).

build:
  matrix:
    # A dependency of the hermetic `mesa` recipe (software GL), on Linux, FreeBSD
    # and NetBSD (OpenBSD's base X11 has its own Mesa).
    - platform: linux
      script: build.sh
    - platform: freebsd
      script: build.sh
    - platform: netbsd
      script: build.sh
