schema_version: 1
recipe:
  name: deprecated-cp311
  upstream_version: "1.3.1"
  cvc_revision: 1

  maintainer: "cvcpkg group"
  maintainer_email: "info@cvcpkg.org"
  maintainer_url: "https://cvcpkg.org"
  homepage: https://pypi.org/project/deprecated/
  license: "MIT"
  tags: [python, source]
  description: >-
    deprecated 1.3.1 for CPython 3.11 — the cp311 column of
    cvcpkg's per-interpreter matrix (pure-Python, built from the PyPI sdist);
    generated by tools/gen_python_recipes.py.
    Built FROM SOURCE: cvcpkg fetches and sha256-verifies the PyPI sdist,
    and build.sh compiles the wheel with the prefix's own CPython 3.11 —
    no third-party prebuilt binary enters the bundle.

# From-source sdist, sha256 as published by PyPI for this exact version.
source:
  # Built from the source package deprecated-src, which pins the upstream tarball
  # (https://files.pythonhosted.org/packages/49/85/12f0a49a7c4ffb70572b6c2ef13c90c88fd190debda93b23f026b25f9634/deprecated-1.3.1.tar.gz).
  type: package
  package: deprecated-src

python:
  interpreter: python311
  abi: cp311

patches: []

depends:
  build:
    - name: deprecated-src
      version: "==1.3.1"
    - name: python311
    - name: wrapt-cp311
    # PEP-517 build backend, from this sdist's [build-system] requires.
    # --no-build-isolation means pip will NOT fetch it, so it has to be
    # in the build prefix already (build.sh bridges it onto sys.path).
    - name: setuptools-cp311
    - name: wheel-cp311
  runtime:
    - name: python311
    - name: wrapt-cp311
  host_tools:
    - python311

build:
  build_type_independent: true
  matrix:
    - platform: any
      script: build.sh
    - platform: windows
      script: build.ps1

package:
  files:
    - { glob: "lib/python3.11/site-packages/deprecated/", platforms: [any] }
    - { glob: "lib/python3.11/site-packages/*.dist-info/", platforms: [any] }
    - { glob: "Lib/site-packages/deprecated/", platforms: [windows] }
    - { glob: "Lib/site-packages/*.dist-info/", platforms: [windows] }
