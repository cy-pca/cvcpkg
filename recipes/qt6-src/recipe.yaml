schema_version: 1
recipe:
  name: qt6-src
  upstream_version: "6.8.2"
  cvc_revision: 1
  maintainer: cvcpkg group
  maintainer_email: info@cvcpkg.org
  maintainer_url: https://cvcpkg.org
  homepage: https://www.qt.io/
  license: LGPL-3.0-only
  tags: [source]
  description: >-
    The unmodified upstream source of qt6 6.8.2: its release tarball, verified
    against the sha256 below and staged at src/qt6-src/.  The qt6 recipe builds
    from it (source.type package), so the tarball is fetched once, from
    download.qt.io, and every other build of qt6 -- another platform, a builder
    that cannot reach download.qt.io, a user building from source -- installs
    this package from the catalog instead.  Generated by
    tools/make_source_package.py.

source:
  # Qt 6 is obtained differently per platform:
  # Linux: apt (qt6-base-dev), macOS: brew (qt@6), Windows: aqtinstall.
  # This recipe standardizes the interface; the build script handles
  # the platform-specific acquisition method.
  type: tarball
  url: https://download.qt.io/archive/qt/6.8/6.8.2/submodules/qtbase-everywhere-src-6.8.2.tar.xz
  sha256: "012043ce6d411e6e8a91fdc4e05e6bedcfa10fcb1347d3c33908f7fdd10dfe05"
  strip_components: 1

patches: []

depends:
  build: []
  runtime: []
  host_tools: []

build:
  build_type_independent: true
  matrix:
    - platform: any
      script: build.sh

package:
  files:
    - src/qt6-src/
