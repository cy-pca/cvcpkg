schema_version: 1
recipe:
  name: libxdmcp
  upstream_version: "1.1.5"
  cvc_revision: 2
  maintainer: "cvcpkg group"
  maintainer_email: "info@cvcpkg.org"
  maintainer_url: "https://cvcpkg.org"
  homepage: https://www.x.org/
  license: MIT
  tags: [libraries, x11, graphics]
  description: >-
    X Display Manager Control Protocol library (Xdmcp).

source:
  # Built from the source package libxdmcp-src, which pins the upstream tarball
  # (https://xorg.freedesktop.org/releases/individual/lib/libXdmcp-1.1.5.tar.xz).
  type: package
  package: libxdmcp-src

patches: []

depends:
  build:
    - name: libxdmcp-src
      version: "==1.1.5"
    - pkg-config
    - name: xorgproto
  runtime: []
  host_tools: []

package:
  files:
    - lib/
    - include/
    - share/

build:
  matrix:
    - platform: linux
      script: build.sh
    - platform: freebsd
      script: build.sh
    - platform: openbsd
      script: build.sh
    - platform: netbsd
      script: build.sh
