schema_version: 1
recipe:
  name: libxdmcp
  upstream_version: "1.1.5"
  # Bumped 2 -> 3: xorgproto is a runtime dep, as for libx11 (#380). xdmcp.pc
  # says `Requires: xproto`, so pkg-config cannot resolve it (nor xcb.pc above it)
  # without xorgproto.  Builder jobs stopped installing deps' build deps on
  # 2026-10-19, and a fresh xcb-util build then failed "Package 'xproto', required
  # by 'xau', not found" (dev cluster, FreeBSD and NetBSD, cy-pca/cvcpkg#527).
  cvc_revision: 3
  maintainer: "cvcpkg group"
  maintainer_email: "info@cvcpkg.org"
  maintainer_url: "https://cvcpkg.org"
  homepage: https://www.x.org/
  license: MIT
  tags: [libraries, x11, graphics]
  description: >-
    X Display Manager Control Protocol library (Xdmcp).

source:
  # Built from the source package libxdmcp-src, which pins the upstream tarball
  # (https://xorg.freedesktop.org/releases/individual/lib/libXdmcp-1.1.5.tar.xz).
  type: package
  package: libxdmcp-src

patches: []

depends:
  build:
    - name: libxdmcp-src
      version: "==1.1.5"
    - pkg-config
    - name: xorgproto
  runtime:
    # xdmcp.pc requires xproto.pc, which xorgproto ships.
    - name: xorgproto
  host_tools: []

package:
  files:
    - lib/
    - include/
    - share/

build:
  matrix:
    - platform: linux
      script: build.sh
    - platform: freebsd
      script: build.sh
    - platform: openbsd
      script: build.sh
    - platform: netbsd
      script: build.sh
