schema_version: 1
recipe:
  name: pytest-xdist-cp313
  upstream_version: "3.8.0"
  cvc_revision: 1

  maintainer: "cvcpkg group"
  maintainer_email: "info@cvcpkg.org"
  maintainer_url: "https://cvcpkg.org"
  homepage: https://pypi.org/project/pytest-xdist/
  license: "MIT"
  tags: [python, source]
  description: >-
    pytest-xdist 3.8.0 for CPython 3.13 — the cp313 column of
    cvcpkg's per-interpreter matrix (pure-Python, built from the PyPI sdist);
    generated by tools/gen_python_recipes.py.
    Built FROM SOURCE: cvcpkg fetches and sha256-verifies the PyPI sdist,
    and build.sh compiles the wheel with the prefix's own CPython 3.13 —
    no third-party prebuilt binary enters the bundle.

# From-source sdist, sha256 as published by PyPI for this exact version.
source:
  # Built from the source package pytest-xdist-src, which pins the upstream tarball
  # (https://files.pythonhosted.org/packages/78/b4/439b179d1ff526791eb921115fca8e44e596a13efeda518b9d845a619450/pytest_xdist-3.8.0.tar.gz).
  type: package
  package: pytest-xdist-src

python:
  interpreter: python313
  abi: cp313

patches: []

depends:
  build:
    - name: pytest-xdist-src
      version: "==3.8.0"
    - name: python313
    - name: execnet-cp313
    - name: pytest-cp313
    # PEP-517 build backend, from this sdist's [build-system] requires.
    # --no-build-isolation means pip will NOT fetch it, so it has to be
    # in the build prefix already (build.sh bridges it onto sys.path).
    - name: setuptools-cp313
    - name: setuptools-scm-cp313
  runtime:
    - name: python313
    - name: execnet-cp313
    - name: pytest-cp313
  host_tools:
    - python313

build:
  build_type_independent: true
  matrix:
    - platform: any
      script: build.sh
    - platform: windows
      script: build.ps1

package:
  files:
    - { glob: "lib/python3.13/site-packages/xdist/", platforms: [any] }
    - { glob: "lib/python3.13/site-packages/pytest_xdist-*.dist-info/", platforms: [any] }
    - { glob: "Lib/site-packages/xdist/", platforms: [windows] }
    - { glob: "Lib/site-packages/pytest_xdist-*.dist-info/", platforms: [windows] }
