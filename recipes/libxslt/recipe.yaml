schema_version: 1
recipe:
  name: libxslt
  upstream_version: "1.1.45"
  # New recipe.  libxslt is the XSLT 1.0 C library (libxslt + libexslt) built on
  # top of libxml2; it is added as the native dependency of the lxml-cp3xx
  # columns (lxml links libxslt/libexslt for its etree.XSLT support), the reason
  # python-pptx was being pip-installed off-catalog before.
  cvc_revision: 1
  maintainer: "cvcpkg group"
  maintainer_email: "info@cvcpkg.org"
  maintainer_url: "https://cvcpkg.org"
  homepage: https://gitlab.gnome.org/GNOME/libxslt
  license: MIT
  tags: [libraries, xml]
  description: >-
    libxslt — the XSLT C library developed for the GNOME project (libxslt plus
    the libexslt extension library), built on cvcpkg's own libxml2.  Added as
    the native dependency of the lxml-cp3xx columns, whose etree.XSLT support
    links libxslt/libexslt.  Built with CMake, mirroring the sibling libxml2
    recipe's minimal feature set: shared libs, no CLI tools (xsltproc), no
    tests, no Python bindings, crypto and the runtime module loader off — so the
    dependency surface stays libxml2-only.  libxml2 is found through its
    installed CMake config package (find_package(LibXml2 CONFIG REQUIRED)), so
    nothing resolves to the build host's system copy.

source:
  type: tarball
  url: https://download.gnome.org/sources/libxslt/1.1/libxslt-1.1.45.tar.xz
  sha256: "9acfe68419c4d06a45c550321b3212762d92f41465062ca4ea19e632ee5d216e"
  strip_components: 1

patches: []

depends:
  build:
    - cmake
    - ninja
    # find_package(LibXml2 CONFIG REQUIRED) at configure time; libxslt/libexslt
    # link libxml2 (and, through it, zlib) at link time.
    - name: libxml2
      version: "^2.12"
    - name: zlib
      version: "^1.3"
  runtime:
    # libxslt.so / libexslt.so NEED libxml2.so, which NEEDs libz.so; cvcpkg
    # staging is flat, so the flat closure is declared (pillow's rationale).
    - name: libxml2
      version: "^2.12"
    - name: zlib
      version: "^1.3"
  host_tools: []

build:
  # linux is verified end-to-end here (built + consumed by lxml's XSLT check on
  # the cvcpkg Linux toolchain).  windows is verified too: cvcpkg builds libxslt
  # with MSVC against the prefix's libxml2 (find_package CONFIG), producing
  # libxslt/libexslt DLLs + import libs + .pc/.cmake.  macos is claimed for the
  # fleet (a plain CMake C library, a well-trodden clang build).  The BSDs/wasm
  # are NOT claimed — the only consumer (lxml) is linux/macos/windows, so an
  # extra column would be a phantom claim.
  matrix:
    - platform: linux
      script: build.sh
    - platform: macos
      script: build.sh
    - platform: windows
      script: build.ps1

package:
  files:
    - lib/libxslt.*
    - lib/libexslt.*
    - lib/cmake/libxslt-*/
    - lib/pkgconfig/libxslt.pc
    - lib/pkgconfig/libexslt.pc
    - include/libxslt/
    - include/libexslt/
  cmake_packages:
    - { name: LibXslt, targets: ["LibXslt::LibXslt", "LibXslt::LibExslt"] }
  pkg_config:
    - libxslt
    - libexslt

abi:
  cxx_std: 17
