schema_version: 1
recipe:
  name: sndio
  upstream_version: "1.10.0"
  cvc_revision: 1
  maintainer: "cvcpkg group"
  maintainer_email: "info@cvcpkg.org"
  maintainer_url: "https://cvcpkg.org"
  homepage: https://sndio.org
  license: ISC
  tags: [libraries, audio]
  description: >-
    sndio — the OpenBSD audio and MIDI framework's portable client
    library (libsndio).  Exposes the sio_* / mio_* / sioctl_* API for
    playing, recording and controlling audio and MIDI through the
    sndiod server.  This package builds the libsndio client library
    only (not the sndiod daemon or the aucat/midicat/sndioctl tools).

source:
  # Built from the source package sndio-src, which pins the upstream tarball
  # (https://sndio.org/sndio-1.10.0.tar.gz).
  type: package
  package: sndio-src

patches: []

depends:
  build:
    - name: sndio-src
      version: "==1.10.0"
    - pkg-config
  runtime: []
  host_tools: []

build:
  matrix:
    - platform: linux
      script: build.sh
    - platform: freebsd
      script: build.sh
    - platform: openbsd
      script: build.sh
    - platform: netbsd
      script: build.sh

package:
  files:
    - lib/libsndio*
    - lib/pkgconfig/sndio.pc
    - include/sndio.h
  pkg_config:
    - sndio
