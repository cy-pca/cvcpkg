schema_version: 1
recipe:
  name: libxdamage
  upstream_version: "1.1.6"
  cvc_revision: 1
  maintainer: "cvcpkg group"
  maintainer_email: "info@cvcpkg.org"
  maintainer_url: "https://cvcpkg.org"
  homepage: https://www.x.org/
  license: MIT
  tags: [libraries, x11, graphics]
  description: >-
    X Damage extension client library (Xdamage). GTK 4's X11 backend
    requires it.

source:
  # Built from the source package libxdamage-src, which pins the upstream tarball
  # (https://xorg.freedesktop.org/releases/individual/lib/libXdamage-1.1.6.tar.xz).
  type: package
  package: libxdamage-src

patches: []

depends:
  build:
    - name: libxdamage-src
      version: "==1.1.6"
    - pkg-config
    # damageproto and fixesproto.
    - name: xorgproto
  runtime:
    - name: libx11
    - name: libxfixes
  host_tools: []

package:
  files:
    - lib/
    - include/

build:
  matrix:
    - platform: linux
      script: build.sh
    - platform: freebsd
      script: build.sh
    - platform: openbsd
      script: build.sh
    - platform: netbsd
      script: build.sh
