schema_version: 1
recipe:
  name: libxdamage
  upstream_version: "1.1.6"
  cvc_revision: 1
  maintainer: "cvcpkg group"
  maintainer_email: "info@cvcpkg.org"
  maintainer_url: "https://cvcpkg.org"
  homepage: https://www.x.org/
  license: MIT
  tags: [libraries, x11, graphics]
  description: >-
    X Damage extension client library (Xdamage). GTK 4's X11 backend
    requires it.

source:
  type: tarball
  url: https://xorg.freedesktop.org/releases/individual/lib/libXdamage-1.1.6.tar.xz
  sha256: "52733c1f5262fca35f64e7d5060c6fcd81a880ba8e1e65c9621cf0727afb5d11"
  strip_components: 1

patches: []

depends:
  build:
    - pkg-config
    # damageproto and fixesproto.
    - name: xorgproto
  runtime:
    - name: libx11
    - name: libxfixes
  host_tools: []

package:
  files:
    - lib/
    - include/

build:
  matrix:
    - platform: linux
      script: build.sh
    - platform: freebsd
      script: build.sh
    - platform: openbsd
      script: build.sh
    - platform: netbsd
      script: build.sh
