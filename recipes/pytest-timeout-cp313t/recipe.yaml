schema_version: 1
recipe:
  name: pytest-timeout-cp313t
  upstream_version: "2.4.0"
  cvc_revision: 1

  maintainer: "cvcpkg group"
  maintainer_email: "info@cvcpkg.org"
  maintainer_url: "https://cvcpkg.org"
  homepage: https://pypi.org/project/pytest-timeout/
  license: "MIT"
  tags: [python, source]
  description: >-
    pytest-timeout 2.4.0 for CPython 3.13t — the cp313t column of
    cvcpkg's per-interpreter matrix (pure-Python, built from the PyPI sdist);
    generated by tools/gen_python_recipes.py.
    Built FROM SOURCE: cvcpkg fetches and sha256-verifies the PyPI sdist,
    and build.sh compiles the wheel with the prefix's own CPython 3.13t —
    no third-party prebuilt binary enters the bundle.
    The cp313t column installs under the free-threaded (no-GIL)
    interpreter and its import check runs with the GIL disabled.

# From-source sdist, sha256 as published by PyPI for this exact version.
source:
  # Built from the source package pytest-timeout-src, which pins the upstream tarball
  # (https://files.pythonhosted.org/packages/ac/82/4c9ecabab13363e72d880f2fb504c5f750433b2b6f16e99f4ec21ada284c/pytest_timeout-2.4.0.tar.gz).
  type: package
  package: pytest-timeout-src

python:
  interpreter: python313t
  abi: cp313t

patches: []

depends:
  build:
    - name: pytest-timeout-src
      version: "==2.4.0"
    - name: python313t
    - name: pytest-cp313t
    # PEP-517 build backend, from this sdist's [build-system] requires.
    # --no-build-isolation means pip will NOT fetch it, so it has to be
    # in the build prefix already (build.sh bridges it onto sys.path).
    - name: setuptools-cp313t
  runtime:
    - name: python313t
    - name: pytest-cp313t
  host_tools:
    - python313t

build:
  build_type_independent: true
  matrix:
    - platform: any
      script: build.sh
    - platform: windows
      script: build.ps1

package:
  files:
    - { glob: "lib/python3.13t/site-packages/pytest_timeout.py", platforms: [any] }
    - { glob: "lib/python3.13t/site-packages/pytest_timeout-*.dist-info/", platforms: [any] }
    - { glob: "Lib/site-packages/pytest_timeout.py", platforms: [windows] }
    - { glob: "Lib/site-packages/pytest_timeout-*.dist-info/", platforms: [windows] }
