schema_version: 1
recipe:
  name: libsm
  upstream_version: "1.2.6"
  cvc_revision: 2
  maintainer: "cvcpkg group"
  maintainer_email: "info@cvcpkg.org"
  maintainer_url: "https://cvcpkg.org"
  homepage: https://www.x.org/
  license: MIT
  tags: [libraries, x11, graphics]
  description: >-
    X Session Management library (SM), built on libICE.

source:
  # Built from the source package libsm-src, which pins the upstream tarball
  # (https://xorg.freedesktop.org/releases/individual/lib/libSM-1.2.6.tar.xz).
  type: package
  package: libsm-src

patches: []

depends:
  build:
    - name: libsm-src
      version: "==1.2.6"
    - pkg-config
    - name: xorgproto
    - name: xtrans
  runtime:
    - name: libice
  host_tools: []

package:
  files:
    - lib/
    - include/
    - share/

build:
  matrix:
    - platform: linux
      script: build.sh
    - platform: freebsd
      script: build.sh
    - platform: openbsd
      script: build.sh
    - platform: netbsd
      script: build.sh
