schema_version: 1
recipe:
  name: curl-src
  upstream_version: "8.13.0"
  cvc_revision: 1
  maintainer: cvcpkg group
  maintainer_email: info@cvcpkg.org
  maintainer_url: https://cvcpkg.org
  homepage: https://curl.se/
  license: curl
  tags: [source]
  description: >-
    The unmodified upstream source of curl 8.13.0: its release tarball, verified
    against the sha256 below and staged at src/curl-src/.  The curl recipe
    builds from it (source.type package), so the tarball is fetched once, from
    curl.se, and every other build of curl -- another platform, a builder that
