schema_version: 1
recipe:
  name: gtk4-src
  upstream_version: "4.16.7"
  cvc_revision: 1
  maintainer: cvcpkg group
  maintainer_email: info@cvcpkg.org
  maintainer_url: https://cvcpkg.org
  homepage: https://www.gtk.org/
  license: LGPL-2.1-or-later
  tags: [source]
  description: >-
    The unmodified upstream source of gtk4 4.16.7: its release tarball, verified
    against the sha256 below and staged at src/gtk4-src/.  The gtk4 recipe
    builds from it (source.type package), so the tarball is fetched once, from
    download.gnome.org, and every other build of gtk4 -- another platform, a
    builder that cannot reach download.gnome.org, a user building from source --
    installs this package from the catalog instead.  Generated by
    tools/make_source_package.py.

source:
  # sha256 from download.gnome.org/sources/gtk/4.16/gtk-4.16.7.sha256sum.
  type: tarball
  url: https://download.gnome.org/sources/gtk/4.16/gtk-4.16.7.tar.xz
  sha256: "5303c7624e15a48880591b9ddd43389afba3de4fb92a219719519bb1642ce3dc"
  strip_components: 1

patches: []

depends:
  build: []
  runtime: []
  host_tools: []

build:
  build_type_independent: true
  matrix:
    - platform: any
      script: build.sh

package:
  files:
    - src/gtk4-src/
