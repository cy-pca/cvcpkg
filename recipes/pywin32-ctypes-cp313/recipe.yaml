schema_version: 1
recipe:
  name: pywin32-ctypes-cp313
  upstream_version: "0.2.3"
  cvc_revision: 2

  maintainer: "cvcpkg group"
  maintainer_email: "info@cvcpkg.org"
  maintainer_url: "https://cvcpkg.org"
  homepage: https://pypi.org/project/pywin32-ctypes/
  license: "BSD-3-Clause"
  tags: [python, source]
  description: >-
    pywin32-ctypes 0.2.3 for CPython 3.13 — the cp313 column of
    cvcpkg's per-interpreter matrix (pure-Python, built from the PyPI sdist);
    generated by tools/gen_python_recipes.py.
    Built FROM SOURCE: cvcpkg fetches and sha256-verifies the PyPI sdist,
    and build.sh compiles the wheel with the prefix's own CPython 3.13 —
    no third-party prebuilt binary enters the bundle.

# From-source sdist, sha256 as published by PyPI for this exact version.
source:
  # Built from the source package pywin32-ctypes-src, which pins the upstream tarball
  # (https://files.pythonhosted.org/packages/85/9f/01a1a99704853cb63f253eea009390c88e7131c67e66a0a02099a8c917cb/pywin32-ctypes-0.2.3.tar.gz).
  type: package
  package: pywin32-ctypes-src

python:
  interpreter: python313
  abi: cp313

patches: []

depends:
  build:
    - name: pywin32-ctypes-src
      version: "==0.2.3"
    - name: python313
    # PEP-517 build backend, from this sdist's [build-system] requires.
    # --no-build-isolation means pip will NOT fetch it, so it has to be
    # in the build prefix already (build.sh bridges it onto sys.path).
    - name: setuptools-cp313
    - name: wheel-cp313
  runtime:
    - name: python313
  host_tools:
    - python313

build:
  build_type_independent: true
  matrix:
    - platform: any
      script: build.sh
    - platform: windows
      script: build.ps1

package:
  files:
    - { glob: "lib/python3.13/site-packages/win32ctypes/", platforms: [any] }
    - { glob: "lib/python3.13/site-packages/pywin32_ctypes-*.dist-info/", platforms: [any] }
    - { glob: "Lib/site-packages/win32ctypes/", platforms: [windows] }
    - { glob: "Lib/site-packages/*.dist-info/", platforms: [windows] }
