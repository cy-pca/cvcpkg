schema_version: 1
recipe:
  name: pygments-cp312
  upstream_version: "2.20.0"
  cvc_revision: 4

  maintainer: "cvcpkg group"
  maintainer_email: "info@cvcpkg.org"
  maintainer_url: "https://cvcpkg.org"
  homepage: https://pypi.org/project/pygments/
  license: "BSD-2-Clause"
  tags: [python, source]
  description: >-
    pygments 2.20.0 for CPython 3.12 — the cp312 column of
    cvcpkg's per-interpreter matrix (pure-Python, built from the PyPI sdist);
    generated by tools/gen_python_recipes.py.
    Built FROM SOURCE: cvcpkg fetches and sha256-verifies the PyPI sdist,
    and build.sh compiles the wheel with the prefix's own CPython 3.12 —
    no third-party prebuilt binary enters the bundle.

# From-source sdist, sha256 as published by PyPI for this exact version.
source:
  # Built from the source package pygments-src, which pins the upstream tarball
  # (https://files.pythonhosted.org/packages/c3/b2/bc9c9196916376152d655522fdcebac55e66de6603a76a02bca1b6414f6c/pygments-2.20.0.tar.gz).
  type: package
  package: pygments-src

python:
  interpreter: python312
  abi: cp312

patches: []

depends:
  build:
    - name: pygments-src
      version: "==2.20.0"
    - name: python312
    # PEP-517 build backend, from this sdist's [build-system] requires.
    # --no-build-isolation means pip will NOT fetch it, so it has to be
    # in the build prefix already (build.sh bridges it onto sys.path).
    - name: hatchling-cp312
    - name: packaging-cp312
    - name: pathspec-cp312
    - name: pluggy-cp312
    - name: trove-classifiers-cp312
    - name: calver-cp312
  runtime:
    - name: python312
  host_tools:
    - python312

provides:
  - pygments

build:
  build_type_independent: true
  matrix:
    - platform: any
      script: build.sh
    - platform: windows
      script: build.ps1

package:
  files:
    - { glob: "lib/python3.12/site-packages/pygments/", platforms: [any] }
    - { glob: "lib/python3.12/site-packages/pygments-*.dist-info/", platforms: [any] }
    - { glob: "bin/pygmentize", platforms: [any] }
    - { glob: "Lib/site-packages/pygments/", platforms: [windows] }
    - { glob: "Lib/site-packages/*.dist-info/", platforms: [windows] }
