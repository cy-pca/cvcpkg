schema_version: 1
recipe:
  name: versioneer-cp313
  upstream_version: "0.29"
  cvc_revision: 2

  maintainer: "cvcpkg group"
  maintainer_email: "info@cvcpkg.org"
  maintainer_url: "https://cvcpkg.org"
  homepage: https://pypi.org/project/versioneer/
  license: "Unlicense"
  tags: [python, source]
  description: >-
    versioneer 0.29 for CPython 3.13 — the cp313 column of
    cvcpkg's per-interpreter matrix (pure-Python, built from the PyPI sdist);
    generated by tools/gen_python_recipes.py.
    Built FROM SOURCE: cvcpkg fetches and sha256-verifies the PyPI sdist,
    and build.sh compiles the wheel with the prefix's own CPython 3.13 —
    no third-party prebuilt binary enters the bundle.

# From-source sdist, sha256 as published by PyPI for this exact version.
source:
  # Built from the source package versioneer-src, which pins the upstream tarball
  # (https://files.pythonhosted.org/packages/32/d7/854e45d2b03e1a8ee2aa6429dd396d002ce71e5d88b77551b2fb249cb382/versioneer-0.29.tar.gz).
  type: package
  package: versioneer-src

python:
  interpreter: python313
  abi: cp313

patches: []

depends:
  build:
    - name: versioneer-src
      version: "==0.29"
    - name: python313
    # PEP-517 build backend, from this sdist's [build-system] requires.
    # --no-build-isolation means pip will NOT fetch it, so it has to be
    # in the build prefix already (build.sh bridges it onto sys.path).
    - name: setuptools-cp313
  runtime:
    - name: python313
  host_tools:
    - python313

provides:
  - versioneer

build:
  build_type_independent: true
  matrix:
    - platform: any
      script: build.sh
    - platform: windows
      script: build.ps1

package:
  files:
    - { glob: "lib/python3.13/site-packages/versioneer.py", platforms: [any] }
    - { glob: "lib/python3.13/site-packages/versioneer-*.dist-info/", platforms: [any] }
    - { glob: "bin/versioneer", platforms: [any] }
    - { glob: "Lib/site-packages/versioneer.py", platforms: [windows] }
    - { glob: "Lib/site-packages/versioneer-*.dist-info/", platforms: [windows] }
