schema_version: 1
recipe:
  name: python-bitcoinrpc-cp312
  upstream_version: "1.0.0"
  cvc_revision: 1

  maintainer: "cvcpkg group"
  maintainer_email: "info@cvcpkg.org"
  maintainer_url: "https://cvcpkg.org"
  homepage: https://pypi.org/project/python-bitcoinrpc/
  # setup.py classifies it LGPL; authproxy.py's header grants LGPL 2.1 "or (at
  # your option) any later version".
  license: "LGPL-2.1-or-later"
  tags: [python, source]
  description: >-
    python-bitcoinrpc 1.0 (AuthServiceProxy, a JSON-RPC client for bitcoind) for
    CPython 3.12 — the cp312 column of cvcpkg's per-interpreter matrix
    (pure-Python, built from the PyPI sdist). HAND-WRITTEN rather than generated:
    PyPI publishes only the 2016 sdist for 1.0 and no wheel, which
    tools/gen_python_recipes.py treats as fatal.

# From-source sdist, sha256 as published by PyPI for this exact version.
source:
  type: tarball
  url: https://files.pythonhosted.org/packages/71/eb/80313654302a7f3ba2fa3a8ea9e4c65f910b353112df8da77e4974978665/python-bitcoinrpc-1.0.tar.gz
  sha256: "a6a6f35672635163bc491c25fe29520bdd063dedbeda3b37bf5be97aa038c6e7"
  strip_components: 1

python:
  interpreter: python312
  abi: cp312

patches: []

depends:
  build:
    - name: python312
    # Legacy setup.py project (no pyproject.toml): PEP 517's fallback backend is
    # setuptools.build_meta:__legacy__, whose requirements are setuptools + wheel.
    - name: setuptools-cp312
    - name: wheel-cp312
  runtime:
    - name: python312
  host_tools:
    - python312

build:
  build_type_independent: true
  matrix:
    - platform: any
      script: build.sh
    - platform: windows
      script: build.ps1

package:
  files:
    - { glob: "lib/python3.12/site-packages/bitcoinrpc/", platforms: [any] }
    - { glob: "lib/python3.12/site-packages/*.dist-info/", platforms: [any] }
    - { glob: "Lib/site-packages/bitcoinrpc/", platforms: [windows] }
    - { glob: "Lib/site-packages/*.dist-info/", platforms: [windows] }
