schema_version: 1
recipe:
  name: farama-notifications-cp313
  upstream_version: "0.0.6"
  # cvc.2 (freethreaded-leak republish): the published cvc.1 any/noarch bundle
  # installs to lib/python3.13t/site-packages -- a python313t (before its cvc.7) shadowed
  # python3.13 when it was built -- so python3.13 cannot import it and cp313 builds that
  # depend on it fail (aiokafka-cp313 on async-timeout-cp313, 2026-10-13).  Rebuilding
  # lays it under lib/python3.13/.  Found by auditing every published cp313 bundle.
  cvc_revision: 2

  maintainer: "cvcpkg group"
  maintainer_email: "info@cvcpkg.org"
  maintainer_url: "https://cvcpkg.org"
  homepage: https://pypi.org/project/farama-notifications/
  license: "MIT"
  tags: [python, source]
  description: >-
    farama-notifications 0.0.6 for CPython 3.13 — the cp313 column of
    cvcpkg's per-interpreter matrix (pure-Python, built from the PyPI sdist);
    generated by tools/gen_python_recipes.py.
    Built FROM SOURCE: cvcpkg fetches and sha256-verifies the PyPI sdist,
    and build.sh compiles the wheel with the prefix's own CPython 3.13 —
    no third-party prebuilt binary enters the bundle.

# From-source sdist, sha256 as published by PyPI for this exact version.
source:
  # Built from the source package farama-notifications-src, which pins the upstream tarball
  # (https://files.pythonhosted.org/packages/ec/91/14397890dde30adc4bee6462158933806207bc5dd10d7b4d09d5c33845cf/farama_notifications-0.0.6.tar.gz).
  type: package
  package: farama-notifications-src

python:
  interpreter: python313
  abi: cp313

patches: []

depends:
  build:
    - name: farama-notifications-src
      version: "==0.0.6"
    - name: python313
    # PEP-517 build backend, from this sdist's [build-system] requires.
    # --no-build-isolation means pip will NOT fetch it, so it has to be
    # in the build prefix already (build.sh bridges it onto sys.path).
    - name: setuptools-cp313
    - name: wheel-cp313
  runtime:
    - name: python313
  host_tools:
    - python313

build:
  build_type_independent: true
  matrix:
    - platform: any
      script: build.sh
    - platform: windows
      script: build.ps1

package:
  files:
    - { glob: "lib/python3.13/site-packages/farama_notifications/", platforms: [any] }
    - { glob: "lib/python3.13/site-packages/farama_notifications-*.dist-info/", platforms: [any] }
    - { glob: "Lib/site-packages/farama_notifications/", platforms: [windows] }
    - { glob: "Lib/site-packages/*.dist-info/", platforms: [windows] }
