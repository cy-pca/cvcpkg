schema_version: 1
recipe:
  name: vtk-python-cp312
  upstream_version: "9.5.0"
  # cvc.2: the wasm build now PRUNES to python-only artifacts (the cvc.1 wasm
  # bundle, published by a build that raced ahead without the prune, wrongly
  # shipped a full VTK — yank it). The prune changes the packed artifact, so the
  # revision must bump; other platforms rebuild identically.
  # cvc.3: wasm/wasm-mt add RenderingCore to the wrapped set.
  # cvc.4: wasm/wasm-mt wrap a broad set — the base vtk recipe's proven wasm rendering
  # stack (RenderingOpenGL2/Volume/VolumeOpenGL2/FreeType/Annotation/UI + Interaction)
  # plus a curated backend-free data set (Common/Filters/Imaging + IOXML/Geometry/
  # Legacy/PLY/Image). CURATED, not StandAlone=WANT: the wrapping build hides node so
  # VTK uses native wrap-tools, which means modules whose configure does TRY_RUN can't
  # run — so the HDF5/netCDF/Exodus IO modules are explicitly OFF (they TRY_RUN). This
  # gives pycvc_gl live render windows/actors/GPU-volume + the core data/filter/IO API
  # in the browser. wasm/wasm-mt only.
  # cvc.5: also wrap IOHDF, using VTK's EXTERNAL hdf5 (VTK_MODULE_USE_EXTERNAL_VTK_hdf5
  # against the cvcpkg hdf5 wasm/wasm-mt build) so no vendored-hdf5 TRY_RUN under the
  # node-hidden configure. Adds VTK's HDF5 IO (.vtkhdf etc.) to the browser API.
  # cvc.6: also wrap IONetCDF (+ best-effort IOExodus), using VTK's EXTERNAL netcdf
  # (VTK_MODULE_USE_EXTERNAL_VTK_netcdf against the cvcpkg netcdf wasm/wasm-mt build,
  # published 2026-09-24) — the same external-lib trick as hdf5, so netCDF's vendored
  # TRY_RUN never runs under the node-hidden wrap configure. Adds netCDF (and Exodus)
  # readers to the browser vtk-python API. wasm/wasm-mt only.
  cvc_revision: 6
  maintainer: "cvcpkg group"
  maintainer_email: "info@cvcpkg.org"
  maintainer_url: "https://cvcpkg.org"
  description: >-
    VTK 9.5 Python wrappers (cp312) — the importable `vtkmodules` package plus
    the C++↔Python bridge (libvtkWrappingPythonCore / libvtkPythonInterpreter and
    the vtkPythonUtil.h / PyVTK* headers).  Rebuilt from the SAME pinned VTK
    source as the `vtk` package but with VTK_WRAP_PYTHON=ON, and packaged to ship
    ONLY the Python-specific artifacts: it installs side by side with the
    C++-only `vtk` package (which builds WRAP_PYTHON=OFF and emits none of these
    files) and depends on it for the libvtk*-9.5 C++ libraries and CMake config.
    Lets pycvc-gl and a VTK-Python host (VolRover) share the exact same VTK
    Python build so vtkPythonUtil can hand real vtkProp*/vtkActor objects across
    the SWIG boundary.  Python-ABI-specific (cp312) — mirrors how pycvc/pycvc-gl
    split the core and scene bindings.
  homepage: https://vtk.org/
  license: BSD-3-Clause
  tags: [graphics, python, bindings]

source:
  # Same pinned tarball + sha256 as recipes/vtk — the Python wrappers MUST be
  # generated from the identical C++ source so the wrapped ABI matches the `vtk`
  # package's libvtk*-9.5 libraries at runtime.
  type: tarball
  url: https://www.vtk.org/files/release/9.5/VTK-9.5.0.tar.gz
  sha256: "04ae86246b9557c6b61afbc534a6df099244fbc8f3937f82e6bc0570953af87d"
  strip_components: 1

python:
  interpreter: python312
  abi: cp312

patches:
  # SAME two wasm patches the base `vtk` recipe applies — vtk-python rebuilds VTK
  # from the identical tarball, so without them the wasm/wasm-mt wrap build fails
  # exactly where the C++ build would: fmt's format.h uses malloc/free but doesn't
  # include <cstdlib> (undeclared under Emscripten's libc++), and ESSL 3.00 forbids
  # the volume raycast composer's non-constant global initializer (kills shaded
  # volumes under WebGL2). Harmless on native platforms (base vtk applies them
  # unconditionally too).
  - vtk-fmt-cstdlib-wasm.patch
  - vtk-essl3-no-global-uniform-init.patch

depends:
  build:
    - cmake
    - ninja
    # Wrappers are built against the cvcpkg python312 interpreter (cp312), the
    # same one pycvc / pycvc-gl / numpy-cp312 target — the ABI must match.
    - name: python312
    # VTK is rebuilt in full from source, so its own C++ build dependencies must
    # be present in the build closure (kept identical to recipes/vtk).
    # Qt and HDF5 do not exist / are not used on wasm (mirrors recipes/vtk),
    # so the wasm wrap build configures without them.
    - name: qt6
      version: ">=6.7"
      platforms: [linux, macos, windows, windows-gnu, freebsd, openbsd, netbsd, haiku]
    - name: hdf5
      version: "^1.14"
      # wasm/wasm-mt: VTK uses this EXTERNAL prebuilt hdf5 (VTK_MODULE_USE_EXTERNAL_VTK_hdf5)
      # so IOHDF wraps without VTK's vendored hdf5 configure TRY_RUN (which can't run
      # under the node-hidden wrap configure). hdf5 is a separate cvcpkg wasm build.
      platforms: [linux, macos, windows, windows-gnu, freebsd, openbsd, netbsd, haiku, wasm, wasm-mt]
    - name: netcdf
      version: "^4.9"
      # wasm/wasm-mt only: VTK uses this EXTERNAL prebuilt netcdf
      # (VTK_MODULE_USE_EXTERNAL_VTK_netcdf) so IONetCDF/IOExodus wrap without netCDF's
      # vendored configure TRY_RUN under the node-hidden wrap build. netcdf is a
      # separate cvcpkg wasm build (netcdf-4 on the same external hdf5).
      platforms: [wasm, wasm-mt]
    - name: tiff
      version: "^4.6"
    - name: zlib
      version: "^1.3"
  runtime:
    # The C++ libvtk*-9.5 libraries + VTK CMake config come from the `vtk`
    # package; the wrapper .so's resolve against them by soname at load time.
    # Pinned to the exact version so the ABI matches (bump in lockstep).
    - name: vtk
      version: "9.5.0"
    # pycvc-gl / the host import these wrappers against this interpreter.
    - name: python312
  host_tools:
    - cmake
    - ninja
    - python312

build:
  # cvcGL + VTK Python are consumed on linux + windows (the pycvc-gl platforms;
  # no macOS VTK bundle yet). Add macos when the vtk package gains a macOS build
  # that pycvc-gl consumes.
  matrix:
    - platform: linux
      script: build.sh
      env:
        CXXFLAGS: "-O2 -fPIC -std=c++17"
    - platform: windows
      script: build.ps1
    # GO/NO-GO SPIKE (WIP): can VTK_WRAP_PYTHON cross-compile to wasm statically?
    # build-wasm.sh builds VTK's host compile-tools natively, then cross-builds a
    # MINIMAL module set (CommonCore+DataModel, no rendering) with
    # VTK_WRAP_PYTHON=ON + BUILD_SHARED_LIBS=OFF against a wasm libpython. Needs
    # python312 built for wasm in the prefix. Expand to the rendering module set
    # once the wrap pipeline is proven. host_platform linux (needs a native host
    # toolchain for the wrapper generators).
    - platform: wasm
      host_platform: linux
      script: build-wasm.sh
    # Threaded flavor for the wasm-mt closure: wraps the wasm-mt vtk against the
    # -pthread python312/numpy, so pycvc_gl(BRIDGE=ON) on wasm-mt gets matching
    # static wrapper archives. Same build-wasm.sh; env-wasm.sh injects -pthread on
    # the CVC_WASM_THREADS hook (compile+link), keeping the flavor consistent.
    - platform: wasm-mt
      host_platform: linux
      script: build-wasm.sh
      env:
        CVC_WASM_THREADS: "1"

package:
  # ONLY the Python-specific artifacts — the C++ libs, headers, and CMake config
  # are owned by the `vtk` package, so the two install into one prefix with no
  # file overlap (the WRAP_PYTHON=OFF `vtk` build produces none of the below).
  files:
    # Python wrapping libraries (libvtkWrappingPythonCore, libvtkPythonInterpreter,
    # libvtkPythonContext2D) — linux/macOS .so, windows import .lib + bin .dll.
    - lib/libvtk*Python*
    - lib/vtk*Python*.lib
    - bin/vtk*Python*
    # wasm STATIC build: the compiled modules aggregate into _vtkmodules_static.a
    # (registered via PyImport_AppendInittab), and the pure-Python stubs ship as
    # VTK's _vtk.zip rather than an unpacked vtkmodules/ tree.
    - lib/_vtkmodules_static.a
    - lib/python*/site-packages/_vtk.zip
    # The importable Python package (site-packages layout differs per platform).
    - lib/python*/site-packages/vtkmodules/
    - lib/python*/site-packages/vtk.py
    - Lib/site-packages/vtkmodules/
    - Lib/site-packages/vtk.py
    # C++↔Python bridge headers (only emitted with VTK_WRAP_PYTHON=ON) — they land
    # in the SAME include/vtk-9.5 dir the `vtk` package's VTK::CommonCore already
    # puts on a consumer's include path, so `#include "vtkPythonUtil.h"` needs no
    # extra include dir.
    - include/vtk-9.5/*Python*.h
    - include/vtk-9.5/PyVTK*.h
    - include/vtk-9.5/vtkSmartPyObject.h

abi:
  cxx_std: 17

notes: >-
  vtk-python does NOT ship VTK's CMake config: VTK's config
  (lib/cmake/vtk-9.5/VTK-targets.cmake, vtk-config.cmake) is monolithic and
  regenerated per build, enumerating only the modules that build produced — so a
  WRAP_PYTHON=OFF `vtk` config cannot expose VTK::WrappingPythonCore and a second
  package cannot merge targets into it without clobbering. Consumers therefore
  keep find_package(VTK COMPONENTS ...) from the `vtk` package for the C++ side
  and link the wrapping-core library explicitly, e.g.
  find_library(VTK_WRAPPING_PYTHONCORE
  NAMES vtkWrappingPythonCore<pyver>-9.5) — the lib carries the Python-ABI suffix
  (e.g. libvtkWrappingPythonCore3.12-9.5.so); the vtkPythonUtil.h header is
  already on the VTK include path. Python-ABI coupling: this recipe is cp312-only;
  a python312/313 host needs a parallel vtk-python variant.

  HERMETICITY / build model: this build.sh currently does a FULL VTK rebuild
  (WRAP_PYTHON=ON) and PRUNES to the python artifacts. The wrappers are therefore
  built against this recipe's own C++ rebuild (ABI-matched to `vtk` on a
  consistent toolchain, not byte-identical). The fully hermetic design — reuse
  `vtk`'s exact installed binaries — IS possible: VTK 9.5's vtk_module_wrap_python
  supports wrapping imported/installed modules (the `vtk` package already ships
  the *-hierarchy.txt files + vtkModuleWrapPython.cmake), so a driver project can
  wrap the installed modules without rebuilding the C++. It additionally requires
  building VTK::WrappingPythonCore / PythonInterpreter from the wrapping sources
  against the installed VTK — a follow-up. (An earlier version of this note
  claimed installed VTK cannot be wrapped; that is incorrect.)
