schema_version: 1
recipe:
  name: sqlalchemy-cp312
  upstream_version: "2.0.50"
  cvc_revision: 4

  maintainer: "cvcpkg group"
  maintainer_email: "info@cvcpkg.org"
  maintainer_url: "https://cvcpkg.org"
  homepage: https://pypi.org/project/sqlalchemy/
  license: "MIT"
  tags: [python, source]
  description: >-
    sqlalchemy 2.0.50 for CPython 3.12 — the cp312 column of
    cvcpkg's per-interpreter matrix (C extensions compiled for cp312 from the PyPI sdist);
    generated by tools/gen_python_recipes.py.
    Built FROM SOURCE: cvcpkg fetches and sha256-verifies the PyPI sdist,
    and build.sh compiles the wheel with the prefix's own CPython 3.12 —
    no third-party prebuilt binary enters the bundle.

# From-source sdist, sha256 as published by PyPI for this exact version.
source:
  # Built from the source package sqlalchemy-src, which pins the upstream tarball
  # (https://files.pythonhosted.org/packages/57/da/6fbf010c8ebb347679d0d100b22fe9ba5e13fd04046c5df7280d2f0bf706/sqlalchemy-2.0.50.tar.gz).
  type: package
  package: sqlalchemy-src

python:
  interpreter: python312
  abi: cp312

patches: []

depends:
  build:
    - name: sqlalchemy-src
      version: "==2.0.50"
    - name: python312
    - name: greenlet-cp312
    - name: typing-extensions-cp312
    # PEP-517 build backend, from this sdist's [build-system] requires.
    # --no-build-isolation means pip will NOT fetch it, so it has to be
    # in the build prefix already (build.sh bridges it onto sys.path).
    - name: setuptools-cp312
    - name: cython-cp312
  runtime:
    - name: python312
    - name: greenlet-cp312
    - name: typing-extensions-cp312
  host_tools:
    - python312

build:
  build_type_independent: true
  matrix:
    - platform: linux
      script: build.sh
    - platform: macos
      script: build.sh
    - platform: windows
      script: build.ps1

package:
  files:
    - { glob: "lib/python3.12/site-packages/sqlalchemy/", platforms: [linux, macos] }
    - { glob: "lib/python3.12/site-packages/*.dist-info/", platforms: [linux, macos] }
    - { glob: "Lib/site-packages/sqlalchemy/", platforms: [windows] }
    - { glob: "Lib/site-packages/*.dist-info/", platforms: [windows] }
