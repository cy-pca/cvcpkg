schema_version: 1
recipe:
  name: black-cp311
  upstream_version: "26.5.1"
  # cvc.4 (hermetic-closure republish): the recipe already declares this tool's
  # transitive Python deps, but the published catalog artifact predates those edges, so
  # `cvcpkg install-deps grl-snam-cpXXX` did not pull them and CI pip-installed them as a
  # non-hermetic workaround (which drifted — mpmath 1.4.1 broke sympy<1.4). Bump + republish
  # so the catalog carries the declared depends; the ci.yml pip workaround is then removed.
  cvc_revision: 4

  maintainer: "cvcpkg group"
  maintainer_email: "info@cvcpkg.org"
  maintainer_url: "https://cvcpkg.org"
  homepage: https://pypi.org/project/black/
  license: "MIT"
  tags: [python, source]
  description: >-
    black 26.5.1 for CPython 3.11 — the cp311 column of
    cvcpkg's per-interpreter matrix (pure-Python, built from the PyPI sdist);
    generated by tools/gen_python_recipes.py.
    Built FROM SOURCE: cvcpkg fetches and sha256-verifies the PyPI sdist,
    and build.sh compiles the wheel with the prefix's own CPython 3.11 —
    no third-party prebuilt binary enters the bundle.

# From-source sdist, sha256 as published by PyPI for this exact version.
source:
  # Built from the source package black-src, which pins the upstream tarball
  # (https://files.pythonhosted.org/packages/c0/37/5628dd55bf2b34257fc7603f0fe97c40e3aaf24265f416a9c85c95ca1436/black-26.5.1.tar.gz).
  type: package
  package: black-src

python:
  interpreter: python311
  abi: cp311

patches: []

depends:
  build:
    - name: black-src
      version: "==26.5.1"
    - name: python311
    - name: click-cp311
    - name: mypy-extensions-cp311
    - name: packaging-cp311
    - name: pathspec-cp311
    - name: platformdirs-cp311
    - name: pytokens-cp311
    # PEP-517 build backend, from this sdist's [build-system] requires.
    # --no-build-isolation means pip will NOT fetch it, so it has to be
    # in the build prefix already (build.sh bridges it onto sys.path).
    - name: hatch-fancy-pypi-readme-cp311
    - name: hatch-vcs-cp311
    - name: hatchling-cp311
    - name: pluggy-cp311
    - name: trove-classifiers-cp311
    - name: calver-cp311
  runtime:
    - name: python311
    - name: click-cp311
    - name: mypy-extensions-cp311
    - name: packaging-cp311
    - name: pathspec-cp311
    - name: platformdirs-cp311
    - name: pytokens-cp311
  host_tools:
    - python311

provides:
  - black

build:
  build_type_independent: true
  matrix:
    - platform: any
      script: build.sh
    - platform: windows
      script: build.ps1

package:
  files:
    - { glob: "lib/python3.11/site-packages/black/", platforms: [any] }
    - { glob: "lib/python3.11/site-packages/blackd/", platforms: [any] }
    - { glob: "lib/python3.11/site-packages/blib2to3/", platforms: [any] }
    - { glob: "lib/python3.11/site-packages/_black_version.py", platforms: [any] }
    - { glob: "lib/python3.11/site-packages/black-*.dist-info/", platforms: [any] }
    - { glob: "bin/black", platforms: [any] }
    - { glob: "bin/blackd", platforms: [any] }
    - { glob: "Lib/site-packages/black/", platforms: [windows] }
    - { glob: "Lib/site-packages/*.dist-info/", platforms: [windows] }
