schema_version: 1
recipe:
  name: ruamel-yaml-cp313t
  upstream_version: "0.19.1"
  cvc_revision: 2

  maintainer: "cvcpkg group"
  maintainer_email: "info@cvcpkg.org"
  maintainer_url: "https://cvcpkg.org"
  homepage: https://pypi.org/project/ruamel-yaml/
  license: "MIT"
  tags: [python, source]
  description: >-
    ruamel-yaml 0.19.1 for CPython 3.13t — the cp313t column of
    cvcpkg's per-interpreter matrix (pure-Python, built from the PyPI sdist);
    generated by tools/gen_python_recipes.py.
    Built FROM SOURCE: cvcpkg fetches and sha256-verifies the PyPI sdist,
    and build.sh compiles the wheel with the prefix's own CPython 3.13t —
    no third-party prebuilt binary enters the bundle.
    The cp313t column installs under the free-threaded (no-GIL)
    interpreter and its import check runs with the GIL disabled.

# From-source sdist, sha256 as published by PyPI for this exact version.
source:
  # Built from the source package ruamel-yaml-src, which pins the upstream tarball
  # (https://files.pythonhosted.org/packages/c7/3b/ebda527b56beb90cb7652cb1c7e4f91f48649fbcd8d2eb2fb6e77cd3329b/ruamel_yaml-0.19.1.tar.gz).
  type: package
  package: ruamel-yaml-src

python:
  interpreter: python313t
  abi: cp313t

patches: []

depends:
  build:
    - name: ruamel-yaml-src
      version: "==0.19.1"
    - name: python313t
    # PEP-517 build backend, from this sdist's [build-system] requires.
    # --no-build-isolation means pip will NOT fetch it, so it has to be
    # in the build prefix already (build.sh bridges it onto sys.path).
    - name: setuptools-cp313t
  runtime:
    - name: python313t
  host_tools:
    - python313t

build:
  build_type_independent: true
  matrix:
    - platform: any
      script: build.sh
    - platform: windows
      script: build.ps1

package:
  files:
    - { glob: "lib/python3.13t/site-packages/ruamel/", platforms: [any] }
    - { glob: "lib/python3.13t/site-packages/ruamel_yaml-*.dist-info/", platforms: [any] }
    - { glob: "Lib/site-packages/ruamel/", platforms: [windows] }
    - { glob: "Lib/site-packages/ruamel_yaml-*.dist-info/", platforms: [windows] }
