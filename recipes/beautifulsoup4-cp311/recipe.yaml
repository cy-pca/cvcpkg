schema_version: 1
recipe:
  name: beautifulsoup4-cp311
  upstream_version: "4.15.0"
  cvc_revision: 1

  maintainer: "cvcpkg group"
  maintainer_email: "info@cvcpkg.org"
  maintainer_url: "https://cvcpkg.org"
  homepage: https://pypi.org/project/beautifulsoup4/
  license: "MIT"
  tags: [python, source]
  description: >-
    beautifulsoup4 4.15.0 for CPython 3.11 — the cp311 column of
    cvcpkg's per-interpreter matrix (pure-Python, built from the PyPI sdist);
    generated by tools/gen_python_recipes.py.
    Built FROM SOURCE: cvcpkg fetches and sha256-verifies the PyPI sdist,
    and build.sh compiles the wheel with the prefix's own CPython 3.11 —
    no third-party prebuilt binary enters the bundle.

# From-source sdist, sha256 as published by PyPI for this exact version.
source:
  type: tarball
  url: https://files.pythonhosted.org/packages/43/65/318323f98dbee45d42dff61d8f047181bc6f2268a9068cfad035a46be5af/beautifulsoup4-4.15.0.tar.gz
  sha256: "288e3ca7d54b06f2ac191970bc275c1939cb46d450b255bf6718b04aa37ab4f7"
  strip_components: 1

python:
  interpreter: python311
  abi: cp311

patches: []

depends:
  build:
    - name: python311
    - name: soupsieve-cp311
    - name: typing-extensions-cp311
    # PEP-517 build backend, from this sdist's [build-system] requires.
    # --no-build-isolation means pip will NOT fetch it, so it has to be
    # in the build prefix already (build.sh bridges it onto sys.path).
    - name: hatchling-cp311
    - name: packaging-cp311
    - name: pathspec-cp311
    - name: pluggy-cp311
    - name: trove-classifiers-cp311
    - name: calver-cp311
  runtime:
    - name: python311
    - name: soupsieve-cp311
    - name: typing-extensions-cp311
  host_tools:
    - python311

build:
  build_type_independent: true
  matrix:
    - platform: any
      script: build.sh
    - platform: windows
      script: build.ps1

package:
  files:
    - { glob: "lib/python3.11/site-packages/bs4/", platforms: [any] }
    - { glob: "lib/python3.11/site-packages/*.dist-info/", platforms: [any] }
    - { glob: "Lib/site-packages/bs4/", platforms: [windows] }
    - { glob: "Lib/site-packages/*.dist-info/", platforms: [windows] }
