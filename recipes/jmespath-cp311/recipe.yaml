schema_version: 1
recipe:
  name: jmespath-cp311
  upstream_version: "1.1.0"
  # cvc.4: republish.  The published noarch cvc.3 bundle's console scripts
  # (jp.py) carry the build machine's interpreter as their shebang (the old
  # libcvc-deps macOS CI prefix), so they cannot run anywhere; packing today
  # rewrites it to /usr/bin/env.
  # cvc.5: republish from a cvcpkg 2.5.10 builder.  On Windows, Scripts/jp.py
  # carried pip's #!C:\cvb\...\python.exe shebang (the job's deps prefix,
  # a path any local user can create), which the py launcher runs;
  # cy-pca/cvcpkg#506 taught packing to rewrite it to /usr/bin/env python.
  cvc_revision: 5

  maintainer: "cvcpkg group"
  maintainer_email: "info@cvcpkg.org"
  maintainer_url: "https://cvcpkg.org"
  homepage: https://pypi.org/project/jmespath/
  license: "MIT"
  tags: [python, source]
  description: >-
    jmespath 1.1.0 for CPython 3.11 — the cp311 column of
    cvcpkg's per-interpreter matrix (pure-Python, built from the PyPI sdist);
    generated by tools/gen_python_recipes.py.
    Built FROM SOURCE: cvcpkg fetches and sha256-verifies the PyPI sdist,
    and build.sh compiles the wheel with the prefix's own CPython 3.11 —
    no third-party prebuilt binary enters the bundle.

# From-source sdist, sha256 as published by PyPI for this exact version.
source:
  # Built from the source package jmespath-src, which pins the upstream tarball
  # (https://files.pythonhosted.org/packages/d3/59/322338183ecda247fb5d1763a6cbe46eff7222eaeebafd9fa65d4bf5cb11/jmespath-1.1.0.tar.gz).
  type: package
  package: jmespath-src

python:
  interpreter: python311
  abi: cp311

patches: []

depends:
  build:
    - name: jmespath-src
      version: "==1.1.0"
    - name: python311
    # PEP-517 build backend, from this sdist's [build-system] requires.
    # --no-build-isolation means pip will NOT fetch it, so it has to be
    # in the build prefix already (build.sh bridges it onto sys.path).
    - name: setuptools-cp311
    - name: wheel-cp311
  runtime:
    - name: python311
  host_tools:
    - python311

provides:
  - jmespath

build:
  build_type_independent: true
  matrix:
    - platform: any
      script: build.sh
    - platform: windows
      script: build.ps1

package:
  files:
    - { glob: "lib/python3.11/site-packages/jmespath/", platforms: [any] }
    - { glob: "lib/python3.11/site-packages/*.dist-info/", platforms: [any] }
    - { glob: "bin/jp.py", platforms: [any] }
    - { glob: "Lib/site-packages/jmespath/", platforms: [windows] }
    - { glob: "Lib/site-packages/*.dist-info/", platforms: [windows] }
