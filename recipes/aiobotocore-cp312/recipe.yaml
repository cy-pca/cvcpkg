schema_version: 1
recipe:
  name: aiobotocore-cp312
  upstream_version: "3.9.0"
  cvc_revision: 1

  maintainer: "cvcpkg group"
  maintainer_email: "info@cvcpkg.org"
  maintainer_url: "https://cvcpkg.org"
  homepage: https://pypi.org/project/aiobotocore/
  license: "Apache-2.0"
  tags: [python, source]
  description: >-
    aiobotocore 3.9.0 for CPython 3.12 — the cp312 column of
    cvcpkg's per-interpreter matrix (pure-Python, built from the PyPI sdist);
    generated by tools/gen_python_recipes.py.
    Built FROM SOURCE: cvcpkg fetches and sha256-verifies the PyPI sdist,
    and build.sh compiles the wheel with the prefix's own CPython 3.12 —
    no third-party prebuilt binary enters the bundle.

# From-source sdist, sha256 as published by PyPI for this exact version.
source:
  type: tarball
  url: https://files.pythonhosted.org/packages/73/c0/18abcb7e4e504a68714c280853fd180afe376a4a55e5511fb04ba76702e4/aiobotocore-3.9.0.tar.gz
  sha256: "5d344e97c518b010bea167c7f7ba4f9e785f9d2b8ac7af4fd00846c62f2c0a10"
  strip_components: 1

python:
  interpreter: python312
  abi: cp312

patches: []

depends:
  build:
    - name: python312
    - name: aiohttp-cp312
    - name: aioitertools-cp312
    - name: botocore-cp312
    - name: jmespath-cp312
    - name: multidict-cp312
    - name: python-dateutil-cp312
    - name: wrapt-cp312
    # PEP-517 build backend, from this sdist's [build-system] requires.
    # --no-build-isolation means pip will NOT fetch it, so it has to be
    # in the build prefix already (build.sh bridges it onto sys.path).
    - name: hatchling-cp312
    - name: hatch-fancy-pypi-readme-cp312
    - name: packaging-cp312
    - name: pathspec-cp312
    - name: pluggy-cp312
    - name: trove-classifiers-cp312
    - name: calver-cp312
  runtime:
    - name: python312
    - name: aiohttp-cp312
    - name: aioitertools-cp312
    - name: botocore-cp312
    - name: jmespath-cp312
    - name: multidict-cp312
    - name: python-dateutil-cp312
    - name: wrapt-cp312
  host_tools:
    - python312

build:
  build_type_independent: true
  matrix:
    - platform: any
      script: build.sh
    - platform: windows
      script: build.ps1

package:
  files:
    - { glob: "lib/python3.12/site-packages/aiobotocore/", platforms: [any] }
    - { glob: "lib/python3.12/site-packages/*.dist-info/", platforms: [any] }
    - { glob: "Lib/site-packages/aiobotocore/", platforms: [windows] }
    - { glob: "Lib/site-packages/*.dist-info/", platforms: [windows] }
