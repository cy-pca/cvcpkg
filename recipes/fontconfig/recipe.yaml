schema_version: 1
recipe:
  name: fontconfig
  upstream_version: "2.15.0"
  # cvc.2: add the windows build (build.ps1, Meson + MSVC) and the MSVC
  # artifact patterns.  Both cairo and pango declare fontconfig as a runtime
  # dep on every platform, so their new windows entries are only honest once
  # fontconfig covers windows too.  The packaged file set changes
  # (fontconfig.lib in lib/, fontconfig-1.dll in bin/), hence a bump.
  # cvc.3: declare the gperf build dependency (Unix). It was always required to
  # generate src/fcobjshash.h but was resolved from the builder's system
  # packages, so the build was not hermetic and not reproducible across hosts.
  # cvc.4: relocatable on Unix. libfontconfig had this job's staging prefix
  # compiled in as its config dir, so an installed bundle logged "Cannot load
  # default config file" and never read the etc/fonts/fonts.conf it ships.
  # unix-relocatable-config.patch finds etc/fonts next to the library via
  # dladdr (Windows' DllMain already does this). fonts.conf drops the staging
  # <cachedir> and gains <dir prefix="relative">../../share/fonts</dir>, so fonts
  # installed into the prefix are found (build.sh, build.ps1).
  # cvc.5: relocatable on Windows too. "Windows' DllMain already does this" was
  # wrong for this build: fccfg.c compiles DllMain only with PIC or DLL_EXPORT,
  # which meson never defines, so cvc.4's DLL (the first Windows bundle) logged
  # the same "Cannot load default config file" and ignored etc\fonts.  build.ps1
  # now passes -DDLL_EXPORT.  windows-realpath.patch fixes the fonts.conf
  # <dir prefix="relative">../../share/fonts</dir> on Windows: with MSVC's
  # 128-byte FC_PATH_MAX, a fonts.conf more than 128 characters deep resolved
  # that dir against the current directory.  Unix code is unchanged.
  cvc_revision: 5
  maintainer: "cvcpkg group"
  maintainer_email: "info@cvcpkg.org"
  maintainer_url: "https://cvcpkg.org"
  homepage: https://www.freedesktop.org/wiki/Software/fontconfig/
  license: MIT
  tags: [libraries]
  description: >-
    Fontconfig — a library for configuring and customising font access.
    Required by Pango and Cairo for font discovery on Linux, macOS and
    Windows.

source:
  # Built from the source package fontconfig-src, which pins the upstream tarball
  # (https://www.freedesktop.org/software/fontconfig/release/fontconfig-2.15.0.tar.xz).
  type: package
  package: fontconfig-src

patches:
  # Unix: look for etc/fonts relative to the loaded library (dladdr) before
  # the compiled-in path. Guarded by a meson dladdr check and !_WIN32.
  - unix-relocatable-config.patch
  # Windows: FcStrRealPath's GetFullPathNameA got a 128-byte buffer (MSVC has
  # no PATH_MAX) and ignored a too-small result. Touches only the _WIN32 branch.
  - windows-realpath.patch

depends:
  build:
    - name: fontconfig-src
      version: "==2.15.0"
    - ninja
    - meson
    - pkg-config
    - name: python3
      platforms: [linux, macos, freebsd, openbsd, netbsd]
    - name: python312
      platforms: [windows]
    # fontconfig runs gperf to generate src/fcobjshash.h. Undeclared, the build
    # silently used whatever gperf the builder happened to have installed — and
    # where there is none it falls back to fetching upstream's
    # subprojects/gperf.wrap at meson-setup time. Neither is hermetic. Windows
    # too: gperf's build.ps1 compiles it with MSVC, and meson's
    # --wrap-mode=nofallback (Invoke-CvcMesonBuild) refuses the wrap.
    - gperf
    # The Windows expat bundle has no expat.pc (expat's CMake build installs
    # none under MSVC), so meson finds expat through its CMake package, which
    # needs cmake.  Undeclared, it worked only where the builder had cmake.
    - name: cmake
      platforms: [windows]
  runtime:
    - name: freetype
      version: "^2.13"
    - name: expat
      version: "^2.6"
  host_tools: []

build:
  matrix:
    - platform: linux
      script: build.sh
      env:
        CFLAGS: "-O2 -fPIC"
    - platform: macos
      script: build.sh
      env:
        MACOSX_DEPLOYMENT_TARGET: "13.0"
    - platform: freebsd
      script: build.sh
      env:
        CFLAGS: "-O2 -fPIC"
    - platform: openbsd
      script: build.sh
      env:
        CFLAGS: "-O2 -fPIC"
    - platform: netbsd
      script: build.sh
      env:
        CFLAGS: "-O2 -fPIC"
    - platform: windows
      script: build.ps1

package:
  files:
    # Unix shared/static artifacts (.so / .so.N / .dylib / .a).
    - { glob: "lib/libfontconfig*", platforms: [linux, macos, freebsd, openbsd, netbsd] }
    - lib/pkgconfig/fontconfig.pc
    - include/fontconfig/
    - bin/fc-*
    - etc/fonts/
    - share/fontconfig/
    # Windows (MSVC): import library under lib/, versioned runtime DLL
    # under bin/.  The fc-* tools above pick up their .exe suffix from
    # the same glob.
    - lib/fontconfig*.lib
    - bin/fontconfig*.dll
  pkg_config:
    - fontconfig

abi:
  cxx_std: 17
