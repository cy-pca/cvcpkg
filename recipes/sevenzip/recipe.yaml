patches: []

depends:
  build: []
  runtime: []
  host_tools: []

build:
  build_type_independent: true
  matrix:
    - platform: linux
      script: build-posix.sh
    - platform: macos
      script: build-posix.sh
    - platform: windows
      script: build.ps1
    - platform: freebsd
      script: build-src.sh
    - platform: openbsd
      script: build-src.sh
    - platform: netbsd
      script: build-src.sh
    - platform: haiku
      script: build-src.sh

package:
  files:
    - bin/7z*
  cmake_packages: []

notes:
  - title: "Tool name"
    description: >-
      POSIX installs `7zz` (the full 7-Zip console) with a `7z` symlink;
      Windows installs the full `7z.exe` + `7z.dll` (plus standalone `7za.exe`).
      All read .rar and .iso; the Windows standalone `7za.exe` alone does not,
      which is why the full DLL is staged.
