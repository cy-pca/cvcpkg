schema_version: 1
recipe:
  name: aspell
  upstream_version: "0.60.8"
  # cvc.3: relocatable .pc/.cmake/bin/*-config.  The published cvc.2
  # kept build-machine paths (/tmp/cvcpkg-builder/...) in them, so pkg-config,
  # find_package or the -config script handed consumers dead -I/-L paths
  # (2026-10-13 scan of every published linux bundle).
  cvc_revision: 3
  maintainer: "cvcpkg group"
  maintainer_email: "info@cvcpkg.org"
  maintainer_url: "https://cvcpkg.org"
  description: "GNU Aspell — spell-checker library and command-line tool."
  homepage: http://aspell.net/
  license: LGPL-2.1-or-later
  tags: [libraries, i18n]

source:
  # Built from the source package aspell-src, which pins the upstream tarball
  # (https://ftp.gnu.org/gnu/aspell/aspell-0.60.8.tar.gz).
  type: package
  package: aspell-src

patches:
  # common/file_util.cpp's WIN32 branch calls asc_isalpha without including
  # asc_ctype.hpp (MinGW g++ 16).  Harmless on other platforms.
  - file_util-asc-ctype.patch

depends:
  build:
    - name: aspell-src
      version: "==0.60.8"
  runtime: []
  host_tools: []

build:
  matrix:
    - platform: linux
      script: build.sh
      env:
        CFLAGS: "-O2 -fPIC"
        CXXFLAGS: "-O2 -fPIC -std=c++17"
    - platform: macos
      script: build.sh
      env:
        MACOSX_DEPLOYMENT_TARGET: "13.0"
    - platform: freebsd
      script: build.sh
      env:
        CFLAGS: "-O2 -fPIC"
        CXXFLAGS: "-O2 -fPIC -std=c++17"
    - platform: openbsd
      script: build.sh
      env:
        CFLAGS: "-O2 -fPIC"
        CXXFLAGS: "-O2 -fPIC -std=c++17"
    - platform: netbsd
      script: build.sh
      env:
        CFLAGS: "-O2 -fPIC"
        CXXFLAGS: "-O2 -fPIC -std=c++17"
    - platform: windows
      script: build.ps1

package:
  files:
    - lib/libaspell*
    - lib/libpspell*
    - lib/pkgconfig/aspell.pc
    - lib/aspell-0.60/
    - include/aspell.h
    - include/pspell/
    - bin/aspell*
    - bin/precat*
    - bin/preunzip*
    - bin/prezip*
    - bin/word-list-compress*
    # share/aspell/ only exists with dictionaries installed, and none are packaged.
  cmake_packages: []

abi:
  cxx_std: 17
