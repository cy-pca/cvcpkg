schema_version: 1
recipe:
  name: pyrsistent-cp311
  upstream_version: "0.20.0"
  cvc_revision: 3

  maintainer: "cvcpkg group"
  maintainer_email: "info@cvcpkg.org"
  maintainer_url: "https://cvcpkg.org"
  homepage: https://pypi.org/project/pyrsistent/
  license: "MIT"
  tags: [python, source]
  description: >-
    pyrsistent 0.20.0 for CPython 3.11 — the cp311 column of
    cvcpkg's per-interpreter matrix (pure-Python, built from the PyPI sdist);
    generated by tools/gen_python_recipes.py.
    Built FROM SOURCE: cvcpkg fetches and sha256-verifies the PyPI sdist,
    and build.sh compiles the wheel with the prefix's own CPython 3.11 —
    no third-party prebuilt binary enters the bundle.

# From-source sdist, sha256 as published by PyPI for this exact version.
source:
  # Built from the source package pyrsistent-src, which pins the upstream tarball
  # (https://files.pythonhosted.org/packages/ce/3a/5031723c09068e9c8c2f0bc25c3a9245f2b1d1aea8396c787a408f2b95ca/pyrsistent-0.20.0.tar.gz).
  type: package
  package: pyrsistent-src

python:
  interpreter: python311
  abi: cp311

patches: []

depends:
  build:
    - name: pyrsistent-src
      version: "==0.20.0"
    - name: python311
    # PEP-517 build backend, from this sdist's [build-system] requires.
    # --no-build-isolation means pip will NOT fetch it, so it has to be
    # in the build prefix already (build.sh bridges it onto sys.path).
    - name: setuptools-cp311
    - name: wheel-cp311
  runtime:
    - name: python311
  host_tools:
    - python311

build:
  build_type_independent: true
  matrix:
    - platform: any
      script: build.sh
      env:
        PYRSISTENT_SKIP_EXTENSION: "1"
    - platform: windows
      script: build.ps1
      env:
        PYRSISTENT_SKIP_EXTENSION: "1"

package:
  files:
    - { glob: "lib/python3.11/site-packages/pyrsistent/", platforms: [any] }
    - { glob: "lib/python3.11/site-packages/*.dist-info/", platforms: [any] }
    - { glob: "Lib/site-packages/pyrsistent/", platforms: [windows] }
    - { glob: "Lib/site-packages/*.dist-info/", platforms: [windows] }
