schema_version: 1
recipe:
  name: frozenlist-cp311
  upstream_version: "1.8.0"
  cvc_revision: 1

  maintainer: "cvcpkg group"
  maintainer_email: "info@cvcpkg.org"
  maintainer_url: "https://cvcpkg.org"
  homepage: https://pypi.org/project/frozenlist/
  license: "Apache-2.0"
  tags: [python, source]
  description: >-
    frozenlist 1.8.0 for CPython 3.11 — the cp311 column of
    cvcpkg's per-interpreter matrix (C extensions compiled for cp311 from the PyPI sdist);
    generated by tools/gen_python_recipes.py.
    Built FROM SOURCE: cvcpkg fetches and sha256-verifies the PyPI sdist,
    and build.sh compiles the wheel with the prefix's own CPython 3.11 —
    no third-party prebuilt binary enters the bundle.

# From-source sdist, sha256 as published by PyPI for this exact version.
source:
  # Built from the source package frozenlist-src, which pins the upstream tarball
  # (https://files.pythonhosted.org/packages/2d/f5/c831fac6cc817d26fd54c7eaccd04ef7e0288806943f7cc5bbf69f3ac1f0/frozenlist-1.8.0.tar.gz).
  type: package
  package: frozenlist-src

python:
  interpreter: python311
  abi: cp311

patches: []

depends:
  build:
    - name: frozenlist-src
      version: "==1.8.0"
    - name: python311
    # PEP-517 build backend, from this sdist's [build-system] requires.
    # --no-build-isolation means pip will NOT fetch it, so it has to be
    # in the build prefix already (build.sh bridges it onto sys.path).
    - name: expandvars-cp311
    - name: setuptools-cp311
    - name: cython-cp311
  runtime:
    - name: python311
  host_tools:
    - python311

build:
  build_type_independent: true
  matrix:
    - platform: linux
      script: build.sh
    - platform: macos
      script: build.sh
    - platform: windows
      script: build.ps1

package:
  files:
    - { glob: "lib/python3.11/site-packages/frozenlist/", platforms: [linux, macos] }
    - { glob: "lib/python3.11/site-packages/*.dist-info/", platforms: [linux, macos] }
    - { glob: "Lib/site-packages/frozenlist/", platforms: [windows] }
    - { glob: "Lib/site-packages/*.dist-info/", platforms: [windows] }
