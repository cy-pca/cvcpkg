schema_version: 1
recipe:
  name: ml-dtypes-cp311
  upstream_version: "0.5.4"
  cvc_revision: 2

  maintainer: "cvcpkg group"
  maintainer_email: "info@cvcpkg.org"
  maintainer_url: "https://cvcpkg.org"
  homepage: https://pypi.org/project/ml-dtypes/
  license: "Apache-2.0"
  tags: [python, source]
  description: >-
    ml-dtypes 0.5.4 for CPython 3.11 — the cp311 column of
    cvcpkg's per-interpreter matrix (C extensions compiled for cp311 from the PyPI sdist);
    generated by tools/gen_python_recipes.py.
    Built FROM SOURCE: cvcpkg fetches and sha256-verifies the PyPI sdist,
    and build.sh compiles the wheel with the prefix's own CPython 3.11 —
    no third-party prebuilt binary enters the bundle.

# From-source sdist, sha256 as published by PyPI for this exact version.
source:
  # Built from the source package ml-dtypes-src, which pins the upstream tarball
  # (https://files.pythonhosted.org/packages/0e/4a/c27b42ed9b1c7d13d9ba8b6905dece787d6259152f2309338aed29b2447b/ml_dtypes-0.5.4.tar.gz).
  type: package
  package: ml-dtypes-src

python:
  interpreter: python311
  abi: cp311

patches: []

depends:
  build:
    - name: ml-dtypes-src
      version: "==0.5.4"
    - name: python311
    - name: numpy-cp311
    # PEP-517 build backend, from this sdist's [build-system] requires.
    # --no-build-isolation means pip will NOT fetch it, so it has to be
    # in the build prefix already (build.sh bridges it onto sys.path).
    - name: setuptools-cp311
  runtime:
    - name: python311
    - name: numpy-cp311
  host_tools:
    - python311

build:
  build_type_independent: true
  matrix:
    - platform: linux
      script: build.sh
    - platform: macos
      script: build.sh
    - platform: windows
      script: build.ps1

package:
  files:
    - { glob: "lib/python3.11/site-packages/ml_dtypes/", platforms: [linux, macos] }
    - { glob: "lib/python3.11/site-packages/ml_dtypes-*.dist-info/", platforms: [linux, macos] }
    - { glob: "Lib/site-packages/ml_dtypes/", platforms: [windows] }
    - { glob: "Lib/site-packages/ml_dtypes-*.dist-info/", platforms: [windows] }
