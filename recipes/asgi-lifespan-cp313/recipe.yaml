schema_version: 1
recipe:
  name: asgi-lifespan-cp313
  upstream_version: "2.1.0"
  cvc_revision: 1

  maintainer: "cvcpkg group"
  maintainer_email: "info@cvcpkg.org"
  maintainer_url: "https://cvcpkg.org"
  homepage: https://pypi.org/project/asgi-lifespan/
  license: "MIT"
  tags: [python, source]
  description: >-
    asgi-lifespan 2.1.0 for CPython 3.13 — the cp313 column of
    cvcpkg's per-interpreter matrix (pure-Python, built from the PyPI sdist);
    generated by tools/gen_python_recipes.py.
    Built FROM SOURCE: cvcpkg fetches and sha256-verifies the PyPI sdist,
    and build.sh compiles the wheel with the prefix's own CPython 3.13 —
    no third-party prebuilt binary enters the bundle.

# From-source sdist, sha256 as published by PyPI for this exact version.
source:
  # Built from the source package asgi-lifespan-src, which pins the upstream tarball
  # (https://files.pythonhosted.org/packages/6a/da/e7908b54e0f8043725a990bf625f2041ecf6bfe8eb7b19407f1c00b630f7/asgi-lifespan-2.1.0.tar.gz).
  type: package
  package: asgi-lifespan-src

python:
  interpreter: python313
  abi: cp313

patches: []

depends:
  build:
    - name: asgi-lifespan-src
      version: "==2.1.0"
    - name: python313
    - name: sniffio-cp313
    # PEP-517 build backend, from this sdist's [build-system] requires.
    # --no-build-isolation means pip will NOT fetch it, so it has to be
    # in the build prefix already (build.sh bridges it onto sys.path).
    - name: setuptools-cp313
    - name: setuptools-scm-cp313
    - name: wheel-cp313
  runtime:
    - name: python313
    - name: sniffio-cp313
  host_tools:
    - python313

build:
  build_type_independent: true
  matrix:
    - platform: any
      script: build.sh
    - platform: windows
      script: build.ps1

package:
  files:
    - { glob: "lib/python3.13/site-packages/asgi_lifespan/", platforms: [any] }
    - { glob: "lib/python3.13/site-packages/asgi_lifespan-*.dist-info/", platforms: [any] }
    - { glob: "Lib/site-packages/asgi_lifespan/", platforms: [windows] }
    - { glob: "Lib/site-packages/asgi_lifespan-*.dist-info/", platforms: [windows] }
