schema_version: 1
recipe:
  name: urllib3-cp312
  upstream_version: "2.7.0"
  cvc_revision: 3

  maintainer: "cvcpkg group"
  maintainer_email: "info@cvcpkg.org"
  maintainer_url: "https://cvcpkg.org"
  homepage: https://pypi.org/project/urllib3/
  license: "MIT"
  tags: [python, source]
  description: >-
    urllib3 2.7.0 for CPython 3.12 — the cp312 column of
    cvcpkg's per-interpreter matrix (pure-Python, built from the PyPI sdist);
    generated by tools/gen_python_recipes.py.
    Built FROM SOURCE: cvcpkg fetches and sha256-verifies the PyPI sdist,
    and build.sh compiles the wheel with the prefix's own CPython 3.12 —
    no third-party prebuilt binary enters the bundle.

# From-source sdist, sha256 as published by PyPI for this exact version.
source:
  # Built from the source package urllib3-src, which pins the upstream tarball
  # (https://files.pythonhosted.org/packages/53/0c/06f8b233b8fd13b9e5ee11424ef85419ba0d8ba0b3138bf360be2ff56953/urllib3-2.7.0.tar.gz).
  type: package
  package: urllib3-src

python:
  interpreter: python312
  abi: cp312

patches: []

depends:
  build:
    - name: urllib3-src
      version: "==2.7.0"
    - name: python312
    # PEP-517 build backend, from this sdist's [build-system] requires.
    # --no-build-isolation means pip will NOT fetch it, so it has to be
    # in the build prefix already (build.sh bridges it onto sys.path).
    - name: hatchling-cp312
    - name: hatch-vcs-cp312
    - name: setuptools-scm-cp312
    - name: packaging-cp312
    - name: pathspec-cp312
    - name: pluggy-cp312
    - name: trove-classifiers-cp312
    - name: calver-cp312
  runtime:
    - name: python312
  host_tools:
    - python312

build:
  build_type_independent: true
  matrix:
    - platform: any
      script: build.sh
    - platform: windows
      script: build.ps1

package:
  files:
    - { glob: "lib/python3.12/site-packages/urllib3/", platforms: [any] }
    - { glob: "lib/python3.12/site-packages/*.dist-info/", platforms: [any] }
    - { glob: "Lib/site-packages/urllib3/", platforms: [windows] }
    - { glob: "Lib/site-packages/*.dist-info/", platforms: [windows] }
