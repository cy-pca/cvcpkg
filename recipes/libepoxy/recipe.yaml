schema_version: 1
recipe:
  name: libepoxy
  upstream_version: "1.5.10"
  # cvc.2: linux builds against cvcpkg's libglvnd (EGL headers, libEGL) instead
  # of the build host's EGL headers, which the linux/arm64 runners lack.
  # cvc.3: GLX and X11 on linux (epoxy/glx.h), which GTK's X11 backend needs;
  # libx11 is a linux runtime dependency (epoxy.pc requires x11).
  cvc_revision: 3
  maintainer: "cvcpkg group"
  maintainer_email: "info@cvcpkg.org"
  maintainer_url: "https://cvcpkg.org"
  homepage: https://github.com/anholt/libepoxy
  license: MIT
  tags: [libraries]
  description: >-
    libepoxy — a library for handling OpenGL function pointer
    management.  Provides a dispatch mechanism that allows linking
    against GL, GLES, EGL, GLX, and WGL without compile-time
    dependencies.  Required by GTK 4.

source:
  # Built from the source package libepoxy-src, which pins the upstream tarball
  # (https://download.gnome.org/sources/libepoxy/1.5/libepoxy-1.5.10.tar.xz).
  type: package
  package: libepoxy-src

patches: []

depends:
  build:
    - name: libepoxy-src
      version: "==1.5.10"
    - ninja
    - meson
    - pkg-config
  runtime:
    # epoxy's installed <epoxy/egl.h> includes <EGL/eglplatform.h>, and it
    # dlopens libEGL at run time: both come from libglvnd.
    - name: libglvnd
      platforms: [linux]
    - name: libx11
      platforms: [linux]
  host_tools: []

build:
  matrix:
    - platform: linux
      script: build.sh
      env:
        CFLAGS: "-O2 -fPIC"
    - platform: macos
      script: build.sh
      env:
        MACOSX_DEPLOYMENT_TARGET: "13.0"
    - platform: freebsd
      script: build.sh
      env:
        CFLAGS: "-O2 -fPIC"
    - platform: openbsd
      script: build.sh
      env:
        CFLAGS: "-O2 -fPIC"
    - platform: netbsd
      script: build.sh
      env:
        CFLAGS: "-O2 -fPIC"
    - platform: windows
      script: build.ps1

package:
  files:
    # MSVC (windows): epoxy.lib + bin/epoxy-0.dll, no lib prefix.
    - { glob: "lib/libepoxy*", platforms: [linux, macos, freebsd, openbsd, netbsd] }
    - { glob: "lib/epoxy.lib", platforms: [windows] }
    - { glob: "bin/epoxy*.dll", platforms: [windows] }
    - lib/pkgconfig/epoxy.pc
    - include/epoxy/
  pkg_config:
    - epoxy

abi:
  cxx_std: 17
