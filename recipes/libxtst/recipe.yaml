schema_version: 1
recipe:
  name: libxtst
  upstream_version: "1.2.5"
  cvc_revision: 1
  maintainer: "cvcpkg group"
  maintainer_email: "info@cvcpkg.org"
  maintainer_url: "https://cvcpkg.org"
  homepage: https://www.x.org/
  license: MIT
  tags: [libraries, x11, graphics]
  description: >-
    X11 Test and Record extension client library (libXtst / Xtst).  Provides
    synthetic input (XTEST) and event recording (XRECORD).  Consumed by SDL's
    X11 backend (SDL_X11_XTEST, used for global mouse warp).

source:
  # Built from the source package libxtst-src, which pins the upstream tarball
  # (https://xorg.freedesktop.org/releases/individual/lib/libXtst-1.2.5.tar.xz).
  type: package
  package: libxtst-src

patches: []

depends:
  build:
    - name: libxtst-src
      version: "==1.2.5"
    - pkg-config
    - name: xorgproto
  runtime:
    - name: libx11
    - name: libxext
    - name: libxi
  host_tools: []

package:
  files:
    - lib/
    - include/
    - share/

build:
  matrix:
    - platform: linux
      script: build.sh
    - platform: freebsd
      script: build.sh
    - platform: openbsd
      script: build.sh
    - platform: netbsd
      script: build.sh
