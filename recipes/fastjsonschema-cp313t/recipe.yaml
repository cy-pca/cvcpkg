schema_version: 1
recipe:
  name: fastjsonschema-cp313t
  upstream_version: "2.21.1"
  cvc_revision: 1

  maintainer: "cvcpkg group"
  maintainer_email: "info@cvcpkg.org"
  maintainer_url: "https://cvcpkg.org"
  homepage: https://pypi.org/project/fastjsonschema/
  license: "BSD-3-Clause"
  tags: [python, source]
  description: >-
    fastjsonschema 2.21.1 for CPython 3.13t — the cp313t column of
    cvcpkg's per-interpreter matrix (pure-Python, built from the PyPI sdist);
    generated by tools/gen_python_recipes.py.
    Built FROM SOURCE: cvcpkg fetches and sha256-verifies the PyPI sdist,
    and build.sh compiles the wheel with the prefix's own CPython 3.13t —
    no third-party prebuilt binary enters the bundle.
    The cp313t column installs under the free-threaded (no-GIL)
    interpreter and its import check runs with the GIL disabled.

# From-source sdist, sha256 as published by PyPI for this exact version.
source:
  # Built from the source package fastjsonschema-src, which pins the upstream tarball
  # (https://files.pythonhosted.org/packages/8b/50/4b769ce1ac4071a1ef6d86b1a3fb56cdc3a37615e8c5519e1af96cdac366/fastjsonschema-2.21.1.tar.gz).
  type: package
  package: fastjsonschema-src

python:
  interpreter: python313t
  abi: cp313t

patches: []

depends:
  build:
    - name: fastjsonschema-src
      version: "==2.21.1"
    - name: python313t
    # PEP-517 build backend, from this sdist's [build-system] requires.
    # --no-build-isolation means pip will NOT fetch it, so it has to be
    # in the build prefix already (build.sh bridges it onto sys.path).
    - name: setuptools-cp313t
    - name: wheel-cp313t
  runtime:
    - name: python313t
  host_tools:
    - python313t

build:
  build_type_independent: true
  matrix:
    - platform: any
      script: build.sh
    - platform: windows
      script: build.ps1

package:
  files:
    - { glob: "lib/python3.13t/site-packages/fastjsonschema/", platforms: [any] }
    - { glob: "lib/python3.13t/site-packages/fastjsonschema-*.dist-info/", platforms: [any] }
    - { glob: "Lib/site-packages/fastjsonschema/", platforms: [windows] }
    - { glob: "Lib/site-packages/fastjsonschema-*.dist-info/", platforms: [windows] }
