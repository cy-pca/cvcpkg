schema_version: 1
recipe:
  name: pycodestyle-cp313
  upstream_version: "2.13.0"
  cvc_revision: 1

  maintainer: "cvcpkg group"
  maintainer_email: "info@cvcpkg.org"
  maintainer_url: "https://cvcpkg.org"
  homepage: https://pypi.org/project/pycodestyle/
  license: "MIT"
  tags: [python, source]
  description: >-
    pycodestyle 2.13.0 for CPython 3.13 — the cp313 column of
    cvcpkg's per-interpreter matrix (pure-Python, built from the PyPI sdist);
    generated by tools/gen_python_recipes.py.
    Built FROM SOURCE: cvcpkg fetches and sha256-verifies the PyPI sdist,
    and build.sh compiles the wheel with the prefix's own CPython 3.13 —
    no third-party prebuilt binary enters the bundle.

# From-source sdist, sha256 as published by PyPI for this exact version.
source:
  # Built from the source package pycodestyle-src, which pins the upstream tarball
  # (https://files.pythonhosted.org/packages/04/6e/1f4a62078e4d95d82367f24e685aef3a672abfd27d1a868068fed4ed2254/pycodestyle-2.13.0.tar.gz).
  type: package
  package: pycodestyle-src

python:
  interpreter: python313
  abi: cp313

patches: []

depends:
  build:
    - name: pycodestyle-src
      version: "==2.13.0"
    - name: python313
    # PEP-517 build backend, from this sdist's [build-system] requires.
    # --no-build-isolation means pip will NOT fetch it, so it has to be
    # in the build prefix already (build.sh bridges it onto sys.path).
    - name: setuptools-cp313
    - name: wheel-cp313
  runtime:
    - name: python313
  host_tools:
    - python313

provides:
  - pycodestyle

build:
  build_type_independent: true
  matrix:
    - platform: any
      script: build.sh
    - platform: windows
      script: build.ps1

package:
  files:
    - { glob: "lib/python3.13/site-packages/pycodestyle.py", platforms: [any] }
    - { glob: "lib/python3.13/site-packages/pycodestyle-*.dist-info/", platforms: [any] }
    - { glob: "bin/pycodestyle", platforms: [any] }
    - { glob: "Lib/site-packages/pycodestyle.py", platforms: [windows] }
    - { glob: "Lib/site-packages/pycodestyle-*.dist-info/", platforms: [windows] }
