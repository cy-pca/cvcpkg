schema_version: 1
recipe:
  name: xcb-util-renderutil
  upstream_version: "0.3.10"
  cvc_revision: 2
  maintainer: "cvcpkg group"
  maintainer_email: "info@cvcpkg.org"
  maintainer_url: "https://cvcpkg.org"
  homepage: https://xcb.freedesktop.org/
  license: MIT
  tags: [libraries, x11, graphics]
  description: >-
    XCB Render extension convenience library (xcb-render-util).

source:
  # Built from the source package xcb-util-renderutil-src, which pins the upstream tarball
  # (https://xorg.freedesktop.org/releases/individual/xcb/xcb-util-renderutil-0.3.10.tar.xz).
  type: package
  package: xcb-util-renderutil-src

patches: []

depends:
  build:
    - name: xcb-util-renderutil-src
      version: "==0.3.10"
    - pkg-config
  runtime:
    - name: libxcb
  host_tools: []

package:
  files:
    - lib/
    - include/

build:
  matrix:
    - platform: linux
      script: build.sh
    - platform: freebsd
      script: build.sh
    - platform: openbsd
      script: build.sh
    - platform: netbsd
      script: build.sh
