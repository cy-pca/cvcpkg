schema_version: 1
recipe:
  name: tzdata-cp313t
  upstream_version: "2026.3"
  cvc_revision: 1

  maintainer: "cvcpkg group"
  maintainer_email: "info@cvcpkg.org"
  maintainer_url: "https://cvcpkg.org"
  homepage: https://pypi.org/project/tzdata/
  license: "Apache-2.0"
  tags: [python, source]
  description: >-
    tzdata 2026.3 for CPython 3.13t — the cp313t column of
    cvcpkg's per-interpreter matrix (pure-Python, built from the PyPI sdist);
    generated by tools/gen_python_recipes.py.
    Built FROM SOURCE: cvcpkg fetches and sha256-verifies the PyPI sdist,
    and build.sh compiles the wheel with the prefix's own CPython 3.13t —
    no third-party prebuilt binary enters the bundle.
    The cp313t column installs under the free-threaded (no-GIL)
    interpreter and its import check runs with the GIL disabled.

# From-source sdist, sha256 as published by PyPI for this exact version.
source:
  # Built from the source package tzdata-src, which pins the upstream tarball
  # (https://files.pythonhosted.org/packages/92/ff/5a28bdfd8c3ebec42564ac7d0e54ca3db65044a9314a97f9564fa7a1e926/tzdata-2026.3.tar.gz).
  type: package
  package: tzdata-src

python:
  interpreter: python313t
  abi: cp313t

patches: []

depends:
  build:
    - name: tzdata-src
      version: "==2026.3"
    - name: python313t
    # PEP-517 build backend, from this sdist's [build-system] requires.
    # --no-build-isolation means pip will NOT fetch it, so it has to be
    # in the build prefix already (build.sh bridges it onto sys.path).
    - name: setuptools-cp313t
    - name: wheel-cp313t
  runtime:
    - name: python313t
  host_tools:
    - python313t

build:
  build_type_independent: true
  matrix:
    - platform: any
      script: build.sh
    - platform: windows
      script: build.ps1

package:
  files:
    - { glob: "lib/python3.13t/site-packages/tzdata/", platforms: [any] }
    - { glob: "lib/python3.13t/site-packages/*.dist-info/", platforms: [any] }
    - { glob: "Lib/site-packages/tzdata/", platforms: [windows] }
    - { glob: "Lib/site-packages/*.dist-info/", platforms: [windows] }
