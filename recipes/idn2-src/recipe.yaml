  homepage: https://www.gnu.org/software/libidn/#libidn2
  license: LGPL-3.0-or-later OR GPL-2.0-or-later
  tags: [source]
  description: >-
    The unmodified upstream source of idn2 2.3.7: its release tarball,
    verified against the sha256 below and staged at src/idn2-src/.  The idn2
