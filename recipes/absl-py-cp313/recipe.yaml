schema_version: 1
recipe:
  name: absl-py-cp313
  upstream_version: "2.5.1"
  cvc_revision: 2

  maintainer: "cvcpkg group"
  maintainer_email: "info@cvcpkg.org"
  maintainer_url: "https://cvcpkg.org"
  homepage: https://pypi.org/project/absl-py/
  license: "Apache-2.0"
  tags: [python, source]
  description: >-
    absl-py 2.5.1 for CPython 3.13 — the cp313 column of
    cvcpkg's per-interpreter matrix (pure-Python, built from the PyPI sdist);
    generated by tools/gen_python_recipes.py.
    Built FROM SOURCE: cvcpkg fetches and sha256-verifies the PyPI sdist,
    and build.sh compiles the wheel with the prefix's own CPython 3.13 —
    no third-party prebuilt binary enters the bundle.

# From-source sdist, sha256 as published by PyPI for this exact version.
source:
  # Built from the source package absl-py-src, which pins the upstream tarball
  # (https://files.pythonhosted.org/packages/1f/1d/58e2b5a6e4d703ccb2a029943d665974cb3d5a4fb2b3e3675dd03a9df10e/absl_py-2.5.1.tar.gz).
  type: package
  package: absl-py-src

python:
  interpreter: python313
  abi: cp313

patches: []

depends:
  build:
    - name: absl-py-src
      version: "==2.5.1"
    - name: python313
    # PEP-517 build backend, from this sdist's [build-system] requires.
    # --no-build-isolation means pip will NOT fetch it, so it has to be
    # in the build prefix already (build.sh bridges it onto sys.path).
    - name: hatchling-cp313
    - name: packaging-cp313
    - name: pathspec-cp313
    - name: pluggy-cp313
    - name: trove-classifiers-cp313
    - name: calver-cp313
  runtime:
    - name: python313
  host_tools:
    - python313

build:
  build_type_independent: true
  matrix:
    - platform: any
      script: build.sh
    - platform: windows
      script: build.ps1

package:
  files:
    - { glob: "lib/python3.13/site-packages/absl/", platforms: [any] }
    - { glob: "lib/python3.13/site-packages/absl_py-*.dist-info/", platforms: [any] }
    - { glob: "Lib/site-packages/absl/", platforms: [windows] }
    - { glob: "Lib/site-packages/absl_py-*.dist-info/", platforms: [windows] }
