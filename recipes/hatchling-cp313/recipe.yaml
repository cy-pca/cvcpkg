schema_version: 1
recipe:
  name: hatchling-cp313
  upstream_version: "1.31.0"
  # cvc.5 (freethreaded-leak republish): the published cvc.4 any/noarch bundle
  # installs to lib/python3.13t/site-packages -- a python313t (before its cvc.7) shadowed
  # python3.13 when it was built -- so python3.13 cannot import it and cp313 builds that
  # depend on it fail (aiokafka-cp313 on async-timeout-cp313, 2026-10-13).  Rebuilding
  # lays it under lib/python3.13/.  Found by auditing every published cp313 bundle.
  cvc_revision: 5

  maintainer: "cvcpkg group"
  maintainer_email: "info@cvcpkg.org"
  maintainer_url: "https://cvcpkg.org"
  homepage: https://pypi.org/project/hatchling/
  license: "MIT"
  tags: [python, source]
  description: >-
    hatchling 1.31.0 for CPython 3.13 — the cp313 column of
    cvcpkg's per-interpreter matrix (pure-Python, built from the PyPI sdist);
    generated by tools/gen_python_recipes.py.
    Built FROM SOURCE: cvcpkg fetches and sha256-verifies the PyPI sdist,
    and build.sh compiles the wheel with the prefix's own CPython 3.13 —
    no third-party prebuilt binary enters the bundle.

# From-source sdist, sha256 as published by PyPI for this exact version.
source:
  type: tarball
  url: https://files.pythonhosted.org/packages/25/e2/dfa73fe78f773018dcaebc6d09b819bc10d328ff5a6b4a66efa1e3d71f52/hatchling-1.31.0.tar.gz
  sha256: "6b48ad4068a482ed7239b3a8215bc55b47aad3345d58dfc94e553c5d2d46211b"
  strip_components: 1

python:
  interpreter: python313
  abi: cp313

patches: []

depends:
  build:
    - name: python313
    - name: packaging-cp313
    - name: pathspec-cp313
    - name: pluggy-cp313
    - name: trove-classifiers-cp313
  runtime:
    - name: python313
    - name: packaging-cp313
    - name: pathspec-cp313
    - name: pluggy-cp313
    - name: trove-classifiers-cp313
  host_tools:
    - python313

build:
  build_type_independent: true
  matrix:
    - platform: any
      script: build.sh
    - platform: windows
      script: build.ps1

package:
  files:
    - { glob: "lib/python3.13/site-packages/hatchling/", platforms: [any] }
    - { glob: "lib/python3.13/site-packages/hatchling-*.dist-info/", platforms: [any] }
    - { glob: "Lib/site-packages/hatchling/", platforms: [windows] }
    - { glob: "Lib/site-packages/*.dist-info/", platforms: [windows] }
