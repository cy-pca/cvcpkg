schema_version: 1
recipe:
  name: geos-src
  upstream_version: "3.14.1"
  cvc_revision: 1
  maintainer: cvcpkg group
  maintainer_email: info@cvcpkg.org
  maintainer_url: https://cvcpkg.org
  homepage: https://libgeos.org/
  license: LGPL-2.1-only
  tags: [source]
  description: >-
    The unmodified upstream source of geos 3.14.1: its release tarball, verified
    against the sha256 below and staged at src/geos-src/.  The geos recipe
    builds from it (source.type package), so the tarball is fetched once, from
    download.osgeo.org, and every other build of geos -- another platform, a
    builder that cannot reach download.osgeo.org, a user building from source --
    installs this package from the catalog instead.  Generated by
    tools/make_source_package.py.

