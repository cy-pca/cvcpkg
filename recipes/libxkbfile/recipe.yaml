schema_version: 1
recipe:
  name: libxkbfile
  upstream_version: "1.2.0"
  cvc_revision: 1
  maintainer: "cvcpkg group"
  maintainer_email: "info@cvcpkg.org"
  maintainer_url: "https://cvcpkg.org"
  homepage: https://www.x.org/
  license: MIT
  tags: [libraries, x11]
  description: >-
    libxkbfile — XKB file handling routines (keymap read/write), used by
    xkbcomp and the X server.

source:
  # Built from the source package libxkbfile-src, which pins the upstream tarball
  # (https://xorg.freedesktop.org/archive/individual/lib/libxkbfile-1.2.0.tar.xz).
  type: package
  package: libxkbfile-src

patches: []

depends:
  build:
    - name: libxkbfile-src
      version: "==1.2.0"
    - meson
    - ninja
    - pkg-config
    - patchelf
    - name: xorgproto
  runtime:
    - name: libx11
  host_tools: []

package:
  files:
    - lib/
    - include/
    - share/

build:
  matrix:
    - platform: linux
      script: build.sh
