schema_version: 1
recipe:
  name: vtk
  upstream_version: "9.5.0"
  # Bumped 1 -> 2: consume the hermetic X11 + OpenGL(GLVND)/GLU recipes on Linux
  # instead of system libs (find_package(X11)/OpenGL now resolve to the cvcpkg
  # prefix). Lets libcvc's publish-cvcpkg.yml drop its apt-get X11/GL line.
  # Bumped 2 -> 3: wasm build enables the rendering modules (WebGL2/GLES3
  # backend) + ESSL 3.00 volume-composer patch. The published 9.5.0+cvc.2 wasm
  # bundle is compute-only; without this bump the recipe change would no-op
  # against the immutable published variant.
  # Bumped 3 -> 4: the wasm builds use cvcpkg's libxml2, libtiff, liblzma and
  # freetype instead of VTK's bundled copies (see build-wasm.sh). Other
  # platforms rebuild unchanged.
  cvc_revision: 4
  maintainer: "cvcpkg group"
  maintainer_email: "info@cvcpkg.org"
  maintainer_url: "https://cvcpkg.org"
  description: "VTK — the Visualization Toolkit, an open-source system for 3D computer graphics, image processing, and visualization."
  homepage: https://vtk.org/
  license: BSD-3-Clause
  tags: [graphics, wasm]

source:
  # Built from the source package vtk-src, which pins the upstream tarball
  # (https://www.vtk.org/files/release/9.5/VTK-9.5.0.tar.gz).
  type: package
  package: vtk-src

patches:
  - vtk-fmt-cstdlib-wasm.patch
  # ESSL 3.00 forbids non-constant global initializers; the volume raycast
  # composer emitted `mat4 g_eyeToTexture = <uniform expr>;` at global scope,
  # which kills every shaded/scattering volume under WebGL2.
  - vtk-essl3-no-global-uniform-init.patch
  # VTK's FindLibXml2 (installed for consumers too) gives LibXml2::LibXml2 no
  # link deps, so a static libxml2 leaves zlib's gz* undefined.  Let libxml2's
  # own CMake package define the target.  Only reached when VTK uses an external
  # libxml2 (the wasm builds); the desktop builds keep VTK's bundled copy.
  - vtk-findlibxml2-prefer-config.patch
  # libtiff 4.7.0's TiffConfig.cmake never imports the targets its static
  # TIFF::tiff links (LERC::LERC, ZSTD::ZSTD, WebP::webp, ...), so CMake stops at
  # generate time.  Adds a FindTIFF.cmake (installed for consumers too) that
  # defines the missing ones, then runs CMake's own FindTIFF.  Only reached when
  # VTK uses an external libtiff (the wasm builds).
  - vtk-findtiff-import-deps.patch

depends:
  build:
    - name: vtk-src
      version: "==9.5.0"
    - cmake
    - ninja
  runtime:
    # Desktop-only: the wasm/wasi builds configure VTK without Qt or HDF5
    # (see build-wasm.sh), and neither dependency exists for those platforms —
    # without the filter, dependency resolution for a wasm-family install dies
    # looking for qt6@wasm.  Same mechanism as the X11 set below.
    - name: qt6
      version: ">=6.7"
      platforms: [linux, macos, windows, windows-gnu, freebsd, openbsd, netbsd, haiku]
    - name: hdf5
      version: "^1.14"
      platforms: [linux, macos, windows, windows-gnu, freebsd, openbsd, netbsd, haiku]
    - name: tiff
      version: "^4.6"
    - name: zlib
      version: "^1.3"
    # wasm/wasm-mt: VTK links these, and tiff above, instead of its bundled
    # copies (VTK_MODULE_USE_EXTERNAL_VTK_*). They are runtime deps because VTK's
    # installed config looks for them again in every consumer.
    - name: libxml2
      version: "^2.12"
      platforms: [wasm, wasm-mt]
    - name: xz
      version: "^5.6"
      platforms: [wasm, wasm-mt]
    - name: freetype
      version: "^2.13"
      platforms: [wasm, wasm-mt]
    # Hermetic X11 + OpenGL (Linux only; macOS/Windows use native windowing/GL).
    # VTK's X11 render window + RenderingOpenGL2 link these instead of system libs.
    - name: libx11
      platforms: [linux]
    - name: libxext
      platforms: [linux]
    - name: libxt
      platforms: [linux]
    - name: libglvnd
      platforms: [linux]
    - name: glu
      platforms: [linux]
  host_tools: []

build:
  # 5222 build steps: OpenBSD (two jobs per builder) reached step 3130 of 5222
  # after 92 min (job 22803), so the server's 2h default stops it short.  4h,
  # as openblas.  A build-metadata change, not a cvc_revision bump: it changes
  # no bundle.
  timeout_seconds: 14400
  matrix:
    - platform: linux
      script: build.sh
      env:
        CXXFLAGS: "-O2 -fPIC -std=c++17"
    - platform: macos
      script: build.sh
      env:
        MACOSX_DEPLOYMENT_TARGET: "13.0"
    # No freebsd or netbsd entries for now; they need to come back.  vtk has
    # never been built for either: its qt6 dep stops at configure on those
    # builders ("The OpenGL functionality tests failed!", dev jobs 23606 and
    # 23609, 2026-10-29) because they have no OpenGL, and VTK's rendering needs
    # it too.  qt6 is likewise unpublished there.  With the entries in place,
    # every vtk change sent qt6 for those platforms to the dev cluster and
    # failed the PR's build-on-dev check.  To restore them: give the FreeBSD
    # and NetBSD builders OpenGL (Mesa) or port the hermetic GL recipes the
    # Linux build uses, get qt6 publishing there, then re-add both entries
    # with CXXFLAGS "-O2 -fPIC -std=c++17", as openbsd has.
    - platform: openbsd
      script: build.sh
      env:
        CXXFLAGS: "-O2 -fPIC -std=c++17"
    - platform: windows
      script: build.ps1
    - platform: wasm
      host_platform: linux
      script: build-wasm.sh
    # Threaded wasm: same build script; env-wasm.sh injects -pthread via the
    # CVC_WASM_THREADS hook this script already honors.
    - platform: wasm-mt
      host_platform: linux
      script: build-wasm.sh
      env:
        CVC_WASM_THREADS: "1"
    - platform: wasm
      host_platform: windows
      script: build-wasm.ps1

package:
  files:
    - lib/libvtk*
    - lib/vtk*
    - lib/cmake/vtk*/
    - include/vtk*/
    - bin/vtk*
    - share/vtk*/
    - share/licenses/VTK/
  cmake_packages:
    - { name: VTK, targets: ["VTK::CommonCore", "VTK::RenderingCore"] }

abi:
  cxx_std: 17
