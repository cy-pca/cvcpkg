schema_version: 1
recipe:
  name: x264-cli
  upstream_version: "0.164.0"
  cvc_revision: 1
  maintainer: "cvcpkg group"
  maintainer_email: "info@cvcpkg.org"
  maintainer_url: "https://cvcpkg.org"
  homepage: https://www.videolan.org/developers/x264.html
  license: GPL-2.0-or-later
  tags: [tools, multimedia, video]
  description: >-
    x264 command-line H.264 encoder.  Built from the same source
    tarball as the x264 library recipe; only the x264 binary is
    installed.  Requires libx264 at both build and runtime.

source:
  # Built from the source package x264-src, which pins the upstream tarball
  # (https://code.videolan.org/videolan/x264/-/archive/stable/x264-stable.tar.gz).
  type: package
  package: x264-src

patches: []

depends:
  build:
    - name: x264-src
      version: "==0.164.0"
    - name: x264
    - name: nasm
      platforms: [linux, macos, freebsd, openbsd, netbsd, windows]
    - pkg-config
    # Windows builds with MinGW-w64 under MSYS2 (build.ps1). Declared, as
    # aspell and nfft3 do, rather than reached through x264's host_tools.
    - name: msys2
      platforms: [windows]
    - name: make
      platforms: [windows]
    - name: mingw-w64-gcc
      platforms: [windows]
  runtime:
    - name: x264
  host_tools: []

build:
  matrix:
    - platform: linux
      script: build.sh
      env:
        CFLAGS: "-O2 -fPIC"
    - platform: macos
      script: build.sh
      env:
        MACOSX_DEPLOYMENT_TARGET: "13.0"
    - platform: freebsd
      script: build.sh
      env:
        CFLAGS: "-O2 -fPIC"
    - platform: openbsd
      script: build.sh
      env:
        CFLAGS: "-O2 -fPIC"
    - platform: netbsd
      script: build.sh
      env:
        CFLAGS: "-O2 -fPIC"
    - platform: windows
      script: build.ps1

package:
  files:
    - bin/x264*
