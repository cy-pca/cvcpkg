schema_version: 1
recipe:
  name: platformdirs-cp313
  upstream_version: "4.11.0"
  cvc_revision: 4

  maintainer: "cvcpkg group"
  maintainer_email: "info@cvcpkg.org"
  maintainer_url: "https://cvcpkg.org"
  homepage: https://pypi.org/project/platformdirs/
  license: "MIT"
  tags: [python, source]
  description: >-
    platformdirs 4.11.0 for CPython 3.13 — the cp313 column of
    cvcpkg's per-interpreter matrix (pure-Python, built from the PyPI sdist);
    generated by tools/gen_python_recipes.py.
    Built FROM SOURCE: cvcpkg fetches and sha256-verifies the PyPI sdist,
    and build.sh compiles the wheel with the prefix's own CPython 3.13 —
    no third-party prebuilt binary enters the bundle.

# From-source sdist, sha256 as published by PyPI for this exact version.
source:
  # Built from the source package platformdirs-src, which pins the upstream tarball
  # (https://files.pythonhosted.org/packages/78/9b/560e4be8e26f6fd133a03630a8df0c663b9e8d61b4ade152b72005aec83b/platformdirs-4.11.0.tar.gz).
  type: package
  package: platformdirs-src

python:
  interpreter: python313
  abi: cp313

patches: []

depends:
  build:
    - name: platformdirs-src
      version: "==4.11.0"
    - name: python313
    # PEP-517 build backend, from this sdist's [build-system] requires.
    # --no-build-isolation means pip will NOT fetch it, so it has to be
    # in the build prefix already (build.sh bridges it onto sys.path).
    - name: hatch-vcs-cp313
    - name: hatchling-cp313
    - name: packaging-cp313
    - name: pathspec-cp313
    - name: pluggy-cp313
    - name: trove-classifiers-cp313
    - name: calver-cp313
  runtime:
    - name: python313
  host_tools:
    - python313

build:
  build_type_independent: true
  matrix:
    - platform: any
      script: build.sh
    - platform: windows
      script: build.ps1

package:
  files:
    - { glob: "lib/python3.13/site-packages/platformdirs/", platforms: [any] }
    - { glob: "lib/python3.13/site-packages/platformdirs-*.dist-info/", platforms: [any] }
    - { glob: "Lib/site-packages/platformdirs/", platforms: [windows] }
    - { glob: "Lib/site-packages/*.dist-info/", platforms: [windows] }
