schema_version: 1
recipe:
  name: gcc-src
  upstream_version: "11.4.0"
  cvc_revision: 1
  maintainer: cvcpkg group
  maintainer_email: info@cvcpkg.org
  maintainer_url: https://cvcpkg.org
  homepage: https://gcc.gnu.org/fortran/
  license: GPL-3.0-or-later WITH GCC-exception-3.1
  tags: [source]
  description: >-
    The unmodified upstream source of gcc 11.4.0: its release tarball, verified
    against the sha256 below and staged at src/gcc-src/.  The gfortran recipe
    builds from it (source.type package), so the tarball is fetched once, from
    ftp.gnu.org, and every other build of gfortran -- another platform, a
    builder that cannot reach ftp.gnu.org, a user building from source --
    installs this package from the catalog instead.  Generated by
    tools/make_source_package.py.

