schema_version: 1
recipe:
  name: cython-cp313
  upstream_version: "3.2.9"
  cvc_revision: 7

  maintainer: "cvcpkg group"
  maintainer_email: "info@cvcpkg.org"
  maintainer_url: "https://cvcpkg.org"
  homepage: https://pypi.org/project/cython/
  license: "Apache-2.0"
  tags: [python, source]
  description: >-
    cython 3.2.9 for CPython 3.13 — the cp313 column of
    cvcpkg's per-interpreter matrix (C extensions compiled for cp313 from the PyPI sdist);
    generated by tools/gen_python_recipes.py.
    Built FROM SOURCE: cvcpkg fetches and sha256-verifies the PyPI sdist,
    and build.sh compiles the wheel with the prefix's own CPython 3.13 —
    no third-party prebuilt binary enters the bundle.

# From-source sdist, sha256 as published by PyPI for this exact version.
source:
  # Built from the source package cython-src, which pins the upstream tarball
  # (https://files.pythonhosted.org/packages/f6/de/db48b8870e766cfea809986cc50c1e986c663a9ab7bafd0ac1a2512c4a26/cython-3.2.9.tar.gz).
  type: package
  package: cython-src

python:
  interpreter: python313
  abi: cp313

patches: []

depends:
  build:
    - name: cython-src
      version: "==3.2.9"
    - name: python313
    # PEP-517 build backend, from this sdist's [build-system] requires.
    # --no-build-isolation means pip will NOT fetch it, so it has to be
    # in the build prefix already (build.sh bridges it onto sys.path).
    - name: setuptools-cp313
    - name: wheel-cp313
  runtime:
    - name: python313
  host_tools:
    - python313

provides:
  - cython

build:
  build_type_independent: true
  matrix:
    - platform: linux
      script: build.sh
    - platform: macos
      script: build.sh
    - platform: windows
      script: build.ps1
    - platform: freebsd
      script: build.sh
    - platform: netbsd
      script: build.sh
    - platform: openbsd
      script: build.sh

package:
  files:
    - { glob: "lib/python3.13/site-packages/Cython/", platforms: [freebsd, linux, macos, netbsd, openbsd] }
    - { glob: "lib/python3.13/site-packages/cython.py", platforms: [freebsd, linux, macos, netbsd, openbsd] }
    - { glob: "lib/python3.13/site-packages/pyximport/", platforms: [freebsd, linux, macos, netbsd, openbsd] }
    - { glob: "lib/python3.13/site-packages/cython-*.dist-info/", platforms: [freebsd, linux, macos, netbsd, openbsd] }
    - { glob: "bin/cython", platforms: [freebsd, linux, macos, netbsd, openbsd] }
    - { glob: "bin/cythonize", platforms: [freebsd, linux, macos, netbsd, openbsd] }
    - { glob: "bin/cygdb", platforms: [freebsd, linux, macos, netbsd, openbsd] }
    - { glob: "Lib/site-packages/cython/", platforms: [windows] }
    - { glob: "Lib/site-packages/*.dist-info/", platforms: [windows] }
