# recipes/mujoco3/deps.lock — the third-party sources MuJoCo 3.17.0's CMake would
# otherwise `git fetch` at configure time, pinned to the exact commits upstream
# pins in cmake/MujocoDependencies.cmake, cmake/third_party_deps/lodepng.cmake
# and simulate/cmake/SimulateDependencies.cmake (glfw, for simulate + samples).
#
# Format: <library-name> <git-commit> <sha256-of-archive> <archive-url>
#
# deps.sh / deps.ps1 download each archive, check its sha256 and store it as
# <library-name>-<git-commit>.tar.gz in a directory passed to CMake as
# MUJOCO_CMAKE_DEP_CACHE: upstream's FindOrFetch then extracts that tarball
# instead of cloning.  MarchingCubeCpp is the one dependency that does not go
# through FindOrFetch (a bare FetchContent_Declare with a git download command),
# so it is extracted and handed over as FETCHCONTENT_SOURCE_DIR_MARCHINGCUBECPP.
#
# Bumping MuJoCo: re-read those three CMake files, update every commit here,
# and recompute each sha256 (curl -fsSL <url> | sha256sum).
