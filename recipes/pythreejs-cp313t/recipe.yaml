schema_version: 1
recipe:
  name: pythreejs-cp313t
  upstream_version: "2.4.2"
  cvc_revision: 1

  maintainer: "cvcpkg group"
  maintainer_email: "info@cvcpkg.org"
  maintainer_url: "https://cvcpkg.org"
  homepage: https://pypi.org/project/pythreejs/
  license: "BSD-3-Clause"
  tags: [python, wheel]
  description: >-
    pythreejs 2.4.2 for CPython 3.13t — the cp313t column of
    cvcpkg's per-interpreter wheel matrix (pure-Python wheel, same artifact in every column);
    generated by tools/gen_python_recipes.py.
    Prebuilt PyPI wheel (NOT built from source): build backend not packaged: jupyterlab-cp311.
    The cp313t column installs under the free-threaded (no-GIL)
    interpreter and its import check runs with the GIL disabled.

source:
  type: python_wheel
  artifacts:
    any:
      url: https://files.pythonhosted.org/packages/d8/8b/e2bbeb42068f0c48899e8eddd34902afc0f7429d4d2a152d2dc2670dc661/pythreejs-2.4.2-py3-none-any.whl
      sha256: "8418807163ad91f4df53b58c4e991b26214852a1236f28f1afeaadf99d095818"

python:
  interpreter: python313t
  abi: cp313t

patches: []

depends:
  build:
    - name: python313t
    - name: ipydatawidgets-cp313t
    - name: ipywidgets-cp313t
    - name: numpy-cp313t
    - name: traitlets-cp313t
  runtime:
    - name: python313t
    - name: ipydatawidgets-cp313t
    - name: ipywidgets-cp313t
    - name: numpy-cp313t
    - name: traitlets-cp313t

build:
  build_type_independent: true
  matrix:
    - platform: any
      script: build.sh

package:
  files:
    - lib/python3.13t/site-packages/pythreejs/
    - lib/python3.13t/site-packages/*.dist-info/
