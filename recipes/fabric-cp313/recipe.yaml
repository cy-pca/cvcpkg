schema_version: 1
recipe:
  name: fabric-cp313
  upstream_version: "3.2.2"
  cvc_revision: 1

  maintainer: "cvcpkg group"
  maintainer_email: "info@cvcpkg.org"
  maintainer_url: "https://cvcpkg.org"
  homepage: https://pypi.org/project/fabric/
  license: "BSD-2-Clause"
  tags: [python, source]
  description: >-
    fabric 3.2.2 for CPython 3.13 — the cp313 column of
    cvcpkg's per-interpreter matrix (pure-Python, built from the PyPI sdist);
    generated by tools/gen_python_recipes.py.
    Built FROM SOURCE: cvcpkg fetches and sha256-verifies the PyPI sdist,
    and build.sh compiles the wheel with the prefix's own CPython 3.13 —
    no third-party prebuilt binary enters the bundle.

# From-source sdist, sha256 as published by PyPI for this exact version.
source:
  # Built from the source package fabric-src, which pins the upstream tarball
  # (https://files.pythonhosted.org/packages/0d/3f/337f278b70ba339c618a490f6b8033b7006c583bd197a897f12fbc468c51/fabric-3.2.2.tar.gz).
  type: package
  package: fabric-src

python:
  interpreter: python313
  abi: cp313

patches: []

depends:
  build:
    - name: fabric-src
      version: "==3.2.2"
    - name: python313
    - name: decorator-cp313
    - name: deprecated-cp313
    - name: invoke-cp313
    - name: paramiko-cp313
    # PEP-517 build backend, from this sdist's [build-system] requires.
    # --no-build-isolation means pip will NOT fetch it, so it has to be
    # in the build prefix already (build.sh bridges it onto sys.path).
    - name: setuptools-cp313
    - name: wheel-cp313
  runtime:
    - name: python313
    - name: decorator-cp313
    - name: deprecated-cp313
    - name: invoke-cp313
    - name: paramiko-cp313
  host_tools:
    - python313

provides:
  - fabric

build:
  build_type_independent: true
  matrix:
    - platform: any
      script: build.sh
    - platform: windows
      script: build.ps1

package:
  files:
    - { glob: "lib/python3.13/site-packages/fabric/", platforms: [any] }
    - { glob: "lib/python3.13/site-packages/*.dist-info/", platforms: [any] }
    - { glob: "bin/fab", platforms: [any] }
    - { glob: "Lib/site-packages/fabric/", platforms: [windows] }
    - { glob: "Lib/site-packages/*.dist-info/", platforms: [windows] }
