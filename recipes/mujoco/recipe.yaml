schema_version: 1
recipe:
  name: mujoco
  upstream_version: "4.0.0"
  # cvc.1: first packaging.  Native (linux, macos, windows): shared libmujoco +
  # CMake package mujoco::mujoco, the actuator/sensor/sdf plugins in
  # bin/mujoco_plugin/, the simulate viewer and sample programs (GLFW static),
  # and upstream's example models in share/mujoco/model/.  wasm / wasm-mt: the
  # official Embind JS bindings (share/mujoco/wasm/) plus a static libmujoco
  # and a CMake package for C++ programs compiled with emscripten.  See
  # build.sh and build-wasm.sh for the reasoning behind each choice.
  #
  # Upstream's CMake clones its dependencies at configure time; deps.lock pins
  # the same commits as sha256-checked archives fed through upstream's
  # MUJOCO_CMAKE_DEP_CACHE hook, and a configure that clones anyway fails.
  #
  # Not (yet) here: the BSDs (upstream does not test them), Studio and the
  # Filament renderer, OpenUSD.  The Python bindings are the mujoco-core-cpXYZ
  # recipes, which build from the PyPI sdist against this package.
  #
  # cvc.2: the installed mujocoConfig.cmake looks for OpenGL quietly
  # (config-opengl-optional.patch).  Upstream's find_dependency(OpenGL) made
  # find_package(mujoco) fail on a Linux host without GL libraries, though no
  # exported target links GL.  Same binaries; only the CMake package changed.
  #
  # cvc.3: mujoco::mujoco requires C++17 (compile feature cxx_std_17) in the
  # native (config-cxx17.patch) and wasm (wasm/mujocoConfig.cmake.in) CMake
  # packages.  The headers need it from C++ (mjspec.h uses std::byte), and an
  # MSVC consumer, C++14 by default, failed to compile until it set C++17
  # itself.  Same binaries; only the CMake packages changed.
  cvc_revision: 3
  maintainer: "cvcpkg group"
  maintainer_email: "info@cvcpkg.org"
  maintainer_url: "https://cvcpkg.org"
  homepage: https://mujoco.org
  license: Apache-2.0
  tags: [libraries, physics, robotics, simulation, wasm]
  description: >-
    MuJoCo (Multi-Joint dynamics with Contact) — Google DeepMind's physics
    engine for robotics, biomechanics and reinforcement learning: generalized-
    coordinate articulated dynamics, soft convex contact, actuators, tendons,
    sensors and deformables, loaded from MJCF or URDF.  Native builds ship the
    shared libmujoco (third-party deps compiled in, no runtime dependencies),
    headers and the mujoco::mujoco CMake package, the first-party engine
    plugins in bin/mujoco_plugin/, the interactive simulate viewer and the
    sample tools (compile, testspeed, basic), and upstream's example models in
    share/mujoco/model/.  x86_64 builds require AVX, like upstream's binaries.
    The wasm and wasm-mt builds ship the official JavaScript/TypeScript
    bindings (share/mujoco/wasm/mujoco.js + .wasm + .d.ts, the @mujoco/mujoco
    npm build) and a static libmujoco with a mujoco::mujoco CMake package for
    C++ programs compiled with emscripten (wasm-mt pages must be served
    cross-origin isolated).

source:
  type: tarball
  url: https://github.com/google-deepmind/mujoco/archive/refs/tags/4.0.0.tar.gz
  sha256: "bf85305af56458ab5b752767925a3bebd713d86a694838774ed634ffa8e78197"
  strip_components: 1

# mujoco3 (MuJoCo 3.17.0, for projects that still need MuJoCo 3) installs the
# same files; declared on both sides.  Metadata only: no rebuild, no bump.
conflicts:
  - mujoco3

patches:
  # cmake/mujocoConfig.cmake.in: find_package(OpenGL QUIET) in place of
  # find_dependency(OpenGL).  No target in mujocoTargets.cmake links OpenGL
  # (libmujoco loads GL at run time through glad), so a headless consumer must
  # not need GL libraries to configure.  The wasm bundles do not use this file.
  - config-opengl-optional.patch
  # Same file, after the patch above: mujoco::mujoco gets compile feature
  # cxx_std_17, since the headers need C++17 from C++ and upstream's target
  # names no standard.  Skipped only on CMake < 3.22 in a project without CXX,
  # where a CXX feature is an error.  wasm/mujocoConfig.cmake.in does the same.
  - config-cxx17.patch

depends:
  build:
    - cmake
    - ninja
    # GLFW (compiled statically into simulate/basic from deps.lock) needs the
    # X11 and GL headers; it dlopen()s the libraries at run time, so these are
    # build-only.  Same set as recipes/glfw, minus the Wayland backend.  The
    # installed CMake package does not need them either (see patches).
    - name: libglvnd
      platforms: [linux]
    - name: libx11
      platforms: [linux]
    - name: libxrandr
      platforms: [linux]
    - name: libxinerama
      platforms: [linux]
    - name: libxcursor
      platforms: [linux]
    - name: libxi
      platforms: [linux]
    - name: libxext
      platforms: [linux]
  runtime: []
  host_tools: []

build:
  matrix:
    - platform: linux
      script: build.sh
      env:
        CFLAGS: "-O2 -fPIC"
        CXXFLAGS: "-O2 -fPIC"
    - platform: macos
      script: build.sh
      env:
        MACOSX_DEPLOYMENT_TARGET: "13.0"
    - platform: windows
      script: build.ps1
    - platform: wasm
      host_platform: linux
      script: build-wasm.sh
    - platform: wasm
      host_platform: windows
      script: build-wasm.ps1
    # Threaded wasm: same scripts with MUJOCO_WASM_THREADS=ON; a separate
    # platform because emscripten cannot link -pthread objects into a
    # single-threaded program (or the reverse).
    - platform: wasm-mt
      host_platform: linux
      script: build-wasm.sh
      env:
        CVC_WASM_THREADS: "1"
    - platform: wasm-mt
      host_platform: windows
      script: build-wasm.ps1
      env:
        CVC_WASM_THREADS: "1"

package:
  files:
    # Native shared library: .so/.so.N (linux), .dylib (macos), DLL + import lib (windows).
    - { glob: "lib/libmujoco.so*", platforms: [linux] }
    - { glob: "lib/libmujoco*.dylib", platforms: [macos] }
    - { glob: "bin/mujoco.dll", platforms: [windows] }
    - { glob: "lib/mujoco.lib", platforms: [windows] }
    # wasm static library + its private third-party archives.
    - { glob: "lib/libmujoco.a", platforms: [wasm, wasm-mt] }
    - { glob: "lib/mujoco/", platforms: [wasm, wasm-mt] }
    # Plugins, viewer, samples (native only).
    - { glob: "bin/mujoco_plugin/", platforms: [linux, macos, windows] }
    - { glob: "bin/simulate*", platforms: [linux, macos, windows] }
    - { glob: "bin/basic*", platforms: [linux, macos, windows] }
    - { glob: "bin/compile*", platforms: [linux, macos, windows] }
    - { glob: "bin/testspeed*", platforms: [linux, macos, windows] }
    - { glob: "bin/dependencies*", platforms: [linux, macos, windows] }
    - { glob: "lib/libsimulate.a", platforms: [linux, macos] }
    - { glob: "lib/simulate.lib", platforms: [windows] }
    - { glob: "include/simulate/", platforms: [linux, macos, windows] }
    # Headers, CMake package; models (native) or JS bindings (wasm) under share/mujoco.
    - include/mujoco/
    - lib/cmake/mujoco/
    - share/mujoco/
  cmake_packages:
    - { name: mujoco, targets: ["mujoco::mujoco"] }

test:
  script: test.sh

abi:
  cxx_std: 20
