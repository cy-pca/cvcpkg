schema_version: 1
recipe:
  name: tvision
  # magiblot/tvision has no tagged releases — pin a specific commit (same
  # convention as recipes/llvm-cbe).
  upstream_version: "0.0.0-git.b4831e2"
  # cvc.2: build against the cvcpkg ncurses in the deps prefix (Linux used the build
  # host's ncursesw headers; macOS could not find ncursesw/ncurses_dll.h).
  # cvc.3: adds Windows (MSVC, Win32 console, no ncurses; build.ps1), so libcvc can
  # ship its tvision terminal backend there. The Unix build is unchanged.
  # cvc.4: adds wasm and wasm-mt (build-wasm.sh) with emscripten-browser-console.patch, a
  # console for a page's JS terminal, so libcvc's ari runs the tvision desktop in the browser.
  # The patch compiles only under __EMSCRIPTEN__: the other builds are unchanged.
  cvc_revision: 4
  maintainer: "cvcpkg group"
  maintainer_email: "info@cvcpkg.org"
  maintainer_url: "https://cvcpkg.org"
  description: >-
    tvision (magiblot) — a modern, cross-platform port of Borland Turbo Vision:
    a retained C++ TUI framework with movable overlapping windows, pull-down
    menus and dialogs (a desktop-in-a-terminal). The native windowed-desktop
    terminal backend option for the Ariadne UI/scene DSL (cvc::ariadne —
    docs/roadmap/CVCGL-UI-DSL-ROADMAP.md §16.4). LICENSING NOTE: the MIT license
    covers magiblot's own additions; the underlying Borland Turbo Vision base is
    provided "AS IS" (see the upstream COPYRIGHT). Consumers who need to avoid
    that can feature-flag this backend out (CVC_ARIADNE_TVISION).
  homepage: https://github.com/magiblot/tvision
  license: MIT
  tags: [libraries, tui, cpp]

source:
  type: tarball
  url: https://github.com/magiblot/tvision/archive/b4831e2ca16652db327fb7cc964f1c8c2d512524.tar.gz
  sha256: "64de100a7d750ccdad9218fbb43dc711fe2928ca690e7ef8c532778868e14962"
  strip_components: 1

patches:
  # A browser console for Emscripten builds (internal/browsercon.h, platform/browsercon.cpp):
  # ANSI output on stdout, non-blocking stdin decoded by TermIO, the page's size through the
  # exported tvision_set_screen_size(), an event wait that yields with emscripten_sleep, and
  # CMake that skips ncurses there. Emscripten's libc also has strupr, so tvision's own is left
  # out there. Everything is behind __EMSCRIPTEN__ / EMSCRIPTEN; other platforms build as before.
  - emscripten-browser-console.patch

depends:
  build:
    - cmake
    - ninja
    # Not Windows: tvision draws through the Win32 console API there, and the
    # catalog has no Windows ncurses (install-deps is all-or-nothing).
    - name: ncurses
      platforms: [linux, macos, freebsd, netbsd]
  runtime:
    # tvision links libncursesw + libtinfo at build; the static lib needs them at
    # the consumer's final link too, so ncurses must be in the flat prefix.
    - name: ncurses
      platforms: [linux, macos, freebsd, netbsd]
  host_tools: []

build:
  # Unix builds use ncursesw (build.sh); Windows uses the Win32 console and MSVC
  # (build.ps1), with no ncurses.
  matrix:
    - platform: linux
      script: build.sh
    - platform: macos
      script: build.sh
      env:
        MACOSX_DEPLOYMENT_TARGET: "13.0"
    - platform: freebsd
      script: build.sh
      env:
        CFLAGS: "-O2 -fPIC"
    - platform: netbsd
      script: build.sh
      env:
        CFLAGS: "-O2 -fPIC"
    - platform: windows
      script: build.ps1
    # The browser: cross-compiled with em++ against the patch's browser console (build-wasm.sh).
    # Static only. Single-threaded is what a static page (the gh-pages gallery) links.
    - platform: wasm
      host_platform: linux
      script: build-wasm.sh
    # Threaded wasm: same script; env-wasm.sh injects -pthread via the CVC_WASM_THREADS hook.
    - platform: wasm-mt
      host_platform: linux
      script: build-wasm.sh
      env:
        CVC_WASM_THREADS: "1"

package:
  # Unix: upstream's install target exports a CMake config whose link interface
  # names the build host's absolute ncurses paths, so build.sh stages the static
  # lib + headers by hand and generates a pkg-config file instead. Consumers link
  # -ltvision plus ncursesw/tinfo (pulled in via the pkg-config Requires).
  # Windows: build.ps1 uses upstream's install, which yields tvision.lib (MSVC
  # spelling, no "lib" prefix) and a relocatable CMake config (tvision::tvision).
  # wasm / wasm-mt: build-wasm.sh uses upstream's install too: libtvision.a and the
  # same relocatable config, with nothing else to link.
  files:
    - { glob: "lib/libtvision.*", platforms: [linux, macos, freebsd, netbsd, wasm, wasm-mt] }
    - { glob: "lib/pkgconfig/tvision.pc", platforms: [linux, macos, freebsd, netbsd] }
    - { glob: "lib/tvision.lib", platforms: [windows] }
    - { glob: "lib/cmake/tvision/", platforms: [windows, wasm, wasm-mt] }
    - include/tvision/
  cmake_packages: []

abi:
  cxx_std: 14
