schema_version: 1
recipe:
  name: gettext
  upstream_version: "1.0"
  # cvc.2: macOS builds the full tree (msgfmt, xgettext, msgmerge, libtextstyle)
  # against cvcpkg's GNU libiconv instead of gettext-runtime alone, so nothing
  # needs Homebrew's msgfmt.
  # cvc.3: Windows builds with MSYS path conversion on.  MSYS_NO_PATHCONV=1 made
  # libtool's `cmd //c echo` start an interactive cmd.exe that hung every libtool
  # link on the dev Windows builder (see build.ps1).  Other platforms unchanged.
  # cvc.4: Windows: CC=cl cleared, NLS on so libintl is built, no ambient
  # iconv, drive-letter prefix; package.files scoped to what the runtime-only
  # Windows build installs.  Other platforms unchanged.
  cvc_revision: 4
  maintainer: "CyberPC Angel, LLC"
  maintainer_email: "cvcpkg@cyberpcangel.com"
  maintainer_url: "https://cyberpcangel.com"
  description: "GNU gettext — internationalization (i18n) and localization (l10n) library providing libintl."
  homepage: https://www.gnu.org/software/gettext/
  license: GPL-3.0-or-later
  tags: [utils]

source:
  type: tarball
  url: https://ftp.gnu.org/gnu/gettext/gettext-1.0.tar.gz
  sha256: "85d99b79c981a404874c02e0342176cf75c7698e2b51fe41031cf6526d974f1a"
  strip_components: 1

patches: []

depends:
  runtime:
    # OpenBSD ships no iconv in libc, so gettext's bundled libxml/libtextstyle
    # can't find <iconv.h>.  Pull in cvcpkg's GNU libiconv there (linux/BSD-with-
    # libc-iconv build fine without it).  build.sh wires --with-libiconv-prefix,
    # which puts -liconv on the link line, so the shipped libintl/libtextstyle
    # carry a DT_NEEDED on libiconv.so -- a *runtime* dep.  Filing it under
    # `build:` would strip it from the deliverable and also hide it from
    # build.sh's ${CVC_DEPS_PREFIX}/include/iconv.h probe.
    - name: iconv
      version: ">=1.17"
      platforms: [openbsd, macos]
  host_tools: []

build:
  matrix:
    - platform: linux
      script: build.sh
      env:
        CFLAGS: "-O2 -fPIC"
    - platform: macos
      script: build.sh
      env:
        MACOSX_DEPLOYMENT_TARGET: "13.0"
    - platform: freebsd
      script: build.sh
      env:
        CFLAGS: "-O2 -fPIC"
    - platform: openbsd
      script: build.sh
      env:
        CFLAGS: "-O2 -fPIC"
    - platform: netbsd
      script: build.sh
      env:
        CFLAGS: "-O2 -fPIC"
    - platform: windows
      script: build.ps1

package:
  files:
    # libintl only where libc lacks it: glibc provides it, so the Linux build
    # installs no libintl (strict package.files refused cvc.2 on linux/x86_64).
    - { glob: "lib/libintl*", platforms: [macos, freebsd, openbsd, netbsd, windows] }
    # Windows builds gettext-runtime only (build.ps1): libintl, libasprintf and
    # the gettext/ngettext/envsubst tools; the gettext-tools entries below are
    # scoped off it.  No share/locale there either: no msgfmt at configure time.
    - lib/libasprintf*
    - { glob: "lib/libgettextlib*", platforms: [linux, macos, freebsd, openbsd, netbsd] }
    - { glob: "lib/libgettextpo*", platforms: [linux, macos, freebsd, openbsd, netbsd] }
    - { glob: "lib/libtextstyle*", platforms: [linux, macos, freebsd, openbsd, netbsd] }
    - { glob: "include/libintl.h", platforms: [macos, freebsd, openbsd, netbsd, windows] }
    - include/autosprintf.h
    - { glob: "include/gettext-po.h", platforms: [linux, macos, freebsd, openbsd, netbsd] }
    - { glob: "include/textstyle.h", platforms: [linux, macos, freebsd, openbsd, netbsd] }
    - { glob: "include/textstyle/", platforms: [linux, macos, freebsd, openbsd, netbsd] }
    # gettext's own message catalogs are compiled with a msgfmt found at configure
    # time, before this build's msgfmt exists.  Linux and the BSDs find the build
    # host's; macOS (no Homebrew) has none, so its bundle ships the tools but no
    # catalogs.  Compiling them with the freshly built msgfmt is a follow-up.
    - { glob: "share/locale/", platforms: [linux, freebsd, openbsd, netbsd] }
    - bin/gettext*        # gettext.exe on Windows
    - bin/ngettext*
    - bin/envsubst*
    - { glob: "bin/msgfmt", platforms: [linux, macos, freebsd, openbsd, netbsd] }
    - { glob: "bin/msgmerge", platforms: [linux, macos, freebsd, openbsd, netbsd] }
    - { glob: "bin/xgettext", platforms: [linux, macos, freebsd, openbsd, netbsd] }
  cmake_packages: []

abi:
  cxx_std: 17
