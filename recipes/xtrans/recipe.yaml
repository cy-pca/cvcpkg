schema_version: 1
recipe:
  name: xtrans
  upstream_version: "1.6.0"
  cvc_revision: 2
  maintainer: "cvcpkg group"
  maintainer_email: "info@cvcpkg.org"
  maintainer_url: "https://cvcpkg.org"
  homepage: https://www.x.org/
  license: MIT
  tags: [libraries, x11, graphics]
  description: >-
    X Transport abstraction — build-time headers/macros shared by X11/ICE servers and libraries.

source:
  # Built from the source package xtrans-src, which pins the upstream tarball
  # (https://xorg.freedesktop.org/releases/individual/lib/xtrans-1.6.0.tar.xz).
  type: package
  package: xtrans-src

patches: []

depends:
  build:
    - name: xtrans-src
      version: "==1.6.0"
    - pkg-config
  runtime: []
  host_tools: []

package:
  files:
    # No lib/: header-only; its .pc file installs under share/pkgconfig.
    - include/
    - share/

build:
  matrix:
    - platform: linux
      script: build.sh
    - platform: freebsd
      script: build.sh
    - platform: openbsd
      script: build.sh
    - platform: netbsd
      script: build.sh
