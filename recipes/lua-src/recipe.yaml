schema_version: 1
recipe:
  name: lua-src
  upstream_version: "5.4.9"
  cvc_revision: 1
  maintainer: cvcpkg group
  maintainer_email: info@cvcpkg.org
  maintainer_url: https://cvcpkg.org
  homepage: https://www.lua.org/
  license: MIT
  tags: [source]
  description: >-
    The unmodified upstream source of lua 5.4.9: its release tarball, verified
    against the sha256 below and staged at src/lua-src/.  The lua recipe builds
    from it (source.type package), so the tarball is fetched once, from
