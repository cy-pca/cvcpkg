schema_version: 1
recipe:
  name: rosbags-cp312
  upstream_version: "0.11.9"
  cvc_revision: 4

  maintainer: "cvcpkg group"
  maintainer_email: "info@cvcpkg.org"
  maintainer_url: "https://cvcpkg.org"
  homepage: https://pypi.org/project/rosbags/
  license: "Apache-2.0"
  tags: [python, source]
  description: >-
    rosbags 0.11.9 for CPython 3.12 — the cp312 column of
    cvcpkg's per-interpreter matrix (pure-Python, built from the PyPI sdist);
    generated by tools/gen_python_recipes.py.
    Built FROM SOURCE: cvcpkg fetches and sha256-verifies the PyPI sdist,
    and build.sh compiles the wheel with the prefix's own CPython 3.12 —
    no third-party prebuilt binary enters the bundle.

# From-source sdist, sha256 as published by PyPI for this exact version.
source:
  # Built from the source package rosbags-src, which pins the upstream tarball
  # (https://files.pythonhosted.org/packages/eb/f8/84529aea85bec7395bb5aa7f4401ea2d7e6135cb367e36493851b859917b/rosbags-0.11.9.tar.gz).
  type: package
  package: rosbags-src

python:
  interpreter: python312
  abi: cp312

patches: []

depends:
  build:
    - name: rosbags-src
      version: "==0.11.9"
    - name: python312
    - name: apsw-cp312
    - name: backports-zstd-cp312
    - name: lz4-cp312
    - name: numpy-cp312
    - name: ruamel-yaml-cp312
    - name: typing-extensions-cp312
    # PEP-517 build backend, from this sdist's [build-system] requires.
    # --no-build-isolation means pip will NOT fetch it, so it has to be
    # in the build prefix already (build.sh bridges it onto sys.path).
    - name: setuptools-cp312
    - name: setuptools-scm-cp312
  runtime:
    - name: python312
    - name: apsw-cp312
    - name: backports-zstd-cp312
    - name: lz4-cp312
    - name: numpy-cp312
    - name: ruamel-yaml-cp312
    - name: typing-extensions-cp312
  host_tools:
    - python312

provides:
  - rosbags

build:
  build_type_independent: true
  matrix:
    - platform: any
      script: build.sh

package:
  files:
    - lib/python3.12/site-packages/rosbags/
    - lib/python3.12/site-packages/rosbags-*.dist-info/
    - bin/rosbags-convert
