schema_version: 1
recipe:
  name: blender-addon-blosm
  upstream_version: "2.7.28"
  cvc_revision: 1
  maintainer: "cvcpkg group"
  maintainer_email: "info@cvcpkg.org"
  maintainer_url: "https://cvcpkg.org"
  homepage: https://github.com/vvoovv/blosm
  # LICENSE is the GPL-3.0 text and the source headers say "version 3 ... or
  # any later version"; the add-on's inert _blender_manifest.toml says
  # GPL-2.0-or-later instead, and bl_info has no licence key. The vendored
  # threed_tiles/py3dtiles/ is py3dtiles 7.0.0 (Apache-2.0), shipped upstream
  # without its LICENSE file.
  license: GPL-3.0-or-later AND Apache-2.0
  tags: [blender, addons, gis]
  description: >-
    blosm (Blender-OSM) 2.7.28, the free version — the Blender add-on that
    imports OpenStreetMap data (buildings with roofs, roads, water, forests),
    terrain and web-map imagery, used by CVC-DBG/dbg-gym-3d to build scenes.
    The upstream repository also carries the code of the paid version
    (realistic/, building2/, pml/, ... — its presence switches the add-on to
    "Pro"); its provenance is unknown, so this package strips it and matches
    the free distribution.  Installed as a legacy add-on at
    share/blender/scripts/addons/blosm/, which the blender package's
    bin/blender adds to Blender's script paths; enable it with
    addon_utils.enable("blosm").

source:
  type: tarball
  url: https://github.com/vvoovv/blosm/archive/refs/tags/v2.7.28.tar.gz
  sha256: "1bbcbb84ac3d2b99add8e7e4798c024640d4237ce3ed458fc467788f197d1378"
  strip_components: 1

patches:
  # vvoovv/blosm#722 (closed upstream without a fix): building/renderer.py and
  # building/gn_2d.py import `gui` as a top-level module while gui/ uses
  # relative imports, which raises "attempted relative import beyond top-level
  # package" whenever scene.blosm.defaultLevels is empty -- always the case in
  # background mode, where nothing fills it before the import runs.
  - blosm-gui-relative-import.patch
  # ape/__init__.py imports distutils at module level; Python 3.12 removed it
  # (Blender's own builds only get by through the setuptools shim they bundle).
  - blosm-no-distutils.patch

depends:
  build: []
  runtime:
    - name: blender
      version: "^5.2"
  host_tools: []

build:
  build_type_independent: true
  matrix:
    - platform: any
      script: build.sh

package:
  files:
    - share/blender/scripts/addons/blosm/
    - share/doc/blender-addon-blosm/

test:
  script: test.sh
