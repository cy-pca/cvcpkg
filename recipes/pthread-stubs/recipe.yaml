schema_version: 1
recipe:
  name: pthread-stubs
  upstream_version: "0.5"
  cvc_revision: 1
  maintainer: "cvcpkg group"
  maintainer_email: "info@cvcpkg.org"
  maintainer_url: "https://cvcpkg.org"
  homepage: https://www.x.org/
  license: MIT
  tags: [libraries, x11, graphics]
  description: >-
    libpthread-stubs — weak-symbol stubs for the pthread functions, so a
    library can reference them without hard-linking libpthread on platforms
    where they live elsewhere (or in libc). libxcb's configure requires the
    pthread-stubs.pc; it is system-provided on Linux/FreeBSD/NetBSD but absent
    on OpenBSD, so package it for a hermetic + OpenBSD-complete libxcb.

source:
  # Built from the source package pthread-stubs-src, which pins the upstream tarball
  # (https://xorg.freedesktop.org/releases/individual/lib/libpthread-stubs-0.5.tar.xz).
  type: package
  package: pthread-stubs-src

patches: []

depends:
  build:
    - name: pthread-stubs-src
      version: "==0.5"
    - pkg-config
  runtime: []
  host_tools: []

package:
  files:
    # pthread-stubs 0.5 installs only its pkg-config file (libc provides the
    # pthread functions it used to stub).
    - lib/pkgconfig/pthread-stubs.pc

build:
  matrix:
    - platform: linux
      script: build.sh
    - platform: freebsd
      script: build.sh
    - platform: openbsd
      script: build.sh
    - platform: netbsd
      script: build.sh
