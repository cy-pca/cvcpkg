schema_version: 1
recipe:
  name: graphene
  upstream_version: "1.10.8"
  cvc_revision: 2
  maintainer: "cvcpkg group"
  maintainer_email: "info@cvcpkg.org"
  maintainer_url: "https://cvcpkg.org"
  homepage: https://ebassi.github.io/graphene/
  license: MIT
  tags: [libraries]
  description: >-
    Graphene — a thin layer of graphic data types for use with GLib
    and GTK.  Provides SIMD-accelerated vector, matrix, and
    geometric types.  Required by GTK 4.

source:
  # Built from the source package graphene-src, which pins the upstream tarball
  # (https://download.gnome.org/sources/graphene/1.10/graphene-1.10.8.tar.xz).
  type: package
  package: graphene-src

patches: []

depends:
  build:
    - name: graphene-src
      version: "==1.10.8"
    - ninja
    - meson
    - pkg-config
  runtime:
    - name: glib
      version: "^2.80"
  host_tools: []

build:
  matrix:
    - platform: linux
      script: build.sh
      env:
        CFLAGS: "-O2 -fPIC"
    - platform: macos
      script: build.sh
      env:
        MACOSX_DEPLOYMENT_TARGET: "13.0"
    - platform: freebsd
      script: build.sh
      env:
        CFLAGS: "-O2 -fPIC"
    - platform: openbsd
      script: build.sh
      env:
        CFLAGS: "-O2 -fPIC"
    - platform: netbsd
      script: build.sh
      env:
        CFLAGS: "-O2 -fPIC"
    - platform: windows
      script: build.ps1

package:
  files:
    - lib/libgraphene-1.0*
    - lib/graphene-1.0/
    - lib/pkgconfig/graphene-1.0.pc
    - lib/pkgconfig/graphene-gobject-1.0.pc
    - include/graphene-1.0/
  pkg_config:
    - graphene-1.0
    - graphene-gobject-1.0

abi:
  cxx_std: 17
