schema_version: 1
recipe:
  name: graphene
  upstream_version: "1.10.8"
  cvc_revision: 3
  # cvc.3: republish so every platform's bundle has graphene-gobject-1.0.pc.
  # The OpenBSD cvc.2 bundle shipped only graphene-1.0.pc (built before glib was
  # on OpenBSD, so -Dgobject_types had nothing to build against), and gtk4 then
  # failed there: "Dependency 'graphene-gobject-1.0' is required but not found"
  # (populate job 22082).  The recipe is unchanged; the strict pack check now
  # requires the .pc it declares.
  maintainer: "cvcpkg group"
  maintainer_email: "info@cvcpkg.org"
  maintainer_url: "https://cvcpkg.org"
  homepage: https://ebassi.github.io/graphene/
  license: MIT
  tags: [libraries]
  description: >-
    Graphene — a thin layer of graphic data types for use with GLib
    and GTK.  Provides SIMD-accelerated vector, matrix, and
    geometric types.  Required by GTK 4.

source:
  # Built from the source package graphene-src, which pins the upstream tarball
  # (https://download.gnome.org/sources/graphene/1.10/graphene-1.10.8.tar.xz).
  type: package
  package: graphene-src

patches: []

depends:
  build:
    # meson.cmd runs the prefix's python.exe.  Declared, as pkg-config and glib
    # do: the builder installs only the runtime deps beneath a recipe's own, so
    # one no longer arrives through another dep's build edge.
    - name: python312
      platforms: [windows]
    - name: graphene-src
      version: "==1.10.8"
    - ninja
    - meson
    - pkg-config
  runtime:
    - name: glib
      version: "^2.80"
  host_tools: []

build:
  matrix:
    - platform: linux
      script: build.sh
      env:
        CFLAGS: "-O2 -fPIC"
    - platform: macos
      script: build.sh
      env:
        MACOSX_DEPLOYMENT_TARGET: "13.0"
    - platform: freebsd
      script: build.sh
      env:
        CFLAGS: "-O2 -fPIC"
    - platform: openbsd
      script: build.sh
      env:
        CFLAGS: "-O2 -fPIC"
    - platform: netbsd
      script: build.sh
      env:
        CFLAGS: "-O2 -fPIC"
    - platform: windows
      script: build.ps1

package:
  files:
    - lib/libgraphene-1.0*
    - lib/graphene-1.0/
    - lib/pkgconfig/graphene-1.0.pc
    - lib/pkgconfig/graphene-gobject-1.0.pc
    - include/graphene-1.0/
  pkg_config:
    - graphene-1.0
    - graphene-gobject-1.0

abi:
  cxx_std: 17
