schema_version: 1
recipe:
  name: libtool
  upstream_version: "2.5.4"
  cvc_revision: 3
  maintainer: "cvcpkg group"
  maintainer_email: "info@cvcpkg.org"
  maintainer_url: "https://cvcpkg.org"
  homepage: https://www.gnu.org/software/libtool/
  license: GPL-2.0-or-later
  tags: [tools, build-system]
  description: >-
    GNU Libtool — generic shared library support script.
    Required by autotools-based builds on BSD platforms where
    the system libtool is not GNU-compatible.

source:
  # Built from the source package libtool-src, which pins the upstream tarball
  # (https://ftp.gnu.org/gnu/libtool/libtool-2.5.4.tar.xz).
  type: package
  package: libtool-src

patches: []

depends:
  # Windows only: libtool is built for the MSYS subsystem by the MSYS gcc of the
  # MSYS2 bootstrap, with the cvcpkg make and m4 (host_tools stage only when
  # cross-compiling, so a native Windows build needs m4 as a real build dep).
  # Its scripts and libltdl run inside MSYS2, hence msys2 at runtime too.
  build:
    - name: libtool-src
      version: "==2.5.4"
    - name: msys2
      platforms: [windows]
    - name: make
      platforms: [windows]
    - name: m4
      platforms: [windows]
  runtime:
    - name: msys2
      platforms: [windows]
  host_tools:
    - m4

build:
  build_type_independent: true
  matrix:
    - platform: linux
      script: build.sh
    - platform: macos
      script: build.sh
    - platform: freebsd
      script: build.sh
    - platform: openbsd
      script: build.sh
    - platform: netbsd
      script: build.sh
    - platform: haiku
      script: build.sh
    - platform: windows
      script: build.ps1

package:
  files:
    - bin/libtool*
    - bin/libtoolize*
    - share/libtool/
    - share/aclocal/
    - lib/libltdl*
    - include/ltdl.h
    - include/libltdl/
