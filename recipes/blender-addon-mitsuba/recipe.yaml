schema_version: 1
recipe:
  name: blender-addon-mitsuba
  # mitsuba_blender/blender_manifest.toml says 0.5.0; there is no 0.5.0
  # release yet (the last tag, v0.4.0 of 2024, needs mitsuba 3.5.0, which has
  # no Python 3.13 build). The source is pinned to a master commit below.
  upstream_version: "0.5.0"
  cvc_revision: 1
  maintainer: "cvcpkg group"
  maintainer_email: "info@cvcpkg.org"
  maintainer_url: "https://cvcpkg.org"
  homepage: https://github.com/mitsuba-renderer/mitsuba-blender
  license: BSD-3-Clause
  tags: [blender, addons, rendering]
  description: >-
    mitsuba-blender — the Mitsuba 3 renderer integration for Blender: export
    a Blender scene to Mitsuba's XML scene format (what Sionna RT loads), and
    import or render Mitsuba scenes.  Installed as a Blender extension in the
    prefix's "System" repository (share/blender/extensions/system/), module
    bl_ext.system.mitsuba_blender; the blender package's bin/blender points
    Blender there.  It imports the prefix's mitsuba, the one sionna-rt uses,
    instead of bundling wheels.

source:
  # master 8848ded5 (2026-08-06), the parent of 1daf5c56 ("Port the add-on to
  # the rewritten Mitsuba Mesh").  From 1daf5c56 on, the exporter calls
  # mi.Mesh.from_corners unconditionally, which mitsuba 3.9.1 does not have
  # ("'mitsuba.Mesh' object has no attribute 'from_corners'"); later commits
  # add more unreleased-mitsuba features (mi.PostProcess, the C++ math/lut
  # textures).  1daf5c56 also committed unresolved merge conflicts in
  # textures.py, which stay until 912a64f.  sionna-rt 2.2.0 pins
  # mitsuba==3.9.1 and Blender shares that mitsuba here, so the add-on must
  # work with 3.9.1.  This commit uses from_corners only behind
  # hasattr(mi.Mesh, 'from_corners'), registers its Math/Mix/ColorRamp/RGB
  # Curve/Hue textures as Python plugins, and already has the extension
  # layout, Python 3.13 support and the Blender 5 API updates (compat.py).
  type: tarball
  url: https://github.com/mitsuba-renderer/mitsuba-blender/archive/8848ded5e5df575f2cd0a9c10061d3f6b7137905.tar.gz
  sha256: "3cec024b171d321452d421396ed50f00409a8322876dfc23a17a6a461c715eb3"
  strip_components: 1

patches: []

depends:
  build: []
  runtime:
    - name: blender
      version: "^5.2"
    - name: mitsuba-cp313
      version: "==3.9.1"
  host_tools: []

build:
  min_cpu:
    x86_64: x86-64-v3   # the test imports mitsuba-cp313 in Blender
  build_type_independent: true
  matrix:
    - platform: any
      script: build.sh

package:
  files:
    - share/blender/extensions/system/mitsuba_blender/
    - share/doc/blender-addon-mitsuba/

test:
  script: test.sh
