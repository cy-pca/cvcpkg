schema_version: 1
recipe:
  name: mariadb-connector-c
  upstream_version: "3.4.8"
  # Bumped 2 -> 3: no build change. The licence was wrong (Apache-2.0), and
  # every published bundle embeds it (share/libcvc-deps/manifest.yaml
  # meta.license and the bundled recipe.yaml), as does each catalog row.
  # Published variants are immutable, so only a new revision corrects them.
  cvc_revision: 3
  maintainer: "cvcpkg group"
  maintainer_email: "info@cvcpkg.org"
  maintainer_url: "https://cvcpkg.org"
  homepage: https://mariadb.com/downloads/connectors/connectors-data-access/
  # COPYING.LIB is the LGPL 2.1 text. Most sources are "GNU Library General
  # Public License, version 2, or (at your option) any later version"; the
  # async context code (ma_context.c, ma_context.h, mariadb_async.h) is LGPL
  # 2.1 or later, so the library as a whole is LGPL-2.1-or-later.
  # PHP-3.01: the prepared-statement and LOAD DATA LOCAL code (mariadb_stmt.c,
  # ma_stmt_codec.c, ma_loaddata.c) is ported from PHP's mysqlnd and keeps its
  # PHP License 3.01 header (ma_password.c's three-line XOR helper cites PHP
  # License 3.0); README carries that licence's "This product includes PHP
  # software" acknowledgement.
  # No term for the public-domain ref10 Ed25519 code in the client_ed25519
  # plugin or the public-domain mariadb_version.h. The bundled external/zlib
  # is not built (WITH_EXTERNAL_ZLIB=ON links cvcpkg's zlib).
  license: "LGPL-2.1-or-later AND PHP-3.01"
  tags: [database]
  description: >-
    MariaDB Connector/C — wire-compatible MySQL client library.
    Enables Qt6 QMYSQL SQL driver plugin and libcvc database layer.

source:
  type: tarball
  url: https://github.com/mariadb-corporation/mariadb-connector-c/archive/refs/tags/v3.4.8.tar.gz
  sha256: "ced7e5063c91fe2bfafd9d63a759490fe53e81df80599a9abad01c570c202f0c"
  strip_components: 1

patches: []

depends:
  build:
    - cmake
    - ninja
  runtime:
    - name: openssl
      version: "^3.0"
    - name: zlib
      version: "^1.3"
  host_tools: []

build:
  matrix:
    - platform: linux
      script: build.sh
      env:
        CFLAGS: "-O2 -fPIC"
    - platform: macos
      script: build.sh
      env:
        MACOSX_DEPLOYMENT_TARGET: "13.0"
    - platform: freebsd
      script: build.sh
      env:
        CFLAGS: "-O2 -fPIC"
    - platform: openbsd
      script: build.sh
      env:
        CFLAGS: "-O2 -fPIC"
    - platform: netbsd
      script: build.sh
      env:
        CFLAGS: "-O2 -fPIC"
    - platform: windows
      script: build.ps1

package:
  # Connector/C 3.4 installs no lib/cmake/mariadb/ and, with
  # INSTALL_INCLUDEDIR=include/mariadb, no include/mysql/ (the published
  # +cvc.2 bundles have neither); listing them fails pack's strict globs.
  files:
    - lib/libmariadb*
    - lib/mariadb*
    # Connector/C writes libmariadb.pc only off Windows (its CMake skips the
    # pkg-config file under WIN32).
    - { glob: "lib/pkgconfig/libmariadb.pc", platforms: [linux, macos, freebsd, openbsd, netbsd] }
    - include/mariadb/
  cmake_packages:
    - { name: mariadb, targets: ["mariadb::mariadb"] }

abi:
  cxx_std: 17

toolchain:
  cc:
    min_version: "any"
    description: "C99-capable compiler"

notes:
  - title: "Depends on OpenSSL and zlib"
    platforms: [linux, macos, windows]
    description: >-
      The openssl and zlib recipes are listed as build dependencies
      and will be resolved and built automatically before this recipe.
