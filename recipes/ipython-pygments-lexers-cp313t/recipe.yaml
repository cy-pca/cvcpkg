schema_version: 1
recipe:
  name: ipython-pygments-lexers-cp313t
  upstream_version: "1.1.1"
  cvc_revision: 1

  maintainer: "cvcpkg group"
  maintainer_email: "info@cvcpkg.org"
  maintainer_url: "https://cvcpkg.org"
  homepage: https://pypi.org/project/ipython-pygments-lexers/
  license: "BSD-3-Clause"
  tags: [python, source]
  description: >-
    ipython-pygments-lexers 1.1.1 for CPython 3.13t — the cp313t column of
    cvcpkg's per-interpreter matrix (pure-Python, built from the PyPI sdist);
    generated by tools/gen_python_recipes.py.
    Built FROM SOURCE: cvcpkg fetches and sha256-verifies the PyPI sdist,
    and build.sh compiles the wheel with the prefix's own CPython 3.13t —
    no third-party prebuilt binary enters the bundle.
    The cp313t column installs under the free-threaded (no-GIL)
    interpreter and its import check runs with the GIL disabled.

# From-source sdist, sha256 as published by PyPI for this exact version.
source:
  # Built from the source package ipython-pygments-lexers-src, which pins the upstream tarball
  # (https://files.pythonhosted.org/packages/ef/4c/5dd1d8af08107f88c7f741ead7a40854b8ac24ddf9ae850afbcf698aa552/ipython_pygments_lexers-1.1.1.tar.gz).
  type: package
  package: ipython-pygments-lexers-src

python:
  interpreter: python313t
  abi: cp313t

patches: []

depends:
  build:
    - name: ipython-pygments-lexers-src
      version: "==1.1.1"
    - name: python313t
    - name: pygments-cp313t
    # PEP-517 build backend, from this sdist's [build-system] requires.
    # --no-build-isolation means pip will NOT fetch it, so it has to be
    # in the build prefix already (build.sh bridges it onto sys.path).
    - name: flit-core-cp313t
  runtime:
    - name: python313t
    - name: pygments-cp313t
  host_tools:
    - python313t

build:
  build_type_independent: true
  matrix:
    - platform: any
      script: build.sh
    - platform: windows
      script: build.ps1

package:
  files:
    - { glob: "lib/python3.13t/site-packages/ipython_pygments_lexers.py", platforms: [any] }
    - { glob: "lib/python3.13t/site-packages/*.dist-info/", platforms: [any] }
    - { glob: "Lib/site-packages/ipython_pygments_lexers.py", platforms: [windows] }
    - { glob: "Lib/site-packages/*.dist-info/", platforms: [windows] }
