schema_version: 1
recipe:
  name: yarl-cp312
  upstream_version: "1.24.2"
  cvc_revision: 1

  maintainer: "cvcpkg group"
  maintainer_email: "info@cvcpkg.org"
  maintainer_url: "https://cvcpkg.org"
  homepage: https://pypi.org/project/yarl/
  license: "Apache-2.0"
  tags: [python, source]
  description: >-
    yarl 1.24.2 for CPython 3.12 — the cp312 column of
    cvcpkg's per-interpreter matrix (C extensions compiled for cp312 from the PyPI sdist);
    generated by tools/gen_python_recipes.py.
    Built FROM SOURCE: cvcpkg fetches and sha256-verifies the PyPI sdist,
    and build.sh compiles the wheel with the prefix's own CPython 3.12 —
    no third-party prebuilt binary enters the bundle.

# From-source sdist, sha256 as published by PyPI for this exact version.
source:
  type: tarball
  url: https://files.pythonhosted.org/packages/79/12/1e8f37460ea0f7eb59c221fdaf0ed75e7ac43e97f8093b9c6f411df50a78/yarl-1.24.2.tar.gz
  sha256: "9ac374123c6fd7abf64d1fec93962b0bd4ee2c19751755a762a72dd96c0378f8"
  strip_components: 1

python:
  interpreter: python312
  abi: cp312

patches: []

depends:
  build:
    - name: python312
    - name: idna-cp312
    - name: multidict-cp312
    - name: propcache-cp312
    # PEP-517 build backend, from this sdist's [build-system] requires.
    # --no-build-isolation means pip will NOT fetch it, so it has to be
    # in the build prefix already (build.sh bridges it onto sys.path).
    - name: expandvars-cp312
    - name: setuptools-cp312
    - name: cython-cp312
  runtime:
    - name: python312
    - name: idna-cp312
    - name: multidict-cp312
    - name: propcache-cp312
  host_tools:
    - python312

build:
  build_type_independent: true
  matrix:
    - platform: linux
      script: build.sh
    - platform: macos
      script: build.sh
    - platform: windows
      script: build.ps1

package:
  files:
    - { glob: "lib/python3.12/site-packages/yarl/", platforms: [linux, macos] }
    - { glob: "lib/python3.12/site-packages/*.dist-info/", platforms: [linux, macos] }
    - { glob: "Lib/site-packages/yarl/", platforms: [windows] }
    - { glob: "Lib/site-packages/*.dist-info/", platforms: [windows] }
