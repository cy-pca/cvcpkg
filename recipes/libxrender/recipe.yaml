schema_version: 1
recipe:
  name: libxrender
  upstream_version: "0.9.12"
  cvc_revision: 2
  maintainer: "cvcpkg group"
  maintainer_email: "info@cvcpkg.org"
  maintainer_url: "https://cvcpkg.org"
  homepage: https://www.x.org/
  license: MIT
  tags: [libraries, x11, graphics]
  description: >-
    X Rendering Extension client library (Xrender).

source:
  # Built from the source package libxrender-src, which pins the upstream tarball
  # (https://xorg.freedesktop.org/releases/individual/lib/libXrender-0.9.12.tar.xz).
  type: package
  package: libxrender-src

patches: []

depends:
  build:
    - name: libxrender-src
      version: "==0.9.12"
    - pkg-config
    - name: xorgproto
  runtime:
    - name: libx11
  host_tools: []

package:
  files:
    - lib/
    - include/
    - share/

build:
  matrix:
    - platform: linux
      script: build.sh
    - platform: freebsd
      script: build.sh
    - platform: openbsd
      script: build.sh
    - platform: netbsd
      script: build.sh
