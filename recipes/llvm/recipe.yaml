schema_version: 1
recipe:
  name: llvm
  upstream_version: "22.1.8"
  # Bumped 1 -> 2: scoped the ncurses build edge to Unix. LLVM uses it
  # only for terminfo colour detection in its Unix Process/Terminal support;
  # the MSVC build uses the console API instead. Unscoped, it made this recipe
  # advertise windows while depending on a package with no windows build.
  # Bumped 2 -> 3: added the netbsd build. pkgsrc ships lang/llvm, and
  # build.sh is already platform-generic (its only platform branch is the RPATH
  # form, whose $ORIGIN default is correct for NetBSD). OpenBSD is deliberately
  # NOT added: this builds LLVM_BUILD_LLVM_DYLIB=ON and relies on an $ORIGIN
  # RPATH for relocatability, which OpenBSD's ld.so does not implement (see
  # _ELF_RPATH_PLATFORMS in builder.py) — the bundle would build but not
  # relocate.
  # Bumped 3 -> 4: declared zstd. libLLVM, lld and libclang-cpp link libzstd
  # (LLVM_ENABLE_ZSTD finds it whenever the builder has one), but the recipe
  # listed only zlib, so cvc.3 needed the host's libzstd.so.1 on Linux and an
  # unshipped @rpath/libzstd.1.5.7.dylib on macOS -- the macOS clang did not
  # start from a clean prefix. zstd is now a build and runtime dependency on
  # the Unix platforms and build.sh forces LLVM_ENABLE_ZSTD on, so the bundle
  # links the declared one. Also: package.files lists lib/clang/ (clang's
  # resource headers -- stddef.h, intrinsics, cuda_wrappers; clang cannot
  # compile anything without them). Packing ships the whole install tree, so
  # cvc.3 had them too; declaring them makes the pack fail if a build ever
  # stops producing them, instead of publishing a clang that cannot compile.
  # And the ncurses
  # build edge is gone, because LLVM 19 removed its terminfo support
  # (LLVM_ENABLE_TERMINFO no longer exists; cvc.3's libLLVM links no libtinfo).
  # Not bumped for the package.files platform scoping below: it changes only
  # what the Windows pack checks, not what any platform builds, and no
  # Windows bundle of this recipe has been published.
  cvc_revision: 4
  maintainer: "cvcpkg group"
  maintainer_email: "info@cvcpkg.org"
  maintainer_url: "https://cvcpkg.org"
  homepage: https://llvm.org
  license: Apache-2.0
  tags: [compiler, toolchain, llvm, clang, development]
  description: >-
    LLVM 22 — the complete LLVM/Clang/LLD toolchain built from the LLVM
    monorepo.  Provides clang, clang++, the LLVM static analysis and
    optimisation infrastructure, the LLD linker, and all development
    libraries and headers needed to build LLVM-based tools.
    Targets: X86, AArch64, WebAssembly.

    This is the recipe to depend on unless you are pinned to an older LLVM
    major.  See `llvm20` for consumers that CMake-require LLVM 20.x.

source:
  type: tarball
  url: https://github.com/llvm/llvm-project/releases/download/llvmorg-22.1.8/llvm-project-22.1.8.src.tar.xz
  sha256: "922f1817a0df7b1489272d18134ee0087a8b068828f87ac63b9861b1a9965888"
  strip_components: 1

patches: []

depends:
  build:
    - name: zlib
      version: "^1.3"
    - name: zstd
      version: "^1.5"
      platforms: [linux, macos, freebsd, netbsd]
  runtime:
    - name: zlib
      version: "^1.3"
    # libLLVM / lld / libclang-cpp link libzstd.  Windows: build.ps1 does not
    # enable zstd (the cvcpkg windows zstd bundle is static-only), so the
    # Windows bundle links zlib alone.
    - name: zstd
      version: "^1.5"
      platforms: [linux, macos, freebsd, netbsd]
  host_tools: []

build:
  # The same LLVM+Clang+LLD build as llvm18, which needed both: it overruns the
  # server's default 2h reap timeout on a modest fleet builder, and its Release
  # Ninja tree runs ~20 GiB before install. See recipes/llvm18/recipe.yaml.
  timeout_seconds: 18000
  min_disk_gb: 25
  matrix:
    - platform: linux
      script: build.sh
    - platform: macos
      script: build.sh
      env:
        MACOSX_DEPLOYMENT_TARGET: "13.0"
    - platform: freebsd
      script: build.sh
    - platform: netbsd
      script: build.sh
    - platform: windows
      script: build.ps1

package:
  files:
    # Entries scoped to the Unix platforms are Unix spellings with no suffix
    # (.so, .dll, .exe, ...) from which the strict-globs check can tell that
    # Windows never produces them, so unscoped they would be required there too
    # and fail the Windows pack (as they did for llvm18).  Their Windows
    # spellings are declared below.
    - bin/clang*
    - bin/lld*
    - { glob: "bin/ld.lld", platforms: [linux, macos, freebsd, netbsd] }
    - { glob: "bin/ld64.lld", platforms: [linux, macos, freebsd, netbsd] }
    - bin/llvm-*
    - { glob: "bin/opt", platforms: [linux, macos, freebsd, netbsd] }
    - { glob: "bin/llc", platforms: [linux, macos, freebsd, netbsd] }
    - { glob: "bin/lli", platforms: [linux, macos, freebsd, netbsd] }
    - { glob: "lib/libLLVM*", platforms: [linux, macos, freebsd, netbsd] }
    - lib/libclang*
    - { glob: "lib/liblld*", platforms: [linux, macos, freebsd, netbsd] }
    - lib/cmake/llvm/
    - lib/cmake/clang/
    - lib/cmake/lld/
    # Clang builtin/resource headers (lib/clang/<ver>/include -- stddef.h,
    # arm_acle.h, immintrin.h, cuda_wrappers, ...).  clang looks for them next
    # to itself; without them it cannot compile even a hello world.  Installed
    # at the same path on Windows.
    - lib/clang/
    - include/llvm/
    - include/llvm-c/
    - include/clang/
    - include/clang-c/
    - include/lld/
    # Windows (the .exe/.lib suffix limits these to it).  The tools are .exe
    # files (ld.lld.exe and ld64.lld.exe are copies of lld.exe where Unix has
    # symlinks).  MSVC cannot build the libLLVM DLL (LLVM_BUILD_LLVM_DYLIB is
    # forced off there), so LLVM and lld ship as their component libraries.
    - bin/ld.lld.exe
    - bin/ld64.lld.exe
    - bin/opt.exe
    - bin/llc.exe
    - bin/lli.exe
    - lib/LLVM*.lib
    - lib/lld*.lib
  cmake_packages:
    - { name: LLVM, targets: ["LLVM"] }
    - { name: Clang, targets: ["clang", "clangTooling"] }

abi:
  cxx_std: 17

notes:
  - title: "Build time"
    platforms: [linux, macos, windows, freebsd]
    description: >-
      LLVM is a very large project.  Expect 30–90 minutes to compile
      depending on hardware.  The build uses -j${CVC_JOBS} parallelism.
      LLVM_PARALLEL_LINK_JOBS is capped at 2 to avoid OOM during linking.
  - title: "Included sub-projects"
    platforms: [linux, macos, windows, freebsd]
    description: >-
      Built with LLVM_ENABLE_PROJECTS="clang;lld".  This provides clang,
      clang++, clang-format, clang-tidy, the lld linker, and all LLVM
      tools (opt, llc, lli, llvm-dis, llvm-link, llvm-nm, etc.).
      Targets: X86, AArch64, WebAssembly.
  - title: "Shared library"
    platforms: [linux, macos, freebsd]
    description: >-
      LLVM_BUILD_LLVM_DYLIB=ON produces a single libLLVM.so/.dylib that
      all LLVM tools link against, keeping the total install size smaller.
      Downstream consumers can also link against it.
  - title: "llvm-cbe C backend"
    platforms: [linux, macos, windows, freebsd]
    description: >-
      llvm-cbe converts LLVM bitcode to C, but does NOT build against this
      recipe: upstream requires LLVM 20.1 and CMake's find_package matches
      on major, so it depends on `llvm20` instead.  Use this recipe's clang
      to produce the bitcode:
        clang++ -std=c++20 -O2 -emit-llvm -c main.cpp -o main.bc
        llvm-cbe main.bc -o main.c
