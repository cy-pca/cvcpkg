schema_version: 1
recipe:
  name: beniget-cp312
  upstream_version: "0.5.0"
  cvc_revision: 1

  maintainer: "cvcpkg group"
  maintainer_email: "info@cvcpkg.org"
  maintainer_url: "https://cvcpkg.org"
  homepage: https://pypi.org/project/beniget/
  license: "BSD-3-Clause"
  tags: [python, source]
  description: >-
    beniget 0.5.0 for CPython 3.12 — the cp312 column of
    cvcpkg's per-interpreter matrix (pure-Python, built from the PyPI sdist);
    generated by tools/gen_python_recipes.py.
    Built FROM SOURCE: cvcpkg fetches and sha256-verifies the PyPI sdist,
    and build.sh compiles the wheel with the prefix's own CPython 3.12 —
    no third-party prebuilt binary enters the bundle.

# From-source sdist, sha256 as published by PyPI for this exact version.
source:
  # Built from the source package beniget-src, which pins the upstream tarball
  # (https://files.pythonhosted.org/packages/31/a9/cf7c2317da1f5034fdebe84555e14a474b3297ef2d03ad148ff02fef2e3a/beniget-0.5.0.tar.gz).
  type: package
  package: beniget-src

python:
  interpreter: python312
  abi: cp312

patches: []

depends:
  build:
    - name: beniget-src
      version: "==0.5.0"
    - name: python312
    - name: gast-cp312
    # PEP-517 build backend, from this sdist's [build-system] requires.
    # --no-build-isolation means pip will NOT fetch it, so it has to be
    # in the build prefix already (build.sh bridges it onto sys.path).
    - name: setuptools-cp312
    - name: wheel-cp312
  runtime:
    - name: python312
    - name: gast-cp312
  host_tools:
    - python312

build:
  build_type_independent: true
  matrix:
    - platform: any
      script: build.sh
    - platform: windows
      script: build.ps1

package:
  files:
    - { glob: "lib/python3.12/site-packages/beniget/", platforms: [any] }
    - { glob: "lib/python3.12/site-packages/beniget-*.dist-info/", platforms: [any] }
    - { glob: "Lib/site-packages/beniget/", platforms: [windows] }
    - { glob: "Lib/site-packages/*.dist-info/", platforms: [windows] }
