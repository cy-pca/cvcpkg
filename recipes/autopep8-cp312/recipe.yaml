schema_version: 1
recipe:
  name: autopep8-cp312
  upstream_version: "2.3.1"
  cvc_revision: 1

  maintainer: "cvcpkg group"
  maintainer_email: "info@cvcpkg.org"
  maintainer_url: "https://cvcpkg.org"
  homepage: https://pypi.org/project/autopep8/
  license: "MIT"
  tags: [python, source]
  description: >-
    autopep8 2.3.1 for CPython 3.12 — the cp312 column of
    cvcpkg's per-interpreter matrix (pure-Python, built from the PyPI sdist);
    generated by tools/gen_python_recipes.py.
    Built FROM SOURCE: cvcpkg fetches and sha256-verifies the PyPI sdist,
    and build.sh compiles the wheel with the prefix's own CPython 3.12 —
    no third-party prebuilt binary enters the bundle.

# From-source sdist, sha256 as published by PyPI for this exact version.
source:
  # Built from the source package autopep8-src, which pins the upstream tarball
  # (https://files.pythonhosted.org/packages/6c/52/65556a5f917a4b273fd1b705f98687a6bd721dbc45966f0f6687e90a18b0/autopep8-2.3.1.tar.gz).
  type: package
  package: autopep8-src

python:
  interpreter: python312
  abi: cp312

patches: []

depends:
  build:
    - name: autopep8-src
      version: "==2.3.1"
    - name: python312
    - name: pycodestyle-cp312
    # PEP-517 build backend, from this sdist's [build-system] requires.
    # --no-build-isolation means pip will NOT fetch it, so it has to be
    # in the build prefix already (build.sh bridges it onto sys.path).
    - name: setuptools-cp312
  runtime:
    - name: python312
    - name: pycodestyle-cp312
  host_tools:
    - python312

provides:
  - autopep8

build:
  build_type_independent: true
  matrix:
    - platform: any
      script: build.sh
    - platform: windows
      script: build.ps1

package:
  files:
    - { glob: "lib/python3.12/site-packages/autopep8.py", platforms: [any] }
    - { glob: "lib/python3.12/site-packages/autopep8-*.dist-info/", platforms: [any] }
    - { glob: "bin/autopep8", platforms: [any] }
    - { glob: "Lib/site-packages/autopep8.py", platforms: [windows] }
    - { glob: "Lib/site-packages/autopep8-*.dist-info/", platforms: [windows] }
