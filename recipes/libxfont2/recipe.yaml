schema_version: 1
recipe:
  name: libxfont2
  upstream_version: "2.0.9"
  cvc_revision: 1
  maintainer: "cvcpkg group"
  maintainer_email: "info@cvcpkg.org"
  maintainer_url: "https://cvcpkg.org"
  homepage: https://www.x.org/
  license: MIT
  tags: [libraries, x11, fonts]
  description: >-
    libXfont2 — X font handling library (bitmap/FreeType font loading,
    built-in fixed/cursor fonts, font-server client).  Used by the X server;
    the built-in fonts let Xvfb run with no font files installed.

source:
  type: tarball
  url: https://xorg.freedesktop.org/archive/individual/lib/libXfont2-2.0.9.tar.xz
  sha256: "f042a370666815e7b941e9b7019024755bd1c6c2954afbfa515af378251799e2"
  strip_components: 1

patches: []

depends:
  build:
    - pkg-config
    - name: xorgproto
    - name: xtrans
  runtime:
    - name: libfontenc
    - name: freetype
    - name: zlib
  host_tools: []

package:
  files:
    - lib/
    - include/
    - share/

build:
  matrix:
    - platform: linux
      script: build.sh
      env:
        CFLAGS: "-O2 -fPIC"
