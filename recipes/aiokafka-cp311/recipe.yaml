schema_version: 1
recipe:
  name: aiokafka-cp311
  upstream_version: "0.14.0"
  cvc_revision: 1

  maintainer: "cvcpkg group"
  maintainer_email: "info@cvcpkg.org"
  maintainer_url: "https://cvcpkg.org"
  homepage: https://pypi.org/project/aiokafka/
  license: "Apache-2.0"
  tags: [python, source]
  description: >-
    aiokafka 0.14.0 for CPython 3.11 — the cp311 column of
    cvcpkg's per-interpreter matrix (C extensions compiled for cp311 from the PyPI sdist);
    generated by tools/gen_python_recipes.py.
    Built FROM SOURCE: cvcpkg fetches and sha256-verifies the PyPI sdist,
    and build.sh compiles the wheel with the prefix's own CPython 3.11 —
    no third-party prebuilt binary enters the bundle.

# From-source sdist, sha256 as published by PyPI for this exact version.
source:
  type: tarball
  url: https://files.pythonhosted.org/packages/89/5f/dfc1180fd22d1acdc91949ec36e97199c43742dacb057cb8efed3679ed04/aiokafka-0.14.0.tar.gz
  sha256: "8ffdc945798ba4d3d132b705d4244d0a1f493925efb57c637a2ca88ee82794e1"
  strip_components: 1

python:
  interpreter: python311
  abi: cp311

patches: []

depends:
  build:
    - name: python311
    - name: async-timeout-cp311
    - name: packaging-cp311
    - name: typing-extensions-cp311
    # PEP-517 build backend, from this sdist's [build-system] requires.
    # --no-build-isolation means pip will NOT fetch it, so it has to be
    # in the build prefix already (build.sh bridges it onto sys.path).
    - name: setuptools-cp311
    - name: cython-cp311
  runtime:
    - name: python311
    - name: async-timeout-cp311
    - name: packaging-cp311
    - name: typing-extensions-cp311
  host_tools:
    - python311

build:
  build_type_independent: true
  matrix:
    - platform: linux
      script: build.sh
    - platform: macos
      script: build.sh
    - platform: windows
      script: build.ps1

package:
  files:
    - { glob: "lib/python3.11/site-packages/aiokafka/", platforms: [linux, macos] }
    - { glob: "lib/python3.11/site-packages/*.dist-info/", platforms: [linux, macos] }
    - { glob: "Lib/site-packages/aiokafka/", platforms: [windows] }
    - { glob: "Lib/site-packages/*.dist-info/", platforms: [windows] }
