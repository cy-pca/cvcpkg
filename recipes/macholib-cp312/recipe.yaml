schema_version: 1
recipe:
  name: macholib-cp312
  upstream_version: "1.16.4"
  # cvc.4: republish.  The published noarch cvc.3 bundle's console scripts
  # (macho_dump, macho_find, macho_standalone) carry the build machine's interpreter as their shebang (the old
  # libcvc-deps macOS CI prefix), so they cannot run anywhere; packing today
  # rewrites it to /usr/bin/env.
  cvc_revision: 4

  maintainer: "cvcpkg group"
  maintainer_email: "info@cvcpkg.org"
  maintainer_url: "https://cvcpkg.org"
  homepage: https://pypi.org/project/macholib/
  license: "MIT"
  tags: [python, source]
  description: >-
    macholib 1.16.4 for CPython 3.12 — the cp312 column of
    cvcpkg's per-interpreter matrix (pure-Python, built from the PyPI sdist);
    generated by tools/gen_python_recipes.py.
    Built FROM SOURCE: cvcpkg fetches and sha256-verifies the PyPI sdist,
    and build.sh compiles the wheel with the prefix's own CPython 3.12 —
    no third-party prebuilt binary enters the bundle.

# From-source sdist, sha256 as published by PyPI for this exact version.
source:
  # Built from the source package macholib-src, which pins the upstream tarball
  # (https://files.pythonhosted.org/packages/10/2f/97589876ea967487978071c9042518d28b958d87b17dceb7cdc1d881f963/macholib-1.16.4.tar.gz).
  type: package
  package: macholib-src

python:
  interpreter: python312
  abi: cp312

patches: []

depends:
  build:
    - name: macholib-src
      version: "==1.16.4"
    - name: python312
    - name: altgraph-cp312
    # PEP-517 build backend, from this sdist's [build-system] requires.
    # --no-build-isolation means pip will NOT fetch it, so it has to be
    # in the build prefix already (build.sh bridges it onto sys.path).
    - name: setuptools-cp312
    - name: wheel-cp312
  runtime:
    - name: python312
    - name: altgraph-cp312
  host_tools:
    - python312

build:
  build_type_independent: true
  matrix:
    - platform: any
      script: build.sh
    - platform: windows
      script: build.ps1

package:
  files:
    - { glob: "lib/python3.12/site-packages/macholib/", platforms: [any] }
    - { glob: "lib/python3.12/site-packages/macholib-*.dist-info/", platforms: [any] }
    - { glob: "Lib/site-packages/macholib/", platforms: [windows] }
    - { glob: "Lib/site-packages/*.dist-info/", platforms: [windows] }
