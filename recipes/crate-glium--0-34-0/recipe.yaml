  description: "The glium 0.34.0 crate from crates.io (Elegant and safe OpenGL wrapper. Glium is an intermediate layer between OpenGL and your application. You still need to manually handle the graphics pipeline, but without having to use OpenGL's old and error-prone API. Its objectives: - Be safe to use. Many aspects of OpenGL that can trigger a crash if misused are automatically handled by glium. - Provide an API that enforces good pratices such as RAII or stateless function calls. - Be compatible with all OpenGL versions that support shaders, providing unified API when things diverge. - Avoid all OpenGL errors beforehand. - Produce optimized OpenGL function calls, and allow the user to easily use modern OpenGL techniques), as one entry of a cargo directory source at share/cargo/crates/: Rust recipes build from it offline instead of downloading it. The .crate file is checked against the sha256 the Cargo.lock records. Pinned first by wezterm. Generated by tools/make_crate_packages.py."

