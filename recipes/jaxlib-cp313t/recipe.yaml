schema_version: 1
recipe:
  name: jaxlib-cp313t
  upstream_version: "0.8.2"
  cvc_revision: 1
  maintainer: "cvcpkg group"
  maintainer_email: "info@cvcpkg.org"
  maintainer_url: "https://cvcpkg.org"
  homepage: https://github.com/jax-ml/jax
  license: Apache-2.0
  tags: [python, wheel, ml, scientific]
  description: >-
    jaxlib 0.8.2 (CPU) for free-threaded CPython 3.13t (cp313t): the pinned prebuilt
    manylinux_2_27 wheel from PyPI, installed into the python313t interpreter's
    site-packages. jaxlib is NOT built from source, the way torch is not: PyPI
    publishes no sdist, and the source build is XLA plus most of LLVM under
    Bazel, which downloads its own clang and sysroot. Its runtime deps (numpy,
    scipy, ml-dtypes) are cvcpkg's own from-source columns; jax, optax and
    equinox build from source on top of it. 0.8.2 is the version LieSPHGP's
    Phase A ran, and its x86 build needs AVX (not AVX2): it imports on every
    fleet machine except lat. linux-x86_64 only: the platform verified, and the
    only one with a cvcpkg scipy column.

source:
  type: python_wheel
  artifacts:
    linux-x86_64:
      url: https://files.pythonhosted.org/packages/e2/5c/3f1476cd6cbc0e2aa661cb750489739aeda500473d91dc79837b5bc9247f/jaxlib-0.8.2-cp313-cp313t-manylinux_2_27_x86_64.whl
      sha256: "28eec1a4e0639a0d8702cea3cb70dd3663053dbfa344452994ea48dc6ceadaa5"

python:
  interpreter: python313t
  abi: cp313t

patches: []

depends:
  build:
    - name: python313t
  runtime:
    - name: python313t
    - name: numpy-cp313t
    - name: scipy-cp313t
    - name: ml-dtypes-cp313t
  host_tools:
    - python313t

build:
  build_type_independent: true
  matrix:
    - platform: linux
      script: build.sh

package:
  files:
    - lib/python3.13t/site-packages/jaxlib/
    - lib/python3.13t/site-packages/jaxlib-0.8.2.dist-info/
