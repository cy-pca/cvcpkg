schema_version: 1
recipe:
  name: opt-einsum-cp312
  upstream_version: "3.4.0"
  cvc_revision: 2

  maintainer: "cvcpkg group"
  maintainer_email: "info@cvcpkg.org"
  maintainer_url: "https://cvcpkg.org"
  homepage: https://pypi.org/project/opt-einsum/
  license: "MIT"
  tags: [python, source]
  description: >-
    opt-einsum 3.4.0 for CPython 3.12 — the cp312 column of
    cvcpkg's per-interpreter matrix (pure-Python, built from the PyPI sdist);
    generated by tools/gen_python_recipes.py.
    Built FROM SOURCE: cvcpkg fetches and sha256-verifies the PyPI sdist,
    and build.sh compiles the wheel with the prefix's own CPython 3.12 —
    no third-party prebuilt binary enters the bundle.

# From-source sdist, sha256 as published by PyPI for this exact version.
source:
  # Built from the source package opt-einsum-src, which pins the upstream tarball
  # (https://files.pythonhosted.org/packages/8c/b9/2ac072041e899a52f20cf9510850ff58295003aa75525e58343591b0cbfb/opt_einsum-3.4.0.tar.gz).
  type: package
  package: opt-einsum-src

python:
  interpreter: python312
  abi: cp312

patches: []

depends:
  build:
    - name: opt-einsum-src
      version: "==3.4.0"
    - name: python312
    # PEP-517 build backend, from this sdist's [build-system] requires.
    # --no-build-isolation means pip will NOT fetch it, so it has to be
    # in the build prefix already (build.sh bridges it onto sys.path).
    - name: hatchling-cp312
    - name: hatch-fancy-pypi-readme-cp312
    - name: hatch-vcs-cp312
    - name: packaging-cp312
    - name: pathspec-cp312
    - name: pluggy-cp312
    - name: trove-classifiers-cp312
    - name: calver-cp312
  runtime:
    - name: python312
  host_tools:
    - python312

build:
  build_type_independent: true
  matrix:
    - platform: any
      script: build.sh
    - platform: windows
      script: build.ps1

package:
  files:
    - { glob: "lib/python3.12/site-packages/opt_einsum/", platforms: [any] }
    - { glob: "lib/python3.12/site-packages/opt_einsum-*.dist-info/", platforms: [any] }
    - { glob: "Lib/site-packages/opt_einsum/", platforms: [windows] }
    - { glob: "Lib/site-packages/opt_einsum-*.dist-info/", platforms: [windows] }
