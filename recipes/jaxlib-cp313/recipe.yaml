schema_version: 1
recipe:
  name: jaxlib-cp313
  upstream_version: "0.8.2"
  cvc_revision: 1
  maintainer: "cvcpkg group"
  maintainer_email: "info@cvcpkg.org"
  maintainer_url: "https://cvcpkg.org"
  homepage: https://github.com/jax-ml/jax
  license: Apache-2.0
  tags: [python, wheel, ml, scientific]
  description: >-
    jaxlib 0.8.2 (CPU) for CPython 3.13 (cp313): the pinned prebuilt
    manylinux_2_27 wheel from PyPI, installed into the python313 interpreter's
    site-packages. jaxlib is NOT built from source, the way torch is not: PyPI
    publishes no sdist, and the source build is XLA plus most of LLVM under
    Bazel, which downloads its own clang and sysroot. Its runtime deps (numpy,
    scipy, ml-dtypes) are cvcpkg's own from-source columns; jax, optax and
    equinox build from source on top of it. 0.8.2 is the version LieSPHGP's
    Phase A ran, and its x86 build needs AVX (not AVX2): it imports on every
    fleet machine except lat. linux-x86_64 only: the platform verified, and the
    only one with a cvcpkg scipy column.

source:
  type: python_wheel
  artifacts:
    linux-x86_64:
      url: https://files.pythonhosted.org/packages/6b/e0/91e5762a7ddb6351b07c742ca407cd28e26043d6945d6228b6c1b0881a45/jaxlib-0.8.2-cp313-cp313-manylinux_2_27_x86_64.whl
      sha256: "1bfbcf6c3de221784fa4cdb6765a09d71cb4298b15626b3d0409b3dfcd8a8667"

python:
  interpreter: python313
  abi: cp313

patches: []

depends:
  build:
    - name: python313
  runtime:
    - name: python313
    - name: numpy-cp313
    - name: scipy-cp313
    - name: ml-dtypes-cp313
  host_tools:
    - python313

build:
  build_type_independent: true
  matrix:
    - platform: linux
      script: build.sh

package:
  files:
    - lib/python3.13/site-packages/jaxlib/
    - lib/python3.13/site-packages/jaxlib-0.8.2.dist-info/
