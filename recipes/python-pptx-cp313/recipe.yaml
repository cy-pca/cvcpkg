schema_version: 1
recipe:
  name: python-pptx-cp313
  upstream_version: "1.0.2"
  # New recipe.  python-pptx (import `pptx`) is the PowerPoint (.pptx) reader/
  # writer, the package that was pip-installed off-catalog to build a pitch deck
  # as a PowerPoint.  It is pure Python; its weight is its dependency closure —
  # lxml (native XML), Pillow (images), XlsxWriter (embedded chart data) and
  # typing-extensions — all cvcpkg recipes, resolved by the depends graph.
  cvc_revision: 1
  maintainer: "cvcpkg group"
  maintainer_email: "info@cvcpkg.org"
  maintainer_url: "https://cvcpkg.org"
  homepage: https://pypi.org/project/python-pptx/
  license: "MIT"
  tags: [python, source, office]
  description: >-
    python-pptx 1.0.2 for CPython 3.13 (cp313) — the cp313 column of cvcpkg's
    per-interpreter matrix, BUILT FROM SOURCE from the PyPI sdist (import as
    `pptx`).  Pure Python, so the build is a plain setuptools sdist compile; the
    substance is the runtime closure it brings on-catalog — lxml-cp313 (which
    carries the new libxslt native dep), pillow-cp313, xlsxwriter-cp313 and
    typing-extensions-cp313 — so slide-deck tooling installs hermetically from
    cvcpkg instead of pip.  build.sh verifies the consuming path end to end:
    Presentation().slides.add_slide(...) then .save(), the exact off-catalog pip
    path this recipe replaces.

# From-source sdist, sha256 as published by PyPI for this exact version.
source:
  type: tarball
  url: https://files.pythonhosted.org/packages/52/a9/0c0db8d37b2b8a645666f7fd8accea4c6224e013c42b1d5c17c93590cd06/python_pptx-1.0.2.tar.gz
  sha256: "479a8af0eaf0f0d76b6f00b0887732874ad2e3188230315290cd1f9dd9cc7095"
  strip_components: 1

python:
  interpreter: python313
  abi: cp313

patches: []

depends:
  build:
    - name: python313
    # PEP-517 backend (setuptools.build_meta, requires setuptools>=61);
    # --no-build-isolation means it must already be in the build prefix.
    - name: setuptools-cp313
    - name: wheel-cp313
  runtime:
    - name: python313
    # python-pptx's install_requires, every one an on-catalog cvcpkg column.
    - name: lxml-cp313
    - name: pillow-cp313
    - name: xlsxwriter-cp313
    - name: typing-extensions-cp313
  host_tools:
    - python313

build:
  build_type_independent: true
  # Pure Python -> noarch (platform: any), like the generated pure-Python
  # columns; the windows column only differs in the install path (Lib/
  # site-packages vs lib/pythonX.Y/site-packages).  Installability follows the
  # native leg of its closure (lxml -> linux/macos/windows); the bundle itself
  # is arch-independent.
  matrix:
    - platform: any
      script: build.sh
    - platform: windows
      script: build.ps1

package:
  files:
    - lib/python3.13/site-packages/pptx/
    - lib/python3.13/site-packages/python_pptx-*.dist-info/
    - Lib/site-packages/pptx/
    - Lib/site-packages/python_pptx-*.dist-info/
