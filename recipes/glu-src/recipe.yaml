schema_version: 1
recipe:
  name: glu-src
  upstream_version: "9.0.3"
  cvc_revision: 1
  maintainer: cvcpkg group
  maintainer_email: info@cvcpkg.org
  maintainer_url: https://cvcpkg.org
  homepage: https://mesa3d.org/
  license: SGI-B-2.0
  tags: [source]
  description: >-
    The unmodified upstream source of glu 9.0.3: its release tarball,
    verified against the sha256 below and staged at src/glu-src/.  The glu
    recipe builds from it (source.type package), so the tarball is fetched
    once, from archive.mesa3d.org, and every other build of glu -- another
    platform, a builder that cannot reach archive.mesa3d.org, a user building from
    source -- installs this package from the catalog instead.  Generated by
    tools/make_source_package.py.

source:
  type: tarball
  # Canonical mesa archive (mesa.freedesktop.org/archive/... 308-redirects here,
  # and cvcpkg's urllib downloader doesn't follow it). Same tarball/sha256.
  url: https://archive.mesa3d.org/glu/glu-9.0.3.tar.xz
  sha256: "bd43fe12f374b1192eb15fe20e45ff456b9bc26ab57f0eee919f96ca0f8a330f"
  strip_components: 1

patches: []

depends:
  build: []
  runtime: []
  host_tools: []

build:
  build_type_independent: true
  matrix:
    - platform: any
      script: build.sh

package:
  files:
    - src/glu-src/
