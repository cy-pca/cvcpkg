schema_version: 1
recipe:
  name: bzip2
  upstream_version: "1.0.8"
  # Bumped 2 -> 3 to actually SHIP the relative-symlink fix from #404.
  #
  # #404 rewrote bzcmp/bzegrep/bzfgrep/bzless from absolute to relative symlinks
  # in build.sh but did not bump this field — and the macOS bundle had been
  # published 57 minutes earlier (2026-07-26 03:00 vs the fix at 03:57). Since
  # published variants are immutable, a republish at revision 2 silently
  # no-ops, so macOS 1.0.8+cvc.2 is still live with links into the builder's
  # scratch dir:
  #     bin/bzcmp -> /private/var/folders/.../cvcpkg-bzip2-5de_csjx/install/bin/bzdiff
  # Verified by downloading the published artifact and listing the tar.
  #
  # Consuming that bundle aborts the whole install with
  # tarfile.AbsoluteLinkError, so it is not merely cosmetic: it blocks any
  # recipe that declares bzip2 on macOS. libMagickCore and libfreetype both
  # link libbz2, which is why libcvc's macOS build needs this.
  # cvc.5: package.files scoped per platform.  The strict pack check failed
  # every Windows build (bunzip2/bzcat/bzdiff/bzgrep/bzmore are links and
  # scripts that only the Unix `make install` creates; makefile.msc builds
  # just bzip2.exe and bzip2recover.exe) and would fail wasm/wasi/cosmo too,
  # which install the library only.  No file in any bundle changes.
  # cvc.6: the Windows libbz2.dll exports the API.  It was linked without
  # upstream's libbz2.def, and bzlib.h marks nothing dllexport, so the DLL had
  # no export table and libbz2.lib/bz2.lib were empty import libraries: nothing
  # MSVC could link BZ2_* from it (CPython's _bz2 is the first consumer to try).
  # Other platforms rebuild unchanged.
  cvc_revision: 6
  maintainer: "cvcpkg group"
  maintainer_email: "info@cvcpkg.org"
  maintainer_url: "https://cvcpkg.org"
  description: "bzip2 — high-quality data compression library (Burrows-Wheeler)."
  homepage: https://sourceware.org/bzip2/
  license: bzip2-1.0.6
  tags: [libraries, io]

source:
  # Built from the source package bzip2-src, which pins the upstream tarball
  # (https://sourceware.org/pub/bzip2/bzip2-1.0.8.tar.gz).
  type: package
  package: bzip2-src

patches: []

depends:
  build:
    - name: bzip2-src
      version: "==1.0.8"
  runtime: []
  host_tools: []

build:
  matrix:
    - platform: linux
      script: build.sh
      env:
        CFLAGS: "-O2 -fPIC"
    - platform: macos
      script: build.sh
      env:
        MACOSX_DEPLOYMENT_TARGET: "13.0"
    - platform: freebsd
      script: build.sh
      env:
        CFLAGS: "-O2 -fPIC"
    - platform: openbsd
      script: build.sh
      env:
        CFLAGS: "-O2 -fPIC"
    - platform: netbsd
      script: build.sh
      env:
        CFLAGS: "-O2 -fPIC"
    - platform: haiku
      script: build.sh
      env:
        CFLAGS: "-O2 -fPIC"
    - platform: windows
      script: build.ps1
    - platform: wasm
      host_platform: linux
      script: build-wasm.sh
    # Threaded wasm: same build script, -pthread injected by env-wasm.sh's
    # CVC_WASM_THREADS hook.  A separate platform because emscripten cannot
    # link single-threaded objects into a shared-memory build.
    - platform: wasm-mt
      host_platform: linux
      script: build-wasm.sh
      env:
        CVC_WASM_THREADS: "1"
    - platform: wasi
      host_platform: linux
      script: build-wasi.sh
    - platform: cosmo
      host_platform: linux
      script: build-cosmo.sh

package:
  files:
    - lib/libbz2*
    - lib/bz2*
    - lib/pkgconfig/bzip2.pc
    - include/bzlib.h
    # The cross targets (wasm, wasm-mt, wasi, cosmo) install the library only.
    # Windows gets bzip2.exe and bzip2recover.exe from makefile.msc but none of
    # the links and shell scripts that the Unix `make install` adds.
    - { glob: "bin/bzip2*",   platforms: [linux, macos, freebsd, openbsd, netbsd, haiku, windows] }
    - { glob: "bin/bunzip2*", platforms: [linux, macos, freebsd, openbsd, netbsd, haiku] }
    - { glob: "bin/bzcat*",   platforms: [linux, macos, freebsd, openbsd, netbsd, haiku] }
    - { glob: "bin/bzdiff*",  platforms: [linux, macos, freebsd, openbsd, netbsd, haiku] }
    - { glob: "bin/bzgrep*",  platforms: [linux, macos, freebsd, openbsd, netbsd, haiku] }
    - { glob: "bin/bzmore*",  platforms: [linux, macos, freebsd, openbsd, netbsd, haiku] }
  cmake_packages: []

abi:
  cxx_std: 17
