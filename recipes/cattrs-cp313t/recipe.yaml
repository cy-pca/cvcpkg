schema_version: 1
recipe:
  name: cattrs-cp313t
  upstream_version: "25.1.1"
  cvc_revision: 1

  maintainer: "cvcpkg group"
  maintainer_email: "info@cvcpkg.org"
  maintainer_url: "https://cvcpkg.org"
  homepage: https://pypi.org/project/cattrs/
  license: "MIT"
  tags: [python, source]
  description: >-
    cattrs 25.1.1 for CPython 3.13t — the cp313t column of
    cvcpkg's per-interpreter matrix (pure-Python, built from the PyPI sdist);
    generated by tools/gen_python_recipes.py.
    Built FROM SOURCE: cvcpkg fetches and sha256-verifies the PyPI sdist,
    and build.sh compiles the wheel with the prefix's own CPython 3.13t —
    no third-party prebuilt binary enters the bundle.
    The cp313t column installs under the free-threaded (no-GIL)
    interpreter and its import check runs with the GIL disabled.

# From-source sdist, sha256 as published by PyPI for this exact version.
source:
  # Built from the source package cattrs-src, which pins the upstream tarball
  # (https://files.pythonhosted.org/packages/57/2b/561d78f488dcc303da4639e02021311728fb7fda8006dd2835550cddd9ed/cattrs-25.1.1.tar.gz).
  type: package
  package: cattrs-src

python:
  interpreter: python313t
  abi: cp313t

patches: []

depends:
  build:
    - name: cattrs-src
      version: "==25.1.1"
    - name: python313t
    - name: attrs-cp313t
    - name: typing-extensions-cp313t
    # PEP-517 build backend, from this sdist's [build-system] requires.
    # --no-build-isolation means pip will NOT fetch it, so it has to be
    # in the build prefix already (build.sh bridges it onto sys.path).
    - name: hatchling-cp313t
    - name: hatch-vcs-cp313t
    - name: packaging-cp313t
    - name: pathspec-cp313t
    - name: pluggy-cp313t
    - name: trove-classifiers-cp313t
    - name: calver-cp313t
  runtime:
    - name: python313t
    - name: attrs-cp313t
    - name: typing-extensions-cp313t
  host_tools:
    - python313t

build:
  build_type_independent: true
  matrix:
    - platform: any
      script: build.sh
    - platform: windows
      script: build.ps1

package:
  files:
    - { glob: "lib/python3.13t/site-packages/cattrs/", platforms: [any] }
    - { glob: "lib/python3.13t/site-packages/cattr/", platforms: [any] }
    - { glob: "lib/python3.13t/site-packages/cattrs-*.dist-info/", platforms: [any] }
    - { glob: "Lib/site-packages/cattrs/", platforms: [windows] }
    - { glob: "Lib/site-packages/cattr/", platforms: [windows] }
    - { glob: "Lib/site-packages/cattrs-*.dist-info/", platforms: [windows] }
