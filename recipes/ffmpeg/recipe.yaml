schema_version: 1
recipe:
  name: ffmpeg
  upstream_version: "7.1.2"
  # cvc.2: rebuild with no Homebrew.  The published macOS arm64 cvc.1 bundle was built
  # before macOS CI moved Homebrew aside (#182): every libav*/libsw* dylib loads
  # Homebrew's libX11/libxcb from /opt/homebrew/opt, so it fails to load on any Mac
  # without them.  build.sh now turns X11 autodetection off on macOS.  Every platform
  # rebuilds.
  # cvc.3: declare iconv on macOS and OpenBSD.  FFmpeg's configure enables iconv
  # whenever it finds one, and cvc.2 linked an undeclared GNU libiconv there:
  # macOS took cvcpkg's from the shared populate prefix (@rpath/libiconv.2.dylib),
  # OpenBSD the build host's ports libiconv.so.7.1 from /usr/local.  Linux and the
  # other BSDs keep libc's iconv, now pinned against a GNU <iconv.h> on the search
  # path; see build.sh.  ffmpeg-lgpl had the same leak (cy-pca/cvcpkg#545).
  # cvc.4: drop fribidi.  Its only user in FFmpeg 7 is the drawtext filter, which
  # also needs libharfbuzz, so no build ever linked it, yet every bundle declared it
  # and installs pulled it in.
  cvc_revision: 4
  maintainer: "cvcpkg group"
  maintainer_email: "info@cvcpkg.org"
  maintainer_url: "https://cvcpkg.org"
  homepage: https://ffmpeg.org/
  license: GPL-2.0-or-later
  tags: [multimedia]
  description: >-
    FFmpeg — a complete, cross-platform solution to record, convert and
    stream audio and video.  Ships the libavformat, libavcodec,
    libavutil, libavfilter, libavdevice, libswscale and libswresample
    shared libraries.  Built with --enable-gpl and a broad external
    codec set: H.264 (x264), H.265/HEVC (x265), Opus, MP3, Vorbis,
    VP8/VP9 (libvpx), AV1 (dav1d), WebP, JPEG, PNG, OpenSSL,
    bzip2/lzma, freetype/fontconfig, and PulseAudio on Linux.
    Pared-down static builds are also provided for wasm, wasi, and cosmo.

source:
  # Built from the source package ffmpeg-src, which pins the upstream tarball
  # (https://ffmpeg.org/releases/ffmpeg-7.1.2.tar.xz).
  type: package
  package: ffmpeg-src

patches: []

depends:
  build:
    # Windows builds with MinGW-w64 under MSYS2 (build.ps1). Declared, as
    # aspell and x264-cli do, rather than reached through x264's host_tools.
    - name: msys2
      platforms: [windows]
    - name: make
      platforms: [windows]
    - name: mingw-w64-gcc
      platforms: [windows]
    - name: ffmpeg-src
      version: "==7.1.2"
    - name: patchelf
      platforms: [linux, freebsd, openbsd, netbsd]
    - name: nasm
      platforms: [linux, macos, freebsd, openbsd, netbsd, windows]
    - name: x264
      platforms: [linux, macos, freebsd, openbsd, netbsd, windows]
    - name: x265
      platforms: [linux, macos, freebsd, openbsd, netbsd, windows]
    - name: libopus
      platforms: [linux, macos, freebsd, openbsd, netbsd, windows]
    - name: libmp3lame
      platforms: [linux, macos, freebsd, openbsd, netbsd, windows]
    - name: libogg
      platforms: [linux, macos, freebsd, openbsd, netbsd, windows]
    - name: libvorbis
      platforms: [linux, macos, freebsd, openbsd, netbsd, windows]
    - name: dav1d
      platforms: [linux, macos, freebsd, openbsd, netbsd, windows]
    - name: libvpx
      platforms: [linux, macos, freebsd, openbsd, netbsd, windows]
    - name: libwebp
      platforms: [linux, macos, freebsd, openbsd, netbsd, windows]
    - name: libjpeg-turbo
      platforms: [linux, macos, freebsd, openbsd, netbsd, windows]
    - name: libpng
      platforms: [linux, macos, freebsd, openbsd, netbsd, windows]
    - name: freetype
      platforms: [linux, macos, freebsd, openbsd, netbsd, windows]
    - name: fontconfig
      platforms: [linux, macos, freebsd, openbsd, netbsd]
    # Not windows: TLS there is SChannel (build.ps1).
    - name: openssl
      platforms: [linux, macos, freebsd, openbsd, netbsd]
    - name: bzip2
      platforms: [linux, macos, freebsd, openbsd, netbsd, windows]
    - name: xz
      platforms: [linux, macos, freebsd, openbsd, netbsd, windows]
    - name: zlib
      platforms: [linux, macos, freebsd, openbsd, netbsd, windows]
    - name: libpulse
      platforms: [linux]
    # cvcpkg's GNU libiconv on OpenBSD, whose libc has no iconv, and on macOS,
    # where gettext and glib link it too.  Linux and the other BSDs use libc's.
    # See build.sh.
    - name: iconv
      version: ">=1.17"
      platforms: [openbsd, macos]
    - pkg-config
  runtime:
    - name: x264
      platforms: [linux, macos, freebsd, openbsd, netbsd, windows]
    - name: x265
      platforms: [linux, macos, freebsd, openbsd, netbsd, windows]
    - name: libopus
      platforms: [linux, macos, freebsd, openbsd, netbsd, windows]
    - name: libmp3lame
      platforms: [linux, macos, freebsd, openbsd, netbsd, windows]
    - name: libogg
      platforms: [linux, macos, freebsd, openbsd, netbsd, windows]
    - name: libvorbis
      platforms: [linux, macos, freebsd, openbsd, netbsd, windows]
    - name: dav1d
      platforms: [linux, macos, freebsd, openbsd, netbsd, windows]
    - name: libvpx
      platforms: [linux, macos, freebsd, openbsd, netbsd, windows]
    - name: libwebp
      platforms: [linux, macos, freebsd, openbsd, netbsd, windows]
    - name: libjpeg-turbo
      platforms: [linux, macos, freebsd, openbsd, netbsd, windows]
    - name: libpng
      platforms: [linux, macos, freebsd, openbsd, netbsd, windows]
    - name: freetype
      platforms: [linux, macos, freebsd, openbsd, netbsd, windows]
    - name: fontconfig
      platforms: [linux, macos, freebsd, openbsd, netbsd]
    # Not windows: TLS there is SChannel (build.ps1).
    - name: openssl
      platforms: [linux, macos, freebsd, openbsd, netbsd]
    - name: bzip2
      platforms: [linux, macos, freebsd, openbsd, netbsd, windows]
    - name: xz
      platforms: [linux, macos, freebsd, openbsd, netbsd, windows]
    - name: zlib
      platforms: [linux, macos, freebsd, openbsd, netbsd, windows]
    - name: libpulse
      platforms: [linux]
    - name: iconv
      version: ">=1.17"
      platforms: [openbsd, macos]
  host_tools: []

build:
  matrix:
    - platform: linux
      script: build.sh
      env:
        CFLAGS: "-O2 -fPIC"
    - platform: macos
      script: build.sh
      env:
        MACOSX_DEPLOYMENT_TARGET: "13.0"
    - platform: freebsd
      script: build.sh
      env:
        CFLAGS: "-O2 -fPIC"
    - platform: openbsd
      script: build.sh
      env:
        CFLAGS: "-O2 -fPIC"
    - platform: netbsd
      script: build.sh
      env:
        CFLAGS: "-O2 -fPIC"
    - platform: windows
      script: build.ps1
    - platform: wasm
      host_platform: linux
      script: build-wasm.sh
    - platform: wasi
      host_platform: linux
      script: build-wasi.sh
    - platform: cosmo
      host_platform: linux
      script: build-cosmo.sh

package:
  files:
    # Unix shared libs (.so / .dylib)
    - lib/libavformat*
    - lib/libavcodec*
    - lib/libavutil*
    - lib/libavfilter*
    - lib/libavdevice*
    - lib/libswscale*
    - lib/libswresample*
    - lib/pkgconfig/libav*
    - lib/pkgconfig/libsw*
    # Windows DLLs and import libs
    - bin/avformat-*.dll
    - bin/avcodec-*.dll
    - bin/avutil-*.dll
    - bin/avfilter-*.dll
    - bin/avdevice-*.dll
    - bin/swscale-*.dll
    - bin/swresample-*.dll
    - lib/avformat.lib
    - lib/avcodec.lib
    - lib/avutil.lib
    - lib/avfilter.lib
    - lib/avdevice.lib
    - lib/swscale.lib
    - lib/swresample.lib
    # Headers (shared)
    - include/libavformat/
    - include/libavcodec/
    - include/libavutil/
    - include/libavfilter/
    - include/libavdevice/
    - include/libswscale/
    - include/libswresample/
  pkg_config:
    - libavformat
    - libavcodec
    - libavutil
    - libavfilter
    - libavdevice
    - libswscale
    - libswresample

abi:
  cxx_std: 17
