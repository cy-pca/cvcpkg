schema_version: 1
recipe:
  name: libopus-src
  upstream_version: "1.6.1"
  cvc_revision: 1
  maintainer: cvcpkg group
  maintainer_email: info@cvcpkg.org
  maintainer_url: https://cvcpkg.org
  homepage: https://opus-codec.org/
  license: BSD-3-Clause
  tags: [source]
  description: >-
    The unmodified upstream source of libopus 1.6.1: its release tarball,
    verified against the sha256 below and staged at src/libopus-src/.  The libopus
    recipe builds from it (source.type package), so the tarball is fetched
    once, from ftp.osuosl.org, and every other build of libopus -- another
    platform, a builder that cannot reach ftp.osuosl.org, a user building from
    source -- installs this package from the catalog instead.  Generated by
    tools/make_source_package.py.

source:
  type: tarball
  url: https://ftp.osuosl.org/pub/xiph/releases/opus/opus-1.6.1.tar.gz
  sha256: "6ffcb593207be92584df15b32466ed64bbec99109f007c82205f0194572411a1"
  strip_components: 1

patches: []

depends:
  build: []
  runtime: []
  host_tools: []

build:
  build_type_independent: true
  matrix:
    - platform: any
      script: build.sh

package:
  files:
    - src/libopus-src/
