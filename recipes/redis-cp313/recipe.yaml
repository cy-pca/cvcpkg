schema_version: 1
recipe:
  name: redis-cp313
  upstream_version: "8.0.1"
  cvc_revision: 1

  maintainer: "cvcpkg group"
  maintainer_email: "info@cvcpkg.org"
  maintainer_url: "https://cvcpkg.org"
  homepage: https://pypi.org/project/redis/
  license: "MIT"
  tags: [python, source]
  description: >-
    redis 8.0.1 for CPython 3.13 — the cp313 column of
    cvcpkg's per-interpreter matrix (pure-Python, built from the PyPI sdist);
    generated by tools/gen_python_recipes.py.
    Built FROM SOURCE: cvcpkg fetches and sha256-verifies the PyPI sdist,
    and build.sh compiles the wheel with the prefix's own CPython 3.13 —
    no third-party prebuilt binary enters the bundle.

# From-source sdist, sha256 as published by PyPI for this exact version.
source:
  type: tarball
  url: https://files.pythonhosted.org/packages/cc/c3/928b290c2c0ca99ab96eea5b4ff8f30be8112b075301a7d3ba214a3c8c12/redis-8.0.1.tar.gz
  sha256: "afc5a7a2f5a084f5b1880dec548dd45be17db7e43c82a30d84f952aefb05cfb0"
  strip_components: 1

python:
  interpreter: python313
  abi: cp313

patches: []

depends:
  build:
    - name: python313
    # PEP-517 build backend, from this sdist's [build-system] requires.
    # --no-build-isolation means pip will NOT fetch it, so it has to be
    # in the build prefix already (build.sh bridges it onto sys.path).
    - name: hatchling-cp313
    - name: packaging-cp313
    - name: pathspec-cp313
    - name: pluggy-cp313
    - name: trove-classifiers-cp313
    - name: calver-cp313
  runtime:
    - name: python313
  host_tools:
    - python313

build:
  build_type_independent: true
  matrix:
    - platform: any
      script: build.sh
    - platform: windows
      script: build.ps1

package:
  files:
    - { glob: "lib/python3.13/site-packages/redis/", platforms: [any] }
    - { glob: "lib/python3.13/site-packages/*.dist-info/", platforms: [any] }
    - { glob: "Lib/site-packages/redis/", platforms: [windows] }
    - { glob: "Lib/site-packages/*.dist-info/", platforms: [windows] }
