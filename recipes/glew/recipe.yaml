schema_version: 1
recipe:
  name: glew
  upstream_version: "2.2.0"
  # cvc.2: linux builds against cvcpkg's libglvnd and libx11 instead of the
  # build host's GL and X11 (linux/arm64 runners have neither).
  cvc_revision: 2
  maintainer: "cvcpkg group"
  maintainer_email: "info@cvcpkg.org"
  maintainer_url: "https://cvcpkg.org"
  homepage: https://glew.sourceforge.net/
  license: BSD-3-Clause
  tags: [libraries, graphics]
  description: >-
    GLEW — the OpenGL Extension Wrangler library.  Cross-platform runtime
    OpenGL extension loading.  Required by VolumeRover 2.0 and other
    GL-based visualization applications.

source:
  type: tarball
  url: https://github.com/nigels-com/glew/releases/download/glew-2.2.0/glew-2.2.0.tgz
  sha256: "d4fc82893cfb00109578d0a1a2337fb8ca335b3ceccf97b97e5cc7f08e4353e1"
  strip_components: 1

patches: []

depends:
  build:
    - cmake
    - ninja
  runtime:
    # Linux: GL/GLX headers and libOpenGL/libGLX from cvcpkg's libglvnd, and
    # Xlib (GL/glxew.h includes <X11/Xlib.h>) from libx11.  The build used the
    # build host's, and linux/arm64 runners have none ("Could NOT find OpenGL").
    - name: libglvnd
      platforms: [linux]
    - name: libx11
      platforms: [linux]
  host_tools: []

build:
  matrix:
    - platform: linux
      script: build.sh
      env:
        CFLAGS: "-O2 -fPIC"
    - platform: macos
      script: build.sh
      env:
        MACOSX_DEPLOYMENT_TARGET: "13.0"
    - platform: windows
      script: build.ps1
    - platform: freebsd
      script: build.sh
      env:
        CFLAGS: "-O2 -fPIC"
    - platform: openbsd
      script: build.sh
      env:
        CFLAGS: "-O2 -fPIC"
    - platform: netbsd
      script: build.sh
      env:
        CFLAGS: "-O2 -fPIC"

package:
  files:
    - lib/libGLEW*
    - lib/GLEW*
    # The Windows names (glew32.dll / glew32.lib); other platforms have none.
    - { glob: "lib/glew32*", platforms: [windows] }
    - { glob: "bin/glew32*", platforms: [windows] }
    - lib/cmake/glew/
    - lib/pkgconfig/glew.pc
    - include/GL/glew.h
    - include/GL/glxew.h
    - include/GL/wglew.h
  cmake_packages:
    - name: glew
      targets: ["GLEW::GLEW", "GLEW::glew"]
