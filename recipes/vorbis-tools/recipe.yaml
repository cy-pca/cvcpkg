schema_version: 1
recipe:
  name: vorbis-tools
  upstream_version: "1.4.2"
  # cvc.2: Windows builds with MSYS path conversion on.  MSYS_NO_PATHCONV=1 made
  # libtool's `cmd //c echo` start an interactive cmd.exe that hung every libtool
  # link on the dev Windows builder (see build.ps1).  Other platforms unchanged.
  # cvc.3: Windows: deps exported to configure, --with-ogg/--with-vorbis,
  # -std=gnu17, and two patches (getopt.h vs MinGW's __argc macro; ogginfo's
  # missing utf8.h include).  Linux/BSD builds also get the two harmless patches.
  # cvc.4: Windows declares its MinGW toolchain (msys2/make/mingw-w64-gcc)
  # instead of using the builder's; see depends.build.
  # cvc.5: libpicture.a takes base64.o instead of nesting libbase64.a, which the
  # macOS x86_64 runner's ld64 rejected ("archive member 'libbase64.a' not a
  # mach-o file").  Patch applies on every platform; the build output is the same.
  cvc_revision: 5
  maintainer: "cvcpkg group"
  maintainer_email: "info@cvcpkg.org"
  maintainer_url: "https://cvcpkg.org"
  homepage: https://www.xiph.org/downloads/
  license: GPL-2.0-or-later
  tags: [tools, multimedia, audio]
  description: >-
    vorbis-tools — command-line tools for Ogg Vorbis audio:
    ogg123 (player), oggenc (encoder), oggdec (decoder),
    ogginfo, and vorbiscomment.  Requires libogg and libvorbis.

source:
  type: tarball
  url: https://downloads.xiph.org/releases/vorbis/vorbis-tools-1.4.2.tar.gz
  sha256: "db7774ec2bf2c939b139452183669be84fda5774d6400fc57fde37f77624f0b0"
  strip_components: 1

patches:
  - getopt-mingw-argc.patch
  - ogginfo-utf8-decl.patch
  - share-libpicture-no-nested-archive.patch

depends:
  build:
    # Windows: the MinGW toolchain is a declared build dep, staged into the BUILD
    # prefix (build.ps1 puts its bin first on PATH), not whatever MSYS2 the
    # builder has.  The prod builder cmps-a91453 has an incomplete one: lame
    # and libmp3lame died there with "configure: error: no acceptable ld found
    # in $PATH" while they built on sandipaws.  As recipes/gmp.
    - name: msys2
      platforms: [windows]
    - name: make
      platforms: [windows]
    - name: mingw-w64-gcc
      platforms: [windows]
    - name: libogg
    - name: libvorbis
    - pkg-config
  runtime:
    - name: libogg
    - name: libvorbis
  host_tools: []

build:
  matrix:
    - platform: linux
      script: build.sh
      env:
        CFLAGS: "-O2 -fPIC"
    - platform: macos
      script: build.sh
      env:
        MACOSX_DEPLOYMENT_TARGET: "13.0"
    - platform: freebsd
      script: build.sh
      env:
        CFLAGS: "-O2 -fPIC"
    - platform: openbsd
      script: build.sh
      env:
        CFLAGS: "-O2 -fPIC"
    - platform: netbsd
      script: build.sh
      env:
        CFLAGS: "-O2 -fPIC"
    - platform: windows
      script: build.ps1

package:
  files:
    # No ogg123: it needs libao, which is not a dependency, so configure skips it.
    - bin/oggdec*
    - bin/oggenc*
    - bin/ogginfo*
    - bin/vorbiscomment*
