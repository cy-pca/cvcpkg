schema_version: 1
recipe:
  name: gmp
  upstream_version: "6.3.0"
  # 10: the first windows bundle built from this recipe (MinGW-w64 gcc + MSYS2
  # autotools, all from cvcpkg; C library only). It replaces 6.3.0+cvc.1 for
  # windows, a repackaged vcpkg build. linux/macos/BSD builds are unchanged
  # from +cvc.9.
  # 11: portable x86_64. build.sh now configures --enable-fat on x86 hosts.
  # Through +cvc.10 the linux/macos/BSD x86_64 bundles carried the BUILDER's
  # CPU-specific mpn assembly (and, where CFLAGS was unset, -march=<cpu>), so
  # they raised SIGILL on CPUs older than the builder's (BMI2/ADX mulx/adcx on a
  # Sandy Bridge Xeon, 2026-10-14). test.sh now fails any x86 build that
  # records -march/-mtune in gmp.h or lacks the fat CPUID dispatcher. windows
  # (--disable-assembly) and wasm/wasi/cosmo (generic --host) were already
  # portable and are only rebuilt for revision coherence. Also --with-pic: the
  # static libgmp.a was non-PIC, so it could not link into PIE executables
  # (macOS ld: "Illegal text-relocations").
  cvc_revision: 12
  maintainer: "cvcpkg group"
  maintainer_email: "info@cvcpkg.org"
  maintainer_url: "https://cvcpkg.org"
  description: "GMP — the GNU Multiple Precision Arithmetic Library for arbitrary precision integer, rational, and floating-point arithmetic."
  homepage: https://gmplib.org/
  license: LGPL-3.0-or-later
  tags: [math, wasm, wasi]

source:
  type: tarball
  url: https://gmplib.org/download/gmp/gmp-6.3.0.tar.xz
  mirror: https://ftp.gnu.org/gnu/gmp/gmp-6.3.0.tar.xz
  sha256: "a3c2b80201b89e68616f4ad30bc66aee4927c3ce50e33929ca819d5c43538898"
  strip_components: 1

patches: []

depends:
  build:
    - make
    # Windows autotools build (Invoke-CvcMsysAutotoolsBuild in build.ps1) needs the
    # GNU toolchain in the BUILD closure. cvcpkg stages host_tools only when
    # CROSS-compiling (target != host), so a native Windows build gets nothing
    # from host_tools — these must be real build deps that build from source and
    # stage into the build prefix, where env-windows's $depsFlag puts them on
    # PATH. Scoped to windows: other platforms build from the shipped ./configure
    # with the system toolchain and must not pull the mingw cross-compiler.
    - name: m4
      platforms: [windows]
    - name: autoconf
      platforms: [windows]
    - name: automake
      platforms: [windows]
    - name: libtool
      platforms: [windows]
    - name: mingw-w64-gcc
      platforms: [windows]
    # The shell: the MSYS2 bootstrap (MSYS bash + coreutils). Declared rather
    # than inherited from an ambient C:\msys64, which on a GitHub-hosted image is
    # bare (no gcc, no make). It also rides in through m4/make/autoconf/..., but
    # build.ps1 drives it directly, so say so.
    - name: msys2
      platforms: [windows]
  runtime: []
  host_tools: []

build:
  matrix:
    - platform: linux
      script: build.sh
      env:
        CFLAGS: "-O2 -fPIC"
    - platform: macos
      script: build.sh
      env:
        MACOSX_DEPLOYMENT_TARGET: "13.0"
    - platform: freebsd
      script: build.sh
      env:
        CFLAGS: "-O2 -fPIC"
    - platform: openbsd
      script: build.sh
      env:
        CFLAGS: "-O2 -fPIC"
    - platform: netbsd
      script: build.sh
      env:
        CFLAGS: "-O2 -fPIC"
    - platform: haiku
      script: build.sh
      env:
        CFLAGS: "-O2 -fPIC"
    - platform: windows
      script: build.ps1
    - platform: wasm
      host_platform: linux
      script: build-wasm.sh
    - platform: wasm
      host_platform: windows
      script: build-wasm.ps1
    - platform: wasi
      host_platform: linux
      script: build-wasi.sh
    - platform: wasi
      host_platform: windows
      script: build-wasi.ps1
    - platform: cosmo
      host_platform: linux
      script: build-cosmo.sh

package:
  files:
    # windows: bin/libgmp-10.dll (shipped, as the whole install tree is),
    # lib/libgmp.dll.a + lib/gmp.lib (the same import library), gmp.pc, gmp.h.
    - lib/libgmp*
    - lib/gmp*
    - lib/pkgconfig/gmp*
    - include/gmp.h
    # gmpxx (C++) everywhere except windows, where build.ps1 builds the C
    # library only: a MinGW libgmpxx is libstdc++/Itanium-ABI C++ that MSVC
    # consumers cannot link (see build.ps1).
    - glob: include/gmpxx.h
      platforms: [linux, macos, freebsd, openbsd, netbsd, haiku, wasm, wasm-mt, wasi, cosmo]
  cmake_packages: []

test:
  script: test.sh

abi:
  cxx_std: 17
