schema_version: 1
recipe:
  name: idn2
  upstream_version: "2.3.7"
  # cvc.4: relocatable .pc/.cmake/bin/*-config.  The published cvc.3
  # kept build-machine paths (/tmp/cvcpkg-builder/...) in them, so pkg-config,
  # find_package or the -config script handed consumers dead -I/-L paths
  # (2026-10-13 scan of every published linux bundle).
  cvc_revision: 4
  maintainer: "cvcpkg group"
  maintainer_email: "info@cvcpkg.org"
  maintainer_url: "https://cvcpkg.org"
  description: "GNU libidn2 — Internationalized Domain Names (IDNA2008) conversion library."
  homepage: https://www.gnu.org/software/libidn/#libidn2
  license: LGPL-3.0-or-later OR GPL-2.0-or-later
  tags: [libraries, i18n, networking]

source:
  # Built from the source package idn2-src, which pins the upstream tarball
  # (https://ftp.gnu.org/gnu/libidn/libidn2-2.3.7.tar.gz).
  type: package
  package: idn2-src

patches: []

depends:
  build:
    - name: idn2-src
      version: "==2.3.7"
  runtime:
    - name: libunistring
      version: ">=1.0"
    - name: iconv
      version: ">=1.17"
      platforms: [freebsd, netbsd, openbsd, macos]
  host_tools: []

build:
  matrix:
    - platform: linux
      script: build.sh
      env:
        CFLAGS: "-O2 -fPIC"
    - platform: macos
      script: build.sh
      env:
        MACOSX_DEPLOYMENT_TARGET: "13.0"
    - platform: freebsd
      script: build.sh
      env:
        CFLAGS: "-O2 -fPIC"
    - platform: openbsd
      script: build.sh
      env:
        CFLAGS: "-O2 -fPIC"
    - platform: netbsd
      script: build.sh
      env:
        CFLAGS: "-O2 -fPIC"
    - platform: windows
      script: build.ps1
    - platform: wasm
      host_platform: linux
      script: build-wasm.sh
    - platform: wasi
      host_platform: linux
      script: build-wasi.sh

package:
  files:
    - lib/libidn2*
    - lib/pkgconfig/libidn2.pc
    - include/idn2.h
    - bin/idn2*
  cmake_packages: []

abi:
  cxx_std: 17
