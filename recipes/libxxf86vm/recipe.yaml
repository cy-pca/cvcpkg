schema_version: 1
recipe:
  name: libxxf86vm
  upstream_version: "1.1.7"
  cvc_revision: 1
  maintainer: "cvcpkg group"
  maintainer_email: "info@cvcpkg.org"
  maintainer_url: "https://cvcpkg.org"
  homepage: https://www.x.org/
  license: MIT
  tags: [libraries, x11, graphics]
  description: >-
    XFree86-VidMode extension client library (Xxf86vm).

source:
  type: tarball
  url: https://xorg.freedesktop.org/releases/individual/lib/libXxf86vm-1.1.7.tar.xz
  sha256: "ae50c0f669e0af5a67cc4cd0f54f21d64a64d2660af883e80e95d3fe51b945d8"
  strip_components: 1

patches: []

depends:
  build:
    - pkg-config
    - name: xorgproto
  runtime:
    - name: libx11
    - name: libxext
  host_tools: []

package:
  files:
    - lib/
    - include/
    - share/

build:
  matrix:
    # Linux only: added as a build dependency of the hermetic `mesa` recipe
    # (software-GL stack); not exercised on the BSDs.
    - platform: linux
      script: build.sh
