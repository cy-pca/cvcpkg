schema_version: 1
recipe:
  name: sqlmodel-cp312
  upstream_version: "0.0.39"
  cvc_revision: 1

  maintainer: "cvcpkg group"
  maintainer_email: "info@cvcpkg.org"
  maintainer_url: "https://cvcpkg.org"
  homepage: https://pypi.org/project/sqlmodel/
  license: "MIT"
  tags: [python, source]
  description: >-
    sqlmodel 0.0.39 for CPython 3.12 — the cp312 column of
    cvcpkg's per-interpreter matrix (pure-Python, built from the PyPI sdist);
    generated by tools/gen_python_recipes.py.
    Built FROM SOURCE: cvcpkg fetches and sha256-verifies the PyPI sdist,
    and build.sh compiles the wheel with the prefix's own CPython 3.12 —
    no third-party prebuilt binary enters the bundle.

# From-source sdist, sha256 as published by PyPI for this exact version.
source:
  # Built from the source package sqlmodel-src, which pins the upstream tarball
  # (https://files.pythonhosted.org/packages/68/ee/22a0559283c3cf6048678e787ed5d4959dcd00dedd8ba4567eeae684eeb1/sqlmodel-0.0.39.tar.gz).
  type: package
  package: sqlmodel-src

python:
  interpreter: python312
  abi: cp312

patches: []

depends:
  build:
    - name: sqlmodel-src
      version: "==0.0.39"
    - name: python312
    - name: pydantic-cp312
    - name: sqlalchemy-cp312
    - name: typing-extensions-cp312
    # PEP-517 build backend, from this sdist's [build-system] requires.
    # --no-build-isolation means pip will NOT fetch it, so it has to be
    # in the build prefix already (build.sh bridges it onto sys.path).
    - name: pdm-backend-cp312
  runtime:
    - name: python312
    - name: pydantic-cp312
    - name: sqlalchemy-cp312
    - name: typing-extensions-cp312
  host_tools:
    - python312

build:
  build_type_independent: true
  matrix:
    - platform: any
      script: build.sh
    - platform: windows
      script: build.ps1

package:
  files:
    - { glob: "lib/python3.12/site-packages/sqlmodel/", platforms: [any] }
    - { glob: "lib/python3.12/site-packages/*.dist-info/", platforms: [any] }
    - { glob: "Lib/site-packages/sqlmodel/", platforms: [windows] }
    - { glob: "Lib/site-packages/*.dist-info/", platforms: [windows] }
