schema_version: 1
recipe:
  name: alsa-lib
  upstream_version: "1.2.16"
  # cvc.2: make libasound's config directory relocatable. The cvc.1 build baked
  # the ephemeral sandbox --prefix (/tmp/cvcpkg-builder/.../install/share/alsa)
  # into libasound as the compiled-in ALSA_CONFIG_DIR, so once cvcpkg relocated
  # the package to a consumer prefix that path was dead and any program opening
  # ALSA failed with "Cannot access file .../share/alsa/alsa.conf" (it blocked
  # real audio playback in the Ariadne conference app on Linux). The
  # relocatable-config-dir.patch resolves the config tree relative to the loaded
  # libasound.so via dladdr (<origin>/../share/alsa), mirroring upstream's own
  # dlmisc.c plugin-dir logic, so it "just works" wherever the prefix lands.
  # cvc.3: the plugin and UCM directories were still the dead sandbox paths.
  # The bundled alsa.conf loads the system's /etc/alsa/conf.d, which routes
  # the default PCM to the distribution's pipewire/pulse plugins by type name,
  # and libasound then looked for libasound_module_pcm_pipewire.so under
  # /tmp/cvcpkg-.../install/lib/alsa-lib: "Cannot open shared library", and
  # opening "default" failed (SDL3's ALSA backend printed it and got no
  # device). relocatable-plugin-and-ucm-dirs.patch falls back to the
  # distribution's plugin directory (/usr/lib/<multiarch>/alsa-lib,
  # /usr/lib64/alsa-lib, /usr/lib/alsa-lib) and resolves the UCM directories
  # from snd_config_topdir(), then the system's /usr/share/alsa/ucm2.
  cvc_revision: 3
  maintainer: "cvcpkg group"
  maintainer_email: "info@cvcpkg.org"
  maintainer_url: "https://cvcpkg.org"
  homepage: https://www.alsa-project.org/
  license: LGPL-2.1-or-later
  tags: [libraries, audio, linux]
  description: >-
    ALSA (Advanced Linux Sound Architecture) userspace library (libasound).
    The base Linux audio backend: PCM, mixer, sequencer, control and UCM
    APIs used by higher-level audio libraries (openal-soft, sdl3, portaudio,
    jack, allegro5). Linux only — ALSA is a Linux kernel API.

source:
  # Built from the source package alsa-lib-src, which pins the upstream tarball
  # (https://www.alsa-project.org/files/pub/lib/alsa-lib-1.2.16.tar.bz2).
  type: package
  package: alsa-lib-src

patches:
  - relocatable-config-dir.patch
  - relocatable-plugin-and-ucm-dirs.patch

depends:
  build:
    - name: alsa-lib-src
      version: "==1.2.16"
    - pkg-config
  runtime: []
  host_tools: []

package:
  files:
    - lib/libasound*
    - lib/pkgconfig/alsa.pc
    - include/alsa/
    - include/asoundlib.h
    - include/sys/asoundlib.h
    - share/alsa/
  pkg_config: [alsa]

build:
  matrix:
    - platform: linux
      script: build.sh

notes:
  - title: "Relocatable ALSA config directory"
    description: >-
      libasound finds its configuration tree (alsa.conf and the files it
      includes) relative to the installed library's own location: at runtime
      <prefix>/lib/libasound.so.2 resolves the config dir to
      <prefix>/share/alsa via dladdr, so the package works wherever cvcpkg
      unpacks it. Setting the ALSA_CONFIG_DIR environment variable still
      overrides this. The bundled alsa.conf loads the system's
      /etc/alsa/conf.d, so the distribution's default-device setup (PipeWire,
      PulseAudio) applies.
  - title: "ALSA plugins and UCM profiles come from the system"
    description: >-
      The package ships no plugin modules and no UCM profiles. libasound
      loads plugins from $ALSA_PLUGIN_DIR, then <prefix>/lib/alsa-lib, then
      the distribution's plugin directory (/usr/lib/<multiarch>/alsa-lib,
      /usr/lib64/alsa-lib or /usr/lib/alsa-lib), so the pipewire and pulse
      PCMs named by /etc/alsa/conf.d work. UCM profiles come from
      $ALSA_CONFIG_UCM2, then <config dir>/ucm2, then /usr/share/alsa/ucm2.
