schema_version: 1
recipe:
  name: zstandard-cp312
  upstream_version: "0.25.0"
  cvc_revision: 1

  maintainer: "cvcpkg group"
  maintainer_email: "info@cvcpkg.org"
  maintainer_url: "https://cvcpkg.org"
  homepage: https://pypi.org/project/zstandard/
  license: "BSD-3-Clause AND (BSD-3-Clause OR GPL-2.0-only)"
  tags: [python, source]
  description: >-
    zstandard 0.25.0 for CPython 3.12 — the cp312 column of
    cvcpkg's per-interpreter matrix (C extensions compiled for cp312 from the PyPI sdist);
    generated by tools/gen_python_recipes.py.
    Built FROM SOURCE: cvcpkg fetches and sha256-verifies the PyPI sdist,
    and build.sh compiles the wheel with the prefix's own CPython 3.12 —
    no third-party prebuilt binary enters the bundle.

# From-source sdist, sha256 as published by PyPI for this exact version.
source:
  # Built from the source package zstandard-src, which pins the upstream tarball
  # (https://files.pythonhosted.org/packages/fd/aa/3e0508d5a5dd96529cdc5a97011299056e14c6505b678fd58938792794b1/zstandard-0.25.0.tar.gz).
  type: package
  package: zstandard-src

python:
  interpreter: python312
  abi: cp312

patches: []

depends:
  build:
    - name: zstandard-src
      version: "==0.25.0"
    - name: python312
    # PEP-517 build backend, from this sdist's [build-system] requires.
    # --no-build-isolation means pip will NOT fetch it, so it has to be
    # in the build prefix already (build.sh bridges it onto sys.path).
    - name: cffi-cp312
    - name: packaging-cp312
    - name: setuptools-cp312
    - name: pycparser-cp312
  runtime:
    - name: python312
  host_tools:
    - python312

build:
  build_type_independent: true
  matrix:
    - platform: linux
      script: build.sh
    - platform: macos
      script: build.sh
    - platform: windows
      script: build.ps1

package:
  files:
    - { glob: "lib/python3.12/site-packages/zstandard/", platforms: [linux, macos] }
    - { glob: "lib/python3.12/site-packages/zstandard-*.dist-info/", platforms: [linux, macos] }
    - { glob: "Lib/site-packages/zstandard/", platforms: [windows] }
    - { glob: "Lib/site-packages/zstandard-*.dist-info/", platforms: [windows] }
