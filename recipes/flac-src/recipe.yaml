schema_version: 1
recipe:
  name: flac-src
  upstream_version: "1.5.0"
  cvc_revision: 1
  maintainer: cvcpkg group
  maintainer_email: info@cvcpkg.org
  maintainer_url: https://cvcpkg.org
  homepage: https://xiph.org/flac/
  license: BSD-3-Clause
  tags: [source]
  description: >-
    The unmodified upstream source of flac 1.5.0: its release tarball,
    verified against the sha256 below and staged at src/flac-src/.  The flac
    recipe builds from it (source.type package), so the tarball is fetched
    once, from downloads.xiph.org, and every other build of flac -- another
    platform, a builder that cannot reach downloads.xiph.org, a user building from
    source -- installs this package from the catalog instead.  Generated by
    tools/make_source_package.py.

source:
  type: tarball
  url: https://downloads.xiph.org/releases/flac/flac-1.5.0.tar.xz
  sha256: "f2c1c76592a82ffff8413ba3c4a1299b6c7ab06c734dee03fd88630485c2b920"
  strip_components: 1

patches: []

depends:
  build: []
  runtime: []
  host_tools: []

build:
  build_type_independent: true
  matrix:
    - platform: any
      script: build.sh

package:
  files:
    - src/flac-src/
