schema_version: 1
recipe:
  name: nettle
  upstream_version: "3.10.1"
  cvc_revision: 1
  maintainer: "cvcpkg group"
  maintainer_email: "info@cvcpkg.org"
  maintainer_url: "https://cvcpkg.org"
  homepage: https://www.lysator.liu.se/~nisse/nettle/
  # Nettle is dual-licensed; a consumer may take it under either.
  license: "LGPL-3.0-or-later OR GPL-2.0-or-later"
  tags: [crypto]
  description: >-
    GNU Nettle — a low-level cryptographic library.  Provides libnettle
    (symmetric ciphers, hashes) and libhogweed (public-key crypto, which
    links gmp).  Added as the crypto backend for GnuTLS, used by the LGPL
    `ffmpeg-lgpl` build for HTTPS on Linux/BSD.  Built with
    --disable-assembler for portable C across the Unix targets (the perf hit
    is irrelevant for TLS control traffic).

source:
  type: tarball
  url: https://ftp.gnu.org/gnu/nettle/nettle-3.10.1.tar.gz
  sha256: "b0fcdd7fc0cdea6e80dcf1dd85ba794af0d5b4a57e26397eee3bc193272d9132"
  strip_components: 1

patches: []

depends:
  build:
    - make
    - m4
    - name: gmp
      version: ">=6.1.0"
  runtime:
    - name: gmp
      version: ">=6.1.0"
  host_tools: []

build:
  matrix:
    - platform: linux
      script: build.sh
      env:
        CFLAGS: "-O2 -fPIC"
    - platform: freebsd
      script: build.sh
      env:
        CFLAGS: "-O2 -fPIC"
    - platform: openbsd
      script: build.sh
      env:
        CFLAGS: "-O2 -fPIC"
    - platform: netbsd
      script: build.sh
      env:
        CFLAGS: "-O2 -fPIC"

package:
  files:
    - lib/libnettle*
    - lib/libhogweed*
    - lib/pkgconfig/nettle.pc
    - lib/pkgconfig/hogweed.pc
    - include/nettle/
  pkg_config:
    - nettle
    - hogweed

abi:
  cxx_std: 17
