schema_version: 1
recipe:
  name: httptools-cp313
  upstream_version: "0.8.0"
  cvc_revision: 1

  maintainer: "cvcpkg group"
  maintainer_email: "info@cvcpkg.org"
  maintainer_url: "https://cvcpkg.org"
  homepage: https://pypi.org/project/httptools/
  license: "MIT"
  tags: [python, source]
  description: >-
    httptools 0.8.0 for CPython 3.13 — the cp313 column of
    cvcpkg's per-interpreter matrix (C extensions compiled for cp313 from the PyPI sdist);
    generated by tools/gen_python_recipes.py.
    Built FROM SOURCE: cvcpkg fetches and sha256-verifies the PyPI sdist,
    and build.sh compiles the wheel with the prefix's own CPython 3.13 —
    no third-party prebuilt binary enters the bundle.

# From-source sdist, sha256 as published by PyPI for this exact version.
source:
  # Built from the source package httptools-src, which pins the upstream tarball
  # (https://files.pythonhosted.org/packages/43/e5/d471fcb0e14523fe1c3f4ba58ca52480e7bd70ad7109a3846bc75892f7fb/httptools-0.8.0.tar.gz).
  type: package
  package: httptools-src

python:
  interpreter: python313
  abi: cp313

patches: []

depends:
  build:
    - name: httptools-src
      version: "==0.8.0"
    - name: python313
    # PEP-517 build backend, from this sdist's [build-system] requires.
    # --no-build-isolation means pip will NOT fetch it, so it has to be
    # in the build prefix already (build.sh bridges it onto sys.path).
    - name: setuptools-cp313
  runtime:
    - name: python313
  host_tools:
    - python313

build:
  build_type_independent: true
  matrix:
    - platform: linux
      script: build.sh
    - platform: macos
      script: build.sh
    - platform: windows
      script: build.ps1

package:
  files:
    - { glob: "lib/python3.13/site-packages/httptools/", platforms: [linux, macos] }
    - { glob: "lib/python3.13/site-packages/*.dist-info/", platforms: [linux, macos] }
    - { glob: "Lib/site-packages/httptools/", platforms: [windows] }
    - { glob: "Lib/site-packages/*.dist-info/", platforms: [windows] }
