  upstream_version: "1.3.6"
  cvc_revision: 1
  maintainer: cvcpkg group
  maintainer_email: info@cvcpkg.org
  maintainer_url: https://cvcpkg.org
  homepage: https://www.xiph.org/ogg/
  license: BSD-3-Clause
  tags: [source]
  description: >-
    The unmodified upstream source of libogg 1.3.6: its release tarball,
    verified against the sha256 below and staged at src/libogg-src/.  The libogg
    recipe builds from it (source.type package), so the tarball is fetched
    once, from ftp.osuosl.org, and every other build of libogg -- another
    platform, a builder that cannot reach ftp.osuosl.org, a user building from
    source -- installs this package from the catalog instead.  Generated by
    tools/make_source_package.py.

source:
