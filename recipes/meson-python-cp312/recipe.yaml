schema_version: 1
recipe:
  name: meson-python-cp312
  upstream_version: "0.18.0"
  cvc_revision: 2

  maintainer: "cvcpkg group"
  maintainer_email: "info@cvcpkg.org"
  maintainer_url: "https://cvcpkg.org"
  homepage: https://pypi.org/project/meson-python/
  license: "MIT"
  tags: [python, source]
  description: >-
    meson-python 0.18.0 for CPython 3.12 — the cp312 column of
    cvcpkg's per-interpreter matrix (pure-Python, built from the PyPI sdist);
    generated by tools/gen_python_recipes.py.
    Built FROM SOURCE: cvcpkg fetches and sha256-verifies the PyPI sdist,
    and build.sh compiles the wheel with the prefix's own CPython 3.12 —
    no third-party prebuilt binary enters the bundle.

# From-source sdist, sha256 as published by PyPI for this exact version.
source:
  # Built from the source package meson-python-src, which pins the upstream tarball
  # (https://files.pythonhosted.org/packages/26/bd/fdb26366443620f1a8a4d4ec7bfa37d1fbbe7bf737b257c205bbcf95ba95/meson_python-0.18.0.tar.gz).
  type: package
  package: meson-python-src

python:
  interpreter: python312
  abi: cp312

patches: []

depends:
  build:
    - name: meson-python-src
      version: "==0.18.0"
    - name: python312
    - name: packaging-cp312
    - name: pyproject-metadata-cp312
    # PEP-517 build backend, from this sdist's [build-system] requires.
    # --no-build-isolation means pip will NOT fetch it, so it has to be
    # in the build prefix already (build.sh bridges it onto sys.path).
    - name: meson
  runtime:
    - name: python312
    - name: packaging-cp312
    - name: pyproject-metadata-cp312
  host_tools:
    - python312

build:
  build_type_independent: true
  matrix:
    - platform: any
      script: build.sh
    - platform: windows
      script: build.ps1

package:
  files:
    - { glob: "lib/python3.12/site-packages/mesonpy/", platforms: [any] }
    - { glob: "lib/python3.12/site-packages/meson_python-*.dist-info/", platforms: [any] }
    - { glob: "Lib/site-packages/mesonpy/", platforms: [windows] }
    - { glob: "Lib/site-packages/*.dist-info/", platforms: [windows] }
