schema_version: 1
recipe:
  name: python313
  upstream_version: "3.13.3"
  # Bumped 1 -> 2: extension-module RPATH fix (shared _common/build-python.sh) so
  # lib-dynload/*.so (incl. _ssl/_hashlib) find the prefix lib/ instead of the
  # system libs — a standalone interpreter's `import ssl` was failing. ABI-identical.
  # Bumped 2 -> 3: rebuild on the glibc-2.35 fleet.  The +cvc.2 artifact was
  # published from a manual off-fleet build (glibc 2.38) and would not run on the
  # fleet builders or on users with glibc < 2.38 (every python build failed at
  # `import` with "GLIBC_2.38 not found").  Content-identical to +cvc.2; only the
  # build host's glibc baseline differs.
  # Bumped 3 -> 4: scoped the readline/ncurses dependency edges to the Unix
  # platforms that actually consume them. build-python.sh passes
  # --with-readline=tkinter on every cross target (its own comment: "readline/
  # ncurses not available on wasm/wasi/cosmo") and the Windows build runs
  # PCbuild/build.bat, which links neither. Both were previously unscoped, so
  # this recipe advertised windows/wasm/wasi/cosmo while depending on packages
  # with no build there — claims that could never resolve.
  # Bumped 4 -> 5: scoped the libffi edge away from wasi. libffi's wasm
  # backend builds its call trampolines with EM_JS — it synthesises JavaScript
  # and patches the wasm table at runtime — so it needs an Emscripten JS engine
  # and cannot work on wasip1. CPython upstream ships its own WASI build without
  # _ctypes for the same reason. wasm keeps the dependency.
  # cvc.7: rebuild with no Homebrew.  The published macOS x86_64 cvc.6 bundle was built
  # before macOS CI moved Homebrew aside (#182): bin/python3.13, libpython3.13.dylib,
  # _dbm, _gdbm and _decimal load gettext's libintl, gdbm and mpdecimal from
  # /usr/local/opt, so it aborts on any Mac without Homebrew.  _common/build-python.sh
  # now also turns those off on macOS explicitly.  Every platform rebuilds.
  # windows (2026-10-14, same revision: no windows bundle existed at any): the
  # libffi edge is scoped off windows as python311's is (CPython fetches its own
  # via get_externals), and build.ps1 takes python311's lean-PATH + vcvars64 steps
  # and --no-tkinter; PC/layout gets --preset-default (venv, ensurepip) as in
  # python311. Other platforms are unchanged.
  # cvc.8: republish NetBSD -- its NetBSD cvc.6/cvc.7 bundles (dev registry) were packed by cvcpkg 2.5.0,
  # whose library pass grew lib-dynload's RPATHs with patchelf -- a third PT_LOAD
  # NetBSD's ld.elf_so refuses ("math.cpython-313.so: wrong number of segments
  # (3 != 2)").  Rebuilt with 2.5.1 and _common/build-python.sh's NetBSD fixes
  # (no pkgsrc in sysconfig; RPATH room in LDFLAGS_NODIST), as python312 cvc.17.
  # cvc.9: Windows builds from cvcpkg's libraries and downloads nothing.
  # PCbuild\build.bat -e ran CPython's get_externals.bat, which fetched bzip2,
  # sqlite, xz and zlib sources and a PREBUILT libffi and OpenSSL from GitHub
  # mid-build, while the openssl/zlib/bzip2/xz/sqlite deps declared here went
  # unused.  _common/build-python.ps1 (shared by python311/312/313/313t) runs
  # pcbuild.proj directly against the deps, libffi included (its edge now
  # covers windows), and ships the DLLs the modules import in DLLs\.  No
  # Python goes into the build: 3.13's tarball ships what PCbuild's code
  # generators make, and python311/312 run theirs with this python313.  Other
  # platforms rebuild unchanged.
  cvc_revision: 9
  maintainer: "cvcpkg group"
  maintainer_email: "info@cvcpkg.org"
  maintainer_url: "https://cvcpkg.org"
  homepage: https://www.python.org/
  license: PSF-2.0
  tags: [language, runtime, scripting]
  description: >-
    CPython 3.13 — the reference Python implementation.  Ships libpython3.13,
    the python3.13 interpreter, and the full standard library including ssl,
    sqlite3, ctypes, bz2, lzma, readline, and curses modules.
    Latest stable release with the new free-threaded (no-GIL) build option.

source:
  # Built from the source package python313-src, which pins the upstream tarball
  # (https://www.python.org/ftp/python/3.13.3/Python-3.13.3.tar.xz).
  type: package
  package: python313-src

patches: []

depends:
  build:
    - name: python313-src
      version: "==3.13.3"
    - name: patchelf
      platforms: [linux, freebsd, openbsd, netbsd]
    - name: openssl
      version: "^3.0"
    - name: zlib
      version: "^1.3"
    - name: libffi
      version: "^3.0"
      platforms: [linux, macos, windows, freebsd, openbsd, netbsd, wasm, cosmo]
    - name: bzip2
      version: "^1.0"
    - name: xz
      version: "^5.0"
    - name: readline
      version: "^8.0"
      platforms: [linux, macos, freebsd, openbsd, netbsd]
    - name: sqlite
      version: "^3.0"
    - name: ncurses
      version: "^6.0"
      platforms: [linux, macos, freebsd, openbsd, netbsd]
  runtime:
    - name: openssl
      version: "^3.0"
    - name: zlib
      version: "^1.3"
    - name: libffi
      version: "^3.0"
      platforms: [linux, macos, windows, freebsd, openbsd, netbsd, wasm, cosmo]
    - name: bzip2
      version: "^1.0"
    - name: xz
      version: "^5.0"
    - name: readline
      version: "^8.0"
      platforms: [linux, macos, freebsd, openbsd, netbsd]
    - name: sqlite
      version: "^3.0"
    - name: ncurses
      version: "^6.0"
      platforms: [linux, macos, freebsd, openbsd, netbsd]
  host_tools: []

build:
  matrix:
    - platform: linux
      script: build.sh
      env:
        CFLAGS: "-O2 -fPIC"
    - platform: macos
      script: build.sh
      env:
        MACOSX_DEPLOYMENT_TARGET: "13.0"
    - platform: freebsd
      script: build.sh
      env:
        CFLAGS: "-O2 -fPIC"
    - platform: openbsd
      script: build.sh
      env:
        CFLAGS: "-O2 -fPIC"
    - platform: netbsd
      script: build.sh
      env:
        CFLAGS: "-O2 -fPIC"
    - platform: windows
      script: build.ps1
    - platform: wasm
      host_platform: linux
      script: build-wasm.sh
      env:
        CFLAGS: "-O2"
    - platform: wasm
      host_platform: macos
      script: build-wasm.sh
      env:
        MACOSX_DEPLOYMENT_TARGET: "13.0"
    - platform: wasi
      host_platform: linux
      script: build-wasi.sh
      env:
        CFLAGS: "-O2"
    - platform: cosmo
      host_platform: linux
      script: build-cosmo.sh
      env:
        CFLAGS: "-O2"

package:
  files:
    - { glob: "bin/python3.13*", platforms: [cosmo, freebsd, linux, macos, netbsd, openbsd, wasi, wasm] }
    - { glob: "bin/pip3.13*", platforms: [cosmo, freebsd, linux, macos, netbsd, openbsd, wasi, wasm] }
    - { glob: "bin/idle3.13*", platforms: [cosmo, freebsd, linux, macos, netbsd, openbsd, wasi, wasm] }
    - { glob: "bin/pydoc3.13*", platforms: [cosmo, freebsd, linux, macos, netbsd, openbsd, wasi, wasm] }
    - { glob: "lib/libpython3.13*", platforms: [cosmo, freebsd, linux, macos, netbsd, openbsd, wasi, wasm] }
    - { glob: "lib/python3.13/", platforms: [cosmo, freebsd, linux, macos, netbsd, openbsd, wasi, wasm] }
    - { glob: "lib/pkgconfig/python-3.13*.pc", platforms: [cosmo, freebsd, linux, macos, netbsd, openbsd, wasi, wasm] }
    - { glob: "include/python3.13/", platforms: [cosmo, freebsd, linux, macos, netbsd, openbsd, wasi, wasm] }
    # Windows layout (PCbuild). CPython on Windows installs a flat tree — the
    # interpreter, the DLLs and the MSVC runtime at the ROOT, headers directly
    # under include/ (no python3.13/ level), the stdlib in Lib/, extension
    # modules in DLLs/ and import libs in libs/. None of the POSIX globs above
    # match any of it, so without these the windows build packages ZERO files
    # and `cvcpkg install python313` reports success with 0 components. Same
    # omission that was fixed in recipes/python312.
    - { glob: "python.exe", platforms: [windows] }
    - { glob: "pythonw.exe", platforms: [windows] }
    - { glob: "python313.dll", platforms: [windows] }
    # The limited-API forwarder, staged by PC\layout --include-stable. Every
    # abi3 extension module names python3.dll in its import table, so without
    # this the prefix cannot load a single stable-ABI wheel.
    - { glob: "python3.dll", platforms: [windows] }
    - { glob: "vcruntime140*.dll", platforms: [windows] }
    - { glob: "DLLs/", platforms: [windows] }
    - { glob: "Lib/", platforms: [windows] }
    - { glob: "libs/", platforms: [windows] }
    - { glob: "include/", platforms: [windows] }
  cmake_packages:
    - { name: Python3, targets: ["Python3::Python", "Python3::Interpreter"] }

abi:
  cxx_std: 17

notes:
  - title: "Multiple Python versions coexist"
    platforms:
      [linux, macos, freebsd, openbsd, netbsd, windows, wasm, wasi, cosmo]
    description: >-
      python311, python312, and python313 install to versioned paths
      (bin/python3.13, lib/python3.13/, libpython3.13.so) and can be
      installed into the same prefix simultaneously without conflict.
  - title: "Free-threaded build (no-GIL)"
    platforms: [linux, macos, freebsd]
    description: >-
      3.13 supports an experimental free-threaded build via
      --disable-gil.  This recipe builds the standard GIL-enabled
      interpreter.  A separate python313t recipe can target the
      free-threaded variant when it matures.
  - title: "Static builds on wasm/wasi/cosmo"
    platforms: [wasm, wasi, cosmo]
    description: >-
      Cross-compilation targets build libpython as a static archive
      (--disable-shared) since extension modules (.so) are uncommon.
      Readline is disabled (--with-readline=tkinter) because the
      ncurses/readline ecosystem is not available on these platforms.

conflicts:
  - python313t
