schema_version: 1

recipe:
  name: pillow-cp311
  upstream_version: "12.3.0"
  # 12.3.0 is a new upstream version, so the revision restarts at 1.
  # Prebuilt since 11.1.0+cvc.3: source.type tarball (hand-crafted from-source
  # build linking cvcpkg's own zlib/libjpeg-turbo/tiff/freetype/libwebp) ->
  # python_wheel (pinned prebuilt PyPI wheels). The from-source build cannot produce a
  # Windows column (the codec libraries + their discovery are not wired for
  # windows-2022), so matplotlib-cp311's Windows closure was unbuildable. The
  # official PyPI manylinux/win_amd64 wheels are auditwheel-vendored: every
  # codec (zlib/jpeg/tiff/freetype/webp) is bundled in pillow.libs/, so codec
  # support is guaranteed (the build.sh check asserts PNG + JPEG) without the
  # per-feature hermetic link. Trades the from-source model for prebuilt wheels
  # on this dep, like torch-cp311 + contourpy-cp311.
  cvc_revision: 1
  maintainer: "cvcpkg group"
  maintainer_email: "info@cvcpkg.org"
  maintainer_url: "https://cvcpkg.org"
  homepage: https://pypi.org/project/pillow/
  license: "MIT-CMU"
  tags: [python, wheel, imaging]
  description: >-
    Pillow 12.3.0 for CPython 3.11 (cp311): the pinned prebuilt PyPI wheels
    (manylinux_2_27/2_28 x86_64 and aarch64, win_amd64, macOS arm64 and x86_64),
    sha256-verified and
    installed into the
    python311 interpreter's site-packages. The wheels are auditwheel-vendored,
    so every codec the grl-snam imaging path needs (zlib/jpeg/tiff/freetype/webp)
    ships in pillow.libs/; the build check asserts PNG + JPEG support. Switched
    off the from-source build so the Windows column publishes. Prebuilt-wheel
    model, like torch-cp311.

source:
  type: python_wheel
  artifacts:
    linux-x86_64:
      url: https://files.pythonhosted.org/packages/3b/2d/ede717bc1144f63886c21fd349bb95860b0d1a21149ff16f2bb362b612b6/pillow-12.3.0-cp311-cp311-manylinux_2_27_x86_64.manylinux_2_28_x86_64.whl
      sha256: "23d27a3e0307ec2244cc51e7287b919aa68d097504ebe19df4e76a98a3eea5bd"
    windows-x86_64:
      url: https://files.pythonhosted.org/packages/63/c6/4bad1b18d132a50b27e1365e1ab163616f7a5bb56d330f66f9d1d9d4f9d4/pillow-12.3.0-cp311-cp311-win_amd64.whl
      sha256: "8e95e1385e4998ae9694eeaa4730ba5457ff61185b3a55e2e7bea0880aef452a"
    macos-arm64:
      url: https://files.pythonhosted.org/packages/b2/5b/a02d30018abd97ced9f5a6c63d28597694a00d066516b9c1c6de45859fc9/pillow-12.3.0-cp311-cp311-macosx_11_0_arm64.whl
      sha256: "37d6d0a00072fd2948eb22bce7e1475f34569d90c87c59f7a2ec59541b77f7a6"
    # linux-arm64 and macos-x86_64: without them pack-all skipped this recipe
    # there, yet weasyprint-cp311 (and the other cp311 consumers) still built
    # and failed their import check ("No module named 'PIL'").
    linux-arm64:
      url: https://files.pythonhosted.org/packages/c8/98/766667a4be768150a202836acd9fad19c06824ca86c4286d3cf6b274964e/pillow-12.3.0-cp311-cp311-manylinux_2_27_aarch64.manylinux_2_28_aarch64.whl
      sha256: "bcb46e2f9feff8d06323983bd83ed00c201fdcab3d74973e7072a889b3979fcd"
    macos-x86_64:
      url: https://files.pythonhosted.org/packages/fb/c8/0a78b0e02d7ac54bc03e5321c9220da52f0c2ea83b21f7c40e7f3169c502/pillow-12.3.0-cp311-cp311-macosx_10_10_x86_64.whl
      sha256: "00808c5e14ef63ac5161091d242999076604ff74b883423a11e5d7bbb38bf756"

python:
  interpreter: python311
  abi: cp311
  # Pillow 12's Linux wheels are manylinux_2_27/2_28 (glibc >= 2.27); the
  # manylinux2014 (glibc 2.17) builds 11.1.0 shipped are gone upstream.
  manylinux_min: manylinux_2_27

patches: []

depends:
  build:
    - name: python311
    - name: zlib
  runtime:
    # The prebuilt wheel vendors jpeg/tiff/freetype/webp/png in pillow.libs/
    # (auditwheel), but Pillow 12's manylinux_2_28 wheel no longer vendors
    # zlib: PIL/_imaging*.so and the vendored freetype/png/tiff all NEED a
    # plain libz.so.1.  cvcpkg's zlib provides it, and the pack-time relocation
    # pass (patchelf, below) adds the $ORIGIN RUNPATH that reaches it — without
    # both, `cvcpkg pack` refuses the bundle because the loader would fall
    # through to the host's libz.
    - name: python311
    - name: zlib
  host_tools:
    - python311
    - patchelf

build:
  build_type_independent: true
  matrix:
    - platform: linux
      script: build.sh
    - platform: windows
      script: build.ps1
    - platform: macos
      script: build.sh

package:
  # Each layout is scoped to the platforms that produce it: the pack-time
  # declared-files check fails on an entry that matches nothing.  pillow.libs/
  # is the auditwheel (manylinux) vendor dir; the macOS wheel vendors its
  # dylibs inside PIL/.dylibs/ and the Windows wheel inside PIL/.
  files:
    - { glob: "lib/python3.11/site-packages/PIL/", platforms: [linux, macos] }
    - { glob: "lib/python3.11/site-packages/pillow.libs/", platforms: [linux] }
    - { glob: "lib/python3.11/site-packages/pillow-*.dist-info/", platforms: [linux, macos] }
    - { glob: "Lib/site-packages/PIL/", platforms: [windows] }
    - { glob: "Lib/site-packages/pillow-*.dist-info/", platforms: [windows] }
