schema_version: 1
recipe:
  name: pytest-asyncio-cp312
  upstream_version: "1.4.0"
  cvc_revision: 1

  maintainer: "cvcpkg group"
  maintainer_email: "info@cvcpkg.org"
  maintainer_url: "https://cvcpkg.org"
  homepage: https://pypi.org/project/pytest-asyncio/
  license: "Apache-2.0"
  tags: [python, source]
  description: >-
    pytest-asyncio 1.4.0 for CPython 3.12 — the cp312 column of
    cvcpkg's per-interpreter matrix (pure-Python, built from the PyPI sdist);
    generated by tools/gen_python_recipes.py.
    Built FROM SOURCE: cvcpkg fetches and sha256-verifies the PyPI sdist,
    and build.sh compiles the wheel with the prefix's own CPython 3.12 —
    no third-party prebuilt binary enters the bundle.

# From-source sdist, sha256 as published by PyPI for this exact version.
source:
  # Built from the source package pytest-asyncio-src, which pins the upstream tarball
  # (https://files.pythonhosted.org/packages/43/7c/d36d04db312ecf4298932ef77e6e4a9e8ad017906e24e34f0b0c361a2473/pytest_asyncio-1.4.0.tar.gz).
  type: package
  package: pytest-asyncio-src

python:
  interpreter: python312
  abi: cp312

patches: []

depends:
  build:
    - name: pytest-asyncio-src
      version: "==1.4.0"
    - name: python312
    - name: pytest-cp312
    - name: typing-extensions-cp312
    # PEP-517 build backend, from this sdist's [build-system] requires.
    # --no-build-isolation means pip will NOT fetch it, so it has to be
    # in the build prefix already (build.sh bridges it onto sys.path).
    - name: setuptools-cp312
    - name: setuptools-scm-cp312
  runtime:
    - name: python312
    - name: pytest-cp312
    - name: typing-extensions-cp312
  host_tools:
    - python312

build:
  build_type_independent: true
  matrix:
    - platform: any
      script: build.sh
    - platform: windows
      script: build.ps1

package:
  files:
    - { glob: "lib/python3.12/site-packages/pytest_asyncio/", platforms: [any] }
    - { glob: "lib/python3.12/site-packages/pytest_asyncio-*.dist-info/", platforms: [any] }
    - { glob: "Lib/site-packages/pytest_asyncio/", platforms: [windows] }
    - { glob: "Lib/site-packages/pytest_asyncio-*.dist-info/", platforms: [windows] }
