schema_version: 1
recipe:
  name: opusfile-src
  upstream_version: "0.12"
  cvc_revision: 1
  maintainer: cvcpkg group
  maintainer_email: info@cvcpkg.org
  maintainer_url: https://cvcpkg.org
  homepage: https://opus-codec.org/
  license: BSD-3-Clause
  tags: [source]
  description: >-
    The unmodified upstream source of opusfile 0.12: its release tarball,
    verified against the sha256 below and staged at src/opusfile-src/.  The opusfile
    recipe builds from it (source.type package), so the tarball is fetched
    once, from downloads.xiph.org, and every other build of opusfile -- another
    platform, a builder that cannot reach downloads.xiph.org, a user building from
    source -- installs this package from the catalog instead.  Generated by
    tools/make_source_package.py.

source:
  type: tarball
  url: https://downloads.xiph.org/releases/opus/opusfile-0.12.tar.gz
  sha256: "118d8601c12dd6a44f52423e68ca9083cc9f2bfe72da7a8c1acb22a80ae3550b"
  strip_components: 1

patches: []

depends:
  build: []
  runtime: []
  host_tools: []

build:
  build_type_independent: true
  matrix:
    - platform: any
      script: build.sh

package:
  files:
    - src/opusfile-src/
