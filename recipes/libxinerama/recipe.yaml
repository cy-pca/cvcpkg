schema_version: 1
recipe:
  name: libxinerama
  upstream_version: "1.1.6"
  cvc_revision: 1
  maintainer: "cvcpkg group"
  maintainer_email: "info@cvcpkg.org"
  maintainer_url: "https://cvcpkg.org"
  homepage: https://www.x.org/
  license: MIT
  tags: [libraries, x11, graphics]
  description: >-
    Xinerama extension client library (Xinerama).

source:
  # Built from the source package libxinerama-src, which pins the upstream tarball
  # (https://xorg.freedesktop.org/releases/individual/lib/libXinerama-1.1.6.tar.xz).
  type: package
  package: libxinerama-src

patches: []

depends:
  build:
    - name: libxinerama-src
      version: "==1.1.6"
    - pkg-config
    - name: xorgproto
  runtime:
    - name: libx11
    - name: libxext
  host_tools: []

package:
  files:
    - lib/
    - include/
    - share/

build:
  matrix:
    - platform: linux
      script: build.sh
    - platform: freebsd
      script: build.sh
    - platform: openbsd
      script: build.sh
    - platform: netbsd
      script: build.sh
