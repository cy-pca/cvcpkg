schema_version: 1
recipe:
  name: google-api-core-cp311
  upstream_version: "2.31.0"
  cvc_revision: 2

  maintainer: "cvcpkg group"
  maintainer_email: "info@cvcpkg.org"
  maintainer_url: "https://cvcpkg.org"
  homepage: https://pypi.org/project/google-api-core/
  license: "Apache-2.0"
  tags: [python, source]
  description: >-
    google-api-core 2.31.0 for CPython 3.11 — the cp311 column of
    cvcpkg's per-interpreter matrix (pure-Python, built from the PyPI sdist);
    generated by tools/gen_python_recipes.py.
    Built FROM SOURCE: cvcpkg fetches and sha256-verifies the PyPI sdist,
    and build.sh compiles the wheel with the prefix's own CPython 3.11 —
    no third-party prebuilt binary enters the bundle.

# From-source sdist, sha256 as published by PyPI for this exact version.
source:
  # Built from the source package google-api-core-src, which pins the upstream tarball
  # (https://files.pythonhosted.org/packages/c6/22/155cadf1d49272a9cf48f3168c0f3874fa13397297e611a5ea00cd093880/google_api_core-2.31.0.tar.gz).
  type: package
  package: google-api-core-src

python:
  interpreter: python311
  abi: cp311

patches: []

depends:
  build:
    - name: google-api-core-src
      version: "==2.31.0"
    - name: python311
    - name: google-auth-cp311
    - name: googleapis-common-protos-cp311
    - name: proto-plus-cp311
    - name: protobuf-cp311
    - name: requests-cp311
    # PEP-517 build backend, from this sdist's [build-system] requires.
    # --no-build-isolation means pip will NOT fetch it, so it has to be
    # in the build prefix already (build.sh bridges it onto sys.path).
    - name: setuptools-cp311
  runtime:
    - name: python311
    - name: google-auth-cp311
    - name: googleapis-common-protos-cp311
    - name: proto-plus-cp311
    - name: protobuf-cp311
    - name: requests-cp311
  host_tools:
    - python311

build:
  build_type_independent: true
  matrix:
    - platform: any
      script: build.sh
    - platform: windows
      script: build.ps1

package:
  files:
    - { glob: "lib/python3.11/site-packages/google/api_core/", platforms: [any] }
    - { glob: "lib/python3.11/site-packages/*.dist-info/", platforms: [any] }
    - { glob: "Lib/site-packages/google/api_core/", platforms: [windows] }
    - { glob: "Lib/site-packages/*.dist-info/", platforms: [windows] }
