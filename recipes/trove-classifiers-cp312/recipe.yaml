schema_version: 1
recipe:
  name: trove-classifiers-cp312
  upstream_version: "2026.6.1-19"
  cvc_revision: 6

  maintainer: "cvcpkg group"
  maintainer_email: "info@cvcpkg.org"
  maintainer_url: "https://cvcpkg.org"
  homepage: https://pypi.org/project/trove-classifiers/
  license: "Apache-2.0"
  tags: [python, source]
  description: >-
    trove-classifiers 2026.6.1.19 for CPython 3.12 — the cp312 column of
    cvcpkg's per-interpreter matrix (pure-Python, built from the PyPI sdist);
    generated by tools/gen_python_recipes.py.
    Built FROM SOURCE: cvcpkg fetches and sha256-verifies the PyPI sdist,
    and build.sh compiles the wheel with the prefix's own CPython 3.12 —
    no third-party prebuilt binary enters the bundle.

# From-source sdist, sha256 as published by PyPI for this exact version.
source:
  # Built from the source package trove-classifiers-src, which pins the upstream tarball
  # (https://files.pythonhosted.org/packages/c2/e3/7ca82ee24c82d344584abd5b8637b3bd056f2900226e8d82fc22f1184b92/trove_classifiers-2026.6.1.19.tar.gz).
  type: package
  package: trove-classifiers-src

python:
  interpreter: python312
  abi: cp312

patches: []

depends:
  build:
    - name: trove-classifiers-src
      version: "==2026.6.1-19"
    - name: python312
    - name: calver-cp312
    # PEP-517 build backend, from this sdist's [build-system] requires.
    # --no-build-isolation means pip will NOT fetch it, so it has to be
    # in the build prefix already (build.sh bridges it onto sys.path).
    - name: setuptools-cp312
  runtime:
    - name: python312
    - name: calver-cp312
  host_tools:
    - python312

provides:
  - trove-classifiers

build:
  build_type_independent: true
  matrix:
    - platform: any
      script: build.sh
    - platform: windows
      script: build.ps1

package:
  files:
    - { glob: "lib/python3.12/site-packages/trove_classifiers/", platforms: [any] }
    - { glob: "lib/python3.12/site-packages/trove_classifiers-*.dist-info/", platforms: [any] }
    - { glob: "bin/trove-classifiers", platforms: [any] }
    - { glob: "Lib/site-packages/trove_classifiers/", platforms: [windows] }
    - { glob: "Lib/site-packages/*.dist-info/", platforms: [windows] }
