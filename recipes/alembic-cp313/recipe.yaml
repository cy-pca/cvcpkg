schema_version: 1
recipe:
  name: alembic-cp313
  upstream_version: "1.20.0"
  cvc_revision: 1

  maintainer: "cvcpkg group"
  maintainer_email: "info@cvcpkg.org"
  maintainer_url: "https://cvcpkg.org"
  homepage: https://pypi.org/project/alembic/
  license: "MIT"
  tags: [python, source]
  description: >-
    alembic 1.20.0 for CPython 3.13 — the cp313 column of
    cvcpkg's per-interpreter matrix (pure-Python, built from the PyPI sdist);
    generated by tools/gen_python_recipes.py.
    Built FROM SOURCE: cvcpkg fetches and sha256-verifies the PyPI sdist,
    and build.sh compiles the wheel with the prefix's own CPython 3.13 —
    no third-party prebuilt binary enters the bundle.

# From-source sdist, sha256 as published by PyPI for this exact version.
source:
  # Built from the source package alembic-src, which pins the upstream tarball
  # (https://files.pythonhosted.org/packages/ed/aa/02910bdb8e2f1444f6654d5b296cd827d126f82209050ee7b1000f92ac4b/alembic-1.20.0.tar.gz).
  type: package
  package: alembic-src

python:
  interpreter: python313
  abi: cp313

patches: []

depends:
  build:
    - name: alembic-src
      version: "==1.20.0"
    - name: python313
    - name: mako-cp313
    - name: sqlalchemy-cp313
    - name: typing-extensions-cp313
    # PEP-517 build backend, from this sdist's [build-system] requires.
    # --no-build-isolation means pip will NOT fetch it, so it has to be
    # in the build prefix already (build.sh bridges it onto sys.path).
    - name: setuptools-cp313
  runtime:
    - name: python313
    - name: mako-cp313
    - name: sqlalchemy-cp313
    - name: typing-extensions-cp313
  host_tools:
    - python313

provides:
  - alembic

build:
  build_type_independent: true
  matrix:
    - platform: any
      script: build.sh
    - platform: windows
      script: build.ps1

package:
  files:
    - { glob: "lib/python3.13/site-packages/alembic/", platforms: [any] }
    - { glob: "lib/python3.13/site-packages/*.dist-info/", platforms: [any] }
    - { glob: "bin/alembic", platforms: [any] }
    - { glob: "Lib/site-packages/alembic/", platforms: [windows] }
    - { glob: "Lib/site-packages/*.dist-info/", platforms: [windows] }
