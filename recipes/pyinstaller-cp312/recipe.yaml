schema_version: 1
recipe:
  name: pyinstaller-cp312
  upstream_version: "6.21.0"
  # Bumped 1 -> 2: declare hatchling's runtime closure (packaging, pathspec,
  # pluggy, trove-classifiers, calver) as build deps. hatchling is the PEP-517
  # backend; --no-build-isolation imports it and its deps, which staging
  # hatchling alone does not provide — the build failed on the dev cluster with
  # "No module named 'pathspec'". Build-env only; the artifact is unchanged.
  # Bumped 2 -> 3: netbsd-ldd-format.patch (see patches:); NetBSD bundles collect their
  # shared libraries.  Other platforms' artifacts are unchanged.
  cvc_revision: 3
  maintainer: "cvcpkg group"
  maintainer_email: "info@cvcpkg.org"
  maintainer_url: "https://cvcpkg.org"
  homepage: https://pyinstaller.org/
  license: "GPL-2.0-or-later WITH Bootloader-exception"
  tags: [python, packaging]
  description: >-
    PyInstaller 6.21.0 for CPython 3.12 (cp312), BUILT FROM SOURCE. The
    PyPI wheels are py3-none-<plat> archives of a PREBUILT bootloader, and
    upstream publishes none for the BSDs; building the sdist compiles the
    bootloader here, so the BSD columns exist at all and every column ships a
    launcher we produced ourselves.

# From-source sdist (NOT source.type python_wheel): cvcpkg fetches +
# sha256-verifies this tarball and extracts it to CVC_SOURCE_DIR, which is what
# lets patches/ below apply to a real source tree.
source:
  type: tarball
  url: https://files.pythonhosted.org/packages/d5/4d/ec706c3fcf39e26888c35b39615ff4d5865d184069666c47492cff1fbe50/pyinstaller-6.21.0.tar.gz
  sha256: "bb9fab705983e393a2d1cac77d6972513057ad800215fd861dc15ff5272e98fd"
  strip_components: 1

python:
  interpreter: python312
  abi: cp312

# Teaches the bootloader build about NetBSD. Upstream's bootloader/wscript has
# no 'netbsd' in DESTOS_TO_SYSTEM, so compiling there dies with
# KeyError: 'netbsd'; it also lacks NetBSD/OpenBSD in SYSTEM_TO_BUILDOS, which
# makes a native build on either look like a cross-compilation.
# Submitted upstream as pyinstaller/pyinstaller#9496 — drop this once a release
# carries the fix.
patches:
  - netbsd-platform-tables.patch
  # NetBSD's ldd prints `-lz.1 => /usr/lib/libz.so.1` with no load address, and
  # PyInstaller's catch-all ldd pattern requires one, so on NetBSD it collected NO
  # shared library a frozen program needs.  The cvcpkg binary then loaded the
  # host's libz instead of the bundled one and died at startup ("/usr/lib/libz.so.1:
  # version ZLIB_1.2.0 required by .../zlib.cpython-312.so not defined", #323's
  # dev build).  Checked on netbsd-build-2: libz/libssl/libcrypto/libffi/libsqlite3
  # are bundled and a frozen script runs under env -i.  Worth upstreaming next to
  # pyinstaller/pyinstaller#9496.
  - netbsd-ldd-format.patch

depends:
  build:
    - name: python312
    # PEP-517 backend, imported by the build interpreter under --no-build-isolation.
    - name: hatchling-cp312
    # hatchling's OWN runtime closure. --no-build-isolation imports hatchling,
    # which imports these — but staging hatchling as a build edge does NOT pull
    # its runtime deps into the build prefix (a package's runtime closure is only
    # assembled for ITS runtime). Without them the build dies with
    # "No module named 'pathspec'" (dev-cluster #70). trove-classifiers -> calver.
    - name: packaging-cp312
    - name: pathspec-cp312
    - name: pluggy-cp312
    - name: trove-classifiers-cp312
    - name: calver-cp312
    # zlib headers: the bootloader links libz (bootloader/wscript probes it).
    - name: zlib
  runtime:
    - name: python312
    - name: altgraph-cp312
    - name: packaging-cp312
    - name: pyinstaller-hooks-contrib-cp312
    - name: setuptools-cp312
    - name: zlib
    # PyInstaller's Windows-only requirements (its pyproject.toml marks them
    # sys_platform == 'win32'): PE analysis and the Win32 resource API.
    - { name: pefile-cp312, platforms: [windows] }
    - { name: pywin32-ctypes-cp312, platforms: [windows] }
  host_tools:
    - python312

provides:
  - pyinstaller

build:
  # The Python ABI is stable across cvcpkg build types; build once.
  build_type_independent: true
  # Every platform compiles its own bootloader from the same sdist. The BSDs are
  # the whole point: upstream ships no wheel for them, so a python_wheel recipe
  # could not express these columns at all.
  matrix:
    - platform: linux
      script: build.sh
    - platform: freebsd
      script: build.sh
    - platform: netbsd
      script: build.sh
    - platform: openbsd
      script: build.sh
    - platform: macos
      script: build.sh
    - platform: windows
      script: build.ps1

package:
  files:
    - { glob: "lib/python3.12/site-packages/PyInstaller/", platforms: [freebsd, linux, macos, netbsd, openbsd] }
    - { glob: "lib/python3.12/site-packages/pyinstaller-*.dist-info/", platforms: [freebsd, linux, macos, netbsd, openbsd] }
    - { glob: "bin/pyinstaller", platforms: [freebsd, linux, macos, netbsd, openbsd] }
    - { glob: "bin/pyi-makespec", platforms: [freebsd, linux, macos, netbsd, openbsd] }
    - { glob: "bin/pyi-archive_viewer", platforms: [freebsd, linux, macos, netbsd, openbsd] }
    - { glob: "bin/pyi-bindepend", platforms: [freebsd, linux, macos, netbsd, openbsd] }
    - { glob: "bin/pyi-grab_version", platforms: [freebsd, linux, macos, netbsd, openbsd] }
    - { glob: "bin/pyi-set_version", platforms: [freebsd, linux, macos, netbsd, openbsd] }
    - { glob: "Lib/site-packages/PyInstaller/", platforms: [windows] }
    - { glob: "Lib/site-packages/pyinstaller-*.dist-info/", platforms: [windows] }
    - { glob: "Scripts/pyinstaller.exe", platforms: [windows] }
