schema_version: 1
recipe:
  name: bison
  upstream_version: "3.8.2"
  # Bumped 2 -> 3: the published macos-x86_64 bundle (cvc.2) was configured on
  # a runner with Homebrew in /usr/local and linked Homebrew's
  # /usr/local/opt/gettext/lib/libtextstyle.0.dylib, so it cannot start once
  # macOS CI moves Homebrew aside.  cvc.3 is the rebuild without it.
  # cvc.4: relocatable.  Earlier bundles baked the builder's temporary prefix in
  # as the skeleton dir and the m4 path, so every consumer had to export
  # BISON_PKGDATADIR and M4 (libpq, mariadb-server, mesa, swig, gstreamer).
  # cvc.5: package.files matches the Windows tree.  Windows stages winflexbison
  # (bin/bison.exe, bin/flex.exe, share/bison/), which has no yacc, liby,
  # aclocal macro or man page, so the strict pack check failed every Windows
  # build (dev #17905).
  cvc_revision: 5
  maintainer: "cvcpkg group"
  maintainer_email: "info@cvcpkg.org"
  maintainer_url: "https://cvcpkg.org"
  homepage: https://www.gnu.org/software/bison/
  license: GPL-3.0-or-later
  tags: [tools, codegen]
  description: >-
    GNU Bison — parser generator required by SWIG and other code generators.
    Build-time host tool only.

source:
  # Built from the source package bison-src, which pins the upstream tarball
  # (https://ftp.gnu.org/gnu/bison/bison-3.8.2.tar.gz).
  type: package
  package: bison-src

patches: []

depends:
  build:
    - name: bison-src
      version: "==3.8.2"
  # bison runs m4 for every grammar; with M4=m4 it is found on PATH.
  runtime:
    - m4
  host_tools:
    - m4

build:
  build_type_independent: true
  matrix:
    - platform: linux
      script: build.sh
      env:
        CFLAGS: "-O2"
    - platform: macos
      script: build.sh
      env:
        MACOSX_DEPLOYMENT_TARGET: "13.0"
    - platform: freebsd
      script: build.sh
      env:
        CFLAGS: "-O2 -fPIC"
    - platform: openbsd
      script: build.sh
      env:
        CFLAGS: "-O2 -fPIC"
    - platform: netbsd
      script: build.sh
      env:
        CFLAGS: "-O2 -fPIC"
    - platform: windows
      script: build.ps1

package:
  files:
    - bin/bison*
    - share/bison/
    # GNU Bison's own install only; winflexbison on Windows ships none of these.
    - { glob: "bin/yacc*",              platforms: [linux, macos, freebsd, openbsd, netbsd] }
    - { glob: "lib/liby*",              platforms: [linux, macos, freebsd, openbsd, netbsd] }
    - { glob: "share/aclocal/bison*",   platforms: [linux, macos, freebsd, openbsd, netbsd] }
    - { glob: "share/man/man1/bison*",  platforms: [linux, macos, freebsd, openbsd, netbsd] }

toolchain:
  cc:
    min_version: "any"
    description: "C99-capable compiler (gcc, clang, or MSVC)"

notes:
  - title: "Windows uses winflexbison pre-built binaries"
    platforms: [windows]
    description: >-
      On Windows the recipe downloads winflexbison pre-built binaries
      instead of building GNU Bison from source, since the autotools
      build system is not available.
