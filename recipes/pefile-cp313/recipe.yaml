schema_version: 1
recipe:
  name: pefile-cp313
  upstream_version: "2024.8.26"
  cvc_revision: 2

  maintainer: "cvcpkg group"
  maintainer_email: "info@cvcpkg.org"
  maintainer_url: "https://cvcpkg.org"
  homepage: https://pypi.org/project/pefile/
  license: "MIT"
  tags: [python, source]
  description: >-
    pefile 2024.8.26 for CPython 3.13 — the cp313 column of
    cvcpkg's per-interpreter matrix (pure-Python, built from the PyPI sdist);
    generated by tools/gen_python_recipes.py.
    Built FROM SOURCE: cvcpkg fetches and sha256-verifies the PyPI sdist,
    and build.sh compiles the wheel with the prefix's own CPython 3.13 —
    no third-party prebuilt binary enters the bundle.

# From-source sdist, sha256 as published by PyPI for this exact version.
source:
  # Built from the source package pefile-src, which pins the upstream tarball
  # (https://files.pythonhosted.org/packages/03/4f/2750f7f6f025a1507cd3b7218691671eecfd0bbebebe8b39aa0fe1d360b8/pefile-2024.8.26.tar.gz).
  type: package
  package: pefile-src

python:
  interpreter: python313
  abi: cp313

patches: []

depends:
  build:
    - name: pefile-src
      version: "==2024.8.26"
    - name: python313
    # PEP-517 build backend, from this sdist's [build-system] requires.
    # --no-build-isolation means pip will NOT fetch it, so it has to be
    # in the build prefix already (build.sh bridges it onto sys.path).
    - name: setuptools-cp313
    - name: wheel-cp313
  runtime:
    - name: python313
  host_tools:
    - python313

build:
  build_type_independent: true
  matrix:
    - platform: any
      script: build.sh
    - platform: windows
      script: build.ps1

package:
  files:
    - { glob: "lib/python3.13/site-packages/pefile.py", platforms: [any] }
    - { glob: "lib/python3.13/site-packages/peutils.py", platforms: [any] }
    - { glob: "lib/python3.13/site-packages/ordlookup/", platforms: [any] }
    - { glob: "lib/python3.13/site-packages/pefile-*.dist-info/", platforms: [any] }
    - { glob: "Lib/site-packages/pefile/", platforms: [windows] }
    - { glob: "Lib/site-packages/*.dist-info/", platforms: [windows] }
