schema_version: 1
recipe:
  name: fonttools-cp313t
  upstream_version: "4.63.0"
  cvc_revision: 3

  maintainer: "cvcpkg group"
  maintainer_email: "info@cvcpkg.org"
  maintainer_url: "https://cvcpkg.org"
  homepage: https://pypi.org/project/fonttools/
  license: "MIT"
  tags: [python, source]
  description: >-
    fonttools 4.63.0 for CPython 3.13t — the cp313t column of
    cvcpkg's per-interpreter matrix (pure-Python, built from the PyPI sdist);
    generated by tools/gen_python_recipes.py.
    Built FROM SOURCE: cvcpkg fetches and sha256-verifies the PyPI sdist,
    and build.sh compiles the wheel with the prefix's own CPython 3.13t —
    no third-party prebuilt binary enters the bundle.
    The cp313t column installs under the free-threaded (no-GIL)
    interpreter and its import check runs with the GIL disabled.

# From-source sdist, sha256 as published by PyPI for this exact version.
source:
  # Built from the source package fonttools-src, which pins the upstream tarball
  # (https://files.pythonhosted.org/packages/84/69/c97f2c18e0db87d2c7b15da1974dace76ae938f1cfa22e2727a648b7ed43/fonttools-4.63.0.tar.gz).
  type: package
  package: fonttools-src

python:
  interpreter: python313t
  abi: cp313t

patches: []

depends:
  build:
    - name: fonttools-src
      version: "==4.63.0"
    - name: python313t
    # PEP-517 build backend, from this sdist's [build-system] requires.
    # --no-build-isolation means pip will NOT fetch it, so it has to be
    # in the build prefix already (build.sh bridges it onto sys.path).
    - name: setuptools-cp313t
    - name: wheel-cp313t
  runtime:
    - name: python313t
  host_tools:
    - python313t

build:
  build_type_independent: true
  matrix:
    - platform: any
      script: build.sh
      env:
        FONTTOOLS_WITH_CYTHON: "0"
    - platform: windows
      script: build.ps1
      env:
        FONTTOOLS_WITH_CYTHON: "0"

package:
  files:
    - { glob: "lib/python3.13t/site-packages/fontTools/", platforms: [any] }
    - { glob: "lib/python3.13t/site-packages/fonttools-*.dist-info/", platforms: [any] }
    - { glob: "Lib/site-packages/fontTools/", platforms: [windows] }
    - { glob: "Lib/site-packages/fonttools-*.dist-info/", platforms: [windows] }
